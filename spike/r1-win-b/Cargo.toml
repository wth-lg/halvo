[package]
name = "r1-win-b-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway probes of spikes S5 to S9 (run 20261108-halvo-r1-capture); scratch branches only, never merged"

# Its own workspace, so the repository's workspace does not take it as a member.
[workspace]

[[bin]]
name = "r1probe"
path = "src/main.rs"

[[bin]]
name = "r1starter"
path = "src/starter.rs"

[dependencies]
winreg = "0.56"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
debug = false
