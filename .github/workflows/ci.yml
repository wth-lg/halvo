name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 50-windows-functional
      - name: adv2 probes of win-3e
        if: ${{ !cancelled() }}
        shell: bash
        env:
          HALVO_WF_FORM: short
        run: |
          set +e
          stall=crates/halvo-capture/tests/stall/mod.rs
          kinds=crates/halvo-capture/tests/stall/kinds.rs
          build() {
            cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/adv2-build.json" 2>"$RUNNER_TEMP/adv2-build.err"
            built=$?
            errors=$(grep -c '^error' "$RUNNER_TEMP/adv2-build.err")
            sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/adv2-build.json" >"$RUNNER_TEMP/adv2-exe"
            exe=$(sed 's/\\\\/\//g' "$RUNNER_TEMP/adv2-exe")
          }
          run_probe() {
            test=$1
            code=none
            if [ -f "$exe" ]; then
              timeout 360 "$exe" --ignored --exact --nocapture "$test" </dev/null >"$RUNNER_TEMP/adv2.raw" 2>&1
              code=$?
            else
              : >"$RUNNER_TEMP/adv2.raw"
            fi
            tr -d '\r' <"$RUNNER_TEMP/adv2.raw" >"$RUNNER_TEMP/adv2.log"
            ok=$(grep -c '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/adv2.log")
            ran=$(grep -c '^running 1 test$' "$RUNNER_TEMP/adv2.log")
            panics=$(grep -c ' panicked at ' "$RUNNER_TEMP/adv2.log")
            grep -E '(^| )adv2 |(^| )session=[0-9]+ step=[0-9]+ control=|(^| )control=(before|mid|after) fg=|(^| )phase=[a-z_0-9]+ session=[0-9]+ step=[0-9]+ passed=|(^| )phase=plain_letter round=' "$RUNNER_TEMP/adv2.log" | sed -E 's/^.*(TF )/\1/' | cut -c1-700
            grep -E '^(adv2:|[0-9]+ of the [0-9]+ phases failed)' "$RUNNER_TEMP/adv2.log" | cut -c1-400
            printf 'adv2 run test=%s exit=%s running_1_test=%s passed_lines=%s panics=%s\n' "$test" "$code" "$ran" "$ok" "$panics"
          }
          cat >>"$stall" <<'ADV2_RS'

          // Adversary 2 of win-3e: probes appended on the hosted runner alone, after
          // check 50 has read the unchanged tree. Each prints counts and booleans.

          fn adv2_mid_controls(test: &'static str, phases: Vec<Phase>) {
              with_deadline(test, Duration::from_secs(300), move || {
                  let mut session = Session::open(test);
                  let last = phases.len();
                  let mut runs = Vec::new();
                  let mut short = 0u32;
                  for (index, phase) in phases.into_iter().enumerate() {
                      runs.push(session.rounds(phase));
                      if index + 1 < last {
                          let mid = control(test, "mid", &mut session.fixture, &session.events);
                          say(
                              test,
                              format!("adv2 mid after_step={} recorded={mid}", index + 1),
                          );
                          short += u32::from(mid != CONTROL_LETTERS);
                      }
                  }
                  let controls = session.close();
                  let failures = verdicts(&runs, &controls);
                  say(
                      test,
                      format!(
                          "adv2 mid_summary phases={} mid_controls={} mid_controls_short={short} failures={}",
                          runs.len(),
                          last.saturating_sub(1),
                          failures.len()
                      ),
                  );
                  assert!(
                      failures.is_empty() && short == 0,
                      "adv2: mid_controls_short={short} failures={}",
                      failures.len()
                  );
              });
          }

          #[test]
          #[ignore = "adversary 2 probe"]
          fn adv2_mid_controls_tab_sleeps() {
              adv2_mid_controls(Kind::TabSleeps.test(), Kind::TabSleeps.phases());
          }

          #[test]
          #[ignore = "adversary 2 probe"]
          fn adv2_mid_controls_tab_serves() {
              adv2_mid_controls(Kind::TabServes.test(), Kind::TabServes.phases());
          }

          #[test]
          #[ignore = "adversary 2 probe"]
          fn adv2_mid_controls_click_sleeps() {
              adv2_mid_controls(Kind::ClickSleeps.test(), Kind::ClickSleeps.phases());
          }

          #[test]
          #[ignore = "adversary 2 probe"]
          fn adv2_mid_controls_click_serves() {
              adv2_mid_controls(Kind::ClickServes.test(), Kind::ClickServes.phases());
          }

          #[test]
          #[ignore = "adversary 2 probe"]
          fn adv2_mid_controls_second_field_other_front() {
              adv2_mid_controls(
                  Kind::SecondFieldAndOtherFront.test(),
                  Kind::SecondFieldAndOtherFront.phases(),
              );
          }

          #[test]
          #[ignore = "adversary 2 probe"]
          fn adv2_mid_controls_enter_tab_out_two_step() {
              adv2_mid_controls(
                  Kind::EnterTabOutAndTwoStep.test(),
                  Kind::EnterTabOutAndTwoStep.phases(),
              );
          }

          #[test]
          #[ignore = "adversary 2 probe"]
          fn adv2_mid_controls_native() {
              let test = "stall-mask-stale-focus";
              with_deadline(test, Duration::from_secs(150), move || {
                  let mut session = Session::open(test);
                  let first = session.native(NATIVE_PHASES[0], (FixtureField::Plain, "plain"), masked);
                  let mid = control(test, "mid", &mut session.fixture, &session.events);
                  say(test, format!("adv2 mid after_step=1 recorded={mid}"));
                  let second = session.native(
                      NATIVE_PHASES[1],
                      (FixtureField::Password, "password"),
                      notified_and_unseen,
                  );
                  let runs = [first, second];
                  let controls = session.close();
                  let failures = verdicts(&runs, &controls);
                  say(
                      test,
                      format!(
                          "adv2 mid_summary phases=2 mid_controls=1 mid_controls_short={} failures={}",
                          u32::from(mid != CONTROL_LETTERS),
                          failures.len()
                      ),
                  );
                  assert!(
                      failures.is_empty() && mid == CONTROL_LETTERS,
                      "adv2: mid={mid} failures={}",
                      failures.len()
                  );
              });
          }

          #[test]
          #[ignore = "adversary 2 probe"]
          fn adv2_a_phase_whose_letter_is_recorded_fails_its_verdict() {
              let test = "stall-adv2-recorded";
              with_deadline(test, Duration::from_secs(120), move || {
                  let mut session = Session::open(test);
                  let probe = Phase {
                      landing: Landing::Plain,
                      letters_through_the_wait: false,
                      ..phase(test, "plain_letter", Lead::Nothing, Wait::Sleeps, 0)
                  };
                  let runs = [session.rounds(probe)];
                  let controls = session.close();
                  let failures = verdicts(&runs, &controls);
                  let (counted, recorded) = match runs[0].outcome {
                      Outcome::Rounds { totals, .. } => (totals.counted, totals.letters_recorded),
                      Outcome::Native { .. } => (0, 0),
                  };
                  say(
                      test,
                      format!(
                          "adv2 recorded_phase counted_rounds_in_the_totals={counted} letters_recorded_in_the_totals={recorded} verdict_failed={}",
                          failures.len()
                      ),
                  );
                  assert_eq!(
                      failures.len(),
                      1,
                      "adv2: a phase whose letter was recorded passed its verdict"
                  );
              });
          }
          ADV2_RS
          build
          printf 'adv2 probes build_exit=%s build_error_lines=%s\n' "$built" "$errors"
          if [ ! -f "$exe" ]; then
            printf 'adv2 probes no_test_executable=1\n'
            grep -E '^(error|warning)' "$RUNNER_TEMP/adv2-build.err" | head -20
          fi
          run_probe stall::adv2_a_phase_whose_letter_is_recorded_fails_its_verdict
          run_probe stall::adv2_mid_controls_tab_sleeps
          run_probe stall::adv2_mid_controls_tab_serves
          run_probe stall::adv2_mid_controls_click_sleeps
          run_probe stall::adv2_mid_controls_click_serves
          run_probe stall::adv2_mid_controls_second_field_other_front
          run_probe stall::adv2_mid_controls_enter_tab_out_two_step
          run_probe stall::adv2_mid_controls_native
          exit 0
      - name: adv2 live one-rule changes of win-3e
        if: ${{ !cancelled() }}
        shell: bash
        env:
          HALVO_WF_FORM: short
        run: |
          set +e
          stall=crates/halvo-capture/tests/stall/mod.rs
          kinds=crates/halvo-capture/tests/stall/kinds.rs
          build() {
            cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/adv2-build.json" 2>"$RUNNER_TEMP/adv2-build.err"
            built=$?
            errors=$(grep -c '^error' "$RUNNER_TEMP/adv2-build.err")
            sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/adv2-build.json" >"$RUNNER_TEMP/adv2-exe"
            exe=$(sed 's/\\\\/\//g' "$RUNNER_TEMP/adv2-exe")
          }
          run_probe() {
            test=$1
            code=none
            if [ -f "$exe" ]; then
              timeout 360 "$exe" --ignored --exact --nocapture "$test" </dev/null >"$RUNNER_TEMP/adv2.raw" 2>&1
              code=$?
            else
              : >"$RUNNER_TEMP/adv2.raw"
            fi
            tr -d '\r' <"$RUNNER_TEMP/adv2.raw" >"$RUNNER_TEMP/adv2.log"
            ok=$(grep -c '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/adv2.log")
            ran=$(grep -c '^running 1 test$' "$RUNNER_TEMP/adv2.log")
            panics=$(grep -c ' panicked at ' "$RUNNER_TEMP/adv2.log")
            grep -E '(^| )adv2 |(^| )session=[0-9]+ step=[0-9]+ control=|(^| )control=(before|mid|after) fg=|(^| )phase=[a-z_0-9]+ session=[0-9]+ step=[0-9]+ passed=|(^| )phase=plain_letter round=' "$RUNNER_TEMP/adv2.log" | sed -E 's/^.*(TF )/\1/' | cut -c1-700
            grep -E '^(adv2:|[0-9]+ of the [0-9]+ phases failed)' "$RUNNER_TEMP/adv2.log" | cut -c1-400
            printf 'adv2 run test=%s exit=%s running_1_test=%s passed_lines=%s panics=%s\n' "$test" "$code" "$ran" "$ok" "$panics"
          }
          cat >"$RUNNER_TEMP/adv2-apply.pl" <<'ADV2_PL'
          use strict;
          use warnings;
          my ($file) = @ARGV;
          open(my $in, '<', $file) or exit 4;
          binmode $in;
          local $/;
          my $text = <$in>;
          close $in;
          my $old = $ENV{ADV2_OLD};
          my $new = $ENV{ADV2_NEW};
          my $count = () = $text =~ /^\Q$old\E(?=\r?\n)/mg;
          exit 3 if $count != 1;
          $text =~ s/^\Q$old\E(?=\r?\n)/$new/m;
          open(my $out, '>', $file) or exit 5;
          binmode $out;
          print $out $text;
          close $out;
          exit 0;
          ADV2_PL
          appended=$(grep -c 'adversary 2 probe' "$stall")
          printf 'adv2 changes probe_tests_in_the_file=%s\n' "$appended"
          change() {
            name=$1
            perl "$RUNNER_TEMP/adv2-apply.pl" "$kinds"
            applied=$?
            printf 'adv2 change %s apply_exit=%s\n' "$name" "$applied"
            if [ "$applied" -eq 0 ]; then
              build
              printf 'adv2 change %s build_exit=%s build_error_lines=%s\n' "$name" "$built" "$errors"
              run_probe stall::adv2_a_phase_whose_letter_is_recorded_fails_its_verdict
              run_probe stall::tab_then_letters_while_the_program_sleeps_at_each_wait
            fi
            git checkout -- "$kinds"
          }
          ADV2_OLD='        checks: Checks::Stall,' ADV2_NEW='        checks: Checks::ControlsAndSink,' \
            change L5-phase-default-checks-sink-only
          ADV2_OLD='        self.letters_recorded += other.letters_recorded;' ADV2_NEW='' \
            change L6-add-drops-letters-recorded
          git checkout -- "$stall" "$kinds"
          printf 'adv2 changes status_lines_after=%s\n' "$(git status --porcelain --untracked-files=no | grep -c '')"
          exit 0
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
