name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: U4.6 round 2, the two tests of L4 looped at 435d1d41 (expected to fail there)

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: U4.6 L4 loop at 435d1d41
        shell: bash
        run: |
          set +e
          export CARGO_BUILD_JOBS=4
          cargo test -p halvo-agent-client --locked --no-run --message-format=json > "$RUNNER_TEMP/u46-build.json" 2> "$RUNNER_TEMP/u46-build.err"
          echo "u46 build exit=$?"
          bin=$(node -e 'const fs=require("fs");for(const l of fs.readFileSync(process.argv[1],"utf8").split("\n")){if(!l.startsWith("{"))continue;const m=JSON.parse(l);if(m.reason==="compiler-artifact"&&m.executable&&m.target&&m.target.name==="start"&&m.profile&&m.profile.test){console.log(m.executable.replace(/\\/g,"/"));break}}' "$RUNNER_TEMP/u46-build.json")
          echo "u46 executable found=$([ -n "$bin" ] && echo yes || echo no)"
          one() {
            label=$1; name=$2; n=$3
            pass=0; fail=0; start=$(date +%s)
            for _ in $(seq 1 "$n"); do
              out=$("$bin" --exact --test-threads 1 "$name" 2>&1)
              if printf '%s\n' "$out" | grep -q "^test result: ok\. 1 passed; 0 failed"; then
                pass=$((pass + 1))
              else
                fail=$((fail + 1))
                printf '%s\n' "$out" | grep -E "left:|right:|panicked" | head -3
              fi
            done
            end=$(date +%s)
            echo "u46 loop $label runs=$n passed=$pass failed=$fail seconds=$((end - start))"
          }
          one status-2 a_start_whose_runner_exits_with_the_status_2_answers_not_started_with_that_exit 200
          one brief-child a_runner_that_exits_with_2_and_leaves_a_child_that_ends_by_itself_records_what_its_system_ended 200
          if [ "$fail" -eq 0 ]; then echo "u46 the expected failures of brief-child at 435d1d41 are missing"; exit 1; fi
          "$bin" --exact --nocapture a_runner_that_exits_with_2_and_leaves_a_child_that_ends_by_itself_records_what_its_system_ended 2>&1 | grep -E "u46 refused" | head -2
          exit 0
