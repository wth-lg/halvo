name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: U4.5 Windows record of the dialog's messages before the change (RD-112 (b))
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          for i in 1 2 3; do
            GUARD_HOSTED_PROBE=1 cargo test -p halvo-coord-app --locked --test guard_hosted > "$RUNNER_TEMP/u45-probe-$i.txt" 2>&1
            echo "u45 probe run $i exit=$?"
            tr -d '\r' < "$RUNNER_TEMP/u45-probe-$i.txt" | grep -E '^guard_hosted (probe|report|end|case|messages)' | head -1500
          done
