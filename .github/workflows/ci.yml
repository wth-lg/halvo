name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the macos job's proof (the windows job runs 10-format alone)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format
      - name: Scratch rows run 3 of sqlcipher-2, 68 rows, each to its end by name
        if: always()
        shell: bash
        run: |
          start=$(date +%s); last=$start; seen=" "; n=0
          sh scripts/r1-gate/mutation-test.sh --only page-size-gate-left-out-of-the-open --only auto-vacuum-read-back-of-the-create-wants-1 --only page-size-read-back-of-the-create-wants-8192 --only checkpoint-failure-after-a-shred-not-kept --only open-refusals-read-after-the-drain --only held-look-before-the-drain-left-out --only auto-vacuum-read-back-left-out-of-the-create --only page-size-read-back-left-out-of-the-create --only custody-wrap-under-constant-key --only custody-root-is-all-zero --only store-key-not-wiped --only constant-wrap-nonce --only wrap-nonce-from-a-counter --only wrap-nonce-of-one-random-byte --only formal-custody-wrap-under-constant-key --only formal-custody-root-is-all-zero --only wrap-nonce-from-a-hashed-counter-per-process --only wrap-nonce-from-a-fixed-seed --only root-file-made-of-the-root-id --only tail-sweeps-nothing-when-nothing-is-named --only any-entry-at-the-root-name-reads-as-the-root-file --only any-entry-of-the-root-id-is-the-witness --only an-absent-root-name-counts-as-removed --only root-published-by-rename --only associated-data-holds-the-path-of-the-executable --only root-partial-name-shared-by-every-writer --only tail-opens-the-roots-by-the-path --only root-step-ignores-the-root-files-identity --only root-step-lists-once-for-a-moved-root --only tail-without-the-lock-destroys-another-identity-at-the-marks-name --only cleanup-by-a-made-mark-destroys-by-id --only step-without-its-witness-names-nothing --only cleanup-drops-the-fate-of-a-partial-name --only entry-at-the-roots-name-written-when-the-identity-is-known --only cleanup-by-identity-answers-ok-on-an-unlistable-directory --only mode-set-before-the-identity-is-compared --only root-write-scrubs-a-partial-name-it-did-not-make --only sweep-at-other-names-taken-out --only second-name-at-another-name-written-through --only directory-in-the-roots-folder-not-counted --only mode-before-the-by-name-read-at-a-plain-name --only mode-before-the-name-decides-on-the-path-by-identity --only identity-step-writes-at-a-plain-name --only by-name-read-taken-out --only unwritten-removal-reads-destroyed --only root-zero-fill-flush-taken-out --only roots-folder-flush-taken-out --only roots-folder-flush-answer-dropped --only failed-folder-flush-still-reads-destroyed --only failed-folder-flush-still-reads-listed --only cleanup-folder-flush-answer-dropped --only mode-before-the-by-name-read-at-a-root-name --only by-name-read-at-a-plain-name-alone --only kept-handle-test-taken-out-at-a-plain-name --only kept-handle-count-ignored-on-the-path-by-identity --only mark-writes-at-a-partial-name-of-another-id --only mark-partial-rule-negated --only mark-partial-rule-on-the-stores-path --only mark-partial-of-another-id-written-through --only mark-partial-of-another-id-takes-the-other-root-rule --only mark-partial-of-another-id-takes-the-plain-name-rule --only zero-fill-failure-reads-gone-by-name --only zero-fill-failure-reads-gone-by-identity --only cleanup-folder-flush-not-made --only scrub-zero-fill-flush-taken-out --only kept-handle-identity-not-compared --only kept-handle-count-and-length-not-read-again --only mark-partial-rule-without-the-id-test 2>&1 | while IFS= read -r line; do
            printf '%s\n' "$line"
            case $line in
              "PASS mutation:"*|"FAIL mutation:"*)
                name=${line#* mutation:}; name=${name%% *}
                case "$seen" in
                  *" $name "*) ;;
                  *)
                    now=$(date +%s); n=$((n + 1))
                    echo "scratch-row-seconds $name $((now - last)) row=$n of 68 since_start=$((now - start))"
                    last=$now; seen="$seen$name "
                    ;;
                esac
                ;;
            esac
          done
      - name: Lockfile unchanged
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" macos
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" windows
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
