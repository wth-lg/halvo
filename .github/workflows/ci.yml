name: ci
# scratch of verifier-128 for its reread of store-3 at eeb6a4c7 (ruling ST-46 K8): its changed copies on the
# hosted macos job alone; never merged

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Start time and the commit
        shell: bash
        run: |
          date +%s > "$RUNNER_TEMP/v128-start"
          echo "checked out: $(git rev-parse HEAD)"
          echo "its parent: $(git rev-parse HEAD^)"
          git diff --stat HEAD^ HEAD
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Changed copies of verifier-128, the reread
        if: always()
        shell: bash
        run: |
          set +e
          python3 scripts/v128/reread_copies.py . "$RUNNER_TEMP/v128-start"
          echo "copies exit=$?"
