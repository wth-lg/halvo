name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 50-windows-functional
      - name: "win-2: proof files and a second checkout"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          files="$RUNNER_TEMP/w2"
          mkdir -p "$files"
          cat >"$files/w2-mutants.sh" <<'W2_MUTANTS_EOF'
          #!/bin/bash
          # The one-rule changes of win-2, one after another in one checkout of the head
          # with one target directory: apply, build and run the named test, restore with
          # git checkout. A change is caught when its test fails or it does not build.
          set -u
          w=$1
          files=$2
          list=$3
          cd "$w" || exit 2
          head=$(git rev-parse HEAD)
          tab=$(printf '\t')
          caught=0
          survived=0
          nobuild=0
          unapplied=0
          n=0
          while IFS="$tab" read -r name file subst kind test; do
            [ -n "$name" ] || continue
            n=$((n + 1))
            git checkout --quiet -- "$file"
            if ! SUBST="$subst" perl -0777 -i -pe '$c = eval "\$_ =~ $ENV{SUBST}"; die "no match\n" unless $c;' "$file" 2>"$files/m-apply.err"; then
              unapplied=$((unapplied + 1))
              printf 'W2 mutant name=%s result=not-applied\n' "$name"
              git checkout --quiet -- "$file"
              continue
            fi
            log=$files/mutant-$n.log
            began=$(date +%s)
            if [ "$kind" = tf ]; then
              timeout 900 cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact "$test" --nocapture >"$log" 2>&1
            else
              timeout 900 cargo test --locked -p halvo-capture --lib -- --exact "$test" >"$log" 2>&1
            fi
            code=$?
            ended=$(date +%s)
            ran=$(tr -d '\r' <"$log" | grep -a -c '^test .* \.\.\. ')
            if grep -a -q 'could not compile\|^error\[E' "$log"; then
              result=no-build
              nobuild=$((nobuild + 1))
            elif [ "$code" -eq 124 ]; then
              result=caught-time-limit
              caught=$((caught + 1))
            elif [ "$ran" -ne 1 ]; then
              result=not-one-test-ran
              survived=$((survived + 1))
            elif [ "$code" -ne 0 ] && grep -a -q "^test .* \.\.\. FAILED" "$log"; then
              result=caught
              caught=$((caught + 1))
            else
              result=survived
              survived=$((survived + 1))
            fi
            printf 'W2 mutant name=%s kind=%s test=%s exit=%s tests_ran=%s result=%s seconds=%s\n' "$name" "$kind" "$test" "$code" "$ran" "$result" "$((ended - began))"
            tr -d '\r' <"$log" | grep -a -E '^test .* \.\.\. |panicked at|^error(\[|:)|^TF ' | head -6 | sed 's/^/W2   /'
            git checkout --quiet -- "$file"
          done <"$list"
          git diff --quiet "$head" || echo "W2 mutants the checkout differs from the head after the run"
          printf 'W2 mutants summary changes=%s caught=%s no_build=%s survived=%s not_applied=%s\n' "$n" "$caught" "$nobuild" "$survived" "$unapplied"
          W2_MUTANTS_EOF
          cat >"$files/w2-proofs.sh" <<'W2_PROOFS_EOF'
          #!/bin/bash
          # The proofs of the second round of win-2: the review round tests at the commit
          # that adds them and at the commit of their fix, and the regular functional
          # tests of RR-windows-11 against the library before its fix.
          set -u
          w=$1
          files=$2
          cd "$w" || exit 2
          run() {
            part=$1 at=$2 commit=$3 kind=$4 tf_from=$5
            shift 5
            git checkout --quiet --force --detach "$commit" || { echo "W2 proof part=$part at=$at commit=$commit result=checkout-failed"; return; }
            if [ "$tf_from" != - ]; then
              git checkout --quiet "$tf_from" -- crates/halvo-capture/tests/windows_functional.rs || { echo "W2 proof part=$part at=$at result=tf-checkout-failed"; return; }
            fi
            log=$files/proof2-$part-$at-$kind.log
            if [ "$kind" = tf ]; then
              timeout 900 cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact "$@" --nocapture >"$log" 2>&1
            else
              timeout 900 cargo test --locked -p halvo-capture --lib -- --exact "$@" >"$log" 2>&1
            fi
            code=$?
            ok=$(tr -d '\r' <"$log" | grep -a -c '^test .* \.\.\. ok$')
            failed=$(tr -d '\r' <"$log" | grep -a -c '^test .* \.\.\. FAILED$')
            echo "W2 proof part=$part at=$at commit=$commit tf_from=$tf_from kind=$kind exit=$code ok=$ok failed=$failed"
            tr -d '\r' <"$log" | grep -a -E '^test .* \.\.\. |^test result:|panicked at|^KNOWN-DEFECT|^TF |^error(\[|:)' | head -40 | sed 's/^/W2   /'
            git checkout --quiet --force -- .
          }
          run review before 2e2552a7bb2bb7d2a2a0de750b7947f3251880e0 lib - windows::tests::a_stop_that_timed_out_keeps_the_pump_known_until_it_ends windows::tests::a_motion_sample_made_before_a_button_reaches_the_sink_before_it windows::tests::packets_that_a_stopped_run_still_held_count_after_a_restart windows::screen::tests::a_stop_that_does_not_end_in_time_keeps_the_session_busy_and_failed windows::screen::tests::a_stop_reports_a_session_that_had_ended_before_or_did_not_end_well windows::screen::tests::a_closed_capture_item_reads_as_failed_health
          run review after fd6eb2b83222ad4010ede01d127f4ac0bf1aa074 lib - windows::tests::a_stop_that_timed_out_keeps_the_pump_known_until_it_ends windows::tests::a_motion_sample_made_before_a_button_reaches_the_sink_before_it windows::tests::packets_that_a_stopped_run_still_held_count_after_a_restart windows::screen::tests::a_stop_that_does_not_end_in_time_keeps_the_session_busy_and_failed windows::screen::tests::a_stop_reports_a_session_that_had_ended_before_or_did_not_end_well windows::screen::tests::a_closed_capture_item_reads_as_failed_health
          run RR-windows-11 before-with-the-fixed-test 8d8b828bf209f9e417865707909451712fbd68b3 tf 52c181b010f5c49b079cb11062a61739c6cd8f68 stop_with_a_full_sink
          run RR-windows-11 after 52c181b010f5c49b079cb11062a61739c6cd8f68 tf - stop_with_a_full_sink
          run RR-windows-11 before-with-the-fixed-test 8d8b828bf209f9e417865707909451712fbd68b3 tf 52c181b010f5c49b079cb11062a61739c6cd8f68 a_dropped_keyboard_source_stops_capturing
          run RR-windows-11 after 52c181b010f5c49b079cb11062a61739c6cd8f68 tf - a_dropped_keyboard_source_stops_capturing
          git checkout --quiet --force --detach "$W2_HEAD"
          echo "W2 proofs done"
          W2_PROOFS_EOF
          printf '%s' '' | base64 -d >"$files/mutants.tsv"
          git fetch --quiet --deepen=60 origin "$GITHUB_REF"
          git cat-file -e 8d8b828bf209f9e417865707909451712fbd68b3^{commit}
          git worktree add --quiet --detach "$files/wt" "$GITHUB_SHA"
          git -C "$files/wt" log --oneline -1
          echo "W2 files mutants=$(grep -c . "$files/mutants.tsv") proof_runs=$(grep -c '^run ' "$files/w2-proofs.sh")"
      - name: "win-2: one-rule changes"
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 80
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: bash "$RUNNER_TEMP/w2/w2-mutants.sh" "$RUNNER_TEMP/w2/wt" "$RUNNER_TEMP/w2" "$RUNNER_TEMP/w2/mutants.tsv"
      - name: "win-2: part proofs before and after each fix"
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: W2_HEAD="$GITHUB_SHA" bash "$RUNNER_TEMP/w2/w2-proofs.sh" "$RUNNER_TEMP/w2/wt" "$RUNNER_TEMP/w2"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
