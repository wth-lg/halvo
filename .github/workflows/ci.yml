name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  loop-1:
    runs-on: windows-2025
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: win-3 W3-7 round A, loop share 1 (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/loop.log"
          cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/build.json" 2>"$log"
          echo "LOOP share=1 build exit=$?"
          exe=$(tr -d '\r' <"$RUNNER_TEMP/build.json" | sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          for t in stall::tab_then_letters_while_the_program_sleeps_150_ms stall::tab_then_letters_while_the_program_sleeps_200_ms stall::tab_then_letters_while_the_program_sleeps_300_ms; do
            passed=0
            for run in $(seq 1 20); do
              timeout 360 "$exe" --ignored --exact "$t" --nocapture --test-threads=1 >"$log" 2>&1
              code=$?
              if [ "$code" -eq 0 ] && tr -d '\r' <"$log" | grep -q '^test result: ok. 1 passed; 0 failed'; then passed=$((passed + 1)); fi
              echo "LOOP test=$t run=$run exit=$code"
              tr -d '\r' <"$log" | grep -E 'TF [a-z0-9-]+ summary |TF fixture-native phase=|TF x1 |panicked at|^  left|^ right' | head -n 12
            done
            echo "LOOP test=$t runs=20 passed=$passed"
          done
          echo "LOOP share=1 end"
          exit 0
