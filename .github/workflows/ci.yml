name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos --self-test 10-egress
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 10-egress
      - name: Reader 13 open probe
        if: always()
        shell: bash
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set +e
          cat >"$RUNNER_TEMP/reader13a.sh" <<'READER13A'
          # a1-mac-step.sh: the reader's step in the macos job of the scratch run for Addition 1. It runs after
          # the driver. One run of the check at the head around the probe open, with a listener of this step on
          # 127.0.0.1:47202 that counts what arrives, and the facts of the push event that 10-egress.sh reads.
          # Every line that matters starts with "v13 ".
          set +e
          set -u
          cd "$GITHUB_WORKSPACE" || exit 0
          out=$RUNNER_TEMP/v13a
          mkdir -p "$out"
          : >"$out/recorded"
          p() {
            printf 'v13 %s\n' "$*"
          }
          p "system $(sw_vers -productVersion) head $(git rev-parse HEAD) stamp $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 -I - "$out/recorded" <<'PY' &
          import socket, sys, threading
          s = socket.socket()
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("127.0.0.1", 47202))
          s.listen(16)
          def one(c):
              c.settimeout(3)
              data = b""
              try:
                  data = c.recv(2048)
              except Exception:
                  pass
              c.close()
              with open(sys.argv[1], "a") as f:
                  f.write(data.split(b"\r\n", 1)[0].decode("latin-1") + "\n")
          while True:
              c, _ = s.accept()
              threading.Thread(target=one, args=(c,), daemon=True).start()
          PY
          recorder=$!
          sleep 1
          sh scripts/egress/check.sh scripts/egress/lists/empty.txt -- sh scripts/egress/probe.sh open >"$out/open.out" 2>"$out/open.err"
          code=$?
          last=$(tail -n 1 "$out/open.err")
          p "probe open under the check: exit=$code | $last"
          case $last in
            "egress mode="*)
              log=${last##* log=}
              sed -e 's/^denied at=[0-9]* //' -e 's/ pid=[0-9]*//' "$log" | sort | uniq -c | sed 's/^/v13 open log: /'
              ;;
          esac
          sleep 8
          p "requests at the listener on 47202 after 8 s: $(grep -c '' "$out/recorded")"
          kill "$recorder" 2>/dev/null
          p "event name=${GITHUB_EVENT_NAME:-} lines with created true=$(grep -c -E '"created": *true' "$GITHUB_EVENT_PATH") lines with added, removed or modified and a bracket=$(grep -c -E '"(added|removed|modified)": *\[' "$GITHUB_EVENT_PATH") lines with one of the three keys=$(grep -c -E '"(added|removed|modified)"' "$GITHUB_EVENT_PATH")"
          p "done"
          exit 0
          READER13A
          bash "$RUNNER_TEMP/reader13a.sh"
          exit 0
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows --self-test 10-egress
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 10-egress
      - name: Reader 13 event facts and the skip form
        if: always()
        shell: bash
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set +e
          cat >"$RUNNER_TEMP/reader13a.sh" <<'READER13A'
          # a1-win-step.sh: the reader's step in the windows job of the scratch run for Addition 1. It runs
          # after the driver. It prints the facts of the real push event that 10-egress.sh reads to decide
          # whether the long cases run, what the script's rule gives for that event and for the same event
          # with "created" set to false (a later push to the branch), and then runs the driver's 10-egress
          # once more with a hand-made push event that changes docs/r2/README.md alone, with its seconds.
          # Every line that matters starts with "v13 ".
          set +e
          set -u
          cd "$GITHUB_WORKSPACE" || exit 0
          out=$RUNNER_TEMP/v13a
          mkdir -p "$out"
          p() {
            printf 'v13 %s\n' "$*"
          }
          decision() {
            if grep -Eq '"(created|forced)": *true' "$1"; then
              printf '%s\n' 'run (the push creates or rewrites its branch)'
            elif ! grep -Eq '"(added|removed|modified)": *\[' "$1"; then
              printf '%s\n' 'run (the push lists no changed files)'
            elif grep -Eq '"scripts/egress/[^"]*"|"scripts/r2/ci\.d/10-egress\.sh"' "$1"; then
              printf '%s\n' 'run (the push changes a file of the check)'
            else
              printf '%s\n' skip
            fi
          }
          p "head $(git rev-parse HEAD) stamp $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          p "event name=${GITHUB_EVENT_NAME:-} lines=$(grep -c '' "$GITHUB_EVENT_PATH") lines with created true=$(grep -c -E '"created": *true' "$GITHUB_EVENT_PATH") lines with added, removed or modified and a bracket=$(grep -c -E '"(added|removed|modified)": *\[' "$GITHUB_EVENT_PATH") lines with one of the three keys=$(grep -c -E '"(added|removed|modified)"' "$GITHUB_EVENT_PATH")"
          python - "$GITHUB_EVENT_PATH" <<'PY'
          import json, sys
          e = json.load(open(sys.argv[1], encoding="utf-8"))
          c = e.get("commits") or []
          print("v13 event commits=%d keys of the first commit=%s" % (len(c), ",".join(sorted(c[0].keys())) if c else "-"))
          print("v13 event keys of head_commit=%s" % ",".join(sorted((e.get("head_commit") or {}).keys())))
          PY
          p "the script's rule on the real event: $(decision "$GITHUB_EVENT_PATH")"
          sed -E 's/"(created|forced)": *true/"\1": false/' "$GITHUB_EVENT_PATH" >"$out/later.json"
          p "the script's rule on the real event with created and forced false: $(decision "$out/later.json")"
          printf '%s\n' '{"created": false, "forced": false, "commits": [{"added": [], "removed": [], "modified": ["docs/r2/README.md"]}]}' >"$out/docs.json"
          p "the script's rule on the hand-made event: $(decision "$out/docs.json")"
          start=$(date +%s)
          GITHUB_EVENT_PATH=$out/docs.json sh scripts/ci/run-ci-d.sh windows 10-egress >"$out/skip.out" 2>&1
          code=$?
          p "driver with the hand-made event: exit=$code seconds=$(($(date +%s) - start))"
          grep -E '^(long cases|PASS|FAIL|SKIP|seconds|checks |self-test mode|control mode|tests |not ok )' "$out/skip.out" | tr -d '\r' | cut -c1-200 | sed 's/^/v13 skip: /'
          p "done"
          exit 0
          READER13A
          bash "$RUNNER_TEMP/reader13a.sh"
          exit 0
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
