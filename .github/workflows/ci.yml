name: ci
# scratch: jobtime-5 PL-16 A7 (2), each new case 100 times on each system

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - name: Self-tests that commit in throwaway repositories
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          sh scripts/check-commit-messages.sh --self-test-two-paths
          sh scripts/check-commit-messages.sh --self-test-pre-push
          sh scripts/ci-commit-messages.sh --self-test
          sh scripts/merge-pr.sh --self-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: PL-16 cases 100 times
        shell: bash
        env:
          OWN_ONLY: alone-check-starts-after-both-lanes-have-ended two-alone-checks-run-one-after-the-other-in-order output-of-an-alone-check-in-the-order-of-the-run tracked-file-changed-by-an-alone-check-names-it-alone alone-check-past-its-limit-and-the-next-runs interrupt-during-the-alone-part alone-line-with-a-carriage-return-names-the-alone-part lane-lines-alone-and-free lane-other-than-free rules-refuses-a-lane-line
        run: |
          set +e
          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then tmp=$(cygpath -u "$tmp"); fi
          copy="$tmp/run-ci-d-filtered.sh"
          perl -0pe 's/own_case\(\) \{\n  case_name=\$1\n/own_case() {\n  [ -z "\$\{OWN_ONLY:-\}" ] || case " \$OWN_ONLY " in *" \$1 "*) ;; *) case_reset; return ;; esac\n  case_name=\$1\n/' scripts/ci/run-ci-d.sh >"$copy"
          echo "filter lines in the copy: $(grep -c 'OWN_ONLY' "$copy")"
          out="$tmp/pl16-loop"
          mkdir -p "$out"
          batch() {
            i=0
            while [ "$i" -lt 25 ]; do
              sh "$copy" macos --self-test run-ci-d >"$out/run-$1-$i.txt" 2>&1
              i=$((i + 1))
            done
          }
          start=$(date +%s)
          batch 1 & batch 2 & batch 3 & batch 4 &
          wait
          end=$(date +%s)
          set -- "$out"/run-*.txt
          echo "runs: $#, seconds: $((end - start))"
          bad=0
          for c in $OWN_ONLY; do
            total=$(cat "$out"/run-*.txt | grep -c "^case run-ci-d/$c want=")
            pass=$(cat "$out"/run-*.txt | grep -E "^case run-ci-d/$c want=" | awk '{ split($3, w, "="); split($4, g, "="); if (w[2] == g[2]) n++ } END { print n + 0 }')
            echo "case $c: $pass of $total as wanted"
            [ "$pass" -eq 100 ] && [ "$total" -eq 100 ] || bad=1
          done
          for f in "$out"/run-*.txt; do
            grep -E "^case run-ci-d/.* want=" "$f" | awk '{ split($3, w, "="); split($4, g, "="); if (w[2] != g[2]) print }'
          done | sort | uniq -c
          exit "$bad"
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: PL-16 cases 100 times
        shell: bash
        env:
          OWN_ONLY: alone-check-starts-after-both-lanes-have-ended two-alone-checks-run-one-after-the-other-in-order output-of-an-alone-check-in-the-order-of-the-run tracked-file-changed-by-an-alone-check-names-it-alone alone-check-past-its-limit-and-the-next-runs interrupt-during-the-alone-part alone-line-with-a-carriage-return-names-the-alone-part lane-lines-alone-and-free lane-other-than-free rules-refuses-a-lane-line
        run: |
          set +e
          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then tmp=$(cygpath -u "$tmp"); fi
          copy="$tmp/run-ci-d-filtered.sh"
          perl -0pe 's/own_case\(\) \{\n  case_name=\$1\n/own_case() {\n  [ -z "\$\{OWN_ONLY:-\}" ] || case " \$OWN_ONLY " in *" \$1 "*) ;; *) case_reset; return ;; esac\n  case_name=\$1\n/' scripts/ci/run-ci-d.sh >"$copy"
          echo "filter lines in the copy: $(grep -c 'OWN_ONLY' "$copy")"
          out="$tmp/pl16-loop"
          mkdir -p "$out"
          batch() {
            i=0
            while [ "$i" -lt 25 ]; do
              sh "$copy" windows --self-test run-ci-d >"$out/run-$1-$i.txt" 2>&1
              i=$((i + 1))
            done
          }
          start=$(date +%s)
          batch 1 & batch 2 & batch 3 & batch 4 &
          wait
          end=$(date +%s)
          set -- "$out"/run-*.txt
          echo "runs: $#, seconds: $((end - start))"
          bad=0
          for c in $OWN_ONLY; do
            total=$(cat "$out"/run-*.txt | grep -c "^case run-ci-d/$c want=")
            pass=$(cat "$out"/run-*.txt | grep -E "^case run-ci-d/$c want=" | awk '{ split($3, w, "="); split($4, g, "="); if (w[2] == g[2]) n++ } END { print n + 0 }')
            echo "case $c: $pass of $total as wanted"
            [ "$pass" -eq 100 ] && [ "$total" -eq 100 ] || bad=1
          done
          for f in "$out"/run-*.txt; do
            grep -E "^case run-ci-d/.* want=" "$f" | awk '{ split($3, w, "="); split($4, g, "="); if (w[2] != g[2]) print }'
          done | sort | uniq -c
          exit "$bad"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
