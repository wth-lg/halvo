  plain:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: win-3 W3-15 and W3-16, the unread Unknown gate's library test 20 times by its exact name (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/loop.log"
          cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/fun.json" 2>"$log"
          echo "LOOP build fun exit=$?"
          cargo test --locked -p halvo-capture --lib --no-run --message-format json >"$RUNNER_TEMP/lib.json" 2>"$log"
          echo "LOOP build lib exit=$?"
          fun=$(tr -d '\r' <"$RUNNER_TEMP/fun.json" | sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          lib=$(tr -d '\r' <"$RUNNER_TEMP/lib.json" | grep '"kind":\["lib"\]' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          [ -n "$fun" ] && [ -n "$lib" ] || echo "LOOP no executable"
          t=windows::input::tests::keys_at_a_gate_whose_start_read_reads_unknown_are_withheld_with_no_focus_event
          passed=0
          for run in $(seq 1 20); do
            timeout 600 "$lib" --exact "$t" --nocapture --test-threads=1 </dev/null >"$log" 2>&1
            code=$?
            if [ "$code" -eq 0 ] && tr -d '\r' <"$log" | grep -q '^test result: ok. 1 passed; 0 failed'; then
              passed=$((passed + 1))
              echo "PLAIN test=$t run=$run exit=$code passed=1"
              tr -d '\r' <"$log" | grep -E 'TF unknown-at-start ' | cut -c1-600
            else
              echo "PLAIN test=$t run=$run exit=$code passed=0 (every line of the run follows)"
              tr -d '\r' <"$log" | cut -c1-2000
            fi
          done
          echo "PLAIN test=$t runs=20 passed=$passed"
          exit 0
