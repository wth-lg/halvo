              sub("src-tauri/src/app.rs", SWITCH + "\";", "\";")
          elif copy == "chrome-switch":
              script_out()
              sub("src-tauri/src/app.rs", SWITCH + "\";", SWITCH + " --webrtc-ip-handling-policy=disable_non_proxied_udp\";")
          elif copy == "rules-only":
              page_layers_out()
              sub("src-tauri/src/engine.rs", CHAIN, "Ok::<(), String>(())\n")
          elif copy == "proxy-only":
              macos_alone("set_the_store_proxy(&view)")
          elif copy == "delegate-only":
              macos_alone("put_delegate_in_front(&view, mtm)")
          elif copy == "features-only":
              macos_alone("turn_off_engine_features(&view)")
          elif copy == "connect-proxy":
              macos_alone("set_the_store_proxy(&view)")
              sub(
                  "src-tauri/src/engine.rs",
                  "        fn nw_proxy_config_create_socksv5(proxy_endpoint: *mut NSObject) -> *mut NSObject;\n",
                  "        fn nw_proxy_config_create_socksv5(proxy_endpoint: *mut NSObject) -> *mut NSObject;\n"
                  "        fn nw_proxy_config_create_http_connect(proxy_endpoint: *mut NSObject, tls: *mut NSObject) -> *mut NSObject;\n",
              )
              text = engine_text()
              call = re.search(r"nw_proxy_config_create_socksv5\(Retained::as_ptr\(&endpoint\)\.cast_mut\(\)\)", text)
              assert call, "the proxy call"
              write_engine(text[: call.start()] + "nw_proxy_config_create_http_connect(Retained::as_ptr(&endpoint).cast_mut(), std::ptr::null_mut())" + text[call.end():])
          elif copy == "csp-sandbox":
              add_policy("sandbox allow-scripts allow-same-origin")
          print(f"copy {copy} made: {COPIES[copy]}")
          PYEOF
          exe=target/debug/halvo
          [ -f "$exe.exe" ] && exe=$exe.exe
          native() { if command -v cygpath >/dev/null 2>&1; then cygpath -w "$1"; else printf '%s\n' "$1"; fi; }
          listen_mode=listen
          pf=off
          launch() {
            local label=$1 lp d code tick tp
            shift
            "$py" "$RUNNER_TEMP/measure.py" "$listen_mode" "$m" "$label" &
            lp=$!
            for tick in $(seq 1 100); do [ -f "$m/ready-$label" ] && break; sleep 0.2; done
            if [ "$pf" = on ]; then
              sudo tcpdump -n -l -i pflog0 > "$m/pflog-$label.txt" 2> "$m/pflog-$label.err" &
              tp=$!
              sleep 1
            fi
            d=$(mktemp -d "$RUNNER_TEMP/ap9-data-XXXXXX")
            env "$@" "$exe" --check-page --data-dir "$(native "$d")" --within-s "$within" > "$m/$label.out" 2> "$m/$label.err"
            code=$?
            sleep 2
            if [ "$pf" = on ]; then
              sudo kill "$tp"
              wait "$tp"
            fi
            : > "$m/stop-$label"
            wait "$lp"
            echo "measure launch $label: exit $code, line: $(head -n 1 "$m/$label.out")"
            grep -v '^halvo-measure s' "$m/$label.err" | head -n 5 | sed "s/^/measure launch $label stderr: /"
          }
          job=$(printf '%s' "$RUNNER_OS" | tr 'A-Z' 'a-z')
          "$py" "$RUNNER_TEMP/measure.py" plan "$m" > "$m/ip.txt"
          echo "measure address planned: $(wc -l < "$m/steps.tsv") step lines, $(wc -l < "$m/hosts.txt") hosts lines"
          if [ "$RUNNER_OS" = macOS ]; then
            sudo sh -c "cat '$m/hosts.txt' >> /etc/hosts"
            sudo mkdir -p /etc/resolver
            printf 'nameserver 127.0.0.1\nport 5354\n' | sudo tee /etc/resolver/halvo-measure.test > /dev/null
            sudo dscacheutil -flushcache
            sudo killall -HUP mDNSResponder
            sudo ifconfig pflog0 create 2> /dev/null
            sudo route -n add -inet6 2001:db8::/32 ::1 > "$m/route6.txt" 2>&1
            printf 'block drop out log quick inet proto { tcp udp } to 198.51.100.7\nblock drop out log quick inet6 proto { tcp udp } to 2001:db8::7\n' > "$m/pf.conf"
            sudo pfctl -f "$m/pf.conf" > "$m/pfctl.txt" 2>&1
            sudo pfctl -E >> "$m/pfctl.txt" 2>&1
            sudo tcpdump -n -l -i pflog0 > "$m/pflog-pfprobe.txt" 2> "$m/pflog-pfprobe.err" &
            tp=$!
            sleep 2
            "$py" -c "
          import socket
          for family, host in ((socket.AF_INET, '198.51.100.7'), (socket.AF_INET6, '2001:db8::7')):
              s = socket.socket(family, socket.SOCK_STREAM)
              s.settimeout(1)
              try:
                  s.connect((host, 9999))
              except OSError as e:
                  print('measure packet filter probe', host, type(e).__name__, e)
              s.close()
          "
            sleep 2
            sudo kill "$tp"
            wait "$tp"
            n4=$(grep -c '> 198\.51\.100\.7\.9999: Flags \[S\]' "$m/pflog-pfprobe.txt")
            n6=$(grep -c '> 2001:db8::7\.9999: Flags \[S\]' "$m/pflog-pfprobe.txt")
            v4=no; v6=no
            [ "$n4" -gt 0 ] && v4=yes
            [ "$n6" -gt 0 ] && v6=yes
            if [ "$v4" = yes ] || [ "$v6" = yes ]; then pf=on; fi
            echo "set up v4=$v4 v6=$v6 (probe attempts seen: $n4 to 198.51.100.7, $n6 to 2001:db8::7)" > "$m/pf-status.txt"
            sed 's/^/measure pfctl: /' "$m/pfctl.txt" | head -n 6
            sed 's/^/measure route6: /' "$m/route6.txt" | head -n 2
            head -n 3 "$m/pflog-pfprobe.err" | sed 's/^/measure tcpdump: /'
            echo "measure packet filter: $(cat "$m/pf-status.txt")"
          else
            cat "$m/hosts.txt" >> /c/Windows/System32/drivers/etc/hosts
            powershell -NoProfile -Command "Add-DnsClientNrptRule -Namespace '.halvo-measure.test' -NameServers '127.0.0.1'; Clear-DnsClientCache; (Get-DnsClientNrptRule | Measure-Object).Count" | sed 's/^/measure nrpt rules: /'
            netsh advfirewall set allprofiles state off > /dev/null && echo "measure firewall off"
          fi
          sleep 2
          "$py" "$RUNNER_TEMP/measure.py" listen "$m" probe &
          lp=$!
          for i in $(seq 1 100); do [ -f "$m/ready-probe" ] && break; sleep 0.2; done
          "$py" "$RUNNER_TEMP/measure.py" probe "$m"
          : > "$m/stop-probe"
          wait "$lp"
          "$py" -c "import json,sys; d=json.load(open(sys.argv[1])); print('measure probe counts:', json.dumps(d['counts'], sort_keys=True), 'failures:', d['listen_failures'])" "$m/counts-probe.json"
          if [ "$RUNNER_OS" = macOS ]; then copies=" head no-script engine-alone no-layer guard-off late rules-only proxy-only delegate-only features-only connect-proxy csp-sandbox "; else copies=" head no-script no-switch chrome-switch engine-alone no-layer "; fi
          echo "measure copies of this job:$copies"
          a2=0
          for copy in $copies; do
            "$py" "$RUNNER_TEMP/copies.py" "$copy"
            cargo build -p halvo --locked > "$m/build-$copy.txt" 2>&1
            echo "measure build $copy: exit $?"
            within=420
            launch "$copy-steps" "HALVO_MEASURE_STEPS=$(native "$m/steps.tsv")" HALVO_MEASURE_WAIT_MS=1200
            case " head no-script engine-alone no-layer guard-off late " in
              *" $copy "*) within=25; launch "$copy-init" "HALVO_MEASURE_INIT=$(cat "$m/init.js")" ;;
            esac
            if [ "$RUNNER_OS" = macOS ] && { [ "$copy" = head ] || [ "$copy" = no-layer ]; }; then
              within=420
              listen_mode=listen-a2
              launch "$copy-a2" "HALVO_MEASURE_STEPS=$(native "$m/a2.tsv")" HALVO_MEASURE_WAIT_MS=1200
              listen_mode=listen
              a2=1
            fi
            git checkout -- src-tauri
          done
          echo "measure tree clean after the copies: $([ -z "$(git status --porcelain)" ] && echo true || echo false)"
          "$py" "$RUNNER_TEMP/measure.py" judge "$m" "$job"
          verdict=$?
          if [ "$a2" = 1 ]; then
            "$py" "$RUNNER_TEMP/measure.py" judge-a2 "$m" || verdict=1
          fi
          cargo build -p halvo --locked > /dev/null 2>&1
          exit $verdict
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 20-app-links-no-store 21-tree-bans 30-app-page-test 32-app-check-page 36-app-guard-tests
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 20-app-links-no-store 21-tree-bans 30-app-page-test 32-app-check-page 36-app-guard-tests
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
