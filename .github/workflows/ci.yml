        run: sh scripts/ci/run-ci-d.sh windows --self-test 10-r5-layout 20-r5-rule 50-r5-drift 55-r5-routine
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 10-r5-layout 20-r5-rule 50-r5-drift 55-r5-routine
      - name: Loop of the unit's tests, 200 runs
        if: always()
        shell: bash
        run: |
          set +e
          names=(tests::lines::a_run_that_sends_exactly_lines_held_max_lines_finishes_as_today tests::lines::a_run_one_line_past_lines_held_max_is_a_lost_run_and_the_next_run_learns_as_today tests::lines::a_log_body_that_arrives_twice_counts_its_lines_once tests::lines::one_held_line_takes_at_most_16_bytes_and_lines_held_max_of_them_at_most_65_536_bytes tests::kinds::each_planted_row_is_refused_by_its_parser_and_names_its_workflow tests::kinds::a_refused_learn_edit_row_stops_the_edit_side_of_its_workflow_and_nothing_else tests::kinds::a_refused_learn_run_row_makes_the_runs_of_its_workflow_lost_runs_and_stops_nothing_else tests::kinds::a_refused_learn_run_row_that_comes_after_a_runs_start_makes_it_a_lost_run tests::kinds::a_run_started_while_its_run_rows_were_stopped_stays_lost_after_the_refused_row_leaves_by_its_bound tests::kinds::a_refused_learn_routine_row_stops_the_routine_rows_of_its_workflow_and_no_run tests::kinds::a_refused_row_whose_workflow_cannot_be_read_stops_its_kind_for_every_workflow tests::kinds::a_learning_commit_that_the_store_refuses_leaves_the_agent_stores_reply tests::kinds::a_start_run_that_arrives_again_at_runs_held_max_drops_no_other_held_run tests::kinds::a_start_run_that_arrives_again_after_its_refused_commit_stores_no_run_row_and_the_run_stays_lost tests::kinds::a_start_run_that_arrives_again_after_its_stopped_run_rows_left_by_their_bound_stores_no_run_row tests::kinds::a_start_run_that_arrives_again_where_its_row_stands_and_its_start_is_held_stores_the_due_routine_row_alone tests::starts::a_start_after_a_stop_behind_the_state_call_of_create_agent_stores_the_routine_row_with_the_runs_row tests::starts::a_start_after_a_refused_commit_of_create_agent_stores_the_routine_row tests::starts::a_pair_whose_rows_left_by_their_bound_gets_rev_1_at_its_next_start tests::starts::under_a_clock_set_back_so_that_the_old_rows_are_read_again_the_newest_row_by_the_one_rule_is_written_again tests::starts::the_newest_row_is_written_again_at_30_and_92_days_with