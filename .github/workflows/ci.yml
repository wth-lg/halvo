name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 12-test 50-windows-functional
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
  bursts:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: win-3 W3-12 (4), the Chrome and the Edge burst 60 times each, each run a process of its own as the check runs it (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/loop.log"
          cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/fun.json" 2>"$log"
          echo "LOOP build fun exit=$?"
          cargo test --locked -p halvo-capture --lib --no-run --message-format json >"$RUNNER_TEMP/lib.json" 2>"$log"
          echo "LOOP build lib exit=$?"
          fun=$(tr -d '\r' <"$RUNNER_TEMP/fun.json" | sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          lib=$(tr -d '\r' <"$RUNNER_TEMP/lib.json" | grep '"kind":\["lib"\]' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          [ -n "$fun" ] && [ -n "$lib" ] || echo "LOOP no executable"
          for t in browser::a_burst_whose_first_letter_swaps_records_nothing_in_chrome browser::a_burst_whose_first_letter_swaps_records_nothing_in_edge; do
            passed=0
            no_round=0
            unknown_rounds=0
            for run in $(seq 1 60); do
              timeout 600 "$fun" --ignored --exact --nocapture "$t" </dev/null >"$log" 2>&1
              code=$?
              ok=0
              if [ "$code" -eq 0 ] && tr -d '\r' <"$log" | grep -q '^test result: ok. 1 passed; 0 failed'; then
                passed=$((passed + 1))
                ok=1
              fi
              unknown=$(tr -d '\r' <"$log" | grep -c 'gate_before_the_burst=Some(Unknown)')
              unknown_rounds=$((unknown_rounds + unknown))
              counted=$(tr -d '\r' <"$log" | sed -n 's/.*TF browser-burst-[a-z]* phase=burst counted=\([0-9]*\) .*/\1/p' | head -n 1)
              [ "${counted:-x}" = 0 ] && no_round=$((no_round + 1))
              echo "BURST test=$t run=$run exit=$code passed=$ok counted=${counted:-none} rounds_with_an_unknown_gate=$unknown"
              if [ "$ok" -eq 0 ] || [ "$unknown" -gt 0 ]; then
                tr -d '\r' <"$log" | grep -E 'TF browser-burst-[a-z]+ (browser=|detector |control_reads=|phase=burst counted)|panicked at|INCONCLUSIVE|^test result' | cut -c1-700
              fi
            done
            echo "BURST test=$t runs=60 passed=$passed runs_that_counted_no_round=$no_round rounds_with_an_unknown_gate=$unknown_rounds"
          done
          echo "BURST end"
          exit 0
  loop-2:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: win-3 W3-12 (3) and (4), the changed tests by their exact names (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/loop.log"
          cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/fun.json" 2>"$log"
          echo "LOOP build fun exit=$?"
          cargo test --locked -p halvo-capture --lib --no-run --message-format json >"$RUNNER_TEMP/lib.json" 2>"$log"
          echo "LOOP build lib exit=$?"
          fun=$(tr -d '\r' <"$RUNNER_TEMP/fun.json" | sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          lib=$(tr -d '\r' <"$RUNNER_TEMP/lib.json" | grep '"kind":\["lib"\]' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          [ -n "$fun" ] && [ -n "$lib" ] || echo "LOOP no executable"
          while read -r kind t runs; do
            [ -n "$kind" ] || continue
            passed=0
            for run in $(seq 1 "$runs"); do
              if [ "$kind" = fun ]; then
                timeout 600 "$fun" --ignored --exact "$t" --nocapture --test-threads=1 >"$log" 2>&1 </dev/null
              else
                timeout 600 "$lib" --exact "$t" --nocapture --test-threads=1 >"$log" 2>&1 </dev/null
              fi
              code=$?
              if [ "$code" -eq 0 ] && tr -d '\r' <"$log" | grep -q '^test result: ok. 1 passed; 0 failed'; then
                passed=$((passed + 1))
              fi
              if [ "$code" -ne 0 ] || [ "$run" -eq 1 ]; then
                echo "LOOP test=$t run=$run exit=$code"
                tr -d '\r' <"$log" | grep -E 'TF [a-z0-9-]+ (spaced-sequence|detector |gate_at_start|order=warm-control)|panicked at|^  left|^ right|INCONCLUSIVE' | cut -c1-400 | head -n 12
              fi
            done
            echo "LOOP test=$t runs=$runs passed=$passed"
          done <<'ROWS'
          lib windows::input::tests::a_gate_with_a_reader_of_the_seam_and_one_without_give_the_same_verdicts 200
          lib windows::input::tests::spaced_keys_cleared_among_other_marks_get_the_same_verdicts_with_and_without_the_seam 200
          fun capture_times_follow_the_input_order 20
          fun stop_with_a_full_sink 20
          fun a_dropped_keyboard_source_stops_capturing 20
          fun x3_attribution_before_the_first_foreground_change 20
          fun x15_a_held_key 20
          fun browser::cold_and_warm_orders_in_chrome 20
          fun browser::cold_and_warm_orders_in_edge 20
          ROWS
          echo "LOOP end"
          exit 0
