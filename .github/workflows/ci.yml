          ROWS_PACKAGE: halvo-sqlcipher
        run: |
          set +e -u
          list="${RUNNER_TEMP:-/tmp}/not-caught-$ROWS_JOB.txt"
          [ -s "$list" ] || { printf 'UNMUTATED no row of %s is not caught\n' "$ROWS_FILE"; exit 0; }
          cargo=${HALVO_STEP_CARGO:-cargo}
          status=0
          while read -r row test; do
