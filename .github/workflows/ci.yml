name: ci
# scratch of verifier 133 (unit sqlcipher-1 at 13b7613b): both jobs trimmed to 10-format 11-clippy 12-test; macos adds the eight E3 stop steps, the E4 source, the two mutant rows by name and the log probe; windows adds the two probes of S-86 E8; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test
      - name: "E3 stop 1 of halvo-sqlcipher's build: SQLITE_ENABLE_STAT4 is defined (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u
          status=0
          words="halvo-sqlcipher: the build stops: SQLITE_ENABLE_STAT4 is defined"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-DSQLITE_ENABLE_STAT4" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 1 CFLAGS=-DSQLITE_ENABLE_STAT4: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 1 CFLAGS=-DSQLITE_ENABLE_STAT4: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E3 stop 2 of halvo-sqlcipher's build: SQLITE_TEMP_STORE is not 2 (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u
          status=0
          words="halvo-sqlcipher: the build stops: SQLITE_TEMP_STORE is not 2"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-DSQLITE_TEMP_STORE=4" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 2 CFLAGS=-DSQLITE_TEMP_STORE=4: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 2 CFLAGS=-DSQLITE_TEMP_STORE=4: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E3 stop 3 of halvo-sqlcipher's build: SQLITE_DEFAULT_AUTOVACUUM is not 0 (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u
          status=0
          words="halvo-sqlcipher: the build stops: SQLITE_DEFAULT_AUTOVACUUM is not 0"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-DSQLITE_DEFAULT_AUTOVACUUM=1" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 3 CFLAGS=-DSQLITE_DEFAULT_AUTOVACUUM=1: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 3 CFLAGS=-DSQLITE_DEFAULT_AUTOVACUUM=1: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E3 stop 4 of halvo-sqlcipher's build: BTS_FAST_SECURE is not defined, so the database's code is not compiled in this file (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u
          status=0
          words="halvo-sqlcipher: the build stops: BTS_FAST_SECURE is not defined, so the database's code is not compiled in this file"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-DSQLITE_AMALGAMATION" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 4 CFLAGS=-DSQLITE_AMALGAMATION: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 4 CFLAGS=-DSQLITE_AMALGAMATION: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E3 stop 5 of halvo-sqlcipher's build: SQLITE_HAS_CODEC is not defined (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u
          status=0
          words="halvo-sqlcipher: the build stops: SQLITE_HAS_CODEC is not defined"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-USQLITE_HAS_CODEC" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 5 CFLAGS=-USQLITE_HAS_CODEC: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 5 CFLAGS=-USQLITE_HAS_CODEC: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E3 stop 6 of halvo-sqlcipher's build: SQLITE_DEFAULT_SYNCHRONOUS or SQLITE_DEFAULT_WAL_SYNCHRONOUS is not 2 (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u
          status=0
          words="halvo-sqlcipher: the build stops: SQLITE_DEFAULT_SYNCHRONOUS or SQLITE_DEFAULT_WAL_SYNCHRONOUS is not 2"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-DSQLITE_DEFAULT_SYNCHRONOUS=1" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 6 CFLAGS=-DSQLITE_DEFAULT_SYNCHRONOUS=1: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 6 CFLAGS=-DSQLITE_DEFAULT_SYNCHRONOUS=1: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          CFLAGS="-DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 6 CFLAGS=-DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 6 CFLAGS=-DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E3 stop 7 of halvo-sqlcipher's build: SQLITE_DEBUG is defined (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u
          status=0
          words="halvo-sqlcipher: the build stops: SQLITE_DEBUG is defined"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-DSQLITE_DEBUG" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 7 CFLAGS=-DSQLITE_DEBUG: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 7 CFLAGS=-DSQLITE_DEBUG: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E3 stop 8 of halvo-sqlcipher's build: SQLITE_DEFAULT_PAGE_SIZE is not 4096 (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u
          status=0
          words="halvo-sqlcipher: the build stops: SQLITE_DEFAULT_PAGE_SIZE is not 4096"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-DSQLITE_DEFAULT_PAGE_SIZE=8192" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 8 CFLAGS=-DSQLITE_DEFAULT_PAGE_SIZE=8192: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 8 CFLAGS=-DSQLITE_DEFAULT_PAGE_SIZE=8192: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E4 eighth source of halvo-sqlcipher's build: an anchor under a preprocessor branch (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u
          if [ "${RUNNER_OS:-}" = Windows ]; then py=python; else py=python3; fi
          home=${CARGO_HOME:-$HOME/.cargo}
          if [ "${RUNNER_OS:-}" = Windows ]; then home=$(cygpath -u "$home"); fi
          pinned=$(find "$home/registry/src" -path '*sqlcipher-src-419.0.6*' -name sqlcipher.c | head -n 1)
          if [ -z "$pinned" ]; then
            printf 'E4 NOT-STOPPED eighth source: no pinned sqlcipher.c under %s\n' "$home/registry/src"
            exit 1
          fi
          if [ "${RUNNER_OS:-}" = Windows ]; then pinned=$(cygpath -m "$pinned"); fi
          case_file="${RUNNER_TEMP:-/tmp}/anchor-under-ifdef.c"
          out="${RUNNER_TEMP:-/tmp}/e4-case.out"
          script="${RUNNER_TEMP:-/tmp}/e4-case.py"
          cat >"$script" <<'PYEOF'
          import hashlib, sys
          pinned, case, build_rs = sys.argv[1:4]
          lines = open(pinned, 'rb').read().split(b'\n')
          assert lines[81514] == b'' and lines[81516] == b'  pPg->nCell = (u16)nNew;'
          lines[81514] = b'#ifdef SQLITE_DEBUG'
          lines[81517:81517] = [b'#else', b'  pPg->nCell = (u16)(nNew & 0xffff);', b'#endif']
          data = b'\n'.join(lines)
          digest = hashlib.sha256(data).hexdigest()
          assert digest == 'aac3535daae016c418657f416e962ac11449412ee6697216cc99c656dacf91c1', digest
          open(case, 'wb').write(data)
          text = open(build_rs, newline='', encoding='utf-8').read()
          a = '    let pinned = source_dir.join(sqlcipher_src::SOURCE_FILE);'
          b = 'const PINNED_SHA256: &str = "838b2ed8a586b8b77f03e82c5a25b97e1a55e524ebac0de05354193865703072";'
          assert text.count(a) == 1 and text.count(b) == 1
          text = text.replace(a, '    let pinned = PathBuf::from("' + case.replace(chr(92), '/') + '");')
          text = text.replace(b, 'const PINNED_SHA256: &str = "' + digest + '";')
          open(build_rs, 'w', newline='', encoding='utf-8').write(text)
          print('E4 case written, sha256', digest)
          PYEOF
          $py -I "$script" "$pinned" "$case_file" crates/halvo-sqlcipher/build.rs || exit 1
          cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          git checkout -- crates/halvo-sqlcipher/build.rs
          printf 'E4 status lines after the restore: %s\n' "$(git status --porcelain | wc -l | tr -d ' ')"
          # shellcheck disable=SC2016
          words='looked for the line `  pPg->nCell = (u16)nNew;`, line 81517, outside every preprocessor branch opened after the text `static int editPage(`'
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E4 STOP eighth source: cargo build exit %s, the named line stands\n' "$code"
            exit 0
          fi
          printf 'E4 NOT-STOPPED eighth source: cargo build exit %s, the named line does not stand\n' "$code"
          tr -d '\r' <"$out" | grep -E 'error|halvo-sqlcipher:' | head -n 5
          exit 1
      - name: "V133 the two mutant rows of halvo-sqlcipher by name, with their seconds (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u
          out="${RUNNER_TEMP:-/tmp}/v133-rows.out"
          start=$(date +%s)
          sh scripts/r1-gate/mutation-test.sh --budget 3000 --only rebuilt-page-gap-not-zeroed --only edited-page-gap-not-zeroed >"$out" 2>&1
          code=$?
          grep -E '^(PASS|FAIL|STOPPED|seconds) |^mutation rows' "$out"
          caught=$(grep -c -E "^PASS mutation:(rebuilt|edited)-page-gap-not-zeroed \(test .*: the one test failed\)" "$out")
          printf 'V133 rows: exit %s, rows caught by their one test %s, %s seconds for both rows with the build of the copy and the unmutated checks\n' "$code" "$caught" "$(( $(date +%s) - start ))"
          if [ "$code" -eq 0 ] && [ "$caught" -eq 2 ]; then exit 0; fi
          tail -n 20 "$out"
          exit 1
      - name: "V133 the log and the journal at the last close after a removal, macos beside windows (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          sh scratch-v133/probe-log.sh
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: "V133 E8 point 1, the log and the journal at the last close after a removal (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          sh scratch-v133/probe-log.sh
      - name: "V133 E8 point 2, a database library of the pinned source without the statements on the link path (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          sh scratch-v133/probe-decoy.sh
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
