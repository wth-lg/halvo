name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 10-r5-layout 20-r5-rule 19-home-paths 21-tree-bans 23-r7-machine-paths
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 10-r5-layout 20-r5-rule 19-home-paths 21-tree-bans 23-r7-machine-paths
      - name: U5.3 loop of the added tests
        shell: bash
        run: |
          set +e
          names="routine::tests::newest::the_newest_row_is_the_one_of_the_highest_rev_wherever_it_stands routine::tests::newest::of_two_rows_of_one_rev_the_newest_is_the_one_of_the_later_day_wherever_it_stands routine::tests::newest::of_two_rows_of_one_rev_and_one_day_the_newest_is_the_one_that_comes_last routine::tests::newest::the_newest_row_is_of_the_workflow_and_agent_asked_and_none_where_it_has_no_row routine::tests::newest::of_two_rows_of_one_rev_the_step_and_the_function_go_on_from_the_same_row routine::tests::step::of_two_rows_of_one_rev_the_step_goes_on_from_the_one_of_the_later_day routine::tests::step::of_two_rows_of_one_rev_and_one_day_the_step_goes_on_from_the_one_visited_last routine::tests::step::a_clock_more_than_two_days_behind_the_newest_row_gives_the_row_of_routine_step routine::tests::bar::a_clock_one_or_two_days_behind_the_newest_row_rests_its_pair_and_steps_the_other_pairs routine::tests::bar::the_first_commit_on_the_day_of_the_newest_row_takes_its_pair_up_again routine::tests::bar::review_c1_1_a_clock_set_back_one_day_moves_last_neither_back_nor_forward routine::tests::bar::review_c1_2_a_clock_set_back_one_day_neither_clears_a_stale_mark_nor_moves_its_since routine::tests::bar::review_c1_3_a_clock_set_back_one_day_does_not_mark_stale_a_routine_that_the_person_resumed routine::tests::bar::a_clock_three_days_behind_a_row_that_the_read_still_hands_out_gives_todays_row routine::tests::bar::a_stale_mark_written_under_a_clock_ahead_stands_while_its_pair_rests_and_goes_at_the_first_commit_on_its_day routine::tests::bar::the_same_store_stepped_twice_on_one_day_returns_nothing_the_second_time_and_one_row_after_a_new_occurrence_day routine::tests::bar::while_the_writer_is_behind_the_clock_the_step_takes_the_clocks_day_as_today routine::tests::refused::a_refused_row_of_either_kind_whose_workflow_key_can_be_read_stops_that_workflow_alone routine::tests::refused::refused_rows_of_two_workflows_stop_both_and_a_refused_row_of_a_workflow_with_no_routine_row_stops_none routine::tests::refused::a_refused_row_whose_workflow_key_cannot_be_read_stops_every_workflow routine::tests::refused::the_key_reader_gives_the_workflow_under_the_registrys_key_of_each_kind_that_the_step_reads routine::tests::refused::the_key_reader_gives_nothing_where_the_key_cannot_be_read_or_the_kind_has_none"
          cargo test --locked -p halvo-learn-store --lib --no-run 2>"$RUNNER_TEMP/u53-build.txt"
          code=$?
          exe=$(sed -n 's/^ *Executable unittests src[\\/]lib\.rs (\(.*\))$/\1/p' "$RUNNER_TEMP/u53-build.txt" | tail -n 1)
          exe=${exe//\\//}
          if [ -n "$exe" ]; then found=yes; else found=no; fi
          echo "loop build=$code binary_found=$found"
          if [ "$code" -ne 0 ] || [ "$found" = no ]; then exit 1; fi
          bad=0
          count=0
          start=$(date +%s)
          for name in $names; do
            count=$((count + 1))
            ok=0
            for i in $(seq 1 200); do
              out=$("$exe" --exact "$name" 2>&1)
              case "$out" in
                *"test result: ok. 1 passed; 0 failed;"*) ok=$((ok + 1)) ;;
              esac
            done
            echo "loop test=$name passed=$ok of=200"
            if [ "$ok" -ne 200 ]; then bad=1; fi
          done
          echo "loop tests=$count seconds=$(( $(date +%s) - start )) failed_any=$bad"
          exit $bad
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 10-r5-layout 20-r5-rule 19-home-paths 21-tree-bans 23-r7-machine-paths
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 10-r5-layout 20-r5-rule 19-home-paths 21-tree-bans 23-r7-machine-paths
      - name: U5.3 loop of the added tests
        shell: bash
        run: |
          set +e
          names="routine::tests::newest::the_newest_row_is_the_one_of_the_highest_rev_wherever_it_stands routine::tests::newest::of_two_rows_of_one_rev_the_newest_is_the_one_of_the_later_day_wherever_it_stands routine::tests::newest::of_two_rows_of_one_rev_and_one_day_the_newest_is_the_one_that_comes_last routine::tests::newest::the_newest_row_is_of_the_workflow_and_agent_asked_and_none_where_it_has_no_row routine::tests::newest::of_two_rows_of_one_rev_the_step_and_the_function_go_on_from_the_same_row routine::tests::step::of_two_rows_of_one_rev_the_step_goes_on_from_the_one_of_the_later_day routine::tests::step::of_two_rows_of_one_rev_and_one_day_the_step_goes_on_from_the_one_visited_last routine::tests::step::a_clock_more_than_two_days_behind_the_newest_row_gives_the_row_of_routine_step routine::tests::bar::a_clock_one_or_two_days_behind_the_newest_row_rests_its_pair_and_steps_the_other_pairs routine::tests::bar::the_first_commit_on_the_day_of_the_newest_row_takes_its_pair_up_again routine::tests::bar::review_c1_1_a_clock_set_back_one_day_moves_last_neither_back_nor_forward routine::tests::bar::review_c1_2_a_clock_set_back_one_day_neither_clears_a_stale_mark_nor_moves_its_since routine::tests::bar::review_c1_3_a_clock_set_back_one_day_does_not_mark_stale_a_routine_that_the_person_resumed routine::tests::bar::a_clock_three_days_behind_a_row_that_the_read_still_hands_out_gives_todays_row routine::tests::bar::a_stale_mark_written_under_a_clock_ahead_stands_while_its_pair_rests_and_goes_at_the_first_commit_on_its_day routine::tests::bar::the_same_store_stepped_twice_on_one_day_returns_nothing_the_second_time_and_one_row_after_a_new_occurrence_day routine::tests::bar::while_the_writer_is_behind_the_clock_the_step_takes_the_clocks_day_as_today routine::tests::refused::a_refused_row_of_either_kind_whose_workflow_key_can_be_read_stops_that_workflow_alone routine::tests::refused::refused_rows_of_two_workflows_stop_both_and_a_refused_row_of_a_workflow_with_no_routine_row_stops_none routine::tests::refused::a_refused_row_whose_workflow_key_cannot_be_read_stops_every_workflow routine::tests::refused::the_key_reader_gives_the_workflow_under_the_registrys_key_of_each_kind_that_the_step_reads routine::tests::refused::the_key_reader_gives_nothing_where_the_key_cannot_be_read_or_the_kind_has_none"
          cargo test --locked -p halvo-learn-store --lib --no-run 2>"$RUNNER_TEMP/u53-build.txt"
          code=$?
          exe=$(sed -n 's/^ *Executable unittests src[\\/]lib\.rs (\(.*\))$/\1/p' "$RUNNER_TEMP/u53-build.txt" | tail -n 1)
          exe=${exe//\\//}
          if [ -n "$exe" ]; then found=yes; else found=no; fi
          echo "loop build=$code binary_found=$found"
          if [ "$code" -ne 0 ] || [ "$found" = no ]; then exit 1; fi
          bad=0
          count=0
          start=$(date +%s)
          for name in $names; do
            count=$((count + 1))
            ok=0
            for i in $(seq 1 200); do
              out=$("$exe" --exact "$name" 2>&1)
              case "$out" in
                *"test result: ok. 1 passed; 0 failed;"*) ok=$((ok + 1)) ;;
              esac
            done
            echo "loop test=$name passed=$ok of=200"
            if [ "$ok" -ne 200 ]; then bad=1; fi
          done
          echo "loop tests=$count seconds=$(( $(date +%s) - start )) failed_any=$bad"
          exit $bad
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
