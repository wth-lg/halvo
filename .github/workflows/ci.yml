name: ci
# scratch: both jobs whole with the loop, the E3 stops and the E4 source; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - name: Self-tests that commit in throwaway repositories
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          sh scripts/check-commit-messages.sh --self-test-two-paths
          sh scripts/check-commit-messages.sh --self-test-pre-push
          sh scripts/ci-commit-messages.sh --self-test
          sh scripts/merge-pr.sh --self-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos
      - name: "Loop of the new or changed tests of halvo-sqlcipher (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          start=$(date +%s)
          out=$(cargo test --locked -p halvo-sqlcipher --lib --no-run 2>&1)
          bin=$(printf '%s\n' "$out" | tr -d '\r' | sed -n 's/.*Executable unittests src.lib\.rs (\(.*\))$/\1/p' | head -n 1 | tr '\134' '/')
          if [ -z "$bin" ]; then
            printf '%s\n' "$out"
            exit 1
          fi
          printf 'LOOP build of the test binary: seconds %s\n' "$(($(date +%s) - start))"
          status=0
          for spec in 'page_gap::a_removed_or_replaced_row_leaves_no_text_in_a_page_built_again_or_edited_in_place 20' 'page_gap::fts5::removed_fts5_tokens_with_a_shared_prefix_stand_in_no_page_but_the_idx_tree 20' 'page_gap::fts5::the_fts5_idx_key_of_a_removed_row_stays_until_a_rebuild 200' 'page_gap::fts5::with_fts5_secure_delete_off_the_search_finds_a_removed_token_outside_the_idx_tree 200' 'page_gap::holes::a_checkpoint_that_does_not_truncate_leaves_a_log_that_the_search_names 200' 'page_gap::holes::a_marker_that_the_test_never_wrote_is_named_by_the_search 200' 'page_gap::holes::a_removed_marker_in_a_file_of_another_name_is_named_by_the_search 200' 'page_gap::holes::a_removed_marker_written_after_the_close_is_named_by_the_look_after_a_close 200' 'page_gap::holes::a_stored_marker_missing_from_the_files_is_named_by_the_search 200' 'page_gap::holes::an_index_record_one_byte_above_the_largest_local_payload_passes_the_check 200' 'page_gap::holes::an_index_record_whose_local_part_is_the_largest_passes_the_check 200' 'page_gap::holes::text_planted_in_a_gap_with_the_store_open_is_named_by_the_look_with_the_store_open 200' 'page_gap::holes::the_structural_check_sees_a_byte_planted_at_each_end_of_the_places_that_it_reads 200' 'page_gap::holes::with_the_store_closed_text_planted_past_the_stale_run_of_a_gap_is_named_by_the_search 200' 'page_gap::layout::a_record_at_the_largest_local_payload_and_one_byte_above_passes_the_check 200' 'page_gap::layout::a_stale_offset_passes_only_between_its_slot_plus_2_and_the_usable_size_less_4 200' 'page_gap::layout::cells_of_three_bytes_in_a_one_column_table_without_rowid_pass_the_check 200' 'page_gap::layout::the_structural_check_sees_a_byte_planted_in_each_place_that_it_reads 200' 'page_gap::layout::the_structural_check_sees_four_bytes_of_text_planted_in_a_gap 200' 'page_gap::layout::the_structural_check_sees_what_a_delete_leaves_with_secure_delete_off 200' 'page_gap::malformed::on_a_leaf_whose_content_start_lies_above_live_cells_the_integrity_check_refuses_it_and_deletes_lose_those_cells 200' 'page_gap::malformed::under_a_key_one_byte_changed_on_disk_in_a_b_tree_page_fails_the_read 200' 'page_gap::pins::a_new_database_of_this_build_reads_auto_vacuum_0_after_its_first_table 200' 'page_gap::pins::the_compile_options_of_this_build_are_its_closed_list 200' 'page_gap::rewrites::rows_copied_by_insert_select_leave_no_text_after_their_removal 200' 'page_gap::rewrites::rows_removed_before_a_vacuum_and_after_it_leave_no_text 200' 'page_gap::rewrites::with_secure_delete_off_the_search_finds_a_removed_copied_row 200' 'page_gap::rewrites::with_secure_delete_off_the_search_finds_a_removed_row_beside_zero_blobs 200' 'page_gap::rewrites::with_secure_delete_off_the_search_finds_a_row_removed_around_a_vacuum 200' 'page_gap::rewrites::zero_blobs_and_same_length_replacements_leave_no_text 200' 'page_gap::second_place::rows_that_analyze_or_optimize_read_leave_no_text_after_their_removal 200' 'page_gap::second_place::small_rows_deleted_one_at_a_time_leave_no_text_in_a_page_edited_in_place 20' 'page_gap::second_place::the_fts5_draw_of_seed_24_leaves_no_tail_of_a_removed_token_in_any_file 200' 'page_gap::table::every_byte_write_of_btree_c_has_a_row_in_the_table_of_adr_0013 200' 'page_gap::the_compiled_copy_is_the_pinned_file_with_two_statements_then_eight_compile_stops_and_one_added_function 200' 'page_gap::under_a_key_every_row_of_each_seed_reads_back_and_the_integrity_check_holds 20' 'page_gap::with_secure_delete_off_the_search_finds_a_removed_row_of_each_seed 200'; do
            name=${spec% *}
            runs=${spec##* }
            passes=0
            slowest=0
            i=0
            begun=$(date +%s)
            while [ "$i" -lt "$runs" ]; do
              i=$((i + 1))
              t0=$(date +%s)
              if "$bin" --exact "$name" 2>&1 | tr -d '\r' | grep -q '^test result: ok\. 1 passed; 0 failed'; then
                passes=$((passes + 1))
              fi
              t=$(($(date +%s) - t0))
              if [ "$t" -gt "$slowest" ]; then slowest=$t; fi
            done
            printf 'LOOP %s runs %s passes %s seconds %s slowest %s\n' "$name" "$runs" "$passes" "$(($(date +%s) - begun))" "$slowest"
            if [ "$passes" -ne "$runs" ]; then status=1; fi
          done
          left=$(find target/tmp -maxdepth 1 -name 'halvo-sqlcipher-page-gap-*' 2>/dev/null | wc -l | tr -d ' ')
          printf 'LOOP entries left under target/tmp named halvo-sqlcipher-page-gap-: %s\n' "$left"
          if [ "$left" -ne 0 ]; then status=1; fi
          exit "$status"
      - name: "E3 stop 1 of halvo-sqlcipher's build: SQLITE_ENABLE_STAT4 is defined (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          status=0
          words="halvo-sqlcipher: the build stops: SQLITE_ENABLE_STAT4 is defined"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-DSQLITE_ENABLE_STAT4" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 1 CFLAGS=-DSQLITE_ENABLE_STAT4: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 1 CFLAGS=-DSQLITE_ENABLE_STAT4: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E3 stop 2 of halvo-sqlcipher's build: SQLITE_TEMP_STORE is not 2 (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          status=0
          words="halvo-sqlcipher: the build stops: SQLITE_TEMP_STORE is not 2"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-DSQLITE_TEMP_STORE=4" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 2 CFLAGS=-DSQLITE_TEMP_STORE=4: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 2 CFLAGS=-DSQLITE_TEMP_STORE=4: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E3 stop 3 of halvo-sqlcipher's build: SQLITE_DEFAULT_AUTOVACUUM is not 0 (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          status=0
          words="halvo-sqlcipher: the build stops: SQLITE_DEFAULT_AUTOVACUUM is not 0"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-DSQLITE_DEFAULT_AUTOVACUUM=1" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 3 CFLAGS=-DSQLITE_DEFAULT_AUTOVACUUM=1: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 3 CFLAGS=-DSQLITE_DEFAULT_AUTOVACUUM=1: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E3 stop 4 of halvo-sqlcipher's build: BTS_FAST_SECURE is not defined, so the database's code is not compiled in this file (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          status=0
          words="halvo-sqlcipher: the build stops: BTS_FAST_SECURE is not defined, so the database's code is not compiled in this file"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-DSQLITE_AMALGAMATION" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 4 CFLAGS=-DSQLITE_AMALGAMATION: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 4 CFLAGS=-DSQLITE_AMALGAMATION: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E3 stop 5 of halvo-sqlcipher's build: SQLITE_HAS_CODEC is not defined (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          status=0
          words="halvo-sqlcipher: the build stops: SQLITE_HAS_CODEC is not defined"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-USQLITE_HAS_CODEC" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 5 CFLAGS=-USQLITE_HAS_CODEC: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 5 CFLAGS=-USQLITE_HAS_CODEC: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E3 stop 6 of halvo-sqlcipher's build: SQLITE_DEFAULT_SYNCHRONOUS or SQLITE_DEFAULT_WAL_SYNCHRONOUS is not 2 (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          status=0
          words="halvo-sqlcipher: the build stops: SQLITE_DEFAULT_SYNCHRONOUS or SQLITE_DEFAULT_WAL_SYNCHRONOUS is not 2"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-DSQLITE_DEFAULT_SYNCHRONOUS=1" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 6 CFLAGS=-DSQLITE_DEFAULT_SYNCHRONOUS=1: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 6 CFLAGS=-DSQLITE_DEFAULT_SYNCHRONOUS=1: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          CFLAGS="-DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 6 CFLAGS=-DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 6 CFLAGS=-DSQLITE_DEFAULT_WAL_SYNCHRONOUS=1: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E3 stop 7 of halvo-sqlcipher's build: SQLITE_DEBUG is defined (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          status=0
          words="halvo-sqlcipher: the build stops: SQLITE_DEBUG is defined"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-DSQLITE_DEBUG" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 7 CFLAGS=-DSQLITE_DEBUG: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 7 CFLAGS=-DSQLITE_DEBUG: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E3 stop 8 of halvo-sqlcipher's build: SQLITE_DEFAULT_PAGE_SIZE is not 4096 (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          status=0
          words="halvo-sqlcipher: the build stops: SQLITE_DEFAULT_PAGE_SIZE is not 4096"
          out="${RUNNER_TEMP:-/tmp}/e3-stop.out"
          CFLAGS="-DSQLITE_DEFAULT_PAGE_SIZE=8192" cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E3 STOP 8 CFLAGS=-DSQLITE_DEFAULT_PAGE_SIZE=8192: cargo build exit %s, the named line stands\n' "$code"
          else
            printf 'E3 NOT-STOPPED 8 CFLAGS=-DSQLITE_DEFAULT_PAGE_SIZE=8192: cargo build exit %s, the named line does not stand\n' "$code"
            tr -d '\r' <"$out" | grep -E 'error|warning: halvo' | head -n 5
            status=1
          fi
          exit "$status"
      - name: "E4 eighth source of halvo-sqlcipher's build: an anchor under a preprocessor branch (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          if [ "${RUNNER_OS:-}" = Windows ]; then py=python; else py=python3; fi
          home=${CARGO_HOME:-$HOME/.cargo}
          if [ "${RUNNER_OS:-}" = Windows ]; then home=$(cygpath -u "$home"); fi
          pinned=$(find "$home/registry/src" -path '*sqlcipher-src-419.0.6*' -name sqlcipher.c | head -n 1)
          if [ -z "$pinned" ]; then
            printf 'E4 NOT-STOPPED eighth source: no pinned sqlcipher.c under %s\n' "$home/registry/src"
            exit 1
          fi
          if [ "${RUNNER_OS:-}" = Windows ]; then pinned=$(cygpath -m "$pinned"); fi
          case_file="${RUNNER_TEMP:-/tmp}/anchor-under-ifdef.c"
          out="${RUNNER_TEMP:-/tmp}/e4-case.out"
          script="${RUNNER_TEMP:-/tmp}/e4-case.py"
          cat >"$script" <<'PYEOF'
          import hashlib, sys
          pinned, case, build_rs = sys.argv[1:4]
          lines = open(pinned, 'rb').read().split(b'\n')
          assert lines[81514] == b'' and lines[81516] == b'  pPg->nCell = (u16)nNew;'
          lines[81514] = b'#ifdef SQLITE_DEBUG'
          lines[81517:81517] = [b'#else', b'  pPg->nCell = (u16)(nNew & 0xffff);', b'#endif']
          data = b'\n'.join(lines)
          digest = hashlib.sha256(data).hexdigest()
          assert digest == 'aac3535daae016c418657f416e962ac11449412ee6697216cc99c656dacf91c1', digest
          open(case, 'wb').write(data)
          text = open(build_rs, newline='', encoding='utf-8').read()
          a = '    let pinned = source_dir.join(sqlcipher_src::SOURCE_FILE);'
          b = 'const PINNED_SHA256: &str = "838b2ed8a586b8b77f03e82c5a25b97e1a55e524ebac0de05354193865703072";'
          assert text.count(a) == 1 and text.count(b) == 1
          text = text.replace(a, '    let pinned = PathBuf::from("' + case.replace(chr(92), '/') + '");')
          text = text.replace(b, 'const PINNED_SHA256: &str = "' + digest + '";')
          open(build_rs, 'w', newline='', encoding='utf-8').write(text)
          print('E4 case written, sha256', digest)
          PYEOF
          $py -I "$script" "$pinned" "$case_file" crates/halvo-sqlcipher/build.rs || exit 1
          cargo build --locked -p halvo-sqlcipher >"$out" 2>&1
          code=$?
          git checkout -- crates/halvo-sqlcipher/build.rs
          printf 'E4 status lines after the restore: %s\n' "$(git status --porcelain | wc -l | tr -d ' ')"
          # shellcheck disable=SC2016
          words='looked for the line `  pPg->nCell = (u16)nNew;`, line 81517, outside every preprocessor branch opened after the text `static int editPage(`'
          if [ "$code" -ne 0 ] && tr -d '\r' <"$out" | grep -qF "$words"; then
            printf 'E4 STOP eighth source: cargo build exit %s, the named line stands\n' "$code"
            exit 0
          fi
          printf 'E4 NOT-STOPPED eighth source: cargo build exit %s, the named line does not stand\n' "$code"
          tr -d '\r' <"$out" | grep -E 'error|halvo-sqlcipher:' | head -n 5
          exit 1
      - name: Build
        shell: bash
        run: npm run tauri build
      - name: Version
        shell: bash
        run: test "$(target/release/bundle/macos/Halvo.app/Contents/MacOS/halvo --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-macos
          path: target/release/bundle/macos/Halvo.app
          if-no-files-found: error
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows
      - name: "Loop of the new or changed tests of halvo-sqlcipher (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          start=$(date +%s)
          out=$(cargo test --locked -p halvo-sqlcipher --lib --no-run 2>&1)
          bin=$(printf '%s\n' "$out" | tr -d '\r' | sed -n 's/.*Executable unittests src.lib\.rs (\(.*\))$/\1/p' | head -n 1 | tr '\134' '/')
          if [ -z "$bin" ]; then
            printf '%s\n' "$out"
            exit 1
          fi
