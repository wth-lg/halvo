name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 30-mutants 30-formal-covered 30-core-boundary-proofs 30-store-ignore-reason 15-r3-test-dirs 25-store-peak-rss 31-store-full-volume 54-tag-needs-store4
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 30-mutants 30-formal-covered 30-core-boundary-proofs 30-store-ignore-reason 15-r3-test-dirs 25-store-peak-rss 31-store-full-volume 54-tag-needs-store4
      - name: Loop (m200, 200 rounds)
        if: always()
        shell: bash
        run: |
          set +e
          pass=0; n=0
          while [ "$n" -lt 200 ]; do
            n=$((n + 1))
            if ( cargo test --locked -p halvo-capture --lib -- --exact store::hardening_tests::full_flush::each_write_of_the_durable_helper_makes_the_full_flush_call_and_refuses_when_it_fails store::hardening_tests::full_flush::each_commit_of_the_store_flushes_its_log_with_the_full_flush_call store::hardening_tests::full_flush::the_truncating_checkpoint_of_an_expiry_flushes_the_database_before_the_files_removal store::hardening_tests::full_flush::the_root_steps_zero_fill_and_its_roots_folder_are_flushed_and_a_failed_folder_flush_reads_left store::hardening_tests::full_flush::full_flush_child_for_parent store::hardening_tests::an_open_whose_synchronous_or_fullfsync_reads_back_otherwise_is_refused_by_its_name store::hardening_tests::a_file_that_gains_a_second_name_before_the_kept_open_is_not_written_through store::hardening_tests::held_roots::row20_a_file_of_another_length_at_a_root_name_keeps_its_mode_and_its_bytes > "$RUNNER_TEMP/m200.out" 2>&1 && grep -q "test result: ok. 8 passed; 0 failed" "$RUNNER_TEMP/m200.out" ) >"$RUNNER_TEMP/loop-m200-$n.log" 2>&1; then pass=$((pass + 1)); else echo "round $n failed:"; tail -n 40 "$RUNNER_TEMP/loop-m200-$n.log"; tail -n 60 "$RUNNER_TEMP/"*.out; fi
          done
          echo "loop m200: passed $pass of 200"
          [ "$pass" -eq 200 ]
      - name: Loop (m20, 20 rounds)
        if: always()
        shell: bash
        run: |
          set +e
          pass=0; n=0
          while [ "$n" -lt 20 ]; do
            n=$((n + 1))
            if ( cargo test --locked -p halvo-capture --lib -- --exact store::hardening_tests::held_roots::st49_a_mark_writes_through_at_a_partial_name_of_its_own_id_alone > "$RUNNER_TEMP/m20.out" 2>&1 && grep -q "test result: ok. 1 passed; 0 failed" "$RUNNER_TEMP/m20.out" ) >"$RUNNER_TEMP/loop-m20-$n.log" 2>&1; then pass=$((pass + 1)); else echo "round $n failed:"; tail -n 40 "$RUNNER_TEMP/loop-m20-$n.log"; tail -n 60 "$RUNNER_TEMP/"*.out; fi
          done
          echo "loop m20: passed $pass of 20"
          [ "$pass" -eq 20 ]
      - name: Full-flush counts of store-3c
        if: always()
        shell: bash
        run: |
          set +e
          cargo test --locked -p halvo-capture --lib -- --exact store::hardening_tests::full_flush::each_write_of_the_durable_helper_makes_the_full_flush_call_and_refuses_when_it_fails store::hardening_tests::full_flush::each_commit_of_the_store_flushes_its_log_with_the_full_flush_call store::hardening_tests::full_flush::the_truncating_checkpoint_of_an_expiry_flushes_the_database_before_the_files_removal store::hardening_tests::full_flush::the_root_steps_zero_fill_and_its_roots_folder_are_flushed_and_a_failed_folder_flush_reads_left --nocapture --test-threads=1 >"$RUNNER_TEMP/fullflush.out" 2>&1
          code=$?
          grep -o 'FULLFLUSH.*' "$RUNNER_TEMP/fullflush.out" | sed 's/ on=.*//'
          grep 'test result:' "$RUNNER_TEMP/fullflush.out"
          grep -q 'test result: ok. 4 passed; 0 failed' "$RUNNER_TEMP/fullflush.out" || code=1
          exit "$code"
      - name: Rows of store-3c by name
        if: always()
        shell: bash
        run: |
          set +e
          sh scripts/r1-gate/mutation-test.sh --only owed-pending-mark-destroys-its-root --only durable-file-flush-taken-out --only durable-flush-without-the-full-flag --only durable-failed-full-flush-answers-ok --only durable-directory-flush-taken-out --only open-leaves-fullfsync-off --only open-sets-synchronous-normal --only fullfsync-not-read-back --only synchronous-not-read-back --only expiry-checkpoint-after-the-key-clear-taken-out --only expiry-checkpoint-after-the-files-removal --only made-mark-named-by-the-store --only an-absent-root-name-counts-as-removed --only cleanup-by-a-made-mark-destroys-by-id --only cleanup-drops-the-fate-of-a-partial-name --only cleanup-by-identity-answers-ok-on-an-unlistable-directory --only mode-set-before-the-identity-is-compared --only mode-before-the-by-name-read-at-a-plain-name --only mode-before-the-name-decides-on-the-path-by-identity --only identity-step-writes-at-a-plain-name --only by-name-read-taken-out --only unwritten-removal-reads-destroyed --only root-zero-fill-flush-taken-out --only roots-folder-flush-taken-out --only roots-folder-flush-answer-dropped --only failed-folder-flush-still-reads-destroyed --only failed-folder-flush-still-reads-listed --only cleanup-folder-flush-answer-dropped --only mode-before-the-by-name-read-at-a-root-name --only by-name-read-at-a-plain-name-alone --only kept-handle-test-taken-out-at-a-plain-name --only kept-handle-count-ignored-on-the-path-by-identity --only mark-writes-at-a-partial-name-of-another-id --only mark-partial-rule-negated --only mark-partial-rule-on-the-stores-path --only mark-partial-of-another-id-written-through >"$RUNNER_TEMP/rows.out" 2>&1
          code=$?
          cat "$RUNNER_TEMP/rows.out"
          grep -q 'mutation rows: 36 caught, 0 failed' "$RUNNER_TEMP/rows.out" || code=1
          echo "rows step: exit $code"
          exit "$code"
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default -c core.fileMode=true "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 30-formal-covered 30-core-boundary-proofs 30-store-ignore-reason 15-r3-test-dirs 54-tag-needs-store4
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 30-formal-covered 30-core-boundary-proofs 30-store-ignore-reason 15-r3-test-dirs 54-tag-needs-store4
      - name: Loop (w200, 200 rounds)
        if: always()
        shell: bash
        run: |
          set +e
          pass=0; n=0
          while [ "$n" -lt 200 ]; do
            n=$((n + 1))
            if ( cargo test --locked -p halvo-capture --lib -- --exact store::hardening_tests::an_open_whose_synchronous_or_fullfsync_reads_back_otherwise_is_refused_by_its_name store::hardening_tests::a_file_that_gains_a_second_name_before_the_kept_open_is_not_written_through > "$RUNNER_TEMP/w200.out" 2>&1 && grep -q "test result: ok. 2 passed; 0 failed" "$RUNNER_TEMP/w200.out" ) >"$RUNNER_TEMP/loop-w200-$n.log" 2>&1; then pass=$((pass + 1)); else echo "round $n failed:"; tail -n 40 "$RUNNER_TEMP/loop-w200-$n.log"; tail -n 60 "$RUNNER_TEMP/"*.out; fi
          done
          echo "loop w200: passed $pass of 200"
          [ "$pass" -eq 200 ]
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
