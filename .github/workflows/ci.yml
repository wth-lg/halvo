name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # scratch: the U0.6 round of CP-179 H12, the windows job alone; never merged
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: r3 U0.6 drive crate tests
        if: always()
        shell: bash
        run: cd tools/r3-trials/drive && cargo test --locked --no-fail-fast
      - name: r3 U0.6 new tests 200 times
        if: always()
        shell: bash
        run: |
          cd tools/r3-trials/drive
          PY=$(command -v python3 || command -v python)
          cargo test --locked --no-run --message-format=json > "$RUNNER_TEMP/r3-drive-build.json"
          "$PY" -c 'import json, sys; [print(j["executable"]) for j in map(json.loads, open(sys.argv[1])) if j.get("reason") == "compiler-artifact" and j.get("profile", {}).get("test") and j.get("executable")]' "$RUNNER_TEMP/r3-drive-build.json" > "$RUNNER_TEMP/r3-drive-bins-raw.txt"
          tr -d '\r' < "$RUNNER_TEMP/r3-drive-bins-raw.txt" | tr '\\' '/' > "$RUNNER_TEMP/r3-drive-bins.txt"
          echo "repeat binaries=$(grep -c . "$RUNNER_TEMP/r3-drive-bins.txt") cr_bytes_taken_out=$(tr -dc '\r' < "$RUNNER_TEMP/r3-drive-bins-raw.txt" | wc -c | tr -d ' ')"
          for t in body::tests::a_body_counts_when_it_holds_text_and_no_marker_or_address body::tests::a_body_names_no_host_ip_port_or_at_sign_in_any_form body::tests::a_marker_split_by_a_line_end_is_not_seen body::tests::the_words_of_a_body_are_trimmed_of_their_punctuation drive::tests::a_failed_request_of_a_confirmed_click_without_its_extracts_ends_the_compile drive::tests::a_fill_select_or_press_on_a_credential_line_is_refused drive::tests::a_page_with_a_credential_line_is_handed_back_and_not_put_to_the_model drive::tests::a_refused_credential_action_and_an_allowed_effect_are_counted_once drive::tests::the_cap_of_asks_is_32 drive::tests::a_run_passes_on_its_steps_and_its_list_and_counts_the_effects_beyond_those_allowed drive::tests::a_target_among_lines_of_one_role_and_name_is_found_again_by_its_place drive::tests::at_most_three_handbacks_in_a_row_then_the_run_ends drive::tests::the_rule_lets_a_request_leave_for_a_confirmed_click_or_press_with_its_extracts fixture::tests::the_run_line_counts_the_sign_ins_and_the_state_changing_requests lines::tests::the_drive_line_takes_the_largest_of_the_five_runs_and_sums_the_counts tests::a_snapshot_line_gives_its_reference_role_and_name tests::the_repair_names_the_changed_control tests::the_repair_of_an_extract_names_the_line_under_the_step_name tests::the_right_walk_hands_back_extracts_selects_and_pays action::tests::an_action_gives_its_verb_word_and_its_reference tests::the_modes_of_ruling_cp_179_give_their_replies body::tests::a_body_of_two_words_does_not_count body::tests::a_closed_block_with_an_answer_gives_the_answer body::tests::a_closing_mark_alone_cuts_at_it body::tests::a_mark_left_after_the_cut_gives_no_body body::tests::a_marker_inside_the_block_and_none_after_it_counts body::tests::an_open_block_has_no_body body::tests::an_output_at_the_token_limit_has_no_body body::tests::two_blocks_give_the_text_after_the_last drive::tests::a_carried_out_repeat_on_an_unchanged_page_stores_no_second_step drive::tests::a_compile_is_ok_only_with_one_request_that_the_fixture_counts_as_one_entry drive::tests::a_replayed_step_stored_without_a_request_ends_the_replay_when_it_sets_one_off drive::tests::a_run_reaches_its_bound_at_2000_seconds_without_its_lock_wait drive::tests::no_request_leaves_once_one_has_left_and_a_second_ends_the_run fixture::tests::the_counts_of_a_run_are_read_as_numbers tests::recoveries_come_from_the_level_medium tests::the_arguments_are_read_and_checked words::tests::a_carried_out_action_says_done_and_what_it_did words::tests::a_select_on_a_line_that_is_no_select_control_names_its_role words::tests::each_refusal_line_names_its_cause_as_built words::tests::every_refusal_and_no_other_line_holds_the_mark_of_a_refusal words::tests::the_history_line_names_the_fields words::tests::the_prompt_holds_the_goal_the_names_and_the_steps_and_no_page_text; do
            bin=
            while read -r b; do
              if "$b" --list --exact "$t" 2>/dev/null | grep -q ': test$'; then bin=$b; fi
            done < "$RUNNER_TEMP/r3-drive-bins.txt"
            [ -n "$bin" ] || echo "repeat test=$t binary=none"
            pass=0
            i=0
            while [ "$i" -lt 200 ]; do
              i=$((i + 1))
              if [ -n "$bin" ] && "$bin" --exact "$t" -q 2>&1 | grep -q '1 passed'; then pass=$((pass + 1)); fi
            done
            echo "repeat test=$t runs=200 passed=$pass"
          done
          for s in verdict.py rebuild.py; do
            pass=0
            i=0
            while [ "$i" -lt 200 ]; do
              i=$((i + 1))
              if "$PY" -I "$s" --self-test > /dev/null 2>&1; then pass=$((pass + 1)); fi
            done
            echo "repeat test=$s runs=200 passed=$pass"
          done
      - name: r3 U0.6 fixture self-test
        if: always()
        shell: bash
        run: node tools/fixture-server/variants/selftest.mjs
      - name: r3 U0.6 control cells
        if: always()
        shell: bash
        run: |
          for cell in right:bill right:order effect_early:bill effect_early:order option_then_right:bill option_then_right:order sign_in_click:bill option_line:bill extract_then_click:bill option_twice_then_right:bill extract_to_cap:bill effect_twice:bill; do
            mode=${cell%%:*}
            task=${cell#*:}
            sh tools/r3-trials/drive/control.sh --mode "$mode" --task "$task" --browser "C:/Program Files/Google/Chrome/Application/chrome.exe" --port 18190 || echo "control script mode=$mode task=$task exit=$?"
          done
