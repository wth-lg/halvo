name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 35-r6-outcomes 30-r6-table 10-r6-layout
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 35-r6-outcomes 30-r6-table 10-r6-layout
      - name: Loop of U0.2b's new tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          names='a_driver_file_whose_one_attempt_line_is_indented_or_written_attempt_is_refused_at_its_line a_line_of_a_known_word_after_spaces_and_tabs_or_in_another_letter_case_is_refused_at_its_line a_line_of_a_known_word_written_another_way_is_refused_in_file_order the_golden_no_writer_driver_file_as_u02_wrote_it_is_refused_at_driver_48 a_limits_line_of_bill_or_order_beside_a_verdict_with_no_driver_is_refused_at_its_line a_limits_line_of_reply_beside_a_verdict_with_no_writer_is_refused_at_its_line a_limits_line_beside_a_named_driver_or_writer_or_of_another_task_stands a_limits_line_is_checked_with_the_verdicts_lines_in_file_order lines_that_are_not_known_are_passed_over'
          count=9
          runs=${LOOP_RUNS:-200}
          start=$(date +%s)
          mkdir -p target
          cargo test --locked -p halvo-route-gate --test import_rules --no-run >target/loop-build.txt 2>&1
          build=$?
          bin=$(sed -n 's/^ *Executable tests.import_rules\.rs (\(.*\))$/\1/p' target/loop-build.txt | tail -n 1 | tr '\\' '/')
          found=no
          [ -n "$bin" ] && [ -f "$bin" ] && found=yes
          echo "loop build exit=$build binary_found=$found"
          ok=0
          bad=0
          i=0
          while [ "$i" -lt "$runs" ]; do
            i=$((i + 1))
            "$bin" --exact $names --test-threads 4 >target/loop-run.txt 2>&1
            if grep -q "^test result: ok\. $count passed; 0 failed" target/loop-run.txt; then
              ok=$((ok + 1))
            else
              bad=$((bad + 1))
              echo "loop run $i:"
              grep -E '^test .* FAILED$|^test result' target/loop-run.txt
            fi
          done
          end=$(date +%s)
          echo "loop u02b tests=$count runs=$runs passes=$ok misses=$bad seconds=$((end - start))"
          [ "$ok" = "$runs" ]
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 35-r6-outcomes 30-r6-table 10-r6-layout
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 35-r6-outcomes 30-r6-table 10-r6-layout
      - name: Loop of U0.2b's new tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          names='a_driver_file_whose_one_attempt_line_is_indented_or_written_attempt_is_refused_at_its_line a_line_of_a_known_word_after_spaces_and_tabs_or_in_another_letter_case_is_refused_at_its_line a_line_of_a_known_word_written_another_way_is_refused_in_file_order the_golden_no_writer_driver_file_as_u02_wrote_it_is_refused_at_driver_48 a_limits_line_of_bill_or_order_beside_a_verdict_with_no_driver_is_refused_at_its_line a_limits_line_of_reply_beside_a_verdict_with_no_writer_is_refused_at_its_line a_limits_line_beside_a_named_driver_or_writer_or_of_another_task_stands a_limits_line_is_checked_with_the_verdicts_lines_in_file_order lines_that_are_not_known_are_passed_over'
          count=9
          runs=${LOOP_RUNS:-200}
          start=$(date +%s)
          mkdir -p target
          cargo test --locked -p halvo-route-gate --test import_rules --no-run >target/loop-build.txt 2>&1
          build=$?
          bin=$(sed -n 's/^ *Executable tests.import_rules\.rs (\(.*\))$/\1/p' target/loop-build.txt | tail -n 1 | tr '\\' '/')
          found=no
          [ -n "$bin" ] && [ -f "$bin" ] && found=yes
          echo "loop build exit=$build binary_found=$found"
          ok=0
          bad=0
          i=0
          while [ "$i" -lt "$runs" ]; do
            i=$((i + 1))
            "$bin" --exact $names --test-threads 4 >target/loop-run.txt 2>&1
            if grep -q "^test result: ok\. $count passed; 0 failed" target/loop-run.txt; then
              ok=$((ok + 1))
            else
              bad=$((bad + 1))
              echo "loop run $i:"
              grep -E '^test .* FAILED$|^test result' target/loop-run.txt
            fi
          done
          end=$(date +%s)
          echo "loop u02b tests=$count runs=$runs passes=$ok misses=$bad seconds=$((end - start))"
          [ "$ok" = "$runs" ]
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
