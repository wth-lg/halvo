name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 10-r5-layout 20-r5-rule 50-r5-drift 55-r5-routine
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 10-r5-layout 20-r5-rule 50-r5-drift 55-r5-routine
      - name: Loop of the unit's tests, 200 runs
        if: always()
        shell: bash
        run: |
          set +e
          names=(tests::lines::a_run_that_sends_exactly_lines_held_max_lines_finishes_as_today tests::lines::a_run_one_line_past_lines_held_max_is_a_lost_run_and_the_next_run_learns_as_today tests::lines::a_log_body_that_arrives_twice_counts_its_lines_once tests::lines::one_held_line_takes_at_most_16_bytes_and_lines_held_max_of_them_at_most_65_536_bytes tests::kinds::each_planted_row_is_refused_by_its_parser_and_names_its_workflow tests::kinds::a_refused_learn_edit_row_stops_the_edit_side_of_its_workflow_and_nothing_else tests::kinds::a_refused_learn_run_row_makes_the_runs_of_its_workflow_lost_runs_and_stops_nothing_else tests::kinds::a_refused_learn_run_row_that_comes_after_a_runs_start_makes_it_a_lost_run tests::kinds::a_run_started_while_its_run_rows_were_stopped_stays_lost_after_the_refused_row_leaves_by_its_bound tests::kinds::a_refused_learn_routine_row_stops_the_routine_rows_of_its_workflow_and_no_run tests::kinds::a_refused_row_whose_workflow_cannot_be_read_stops_its_kind_for_every_workflow tests::kinds::a_learning_commit_that_the_store_refuses_leaves_the_agent_stores_reply tests::kinds::a_start_run_that_arrives_again_at_runs_held_max_drops_no_other_held_run tests::kinds::a_start_run_that_arrives_again_after_its_refused_commit_stores_no_run_row_and_the_run_stays_lost tests::kinds::a_start_run_that_arrives_again_after_its_stopped_run_rows_left_by_their_bound_stores_no_run_row tests::kinds::a_start_run_that_arrives_again_where_its_row_stands_and_its_start_is_held_stores_the_due_routine_row_alone tests::starts::a_start_after_a_stop_behind_the_state_call_of_create_agent_stores_the_routine_row_with_the_runs_row tests::starts::a_start_after_a_refused_commit_of_create_agent_stores_the_routine_row tests::starts::a_pair_whose_rows_left_by_their_bound_gets_rev_1_at_its_next_start tests::starts::under_a_clock_set_back_so_that_the_old_rows_are_read_again_the_newest_row_by_the_one_rule_is_written_again tests::starts::the_newest_row_is_written_again_at_30_and_92_days_with_the_mark_none_and_not_at_29_days_or_with_stale tests::starts::a_routine_read_that_fails_leaves_the_agent_stores_reply_and_the_runs_row_and_writes_no_routine_row tests::starts::a_start_run_that_arrives_again_where_the_runs_row_stands_stores_the_missing_routine_row_alone tests::starts::a_start_run_that_arrives_again_after_both_rows_stand_changes_nothing tests::starts::the_start_writes_again_the_later_of_two_rows_of_one_rev_when_the_read_visits_it_last tests::starts::the_start_writes_again_the_later_of_two_rows_of_one_rev_when_the_read_visits_it_first tests::mark::two_replies_that_carried_different_edits_for_a_step_give_it_no_clean_use tests::mark::two_replies_that_carried_two_different_edits_for_a_step_give_it_no_clean_use tests::mark::two_replies_that_carried_different_edits_lay_a_counted_failure_on_the_edit_of_the_last_reply tests::mark::a_newer_revision_of_the_same_edit_between_two_replies_leaves_the_clean_use tests::mark::a_reply_under_another_number_than_the_loaded_one_changes_nothing_that_the_run_holds tests::ends::a_counted_line_then_an_accepted_end_run_stores_the_runs_rev_2_and_reverts_the_edit tests::ends::the_number_is_read_before_the_end_run_is_passed_on_to_a_store_that_refuses_a_load_after_the_end tests::ends::an_end_run_of_a_run_with_a_start_and_no_load_leaves_rev_1 tests::ends::an_end_run_after_an_answered_finish_stores_nothing tests::ends::an_end_run_that_the_agent_store_refuses_stores_nothing_and_drops_the_facts tests::ends::a_store_fault_at_the_commit_of_an_end_run_leaves_the_reply_accepted_the_rows_and_no_facts tests::ends::a_store_fault_at_the_commit_of_a_finish_leaves_the_reply_the_rows_and_no_facts tests::ends::an_end_run_after_a_stop_between_a_compiles_two_commits_withdraws_the_lower_edit_and_reverts_nothing tests::ends::a_store_fault_at_the_handlers_own_load_before_an_end_run_commits_nothing_and_returns_the_agent_stores_reply tests::ends::an_end_run_after_step_ok_on_the_step_of_a_provisional_edit_keeps_the_edit_served tests::ends::an_end_run_after_a_counted_failure_of_an_active_edit_keeps_the_edit_served tests::refinements::of_two_routine_rows_of_one_rev_list_refinements_takes_the_row_of_the_later_day_as_the_step_does tests::refinements::of_two_routine_rows_of_one_rev_and_different_days_the_step_and_list_refinements_take_the_same_row tests::pins::a_compile_run_that_loads_has_its_run_row_at_rev_2_after_its_finish tests::pins::an_end_run_drops_the_facts_of_its_run tests::finish::refusal_cross_workflow_source tests::ruled::g4_an_end_run_under_another_agent_drops_nothing)
          want=${#names[@]}
          bin=${LOOP_BIN:-}
          if [ -z "$bin" ]; then
            built=$(cargo test --locked -p halvo-learn-store --lib --no-run 2>&1)
            bin=$(printf '%s\n' "$built" | sed -n 's/^ *Executable unittests src.lib\.rs (\(.*\))$/\1/p' | tail -n 1)
            bin=${bin//\\//}
          fi
          found=no
          [ -n "$bin" ] && found=yes
          printf 'loop binary_found=%s tests_per_run=%s\n' "$found" "$want"
          pass=0
          fail=0
          first=-
          start=$(date +%s)
          for i in $(seq 1 200); do
            out=$("$bin" --exact "${names[@]}" 2>&1)
            status=$?
            if [ "$first" = - ]; then
              first=$(printf '%s\n' "$out" | sed -n 's/^test result: .* finished in \([0-9.]*\)s$/\1/p' | head -n 1)
              first=${first:-none}
            fi
            if [ "$status" -eq 0 ] && printf '%s\n' "$out" | grep -q "^test result: ok\. $want passed; 0 failed"; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1))
              printf 'loop run=%s exit=%s\n' "$i" "$status"
              printf '%s\n' "$out" | grep -E '^test .* FAILED$|^test result' | head -n 20
            fi
          done
          end=$(date +%s)
          printf 'loop runs=200 passed=%s failed=%s tests_per_run=%s seconds=%s first_run_seconds=%s\n' "$pass" "$fail" "$want" "$((end - start))" "$first"
          exit 0
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
