name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test
      - name: U4.6 round 2 loop of the new tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          export CARGO_BUILD_JOBS=4
          bad=0
          cargo test -p halvo-agent-client --locked --no-run --message-format=json > "$RUNNER_TEMP/u46-build.json" 2> "$RUNNER_TEMP/u46-build.err"
          echo "u46 build exit=$?"
          exe() {
            node -e 'const fs=require("fs");const want=process.argv[2];for(const l of fs.readFileSync(process.argv[1],"utf8").split("\n")){if(!l.startsWith("{"))continue;const m=JSON.parse(l);if(m.reason==="compiler-artifact"&&m.executable&&m.target&&m.target.name===want&&m.profile&&m.profile.test){console.log(m.executable.replace(/\\/g,"/"));break}}' "$RUNNER_TEMP/u46-build.json" "$1"
          }
          run_loop() {
            target=$1; n=$2; threads=$3; shift 3
            bin=$(exe "$target")
            want=$#
            if [ -z "$bin" ]; then echo "u46 loop $target: no executable"; bad=1; return; fi
            pass=0; fail=0; start=$(date +%s)
            for _ in $(seq 1 "$n"); do
              out=$("$bin" --exact --test-threads "$threads" "$@" 2>&1)
              if printf '%s\n' "$out" | grep -q "^test result: ok\. $want passed; 0 failed"; then
                pass=$((pass + 1))
              else
                fail=$((fail + 1))
                printf '%s\n' "$out" | grep -E "^test .* FAILED$|^test result|panicked" | head -6
              fi
            done
            end=$(date +%s)
            echo "u46 loop $target runs=$n passed=$pass failed=$fail tests=$want seconds=$((end - start))"
            if [ "$fail" -ne 0 ] || [ "$pass" -ne "$n" ]; then bad=1; fi
          }
          run_loop start 200 4 \
            a_runner_that_exits_with_2_and_leaves_a_child_that_ends_by_itself_records_what_its_system_ended \
            a_start_whose_runner_exits_with_the_status_2_answers_not_started_with_that_exit \
            a_start_of_a_running_run_id_with_a_relative_path_answers_started_and_makes_nothing \
            a_start_of_a_running_run_id_whose_value_read_fails_on_that_call_answers_started_and_makes_nothing \
            a_start_with_a_relative_browser_of_a_run_id_whose_mark_of_an_earlier_life_stands_answers_started \
            a_start_refused_for_a_relative_path_leaves_no_entry_and_the_same_run_id_then_starts
          run_loop reap 200 4 \
            a_kill_and_a_start_answer_while_a_reap_of_many_left_trees_runs \
            a_link_swapped_in_for_profiles_agents_or_the_data_directory_while_reap_holds_profiles_takes_nothing_outside \
            an_entry_swapped_for_a_link_after_the_listing_is_removed_as_a_link_and_what_it_names_stays
          run_loop reap 20 1 reap_answers_alive_for_a_runner_that_lives_and_cannot_be_ended_and_keeps_its_mark
          own02=a_run_started_while_reap_is_held_after_its_listing_keeps_its_profile
          bin=$(exe reap)
          first=$(node -e 'console.log(Date.now())')
          "$bin" --exact "$own02" > /dev/null 2>&1
          last=$(node -e 'console.log(Date.now())')
          ms=$((last - first))
          echo "u46 own-02 one run took ms=$ms"
          if [ "$ms" -lt 2000 ]; then run_loop reap 200 1 "$own02"; else run_loop reap 20 1 "$own02"; fi
          run_loop acts 200 8 \
            three_add_origin_replies_of_another_id_and_then_an_acknowledgement_still_bind \
            three_add_origin_error_replies_or_replies_of_another_form_and_then_an_acknowledgement_still_bind \
            a_confirm_or_a_secret_after_a_cancel_written_while_allow_origin_runs_ends_the_run_unasked \
            a_confirm_or_a_secret_after_a_cancel_written_while_the_add_origin_waits_ends_the_run_unasked \
            a_store_of_finish_after_a_cancel_during_an_open_handback_stays_a_lost_flow \
            an_add_origin_acknowledged_after_the_library_wrote_cancel_gives_the_runner_no_bind_reply \
            a_confirm_after_a_done_account_link_and_its_reply_is_answered_and_the_run_ends_with_its_done
          "$(exe start)" --exact --nocapture a_runner_that_exits_with_2_and_leaves_a_child_that_ends_by_itself_records_what_its_system_ended 2>&1 | grep -E "u46 refused" | head -2
          "$(exe reap)" --exact --nocapture a_kill_and_a_start_answer_while_a_reap_of_many_left_trees_runs a_link_swapped_in_for_profiles_agents_or_the_data_directory_while_reap_holds_profiles_takes_nothing_outside 2>&1 | grep -E "u46 (calls|swap)" | head -4
          echo "u46 loop bad=$bad"
          exit "$bad"
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: U4.6 round 2 loop of the new tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          export CARGO_BUILD_JOBS=4
          bad=0
          cargo test -p halvo-agent-client --locked --no-run --message-format=json > "$RUNNER_TEMP/u46-build.json" 2> "$RUNNER_TEMP/u46-build.err"
          echo "u46 build exit=$?"
          exe() {
            node -e 'const fs=require("fs");const want=process.argv[2];for(const l of fs.readFileSync(process.argv[1],"utf8").split("\n")){if(!l.startsWith("{"))continue;const m=JSON.parse(l);if(m.reason==="compiler-artifact"&&m.executable&&m.target&&m.target.name===want&&m.profile&&m.profile.test){console.log(m.executable.replace(/\\/g,"/"));break}}' "$RUNNER_TEMP/u46-build.json" "$1"
          }
          run_loop() {
            target=$1; n=$2; threads=$3; shift 3
            bin=$(exe "$target")
            want=$#
            if [ -z "$bin" ]; then echo "u46 loop $target: no executable"; bad=1; return; fi
            pass=0; fail=0; start=$(date +%s)
            for _ in $(seq 1 "$n"); do
              out=$("$bin" --exact --test-threads "$threads" "$@" 2>&1)
              if printf '%s\n' "$out" | grep -q "^test result: ok\. $want passed; 0 failed"; then
                pass=$((pass + 1))
              else
                fail=$((fail + 1))
                printf '%s\n' "$out" | grep -E "^test .* FAILED$|^test result|panicked" | head -6
              fi
            done
            end=$(date +%s)
            echo "u46 loop $target runs=$n passed=$pass failed=$fail tests=$want seconds=$((end - start))"
            if [ "$fail" -ne 0 ] || [ "$pass" -ne "$n" ]; then bad=1; fi
          }
          run_loop start 200 4 \
            a_runner_that_exits_with_2_and_leaves_a_child_that_ends_by_itself_records_what_its_system_ended \
            a_start_whose_runner_exits_with_the_status_2_answers_not_started_with_that_exit \
            a_start_of_a_running_run_id_with_a_relative_path_answers_started_and_makes_nothing \
            a_start_of_a_running_run_id_whose_value_read_fails_on_that_call_answers_started_and_makes_nothing \
            a_start_with_a_relative_browser_of_a_run_id_whose_mark_of_an_earlier_life_stands_answers_started \
            a_start_refused_for_a_relative_path_leaves_no_entry_and_the_same_run_id_then_starts
          run_loop reap 200 4 \
            a_kill_and_a_start_answer_while_a_reap_of_many_left_trees_runs \
            a_link_swapped_in_for_profiles_agents_or_the_data_directory_while_reap_holds_profiles_takes_nothing_outside \
            an_entry_swapped_for_a_link_after_the_listing_is_removed_as_a_link_and_what_it_names_stays
          run_loop reap 20 1 reap_answers_alive_for_a_runner_that_lives_and_cannot_be_ended_and_keeps_its_mark
          own02=a_run_started_while_reap_is_held_after_its_listing_keeps_its_profile
          bin=$(exe reap)
          first=$(node -e 'console.log(Date.now())')
          "$bin" --exact "$own02" > /dev/null 2>&1
          last=$(node -e 'console.log(Date.now())')
          ms=$((last - first))
          echo "u46 own-02 one run took ms=$ms"
          if [ "$ms" -lt 2000 ]; then run_loop reap 200 1 "$own02"; else run_loop reap 20 1 "$own02"; fi
          run_loop acts 200 8 \
            three_add_origin_replies_of_another_id_and_then_an_acknowledgement_still_bind \
            three_add_origin_error_replies_or_replies_of_another_form_and_then_an_acknowledgement_still_bind \
            a_confirm_or_a_secret_after_a_cancel_written_while_allow_origin_runs_ends_the_run_unasked \
            a_confirm_or_a_secret_after_a_cancel_written_while_the_add_origin_waits_ends_the_run_unasked \
            a_store_of_finish_after_a_cancel_during_an_open_handback_stays_a_lost_flow \
            an_add_origin_acknowledged_after_the_library_wrote_cancel_gives_the_runner_no_bind_reply \
            a_confirm_after_a_done_account_link_and_its_reply_is_answered_and_the_run_ends_with_its_done
          "$(exe start)" --exact --nocapture a_runner_that_exits_with_2_and_leaves_a_child_that_ends_by_itself_records_what_its_system_ended 2>&1 | grep -E "u46 refused" | head -2
          "$(exe reap)" --exact --nocapture a_kill_and_a_start_answer_while_a_reap_of_many_left_trees_runs a_link_swapped_in_for_profiles_agents_or_the_data_directory_while_reap_holds_profiles_takes_nothing_outside 2>&1 | grep -E "u46 (calls|swap)" | head -4
          echo "u46 loop bad=$bad"
          exit "$bad"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
