          printf '== base %s\n' "$base"
          case_run b-icmp "$RUNNER_TEMP/b9-base" C:/Windows/System32/PING.EXE -n 2 -w 1000 192.0.2.1
          ps_case b-w1-undo "$RUNNER_TEMP/b9-base" "$ps1/undo.ps1"
          ps_case b-w7-kill-runner "$RUNNER_TEMP/b9-base" "$ps1/kill-runner.ps1" -Out "$winout\\b-w7.txt"
          sleep 30
          printf 'b-w7 the surviving tree wrote: %s\n' "$(tr -d '\r' <"$out/b-w7.txt" 2>/dev/null || printf none)"
          state after-base-runs
