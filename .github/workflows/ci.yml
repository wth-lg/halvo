          def out(line):
              sys.stdout.write(line + "\n")
              sys.stdout.flush()


          def apply(text, old, new, what):
              n = text.count(old)
              if n != 1:
                  raise SystemExit("WDC %s: its old text is found %d times, not once" % (what, n))
              return text.replace(old, new, 1)


          def read(path):
              with open(path, "rb") as f:
                  data = f.read()
              return data.decode("utf-8").replace("\r\n", "\n"), b"\r\n" in data


          def write(path, text, crlf):
              data = text.replace("\r\n", "\n")
              if crlf:
                  data = data.replace("\n", "\r\n")
              with open(path, "wb") as f:
                  f.write(data.encode("utf-8"))


          def forced(text):
              for fid, _, old, new in FORCED:
                  text = apply(text, old, new, fid)
              return text


          def changed(text, cid):
              for c in CHANGES:
                  if c[0] == cid:
                      if c[1] == "forced":
                          text = forced(text)
                      return apply(text, c[3], c[4], cid)
              raise SystemExit("WDC no change " + cid)


          def restore(root):
              subprocess.run(["git", "checkout", "--", PATH], cwd=root, check=True)


          def check(clone, outdir, ids):
              os.makedirs(outdir, exist_ok=True)
              env = dict(os.environ)
              env["PATH"] = os.path.expanduser("~/.cargo/bin") + os.pathsep + env.get("PATH", "")
              env["TMPDIR"] = "/private/tmp/r1-builder-134-scratch/tmp"
              env["CARGO_BUILD_JOBS"] = "4"
              env["CARGO_TARGET_DIR"] = "/private/tmp/r1-builder-134-scratch/target"
              stub = os.path.expanduser("~/.wstack/runs/20261108-halvo-r1-capture/bin/static-analyzer/stub-cc.sh")
              env["CC_x86_64_pc_windows_msvc"] = stub
              env["AR_x86_64_pc_windows_msvc"] = stub
              file = os.path.join(clone, PATH)
              head, crlf = read(file)
              base = subprocess.run(["git", "show", BASE + ":" + PATH], cwd=clone, capture_output=True, check=True).stdout.decode("utf-8")
              plan = [("head", head), ("head-forced", forced(head)), ("base-forced", forced(base))]
              plan += [(c[0], changed(head, c[0])) for c in CHANGES]
              if ids:
                  plan = [p for p in plan if p[0] in ids]
              rows = open(os.path.join(outdir, "check.tsv"), "a")
              try:
                  for pid, text in plan:
                      write(file, text, crlf)
                      start = time.time()
                      r = subprocess.run(["cargo", "check", "--locked", "--target", "x86_64-pc-windows-msvc", "-p", "halvo-capture",
                                          "--lib", "--tests"], cwd=clone, env=env, capture_output=True)
                      log = r.stdout.decode("utf-8", "replace") + r.stderr.decode("utf-8", "replace")
                      with open(os.path.join(outdir, pid + ".log"), "w") as f:
                          f.write(log + "\ncheck_exit=%d\n" % r.returncode)
                      errors = [l for l in log.splitlines() if l.startswith("error") or l.startswith("warning: unused")]
                      checked = "Checking halvo-capture" in log
                      row = "%s\t%d\t%s\t%d\t%s" % (pid, r.returncode, "checked" if checked else "NOT-REBUILT", round(time.time() - start),
                                                    errors[0][:160] if errors else "-")
                      rows.write(row + "\n")
                      rows.flush()
                      out(row)
                      restore(clone)
              finally:
                  restore(clone)
                  rows.close()


          def build(root):
              r = subprocess.run(["cargo", "test", "--locked", "-p", "halvo-capture", "--lib", "--no-run", "--message-format", "json"],
                                 cwd=root, capture_output=True)
              exe = None
              for line in r.stdout.decode("utf-8", "replace").splitlines():
                  if not line.startswith("{"):
                      continue
                  m = json.loads(line)
                  if m.get("reason") == "compiler-artifact" and m.get("target", {}).get("name") == "halvo_capture" \
                          and "lib" in m.get("target", {}).get("kind", []) and m.get("profile", {}).get("test") and m.get("executable"):
                      exe = m["executable"]
              err = r.stderr.decode("utf-8", "replace")
              first = [l for l in err.splitlines() if l.startswith("error")]
              return r.returncode, exe, first[:3], "Compiling halvo-capture" in err


          def run_test(exe, name):
              start = time.time()
              try:
                  r = subprocess.run([exe, "--exact", MOD + name, "--test-threads=1"], capture_output=True, timeout=TEST_LIMIT_S,
                                     stdin=subprocess.DEVNULL)
              except subprocess.TimeoutExpired:
                  return "HANG", ["killed after %d s" % TEST_LIMIT_S], time.time() - start
              text = (r.stdout + r.stderr).decode("utf-8", "replace").replace("\r\n", "\n")
              lines = text.split("\n")
              if "test result: ok. 1 passed; 0 failed" in text:
                  return "ok", [l for l in lines if l.startswith("test result:")], time.time() - start
              keep = [l for l in lines if "panicked at" in l or l.startswith("  left:") or l.startswith(" right:")
                      or l.startswith("assertion") or l.startswith("test result:") or "running 0 tests" in l]
              return "RED", keep[:8], time.time() - start


          def seven(exe, label):
              verdicts = {}
              for tid, name in TESTS:
                  v, keep, secs = run_test(exe, name)
                  verdicts[tid] = (v, keep)
                  out("WDC %s %s %s %s %.2f s" % (label, tid, name, v, secs))
                  for l in keep:
                      out("WDC   | " + l)
              return verdicts


          def hosted(part):
              root = os.getcwd()
              file = os.path.join(root, PATH)
              head, crlf = read(file)
              ok = True
              try:
                  if part == "loop":
                      code, exe, first, _ = build(root)
                      if code != 0 or not exe:
                          out("WDC loop: the head's test build failed: exit %d %s" % (code, first))
                          return 1
                      for tid, name in TESTS:
                          runs = 200 if tid == "T0" else 20
                          passed, start, secs = 0, time.time(), []
                          for i in range(runs):
                              v, keep, s = run_test(exe, name)
                              secs.append(s)
                              if v == "ok":
                                  passed += 1
                              else:
                                  out("WDC loop round %d of %s: %s" % (i + 1, name, v))
                                  for l in keep:
                                      out("WDC   | " + l)
                          secs.sort()
                          out("loop win-detector-clock: %s: passed %d of %d in %d s (median %.2f s, longest %.2f s a run)"
                              % (name, passed, runs, round(time.time() - start), secs[len(secs) // 2], secs[-1]))
                          ok = ok and passed == runs
                      return 0 if ok else 1
                  if part == "forced":
                      have = subprocess.run(["git", "cat-file", "-e", BASE + "^{commit}"], cwd=root, capture_output=True).returncode == 0
                      if have:
                          out("WDC the base commit is in the checkout; no fetch")
                      else:
                          f = subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", BASE], cwd=root, capture_output=True)
                          out("WDC fetch of the base exited %d" % f.returncode)
                      base = subprocess.run(["git", "show", BASE + ":" + PATH], cwd=root, capture_output=True, check=True).stdout.decode("utf-8")
                      results = {}
                      for label, text in [("base-plain", base), ("base-forced", forced(base)), ("head-forced", forced(head))]:
                          write(file, text, crlf)
                          code, exe, first, compiled = build(root)
                          out("WDC %s build exit %d compiled=%s" % (label, code, compiled))
                          if code != 0 or not exe:
                              out("WDC %s: build failed %s" % (label, first))
                              return 1
                          results[label] = seven(exe, label)
                      t0 = results["base-forced"]["T0"]
                      base_red = t0[0] == "RED" and any(HOSTED_WORDS in l for l in t0[1]) and any(HOSTED_PLACE in l for l in t0[1])
                      head_green = all(v[0] == "ok" for v in results["head-forced"].values())
                      base_plain = all(v[0] == "ok" for v in results["base-plain"].values())
                      base_all_red = all(v[0] != "ok" for v in results["base-forced"].values())
                      out("WDC base plain all seven ok: %s" % base_plain)
                      out("WDC base forced, the named test red with the hosted line at %s: %s" % (HOSTED_PLACE, base_red))
                      out("WDC base forced, every one of the seven not ok: %s" % base_all_red)
                      out("WDC head forced, all seven ok: %s" % head_green)
                      out("WDC failing_first line 1: %s" % ("PASS" if base_red and head_green else "FAIL"))
                      return 0 if base_red and head_green else 1
                  if part == "changes":
                      write(file, forced(head), crlf)
                      code, exe, first, compiled = build(root)
                      control = seven(exe, "control-head-forced") if code == 0 and exe else {}
                      if not control or not all(v[0] == "ok" for v in control.values()):
                          out("WDC the control (the head under the forced form) is not green; the changes are not judged")
                          return 1
                      counts = {"red": 0, "hang": 0, "does-not-compile": 0, "green": 0}
                      for c in CHANGES:
                          write(file, changed(head, c[0]), crlf)
                          code, exe, first, compiled = build(root)
                          if code != 0 or not exe:
                              out("WDC change %s form=%s expect=%s result=does-not-compile :: %s" % (c[0], c[1], c[5], c[2]))
                              for l in first:
                                  out("WDC   | " + l)
                              counts["does-not-compile"] += 1
                              continue
                          v = seven(exe, c[0])
                          hangs = [t for t in v if v[t][0] == "HANG"]
                          reds = [t for t in v if v[t][0] == "RED"]
                          result = "hang" if hangs and not reds else ("red" if reds else "green")
                          counts[result] += 1
                          out("WDC change %s form=%s expect=%s result=%s compiled=%s red=%s hang=%s :: %s" % (
                              c[0], c[1], c[5], result, compiled, ",".join(reds) or "-", ",".join(hangs) or "-", c[2]))
                      out("WDC changes: %d; red %d, hang %d, does-not-compile %d, green %d" % (
                          len(CHANGES), counts["red"], counts["hang"], counts["does-not-compile"], counts["green"]))
                      return 0
                  out("WDC unknown part " + part)
                  return 2
              finally:
                  restore(root)


          if __name__ == "__main__":
              try:
                  sys.stdout.reconfigure(errors="backslashreplace")
              except AttributeError:
                  pass
              if len(sys.argv) > 1 and sys.argv[1] == "check":
                  check(sys.argv[2], sys.argv[3], sys.argv[4:])
              else:
                  sys.exit(hosted(os.environ.get("WDC_PART", "")))
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
