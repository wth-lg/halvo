        run: sh scripts/ci/run-ci-d.sh windows --self-test 19-control-links-no-store 21-tree-bans 19-home-paths
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 19-control-links-no-store 21-tree-bans 19-home-paths
      - name: control-2c tests 200 times
        shell: bash
        run: |
          set +e
          tmp="${RUNNER_TEMP:-/tmp}"
          found=0
          bad=0
          for bin in target/debug/deps/halvo_control-*; do
            case "$bin" in *.d|*.pdb|*.rlib|*.rmeta|*.lib|*.dll) continue ;; esac
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            "$bin" --list >"$tmp/control-2c-list.txt" 2>&1
            tr -d '\r' <"$tmp/control-2c-list.txt" | sed -n 's/: test$//p' >"$tmp/control-2c-held.txt"
            want=""
            n=0
            for name in client::tests::e111_d_an_already_deleted_that_answers_no_request_is_its_own_error_with_the_id_and_not_a_kind_string client::tests::pl17_the_busy_of_a_life_that_is_ending_is_its_own_error_of_the_client client::tests::pl17_told_04_a_delete_while_capture_reads_pausing_answers_busy_and_deletes_nothing client::tests::with_every_source_off_a_claim_and_a_resume_read_faulted_no_source ctl_text::tests::ct12_a_deleted_reply_with_root_destroyed_unknown_prints_both_streams_of_c2_6_and_exits_0 ctl_text::tests::pl17_the_busy_of_a_life_that_is_ending_exits_75_with_a_line_that_names_what_did_not_happen instance_lock::tests::st36_a_link_whose_target_is_away_and_a_file_at_the_name_are_a_cause_of_their_own_from_the_read_and_the_take paths::tests::st36_a_file_at_the_data_directory_s_name_is_a_cause_of_its_own_and_never_a_first_run paths::tests::st36_a_link_whose_target_is_away_is_a_cause_of_its_own_and_a_link_to_a_directory_is_followed paths::tests::st36_check::a_chain_of_links_to_a_folder_is_followed_and_never_narrowed paths::tests::st36_check::a_data_directory_behind_a_parent_link_that_leads_nowhere_is_never_a_first_run paths::tests::st36_check::a_directory_never_reached_through_a_link_is_never_answered_as_linked_after_the_name_is_swapped paths::tests::st36_check::a_directory_of_another_owner_fails_through_the_seam_at_the_read_of_the_owner_and_is_not_narrowed paths::tests::st36_check::a_directory_reached_through_a_link_is_never_narrowed_even_after_the_name_is_swapped_after_the_take paths::tests::st36_check::a_link_loop_and_a_chain_of_links_that_ends_away_lead_nowhere paths::tests::st36_check::a_link_to_a_directory_of_mode_0700_passes_and_names_the_resolved_folder paths::tests::st36_check::a_link_to_a_directory_of_mode_0755_fails_the_check_and_nothing_is_narrowed paths::tests::st36_check::a_link_whose_target_is_away_and_a_file_at_the_name_give_their_cause_and_a_missing_directory_none paths::tests::st36_check::a_parent_that_is_a_link_is_no_fault paths::tests::st