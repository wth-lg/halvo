name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: U0.7 web trial cells (scratch branch, never merged; counts only)
        shell: bash
        run: |
          set +e
          code=0
          command -v openssl >/dev/null 2>&1 && echo "openssl present=yes" || echo "openssl present=no"
          for b in "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge"; do
            [ -f "$b" ] || { echo "browser missing $(basename "$b" | tr ' ' '_')"; code=1; continue; }
            echo "browser before $("$b" --version | tr ' ' '_')"
            sh tools/r3-trials/web/run.sh --candidate cdp --browser "$b" --port 18190 --runs 10 || code=1
            sh tools/r3-trials/web/run.sh --candidate cdp --browser "$b" --port 18190 --runs 10 --rows isolation || code=1
            echo "browser after $("$b" --version | tr ' ' '_')"
          done
          exit $code
      - name: U0.7 trial workspaces, test and clippy (scratch branch, never merged; counts only)
        if: always()
        shell: bash
        run: |
          set +e
          code=0
          for crate in web profile; do
            log="$RUNNER_TEMP/r3-trial-$crate-test.log"
            (cd "tools/r3-trials/$crate" && cargo test --locked >"$log" 2>&1)
            t=$?
            passed=$(grep -o '[0-9]* passed' "$log" | awk '{s+=$1} END {print s+0}')
            failed=$(grep -o '[0-9]* failed' "$log" | awk '{s+=$1} END {print s+0}')
            ignored=$(grep -o '[0-9]* ignored' "$log" | awk '{s+=$1} END {print s+0}')
            clog="$RUNNER_TEMP/r3-trial-$crate-clippy.log"
            (cd "tools/r3-trials/$crate" && cargo clippy --locked --all-targets -- -D warnings >"$clog" 2>&1)
            c=$?
            errors=$(grep -c '^error' "$clog")
            echo "trial crate=$crate test_exit=$t passed=$passed failed=$failed ignored=$ignored clippy_exit=$c clippy_error_lines=$errors"
            [ "$t" -eq 0 ] && [ "$c" -eq 0 ] || code=1
          done
          exit $code

  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: U0.7 web trial cells (scratch branch, never merged; counts only)
        shell: bash
        run: |
          set +e
          code=0
          command -v openssl >/dev/null 2>&1 && echo "openssl present=yes" || echo "openssl present=no"
          for b in "C:/Program Files/Google/Chrome/Application/chrome.exe" "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"; do
            [ -f "$b" ] || { echo "browser missing $(basename "$b")"; code=1; continue; }
            sh tools/r3-trials/web/run.sh --candidate cdp --browser "$b" --port 18190 --runs 10 || code=1
            sh tools/r3-trials/web/run.sh --candidate cdp --browser "$b" --port 18190 --runs 10 --rows isolation || code=1
          done
          exit $code
      - name: U0.7 trial workspaces, test and clippy (scratch branch, never merged; counts only)
        if: always()
        shell: bash
        run: |
          set +e
          code=0
          for crate in web profile; do
            log="$RUNNER_TEMP/r3-trial-$crate-test.log"
            (cd "tools/r3-trials/$crate" && cargo test --locked >"$log" 2>&1)
            t=$?
            passed=$(grep -o '[0-9]* passed' "$log" | awk '{s+=$1} END {print s+0}')
            failed=$(grep -o '[0-9]* failed' "$log" | awk '{s+=$1} END {print s+0}')
            ignored=$(grep -o '[0-9]* ignored' "$log" | awk '{s+=$1} END {print s+0}')
            clog="$RUNNER_TEMP/r3-trial-$crate-clippy.log"
            (cd "tools/r3-trials/$crate" && cargo clippy --locked --all-targets -- -D warnings >"$clog" 2>&1)
            c=$?
            errors=$(grep -c '^error' "$clog")
            echo "trial crate=$crate test_exit=$t passed=$passed failed=$failed ignored=$ignored clippy_exit=$c clippy_error_lines=$errors"
            [ "$t" -eq 0 ] && [ "$c" -eq 0 ] || code=1
          done
          exit $code
