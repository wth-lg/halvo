name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Six secure-input hold rows to their end
        shell: bash
        run: |
          set +e
          sh scripts/r1-gate/mutation-test.sh --only hold-released-at-once --only refusal-reported-as-a-hold --only release-taken-out-of-the-drop --only production-hold-calls-swapped --only production-hold-gives-nothing-back --only production-hold-takes-nothing
          code=$?
          echo "mutation-test.sh exit $code"
          exit "$code"

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Not run on this scratch branch
        shell: bash
        run: echo "the windows job is cut to this one step on the scratch branch of verifier 129"
