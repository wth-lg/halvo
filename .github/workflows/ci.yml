name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 50-windows-functional
      - name: win-3 failing-first runs at the test-first commits
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          git fetch --quiet --deepen=60 origin "$GITHUB_REF" || true
          logs="$RUNNER_TEMP/w3-proof"
          mkdir -p "$logs"
          lib() {
            label=$1; commit=$2; shift 2
            git checkout --quiet --detach "$commit" || { echo "PROOF $label commit=$commit checkout=failed"; return; }
            cargo test --locked -p halvo-capture --lib -- "$@" >"$logs/$label-lib.log" 2>&1
            echo "PROOF $label commit=$(git rev-parse --short=8 HEAD) kind=lib exit=$?"
            tr -d '\r' <"$logs/$label-lib.log" | grep -E '^test .* \.\.\. |^test result|^error' | head -60
          }
          fc() {
            label=$1; commit=$2; shift 2
            git checkout --quiet --detach "$commit" || { echo "PROOF $label commit=$commit checkout=failed"; return; }
            for name in "$@"; do
              timeout 400 cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact "$name" --nocapture >"$logs/$label-fc.log" 2>&1
              echo "PROOF $label commit=$(git rev-parse --short=8 HEAD) kind=functional test=$name exit=$?"
              tr -d '\r' <"$logs/$label-fc.log" | grep -E '^TF |KNOWN-DEFECT|panicked at|^test result' | head -40
            done
          }
          lib pl2 aea6743a --exact windows::tests::a_source_whose_writer_is_gone_reads_failed_with_the_reason_writer_gone windows::screen::tests::a_closed_capture_item_reads_as_failed_health
          lib rr10 95a7fc03 --exact windows::foreground::tests::a_lookup_that_fails_after_a_success_leaves_the_cell_none windows::foreground::tests::a_new_process_whose_path_cannot_be_read_gives_a_record_with_no_app windows::foreground::tests::a_frame_host_window_names_the_process_that_it_hosts windows::foreground::tests::a_path_of_2000_bytes_keeps_at_most_1024_bytes_that_end_in_the_executable_name
          lib rr23 2e6953d5 --exact windows::foreground::tests::two_events_for_one_app_give_one_foreground_record_and_two_title_reads windows::foreground::tests::two_hosted_apps_under_one_frame_host_give_two_foreground_records
          lib rr08 14dd7eec --exact windows::window_title::tests::only_the_foreground_windows_own_name_change_is_a_title windows::window_title::tests::a_title_of_100000_units_is_read_up_to_the_cap windows::window_title::tests::a_title_with_an_unpaired_surrogate_is_read_without_a_panic
          lib rr16 7593344b --exact windows::input::tests::map_keystroke_gives_the_events_of_the_shared_list windows::input::tests::a_packet_of_vkey_255_is_no_event_and_changes_no_state
          lib rr27 d840d268 --exact windows::input::tests::decode_rejects_a_buffer_of_exactly_the_header_or_one_byte_short_of_its_record
          lib pl3 dca4a1f0 --exact windows::input::tests::a_raw_input_source_whose_removal_is_refused_answers_the_os_error_of_the_removal windows::foreground::tests::a_foreground_source_whose_unhook_fails_answers_the_os_error_of_the_unhook windows::window_title::tests::a_title_source_whose_unhook_fails_answers_the_os_error_of_the_unhook windows::screen::tests::a_session_whose_end_is_refused_answers_its_os_error_and_reads_failed
          fc pl3 dca4a1f0 a_timed_out_stop_reads_no_input_posted_after_its_answer
          lib gate fc24f3af secure_input::windows::tests::
          lib gate-review b718ab79 secure_input::windows::tests::
          fc gate fc24f3af c1_raw_input_delivers_keystrokes_and_pointer_events known_defect::x1_keystrokes_typed_into_a_password_field
          fc base 164a15ff known_defect::x1_keystrokes_typed_into_a_password_field known_defect::x3_attribution_before_the_first_foreground_change known_defect::x14_foreground_app_of_a_hosted_app known_defect::x2_window_title_events_for_other_windows_and_controls known_defect::title_event_on_a_switch_to_a_window_with_a_fixed_title known_defect::x15_a_held_key
          git checkout --quiet --detach "$GITHUB_SHA"
          echo "PROOF restored commit=$(git rev-parse --short=8 HEAD)"
      - name: win-3 one-rule changes at the head
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          git checkout --quiet --detach "$GITHUB_SHA"
          rows="$RUNNER_TEMP/w3-mutants.tsv"
          echo "" | base64 -d >"$rows"
          caught=0; survived=0; nobuild=0; unapplied=0; total=0
          while IFS="$(printf '\t')" read -r name file sub kind test; do
            [ -n "$name" ] || continue
            total=$((total + 1))
            W3_SUB=$sub perl -0777 -i -pe 'BEGIN { $s = $ENV{W3_SUB} } eval $s; die $@ if $@' "$file"
            if git diff --quiet -- "$file"; then
              echo "MUTANT $name verdict=not-applied"; unapplied=$((unapplied + 1)); continue
            fi
            if [ "$kind" = lib ]; then
              timeout 600 cargo test --locked -p halvo-capture --lib -- --exact "$test" >"$RUNNER_TEMP/w3-m.log" 2>&1
            else
              timeout 600 cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact "$test" --nocapture >"$RUNNER_TEMP/w3-m.log" 2>&1
            fi
            code=$?
            log=$(tr -d '\r' <"$RUNNER_TEMP/w3-m.log")
            if printf '%s\n' "$log" | grep -q '^error\(\[E[0-9]*\]\)\{0,1\}: '; then
              verdict=no-build; nobuild=$((nobuild + 1))
            elif [ "$code" -ne 0 ] && printf '%s\n' "$log" | grep -q "^test .* \.\.\. FAILED"; then
              verdict=caught; caught=$((caught + 1))
            elif [ "$code" -eq 0 ] && printf '%s\n' "$log" | grep -q 'test result: ok. 1 passed'; then
              verdict=survived; survived=$((survived + 1))
            else
              verdict=other-exit-$code
            fi
            echo "MUTANT $name test=$test verdict=$verdict"
            printf '%s\n' "$log" | grep -E 'panicked at|^test .* \.\.\. |^test result' | head -4
            git checkout --quiet -- "$file"
          done <"$rows"
          echo "MUTANTS total=$total caught=$caught survived=$survived no_build=$nobuild not_applied=$unapplied"
          git status --porcelain
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
