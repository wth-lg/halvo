name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Scratch branch of spike S3 (run 20261108-halvo-r1-capture): this job is cut
  # to one step so that it holds no macOS runner.
  macos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cut for spike S3
        shell: bash
        run: echo "spike S3 runs on the windows job only"

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the S3 probe
        shell: bash
        run: cargo build --release --locked --manifest-path tools/spike-s3/Cargo.toml
      - name: S3 probe
        shell: bash
        run: sh tools/spike-s3/run.sh
