name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# scratch: trimmed to the mutant runner's self-test at the head (mutants-2, ruling ST-28 E12 g); never merged
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Mutant runner self-test at the head (scratch, mutants-2)
        shell: bash
        run: |
          t0=$(date +%s)
          if sh scripts/r1-gate/mutation-test.sh --self-test -v > "$RUNNER_TEMP/selftest.out" 2>&1; then s=0; else s=$?; fi
          t1=$(date +%s)
          grep -v '^case .* want=PASS got=PASS$' "$RUNNER_TEMP/selftest.out" | grep -v '^case .* want=FAIL got=FAIL$' | tail -40
          echo "cases as wanted: $(grep -c -e 'want=PASS got=PASS$' -e 'want=FAIL got=FAIL$' "$RUNNER_TEMP/selftest.out")"
          echo "seconds runner-self-test-head $((t1 - t0)) exit $s"
          test "$s" -eq 0
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Mutant runner self-test at the head under Git Bash (scratch, mutants-2; records, never fails)
        shell: bash
        timeout-minutes: 30
        continue-on-error: true
        run: |
          t0=$(date +%s)
          if sh scripts/r1-gate/mutation-test.sh --self-test -v > "$RUNNER_TEMP/selftest.out" 2>&1; then s=0; else s=$?; fi
          t1=$(date +%s)
          echo "first lines that are not as wanted:"
          grep -v -e 'want=PASS got=PASS$' -e 'want=FAIL got=FAIL$' "$RUNNER_TEMP/selftest.out" | head -20
          echo "last lines:"
          tail -20 "$RUNNER_TEMP/selftest.out"
          echo "cases as wanted: $(grep -c -e 'want=PASS got=PASS$' -e 'want=FAIL got=FAIL$' "$RUNNER_TEMP/selftest.out")"
          echo "seconds runner-self-test-windows $((t1 - t0)) exit $s"
          exit 0
