          binaries = []
          if PACKAGES:
              args = []
              for p in PACKAGES:
                  if p not in SKIP:
                      args += ["-p", p]
              if args:
                  binaries += build(args, repo)
          if PROBES:
              binaries += build([], os.path.join(repo, "tools", "r2-probes"))
          seen = set()
          binaries = [b for b in binaries if not (b[2] in seen or seen.add(b[2]))]
          binaries.sort(key=lambda b: (b[0], b[1]))
          say(f"LOOP binaries: {len(binaries)} of packages {' '.join(sorted({b[0] for b in binaries}))}")

          tmp_root = os.environ.get("RUNNER_TEMP") or tempfile.gettempdir()
          real_tmp = tempfile.gettempdir()
          loop_tmp = tempfile.mkdtemp(prefix="loop-tmp-", dir=tmp_root)
          target_tmps = sorted({os.path.join(os.path.dirname(os.path.dirname(os.path.dirname(b[2]))), "tmp") for b in binaries})
          target_before = {t: entries(t) for t in target_tmps}
          real_before = entries(real_tmp)
          env = dict(os.environ, TMPDIR=loop_tmp, TMP=loop_tmp, TEMP=loop_tmp)

          red = False
          not_run = []
          for package, target, exe, manifest in binaries:
              if time.monotonic() - started > DEADLINE_S:
                  not_run.append(f"{package}/{target}")
                  continue
              run_env = dict(env, CARGO_MANIFEST_DIR=manifest, CARGO_PKG_NAME=package)
              passed = failed = 0
              first_fail = {}
              fail_count = {}
              rounds = ROUNDS
              t0 = time.monotonic()
              cut = None
              r = 0
              while r < rounds:
                  r += 1
                  if time.monotonic() - started > DEADLINE_S:
                      cut = r - 1
                      break
                  r0 = time.monotonic()
                  try:
                      out = subprocess.run([exe], cwd=manifest, env=run_env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=RUN_LIMIT_S)
                      code, text = out.returncode, out.stdout.decode("utf-8", "replace")
                  except subprocess.TimeoutExpired as e:
                      code, text = "timeout", (e.output or b"").decode("utf-8", "replace")
                  if r == 1 and time.monotonic() - r0 > SLOW_S and ROUNDS > SLOW_ROUNDS:
                      rounds = SLOW_ROUNDS
                      say(f"LOOP slow {package}/{target}: first run {time.monotonic() - r0:.1f} s, so {SLOW_ROUNDS} rounds")
                  if code == 0:
                      passed += 1
                      continue
                  failed += 1
                  names = failures(text) or [f"(binary exit {code})"]
                  for name in names:
                      fail_count[name] = fail_count.get(name, 0) + 1
                      if name not in first_fail:
                          first_fail[name] = r
                          say(f"LOOP failed {package}/{target} {name} first in round {r} (exit {code}); its output:")
