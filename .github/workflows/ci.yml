name: ci
# scratch: S-91 parts 1 and 3, the new store test unmutated and two rows with their failing lines; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: "S-91 parts 1 and 3: the new test unmutated, and two rows each with the first failing line of its test (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PROOF_TESTS: store::hardening_tests::a_shred_keeps_the_key_row_with_a_null_key_and_a_later_segment_takes_another_key_id
          PROOF_ROWS: key-row-deleted formal-shred-never-committed
        run: |
          set +e -u
          runner=${HALVO_STEP_RUNNER:-scripts/r1-gate/mutation-test.sh}
          cargo=${HALVO_STEP_CARGO:-cargo}
          tmp=${RUNNER_TEMP:-/tmp}
          status=0
          for test in $PROOF_TESTS; do
            out="$tmp/proof-unmutated-${test##*::}.out"
            "$cargo" test -q --locked -p halvo-capture --lib -- --exact "$test" >"$out" 2>&1
            code=$?
            result=$(grep -E '^test result:' "$out" | tail -n 1)
            printf 'PROOF unmutated %s: cargo exit %s; %s\n' "$test" "$code" "${result:-no result line}"
            grep -E '^running [0-9]+ tests?$' "$out" | tail -n 1 | sed 's/^/PROOF   /'
            [ -n "$result" ] || status=1
          done
          for row in $PROOF_ROWS; do
            out="$tmp/proof-row-$row.out"
            t0=$(date +%s)
            sh "$runner" --keep-scratch --only "$row" >"$out" 2>&1
            code=$?
            line=$(grep -E "^[A-Z-]+ mutation:$row \(" "$out" | tail -n 1)
            printf 'PROOF row %s: runner exit %s, seconds %s; %s\n' "$row" "$code" "$(($(date +%s) - t0))" "${line:-no line for the row}"
            grep -E '^(PASS|FAIL) unmutated|^mutation rows:' "$out" | sed 's/^/PROOF   /'
            [ -n "$line" ] || status=1
            scratch=$(sed -n 's/^scratch mutation: //p' "$out" | tail -n 1)
            if [ -n "$scratch" ] && [ -f "$scratch/work/test.out" ]; then
              awk '/panicked at/ { p = 1 } p && n < 5 { print; n++; next } /^test result:/ { print }' "$scratch/work/test.out" | cut -c1-700 | sed "s/^/PROOF   $row test.out: /"
            else
              printf 'PROOF   %s: no kept test output (scratch %s)\n' "$row" "${scratch:-not printed}"
              status=1
            fi
          done
          exit "$status"
