name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 38-app-engine-routes
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 38-app-engine-routes
      - name: Forced form 1 of 38-app-engine-routes (an address that the runner does not have)
        if: always()
        shell: bash
        run: |
          set +e
          job=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          temp=$RUNNER_TEMP
          if command -v cygpath > /dev/null 2>&1; then temp=$(cygpath -u "$temp"); fi
          base=05e6c22e1683fad39f087ce42b5bed2c7a44d732
          git show "$base:scripts/r1/ci.d/38-app-engine-routes.sh" > "$temp/base-38.sh"
          echo "forced form 1 ($job): the base's script read from $base: exit $?"
          for side in base head; do
            script=scripts/r1/ci.d/38-app-engine-routes.sh
            if [ "$side" = base ]; then script=$temp/base-38.sh; fi
            HALVO_MEASURE_TEST_IP=203.0.113.38 CI_D_JOB=$job sh "$script" "$job" > "$temp/forced1-$side.txt" 2>&1
            echo "forced form 1 ($job), $side: exit $?"
            grep -E '^38-app-engine-routes (image|steps|listeners|interface|measure listeners|measure row: s(03|18|20) |measured)|^(PASS|FAIL) 38-app-engine-routes' "$temp/forced1-$side.txt" | cut -c1-700
            n=$(grep -c interface "$temp/forced1-$side.txt")
            echo "forced form 1 ($job), $side: lines that hold the word interface: $n"
            for t in "$temp"/38-app-engine-routes.*/target; do
              if [ -d "$t" ]; then cargo clean --target-dir "$t" > /dev/null 2>&1; fi
            done
          done
          exit 0
      - name: Forced form 2 of 38-app-engine-routes (the address read at the start is gone at the first binds)
        if: always()
        shell: bash
        run: |
          set +e
          base=05e6c22e1683fad39f087ce42b5bed2c7a44d732
          git show "$base:scripts/r1/ci.d/38-app-engine-routes.sh" > "$RUNNER_TEMP/base-38.sh"
          echo "forced form 2: the base's script read from $base: exit $?"
          x=203.0.113.39
          iface=$(route -n get 192.0.2.1 | awk '/interface:/ {print $2}')
          echo "forced form 2: the interface of the route towards 192.0.2.1: $iface"
          real_py=$(command -v python3)
          real_cargo=$(command -v cargo)
          for side in base head; do
            script=scripts/r1/ci.d/38-app-engine-routes.sh
            if [ "$side" = base ]; then script=$RUNNER_TEMP/base-38.sh; fi
            f=$RUNNER_TEMP/forced2-$side
            mkdir -p "$f/bin"
            echo "$x" > "$f/report"
            echo 0 > "$f/builds"
            printf '#!/bin/sh\nif [ -f "%s/report" ]; then HALVO_MEASURE_TEST_IP=$(cat "%s/report"); export HALVO_MEASURE_TEST_IP; fi\nexec "%s" "$@"\n' "$f" "$f" "$real_py" > "$f/bin/python3"
            printf '#!/bin/sh\nn=$(($(cat "%s/builds") + 1))\necho "$n" > "%s/builds"\nif [ "$n" = 1 ]; then sudo ifconfig %s -alias %s; mv "%s/report" "%s/report.gone"; fi\nif [ "$n" = 2 ]; then sudo ifconfig %s alias %s netmask 255.255.255.255; fi\nexec "%s" "$@"\n' "$f" "$f" "$iface" "$x" "$f" "$f" "$iface" "$x" "$real_cargo" > "$f/bin/cargo"
            chmod +x "$f/bin/python3" "$f/bin/cargo"
            sudo ifconfig "$iface" alias "$x" netmask 255.255.255.255
            n=$(ifconfig "$iface" | grep -c "inet $x ")
            echo "forced form 2, $side: $x on $iface before the check: $n"
            PATH="$f/bin:$PATH" CI_D_JOB=macos sh "$script" macos > "$f.txt" 2>&1
            code=$?
            builds=$(cat "$f/builds")
            echo "forced form 2, $side: exit $code, builds $builds"
            grep -E '^38-app-engine-routes (image|steps|listeners|interface|measure listeners|measure row: s(03|18) |measured)|^(PASS|FAIL) 38-app-engine-routes' "$f.txt" | cut -c1-700
            sudo ifconfig "$iface" -alias "$x"
            n=$(ifconfig "$iface" | grep -c "inet $x ")
            echo "forced form 2, $side: $x on $iface after the check: $n"
            for t in "$RUNNER_TEMP"/38-app-engine-routes.*/target; do
              if [ -d "$t" ]; then cargo clean --target-dir "$t" > /dev/null 2>&1; fi
            done
          done
          exit 0
      - name: Loops of 38-app-engine-routes (the check 20 rounds, its self-test 20 rounds, its helper cases 200 rounds)
        if: always()
        shell: bash
        run: |
          set +e
          job=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          temp=$RUNNER_TEMP
          if command -v cygpath > /dev/null 2>&1; then temp=$(cygpath -u "$temp"); fi
          free=$(df -k "$temp" | awk 'END {print $4}')
          echo "free KiB under the runner's temp before the loops: $free"
          checks=0
          n=0
          while [ "$n" -lt 20 ]; do
            n=$((n + 1))
            start=$(date +%s)
            sh scripts/ci/run-ci-d.sh "$job" 38-app-engine-routes > "$temp/check-$n.log" 2>&1
            took=$(( $(date +%s) - start ))
            if grep -q '^PASS 38-app-engine-routes$' "$temp/check-$n.log"; then checks=$((checks + 1)); else echo "check round $n failed:"; tail -n 40 "$temp/check-$n.log"; fi
            grep -E '^38-app-engine-routes (listeners|interface) ' "$temp/check-$n.log" | sed "s/^/check round $n ($took s): /"
            for t in "$temp"/38-app-engine-routes.*/target; do
              if [ -d "$t" ]; then cargo clean --target-dir "$t" > /dev/null 2>&1; fi
            done
          done
          echo "loop check 38-app-engine-routes: passed $checks of 20"
          free=$(df -k "$temp" | awk 'END {print $4}')
          echo "free KiB under the runner's temp after the check loop: $free"
          pass=0
          line=
          n=0
          while [ "$n" -lt 20 ]; do
            n=$((n + 1))
            sh scripts/ci/run-ci-d.sh "$job" --self-test 38-app-engine-routes > "$temp/self-test-$n.log" 2>&1
            line=$(grep -m 1 '^PASS self-test:38-app-engine-routes ' "$temp/self-test-$n.log")
            if [ -n "$line" ]; then pass=$((pass + 1)); else echo "self-test round $n failed:"; tail -n 40 "$temp/self-test-$n.log"; fi
          done
          echo "loop self-test of 38-app-engine-routes: passed $pass of 20; the last result line: $line"
          py=python3
          command -v python3 > /dev/null 2>&1 || py=python
          d=$(mktemp -d)
          awk -v out="$d" '/^  cat > "\$1\/measure.py" <<.HELPEREOF.$/ { f = out "/measure.py"; next } /^  cat > "\$1\/cases.py" <<.CASESEOF.$/ { f = out "/cases.py"; next } /^(HELPEREOF|CASESEOF)$/ { f = ""; next } f != "" { print > f }' scripts/r1/ci.d/38-app-engine-routes.sh
          right=0
          rounds=0
          n=0
          while [ "$n" -lt 200 ]; do
            n=$((n + 1))
            mkdir -p "$d/$n"
            cp "$d/measure.py" "$d/cases.py" "$d/$n/"
            "$py" "$d/$n/cases.py" "$d/$n" > "$d/$n.out" 2>&1
            k=$(grep -c ' right$' "$d/$n.out")
            right=$((right + k))
            if [ "$k" = 6 ]; then rounds=$((rounds + 1)); else echo "helper cases round $n:"; cat "$d/$n.out"; fi
          done
          echo "loop helper cases of 38-app-engine-routes: $rounds of 200 rounds with 6 of 6 cases right ($right right of 1200)"
          [ "$checks" = 20 ] && [ "$pass" = 20 ] && [ "$rounds" = 200 ]
      - name: Lockfile unchanged
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" macos
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 38-app-engine-routes
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 38-app-engine-routes
      - name: Forced form 1 of 38-app-engine-routes (an address that the runner does not have)
        if: always()
        shell: bash
        run: |
          set +e
          job=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          temp=$RUNNER_TEMP
          if command -v cygpath > /dev/null 2>&1; then temp=$(cygpath -u "$temp"); fi
          base=05e6c22e1683fad39f087ce42b5bed2c7a44d732
          git show "$base:scripts/r1/ci.d/38-app-engine-routes.sh" > "$temp/base-38.sh"
          echo "forced form 1 ($job): the base's script read from $base: exit $?"
          for side in base head; do
            script=scripts/r1/ci.d/38-app-engine-routes.sh
            if [ "$side" = base ]; then script=$temp/base-38.sh; fi
            HALVO_MEASURE_TEST_IP=203.0.113.38 CI_D_JOB=$job sh "$script" "$job" > "$temp/forced1-$side.txt" 2>&1
            echo "forced form 1 ($job), $side: exit $?"
            grep -E '^38-app-engine-routes (image|steps|listeners|interface|measure listeners|measure row: s(03|18|20) |measured)|^(PASS|FAIL) 38-app-engine-routes' "$temp/forced1-$side.txt" | cut -c1-700
            n=$(grep -c interface "$temp/forced1-$side.txt")
            echo "forced form 1 ($job), $side: lines that hold the word interface: $n"
            for t in "$temp"/38-app-engine-routes.*/target; do
              if [ -d "$t" ]; then cargo clean --target-dir "$t" > /dev/null 2>&1; fi
            done
          done
          exit 0
      - name: Loops of 38-app-engine-routes (the check 20 rounds, its self-test 20 rounds, its helper cases 200 rounds)
        if: always()
        shell: bash
        run: |
          set +e
          job=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          temp=$RUNNER_TEMP
          if command -v cygpath > /dev/null 2>&1; then temp=$(cygpath -u "$temp"); fi
          free=$(df -k "$temp" | awk 'END {print $4}')
          echo "free KiB under the runner's temp before the loops: $free"
          checks=0
          n=0
          while [ "$n" -lt 20 ]; do
            n=$((n + 1))
            start=$(date +%s)
            sh scripts/ci/run-ci-d.sh "$job" 38-app-engine-routes > "$temp/check-$n.log" 2>&1
            took=$(( $(date +%s) - start ))
            if grep -q '^PASS 38-app-engine-routes$' "$temp/check-$n.log"; then checks=$((checks + 1)); else echo "check round $n failed:"; tail -n 40 "$temp/check-$n.log"; fi
            grep -E '^38-app-engine-routes (listeners|interface) ' "$temp/check-$n.log" | sed "s/^/check round $n ($took s): /"
            for t in "$temp"/38-app-engine-routes.*/target; do
              if [ -d "$t" ]; then cargo clean --target-dir "$t" > /dev/null 2>&1; fi
            done
          done
          echo "loop check 38-app-engine-routes: passed $checks of 20"
          free=$(df -k "$temp" | awk 'END {print $4}')
          echo "free KiB under the runner's temp after the check loop: $free"
          pass=0
          line=
          n=0
          while [ "$n" -lt 20 ]; do
            n=$((n + 1))
            sh scripts/ci/run-ci-d.sh "$job" --self-test 38-app-engine-routes > "$temp/self-test-$n.log" 2>&1
            line=$(grep -m 1 '^PASS self-test:38-app-engine-routes ' "$temp/self-test-$n.log")
            if [ -n "$line" ]; then pass=$((pass + 1)); else echo "self-test round $n failed:"; tail -n 40 "$temp/self-test-$n.log"; fi
          done
          echo "loop self-test of 38-app-engine-routes: passed $pass of 20; the last result line: $line"
          py=python3
          command -v python3 > /dev/null 2>&1 || py=python
          d=$(mktemp -d)
          awk -v out="$d" '/^  cat > "\$1\/measure.py" <<.HELPEREOF.$/ { f = out "/measure.py"; next } /^  cat > "\$1\/cases.py" <<.CASESEOF.$/ { f = out "/cases.py"; next } /^(HELPEREOF|CASESEOF)$/ { f = ""; next } f != "" { print > f }' scripts/r1/ci.d/38-app-engine-routes.sh
          right=0
          rounds=0
          n=0
          while [ "$n" -lt 200 ]; do
            n=$((n + 1))
            mkdir -p "$d/$n"
            cp "$d/measure.py" "$d/cases.py" "$d/$n/"
            "$py" "$d/$n/cases.py" "$d/$n" > "$d/$n.out" 2>&1
            k=$(grep -c ' right$' "$d/$n.out")
            right=$((right + k))
            if [ "$k" = 6 ]; then rounds=$((rounds + 1)); else echo "helper cases round $n:"; cat "$d/$n.out"; fi
          done
          echo "loop helper cases of 38-app-engine-routes: $rounds of 200 rounds with 6 of 6 cases right ($right right of 1200)"
          [ "$checks" = 20 ] && [ "$pass" = 20 ] && [ "$rounds" = 200 ]
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" windows
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
