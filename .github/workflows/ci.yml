name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 45-r4-words 10-r4-layout
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 45-r4-words 10-r4-layout
      - name: U2.4b loop of its added tests
        shell: bash
        run: |
          set -u
          out=$(cargo test -p halvo-coord --locked --no-run 2>&1) || { printf '%s\n' "$out" | tail -20; exit 1; }
          fail=0
          total=0
          while read -r target name; do
            b=$(printf '%s\n' "$out" | sed -n "s/.*Executable tests[/\\\\]$target\.rs (\(.*\))$/\1/p" | head -1)
            b=${b//\\//}
            if [ -z "$b" ]; then echo "loop $target $name binary=none"; fail=1; continue; fi
            ok=0
            for i in $(seq 1 200); do
              if "$b" --exact "$name" --test-threads 1 2>&1 | grep -q '^test result: ok. 1 passed; 0 failed'; then ok=$((ok+1)); fi
            done
            total=$((total+1))
            echo "loop $target $name passed=$ok of 200"
            [ "$ok" -eq 200 ] || fail=1
          done <<'EOF'
            commands_same the_answer_commands_require_the_step_and_answer_one_without_it_malformed
            coordinator_moves a_confirmations_say_new_and_say_gone_name_its_agent
            coordinator_moves a_second_answer_after_a_lost_acknowledgement_counts_the_same_choice_and_stores_a_later_decline
            coordinator_moves a_stored_done_whose_reply_was_lost_then_decline_stores_the_decline_and_sends_declined_in_both_orders
            coordinator_moves rd48a_a_stop_whose_cancel_panics_leaves_the_board_holding_it_at_each_lapse
            coordinator_moves rd48h_the_plain_queued_start_stays_through_a_stop_and_is_taken_at_the_next_end
            coordinator_moves rd52a_the_start_of_a_ready_item_answers_budget_and_queue_full_as_its_row_says
            coordinator_moves rd52b_a_stop_after_an_unseen_switch_off_stops_the_run_once
            coordinator_moves rd52b_a_switch_off_of_a_working_run_in_both_forms
            coordinator_moves rd52b_a_switch_off_while_the_owner_is_away_does_nothing
            coordinator_moves rd52b_a_switch_off_whose_hold_the_move_does_not_see_does_nothing_and_a_second_one_works
            coordinator_moves rd52b_a_switch_off_whose_hold_the_read_shows_lapses_stops_and_pauses_in_order
            coordinator_moves rd52b_a_switch_on_whose_hold_cleared_reply_is_lost_in_both_forms
            coordinator_moves rd52b_t_i_an_answer_whose_read_shows_a_stored_switch_off_stops_the_run_first
            coordinator_moves rd52c_a_handback_answer_whose_read_fails_or_shows_nothing_answers_the_stores_cause
            coordinator_moves rd52c_a_handback_answer_whose_row_the_read_shows_is_handed_in_that_move_for_each_kind
            coordinator_moves rd52c_a_read_that_fails_after_a_lost_store_logs_nothing_more
            coordinator_moves rd52c_a_read_that_shows_another_choice_as_the_newest_decides_by_rule_3
            coordinator_moves rd52c_a_stored_done_of_an_account_link_then_a_lost_decline_sends_declined
            coordinator_moves rd52c_after_a_busy_port_the_same_press_sends_again_with_no_second_row
            coordinator_moves rd52e_a_stop_while_the_run_of_a_gone_workflow_is_stopping_is_unknown_agent
            coordinator_moves rd61_t_a_link_done_then_a_decline_landing_unread_then_done_gives_declined_once
            coordinator_moves rd61_t_b_link_done_then_a_decline_landing_unread_then_decline_stores_no_third_row
            coordinator_moves rd61_t_c_link_done_then_a_decline_that_never_landed_then_done_stores_done_again
            coordinator_moves rd61_t_d_pin_link_done_then_a_known_decline_whose_call_was_busy_then_done_gives_declined
            coordinator_moves rd61_t_e_a_stored_done_not_taken_gets_no_lapse_and_no_done_at_any_end
            coordinator_moves rd61_t_f_a_stored_done_not_taken_then_decline_stores_two_rows_and_sends_declined_once
            coordinator_moves rd61_t_g_pin_a_stored_decline_not_taken_then_done_sends_declined_and_answers_unknown_item
            coordinator_moves rd61_t_h_the_clause_holds_for_stuck_and_a_sign_ins_first_step
            coordinator_moves rd61e_pin_an_answered_runs_check_then_an_unknown_effect_at_the_end_brings_the_holds_check
            coordinator_moves rd62a_pin_a_start_whose_read_brings_a_hold_failures_answers_hold_and_the_next_press_starts
            coordinator_moves rd62a_question_no_move_sends_paused_for_a_hold_failures_whose_acknowledgement_was_lost
            coordinator_moves rd73_a_confirm_request_of_more_effects_than_request_records_ends_its_run_with_kind
            coordinator_moves rd80_a_hide_forgets_the_report_of_a_shown_item_and_keeps_an_armed_one
            coordinator_moves rd80_a_page_answer_arms_in_its_own_move_from_the_report
            coordinator_moves rd80_an_answer_with_no_report_or_read_before_arm_ms_is_early
            coordinator_moves rd80_the_reports_causes_and_two_reports_keep_the_first
            coordinator_moves rd87_an_answer_of_a_step_that_is_no_longer_current_is_refused_with_state
            coordinator_moves rd87_each_refusal_by_name_changes_the_mark_and_an_owed_body_does_not
            coordinator_moves rd87_the_moves_that_ask_nothing_new_leave_the_mark
            coordinator_moves rd87_two_refusals_in_a_row_give_three_marks_for_one_id
            items_drive rd61c_a_read_of_another_move_that_brings_the_lost_row_ends_the_doubt_of_its_press
            roster_card rd48h_a_card_holds_the_entries_of_two_classes_in_the_order_of_the_reply
            schedule_drive rd52a_the_ticks_raise_of_a_ready_item_whose_read_shows_a_hold_raises_nothing
            schedule_drive rd52b_rule_4_the_switch_offs_guard_answers_by_a_read_where_a_live_run_stands
          EOF
          echo "loop tests=$total fail=$fail"
          exit $fail
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 20-r4-core 45-r4-words 10-r4-layout
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 20-r4-core 45-r4-words 10-r4-layout
      - name: U2.4b loop of its added tests
        shell: bash
        run: |
          set -u
          out=$(cargo test -p halvo-coord --locked --no-run 2>&1) || { printf '%s\n' "$out" | tail -20; exit 1; }
          fail=0
          total=0
          while read -r target name; do
            b=$(printf '%s\n' "$out" | sed -n "s/.*Executable tests[/\\\\]$target\.rs (\(.*\))$/\1/p" | head -1)
            b=${b//\\//}
            if [ -z "$b" ]; then echo "loop $target $name binary=none"; fail=1; continue; fi
            ok=0
            for i in $(seq 1 200); do
              if "$b" --exact "$name" --test-threads 1 2>&1 | grep -q '^test result: ok. 1 passed; 0 failed'; then ok=$((ok+1)); fi
            done
            total=$((total+1))
            echo "loop $target $name passed=$ok of 200"
            [ "$ok" -eq 200 ] || fail=1
          done <<'EOF'
            commands_same the_answer_commands_require_the_step_and_answer_one_without_it_malformed
            coordinator_moves a_confirmations_say_new_and_say_gone_name_its_agent
            coordinator_moves a_second_answer_after_a_lost_acknowledgement_counts_the_same_choice_and_stores_a_later_decline
            coordinator_moves a_stored_done_whose_reply_was_lost_then_decline_stores_the_decline_and_sends_declined_in_both_orders
            coordinator_moves rd48a_a_stop_whose_cancel_panics_leaves_the_board_holding_it_at_each_lapse
            coordinator_moves rd48h_the_plain_queued_start_stays_through_a_stop_and_is_taken_at_the_next_end
            coordinator_moves rd52a_the_start_of_a_ready_item_answers_budget_and_queue_full_as_its_row_says
            coordinator_moves rd52b_a_stop_after_an_unseen_switch_off_stops_the_run_once
            coordinator_moves rd52b_a_switch_off_of_a_working_run_in_both_forms
            coordinator_moves rd52b_a_switch_off_while_the_owner_is_away_does_nothing
            coordinator_moves rd52b_a_switch_off_whose_hold_the_move_does_not_see_does_nothing_and_a_second_one_works
            coordinator_moves rd52b_a_switch_off_whose_hold_the_read_shows_lapses_stops_and_pauses_in_order
            coordinator_moves rd52b_a_switch_on_whose_hold_cleared_reply_is_lost_in_both_forms
            coordinator_moves rd52b_t_i_an_answer_whose_read_shows_a_stored_switch_off_stops_the_run_first
            coordinator_moves rd52c_a_handback_answer_whose_read_fails_or_shows_nothing_answers_the_stores_cause
            coordinator_moves rd52c_a_handback_answer_whose_row_the_read_shows_is_handed_in_that_move_for_each_kind
            coordinator_moves rd52c_a_read_that_fails_after_a_lost_store_logs_nothing_more
            coordinator_moves rd52c_a_read_that_shows_another_choice_as_the_newest_decides_by_rule_3
            coordinator_moves rd52c_a_stored_done_of_an_account_link_then_a_lost_decline_sends_declined
            coordinator_moves rd52c_after_a_busy_port_the_same_press_sends_again_with_no_second_row
            coordinator_moves rd52e_a_stop_while_the_run_of_a_gone_workflow_is_stopping_is_unknown_agent
            coordinator_moves rd61_t_a_link_done_then_a_decline_landing_unread_then_done_gives_declined_once
            coordinator_moves rd61_t_b_link_done_then_a_decline_landing_unread_then_decline_stores_no_third_row
            coordinator_moves rd61_t_c_link_done_then_a_decline_that_never_landed_then_done_stores_done_again
            coordinator_moves rd61_t_d_pin_link_done_then_a_known_decline_whose_call_was_busy_then_done_gives_declined
            coordinator_moves rd61_t_e_a_stored_done_not_taken_gets_no_lapse_and_no_done_at_any_end
            coordinator_moves rd61_t_f_a_stored_done_not_taken_then_decline_stores_two_rows_and_sends_declined_once
            coordinator_moves rd61_t_g_pin_a_stored_decline_not_taken_then_done_sends_declined_and_answers_unknown_item
            coordinator_moves rd61_t_h_the_clause_holds_for_stuck_and_a_sign_ins_first_step
            coordinator_moves rd61e_pin_an_answered_runs_check_then_an_unknown_effect_at_the_end_brings_the_holds_check
            coordinator_moves rd62a_pin_a_start_whose_read_brings_a_hold_failures_answers_hold_and_the_next_press_starts
            coordinator_moves rd62a_question_no_move_sends_paused_for_a_hold_failures_whose_acknowledgement_was_lost
            coordinator_moves rd73_a_confirm_request_of_more_effects_than_request_records_ends_its_run_with_kind
            coordinator_moves rd80_a_hide_forgets_the_report_of_a_shown_item_and_keeps_an_armed_one
            coordinator_moves rd80_a_page_answer_arms_in_its_own_move_from_the_report
            coordinator_moves rd80_an_answer_with_no_report_or_read_before_arm_ms_is_early
            coordinator_moves rd80_the_reports_causes_and_two_reports_keep_the_first
            coordinator_moves rd87_an_answer_of_a_step_that_is_no_longer_current_is_refused_with_state
            coordinator_moves rd87_each_refusal_by_name_changes_the_mark_and_an_owed_body_does_not
            coordinator_moves rd87_the_moves_that_ask_nothing_new_leave_the_mark
            coordinator_moves rd87_two_refusals_in_a_row_give_three_marks_for_one_id
            items_drive rd61c_a_read_of_another_move_that_brings_the_lost_row_ends_the_doubt_of_its_press
            roster_card rd48h_a_card_holds_the_entries_of_two_classes_in_the_order_of_the_reply
