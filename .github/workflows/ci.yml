name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 12-test 50-windows-functional
      - name: win-2 x8 mend, x8 twenty times and the break proof of the margin
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          git checkout --quiet --detach "$GITHUB_SHA"
          log="$RUNNER_TEMP/w2-x8.log"
          failed=0
          before_runs=0
          for run in $(seq 1 20); do
            cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact x8_raw_input_across_the_integrity_boundary --nocapture >"$log" 2>&1
            code=$?
            body=$(tr -d '\r' <"$log")
            between=$(printf '%s\n' "$body" | sed -n 's/.*keystroke_events_from_the_elevated_phase_to_the_medium_phase=\([0-9]*\).*/\1/p' | head -n 1)
            least=$(printf '%s\n' "$body" | sed -n 's/.*least_medium_stamp_from_medium_from=\([-0-9a-z]*\).*/\1/p' | head -n 1)
            before=$(printf '%s\n' "$body" | sed -n 's/.*medium_stamps_before_medium_from=\([0-9]*\).*/\1/p' | head -n 1)
            period=$(printf '%s\n' "$body" | sed -n 's/.*tick_period_ms=\([0-9]*\) tick_period_from=\([a-z]*\).*/\1 \2/p' | head -n 1)
            stamps=$(printf '%s\n' "$body" | sed -n 's/.*stamps_from_medium_from=\(\[[-0-9,]*\]\).*/\1/p' | head -n 1)
            result=$(printf '%s\n' "$body" | grep -E '^test result' | head -n 1)
            echo "ROUND4 x8 run=$run exit=$code between_the_phases=${between:-none} least_medium_stamp_from_medium_from=${least:-none} medium_stamps_before_medium_from=${before:-none} period=${period:-none} stamps_from_medium_from=${stamps:-none}"
            [ "$code" -eq 0 ] || { failed=$((failed + 1)); printf '%s\n' "$body" | grep -E 'INCONCLUSIVE|panicked|reached a medium' | head -n 4; }
            [ "${before:-0}" -gt 0 ] && before_runs=$((before_runs + 1))
            echo "ROUND4 x8 run=$run $result"
          done
          echo "ROUND4 x8 runs=20 failed=$failed runs_with_a_medium_stamp_before_medium_from=$before_runs"
          file=crates/halvo-capture/tests/stamp_phases/mod.rs
          W3_SUB='s/(    if medium_from\.saturating_sub\(elevated_to\) <= 2 \* period \{)/    let period = 0 * period;\n$1/' perl -0777 -i -pe 'BEGIN { $s = $ENV{W3_SUB} } eval $s; die $@ if $@' "$file"
          echo "ROUND4 break-proof margin out: $(git diff --numstat -- "$file")"
          cargo test --locked -p halvo-capture --test windows_stamp_phases >"$log" 2>&1
          echo "ROUND4 break-proof margin out exit=$?"
          tr -d '\r' <"$log" | grep -E '^test .* \.\.\. |^test result'
          git checkout --quiet -- "$file"
          cargo test --locked -p halvo-capture --test windows_stamp_phases >"$log" 2>&1
          echo "ROUND4 stamp phases restored exit=$?"
          tr -d '\r' <"$log" | grep -E '^test result'
          git status --porcelain
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
