name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: win-3e, a loop of 200 over each pure case of stall::kinds (scratch, never merged)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/w3e-build.json" 2>"$RUNNER_TEMP/w3e-build.err"
          printf 'w3e loops build_exit=%s\n' "$?"
          sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/w3e-build.json" >"$RUNNER_TEMP/w3e-exe"
          exe=$(sed 's/\\\\/\//g' "$RUNNER_TEMP/w3e-exe")
          if [ ! -f "$exe" ]; then
            printf 'w3e loops no_test_executable=1\n'
            exit 1
          fi
          cat >"$RUNNER_TEMP/w3e-loops.txt" <<'W3E_EOF'
          200 stall::kinds::a_control_that_recorded_more_than_five_letters_fails
          200 stall::kinds::a_fault_of_the_first_batch_of_a_click_phase_still_fails_after_a_clean_second_batch
          200 stall::kinds::a_kind_with_no_phase_to_run_is_refused
          200 stall::kinds::a_native_phase_fails_each_of_its_own_faults
          200 stall::kinds::a_one_round_enter_phase_that_set_no_withheld_flag_fails
          200 stall::kinds::a_phase_before_the_before_control_or_after_the_after_control_fails
          200 stall::kinds::a_phase_between_the_two_controls_of_its_own_session_passes
          200 stall::kinds::a_phase_that_begins_with_an_open_latch_of_an_earlier_phase_fails
          200 stall::kinds::a_phase_that_counted_more_rounds_than_it_ran_fails
          200 stall::kinds::a_phase_that_the_controls_of_another_session_bracket_fails
          200 stall::kinds::a_phase_whose_control_recorded_fewer_than_five_letters_fails
          200 stall::kinds::a_phase_whose_text_of_open_latches_could_not_be_read_fails_by_those_words
          200 stall::kinds::a_phase_whose_two_controls_come_from_two_sessions_fails
          200 stall::kinds::each_check_of_a_phase_fails_its_own_fault_in_each_family
          200 stall::kinds::each_fault_of_a_family_still_fails_after_the_sum_that_a_live_phase_goes_through
          200 stall::kinds::each_kind_holds_its_own_phases_in_their_order
          200 stall::kinds::the_count_of_open_latches_is_read_from_the_text_of_the_gate
          200 stall::kinds::the_kinds_hold_one_phase_for_each_test_and_sub_case_that_they_replace
          200 stall::kinds::the_loop_over_the_phases_of_a_kind_prints_each_phase_and_keeps_each_failure
          W3E_EOF
          "$exe" --list --ignored </dev/null 2>&1 | tr -d '\r' | sed -n 's/^\(stall::kinds::[a-z0-9_]*\): test$/\1/p' | sort >"$RUNNER_TEMP/w3e-listed.txt"
          awk '{print $2}' "$RUNNER_TEMP/w3e-loops.txt" | sort >"$RUNNER_TEMP/w3e-written.txt"
          printf 'w3e loops listed=%s written=%s\n' "$(grep -c '' "$RUNNER_TEMP/w3e-listed.txt")" "$(grep -c '' "$RUNNER_TEMP/w3e-written.txt")"
          if ! cmp -s "$RUNNER_TEMP/w3e-listed.txt" "$RUNNER_TEMP/w3e-written.txt"; then
            printf 'w3e loops the_list_differs_from_the_cases_of_the_executable=1\n'
            diff "$RUNNER_TEMP/w3e-listed.txt" "$RUNNER_TEMP/w3e-written.txt"
            exit 1
          fi
          failed=0
          while read -r runs test; do
            passes=0
            index=0
            began=$(date +%s)
            while [ "$index" -lt "$runs" ]; do
              index=$((index + 1))
              timeout 360 "$exe" --ignored --exact --nocapture "$test" </dev/null >"$RUNNER_TEMP/w3e-loop.raw" 2>&1
              code=$?
              tr -d '\r' <"$RUNNER_TEMP/w3e-loop.raw" >"$RUNNER_TEMP/w3e-loop.log"
              if [ "$code" -eq 0 ] && grep -q '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/w3e-loop.log"; then
                passes=$((passes + 1))
              else
                panics=$(grep -c ' panicked at ' "$RUNNER_TEMP/w3e-loop.log")
                printf 'w3e loop_run_failed test=%s run=%s exit=%s panics=%s\n' "$test" "$index" "$code" "$panics"
              fi
            done
            printf 'w3e loop %s runs=%s passed=%s seconds=%s\n' "$test" "$runs" "$passes" "$(($(date +%s) - began))"
            [ "$passes" -eq "$runs" ] || failed=$((failed + 1))
          done <"$RUNNER_TEMP/w3e-loops.txt"
          printf 'w3e loops tests_with_a_failed_run=%s\n' "$failed"
          [ "$failed" -eq 0 ]
      - name: win-3e, the self-tests of 50, 52 and 53 through the driver, each by its name (scratch, never merged)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          failed=0
          for check in 50-windows-functional 52-windows-browser 53-windows-prints; do
            sh scripts/ci/run-ci-d.sh windows --self-test "$check"
            code=$?
            echo "win-3e self-test $check exit=$code"
            [ "$code" -eq 0 ] || failed=$((failed + 1))
          done
          echo "win-3e self-tests failed=$failed"
          [ "$failed" -eq 0 ]
      - name: win-3e, the short form of 50-windows-functional, outside the driver, once (scratch, never merged)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          HALVO_WF_FORM: short
          CI_D_REPO: ${{ github.workspace }}
          CI_D_JOB: windows
        run: |
          set +e
          started=$(date +%s)
          CI_D_ARTIFACTS="$GITHUB_WORKSPACE/target/ci-artifacts/50-windows-functional-short" sh scripts/r1/ci.d/50-windows-functional.sh >"$RUNNER_TEMP/w3e-short-50-windows-functional.log" 2>&1
          code=$?
          seconds=$(($(date +%s) - started))
          tr -d '\r' <"$RUNNER_TEMP/w3e-short-50-windows-functional.log" >"$RUNNER_TEMP/w3e-short-50-windows-functional.txt"
          cat "$RUNNER_TEMP/w3e-short-50-windows-functional.txt"
          echo "seconds 50-windows-functional-short $seconds exit=$code"
          last=$(tail -n 1 "$RUNNER_TEMP/w3e-short-50-windows-functional.txt")
          totals=$(grep -c -E '^WF total=[0-9]+ pass=[0-9]+ known_defect=[0-9]+ long_form_only=[0-9]+ fail=0 group=native$' "$RUNNER_TEMP/w3e-short-50-windows-functional.txt")
          case $code:$last in
            "0:PASS 50-windows-functional")
              echo "win-3e short 50-windows-functional: PASS"
              exit 0
              ;;
            "1:FAIL 50-windows-functional (the measured run 44660306498 ran on another "*)
              if [ "$totals" -eq 1 ]; then
                echo "win-3e short 50-windows-functional: the one failure is the ledger, which holds the record of main until the record of this run"
                exit 0
              fi
              ;;
          esac
          echo "win-3e short 50-windows-functional: FAIL exit=$code totals_with_fail_0=$totals"
          exit 1
      - name: win-3e, the short form of 52-windows-browser, outside the driver, once (scratch, never merged)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          HALVO_WF_FORM: short
          CI_D_REPO: ${{ github.workspace }}
          CI_D_JOB: windows
        run: |
          set +e
          started=$(date +%s)
          CI_D_ARTIFACTS="$GITHUB_WORKSPACE/target/ci-artifacts/52-windows-browser-short" sh scripts/r1/ci.d/52-windows-browser.sh >"$RUNNER_TEMP/w3e-short-52-windows-browser.log" 2>&1
          code=$?
          seconds=$(($(date +%s) - started))
          tr -d '\r' <"$RUNNER_TEMP/w3e-short-52-windows-browser.log" >"$RUNNER_TEMP/w3e-short-52-windows-browser.txt"
          cat "$RUNNER_TEMP/w3e-short-52-windows-browser.txt"
          echo "seconds 52-windows-browser-short $seconds exit=$code"
          last=$(tail -n 1 "$RUNNER_TEMP/w3e-short-52-windows-browser.txt")
          totals=$(grep -c -E '^WF total=[0-9]+ pass=[0-9]+ known_defect=[0-9]+ long_form_only=[0-9]+ fail=0 group=browser$' "$RUNNER_TEMP/w3e-short-52-windows-browser.txt")
          case $code:$last in
            "0:PASS 52-windows-browser")
              echo "win-3e short 52-windows-browser: PASS"
              exit 0
              ;;
            "1:FAIL 52-windows-browser (the measured run 44660306498 ran on another "*)
              if [ "$totals" -eq 1 ]; then
                echo "win-3e short 52-windows-browser: the one failure is the ledger, which holds the record of main until the record of this run"
                exit 0
              fi
              ;;
          esac
          echo "win-3e short 52-windows-browser: FAIL exit=$code totals_with_fail_0=$totals"
          exit 1
      - name: win-3e, the long form of 50-windows-functional, outside the driver (scratch, never merged)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          HALVO_WF_FORM: long
          CI_D_REPO: ${{ github.workspace }}
          CI_D_JOB: windows
        run: |
          set +e
          started=$(date +%s)
          CI_D_ARTIFACTS="$GITHUB_WORKSPACE/target/ci-artifacts/50-windows-functional" sh scripts/r1/ci.d/50-windows-functional.sh
          code=$?
          echo "seconds 50-windows-functional-long $(($(date +%s) - started)) exit=$code"
          exit "$code"
      - name: win-3e, the long form of 52-windows-browser, outside the driver (scratch, never merged)
        if: ${{ !cancelled() }}
        shell: bash
        env:
          HALVO_WF_FORM: long
          CI_D_REPO: ${{ github.workspace }}
          CI_D_JOB: windows
        run: |
          set +e
          started=$(date +%s)
          CI_D_ARTIFACTS="$GITHUB_WORKSPACE/target/ci-artifacts/52-windows-browser" sh scripts/r1/ci.d/52-windows-browser.sh
          code=$?
          echo "seconds 52-windows-browser-long $(($(date +%s) - started)) exit=$code"
          exit "$code"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" windows
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
