# scratch: driver-2 PL-29 point 3, the windows job alone measuring the own cases (never merged)
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 3
      - name: run-ci-d own cases, point 1 (the clock alone)
        if: always()
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then tmp=$(cygpath -u "$tmp"); fi
          git log -1 --format='point 1: the driver of %H' HEAD~2
          git show HEAD~2:scripts/ci/run-ci-d.sh >"$tmp/run-ci-d-point-1.sh"
          sh "$tmp/run-ci-d-point-1.sh" windows --self-test run-ci-d
      - name: run-ci-d own cases, point 2 (the fixture made once)
        if: always()
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          git log -1 --format='point 2: the driver of %H' HEAD~1
          sh scripts/ci/run-ci-d.sh windows --self-test run-ci-d
