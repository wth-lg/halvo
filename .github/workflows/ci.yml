name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trace the carriage return in cr-after-import
        shell: bash
        run: |
          set +e
          src="$PWD/scripts/r1/ci.d/62-build.sh"
          scratch_parent=${TMPDIR:-${RUNNER_TEMP:?}}
          work=$(mktemp -d "$scratch_parent/add4-bytes.XXXXXX") || exit 1
          python_cmd=python3
          if [ -n "${GITHUB_ACTIONS:-}" ]; then python_cmd=python; fi
          export python_cmd
          "$python_cmd" - "$src" "$work" <<'GENERATE_PROBE'
          import re
          from pathlib import Path

          import sys
          s=Path(sys.argv[1]).read_text()
          def func(name, spaces=""):
              return re.search("^"+spaces+name+r"\(\) \{\n.*?^"+spaces+r"\}$",s,re.M|re.S)[0]
          def once(s, before, after):
              assert s.count(before)==1, before
              return s.replace(before,after)
          release=func("release_imports")
          release=once(release,'    result=$(LC_ALL=C awk','    printf %s "$imports" > reader-input\n    result=$(LC_ALL=C awk')
          release=once(release,r'{ raw = $0; sub(/\r$/, "") }',r'''{ raw = $0
                  if (index(raw,symbol)) { printf "%s",raw > "reader-row"; close("reader-row") }
                  sub(/\r$/, "") }''')
          imports=once(func("imports_case","  "),"    code=$?","    code=$?\n    printf %s \"$output\" > diagnostic")
          header=next(l for l in s.splitlines() if l.startswith("forbidden_import="))
          case=next(l for l in s.splitlines() if l.startswith("  import_row_case cr-after-import "))
          clean=re.search("^  clean='[^']+'$",s,re.M)[0]
          parts=[r'''set +e
          set -u
          work=.
          name=62-build
          rejected=0
          wrong='' ''',header,func("fail"),release,func("verdict","  "),func("output_has_line","  "),imports,func("import_row_case","  "),clean,r"""cr=$(printf '\r')""",case,r'''
          PYTHON_PROBE -c 'from pathlib import Path
          def read(n): return Path(n).read_bytes()
          def save(n,b): Path(n).write_bytes(b)
          fixture=read("halvo")
          assert fixture.endswith(b"\n") and fixture.count(b"\n")==4
          save("fixture-row",fixture.rsplit(b"\n",2)[1]+b"\n")
          save("reader-input-row",read("reader-input").rsplit(b"\n",1)[-1])
          diagnostic=read("diagnostic").split(b"\n")
          assert len(diagnostic)==3,diagnostic
          assert diagnostic[0]==b"dyld_info -imports halvo:",diagnostic
          save("diagnostic-row",diagnostic[1])
          print("fixture bytes counted in binary mode:",fixture.count(bytes([13])))' || exit 1
          printf 'fixture file CR count from tr and wc: '
          tr -dc '\r' <halvo | wc -c || exit 1
          for point in fixture-row reader-input-row reader-row diagnostic-row; do
            printf '%s, od -c:\n' "$point"
            od -c "$point" || exit 1
          done
          printf 'awk length of a followed by CRLF: '
          printf 'a\r\n' | awk '{ print length($0) }' || exit 1
          ''']
          (Path(sys.argv[2])/"one-case.sh").write_bytes(("\n".join(parts).replace("PYTHON_PROBE", chr(34)+"$python_cmd"+chr(34))+"\n").encode())
          GENERATE_PROBE
          rc=$?
          [ "$rc" = 0 ] || exit "$rc"
          cd "$work" || exit 1
          bash ./one-case.sh
