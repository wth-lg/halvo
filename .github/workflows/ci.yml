              esac
              n=$((n + 1))
            done
            echo "u03r4_loop machine=$machine test=$name runs=$n passed=$ok ran_no_test=$zero"
            [ "$ok" -eq 200 ] || code=1
          }

          s0=$(date +%s)
          plib=$(bin_of profile --lib r3_profile)
          pbin=$(bin_of profile --bin=profile-trial profile-trial)
          pset=$(bin_of profile --test=print_set print_set)
          wbin=$(bin_of web --bin=web-trial web-trial)
          echo "u03r4_bins plib=$([ -x "$plib" ] && echo yes || echo no) pbin=$([ -x "$pbin" ] && echo yes || echo no) pset=$([ -x "$pset" ] && echo yes || echo no) wbin=$([ -x "$wbin" ] && echo yes || echo no)"
          for t in item_3_prints_browser_started_yes_only_for_a_start_that_returned_ok \
            the_outer_item_3_line_follows_the_inner_line_by_its_keys \
            the_flag_lines_are_the_flags_of_each_product_start_less_the_executors_own \
            the_refusal_causes_name_every_refused_line; do
            loop "$plib" "product::tests::$t"
          done
          loop "$pset" the_programs_print_set_is_the_last_blocks_flag_and_pref_lines
          loop "$wbin" driver::org_tests::the_kill_line_names_the_browser_of_its_context
          loop "$wbin" driver::org_tests::a_page_read_without_the_setting_counts_neither_as_the_effect_nor_as_a_miss
          if [ "$machine" = hosted-mac ]; then
            for t in a_fixture_that_cannot_be_reset_is_no_start_of_the_browser a_browser_that_ends_at_once_did_not_start \
              the_outer_item_3_reads_the_last_inner_line_of_the_programs_output; do
              loop "$pbin" "tests::$t"
            done
            loop "$wbin" driver::leftover_tests::of_the_run_counts_a_member_born_after_the_kill
            loop "$wbin" driver::leftover_tests::a_process_that_names_a_longer_profile_is_left_alone
          fi
          part loops "$s0"

          s0=$(date +%s)
          sh tools/r3-trials/web/hosted/harness.sh --self-test >"$RUNNER_TEMP/u03r4-harness.log" 2>&1
          e=$?
          echo "u03r4_harness_self_test exit=$e $(tail -1 "$RUNNER_TEMP/u03r4-harness.log")"
