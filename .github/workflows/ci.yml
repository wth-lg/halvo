              sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | sed 's|\\\\|/|g' | head -1
          }

          loop() {
            bin=$1
            name=$2
            n=0
            ok=0
            zero=0
            while [ "$n" -lt 200 ]; do
              out=$("$bin" --exact "$name" --test-threads=1 2>&1)
              case "$out" in
                *"test result: ok. 1 passed; 0 failed;"*) ok=$((ok + 1)) ;;
                *"test result: ok. 0 passed;"*) zero=$((zero + 1)) ;;
              esac
              n=$((n + 1))
            done
            echo "u03_loop machine=$machine test=$name runs=$n passed=$ok ran_no_test=$zero"
            [ "$ok" -eq 200 ] || code=1
          }

