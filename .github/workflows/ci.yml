name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() }}
        with:
          ref: e1fb63c55540b08c3982e6bf74b6f682c852ea26
          path: scratch-control
      - name: U4.1f probe allocation loops (scratch)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          crate=crates/halvo-route-gate
          build() {
            (cd "$1" && CARGO_TARGET_DIR=$2 cargo test --locked -p halvo-route-gate --lib --no-run 2>&1) |
              sed -n 's/.*Executable unittests src.lib.rs (\(.*\))/\1/p' | tail -1 | tr '\\' /
          }
          head_rel=$(build . target)
          control_rel=$(build scratch-control target-u41f)
          [ -n "$head_rel" ] && [ -n "$control_rel" ] || { echo "a build gave no test binary"; exit 1; }
          head_bin="$PWD/$head_rel"
          control_bin="$PWD/scratch-control/$control_rel"
          if cmp -s "$head_bin" "$control_bin"; then echo "the two binaries are the same file content"; exit 1; fi
          echo "head tests=$(cd "$crate" && "$head_bin" --list 2>/dev/null | grep -c ': test$') control tests=$(cd "scratch-control/$crate" && "$control_bin" --list 2>/dev/null | grep -c ': test$')"
          out="$RUNNER_TEMP/u41f-run.txt"
          loop() {
            name=$1 dir=$2 bin=$3 runs=0 ok=0 streak=0 best=0
            while [ "$runs" -lt 300 ]; do
              runs=$((runs + 1))
              if (cd "$dir" && "$bin") >"$out" 2>&1; then
                ok=$((ok + 1)) streak=$((streak + 1))
              else
                streak=0
                grep -E "panicked at|left: |right: |^test .* FAILED|window [a-z=]+ first_calls|^first_thread start_calls" "$out" | head -n 24 | sed "s/^/$name run $runs: /"
              fi
              [ "$streak" -gt "$best" ] && best=$streak
            done
            echo "loop $name runs=$runs ok=$ok longest_run_of_ok=$best"
          }
          loop head "$crate" "$head_bin" | tee "$RUNNER_TEMP/u41f-head.txt"
          loop control "scratch-control/$crate" "$control_bin"
          grep -q "^loop head runs=300 ok=300 " "$RUNNER_TEMP/u41f-head.txt" || { echo "the head did not exit 0 in every run"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() }}
        with:
          ref: e1fb63c55540b08c3982e6bf74b6f682c852ea26
          path: scratch-control
      - name: U4.1f probe allocation loops (scratch)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          crate=crates/halvo-route-gate
          build() {
            (cd "$1" && CARGO_TARGET_DIR=$2 cargo test --locked -p halvo-route-gate --lib --no-run 2>&1) |
              sed -n 's/.*Executable unittests src.lib.rs (\(.*\))/\1/p' | tail -1 | tr '\\' /
          }
          head_rel=$(build . target)
          control_rel=$(build scratch-control target-u41f)
          [ -n "$head_rel" ] && [ -n "$control_rel" ] || { echo "a build gave no test binary"; exit 1; }
          head_bin="$PWD/$head_rel"
          control_bin="$PWD/scratch-control/$control_rel"
          if cmp -s "$head_bin" "$control_bin"; then echo "the two binaries are the same file content"; exit 1; fi
          echo "head tests=$(cd "$crate" && "$head_bin" --list 2>/dev/null | grep -c ': test$') control tests=$(cd "scratch-control/$crate" && "$control_bin" --list 2>/dev/null | grep -c ': test$')"
          out="$RUNNER_TEMP/u41f-run.txt"
          loop() {
            name=$1 dir=$2 bin=$3 runs=0 ok=0 streak=0 best=0
            while [ "$runs" -lt 300 ]; do
              runs=$((runs + 1))
              if (cd "$dir" && "$bin") >"$out" 2>&1; then
                ok=$((ok + 1)) streak=$((streak + 1))
              else
                streak=0
                grep -E "panicked at|left: |right: |^test .* FAILED|window [a-z=]+ first_calls|^first_thread start_calls" "$out" | head -n 24 | sed "s/^/$name run $runs: /"
              fi
              [ "$streak" -gt "$best" ] && best=$streak
            done
            echo "loop $name runs=$runs ok=$ok longest_run_of_ok=$best"
          }
          loop head "$crate" "$head_bin" | tee "$RUNNER_TEMP/u41f-head.txt"
          loop control "scratch-control/$crate" "$control_bin"
          grep -q "^loop head runs=300 ok=300 " "$RUNNER_TEMP/u41f-head.txt" || { echo "the head did not exit 0 in every run"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
