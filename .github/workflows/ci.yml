name: ci
# scratch: jobtime-5 PL-21 G8, the whole workflow at the joined head with a loop step after the step ci.d

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - name: Self-tests that commit in throwaway repositories
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          sh scripts/check-commit-messages.sh --self-test-two-paths
          sh scripts/check-commit-messages.sh --self-test-pre-push
          sh scripts/ci-commit-messages.sh --self-test
          sh scripts/merge-pr.sh --self-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos
      - name: PL-21 G8 loop, 100 runs of each case
        if: always()
        shell: bash
        env:
          OWN_ONLY: alone-part-waits-for-a-free-script-that-outlasts-the-cargo-lane free-check-that-cannot-start-gives-its-place-to-the-next alone-check-that-cannot-start-lets-the-next-alone-check-run standard-error-written-after-the-print-in-the-step-ci.d head-moved-beside-another-check-names-both lane-line-with-a-blank-after-its-value child-whose-term-trap-takes-a-second-finishes-it-before-kill group-ended-before-the-tracked-files-are-read child-in-a-group-of-its-own-is-named-at-the-next-read alone-list-names-a-script-of-the-other-job-alone own-cases-past-the-limit checks-of-two-lanes-run-at-the-same-time lane-line-with-a-carriage-return-names-the-free-lane checks-without-a-lane-one-at-a-time-beside-the-free-lane lane-line-at-line-11-is-no-lane outputs-of-free-checks-kept-apart-in-name-order output-in-name-order-when-a-later-check-ends-first refusal-keeps-its-place-in-the-recap-of-the-step-ci.d free-lane-runs-ci-d-check-jobs-at-a-time default-check-jobs-from-number-of-processors default-check-jobs-of-one-without-number-of-processors tracked-file-changed-beside-another-check-names-both free-check-past-its-limit-beside-the-cargo-lane step-ci.d-with-a-free-check-interrupted-by-HUP step-ci.d-with-a-free-check-interrupted-by-INT step-ci.d-with-a-free-check-interrupted-by-TERM output-of-started-checks-printed-when-the-step-is-interrupted interrupt-while-the-driver-reads-the-tracked-files group-of-a-check-that-ended-and-is-not-yet-finished-is-ended-by-an-interrupt change-undone-after-its-report-is-not-reported-again
        run: |
          set +e
          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then tmp=$(cygpath -u "$tmp"); fi
          copy="$tmp/run-ci-d-filtered.sh"
          perl -0pe 's/own_case\(\) \{\n  case_name=\$1\n/own_case() {\n  [ -z "\$\{OWN_ONLY:-\}" ] || case " \$OWN_ONLY " in *" \$1 "*) ;; *) case_reset; return ;; esac\n  case_name=\$1\n/' scripts/ci/run-ci-d.sh >"$copy"
          echo "filter lines in the copy: $(grep -c 'OWN_ONLY' "$copy")"
          out="$tmp/g8-loop"
          mkdir -p "$out"
          batch() {
            i=0
            while [ "$i" -lt 13 ]; do
              n=$(( ($1 - 1) * 13 + i ))
              if [ "$n" -lt 100 ]; then
                sh "$copy" macos --self-test run-ci-d >"$out/run-$n.txt" 2>&1
                echo "run $n: $(grep -E '^(PASS|FAIL) self-test:run-ci-d' "$out/run-$n.txt")"
              fi
              i=$((i + 1))
            done
          }
          start=$(date +%s)
          batch 1 & batch 2 & batch 3 & batch 4 & batch 5 & batch 6 & batch 7 & batch 8 &
          wait
          end=$(date +%s)
          set -- "$out"/run-*.txt
          echo "runs: $#, seconds: $((end - start))"
          bad=0
          for c in $OWN_ONLY; do
            total=$(cat "$out"/run-*.txt | grep -c "^case run-ci-d/$c want=")
            pass=$(cat "$out"/run-*.txt | grep -E "^case run-ci-d/$c want=" | awk '{ split($3, w, "="); split($4, g, "="); if (w[2] == g[2]) n++ } END { print n + 0 }')
            echo "case $c: $pass of $total as wanted"
            [ "$pass" -eq 100 ] && [ "$total" -eq 100 ] || bad=1
          done
          for f in "$out"/run-*.txt; do
            grep -E "^case run-ci-d/.* want=" "$f" | awk '{ split($3, w, "="); split($4, g, "="); if (w[2] != g[2]) print }'
          done | sort | uniq -c
          exit "$bad"
      - name: Build
        shell: bash
        run: npm run tauri build
      - name: Version
        shell: bash
        run: test "$(target/release/bundle/macos/Halvo.app/Contents/MacOS/halvo --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-macos
          path: target/release/bundle/macos/Halvo.app
          if-no-files-found: error
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows
      - name: PL-21 G8 loop, 100 runs of each case
        if: always()
        shell: bash
        env:
          OWN_ONLY: alone-part-waits-for-a-free-script-that-outlasts-the-cargo-lane free-check-that-cannot-start-gives-its-place-to-the-next alone-check-that-cannot-start-lets-the-next-alone-check-run standard-error-written-after-the-print-in-the-step-ci.d head-moved-beside-another-check-names-both lane-line-with-a-blank-after-its-value child-whose-term-trap-takes-a-second-finishes-it-before-kill group-ended-before-the-tracked-files-are-read child-in-a-group-of-its-own-is-named-at-the-next-read alone-list-names-a-script-of-the-other-job-alone own-cases-past-the-limit checks-of-two-lanes-run-at-the-same-time lane-line-with-a-carriage-return-names-the-free-lane checks-without-a-lane-one-at-a-time-beside-the-free-lane lane-line-at-line-11-is-no-lane outputs-of-free-checks-kept-apart-in-name-order output-in-name-order-when-a-later-check-ends-first refusal-keeps-its-place-in-the-recap-of-the-step-ci.d free-lane-runs-ci-d-check-jobs-at-a-time default-check-jobs-from-number-of-processors default-check-jobs-of-one-without-number-of-processors tracked-file-changed-beside-another-check-names-both free-check-past-its-limit-beside-the-cargo-lane step-ci.d-with-a-free-check-interrupted-by-HUP step-ci.d-with-a-free-check-interrupted-by-INT step-ci.d-with-a-free-check-interrupted-by-TERM output-of-started-checks-printed-when-the-step-is-interrupted interrupt-while-the-driver-reads-the-tracked-files group-of-a-check-that-ended-and-is-not-yet-finished-is-ended-by-an-interrupt change-undone-after-its-report-is-not-reported-again free-check-that-sends-QUIT-to-itself-runs-on-as-in-the-foreground
        run: |
          set +e
          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then tmp=$(cygpath -u "$tmp"); fi
          copy="$tmp/run-ci-d-filtered.sh"
          perl -0pe 's/own_case\(\) \{\n  case_name=\$1\n/own_case() {\n  [ -z "\$\{OWN_ONLY:-\}" ] || case " \$OWN_ONLY " in *" \$1 "*) ;; *) case_reset; return ;; esac\n  case_name=\$1\n/' scripts/ci/run-ci-d.sh >"$copy"
          echo "filter lines in the copy: $(grep -c 'OWN_ONLY' "$copy")"
          out="$tmp/g8-loop"
          mkdir -p "$out"
          batch() {
            i=0
            while [ "$i" -lt 13 ]; do
              n=$(( ($1 - 1) * 13 + i ))
              if [ "$n" -lt 100 ]; then
                sh "$copy" windows --self-test run-ci-d >"$out/run-$n.txt" 2>&1
                echo "run $n: $(grep -E '^(PASS|FAIL) self-test:run-ci-d' "$out/run-$n.txt")"
              fi
              i=$((i + 1))
            done
          }
          start=$(date +%s)
          batch 1 & batch 2 & batch 3 & batch 4 & batch 5 & batch 6 & batch 7 & batch 8 &
          wait
          end=$(date +%s)
          set -- "$out"/run-*.txt
          echo "runs: $#, seconds: $((end - start))"
          bad=0
          for c in $OWN_ONLY; do
            total=$(cat "$out"/run-*.txt | grep -c "^case run-ci-d/$c want=")
            pass=$(cat "$out"/run-*.txt | grep -E "^case run-ci-d/$c want=" | awk '{ split($3, w, "="); split($4, g, "="); if (w[2] == g[2]) n++ } END { print n + 0 }')
            echo "case $c: $pass of $total as wanted"
            [ "$pass" -eq 100 ] && [ "$total" -eq 100 ] || bad=1
          done
          for f in "$out"/run-*.txt; do
            grep -E "^case run-ci-d/.* want=" "$f" | awk '{ split($3, w, "="); split($4, g, "="); if (w[2] != g[2]) print }'
          done | sort | uniq -c
          exit "$bad"
      - name: Build
        shell: bash
        run: npm run tauri build -- --no-bundle
      - name: Version
        shell: bash
        run: test "$(target/release/halvo.exe --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-windows
          path: target/release/halvo.exe
          if-no-files-found: error
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
