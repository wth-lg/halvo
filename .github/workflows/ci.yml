name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - name: Self-tests that commit in throwaway repositories
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          sh scripts/check-commit-messages.sh --self-test-two-paths
          sh scripts/check-commit-messages.sh --self-test-pre-push
          sh scripts/ci-commit-messages.sh --self-test
          sh scripts/merge-pr.sh --self-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos
      - name: daemon-1 loop of the round's tests
        if: always()
        shell: bash
        run: |
          set -u
          set +e
          step_start=$(date +%s)
          py=$(command -v python3 || command -v python); bin=$(cargo test --locked -q -p halvo-capture --lib --no-run --message-format json 2>/dev/null | "$py" -c "import json,sys; print([m['executable'] for m in map(json.loads, sys.stdin) if m.get('reason') == 'compiler-artifact' and m.get('executable') and m['target']['name'] == 'halvo_capture'][-1])" | tr -d '\r')
          names='daemon::stop_tests::an_outcome_with_a_loss_prints_its_report_and_line_and_returns_its_status daemon::stop_tests::an_already_written_answer_at_the_last_settle_gives_no_loss daemon::stop_tests::a_signal_wins_over_a_source_that_did_not_stop daemon::stop_tests::a_signal_after_the_window_and_before_the_return_gives_status_2 daemon::stop_tests::a_refusal_that_the_sources_learn_at_their_stop_ends_the_run daemon::owner::tests::three_due_tries_answered_busy_leave_the_batch_held daemon::owner::tests::a_shutdown_after_open_pause_stores_nothing_that_came_after_the_pause daemon::stop_tests::the_line_of_an_unanswered_stop_names_no_healed_fault sink::tests::the_owners_queue_depth_is_the_1024_of_the_ledger daemon::stop_tests::a_usage_refusal_gives_its_text_and_exit_64 daemon::owner::tests::the_class_of_each_write_fault_counts_and_names_it daemon::tests::a_dir_whose_store_key_cannot_be_read_is_refused_by_the_first_three_modes daemon::tests::a_shutdown_answered_late_in_its_part_is_taken_and_stores_the_events daemon::stop_tests::an_owner_gone_after_its_first_answer_gives_an_unanswered_shutdown'
          want=14
          out=$(mktemp)
          pass=0
          # shellcheck disable=SC2086
          for _ in $(seq 200); do
            if "$bin" --exact $names --test-threads=8 >"$out" 2>&1 && tr -d '\r' <"$out" | grep -q "^test result: ok. $want passed"; then pass=$((pass + 1)); else tail -n 30 "$out"; fi
          done
          echo "daemon-1 loop (macos): binary $(basename "$bin"): tests $want, runs 200, passes $pass"
          echo "daemon-1 loop (macos): the step took $(( $(date +%s) - step_start )) s"
      - name: Build
        shell: bash
        run: npm run tauri build
      - name: Version
        shell: bash
        run: test "$(target/release/bundle/macos/Halvo.app/Contents/MacOS/halvo --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-macos
          path: target/release/bundle/macos/Halvo.app
          if-no-files-found: error
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows
      - name: daemon-1 loop of the round's tests
        if: always()
        shell: bash
        run: |
          set -u
          set +e
          step_start=$(date +%s)
          py=$(command -v python3 || command -v python); bin=$(cargo test --locked -q -p halvo-capture --lib --no-run --message-format json 2>/dev/null | "$py" -c "import json,sys; print([m['executable'] for m in map(json.loads, sys.stdin) if m.get('reason') == 'compiler-artifact' and m.get('executable') and m['target']['name'] == 'halvo_capture'][-1])" | tr -d '\r')
          names='daemon::stop_tests::an_outcome_with_a_loss_prints_its_report_and_line_and_returns_its_status daemon::stop_tests::an_already_written_answer_at_the_last_settle_gives_no_loss daemon::stop_tests::a_signal_wins_over_a_source_that_did_not_stop daemon::stop_tests::a_signal_after_the_window_and_before_the_return_gives_status_2 daemon::stop_tests::a_refusal_that_the_sources_learn_at_their_stop_ends_the_run daemon::owner::tests::three_due_tries_answered_busy_leave_the_batch_held daemon::owner::tests::a_shutdown_after_open_pause_stores_nothing_that_came_after_the_pause daemon::stop_tests::the_line_of_an_unanswered_stop_names_no_healed_fault sink::tests::the_owners_queue_depth_is_the_1024_of_the_ledger daemon::stop_tests::a_usage_refusal_gives_its_text_and_exit_64 daemon::owner::tests::the_class_of_each_write_fault_counts_and_names_it daemon::stop_tests::an_owner_gone_after_its_first_answer_gives_an_unanswered_shutdown daemon::tests::a_shutdown_answered_late_in_its_part_is_taken_and_stores_the_events'
          want=13
          out=$(mktemp)
          pass=0
          # shellcheck disable=SC2086
          for _ in $(seq 200); do
            if "$bin" --exact $names --test-threads=8 >"$out" 2>&1 && tr -d '\r' <"$out" | grep -q "^test result: ok. $want passed"; then pass=$((pass + 1)); else tail -n 30 "$out"; fi
          done
          echo "daemon-1 loop (windows): binary $(basename "$bin"): tests $want, runs 200, passes $pass"
          echo "daemon-1 loop (windows): the step took $(( $(date +%s) - step_start )) s"
      - name: Build
        shell: bash
        run: npm run tauri build -- --no-bundle
      - name: Version
        shell: bash
        run: test "$(target/release/halvo.exe --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-windows
          path: target/release/halvo.exe
          if-no-files-found: error
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
