name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test
      - name: U4.6 loop of the new tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          export CARGO_BUILD_JOBS=4
          bad=0
          cargo test -p halvo-agent-client --locked --no-run --message-format=json > "$RUNNER_TEMP/u46-build.json" 2> "$RUNNER_TEMP/u46-build.err"
          echo "u46 build exit=$?"
          exe() {
            node -e 'const fs=require("fs");const want=process.argv[2];for(const l of fs.readFileSync(process.argv[1],"utf8").split("\n")){if(!l.startsWith("{"))continue;const m=JSON.parse(l);if(m.reason==="compiler-artifact"&&m.executable&&m.target&&m.target.name===want&&m.profile&&m.profile.test){console.log(m.executable.replace(/\\/g,"/"));break}}' "$RUNNER_TEMP/u46-build.json" "$1"
          }
          run_loop() {
            target=$1; n=$2; threads=$3; shift 3
            bin=$(exe "$target")
            want=$#
            if [ -z "$bin" ]; then echo "u46 loop $target: no executable"; bad=1; return; fi
            pass=0; fail=0; start=$(date +%s)
            for _ in $(seq 1 "$n"); do
              out=$("$bin" --exact --test-threads "$threads" "$@" 2>&1)
              if printf '%s\n' "$out" | grep -q "^test result: ok\. $want passed; 0 failed"; then
                pass=$((pass + 1))
              else
                fail=$((fail + 1))
                printf '%s\n' "$out" | grep -E "^test .* FAILED$|^test result|panicked" | head -6
              fi
            done
            end=$(date +%s)
            echo "u46 loop $target runs=$n passed=$pass failed=$fail tests=$want seconds=$((end - start))"
            if [ "$fail" -ne 0 ] || [ "$pass" -ne "$n" ]; then bad=1; fi
          }
          run_loop halvo_agent_client 200 4 \
            supervisor::tests::missing::a_start_whose_list_lacks_a_value_of_the_system_answers_not_started_naming_it_before_any_mark_or_process \
            supervisor::tests::missing::the_names_of_the_values_are_those_of_the_list
          run_loop start 200 4 \
            a_start_whose_runner_browser_model_or_data_directory_is_relative_answers_not_started_naming_it_before_any_process_or_mark \
            a_start_whose_runner_exits_with_the_status_2_answers_not_started_with_that_exit
          run_loop reap 200 4 \
            the_reap_of_an_earlier_life_answers_what_it_ended_with_the_path_reap_and_nothing_for_a_mark_with_nothing_left \
            reap_removes_the_profile_directory_of_each_run_that_no_mark_of_a_live_run_names_and_nothing_else \
            reap_removes_nothing_through_a_profiles_folder_or_an_agents_folder_that_is_a_link \
            reap_keeps_the_profile_of_a_run_of_this_life_that_runs_after_its_finish_removed_its_mark
          run_loop acts 200 8 \
            a_bind_as_the_runners_first_request_ends_the_run_and_asks_nobody \
            a_bind_after_a_handback_result_other_than_done_ends_the_run_and_asks_nobody \
            a_bind_after_a_done_handback_of_another_reason_ends_the_run_and_asks_nobody \
            a_second_bind_after_the_same_done_ends_the_run_and_asks_nobody_again \
            a_bind_after_a_done_handback_of_each_sign_in_reason_is_taken \
            a_confirm_after_a_stored_finish_ends_the_run_after_finish_unanswered_and_unasked \
            a_handback_after_a_stored_finish_ends_the_run_after_finish_unanswered_and_unasked \
            a_bind_after_a_stored_finish_ends_the_run_after_finish_unanswered_and_unasked \
            a_secret_after_a_stored_finish_ends_the_run_after_finish_unanswered_and_unasked \
            a_confirm_after_bound_no_ends_the_run_unasked \
            a_handback_after_bound_no_ends_the_run_unasked \
            a_bind_after_bound_no_ends_the_run_unasked \
            a_secret_after_bound_no_ends_the_run_unasked \
            a_store_of_another_body_than_finish_after_bound_no_ends_the_run_unrelayed \
            the_declined_finish_after_bound_no_is_stored_and_its_done_taken \
            two_add_origin_replies_that_cannot_be_read_and_then_an_acknowledgement_bind_the_origin \
            three_link_errors_on_an_add_origin_end_nothing_and_the_fourth_send_binds \
            a_bind_after_a_sign_in_done_and_a_later_done_handback_of_another_reason_ends_the_run_and_asks_nobody
          run_loop acts 20 8 \
            a_browser_frame_after_a_stored_finish_ends_the_run_after_finish_unanswered_and_unasked \
            a_browser_frame_after_bound_no_ends_the_run_unasked \
            a_cancel_while_the_library_stands_in_allow_origin_drops_the_bind_and_takes_the_declined_finish \
            a_cancel_while_the_add_origin_of_a_bind_waits_drops_it_and_takes_the_declined_finish \
            three_add_origin_replies_that_cannot_be_read_end_a_run_that_waits_for_the_bind_or_the_account_link \
            three_add_origin_replies_that_cannot_be_read_drop_a_new_origin_and_the_run_goes_on
          run_loop run_end 20 4 \
            a_runner_that_exits_with_1_by_itself_and_one_that_the_library_kills_end_with_two_different_values \
            a_kill_of_a_run_with_a_browser_ends_with_the_path_kill_and_the_browser \
            a_runner_that_outlives_its_stored_finish_ends_with_after_finish_and_with_the_browser \
            a_broken_frame_ends_the_run_by_force_with_the_path_link_end
          run_loop handles 20 2 \
            a_runner_that_outlives_its_stored_finish_after_closing_its_output_while_a_helper_holds_its_link_is_ended_within_twice_link_end \
            a_runner_that_outlives_its_stored_finish_with_its_output_open_is_ended_within_twice_link_end
          echo "u46 loop bad=$bad"
          exit "$bad"
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: U4.6 loop of the new tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          export CARGO_BUILD_JOBS=4
          bad=0
          cargo test -p halvo-agent-client --locked --no-run --message-format=json > "$RUNNER_TEMP/u46-build.json" 2> "$RUNNER_TEMP/u46-build.err"
          echo "u46 build exit=$?"
          exe() {
            node -e 'const fs=require("fs");const want=process.argv[2];for(const l of fs.readFileSync(process.argv[1],"utf8").split("\n")){if(!l.startsWith("{"))continue;const m=JSON.parse(l);if(m.reason==="compiler-artifact"&&m.executable&&m.target&&m.target.name===want&&m.profile&&m.profile.test){console.log(m.executable.replace(/\\/g,"/"));break}}' "$RUNNER_TEMP/u46-build.json" "$1"
          }
          run_loop() {
            target=$1; n=$2; threads=$3; shift 3
            bin=$(exe "$target")
            want=$#
            if [ -z "$bin" ]; then echo "u46 loop $target: no executable"; bad=1; return; fi
            pass=0; fail=0; start=$(date +%s)
            for _ in $(seq 1 "$n"); do
              out=$("$bin" --exact --test-threads "$threads" "$@" 2>&1)
              if printf '%s\n' "$out" | grep -q "^test result: ok\. $want passed; 0 failed"; then
                pass=$((pass + 1))
              else
                fail=$((fail + 1))
                printf '%s\n' "$out" | grep -E "^test .* FAILED$|^test result|panicked" | head -6
              fi
            done
            end=$(date +%s)
            echo "u46 loop $target runs=$n passed=$pass failed=$fail tests=$want seconds=$((end - start))"
            if [ "$fail" -ne 0 ] || [ "$pass" -ne "$n" ]; then bad=1; fi
          }
          run_loop halvo_agent_client 200 4 \
            supervisor::tests::missing::a_start_whose_list_lacks_a_value_of_the_system_answers_not_started_naming_it_before_any_mark_or_process \
            supervisor::tests::missing::the_names_of_the_values_are_those_of_the_list
          run_loop start 200 4 \
            a_start_whose_runner_browser_model_or_data_directory_is_relative_answers_not_started_naming_it_before_any_process_or_mark \
            a_start_whose_runner_exits_with_the_status_2_answers_not_started_with_that_exit
          run_loop reap 200 4 \
            the_reap_of_an_earlier_life_answers_what_it_ended_with_the_path_reap_and_nothing_for_a_mark_with_nothing_left \
            reap_removes_the_profile_directory_of_each_run_that_no_mark_of_a_live_run_names_and_nothing_else \
            reap_removes_nothing_through_a_profiles_folder_or_an_agents_folder_that_is_a_link \
            reap_keeps_the_profile_of_a_run_of_this_life_that_runs_after_its_finish_removed_its_mark
          run_loop acts 200 8 \
            a_bind_as_the_runners_first_request_ends_the_run_and_asks_nobody \
            a_bind_after_a_handback_result_other_than_done_ends_the_run_and_asks_nobody \
            a_bind_after_a_done_handback_of_another_reason_ends_the_run_and_asks_nobody \
            a_second_bind_after_the_same_done_ends_the_run_and_asks_nobody_again \
            a_bind_after_a_done_handback_of_each_sign_in_reason_is_taken \
            a_confirm_after_a_stored_finish_ends_the_run_after_finish_unanswered_and_unasked \
            a_handback_after_a_stored_finish_ends_the_run_after_finish_unanswered_and_unasked \
            a_bind_after_a_stored_finish_ends_the_run_after_finish_unanswered_and_unasked \
            a_secret_after_a_stored_finish_ends_the_run_after_finish_unanswered_and_unasked \
            a_confirm_after_bound_no_ends_the_run_unasked \
            a_handback_after_bound_no_ends_the_run_unasked \
            a_bind_after_bound_no_ends_the_run_unasked \
            a_secret_after_bound_no_ends_the_run_unasked \
            a_store_of_another_body_than_finish_after_bound_no_ends_the_run_unrelayed \
            the_declined_finish_after_bound_no_is_stored_and_its_done_taken \
