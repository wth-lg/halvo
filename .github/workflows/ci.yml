name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 15-r3-test-dirs
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 15-r3-test-dirs
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Loop of the tests that U2.4 adds
        shell: bash
        run: |
          set +e
          if python3 -c 'print(1)' >/dev/null 2>&1; then py=python3; else py=python; fi
          $py - <<'PYEOF'
          import json, os, re, subprocess, sys, time
          LOOP = 200
          TIMED = 20
          GROUPS = [
              ("remove", LOOP, [
                  "a_copy_that_a_killed_pass_left_under_its_removing_name_is_finished_or_reported",
                  "an_absent_folder_as_on_a_volume_that_is_not_mounted_is_undecided",
                  "a_folder_that_is_a_link_or_a_relative_path_is_refused",
                  "a_removal_whose_every_pass_finds_the_removing_name_is_undecided_and_leaves_both_files",
                  "an_absent_file_counts_as_removed",
                  "a_checkpoint_whose_checks_all_hold_is_removed",
                  "a_folder_or_a_path_with_a_parent_step_is_refused",
              ], []),
              ("name", LOOP, [
                  "the_removing_name_is_the_checkpoints_name_and_16_hex_digits_of_its_sha256",
              ], []),
              ("races", LOOP, [
                  "seam_only_in_the_crates_own_tests::the_hook_exists_only_in_the_crates_own_test_build",
                  "seam_only_in_the_crates_own_tests::the_check_refuses_a_hook_that_a_build_other_than_the_crates_tests_can_reach",
              ], []),
              ("halvo_checkpoint", LOOP, [
                  "remove::tests::a_file_moved_into_the_checkpoints_place_after_its_checks_stays_under_its_name",
                  "remove::tests::a_checkpoint_written_in_place_after_its_checks_is_left",
                  "remove::tests::a_removal_whose_every_pass_finds_the_removing_name_is_undecided_after_the_third_pass",
                  "remove::tests::a_pass_killed_between_the_move_aside_and_the_removal_is_finished_by_the_next",
              ], []),
              ("replace", LOOP, [
                  "a_replace_that_misses_leaves_a_file_put_at_the_copys_name_after_the_write",
                  "a_prepare_of_the_run_after_a_refused_replace_of_the_workbook_answers_the_checkpoint_error",
                  "a_prepared_copy_gone_or_changed_keeps_the_workbook",
                  "a_file_of_the_copys_bytes_put_at_its_name_is_not_renamed_into_place",
                  "a_copy_that_cannot_be_read_is_answered_as_left_and_stays",
                  "a_file_of_another_party_that_cannot_be_read_at_the_copys_name_is_no_copy_left",
                  "a_prepare_of_the_run_after_a_replace_refused_for_its_lock_answers_the_checkpoint_error",
                  "a_prepare_of_the_run_by_another_spelling_after_a_refused_replace_answers_the_checkpoint_error",
              ], [
                  "a_copy_that_cannot_be_read_is_answered_as_left_and_stays",
                  "a_file_of_another_party_that_cannot_be_read_at_the_copys_name_is_no_copy_left",
              ]),
              ("names", LOOP, [
                  "a_read_type_in_another_case_before_its_last_slash_refuses_the_workbook",
              ], []),
              ("races", TIMED, [
                  "written_in_place_while_read::a_checkpoint_written_in_place_while_remove_reads_it_is_left",
                  "swapped_before_the_removal::a_file_moved_into_the_checkpoints_place_during_remove_is_never_removed",
              ], ["written_in_place_while_read::a_checkpoint_written_in_place_while_remove_reads_it_is_left"]),
          ]
          WANT = {"remove": "halvo-checkpoint", "name": "halvo-checkpoint", "races": "halvo-checkpoint",
                  "halvo_checkpoint": "halvo-checkpoint", "replace": "halvo-sheet", "names": "halvo-sheet"}
          build = subprocess.run(["cargo", "test", "--workspace", "--locked", "--no-run", "--message-format=json"],
                                 capture_output=True, text=True)
          if build.returncode != 0:
              print("loop: the test build failed", build.returncode)
              sys.exit(1)
          found = {}
          for line in build.stdout.splitlines():
              try:
                  msg = json.loads(line)
              except ValueError:
                  continue
              if msg.get("reason") != "compiler-artifact" or not msg.get("executable"):
                  continue
              name = msg["target"]["name"]
              pkg = os.path.basename(os.path.dirname(msg["manifest_path"]))
              if WANT.get(name) == pkg and msg["profile"]["test"]:
                  found[name] = (msg["executable"], os.path.dirname(msg["manifest_path"]))
          bad = 0
          for target, runs, names, unix_only in GROUPS:
              if target not in found:
                  print(f"loop {target}: no test executable")
                  bad += 1
                  continue
              exe, cwd = found[target]
              names = [n for n in names if os.name != "nt" or n not in unix_only]
              want = len(names)
              passed = 0
              shown = False
              start = time.time()
              for i in range(runs):
                  run = subprocess.run([exe, "--exact", "--test-threads", "4", *names], cwd=cwd,
                                       capture_output=True, text=True)
                  got = re.search(r"^test result: ok\. (\d+) passed; 0 failed", run.stdout, re.M)
                  if got and int(got.group(1)) == want:
                      passed += 1
                  elif not shown:
                      shown = True
                      print(f"loop {target} run {i + 1}: exit {run.returncode}")
                      print("\n".join((run.stdout + run.stderr).splitlines()[-40:]))
              seconds = time.time() - start
              print(f"loop {target} runs={runs} passed={passed} tests_per_run={want} seconds={seconds:.0f}")
              if passed != runs:
                  bad += 1
          print(f"loop groups={len(GROUPS)} failed_groups={bad}")
          sys.exit(1 if bad else 0)
          PYEOF
          code=$?
          echo "loop exit=$code"
          exit $code
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
