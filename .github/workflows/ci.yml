name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Scratch branch of spike S4 (run 20261108-halvo-r1-capture): this job is cut
  # to one step so that it holds no macOS runner.
  macos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cut for spike S4
        shell: bash
        run: echo "spike S4 runs on the windows job only"

  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the S4 probe
        shell: bash
        run: cargo test -p halvo-capture --test spike_s4 --no-run --locked
      - name: S4 launches
        shell: bash
        run: sh tools/spike-s4/run.sh
