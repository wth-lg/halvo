              ours = len([n for n in new if word_of(n)])
              red = red or ours > 0
              say(f"LOOP target tmp {os.path.relpath(t, repo)}: entries before {len(target_before[t])} after {len(after)} new {len(new)}, of them made by the unit's helpers {ours}; new by word: {sorted(by_word.items())}")
          left = entries(loop_tmp)
          mine = sorted(n for n in left if word_of(n))
          red = red or bool(mine)
          say(f"LOOP system temp of the loop: entries left {len(left)}, of them made by the unit's helpers {len(mine)}")
          real_new = entries(real_tmp) - real_before
          red = red or any(word_of(n) for n in real_new)
          say(f"LOOP system temp of the runner: new entries {len(real_new)}, of them made by the unit's helpers {len([n for n in real_new if word_of(n)])}")
          if not_run:
              red = True
              say(f"LOOP not run, the deadline passed: {' '.join(not_run)}")
          say(f"LOOP seconds {time.monotonic() - started:.0f}")
          sys.exit(1 if red else 0)
          LOOPEOF
          py=$(command -v python || command -v python3)
          "$py" "$RUNNER_TEMP/loop.py"
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
