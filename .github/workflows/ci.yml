name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: U4.9 scratch only, the round's E1 and E2 tests at 99e572d5, form 2 of E1, and the console lines
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git fetch --no-tags --depth=1 origin 99e572d55a678bf2031461d7b762b2cd979ff03b; echo "u49: fetch of 99e572d5 exited $?"
          git worktree add --detach ../u49-old HEAD; echo "u49: work tree exited $?"
          (cd ../u49-old && git checkout 99e572d55a678bf2031461d7b762b2cd979ff03b -- crates/halvo-agent-client/src/proc.rs crates/halvo-agent-client/src/api.rs crates/halvo-agent-client/src/sys/macos.rs crates/halvo-agent-client/src/sys/windows.rs); echo "u49: library of 99e572d5 checked out, exit $?"
          (cd ../u49-old && CARGO_TARGET_DIR=../u49-target-old cargo test -p halvo-agent-client --locked --no-fail-fast --test environment a_marker_in_the_profile_variables_of_the_library_reaches_no_temporary_directory_of_the_runner > ../u49-old-e1.txt 2>&1; echo "u49: E1 at 99e572d5 exited $?")
          grep -E '^test |^test result|panicked at|could not compile|u49-console' ../u49-old-e1.txt
          (cd ../u49-old && CARGO_TARGET_DIR=../u49-target-old cargo test -p halvo-agent-client --locked --no-fail-fast --test handles a_windows_runner_has_a_console_of_its_own -- --nocapture > ../u49-old-e2.txt 2>&1; echo "u49: E2 at 99e572d5 exited $?")
          grep -E '^test |^test result|panicked at|could not compile|u49-console' ../u49-old-e2.txt
          git worktree add --detach ../u49-form2 HEAD; echo "u49: work tree of form 2 exited $?"
          printf '%s' '' | base64 -d > ../u49-form2.patch
          (cd ../u49-form2 && git apply ../u49-form2.patch); echo "u49: form 2 applied, exit $?"
          (cd ../u49-form2 && CARGO_TARGET_DIR=../u49-target-form2 cargo test -p halvo-agent-client --locked --no-fail-fast --test environment a_marker_in_the_profile_variables_of_the_library_reaches_no_temporary_directory_of_the_runner > ../u49-form2-e1.txt 2>&1; echo "u49: E1 with form 2 exited $?")
          grep -E '^test |^test result|panicked at|could not compile|u49-console' ../u49-form2-e1.txt
          cargo test -p halvo-agent-client --locked --no-fail-fast --test handles a_windows_runner_has_a_console_of_its_own -- --nocapture > ../u49-head-e2.txt 2>&1; echo "u49: E2 at the head exited $?"
          grep -E '^test |^test result|panicked at|could not compile|u49-console' ../u49-head-e2.txt
          exit 0
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
