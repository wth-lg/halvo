name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: Loop step of store-3
        if: always()
        shell: bash
        run: |
          export RUST_TEST_THREADS=1
          exe=$(cargo test --locked -p halvo-capture --lib --no-run --message-format=json 2>/dev/null | python3 -c "import json,sys; print([j['executable'] for j in map(json.loads, sys.stdin) if j.get('reason')=='compiler-artifact' and j.get('executable') and j['target']['kind']==['lib']][-1])")
          echo "loop executable: $exe"
          cat > "$RUNNER_TEMP/names.txt" <<'NAMES'
          store::hardening_tests::every_form_of_a_key_file_opens_as_the_result_that_names_it 200
          store::hardening_tests::delete_all_acts_through_its_handle_and_leaves_a_directory_put_at_the_store_name_as_it_was 200
          store::hardening_tests::delete_all_opens_lists_and_changes_nothing_behind_a_link_put_at_the_store_name 200
          store::hardening_tests::the_delete_tail_removes_a_link_at_the_store_name_and_destroys_no_root_that_it_cannot_name 200
          store::hardening_tests::delete_all_with_a_blocked_shard_destroys_the_root_and_the_key_file_and_the_tail_finishes 200
          store::hardening_tests::the_tail_cleans_a_directory_with_a_zeroed_key_file_and_a_fresh_create_takes_it 200
          store::hardening_tests::a_kill_before_each_file_system_call_of_each_operation_leaves_no_key_or_root_behind 20
          store::hardening_tests::a_delete_report_and_its_roots_left_print_each_root_id_in_its_one_text_form 200
          store::hardening_tests::a_custody_made_before_its_root_guard_shares_the_guards_roots_directory 200
          store::hardening_tests::closed_list::control_nothing_moved_the_delete_answers_ok_and_no_root_unwraps 200
          store::hardening_tests::closed_list::delete_all_answers_ok_only_when_no_root_unwraps_after_the_data_directory_moved 200
          store::hardening_tests::closed_list::delete_all_answers_ok_only_when_no_root_unwraps_after_the_roots_directory_moved 200
          store::hardening_tests::closed_list::delete_all_answers_ok_only_when_no_root_unwraps_after_an_empty_directory_took_the_roots_name 200
          store::hardening_tests::closed_list::the_tail_answers_ok_only_when_no_root_unwraps_after_the_roots_directory_moved 200
          store::hardening_tests::closed_list::control_a_second_name_of_a_root_file_of_mode_0600_is_zeroed 200
          store::hardening_tests::closed_list::a_second_name_of_a_root_file_of_mode_0400_is_zeroed_before_delete_all_answers_ok 200
          store::hardening_tests::closed_list::calls_on_a_sealed_handle_answer_sealed_and_touch_nothing 200
          store::hardening_tests::closed_list::p1_with_the_roots_inside_the_store_directory_leaves_no_root_that_unwraps 200
          store::hardening_tests::closed_list::the_tail_with_the_roots_inside_a_moved_store_directory_answers_ok_only_when_the_store_is_gone 200
          store::hardening_tests::closed_list::the_tail_on_a_store_directory_of_mode_000_destroys_the_root_or_reports_it 200
          store::hardening_tests::closed_list::delete_all_with_segments_at_0500_answers_ok_only_when_nothing_of_the_store_is_left 200
          store::hardening_tests::closed_list::a_create_over_a_stale_pending_mark_destroys_no_root_of_a_live_store 200
          store::hardening_tests::closed_list::a_create_whose_publish_meets_an_entry_at_store_key_leaves_that_entry 200
          store::hardening_tests::closed_list::a_second_tail_on_a_key_file_of_version_1_does_not_answer_ok_for_a_root_that_no_call_destroyed 200
          store::hardening_tests::closed_list::the_tail_destroys_a_root_file_whose_name_stands_in_upper_case_on_a_volume_that_folds_case 200
          store::hardening_tests::closed_list::delete_all_of_a_moved_store_keeps_the_root_of_the_store_made_at_its_old_name 200
          store::hardening_tests::closed_list::a_partial_root_file_with_the_root_bytes_that_stays_leaves_delete_all_ok 200
          store::hardening_tests::closed_list::a_store_key_temp_with_the_wrapped_key_that_stays_leaves_delete_all_ok 200
          store::hardening_tests::closed_list::a_create_whose_key_name_is_taken_after_its_root_leaves_what_stands_there 200
          store::hardening_tests::closed_list::a_key_file_version_past_u32_or_below_zero_answers_newer_or_older_store 200
          store::hardening_tests::closed_list::a_create_whose_key_name_is_taken_by_a_plain_file_after_its_root_removes_that_file 200
          store::hardening_tests::closed_list::the_tail_answers_ok_while_a_partial_root_and_a_store_key_temp_stay 200
          store::hardening_tests::closed_list::a_stopped_create_under_a_root_id_that_another_create_then_made_keeps_that_live_root 20
          store::hardening_tests::closed_list::delete_all_after_the_data_directory_moved_keeps_the_root_of_a_store_made_at_the_old_names 200
          store::hardening_tests::closed_list::a_create_removes_a_hard_link_at_store_key_tmp_without_writing_through_it 200
          store::hardening_tests::closed_list::the_second_tail_after_the_roots_directory_moved_does_not_read_the_root_as_destroyed 200
          store::hardening_tests::closed_list::a_second_tail_on_a_key_file_of_version_3_does_not_read_its_root_as_destroyed 200
          store::hardening_tests::closed_list::the_tail_after_a_delete_stopped_after_its_root_step_answers_not_found_then_unnamed 200
          store::hardening_tests::closed_list::the_tail_on_a_key_file_of_a_custody_with_no_root_file_names_the_root_as_not_handled 200
          store::hardening_tests::closed_list_windows::delete_all_names_the_root_as_left_when_the_roots_directory_was_renamed_while_the_store_is_open 200
          store::hardening_tests::closed_list_windows::the_tail_destroys_the_root_or_reports_it_when_the_store_directory_or_its_lock_file_cannot_be_opened 200
          store::hardening_tests::closed_list_windows::a_create_in_a_directory_whose_name_is_not_unicode_leaves_only_the_lock_file_and_makes_no_root 200
          store::hardening_tests::closed_list_windows::the_tail_given_a_verbatim_name_that_ends_in_a_dot_removes_no_sibling_and_reports_what_stays 200
          store::hardening_tests::closed_list_windows::delete_all_zeroes_a_read_only_root_file_under_a_second_name_or_names_the_root 200
          store::hardening_tests::closed_list_windows::delete_all_counts_a_shard_directory_that_another_handle_keeps_from_removal 200
          store::hardening_tests::closed_list_windows::the_tail_destroys_a_root_file_whose_name_was_renamed_to_upper_case 200
          store::hardening_tests::closed_list_windows::delete_all_reports_a_partial_root_file_and_a_key_temp_file_that_a_foreign_handle_keeps 200
          store::hardening_tests::closed_list_windows::a_create_that_loses_the_key_file_name_leaves_the_entry_that_took_it 200
          store::hardening_tests::closed_list_windows::an_open_while_another_handle_holds_the_lock_file_without_sharing_answers_locked 200
          NAMES
          cat > "$RUNNER_TEMP/loop_step.py" <<'LOOP'
          """Runs each test of store-3's round 2, by its built test executable and not by cargo, the number of times its line
          names (200, or 20 for a test that kills a child), and counts a pass only from the run's own result line: the line
          "test result: ok. 1 passed; 0 failed". A filter that matches no test exits 0 and counts as not compiled here.
          usage: python3 loop_step2.py <test executable> <names file: name<space>count per line>"""
          import re
          import subprocess
          import sys
          import time

          exe, names = sys.argv[1], sys.argv[2]
          result_line = re.compile(r"^test result: (\w+)\. (\d+) passed; (\d+) failed", re.M)
          for line in [l.split() for l in open(names) if l.strip()]:
              name, runs = line[0], int(line[1])

              def once():
                  started = time.monotonic()
                  done = subprocess.run([exe, "--exact", name, "--test-threads=1"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  found = result_line.search(done.stdout.decode("utf-8", "replace"))
                  ran = int(found.group(2)) + int(found.group(3)) if found else 0
                  passed = found is not None and found.group(2) == "1" and found.group(3) == "0" and done.returncode == 0
                  return passed, ran, time.monotonic() - started

              passed, ran, first = once()
              if ran == 0:
                  print(f"LOOP {name} not-compiled-here", flush=True)
                  continue
              passes, tests_ran = (1 if passed else 0), ran
              for _ in range(runs - 1):
                  passed, ran, _ = once()
                  passes += 1 if passed else 0
                  tests_ran += ran
              print(f"LOOP {name} runs={runs} passes={passes} tests_ran={tests_ran} first_run_s={first:.2f}", flush=True)
          LOOP
          python3 "$RUNNER_TEMP/loop_step.py" "$exe" "$RUNNER_TEMP/names.txt"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
