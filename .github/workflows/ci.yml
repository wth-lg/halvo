name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-derived
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 50-derived
      - name: The round's new tests 200 times
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH" LC_ALL=C
          cargo test --locked -p halvo-derived --lib --test typed --no-run >"$RUNNER_TEMP/no-run-200.txt" 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            printf 'cargo test --no-run exited %s; its last lines:\n' "$code"
            tail -n 30 "$RUNNER_TEMP/no-run-200.txt"
            exit 1
          fi
          typed=$(sed -n 's/.*Executable tests.typed\.rs (\(.*\))/\1/p' "$RUNNER_TEMP/no-run-200.txt" | tr '\\' '/')
          lib=$(sed -n 's/.*Executable unittests src.lib\.rs (\(.*\))/\1/p' "$RUNNER_TEMP/no-run-200.txt" | tr '\\' '/')
          [ -n "$typed" ] && [ -n "$lib" ] || { printf 'the test binaries were not found\n'; exit 1; }
          pass=0
          shown=0
          i=0
          while [ "$i" -lt 200 ]; do
            i=$((i + 1))
            a=$("$typed" held_ahead_answers_role_before_every_refusal_of_a_kind held_ahead_answers_workflow_run_for_every_kind held_ahead_answers_other_family_for_a_kind 2>&1)
            b=$("$lib" held_ahead_answers_role_before_any_statement 2>&1)
            case $a in *"test result: ok. 3 passed"*) case $b in *"test result: ok. 1 passed"*) pass=$((pass + 1)) ;; esac ;; esac
            case $a in *"test result: ok. 3 passed"*) ;; *) shown=$((shown + 1)); [ "$shown" -le 3 ] && { printf 'run %s, typed binary:\n' "$i"; printf '%s\n' "$a" | grep -E 'FAILED|panicked|left:|right:|error|test result' | head -n 12; } ;; esac
            case $b in *"test result: ok. 1 passed"*) ;; *) shown=$((shown + 1)); [ "$shown" -le 3 ] && { printf 'run %s, lib binary:\n' "$i"; printf '%s\n' "$b" | grep -E 'FAILED|panicked|left:|right:|error|test result' | head -n 12; } ;; esac
          done
          printf 'the round new tests, 4 tests in 2 binaries, 200 runs: passes %s\n' "$pass"
          [ "$pass" -eq 200 ]
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
