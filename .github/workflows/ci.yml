name: ci
# scratch: the built head of land-48, every row of the rows files of the store, of custody and of halvo-sqlcipher to its end by name, in one job; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-rows:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: "Every row of the store's, custody's and halvo-sqlcipher's rows files at land-48's built head to its end by name, with the first failing line of each (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ROWS_FILES: crates/halvo-capture/src/store/mutants.rows crates/halvo-capture/src/custody/mutants.rows crates/halvo-sqlcipher/mutants.rows
        run: |
          set +e -u
          runner=${HALVO_STEP_RUNNER:-scripts/r1-gate/mutation-test.sh}
          tmp=${RUNNER_TEMP:-/tmp}
          out="$tmp/gate-rows.out"
          log="$tmp/gate-cargo-runs.log"
          home="$tmp/gate-cargo-home"
          : >"$log"
          GATE_REAL_CARGO=$(command -v "${HALVO_STEP_CARGO:-cargo}")
          [ -n "$GATE_REAL_CARGO" ] || { printf 'ROWS no cargo on PATH\n'; exit 1; }
          GATE_CARGO_HOME_WAS=${CARGO_HOME-unset}
          GATE_CARGO_LOG=$log
          export GATE_REAL_CARGO GATE_CARGO_HOME_WAS GATE_CARGO_LOG
          PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          printf 'ROWS real cargo %s; CARGO_HOME before the step: %s\n' "$GATE_REAL_CARGO" "$GATE_CARGO_HOME_WAS"
          mkdir -p "$home/bin"
          cat >"$home/bin/cargo" <<'WRAP'
          #!/bin/sh
          # logs each cargo test run with its start and end time and its output; every other cargo command passes through
          if [ "$GATE_CARGO_HOME_WAS" = unset ]; then unset CARGO_HOME; else CARGO_HOME=$GATE_CARGO_HOME_WAS; export CARGO_HOME; fi
          case "${1:-}" in test) ;; *) exec "$GATE_REAL_CARGO" "$@" ;; esac
          f=$(mktemp "${TMPDIR:-/tmp}/gate-cargo-run.XXXXXX")
          start=$(perl -MTime::HiRes=time -e 'printf "%.3f", time')
          "$GATE_REAL_CARGO" "$@" >"$f" 2>&1
          code=$?
          end=$(perl -MTime::HiRes=time -e 'printf "%.3f", time')
          { printf '=== START %s %s\n' "$start" "$*"; cat "$f"; printf '=== END %s exit %s\n' "$end" "$code"; } >>"$GATE_CARGO_LOG"
          cat "$f"
          exit "$code"
          WRAP
          chmod +x "$home/bin/cargo"
          names=''
          # shellcheck disable=SC2086 # the list of rows files is split on purpose
          for f in $ROWS_FILES; do
            n=$(awk -F '\t' 'NF == 6 { print $1 }' "$f")
            printf 'ROWS file %s: %s names\n' "$f" "$(printf '%s\n' "$n" | grep -c .)"
            names="$names $n"
          done
          # shellcheck disable=SC2086 # the names are split on purpose
          total=$(printf '%s\n' $names | grep -c .)
          printf 'ROWS names given: %s\n' "$total"
          set --
          for n in $names; do set -- "$@" --only "$n"; done
          t0=$(date +%s)
          CARGO_HOME="$home" sh "$runner" "$@" 2>&1 | perl -MTime::HiRes=time -ne '$| = 1; printf "%.3f %s", time, $_' >"$out"
          code=${PIPESTATUS[0]}
          printf 'ROWS runner exit %s, seconds %s\n' "$code" "$(($(date +%s) - t0))"
          cut -d ' ' -f 2- "$out" | grep -E '^(PASS|FAIL|OPEN|NOT-RUN|RETIRED|STOPPED|MOVED) (unmutated|mutation)|^seconds mutation:|^mutation rows:' | cut -c1-500 | sed 's/^/ROWS /'
          # shellcheck disable=SC2086 # the list of rows files is split on purpose
          python3 - "$out" "$log" "$total" $ROWS_FILES <<'PY'
          import re, sys
          out, log, total, files = sys.argv[1], sys.argv[2], int(sys.argv[3]), sys.argv[4:]
          verdict = {}
          for f in files:
              for line in open(f, encoding="utf-8"):
                  part = line.rstrip("\r\n").split("\t")
                  if len(part) == 6:
                      verdict[part[0]] = part[3]
          runs, cur = [], None
          for line in open(log, encoding="utf-8", errors="replace"):
              if line.startswith("=== START "):
                  _, _, start, args = line.rstrip("\n").split(" ", 3)
                  cur = {"start": float(start), "args": args, "lines": []}
              elif line.startswith("=== END ") and cur is not None:
                  part = line.split()
                  cur["end"], cur["exit"] = float(part[2]), part[4]
                  runs.append(cur)
                  cur = None
              elif cur is not None:
                  cur["lines"].append(line.rstrip("\n"))
          def first_failing_line(lines):
              for i, line in enumerate(lines):
                  if "panicked at" in line:
                      where = line.split("panicked at", 1)[1].strip().rstrip(":")
                      message = next((l.strip() for l in lines[i + 1:] if l.strip()), "")
                      return f"{message} (at {where})"
              result = [l for l in lines if l.startswith("test result:")]
              return "no panic line; " + (result[-1] if result else "no result line")
          seen, caught, problems = set(), 0, []
          for raw in open(out, encoding="utf-8", errors="replace"):
              stamp, _, line = raw.rstrip("\n").partition(" ")
              m = re.match(r"^(PASS|FAIL|OPEN|NOT-RUN|RETIRED|STOPPED|MOVED) mutation:(\S+) \((.*)\)$", line)
              if not m or m.group(2) not in verdict:
                  continue
              state, name, says = m.groups()
              seen.add(name)
              v = verdict[name]
              if state == "PASS":
                  caught += 1
              else:
                  problems.append(f"{name}: {line}")
              if v.startswith("test "):
                  test = v[5:]
                  before = [r for r in runs if r["end"] <= float(stamp)]
                  run = before[-1] if before else None
                  if run is None:
                      first = "no cargo test run before the result line"
                  elif not run["args"].endswith("--exact " + test):
                      first = f"the last cargo test run before the result line ran {run['args']!r}"
                  else:
                      first = first_failing_line(run["lines"])
              else:
                  first = says.split("gate said: ", 1)[1] if "gate said: " in says else says
              print("TABLE\t" + "\t".join([name, v, state, first.replace("\t", " ")[:600]]))
          missing = sorted(set(verdict) - seen)
          for name in missing:
              problems.append(f"{name}: no result line")
          count = [l.split(" ", 1)[1].rstrip("\n") for l in open(out, encoding="utf-8", errors="replace") if l.split(" ", 1)[-1].startswith("mutation rows: ")]
          print("COUNT " + (count[-1] if count else "no count line"))
          m = re.match(r"mutation rows: (\d+) caught, (\d+) failed, (\d+) open, (\d+) transitional, (\d+) for the measuring Mac not run", count[-1]) if count else None
          ok = bool(m) and int(m.group(1)) == total and m.group(2) == m.group(3) == m.group(5) == "0" and caught == total and not problems and len(verdict) == total
          print(f"COUNT names given {total}, rows read {len(verdict)}, PASS lines {caught}, other lines or none {len(problems)}: {'every row caught' if ok else 'NOT every row caught'}")
          for p in problems:
              print("PROBLEM " + p[:600])
          sys.exit(0 if ok else 1)
          PY
      - name: "15-gate-self-test by name at the joined tree, with its seconds (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          s=$(date +%s)
          sh scripts/ci/run-ci-d.sh macos 15-gate-self-test
          e=$?
          echo "SECONDS 15-gate-self-test $(( $(date +%s) - s )) exit $e (the coordinator's line: over 1,050 s stops the landing before the pull request)"
          exit $e
