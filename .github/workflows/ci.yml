name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the macos job alone (ruling MA-15 (b), push 4)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 51-macos-stall
      - name: ci.d
        shell: bash
        env:
          HALVO_STALL_SESSION: console
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 51-macos-stall
      - name: Probe of the session (MA-15 (b) (1))
        if: ${{ !cancelled() }}
        shell: bash
        timeout-minutes: 4
        continue-on-error: true
        run: |
          set +e
          clang -fobjc-arc -Wall -Wextra -Werror -O1 -framework AppKit -framework CoreGraphics -o "$RUNNER_TEMP/stall-fixture" crates/halvo-capture/tests/macos_stall_fixture/fixture.m || exit 1
          HALVO_STALL_FIXTURE="$RUNNER_TEMP/stall-fixture" cargo test --locked -p halvo-capture --test macos_stall_fixture -- --ignored --exact the_probe_reports_what_the_stall_phases_rest_on --nocapture --test-threads=1 | grep -E '^probe (session_reader|clocks|front)'
      - name: Loops of macos-2b (MA-12 F9, MA-15 (b) (3))
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          set +e
          step_from=$(date +%s)
          fixture="$RUNNER_TEMP/stall-fixture"
          clang -fobjc-arc -Wall -Wextra -Werror -O1 -framework AppKit -framework CoreGraphics -o "$fixture" crates/halvo-capture/tests/macos_stall_fixture/fixture.m || exit 1
          lib=$(cargo test --locked -p halvo-capture --lib --no-run --message-format json | sed -n 's/.*"executable":"\([^"]*halvo_capture-[^"]*\)".*/\1/p' | tail -n 1)
          stall=$(cargo test --locked -p halvo-capture --test macos_stall_fixture --no-run --message-format json | sed -n 's/.*"name":"macos_stall_fixture".*"executable":"\([^"]*\)".*/\1/p')
          [ -x "$lib" ] && [ -x "$stall" ] || exit 1
          failed=0
          passed_of() { sed -n 's/^test result: [a-zA-Z]*\. \([0-9][0-9]*\) passed;.*/\1/p' "$1" | tail -n 1; }
          f1="macos::input::tests::the_source_holds_a_key_down_and_a_modifier_press_and_nothing_else_of_the_keys macos::input::tests::a_flags_change_with_no_event_before_it_is_no_press macos::input::tests::pointer_events_are_recorded_and_the_tap_notices_are_no_event_of_the_mask macos::input::tests::the_tap_listens_for_exactly_the_types_that_it_holds_records_or_reads macos::input::tests::a_key_read_off_is_recorded_only_when_it_is_as_old_as_the_bound macos::input::tests::a_key_read_as_secure_counts_one_suppression_and_is_never_recorded macos::input::tests::a_key_down_read_off_is_dropped_when_the_key_up_after_it_reads_on macos::input::tests::three_key_downs_read_off_on_on_record_nothing_and_count_two_suppressions macos::input::tests::a_key_up_and_a_modifier_release_read_off_are_never_recorded macos::input::tests::a_modifier_press_read_off_is_held_and_recorded_at_the_bound macos::input::tests::a_tick_that_reads_on_drops_every_held_key_and_counts_nothing macos::input::tests::a_session_that_leaves_the_console_drops_every_held_key macos::input::tests::while_the_session_reads_unknown_no_key_is_held macos::input::tests::the_session_is_read_at_the_start_and_again_after_its_step_while_keys_are_held macos::input::tests::a_gap_between_two_readings_drops_every_held_key_and_stalls_the_source_until_a_release macos::input::tests::a_key_that_arrives_after_a_gap_drops_the_keys_held_before_it macos::input::tests::a_gap_of_the_bound_keeps_the_held_keys macos::input::tests::the_gap_is_counted_on_the_monotonic_clock macos::input::tests::a_late_key_drops_every_held_key_and_a_lag_above_250_ms_counts_as_late macos::input::tests::an_untimed_key_drops_every_held_key macos::input::tests::the_callback_reads_an_events_os_time_against_the_uptime_clock macos::input::tests::a_switched_off_tap_drops_every_held_key_before_it_is_switched_on_again macos::input::tests::the_daemons_own_take_drops_every_held_key macos::input::tests::a_stop_empties_the_hold_records_nothing_and_withholds_nothing macos::input::tests::a_stop_asked_between_two_releases_ends_the_release macos::input::tests::each_release_takes_a_reading_of_its_own macos::input::tests::a_reading_after_a_release_that_finds_a_gap_drops_the_keys_behind_it macos::input::tests::a_full_hold_drops_every_held_key_and_the_key_that_found_it_full macos::input::tests::a_refused_emit_drops_every_held_key_and_withholds_nothing macos::input::tests::a_blocked_emit_ends_as_a_gap_that_drops_the_keys_behind_it macos::input::tests::a_released_key_carries_its_own_instant_the_app_of_its_arrival_and_a_number_of_its_release macos::input::tests::a_held_key_holds_its_time_and_app_alone macos::input::tests::the_held_keys_at_their_cap_stay_under_the_bytes_of_the_ledger macos::input::tests::the_reading_timer_exists_only_while_keys_are_held macos::input::tests::the_reading_timer_on_the_run_loop_of_the_thread_releases_a_due_key macos::input::tests::the_context_invalidates_its_timer_before_its_fields_drop macos::input::tests::a_pointer_event_is_recorded_at_once_and_its_reading_drops_the_held_keys macos::input::tests::each_event_of_every_pair_through_the_callback_is_decided_by_its_own_reading_and_those_after_it macos::input::tests::each_event_of_a_drawn_sequence_through_the_callback_is_decided_by_its_own_reading macos::input::tests::the_reader_that_the_tap_gets_asks_the_system_once_for_each_call macos::input::tests::the_production_reader_reads_a_real_hold_as_on macos::input::tests::the_production_reader_reads_off_on_during_a_hold_and_off_again macos::input::tests::a_hold_under_a_blocked_emit_outlives_a_timed_out_shutdown_and_the_drop_until_the_sink_is_read macos::input::tests::the_callback_that_the_tap_gets_counts_a_key_read_as_secure macos::input::tests::a_started_source_counts_a_key_under_a_real_hold_through_the_callback_that_it_installs macos::input::tests::the_callback_that_the_tap_gets_reenables_a_disabled_tap macos::input::tests::the_tap_reads_the_secure_state_the_session_and_the_clocks_of_the_os macos::input::tests::the_clocks_are_the_raw_monotonic_and_uptime_clocks macos::input::tests::the_product_constructors_read_the_session_of_the_system macos::input::tests::a_started_source_reads_the_session_through_its_own_reader macos::input::tests::the_product_constructor_holds_for_the_bound_of_the_product macos::input::tests::a_started_source_reads_impaired_while_it_is_stalled macos::input::tests::a_timed_hold_invalidates_its_timer_before_its_slot_releases_the_hold macos::input::tests::stop_ends_the_tap_thread_within_one_second macos::input::tests::a_stop_before_the_run_loop_runs_ends_the_tap_thread_within_one_second macos::input::tests::a_second_source_built_on_the_same_handle_reads_the_first_sources_count macos::input::tests::a_late_key_at_the_bound_drops_the_key_its_own_reading_would_release macos::input::tests::an_untimed_key_at_the_bound_drops_every_held_key_with_the_oldest macos::input::tests::a_late_key_up_drops_every_held_key macos::input::tests::a_reading_of_on_after_a_stop_is_asked_withholds_nothing macos::input::tests::a_key_event_after_a_stop_is_asked_moves_nothing macos::input::tests::a_gap_after_a_stop_is_asked_leaves_the_source_unstalled macos::input::secure_input_invariant::a_key_press_under_secure_input_records_nothing_and_is_counted macos::input::secure_input_invariant::a_suppressed_key_raises_the_count_from_zero_to_one macos::input::secure_input_invariant::pointer_events_record_under_secure_input_without_a_count macos::input::secure_input_invariant::a_key_event_without_secure_input_is_recorded_at_its_release_and_not_at_its_arrival secure_input::macos::tests::a_session_is_known_only_at_the_console secure_input::macos::tests::a_session_not_at_the_console_or_with_no_dictionary_reads_unknown_and_asks_nothing secure_input::macos::tests::a_session_at_the_console_reads_the_state secure_input::macos::tests::the_session_of_this_process_has_a_dictionary secure_input::macos::hold::tests::a_late_reading_drops_a_key_that_is_due_and_releases_none secure_input::macos::hold::tests::the_bounds_are_their_first_values secure_input::macos::hold::tests::a_key_is_released_when_it_is_as_old_as_the_bound_and_not_before secure_input::macos::hold::tests::a_reading_of_on_drops_the_held_keys secure_input::macos::hold::tests::a_reading_of_unknown_drops_the_held_keys secure_input::macos::hold::tests::a_reading_of_on_or_unknown_drops_even_a_key_that_is_due secure_input::macos::hold::tests::a_gap_above_the_bound_drops_the_held_keys_before_a_due_key_is_released secure_input::macos::hold::tests::a_reading_before_the_one_before_it_or_with_none_before_it_is_a_gap secure_input::macos::hold::tests::with_nothing_held_every_reading_waits secure_input::macos::hold::tests::a_gap_before_a_key_arrives_onto_an_empty_hold_keeps_that_key secure_input::macos::hold::tests::a_key_in_time_is_in_time_up_to_the_gap_bound secure_input::macos::hold::tests::a_key_with_an_os_time_of_0_after_its_arrival_or_unread_is_untimed secure_input::macos::hold::tests::a_late_key_is_dropped_and_drops_every_held_key secure_input::macos::hold::tests::an_untimed_key_is_dropped_and_drops_every_held_key secure_input::macos::hold::tests::a_key_that_arrives_under_on_is_suppressed_and_not_held secure_input::macos::hold::tests::a_key_that_arrives_under_unknown_is_withheld_and_not_held secure_input::macos::hold::tests::a_key_beyond_the_cap_drops_every_held_key_and_itself secure_input::macos::hold::tests::a_drop_takes_the_oldest_and_the_newest_key_alike secure_input::macos::hold::tests::one_reading_releases_one_key_and_the_keys_go_in_their_order secure_input::macos::hold::tests::a_released_key_had_every_reading_off_and_in_time_from_its_arrival secure_input::macos::hold::tests::the_causes_that_set_keys_withheld_and_the_timing_faults secure_input::macos::hold::tests::the_cap_holds_the_keys_of_the_bound_at_the_fastest_repeat_beside_a_fast_typist macos::foreground::tests::a_metadata_only_event_carries_the_identity_and_no_persisted_bytes macos::foreground::tests::an_emit_carries_the_instant_that_it_is_given macos::foreground::tests::two_emits_carry_increasing_sequences_and_wall_clocks_between_the_calls"
          count=$(printf '%s\n' $f1 | grep -c .)
          listed=$("$lib" --exact $f1 --list | grep -c ': test$')
          echo "loop F1 names=$count listed=$listed"
          [ "$listed" -eq "$count" ] || failed=1
          from=$(date +%s); sum=0; runs_ok=0
          for i in $(seq 1 200); do
            "$lib" --exact $f1 --test-threads=4 > "$RUNNER_TEMP/f1.log" 2>&1
            n=$(passed_of "$RUNNER_TEMP/f1.log"); n=${n:-0}
            sum=$((sum + n))
            if [ "$n" -eq "$count" ] && grep -q '^test result: ok\.' "$RUNNER_TEMP/f1.log"; then runs_ok=$((runs_ok + 1)); else failed=1; echo "loop F1 run=$i passed=$n of $count"; grep -E "panicked at|^test .* FAILED" "$RUNNER_TEMP/f1.log" | head -n 5; fi
          done
          echo "loop F1 tests=$count runs=200 runs_with_every_test_passed=$runs_ok passed_sum=$sum expected_sum=$((count * 200)) seconds=$(( $(date +%s) - from ))"
          "$lib" --ignored --exact --nocapture macos::input::tests::measure_the_readings_of_the_hold > "$RUNNER_TEMP/measure.log" 2>&1
          grep '^measure' "$RUNNER_TEMP/measure.log"; echo "loop measure passed=$(passed_of "$RUNNER_TEMP/measure.log")"
          stall_run() {
            HALVO_STALL_FIXTURE="$fixture" "$stall" --ignored --exact --nocapture --test-threads=1 "$1" > "$RUNNER_TEMP/stall.log" 2>&1
            grep -E "^$1 (session_reader=|fixture=|round=|control=|verdict=|notdriven )" "$RUNNER_TEMP/stall.log"
            grep -E "panicked at|^$1: " "$RUNNER_TEMP/stall.log" | head -n 4
            n=$(passed_of "$RUNNER_TEMP/stall.log"); n=${n:-0}
            case $2 in
              known-fault) grep -q '^test result: FAILED\. 0 passed; 1 failed;' "$RUNNER_TEMP/stall.log" && grep -q 'recorded keys beside the markers in rounds that counted' "$RUNNER_TEMP/stall.log" ;;
              *) [ "$n" -eq 1 ] && grep -q '^test result: ok\.' "$RUNNER_TEMP/stall.log" ;;
            esac
          }
          export HALVO_STALL_SESSION=real
          for pair in a_key_typed_ahead_into_a_secure_field_is_not_recorded:phase a_key_typed_ahead_of_a_click_into_a_secure_field_is_not_recorded:phase a_key_typed_ahead_of_a_focus_move_by_the_program_is_not_recorded:phase the_up_of_the_key_that_leaves_a_secure_field_is_not_recorded:phase the_control_records_the_keys_typed_in_the_plain_field_and_none_of_the_secure_field:phase at_the_bound_of_the_product_a_stall_records_nothing_and_the_control_records_its_keys:phase a_key_typed_on_a_return_to_a_secure_field_is_not_recorded:three-way known_fault_a_key_typed_ahead_of_a_stall_longer_than_the_bound_is_not_recorded:known-fault known_fault_a_password_typed_whole_ahead_of_a_stall_is_not_recorded:known-fault; do
            test=${pair%%:*}; kind=${pair#*:}
            started=$(date +%s)
            stall_run "$test" "$kind"; ok=$?
            echo "loop real test=$test kind=$kind as_listed=$([ "$ok" -eq 0 ] && echo 1 || echo 0) seconds=$(( $(date +%s) - started ))"
          done
          export HALVO_STALL_SESSION=console
          for pair in a_key_typed_ahead_of_a_click_into_a_secure_field_is_not_recorded:phase a_key_typed_ahead_of_a_focus_move_by_the_program_is_not_recorded:phase the_up_of_the_key_that_leaves_a_secure_field_is_not_recorded:phase the_control_records_the_keys_typed_in_the_plain_field_and_none_of_the_secure_field:phase at_the_bound_of_the_product_a_stall_records_nothing_and_the_control_records_its_keys:phase a_key_typed_on_a_return_to_a_secure_field_is_not_recorded:three-way known_fault_a_key_typed_ahead_of_a_stall_longer_than_the_bound_is_not_recorded:known-fault known_fault_a_password_typed_whole_ahead_of_a_stall_is_not_recorded:known-fault; do
            test=${pair%%:*}; kind=${pair#*:}
            from=$(date +%s); runs=0; as_listed=0
            while [ "$runs" -lt 5 ]; do
              started=$(date +%s)
              stall_run "$test" "$kind"; ok=$?
              runs=$((runs + 1))
              [ "$ok" -eq 0 ] && as_listed=$((as_listed + 1)) || failed=1
              echo "loop console test=$test kind=$kind run=$runs as_listed=$([ "$ok" -eq 0 ] && echo 1 || echo 0) seconds=$(( $(date +%s) - started ))"
            done
            echo "loop console test=$test kind=$kind runs=$runs as_listed=$as_listed seconds=$(( $(date +%s) - from ))"
          done
          named=a_key_typed_ahead_into_a_secure_field_is_not_recorded
          budget=$(( 45 * 60 ))
          from=$(date +%s); runs=0; passes=0
          while [ "$runs" -lt 20 ]; do
            if [ "$runs" -ge 5 ] && [ $(( $(date +%s) - step_from )) -ge "$budget" ]; then echo "loop named stopped after $runs runs: the step has used $(( $(date +%s) - step_from )) s of its 45 min for starting named runs"; break; fi
            started=$(date +%s)
            stall_run "$named" phase; ok=$?
            runs=$((runs + 1))
            [ "$ok" -eq 0 ] && passes=$((passes + 1)) || failed=1
            echo "loop console named run=$runs passed=$([ "$ok" -eq 0 ] && echo 1 || echo 0) seconds=$(( $(date +%s) - started ))"
          done
          echo "loop console named test=$named runs=$runs passed=$passes seconds=$(( $(date +%s) - from ))"
          echo "loop step seconds=$(( $(date +%s) - step_from )) failed=$failed"
          exit "$failed"
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

