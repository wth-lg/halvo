            for run in 1 2 3; do
              timeout 900 cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact "$t" --nocapture --test-threads=1 >"$log" 2>&1 </dev/null
              echo "UNDO w311-fold-out test=$t run=$run exit=$?"
              tr -d '\r' <"$log" | grep -E 'phase=tab-after round=|password_keys_recorded=|panicked at|^  left|^ right|INCONCLUSIVE|^test result' | cut -c1-400 | head -n 12
            done
          done
          echo "UNDO end"
          exit 0
