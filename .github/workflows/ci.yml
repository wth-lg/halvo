name: ci
# scratch: the verifier's own cells of U0.4 (verifier-33); never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Driver trial
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          d="$GITHUB_WORKSPACE/tools/r4-trials/driver"
          fail=0
          cd "$d" || exit 1
          echo "trial os=$RUNNER_OS head=$(git rev-parse HEAD)"

          started=$(date +%s)
          sh "$d/run.sh" --dialog system
          code=$?
          echo "trial run_dialog exit=$code seconds=$(($(date +%s) - started))"
          [ "$code" = 0 ] || fail=1

          started=$(date +%s)
          sh "$d/run.sh" --candidate webdriver
          code=$?
          echo "trial run_driver exit=$code seconds=$(($(date +%s) - started))"
          [ "$code" = 0 ] || fail=1

          git -C "$GITHUB_WORKSPACE" status --porcelain --untracked-files=no >"$RUNNER_TEMP/r4-status.txt"
          echo "trial tracked_changed=$(wc -l <"$RUNNER_TEMP/r4-status.txt" | tr -d ' ')"
          exit "$fail"
