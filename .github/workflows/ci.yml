name: ci

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sh scripts/check-commit-messages.sh --self-test
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            sh scripts/check-commit-messages.sh "origin/$DEFAULT_BRANCH..$AFTER"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            sh scripts/check-commit-messages.sh "$BEFORE..$AFTER"
          else
            echo "The before value '$BEFORE' is not a commit in this clone: the push created the branch, or a force push dropped its old tip. Checking every commit of $AFTER."
            sh scripts/check-commit-messages.sh "$AFTER"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@v2
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Test
        shell: bash
        run: cargo test --workspace
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        shell: bash
        run: cargo fmt --check
      - name: Build
        shell: bash
        run: npm run tauri build
      - name: Version
        shell: bash
        run: test "$(target/release/bundle/macos/Halvo.app/Contents/MacOS/halvo --version)" = 0.0.0
      - uses: actions/upload-artifact@v7
        with:
          name: halvo-macos
          path: target/release/bundle/macos/Halvo.app
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@v2
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Test
        shell: bash
        run: cargo test --workspace
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        shell: bash
        run: cargo fmt --check
      - name: Build
        shell: bash
        run: npm run tauri build -- --no-bundle
      - name: Version
        shell: bash
        run: test "$(target/release/halvo.exe --version)" = 0.0.0
      - uses: actions/upload-artifact@v7
        with:
          name: halvo-windows
          path: target/release/halvo.exe
          if-no-files-found: error
