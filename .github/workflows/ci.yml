name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 31-fixture-server
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 31-fixture-server
      - name: Loop of the unit's new tests (scratch, U2.2c)
        shell: bash
        run: |
          set -u
          set +e +o pipefail
          cargo test --locked -p halvo-sample --no-run >"$RUNNER_TEMP/u22c-no-run.txt" 2>&1 || { tail -n 20 "$RUNNER_TEMP/u22c-no-run.txt"; exit 1; }
          bin_of() {
            sed -n "s|^ *Executable $1 (\(.*\))\$|\1|p" "$RUNNER_TEMP/u22c-no-run.txt" | head -n 1 | tr '\134' '/'
          }
          bad=0
          run_loop() {
            label=$1
            bin=$(bin_of "$2")
            shift 2
            want=$#
            if [ -z "$bin" ]; then
              echo "loop $label: no test binary"
              bad=1
              return
            fi
            pass=0
            failed=0
            i=0
            while [ "$i" -lt 200 ]; do
              out=$("$bin" --exact "$@" --test-threads=1 2>&1)
              if printf '%s\n' "$out" | grep -q "^test result: ok. $want passed; 0 failed"; then
                pass=$((pass + 1))
              else
                failed=$((failed + 1))
                printf '%s\n' "$out" | tail -n 15
              fi
              i=$((i + 1))
            done
            echo "loop $label tests=$want runs=$i runs_with_all_passed=$pass runs_not_all_passed=$failed"
            [ "$failed" = 0 ] || bad=1
          }
          node_loop() {
            label=$1
            file=$2
            pattern=$3
            want=$4
            pass=0
            failed=0
            i=0
            while [ "$i" -lt 200 ]; do
              out=$(node --test --test-reporter=tap --test-name-pattern="$pattern" "tools/fixture-server/$file" 2>&1)
              if printf '%s\n' "$out" | grep -q '^# fail 0$' && printf '%s\n' "$out" | grep -q "^# pass $want\$" && printf '%s\n' "$out" | grep -q "^# tests $want\$"; then
                pass=$((pass + 1))
              else
                failed=$((failed + 1))
                printf '%s\n' "$out" | grep -E '^(# |not ok)' | head -n 10
              fi
              i=$((i + 1))
            done
            echo "loop $label tests=$want runs=$i runs_with_all_passed=$pass runs_not_all_passed=$failed"
            [ "$failed" = 0 ] || bad=1
          }
          started=$(date +%s)
          run_loop input_copy 'tests/input_copy.rs' the_tier_manifest_refusal_names_the_tier_argument_and_a_count_alone the_tier_files_refusal_of_input_copy_names_the_tier_argument_alone the_output_refusal_of_input_copy_and_build_names_the_dir_argument_alone
          run_loop links 'tests/links.rs' a_tier_argument_that_is_a_link_is_refused_in_each_of_its_forms a_link_reached_through_a_linked_parent_and_a_trailing_separator_is_refused
          run_loop compose 'tests/compose.rs' the_site_data_refusal_names_a_file_by_its_number_in_byte_order_alone
          run_loop split 'tests/split.rs' a_side_directory_that_cannot_be_made_is_refused_by_the_out_argument_and_its_side_alone
          node_loop server server.test.mjs '^server: refusals usage, site-data and port' 1
          node_loop sites sites.test.mjs '^(checker: a file not of C11\.1|loading: a missing file)' 2
          echo "loop seconds $(( $(date +%s) - started ))"
          exit "$bad"
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 30-sample 31-fixture-server
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 30-sample 31-fixture-server
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Loop of the unit's new tests (scratch, U2.2c)
        shell: bash
        run: |
          set -u
          set +e +o pipefail
          cargo test --locked -p halvo-sample --no-run >"$RUNNER_TEMP/u22c-no-run.txt" 2>&1 || { tail -n 20 "$RUNNER_TEMP/u22c-no-run.txt"; exit 1; }
          bin_of() {
            sed -n "s|^ *Executable $1 (\(.*\))\$|\1|p" "$RUNNER_TEMP/u22c-no-run.txt" | head -n 1 | tr '\134' '/'
          }
          bad=0
          run_loop() {
            label=$1
            bin=$(bin_of "$2")
            shift 2
            want=$#
            if [ -z "$bin" ]; then
              echo "loop $label: no test binary"
              bad=1
              return
            fi
            pass=0
            failed=0
            i=0
            while [ "$i" -lt 200 ]; do
              out=$("$bin" --exact "$@" --test-threads=1 2>&1)
              if printf '%s\n' "$out" | grep -q "^test result: ok. $want passed; 0 failed"; then
                pass=$((pass + 1))
              else
                failed=$((failed + 1))
                printf '%s\n' "$out" | tail -n 15
              fi
              i=$((i + 1))
            done
            echo "loop $label tests=$want runs=$i runs_with_all_passed=$pass runs_not_all_passed=$failed"
            [ "$failed" = 0 ] || bad=1
          }
          node_loop() {
            label=$1
            file=$2
            pattern=$3
            want=$4
            pass=0
            failed=0
            i=0
            while [ "$i" -lt 200 ]; do
              out=$(node --test --test-reporter=tap --test-name-pattern="$pattern" "tools/fixture-server/$file" 2>&1)
              if printf '%s\n' "$out" | grep -q '^# fail 0$' && printf '%s\n' "$out" | grep -q "^# pass $want\$" && printf '%s\n' "$out" | grep -q "^# tests $want\$"; then
                pass=$((pass + 1))
              else
                failed=$((failed + 1))
                printf '%s\n' "$out" | grep -E '^(# |not ok)' | head -n 10
              fi
              i=$((i + 1))
            done
            echo "loop $label tests=$want runs=$i runs_with_all_passed=$pass runs_not_all_passed=$failed"
            [ "$failed" = 0 ] || bad=1
          }
          started=$(date +%s)
          run_loop input_copy 'tests/input_copy.rs' the_tier_manifest_refusal_names_the_tier_argument_and_a_count_alone the_tier_files_refusal_of_input_copy_names_the_tier_argument_alone
          run_loop links 'tests/links.rs' a_tier_argument_that_is_a_link_is_refused_in_each_of_its_forms a_link_reached_through_a_linked_parent_and_a_trailing_separator_is_refused
          run_loop compose 'tests/compose.rs' the_site_data_refusal_names_a_file_by_its_number_in_byte_order_alone
          node_loop server server.test.mjs '^server: refusals usage, site-data and port' 1
          node_loop sites sites.test.mjs '^(checker: a file not of C11\.1|loading: a missing file)' 2
          echo "loop seconds $(( $(date +%s) - started ))"
          exit "$bad"
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
