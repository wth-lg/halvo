name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: U0.7d steps
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format
      - name: Web trial (U0.7d) format, clippy, build and whole suite
        shell: bash
        run: |
          set -e -o pipefail
          cd tools/r3-trials/web
          export CARGO_BUILD_JOBS=4 RUST_TEST_THREADS=4
          t0=$(date +%s)
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo build --locked
          t1=$(date +%s)
          echo "seconds step=web_lint_build s=$((t1 - t0))"
          cargo test --locked > "$RUNNER_TEMP/web-test.log" 2>&1 || { grep -E '^test |^test result|Running|panicked' "$RUNNER_TEMP/web-test.log" | grep -v ' ok$' | head -60; sed -n '/^failures:$/,/^test result/p' "$RUNNER_TEMP/web-test.log" | head -150; exit 1; }
          grep -E '^test result|Running' "$RUNNER_TEMP/web-test.log"
          echo "fence_refused_lines=$(grep -c '^fence_refused ' "$RUNNER_TEMP/web-test.log" || true)"
          t2=$(date +%s)
          echo "seconds step=web_whole_suite s=$((t2 - t1))"
      - name: Web trial (U0.7d) loop of the added tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -e -o pipefail
          export CARGO_BUILD_JOBS=4
          t0=$(date +%s)
          python - windows <<'PY'
          """loop.py SYSTEM: runs each test that U0.7d added (200 times) and each guard test of the fixture that
          it changed (20 times) on SYSTEM (macos or windows), one run at a time, by its exact name in its built
          test binary. A pass is counted by libtest's result line `test result: ok. 1 passed;`, never by the
          exit code; the loop prints for each name the runs, the passes and the expected count of tests per
          run, and exits 1 when a name's passes differ from its runs."""
          import json
          import os
          import subprocess
          import sys
          import time

          CRATE = os.path.join(os.getcwd(), "tools", "r3-trials", "web")
          SYSTEM = sys.argv[1]
          BOTH_LIB = [
              "checks::tests::g1_a_process_near_the_profile_is_no_run_s_own_and_is_sent_nothing",
              "checks::tests::g1_the_run_s_own_forms_bear_the_mark_and_another_profile_does_not",
              "checks::tests::a_profile_is_borne_by_the_two_exact_forms_alone",
              "checks::tests::g1_a_windows_command_line_is_split_by_the_system_s_rule",
              "checks::tests::end_runs_own_on_a_built_table_sends_the_end_to_the_own_stand_in_alone_through_the_fence",
              "relay::tests::g1_the_guard_asks_no_adopted_process_near_the_profile",
              "procs::tests::an_end_of_a_process_that_no_fence_admits_sends_nothing_and_fails_at_the_call",
              "procs::tests::the_fence_admits_the_test_s_own_processes_alone_on_built_tables",
              "procs::tests::an_admission_holds_for_its_own_thread_while_it_is_held",
              "procs::tests::the_fence_never_admits_this_process",
              "checks::tests::a_share_is_no_rooted_path_and_the_case_of_ascii_letters_alone_is_ignored",
              "checks::tests::the_first_process_s_profile_is_read_from_the_split_arguments",
          ]
          PLAN = [("lib", n, 200) for n in BOTH_LIB]
          PLAN.append(("web-trial", "driver::org_tests::sh_path_maps_a_drive_letter_to_a_root_directory", 200))
          for n in ["the_server_is_gone_within_its_bound_when_its_trial_process_is_killed",
                    "a_server_that_its_trial_drops_without_a_stop_is_gone_when_the_drop_returns",
                    "a_server_of_a_trial_that_panics_is_gone_when_the_panic_has_unwound"]:
              PLAN.append(("fixture_guard", n, 20))
          if SYSTEM == "windows":
              PLAN += [("lib", "procs::tests::on_windows_the_ask_sends_nothing_and_says_so", 200),
                       ("lib", "checks::tests::the_split_is_the_system_s_own_on_a_table_of_lines", 200),
                       ("lib", "peer::tests::pipe_holders_answers_while_the_pipe_has_a_pending_read_in_the_holder", 200),
                       ("start_windows", "the_ends_that_this_process_keeps_are_not_inheritable_after_a_start", 200),
                       ("start_windows", "a_start_closes_its_own_handle_of_the_child_s_error_file", 200)]
          else:
              PLAN.append(("signals", "the_program_s_fence_refuses_an_end_outside_its_directory", 200))

          built = subprocess.run(["cargo", "test", "--locked", "--no-run", "--message-format=json"], cwd=CRATE,
                                 capture_output=True, text=True, check=True).stdout
          exes = {}
          for line in built.splitlines():
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if m.get("reason") == "compiler-artifact" and m.get("executable") and m.get("profile", {}).get("test"):
                  name = m["target"]["name"]
                  kinds = m["target"]["kind"]
                  exes["lib" if "lib" in kinds else name] = m["executable"]
          bad = 0
          for target, name, runs in PLAN:
              exe = exes.get(target)
              if exe is None:
                  print("loop target=%s name=%s runs=0 ok=0 expected_tests=1 cause=no_binary" % (target, name))
                  bad += 1
                  continue
              ok = 0
              t0 = time.monotonic()
              for _ in range(runs):
                  out = subprocess.run([exe, name, "--exact", "--test-threads=1"], cwd=CRATE, capture_output=True, text=True)
                  if any(l.startswith("test result: ok. 1 passed;") for l in out.stdout.splitlines()):
                      ok += 1
              print("loop target=%s name=%s runs=%d ok=%d expected_tests=1 seconds=%.0f" % (target, name, runs, ok, time.monotonic() - t0))
              if ok != runs:
                  bad += 1
          print("loop system=%s names=%d failing_names=%d" % (SYSTEM, len(PLAN), bad))
          sys.exit(1 if bad else 0)
          PY
          echo "seconds step=web_loop s=$(( $(date +%s) - t0 ))"
      - name: Web trial (U0.7d) widening copies, by the exact names of their tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          export CARGO_BUILD_JOBS=4 RUST_TEST_THREADS=4
          t0=$(date +%s)
          python - windows <<'PY'
          """mutants.py MODE [ROW ...]: one-rule changes of the lines that U0.7d wrote in tools/r3-trials/web.

          MODE local runs the rows of class `local` here: copies that narrow who is signalled or touch no end
          of a process, each by the exact names of its tests, on stand-in tables or the test's own processes.
          MODE macos or windows runs, on a hosted runner alone (GITHUB_ACTIONS=true), the rows of class
          `hosted` for that system and `both`: copies that could widen who is signalled. MODE apply-only
          applies and restores every row without a build, to show that each one's text is found once.
          Each row is applied to its file, run, and the file restored with `git checkout -- <file>`.
          A row is caught when the command exits non-zero, survives when it exits 0. Prints one line per
          row and a last line with the counts; exits 1 when a row expected to be caught survived or when a
          row's text is not found once."""
          import os
          import subprocess
          import sys
          import time

          CRATE = os.environ.get("R3_WEB_CRATE", os.path.join(os.getcwd(), "tools", "r3-trials", "web"))
          LIB = ["--lib"]
          BIN = ["--bin", "web-trial"]


          def T(*names):
              return list(names)


          ROWS = [
              # id, class, systems, file, old, new, cargo target, tests, expected ("caught" or "survives: reason")
