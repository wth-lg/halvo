          ]
          R4EOF
          P="$T/pages"
          mkdir -p "$P"
          cp "$app"/pages/* "$app"/selfcheck-pages/* "$P/"
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Trial</title><p>no call.js</p>' >"$P/nocall.html"
          cat >"$P/fetch.js" <<'R4EOF'
          (function () {
            'use strict';
            var app = window.r4app;
            fetch('https://example.com/', { mode: 'no-cors' }).then(function (response) {
              app.report('fetch reached=yes type=' + response.type);
            }, function (error) {
              app.report('fetch reached=no error=' + error.name);
            }).then(function () {
              setTimeout(function () {
                app.report('fetch nav_stayed=yes');
              }, 3000);
              location.href = 'https://example.com/';
            });
          })();
          R4EOF
          node -e 'const fs = require("fs"); const [from, to] = process.argv.slice(1); const tag = "<script src=\"page.js\"></script>"; fs.writeFileSync(to, fs.readFileSync(from, "utf8").replace(tag, tag + "\n<script src=\"fetch.js\"></script>"))' "$app/pages/index.html" "$P/fetch.html"
          sha() { node -e 'console.log(require("crypto").createHash("sha256").update(require("fs").readFileSync(process.argv[1])).digest("hex").slice(0, 16))' "$1"; }
          echo "verifier mode=4 os=$RUNNER_OS head=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD) parent=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD^)"

          started=$(date +%s)
          cargo build --release --locked --manifest-path "$app/Cargo.toml"
          code=$?
          echo "verifier build=$([ "$code" = 0 ] && echo ok || echo fail) exit=$code seconds=$(($(date +%s) - started))"
          if [ "$code" != 0 ]; then exit 1; fi
          base_sha=$(sha "$bin")
          echo "verifier binary_bytes=$(wc -c <"$bin" | tr -d ' ') sha=$base_sha"
          (cd "$app" && node --test tests/) >"$T/node-test.out" 2>&1
          code=$?
          tr -d '\r' <"$T/node-test.out" | grep -E '^. (tests|pass|fail) [0-9]+$' | sed 's/^/verifier node_test /'
          echo "verifier node_test exit=$code"

          if [ "4" = 3 ]; then
            started=$(date +%s)
            node "$app/selfcheck.mjs" --bin "$bin" --trace >"$T/selfcheck.out" 2>&1
            code=$?
            sed 's/^/verifier unchanged /' "$T/selfcheck.out"
            echo "verifier unchanged selfcheck_exit=$code seconds=$(($(date +%s) - started))"
            node "$T/probe.mjs" fetch "$app" "$bin" "$P"
            echo "verifier probe_fetch exit=$?"
            node "$T/probe.mjs" net "$app" "$bin" "$P"
            echo "verifier probe_net exit=$?"
            node "$T/answers.mjs" "$app" "$bin" "$P" main
            node "$T/answers.mjs" "$app" "$bin" "$P" b
            node "$T/answers.mjs" "$app" "$bin" "$P" a2
          fi

          prev_sha=$base_sha
          for id in $(node -e 'for (const c of JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))) console.log(c.id)' "$T/copies.json"); do
            field() { node -e 'const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).find((c) => c.id === process.argv[2]); console.log(c[process.argv[3]])' "$T/copies.json" "$id" "$1"; }
            applied=$(node "$T/mutate.mjs" "$T/copies.json" "$id" "$app")
            echo "$applied"
            case "$applied" in *apply=ok*) ;; *) git -C "$GITHUB_WORKSPACE" checkout -q -- tools/r4-trials/app; continue ;; esac
            kind=$(field kind)
            run=$(field run)
            reps=$(field repeat)
            if [ "$kind" = rust ]; then
              started=$(date +%s)
              cargo build --release --locked --manifest-path "$app/Cargo.toml" >"$T/copy-$id-build.out" 2>&1
              code=$?
              now_sha=$(sha "$bin")
              echo "copy=$id build=$([ "$code" = 0 ] && echo ok || echo fail) seconds=$(($(date +%s) - started)) sha=$now_sha differs_from_base=$([ "$now_sha" != "$base_sha" ] && echo yes || echo no) differs_from_previous=$([ "$now_sha" != "$prev_sha" ] && echo yes || echo no)"
              prev_sha=$now_sha
              if [ "$code" != 0 ]; then tr -d '\r' <"$T/copy-$id-build.out" | grep -E '^error' | head -n 5 | cut -c1-160; git -C "$GITHUB_WORKSPACE" checkout -q -- tools/r4-trials/app; continue; fi
            else
              echo "copy=$id build=none binary_sha=$(sha "$bin") base=$base_sha"
            fi
            for rep in $(seq 1 "$reps"); do
              case "$run" in
                selfcheck:*)
                  arm=${run#selfcheck:}
                  arm=${arm%%+*}
                  node "$app/selfcheck.mjs" --bin "$bin" --arm "$arm" --trace >"$T/copy-$id-$rep.out" 2>&1
                  code=$?
                  sed "s/^/copy=$id rep=$rep /" "$T/copy-$id-$rep.out"
                  line=$(grep '^selfcheck ' "$T/copy-$id-$rep.out")
                  missed=$(printf '%s\n' "$line" | tr ' ' '\n' | sed -n 's/=miss$//p' | tr '\n' ',' | sed 's/,$//')
                  echo "copy=$id rep=$rep selfcheck_exit=$code missed=${missed:--} cell_lines=$(grep -c '^cell ' "$T/copy-$id-$rep.out")"
                  ;;
                answers:*)
                  node "$T/answers.mjs" "$app" "$bin" "$P" "${run#answers:}" 2>&1 | sed "s/^/copy=$id rep=$rep /"
                  ;;
                fetch)
                  node "$T/probe.mjs" fetch "$app" "$bin" "$P" 2>&1 | sed "s/^/copy=$id rep=$rep /"
                  ;;
              esac
              case "$run" in
                *+node)
                  (cd "$app" && node --test tests/) >"$T/copy-$id-node.out" 2>&1
                  code=$?
                  echo "copy=$id node_test_exit=$code failed=$(tr -d '\r' <"$T/copy-$id-node.out" | grep -E '^✖ ' | grep -v 'failing tests' | sed 's/ ([0-9.]*ms)$//;s/^✖ //' | sort -u | tr '\n' '|')"
                  ;;
              esac
            done
            git -C "$GITHUB_WORKSPACE" checkout -q -- tools/r4-trials/app
            echo "copy=$id restored_dirty=$(git -C "$GITHUB_WORKSPACE" status --porcelain -- tools/r4-trials/app | wc -l | tr -d ' ')"
          done
          echo "verifier end"
