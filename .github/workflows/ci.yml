name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 20-schema
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 20-schema
      - name: Loop the tests of U1.7 rounds 2 and 3
        shell: bash
        run: |
          fail=0
          while read -r pkg target name; do
            exe=$(cargo test --locked -p "$pkg" --test "$target" --no-run </dev/null 2>&1 | sed -n 's/.*(\(target[^)]*\)).*/\1/p' | tail -n 1 | tr '\\' '/')
            if [ -z "$exe" ]; then
              echo "loop $pkg $target $name no binary"
              fail=1
              continue
            fi
            pass=0
            i=0
            while [ "$i" -lt 200 ]; do
              out=$("$exe" --exact "$name" </dev/null 2>&1 || true)
              case "$out" in
                *"test result: ok. 1 passed"*) pass=$((pass + 1)) ;;
              esac
              i=$((i + 1))
            done
            echo "loop $pkg $target $name passes=$pass of 200"
            if [ "$pass" -ne 200 ]; then fail=1; fi
          done <<'EOF'
          halvo-schema r3_replies a_page_of_25_rows_with_their_25_ids_blocked_fits_with_ids_of_775_bytes_and_not_with_776
          halvo-schema r3_replies the_keys_of_the_run_s_list_are_the_twelve_of_a7_4_in_their_order_and_two_are_yes_or_no
          halvo-schema r3_replies no_reply_of_another_form_answers_load_replies_and_its_reply_answers_no_other_call
          halvo-schema r3_replies the_debug_form_of_a_provider_id_is_its_type_and_length_and_holds_no_part_of_the_id
          halvo-schema r3_replies a_load_reply_with_no_start_row_answers_only_the_load_of_its_config_s_agent
          halvo-schema r3_replies the_bound_of_a_load_replies_reply_decides_before_a_row_is_read_and_after_the_json_read
          halvo-schema r3_replies the_775_bytes_of_an_id_are_the_bytes_that_compact_json_writes_backslashes_counted_twice
          halvo-agent-store runner the_bodies_reply_row_and_load_replies_are_answered_malformed_and_store_nothing
          EOF
          exit "$fail"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
