name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 12-test 50-windows-functional
      - name: win-3 W3-7 round A, the twins and the plain tests in a loop (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/w37.log"
          git checkout --quiet --detach "$GITHUB_SHA"
          for t in windows::input::tests::a_click_of_the_same_tick_from_the_pointer_pump_leaves_a_password_key_withheld windows::input::tests::a_key_that_a_held_pump_takes_late_is_not_recorded_and_moves_no_count; do
            timeout 300 cargo test --locked -p halvo-capture --lib -- --ignored --exact "$t" --nocapture --test-threads=1 >"$log" 2>&1
            echo "W37 twin test=$t exit=$?"
            tr -d '\r' <"$log" | grep -E 'TF |panicked|^test result' | head -n 40
          done
          cargo test --locked -p halvo-capture --lib --no-run --message-format json >"$RUNNER_TEMP/build.json" 2>"$log"
          exe=$(tr -d '\r' <"$RUNNER_TEMP/build.json" | sed -n 's/.*"name":"halvo_capture".*"test":true.*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          echo "W37 loop lib_test_executable_found=$([ -n "$exe" ] && echo 1 || echo 0)"
          tally="$RUNNER_TEMP/tally.txt"
          : >"$tally"
          expected=$("$exe" secure_input::windows::tests:: windows::input::tests::five_keys_of_a_password_field_handled_300_ms_late_move_no_number windows::input::tests::late_keys_of_a_password_field_stay_withheld_after_a_move_to_a_plain_field windows::input::tests::late_keys_stay_withheld_when_the_password_mark_comes_after_their_input_time windows::input::tests::five_late_keys_of_a_plain_field_are_withheld_and_set_the_late_value_alone windows::input::tests::a_password_typed_during_two_seconds_of_lag_moves_no_number windows::input::tests::decided_keys_go_out_in_input_order_and_a_key_undecided_at_the_stop_is_withheld_uncounted windows::input::tests::a_raw_mouse_message_that_is_no_button_down_does_not_latch windows::input::tests::a_raw_button_down_latches_the_gate windows::input::tests::the_keyboard_takes_the_mouse_back_when_the_pointer_source_stops windows::input::tests::a_gate_with_a_reader_of_the_seam_and_one_without_give_the_same_verdicts windows::input::tests::the_seam_keeps_at_most_its_bound_and_the_test_build_holds_its_marker --list 2>/dev/null | tr -d '\r' | grep -c ': test$')
          echo "W37 loop tests_matched_by_the_filters=$expected"
          whole=0
          for run in $(seq 1 200); do
            "$exe" secure_input::windows::tests:: windows::input::tests::five_keys_of_a_password_field_handled_300_ms_late_move_no_number windows::input::tests::late_keys_of_a_password_field_stay_withheld_after_a_move_to_a_plain_field windows::input::tests::late_keys_stay_withheld_when_the_password_mark_comes_after_their_input_time windows::input::tests::five_late_keys_of_a_plain_field_are_withheld_and_set_the_late_value_alone windows::input::tests::a_password_typed_during_two_seconds_of_lag_moves_no_number windows::input::tests::decided_keys_go_out_in_input_order_and_a_key_undecided_at_the_stop_is_withheld_uncounted windows::input::tests::a_raw_mouse_message_that_is_no_button_down_does_not_latch windows::input::tests::a_raw_button_down_latches_the_gate windows::input::tests::the_keyboard_takes_the_mouse_back_when_the_pointer_source_stops windows::input::tests::a_gate_with_a_reader_of_the_seam_and_one_without_give_the_same_verdicts windows::input::tests::the_seam_keeps_at_most_its_bound_and_the_test_build_holds_its_marker --test-threads=1 >"$log" 2>&1
            code=$?
            body=$(tr -d '\r' <"$log")
            if [ "$code" -eq 0 ] && printf '%s\n' "$body" | grep -q "^test result: ok. $expected passed; 0 failed"; then whole=$((whole + 1)); fi
            printf '%s\n' "$body" | sed -n 's/^test \(.*\) \.\.\. \(ok\|FAILED\)$/\1 \2/p' >>"$tally"
          done
          echo "W37 loop runs=200 runs_whose_result_line_holds_all_$expected=$whole"
          sort "$tally" | uniq -c | while read -r n name verdict; do echo "W37 loop test=$name verdict=$verdict runs=$n"; done
          echo "W37 loop end"
          git status --porcelain
          exit 0
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
