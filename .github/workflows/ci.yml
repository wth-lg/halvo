      - name: win-3 W3-9 and W3-10, the undo rows of T1, T2, T3 and T6 (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 150
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/undo.log"
          pick='^TF (held-pump|same-tick|password-edit|fixture-native (phase=E|control=)|stall-tab-sleeps-150 (control=|phase=))|panicked|^test result|^test .* (ok|FAILED)$|assertion|left:|right:'
          lib() {
            timeout 900 cargo test --locked -p halvo-capture --lib -- "$1" --nocapture --test-threads=1 >"$log" 2>&1
            echo "LIB $2 name=$1 exit=$?"
            tr -d '\r' <"$log" | grep -E "$pick" | head -n 40
          }
          fun() {
            timeout 900 cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact "$1" --nocapture --test-threads=1 >"$log" 2>&1
            echo "FUN $2 name=$1 exit=$?"
            tr -d '\r' <"$log" | grep -E "$pick" | head -n 80
          }
          mutate() {
            python - "$1" <<'PY'
          import sys
          name = sys.argv[1]
          i = "crates/halvo-capture/src/windows/input.rs"
          g = "crates/halvo-capture/src/windows/secure_input.rs"
          rows = {
            "V-NOPW": [(g, "        | FocusRead::NoAnswer { protected: true } => FieldState::Password,", "        | FocusRead::NoAnswer { protected: true } => FieldState::Clear,"),
                       (g, "        if focus.0.is_null() {\n            return false;\n        }\n        let mut class = [0u16; 16];", "        if true || focus.0.is_null() {\n            return false;\n        }\n        let mut class = [0u16; 16];")],
            "V-DEAD": [(i, "producer.push(keystroke_packet(clearance, stroke, app, key.tick()));", "let _ = keystroke_packet(clearance, stroke, app, key.tick());")],
            "V-K5": [(g, "|entry: &Entry| entry.seq >= key.seen || entry.at.is_none_or(|at| !before(at, key.tick));", "|entry: &Entry| entry.seq >= key.seen;")],
            "C4": [(g, "LatchFrom::AnotherThread => not_after(latch.at, key.tick),", "LatchFrom::AnotherThread => before(latch.at, key.tick),")],
            "T6u": [(i, "            None | Some((Err(_), _)) => {", "            Some((Err(crate::secure_input::Withheld::Late), _)) => {\n                gate.counts.late.store(true, Ordering::Relaxed);\n                gate.counts.withheld.store(true, Ordering::Relaxed);\n            }\n            None | Some((Err(_), _)) => {")],
          }
          for path, old, new in rows[name]:
              text = open(path, encoding="utf-8").read().replace("\r\n", "\n")
              print("MUTANT", name, "matches", text.count(old))
              assert text.count(old) == 1
              open(path, "w", encoding="utf-8", newline="\n").write(text.replace(old, new))
          PY
          }
          src=crates/halvo-capture/src
          K5=a_key_that_a_held_pump_takes_late_is_not_recorded_and_moves_no_count
          K6=a_click_of_the_same_tick_from_the_pointer_pump_leaves_a_password_key_withheld
          T6=a_password_edit_key_decided_at_300_ms_moves_no_number_that_one_at_100_ms_does_not
          for t in $K5 $K6 $T6; do lib "$t" head; done
          for row in V-NOPW V-DEAD V-K5 C4 T6u; do
            git checkout -- "$src"
            mutate "$row"
            case $row in
              V-NOPW) fun password_field_fixture_native_dialog_phases_a_to_f "$row" ;;
              V-DEAD) fun password_field_fixture_native_dialog_phases_a_to_f "$row"; fun stall::tab_then_letters_while_the_program_sleeps_150_ms "$row" ;;
              V-K5) lib "$K5" "$row" ;;
              C4) lib "$K6" "$row" ;;
              T6u) lib "$T6" "$row" ;;
            esac
          done
          git checkout -- "$src"
          git status --short
          exit 0
