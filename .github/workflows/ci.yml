name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: U0.7b web trial round 2 (scratch branch, never merged; counts only)
        shell: bash
        run: |
          set +e
          code=0
          command -v openssl >/dev/null 2>&1 && echo "openssl present=yes" || echo "openssl present=no"
          cat >"$RUNNER_TEMP/rows.sh" <<'ROWS'
          # the round-2 rows of one browser: sh rows.sh BROWSER
          b=$1
          code=0
          t() { sh tools/r3-trials/web/run.sh --candidate cdp --browser "$b" --port 18190 "$@" || code=1; }
          t --runs 5 --rows ways --round 2 --relay --step ws_allowed
          t --runs 1 --rows ways --round 2 --relay --step ws_allowed_control
          t --runs 10 --rows ways --round 2 --relay --step frame_doc
          for s in list_refuse list_hops list_close; do t --runs 10 --rows relay --round 2 --relay --step "$s"; done
          t --runs 3 --rows relay --round 2 --relay --step own_traffic
          t --runs 10 --round 2 --relay
          t --runs 10 --rows isolation --round 2 --relay
          t --runs 20 --rows driver --round 2
          exit $code
          ROWS
          for b in \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
            "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" \
            ; do
            [ -f "$b" ] || { echo "browser missing $(basename "$b" | tr ' ' '_')"; code=1; continue; }
            echo "browser before $("$b" --version | tr ' ' '_')"
            sh "$RUNNER_TEMP/rows.sh" "$b" || code=1
          done
          exit $code
      - name: U0.7b trial workspace, test and clippy (scratch branch, never merged; counts only)
        if: always()
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/r3-trial-web-test.log"
          (cd tools/r3-trials/web && cargo test --locked >"$log" 2>&1)
          t=$?
          passed=$(grep -o '[0-9]* passed' "$log" | awk '{s+=$1} END {print s+0}')
          failed=$(grep -o '[0-9]* failed' "$log" | awk '{s+=$1} END {print s+0}')
          clog="$RUNNER_TEMP/r3-trial-web-clippy.log"
          (cd tools/r3-trials/web && cargo clippy --locked --all-targets -- -D warnings >"$clog" 2>&1)
          c=$?
          echo "trial crate=web test_exit=$t passed=$passed failed=$failed clippy_exit=$c clippy_error_lines=$(grep -c '^error' "$clog")"
          [ "$t" -eq 0 ] && [ "$c" -eq 0 ]

  windows:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: U0.7b web trial round 2 (scratch branch, never merged; counts only)
        shell: bash
        run: |
          set +e
          code=0
          command -v openssl >/dev/null 2>&1 && echo "openssl present=yes" || echo "openssl present=no"
          cat >"$RUNNER_TEMP/rows.sh" <<'ROWS'
          # the round-2 rows of one browser: sh rows.sh BROWSER
          b=$1
          code=0
          t() { sh tools/r3-trials/web/run.sh --candidate cdp --browser "$b" --port 18190 "$@" || code=1; }
          t --runs 5 --rows ways --round 2 --relay --step ws_allowed
          t --runs 1 --rows ways --round 2 --relay --step ws_allowed_control
          t --runs 10 --rows ways --round 2 --relay --step frame_doc
          for s in list_refuse list_hops list_close; do t --runs 10 --rows relay --round 2 --relay --step "$s"; done
          t --runs 3 --rows relay --round 2 --relay --step own_traffic
          t --runs 10 --round 2 --relay
          t --runs 10 --rows isolation --round 2 --relay
          t --runs 20 --rows driver --round 2
          exit $code
          ROWS
          for b in \
            "C:/Program Files/Google/Chrome/Application/chrome.exe" \
            "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" \
            ; do
            [ -f "$b" ] || { echo "browser missing $(basename "$b" | tr ' ' '_')"; code=1; continue; }
            echo "browser $(basename "$b")"
            sh "$RUNNER_TEMP/rows.sh" "$b" || code=1
          done
          exit $code
      - name: U0.7b trial workspace, test and clippy (scratch branch, never merged; counts only)
        if: always()
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/r3-trial-web-test.log"
          (cd tools/r3-trials/web && cargo test --locked >"$log" 2>&1)
          t=$?
          passed=$(grep -o '[0-9]* passed' "$log" | awk '{s+=$1} END {print s+0}')
          failed=$(grep -o '[0-9]* failed' "$log" | awk '{s+=$1} END {print s+0}')
          clog="$RUNNER_TEMP/r3-trial-web-clippy.log"
          (cd tools/r3-trials/web && cargo clippy --locked --all-targets -- -D warnings >"$clog" 2>&1)
          c=$?
          echo "trial crate=web test_exit=$t passed=$passed failed=$failed clippy_exit=$c clippy_error_lines=$(grep -c '^error' "$clog")"
          [ "$t" -eq 0 ] && [ "$c" -eq 0 ]
