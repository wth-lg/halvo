               "            if self.pairs.contains(&(p.pid, p.started_us)) {\n",
               "            if self.pairs.contains(&(p.pid, p.started_us)) && p.pid == 0 {\n",
               LIB, T("procs::tests::the_fence_admits_the_test_s_own_processes_alone_on_built_tables"), "caught"),
              ("L12-fence-no-dirs", "local", "both", "src/procs.rs",
               "            if row.exe.as_deref().is_some_and(below) {\n",
               "            if row.exe.as_deref().is_some_and(below) && row.pid == 0 {\n",
               LIB, T("procs::tests::the_fence_admits_the_test_s_own_processes_alone_on_built_tables"), "caught"),
              ("L13-fence-no-descendants", "local", "both", "src/procs.rs",
               "                if self.pairs.contains(&(parent.pid, parent.started_us)) {\n",
