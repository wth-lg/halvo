name: ci

on:
  push:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 16
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust
          save-if: false
      - name: U2.6 crate tests
        shell: bash
        run: |
          set +e
          cargo test -p halvo-web --locked --no-fail-fast >"$RUNNER_TEMP/crate-tests.txt" 2>&1
          code=$?
          grep -E '^ *(Running|Doc-tests) |^test result|^test .* FAILED|panicked at' "$RUNNER_TEMP/crate-tests.txt"
          grep -E -A 12 '^---- .* stdout ----' "$RUNNER_TEMP/crate-tests.txt" | head -300
          echo "crate tests exit=$code"
          exit $code
      - name: U2.6 loop of the new tests
        if: always()
        shell: bash
        run: |
          python - windows <<'PYEOF'
          import json, os, subprocess, sys
          job = sys.argv[1]
          spec = """halvo_web guard::tests::e1_the_guard_reads_its_executor_s_end_from_the_system_and_not_from_the_table 200
          halvo_web guard::tests::e2_a_member_s_row_with_no_creation_time_is_that_member_gone 200
          halvo_web procs::tests::e3_a_watch_reads_its_executor_s_end_from_the_system 200
          failed_start a_start_with_no_guard_fails_and_leaves_no_browser 200
          failed_start a_normal_stop_ends_a_process_that_appears_after_the_browser_ended 200
          failed_start a_failed_start_ends_a_process_that_the_browser_left_with_its_profile 20
          failed_start a_start_with_no_first_reply_ends_its_tree_and_is_no_channel 20
          failed_start the_fence_is_on_in_this_test_target 200
          halvo_web tests::the_fence_is_on_in_this_test_target 200
          halvo_web tests::every_test_target_holds_the_test_that_its_fence_is_on 200
          halvo_web tests::the_row_only_means_stand_behind_the_fence 200
          halvo_web tests::no_other_manifest_names_the_fence 200
          halvo_web tests::the_test_build_holds_the_marker 200
          web-probe tests::the_fence_is_on_in_this_test_target 200
          web-rows tests::the_fence_is_on_in_this_test_target 200
          web-standin tests::the_fence_is_on_in_this_test_target 200
          halvo_web checks::tests::the_routine_ends_on_an_empty_pass_and_counts_an_unread_table 200"""
          built = subprocess.run(["cargo", "test", "-p", "halvo-web", "--locked", "--no-run", "--message-format=json"],
                                 capture_output=True, text=True)
          if built.returncode != 0:
              print(f"loop build exit={built.returncode}")
              sys.exit(1)
          exes = {}
          for line in built.stdout.splitlines():
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if m.get("reason") != "compiler-artifact" or not m.get("executable"):
                  continue
              if not m.get("profile", {}).get("test"):
                  continue
              if not m.get("manifest_path", "").replace("\\", "/").endswith("crates/halvo-web/Cargo.toml"):
                  continue
              exes[m["target"]["name"]] = m["executable"]
          bad = 0
          for row in spec.strip().splitlines():
              target, name, runs = row.split()
              runs = int(runs)
              exe = exes.get(target)
              if exe is None:
                  print(f"loop target={target} name={name} runs=0 ok=0 expected=1 cause=no_target")
                  bad += 1
                  continue
              ok = 0
              shown = False
              for i in range(runs):
                  try:
                      r = subprocess.run([exe, "--exact", name, "--test-threads=1"], capture_output=True, text=True,
                                         timeout=600)
                      out = r.stdout
                  except subprocess.TimeoutExpired:
                      out = ""
                  if "test result: ok. 1 passed;" in out:
                      ok += 1
                  elif not shown:
                      shown = True
                      print(f"loop target={target} name={name} first_miss_run={i + 1}")
                      print("\n".join(out.splitlines()[-30:]))
              print(f"loop target={target} name={name} runs={runs} ok={ok} expected=1", flush=True)
              if ok != runs:
                  bad += 1
          print(f"loop job={job} tests={len(spec.strip().splitlines())} bad={bad}")
          sys.exit(1 if bad else 0)
          PYEOF
      - name: U2.6 before, the crate's tests listed at the base
        if: always()
        shell: bash
        run: |
          set +e
          git worktree add --detach "$RUNNER_TEMP/base" c6a04b3fdff7d48c6b3a38bb28533f1b473bc829
          cd "$RUNNER_TEMP/base" || exit 1
          CARGO_TARGET_DIR="$RUNNER_TEMP/base-target" cargo test -p halvo-web --locked -- --list >"$RUNNER_TEMP/base-list.txt" 2>"$RUNNER_TEMP/base-build.txt"
          echo "base list exit=$?"
          python - "e1_the_guard_reads_its_executor_s_end_from_the_system_and_not_from_the_table e2_a_member_s_row_with_no_creation_time_is_that_member_gone e3_a_watch_reads_its_executor_s_end_from_the_system a_start_with_no_guard_fails_and_leaves_no_browser a_normal_stop_ends_a_process_that_appears_after_the_browser_ended a_failed_start_ends_a_process_that_the_browser_left_with_its_profile a_start_with_no_first_reply_ends_its_tree_and_is_no_channel the_fence_is_on_in_this_test_target the_fence_is_on_in_this_test_target every_test_target_holds_the_test_that_its_fence_is_on the_row_only_means_stand_behind_the_fence no_other_manifest_names_the_fence the_test_build_holds_the_marker the_fence_is_on_in_this_test_target the_fence_is_on_in_this_test_target the_fence_is_on_in_this_test_target the_routine_ends_on_an_empty_pass_and_counts_an_unread_table" "$RUNNER_TEMP/base-list.txt" <<'PYEOF'
          import subprocess, sys
          names = sys.argv[1].split()
          listed = open(sys.argv[2], encoding="utf-8", errors="replace").read().splitlines()
          tests = [l.split(": test")[0] for l in listed if l.endswith(": test")]
          print(f"before tests_listed={len(tests)}")
          for n in names:
              print(f"before name={n} listed={sum(1 for t in tests if t == n or t.endswith('::' + n))}")
          PYEOF
