name: ci

on:
  push:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/r2-probes
          cache-on-failure: true
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Format, clippy and tests
        shell: bash
        working-directory: tools/r2-probes
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --features pp-ocrv6 -- -D warnings
          cargo test --locked
      - name: Probes
        shell: bash
        run: sh tools/r2-probes/run-hosted.sh "$RUNNER_TEMP/r2-out" --runs 1 --debug-frames
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r2-probes-macos
          path: ${{ runner.temp }}/r2-out
          if-no-files-found: warn

  windows:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/r2-probes
          cache-on-failure: true
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Format, clippy and tests
        shell: bash
        working-directory: tools/r2-probes
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --features pp-ocrv6 -- -D warnings
          cargo test --locked
      - name: Probes
        shell: bash
        run: sh tools/r2-probes/run-hosted.sh "$RUNNER_TEMP/r2-out" --runs 1 --debug-frames
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r2-probes-windows
          path: ${{ runner.temp }}/r2-out
          if-no-files-found: warn
