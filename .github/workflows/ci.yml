          : > "$m/ext-current.txt"
          cmd //c start "" "halvoadv:selfcheck"
          sleep 3
          echo "adv external scheme self check (the system's own start of halvoadv:selfcheck): $(tr -d '\r' < "$m/ext-current.txt" | tr '\n' ' ')"
