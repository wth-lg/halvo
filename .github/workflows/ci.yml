               "        let lead = p.chars().take_while(|c| *c == '/').count().min(2);\n",
               "        let lead = p.chars().take_while(|c| *c == '/').count().min(1);\n",
               LIB, T("checks::tests::a_share_is_no_rooted_path_and_the_case_of_ascii_letters_alone_is_ignored"), "caught"),
              ("H1c-unicode-case-folded", "hosted", "both", "src/checks.rs",
               "            p.replace('\\\\', \"/\").to_ascii_lowercase()\n",
               "            p.replace('\\\\', \"/\").to_lowercase()\n",
               LIB, T("checks::tests::a_share_is_no_rooted_path_and_the_case_of_ascii_letters_alone_is_ignored"), "caught"),
              ("H4b-split-name-quote-toggles", "hosted", "both", "src/checks.rs",
               "        while i < c.len() && !space(c[i]) {\n            name.push(c[i]);\n",
               "        while i < c.len() && !space(c[i]) {\n            if c[i] == '\"' {\n                i += 1;\n                continue;\n            }\n            name.push(c[i]);\n",
               LIB, T("checks::tests::g1_a_windows_command_line_is_split_by_the_system_s_rule"), "caught"),
