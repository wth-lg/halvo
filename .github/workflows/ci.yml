name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: acct-ef probe
        shell: bash
        continue-on-error: true
        run: |
          set +e
          missing=0
          u() { if command -v cygpath >/dev/null 2>&1; then cygpath -u "$1"; else printf '%s\n' "$1"; fi; }
          m() { if command -v cygpath >/dev/null 2>&1; then cygpath "$@"; else printf '%s\n' "$2"; fi; }
          st() { stat -c '%d %i' "$1" 2>/dev/null || stat -f '%d %i' "$1" 2>/dev/null || printf 'no-stat'; }
          ef() {
            if [ "$1" -ef "$2" ]; then a=yes; else a=no; fi
            printf 'probe test -ef [%s] [%s]: %s\n' "$1" "$2" "$a"
          }
          base=$(mktemp -d "${TMPDIR:-/tmp}/acct-ef-probe.XXXXXX") || { echo 'probe mktemp failed'; exit 1; }
          printf 'probe TMPDIR=%s base=%s\n' "${TMPDIR:-unset}" "$base"
          fx=$base/fixture
          mkdir -p "$fx/account/crates/probe/src"
          printf '[package]\nname = "probe"\nversion = "0.1.0"\nedition = "2021"\npublish = false\n\n[workspace]\n' >"$fx/account/crates/probe/Cargo.toml"
          printf 'fn main() {\n    let out = std::env::var("OUT_DIR").unwrap();\n    std::fs::write(std::path::Path::new(&out).join("generated.rs"), "pub fn generated() {}\\n").unwrap();\n}\n' >"$fx/account/crates/probe/build.rs"
          printf 'include!(concat!(env!("OUT_DIR"), "/generated.rs"));\n' >"$fx/account/crates/probe/src/lib.rs"
          cd "$fx" || exit 1
          repo=$(pwd)
          target=$repo/target/account
          printf 'probe pwd -L=%s pwd -P=%s\n' "$(pwd -L)" "$(pwd -P)"
          CARGO_TARGET_DIR=$target cargo build --offline --manifest-path account/crates/probe/Cargo.toml >"$base/build.log" 2>&1
          code=$?
          printf 'probe build exit=%s\n' "$code"
          printf 'probe uname -r=%s\n' "$(uname -r)"
          CARGO_TARGET_DIR=$target cargo metadata --offline --no-deps --format-version 1 --manifest-path account/crates/probe/Cargo.toml 2>&1 | grep -o '"target_directory":"[^"]*"' | sed 's/^/probe cargo metadata /'
          if command -v cmd >/dev/null 2>&1; then
            printf 'probe a native process sees CARGO_TARGET_DIR=%s\n' "$(CARGO_TARGET_DIR=$target cmd //c 'echo %CARGO_TARGET_DIR%' 2>&1 | tr -d '\r')"
          fi
          find "$base" -name '*.d' -path '*deps*' 2>/dev/null | sed 's/^/probe .d under base: /'
          for root in /c/tmp /d/tmp /tmp; do
            [ -d "$root" ] && find "$root" -maxdepth 7 -path '*acct-ef-probe*' -name 'probe-*.d' 2>/dev/null | sed "s|^|probe .d under $root: |"
          done
          ls -la "$fx" 2>&1 | sed 's/^/probe ls fixture: /'
          [ "$code" -eq 0 ] || { missing=$((missing + 1)); tail -n 20 "$base/build.log"; }
          dep=$(find "$target" -path '*/deps/*' -name 'probe-*.d' -type f | head -n 1)
          printf 'probe dep-info=%s\n' "$dep"
          [ -n "$dep" ] && sed 's/^/probe dep-info line: /' "$dep"
          raw_out=$(sed -n 's/^# env-dep:OUT_DIR=//p' "$dep" | head -n 1)
          raw_file=$(grep 'generated\.rs:$' "$dep" | head -n 1)
          raw_file=${raw_file%:}
          out_named=$(u "$raw_out")
          file_named=$(u "$raw_file")
          printf 'probe target=%s\n' "$target"
          printf 'probe OUT_DIR raw=%s shell=%s\n' "$raw_out" "$out_named"
          printf 'probe file raw=%s shell=%s\n' "$raw_file" "$file_named"
          out_real=$(cd -P "$out_named" && pwd)
          dir_real=$(cd -P "${file_named%/*}" && pwd)
          printf 'probe out made real=%s\n' "$out_real"
          printf 'probe file directory made real=%s\n' "$dir_real"
          build=${out_real%/*}
          build=${build%/*}
          above=${build%/*/*}
          printf 'probe build name=%s above=%s\n' "${build##*/}" "$above"
          ef "$above" "$target"
          ef "$dir_real" "$out_real"
          ef "$out_named" "$out_real"
          ef "$target" "$(cd -P "$target" && pwd)"
          for p in "$target" "$above" "$out_named" "$out_real" "$dir_real"; do
            printf 'probe path %s: m=%s ml=%s stat=%s\n' "$p" "$(m -m "$p")" "$(m -m -l "$p" 2>&1)" "$(st "$p")"
          done
          [ -n "$out_real" ] && [ -n "$dir_real" ] || missing=$((missing + 1))
          printf 'probe missing=%s\n' "$missing"
          [ "$missing" -eq 0 ]
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 10-r7-account
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
