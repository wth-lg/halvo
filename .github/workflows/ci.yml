               LIB, T("checks::tests::tree_of_takes_an_adopted_process_only_when_it_names_the_profile", "relay::tests::g1_the_guard_asks_no_adopted_process_near_the_profile"), "caught"),
              ("L10-guard-reads-no-arguments", "local", "both", "src/relay.rs",
               "                .flat_map(|r| crate::checks::tree_of_with(&table, r, args)),\n",
