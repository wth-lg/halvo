                      s.settimeout(1)
                      try:
                          s.connect((host, 9999))
                      except OSError as e:
                          print(f"measure packet filter probe {host}: {type(e).__name__} {e}")
                      s.close()
              elif command == "probe":
                  probe(sys.argv[2])
              elif command == "listen-a2":
                  listen_a2(sys.argv[2], sys.argv[3])
              elif command == "judge-a2":
                  sys.exit(judge_a2(sys.argv[2]))
              elif command == "judge-head":
                  sys.exit(judge_head(sys.argv[2], sys.argv[3]))
              elif command == "judge":
