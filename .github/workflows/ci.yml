name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/r4-trials/app -> target
          save-if: false
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Trial app
        shell: bash
        run: |
          set -u
          app=tools/r4-trials/app
          started=$(date +%s)
          if ! cargo build --release --locked --manifest-path "$app/Cargo.toml"; then
            echo "trial build=fail"
            exit 1
          fi
          echo "trial build=ok seconds=$(( $(date +%s) - started ))"
          bin="$app/target/release/r4-trial-app"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          echo "trial binary_bytes=$(wc -c <"$bin" | tr -d ' ')"
          if [ "$RUNNER_OS" = Windows ]; then
            key='SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            if MSYS_NO_PATHCONV=1 reg query "HKLM\\$key" /v pv >/dev/null 2>&1 || MSYS_NO_PATHCONV=1 reg query "HKCU\\${key#*WOW6432Node\\}" /v pv >/dev/null 2>&1; then
              echo "trial webview2_runtime=yes"
            else
              echo "trial webview2_runtime=no"
            fi
          fi
          node --test "$app/tests/page.test.mjs" >"$RUNNER_TEMP/r4-page-test.out" 2>&1
          echo "trial page_test_exit=$? $(grep -E '(pass|fail) [0-9]+$' "$RUNNER_TEMP/r4-page-test.out" | tr '\n' ' ')"
          out="$RUNNER_TEMP/r4-trial-app.out"
          "$bin" >"$out" 2>&1 &
          pid=$!
          port=
          i=0
          while [ "$i" -lt 600 ]; do
            port=$(tr -d '\r' <"$out" | sed -n 's/^control port=\([0-9][0-9]*\)$/\1/p' | head -n 1)
            if [ -n "$port" ] || ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 0.1
            i=$((i + 1))
          done
          status=0
          if [ -z "$port" ]; then
            echo "trial control_port=none waited_ds=$i"
            status=1
          else
            echo "trial control_port=found waited_ds=$i"
            node -e '
              const net = require("node:net");
              const [port, ...lines] = process.argv.slice(1);
              const socket = net.connect(Number(port), "127.0.0.1");
              let buffer = "";
              let failed = false;
              let timer = null;
              const next = () => {
                const line = lines.shift();
                if (line === undefined) { socket.end(); process.exitCode = failed ? 1 : 0; return; }
                timer = setTimeout(() => { console.log("trial sent=" + line + " answer=timeout"); process.exit(1); }, 60000);
                socket.write(line + "\n");
                socket.once("answer", (answer) => {
                  clearTimeout(timer);
                  console.log("trial sent=" + line + " answer=" + answer);
                  if (!answer.startsWith("ok")) failed = true;
                  next();
                });
              };
              socket.on("data", (chunk) => {
                buffer += chunk;
                let at;
                while ((at = buffer.indexOf("\n")) >= 0) {
                  const answer = buffer.slice(0, at).replace(/\r$/, "");
                  buffer = buffer.slice(at + 1);
                  socket.emit("answer", answer);
                }
              });
              socket.on("error", (e) => { console.log("trial socket_error=" + e.code); process.exit(1); });
              socket.on("connect", next);
            ' "$port" show hide sample show sample quit || status=1
          fi
          i=0
          while kill -0 "$pid" 2>/dev/null && [ "$i" -lt 100 ]; do
            sleep 0.1
            i=$((i + 1))
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "trial app_running_after_quit=yes"
            kill "$pid"
            status=1
          else
            wait "$pid"
            echo "trial app_exit=$? after_ds=$i"
          fi
          echo "trial app_output_lines=$(wc -l <"$out" | tr -d ' ')"
          tr -d '\r' <"$out" | sed -n -e 's/^\(control port=[0-9]*\)$/app \1/p' -e 's/^\(page [a-z_]* [a-z_]*=[0-9a-z_= ]*\)$/app \1/p'
          tr -d '\r' <"$out" | grep -E "^(r4-trial-app: |thread '|refused cause=)" | cut -c1-300 | sed 's/^/app error: /'
          echo "trial status=$status"
          exit "$status"

