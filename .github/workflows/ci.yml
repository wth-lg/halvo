name: ci

on:
  push:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Page harness fetch and self-test
        shell: bash
        run: |
          export R4_PAGE_BROWSERS="$RUNNER_TEMP/r4-page-browsers"
          sh tools/r4-page/fetch.sh "$R4_PAGE_BROWSERS"
          sh tools/r4-page/fetch.sh "$R4_PAGE_BROWSERS"
          node tools/r4-page/selftest.mjs
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Page harness modes and a walk with Tab alone
        shell: bash
        run: |
          export R4_PAGE_BROWSERS="$RUNNER_TEMP/r4-page-browsers"
          node --input-type=module <<'EOF'
          const { serve, open, check } = await import(new URL('tools/r4-page/index.mjs', 'file://' + process.cwd() + '/').href);
          const s = 'tools/r4-page/sample';
          const origin = await serve({ ui: s, fixtures: s });
          const h = await open({ origin, state: 'a', views: ['/view.js'] });
          const r = await check(h, 5, { snapshot: s + '/structure-a.txt' });
          console.log('modes ' + JSON.stringify(h.modes) + ' modes_off=' + r.counts.modes_off);
          await h.close();
          const t = await open({ origin, state: 'a', views: ['/view.js'] });
          const total = await t.page.evaluate(() => document.querySelectorAll('button, input').length);
          const seen = new Set();
          for (let i = 0; i < 30; i++) {
            await t.page.keyboard.press('Tab');
            seen.add(await t.page.evaluate(() => { const e = document.activeElement; return !e || e === document.body ? 'BODY' : e.tagName + ':' + (e.getAttribute('data-act') || '') + ':' + (e.getAttribute('data-n') || '') + ':' + (e.getAttribute('data-param') || '').slice(-1); }));
          }
          console.log('tab-only stops=' + [...seen].filter((x) => x !== 'BODY').length + ' buttons_and_inputs=' + total + ' ' + [...seen].join(','));
          await t.close();
          process.exit(0);
          EOF

  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Page harness fetch and self-test
        shell: bash
        run: |
          export R4_PAGE_BROWSERS="$RUNNER_TEMP/r4-page-browsers"
          sh tools/r4-page/fetch.sh "$R4_PAGE_BROWSERS"
          sh tools/r4-page/fetch.sh "$R4_PAGE_BROWSERS"
          node tools/r4-page/selftest.mjs
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Page harness modes and a walk with Tab alone
        shell: bash
        run: |
          export R4_PAGE_BROWSERS="$RUNNER_TEMP/r4-page-browsers"
          node --input-type=module <<'EOF'
          const { serve, open, check } = await import(new URL('tools/r4-page/index.mjs', 'file:///' + process.cwd().replace(/\\/g, '/').replace(/^\//, '') + '/').href);
          const s = 'tools/r4-page/sample';
          const origin = await serve({ ui: s, fixtures: s });
          const h = await open({ origin, state: 'a', views: ['/view.js'] });
          const r = await check(h, 5, { snapshot: s + '/structure-a.txt' });
          console.log('modes ' + JSON.stringify(h.modes) + ' modes_off=' + r.counts.modes_off);
          await h.close();
          const t = await open({ origin, state: 'a', views: ['/view.js'] });
          const total = await t.page.evaluate(() => document.querySelectorAll('button, input').length);
          const seen = new Set();
          for (let i = 0; i < 30; i++) {
            await t.page.keyboard.press('Tab');
            seen.add(await t.page.evaluate(() => { const e = document.activeElement; return !e || e === document.body ? 'BODY' : e.tagName + ':' + (e.getAttribute('data-act') || '') + ':' + (e.getAttribute('data-n') || '') + ':' + (e.getAttribute('data-param') || '').slice(-1); }));
          }
          console.log('tab-only stops=' + [...seen].filter((x) => x !== 'BODY').length + ' buttons_and_inputs=' + total + ' ' + [...seen].join(','));
          await t.close();
          process.exit(0);
          EOF
