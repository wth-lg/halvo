name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 30-r4-formal 45-r4-words 10-r4-layout
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 30-r4-formal 45-r4-words 10-r4-layout
      - name: U2.4b loop of its added and turned tests, round 5
        shell: bash
        run: |
          set -u
          out=$(cargo test -p halvo-coord --locked --no-run 2>&1) || { printf '%s\n' "$out" | tail -20; exit 1; }
          fail=0
          total=0
          while read -r target name; do
            b=$(printf '%s\n' "$out" | sed -n "s/.*Executable tests[/\\\\]$target\.rs (\(.*\))$/\1/p" | head -1)
            b=${b//\\//}
            if [ -z "$b" ]; then echo "loop $target $name binary=none"; fail=1; continue; fi
            ok=0
            for i in $(seq 1 200); do
              r=$("$b" --exact "$name" --test-threads 1 2>&1)
              if printf '%s\n' "$r" | grep -qxF "test $name ... ok" && printf '%s\n' "$r" | grep -q '^test result: ok. 1 passed; 0 failed'; then ok=$((ok+1)); fi
            done
            total=$((total+1))
            echo "loop $target $name passed=$ok of 200"
            [ "$ok" -eq 200 ] || fail=1
          done <<'EOF'
            coordinator_moves a_wait_limit_lapse_between_two_clock_reads_of_a_tick_holds_the_boards_stop
            coordinator_moves a_tick_at_the_wait_limit_with_one_failed_clock_read_holds_no_stop_without_its_lapse
            coordinator_moves a_tick_past_the_wait_limit_whose_reading_fails_makes_no_move_and_the_next_tick_lapses
            coordinator_moves a_second_mark_of_a_stopping_run_keeps_the_time_of_its_first_stop
            coordinator_moves a_switch_off_of_a_working_run_makes_the_guard_refuse_its_allowed_and_its_running_effects
            coordinator_moves a_switch_off_whose_stuck_items_lapse_row_panics_leaves_the_guard_refusing_an_earlier_allow
            coordinator_moves a_switch_off_that_drops_a_queued_start_keeps_its_ready_card_whose_start_answers_hold
            coordinator_moves rd52b_an_allow_on_a_second_step_whose_read_shows_a_stored_switch_off_stops_the_run_first
            coordinator_moves an_allow_on_a_confirmation_whose_read_shows_a_stored_switch_off_goes_to_the_runner_and_the_run_stops_after
            coordinator_moves a_stop_or_a_wait_limit_tick_whose_read_shows_a_stored_switch_off_lapses_with_its_own_cause_and_sends_no_state
            coordinator_moves rd52b_rule3_a_request_whose_seq_read_brings_a_stored_switch_off_stores_no_item_of_it
            coordinator_moves a_stored_went_through_whose_reply_was_lost_then_try_again_stores_no_second_row_and_hands_went_through
            coordinator_moves a_handback_answer_stored_with_no_read_lets_the_next_switch_off_store_its_hold_at_its_first_log
            coordinator_moves a_tick_whose_confirmation_flush_reads_a_stored_switch_off_stops_the_run_at_its_end
            coordinator_moves a_press_whose_read_shows_a_known_switch_off_beside_a_live_run_stops_that_run
            schedule_meet a_switch_off_that_drops_a_queued_start_keeps_the_revealed_ready_item_open
            schedule_meet the_rest_of_a_switch_off_with_no_hold_standing_answers_state_and_stops_and_sends_nothing
            schedule_drive a_tick_raises_ready_at_once_for_a_persons_agent_with_no_slot_whose_only_run_failed
          EOF
          echo "loop tests=$total of 18 fail=$fail"
          [ "$total" -eq 18 ] || fail=1
          exit $fail
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 30-r4-formal 45-r4-words 10-r4-layout 20-r4-core
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 30-r4-formal 45-r4-words 10-r4-layout 20-r4-core
      - name: U2.4b loop of its added and turned tests, round 5
        shell: bash
        run: |
          set -u
          out=$(cargo test -p halvo-coord --locked --no-run 2>&1) || { printf '%s\n' "$out" | tail -20; exit 1; }
          fail=0
          total=0
          while read -r target name; do
            b=$(printf '%s\n' "$out" | sed -n "s/.*Executable tests[/\\\\]$target\.rs (\(.*\))$/\1/p" | head -1)
            b=${b//\\//}
            if [ -z "$b" ]; then echo "loop $target $name binary=none"; fail=1; continue; fi
            ok=0
            for i in $(seq 1 200); do
              r=$("$b" --exact "$name" --test-threads 1 2>&1)
              if printf '%s\n' "$r" | grep -qxF "test $name ... ok" && printf '%s\n' "$r" | grep -q '^test result: ok. 1 passed; 0 failed'; then ok=$((ok+1)); fi
            done
            total=$((total+1))
            echo "loop $target $name passed=$ok of 200"
            [ "$ok" -eq 200 ] || fail=1
          done <<'EOF'
            coordinator_moves a_wait_limit_lapse_between_two_clock_reads_of_a_tick_holds_the_boards_stop
            coordinator_moves a_tick_at_the_wait_limit_with_one_failed_clock_read_holds_no_stop_without_its_lapse
            coordinator_moves a_tick_past_the_wait_limit_whose_reading_fails_makes_no_move_and_the_next_tick_lapses
            coordinator_moves a_second_mark_of_a_stopping_run_keeps_the_time_of_its_first_stop
            coordinator_moves a_switch_off_of_a_working_run_makes_the_guard_refuse_its_allowed_and_its_running_effects
            coordinator_moves a_switch_off_whose_stuck_items_lapse_row_panics_leaves_the_guard_refusing_an_earlier_allow
            coordinator_moves a_switch_off_that_drops_a_queued_start_keeps_its_ready_card_whose_start_answers_hold
            coordinator_moves rd52b_an_allow_on_a_second_step_whose_read_shows_a_stored_switch_off_stops_the_run_first
            coordinator_moves an_allow_on_a_confirmation_whose_read_shows_a_stored_switch_off_goes_to_the_runner_and_the_run_stops_after
            coordinator_moves a_stop_or_a_wait_limit_tick_whose_read_shows_a_stored_switch_off_lapses_with_its_own_cause_and_sends_no_state
            coordinator_moves rd52b_rule3_a_request_whose_seq_read_brings_a_stored_switch_off_stores_no_item_of_it
            coordinator_moves a_stored_went_through_whose_reply_was_lost_then_try_again_stores_no_second_row_and_hands_went_through
            coordinator_moves a_handback_answer_stored_with_no_read_lets_the_next_switch_off_store_its_hold_at_its_first_log
            coordinator_moves a_tick_whose_confirmation_flush_reads_a_stored_switch_off_stops_the_run_at_its_end
            coordinator_moves a_press_whose_read_shows_a_known_switch_off_beside_a_live_run_stops_that_run
            schedule_meet a_switch_off_that_drops_a_queued_start_keeps_the_revealed_ready_item_open
            schedule_meet the_rest_of_a_switch_off_with_no_hold_standing_answers_state_and_stops_and_sends_nothing
            schedule_drive a_tick_raises_ready_at_once_for_a_persons_agent_with_no_slot_whose_only_run_failed
          EOF
          echo "loop tests=$total of 18 fail=$fail"
          [ "$total" -eq 18 ] || fail=1
          exit $fail
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
