               ["--test", "start_windows"], T("the_ends_that_this_process_keeps_are_not_inheritable_after_a_start"), "caught"),
              ("H19-windows-error-file-left-open", "hosted", "windows", "src/start.rs",
               "        close_all(&[stdin, stdout, stderr]);\n        result\n",
