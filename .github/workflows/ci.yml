name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 19-control-links-no-store 21-tree-bans 19-home-paths
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 19-control-links-no-store 21-tree-bans 19-home-paths
      - name: control-2c tests 200 times
        shell: bash
        run: |
          set +e
          tmp="${RUNNER_TEMP:-/tmp}"
          found=0
          bad=0
          for bin in target/debug/deps/halvo_control-*; do
            case "$bin" in *.d|*.pdb|*.rlib|*.rmeta|*.lib|*.dll) continue ;; esac
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            "$bin" --list >"$tmp/control-2c-list.txt" 2>&1
            tr -d '\r' <"$tmp/control-2c-list.txt" | sed -n 's/: test$//p' >"$tmp/control-2c-held.txt"
            want=""
            n=0
            for name in paths::tests::st36_check::k1_a_lock_on_a_path_with_a_part_dot_dot_or_a_relative_path_is_refused_as_invalid_input paths::tests::st36_check::k1_a_lock_taken_on_the_link_s_name_with_a_slash_a_dot_or_two_slashes_is_through_a_link paths::tests::st36_check::k4_a_link_to_a_standing_folder_behind_a_closed_parent_answers_cannot_be_read paths::tests::st36_check::k4_a_linked_folder_of_mode_0600_is_not_changed_and_its_store_answers_cannot_be_read paths::tests::st36_check::k4_a_missing_folder_two_levels_below_a_real_directory_is_still_a_first_run paths::tests::st36_check::k4_a_store_in_a_folder_of_mode_0600_answers_cannot_be_read_until_the_check_sets_0700 paths::tests::st36_check::k4_a_store_in_a_folder_or_below_a_parent_of_mode_0000_answers_cannot_be_read_from_the_four paths::tests::st36_check::k4_an_own_folder_whose_bits_are_not_0700_is_set_to_0700_and_special_bits_beside_0700_stay paths::tests::st36_check::k5_the_resolved_line_is_one_line_with_each_control_character_and_line_separator_as_a_question_mark paths::tests::st36_check::k6_each_single_bit_of_group_or_others_is_set_to_0700_at_its_own_name_and_refused_through_a_link paths::tests::st36_check::k6_the_check_with_no_lock_sets_a_real_directory_of_mode_0755_to_0700 proto::tests::k6_running_beside_exactly_one_required_source_is_taken testing::tests::k3_after_either_order_a_resume_exits_1_with_its_sentence_and_a_pause_keeps_the_word testing::tests::k3_both_orders_of_set_status_and_set_life_give_the_same_pausing_status_and_hold testing::tests::k6_set_life_ending_from_a_faulted_status_clears_the_reason testing::tests::k6_set_life_going_changes_no_status_and_a_pausing_capture_stays; do
              if grep -qxF "$name" "$tmp/control-2c-held.txt"; then
                want="$want $name"
                n=$((n + 1))
              fi
            done
            [ "$n" -gt 0 ] || continue
            found=$((found + 1))
            pass=0
            other=0
            i=0
            while [ "$i" -lt 200 ]; do
              "$bin" --exact --test-threads 4 $want >"$tmp/control-2c-loop.txt" 2>&1
              code=$?
              ok=$(tr -d '\r' <"$tmp/control-2c-loop.txt" | grep -c "^test result: ok. $n passed; 0 failed")
              if [ "$code" = 0 ] && [ "$ok" = 1 ]; then
                pass=$((pass + 1))
              else
                other=$((other + 1))
                [ "$other" -gt 1 ] || tail -n 40 "$tmp/control-2c-loop.txt"
              fi
              i=$((i + 1))
            done
            echo "control-2c loop (macos): binary $(basename "$bin"): tests $n, runs 200, passes $pass, other $other"
            [ "$other" = 0 ] || bad=1
          done
          echo "control-2c loop (macos): binaries run: $found"
          [ "$found" -gt 0 ] && [ "$bad" = 0 ]
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 19-control-links-no-store 21-tree-bans 19-home-paths
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 19-control-links-no-store 21-tree-bans 19-home-paths
      - name: control-2c tests 200 times
        shell: bash
        run: |
          set +e
          tmp="${RUNNER_TEMP:-/tmp}"
          found=0
          bad=0
          for bin in target/debug/deps/halvo_control-*; do
            case "$bin" in *.d|*.pdb|*.rlib|*.rmeta|*.lib|*.dll) continue ;; esac
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            "$bin" --list >"$tmp/control-2c-list.txt" 2>&1
            tr -d '\r' <"$tmp/control-2c-list.txt" | sed -n 's/: test$//p' >"$tmp/control-2c-held.txt"
            want=""
            n=0
            for name in paths::tests::st36_check::k1_a_lock_on_a_path_with_a_part_dot_dot_or_a_relative_path_is_refused_as_invalid_input paths::tests::st36_check::k1_a_lock_taken_on_the_link_s_name_with_a_slash_a_dot_or_two_slashes_is_through_a_link paths::tests::st36_check::k4_a_link_to_a_standing_folder_behind_a_closed_parent_answers_cannot_be_read paths::tests::st36_check::k4_a_linked_folder_of_mode_0600_is_not_changed_and_its_store_answers_cannot_be_read paths::tests::st36_check::k4_a_missing_folder_two_levels_below_a_real_directory_is_still_a_first_run paths::tests::st36_check::k4_a_store_in_a_folder_of_mode_0600_answers_cannot_be_read_until_the_check_sets_0700 paths::tests::st36_check::k4_a_store_in_a_folder_or_below_a_parent_of_mode_0000_answers_cannot_be_read_from_the_four paths::tests::st36_check::k4_an_own_folder_whose_bits_are_not_0700_is_set_to_0700_and_special_bits_beside_0700_stay paths::tests::st36_check::k5_the_resolved_line_is_one_line_with_each_control_character_and_line_separator_as_a_question_mark paths::tests::st36_check::k6_each_single_bit_of_group_or_others_is_set_to_0700_at_its_own_name_and_refused_through_a_link paths::tests::st36_check::k6_the_check_with_no_lock_sets_a_real_directory_of_mode_0755_to_0700 proto::tests::k6_running_beside_exactly_one_required_source_is_taken testing::tests::k3_after_either_order_a_resume_exits_1_with_its_sentence_and_a_pause_keeps_the_word testing::tests::k3_both_orders_of_set_status_and_set_life_give_the_same_pausing_status_and_hold testing::tests::k6_set_life_ending_from_a_faulted_status_clears_the_reason testing::tests::k6_set_life_going_changes_no_status_and_a_pausing_capture_stays; do
              if grep -qxF "$name" "$tmp/control-2c-held.txt"; then
                want="$want $name"
                n=$((n + 1))
              fi
            done
            [ "$n" -gt 0 ] || continue
            found=$((found + 1))
            pass=0
            other=0
            i=0
            while [ "$i" -lt 200 ]; do
              "$bin" --exact --test-threads 4 $want >"$tmp/control-2c-loop.txt" 2>&1
              code=$?
              ok=$(tr -d '\r' <"$tmp/control-2c-loop.txt" | grep -c "^test result: ok. $n passed; 0 failed")
              if [ "$code" = 0 ] && [ "$ok" = 1 ]; then
                pass=$((pass + 1))
              else
                other=$((other + 1))
                [ "$other" -gt 1 ] || tail -n 40 "$tmp/control-2c-loop.txt"
              fi
              i=$((i + 1))
            done
            echo "control-2c loop (windows): binary $(basename "$bin"): tests $n, runs 200, passes $pass, other $other"
            [ "$other" = 0 ] || bad=1
          done
          echo "control-2c loop (windows): binaries run: $found"
          [ "$found" -gt 0 ] && [ "$bad" = 0 ]
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
