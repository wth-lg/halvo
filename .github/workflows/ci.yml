          PSEOF
          cat > "$RUNNER_TEMP/ext.py" <<'PYEOF'
          import os
          import sys
          import time

          with open(os.environ.get("HALVOADV_EXT", os.path.join(os.path.dirname(os.path.abspath(__file__)), "adv", "ext-current.txt")), "a", encoding="utf-8") as f:
              f.write("%s %s\n" % (time.strftime("%H:%M:%S"), " ".join(sys.argv[1:])))
          PYEOF
