name: ci

on:
  push:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/r4-trials/app -> target
          save-if: false
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Floor trial
        shell: bash
        run: |
          set +e
          started=$(date +%s)
          node tools/r4-trials/floor/selftest.mjs
          selftest=$?
          echo "floor selftest exit=$selftest seconds=$(($(date +%s) - started))"
          node tools/r4-trials/floor/list.mjs check
          list=$?
          echo "floor list exit=$list"
          sh tools/r4-trials/floor/read.sh
          started=$(date +%s)
          sh tools/r4-trials/floor/run.sh
          cell=$?
          echo "floor run exit=$cell seconds=$(($(date +%s) - started))"
          if [ "$selftest" -ne 0 ] || [ "$list" -ne 0 ] || [ "$cell" -ne 0 ]; then exit 1; fi
