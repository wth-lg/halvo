name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 12-test 50-windows-functional
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
  loop-1:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: win-3 W3-7 round B, loop share 1 (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/loop.log"
          cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/fun.json" 2>"$log"
          echo "LOOP share=1 build fun exit=$?"
          cargo test --locked -p halvo-capture --lib --no-run --message-format json >"$RUNNER_TEMP/lib.json" 2>"$log"
          echo "LOOP share=1 build lib exit=$?"
          fun=$(tr -d '\r' <"$RUNNER_TEMP/fun.json" | sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          lib=$(tr -d '\r' <"$RUNNER_TEMP/lib.json" | grep '"kind":\["lib"\]' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          [ -n "$fun" ] && [ -n "$lib" ] || echo "LOOP share=1 no executable"
          while read -r kind t runs; do
            [ -n "$kind" ] || continue
            passed=0
            defect=0
            for run in $(seq 1 "$runs"); do
              if [ "$kind" = fun ]; then
                timeout 600 "$fun" --ignored --exact "$t" --nocapture --test-threads=1 >"$log" 2>&1 </dev/null
              else
                timeout 600 "$lib" --exact "$t" --test-threads=1 >"$log" 2>&1 </dev/null
              fi
              code=$?
              if [ "$code" -eq 0 ] && tr -d '\r' <"$log" | grep -q '^test result: ok. 1 passed; 0 failed'; then
                passed=$((passed + 1))
              elif tr -d '\r' <"$log" | grep -q 'KNOWN-DEFECT' && tr -d '\r' <"$log" | grep -q '^test result: FAILED. 0 passed; 1 failed'; then
                defect=$((defect + 1))
              fi
              if [ "$code" -ne 0 ] || [ "$kind" = fun ]; then
                echo "LOOP test=$t run=$run exit=$code"
                tr -d '\r' <"$log" | grep -E 'TF [a-z0-9-]+ (phase=[a-zA-Z-]+ (rounds|counted)|.*recorded=[0-9]+$|first_read_password|keystrokes_before|listener_values|keyboard_start=)|KNOWN-DEFECT|panicked at|^  left|^ right|INCONCLUSIVE' | head -n 8
              fi
            done
            echo "LOOP test=$t runs=$runs passed=$passed known_defect=$defect"
          done <<'ROWS'
          lib windows::input::tests::a_second_pointer_start_is_refused_until_the_route_has_changed 20
          lib secure_input::windows::detector::tests::a_focus_events_clear_from_the_callback_clears_no_key 20
          ROWS
          echo "LOOP share=1 end"
          exit 0
  loop-2:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: win-3 W3-7 round B, loop share 2 (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/loop.log"
          cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/fun.json" 2>"$log"
          echo "LOOP share=2 build fun exit=$?"
          cargo test --locked -p halvo-capture --lib --no-run --message-format json >"$RUNNER_TEMP/lib.json" 2>"$log"
          echo "LOOP share=2 build lib exit=$?"
          fun=$(tr -d '\r' <"$RUNNER_TEMP/fun.json" | sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          lib=$(tr -d '\r' <"$RUNNER_TEMP/lib.json" | grep '"kind":\["lib"\]' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          [ -n "$fun" ] && [ -n "$lib" ] || echo "LOOP share=2 no executable"
          while read -r kind t runs; do
            [ -n "$kind" ] || continue
            passed=0
            defect=0
            for run in $(seq 1 "$runs"); do
              if [ "$kind" = fun ]; then
                timeout 600 "$fun" --ignored --exact "$t" --nocapture --test-threads=1 >"$log" 2>&1 </dev/null
              else
                timeout 600 "$lib" --exact "$t" --test-threads=1 >"$log" 2>&1 </dev/null
              fi
              code=$?
              if [ "$code" -eq 0 ] && tr -d '\r' <"$log" | grep -q '^test result: ok. 1 passed; 0 failed'; then
                passed=$((passed + 1))
              elif tr -d '\r' <"$log" | grep -q 'KNOWN-DEFECT' && tr -d '\r' <"$log" | grep -q '^test result: FAILED. 0 passed; 1 failed'; then
                defect=$((defect + 1))
              fi
              if [ "$code" -ne 0 ] || [ "$kind" = fun ]; then
                echo "LOOP test=$t run=$run exit=$code"
                tr -d '\r' <"$log" | grep -E 'TF [a-z0-9-]+ (phase=[a-zA-Z-]+ (rounds|counted)|.*recorded=[0-9]+$|first_read_password|keystrokes_before|listener_values|keyboard_start=)|KNOWN-DEFECT|panicked at|^  left|^ right|INCONCLUSIVE' | head -n 8
              fi
            done
            echo "LOOP test=$t runs=$runs passed=$passed known_defect=$defect"
          done <<'ROWS'
          fun stall::a_focus_notice_that_the_system_does_not_deliver_changes_nothing 20
          ROWS
          echo "LOOP share=2 end"
          exit 0
  undo:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: win-3 W3-7 round B, W3-9, the undo rows of O6's third order and of O1 (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 80
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/b3.log"
          pick='panicked|^test result|^test .* (ok|FAILED)$|assertion|left:|right:|^  '
          lib() {
            timeout 900 cargo test --locked -p halvo-capture --lib -- "$1" --test-threads=1 >"$log" 2>&1
            echo "LIB $2 name=$1 exit=$?"
            tr -d '\r' <"$log" | grep -E "$pick" | grep -v '^   *Compiling' | head -n 60
          }
          mutate() {
            python - "$1" <<'PY'
          import sys
          name = sys.argv[1]
          i = "crates/halvo-capture/src/windows/input.rs"
          g = "crates/halvo-capture/src/windows/secure_input.rs"
          rows = {
            "O6u3": (i, "        let claim = device_guard.claim.take();\n        let route = clicks();\n", "        drop(device_guard.claim.take());\n        let claim: Option<DeviceClaim> = None;\n        let route = clicks();\n"),
            "O1u": (g, "                && matches!(entry.mark, Mark::Read { .. })\n                && not_after(floor_tick, entry.began)", "                && matches!(entry.mark, Mark::Read { .. } | Mark::Field(_))\n                && not_after(floor_tick, entry.began)"),
          }
          path, old, new = rows[name]
          text = open(path, encoding="utf-8").read().replace("\r\n", "\n")
          print("MUTANT", name, "matches", text.count(old))
          assert text.count(old) == 1
          open(path, "w", encoding="utf-8", newline="\n").write(text.replace(old, new))
          PY
          }
          O6C=a_second_pointer_start_is_refused_until_the_route_has_changed
          O1C=a_focus_events_clear_from_the_callback_clears_no_key
          for t in $O6C $O1C; do lib "$t" head; done
          git checkout -- crates/halvo-capture/src
          mutate O6u3
          lib "$O6C" O6u3
          git checkout -- crates/halvo-capture/src
          mutate O1u
          lib "$O1C" O1u
          git checkout -- crates/halvo-capture/src
          git status --short
          exit 0
