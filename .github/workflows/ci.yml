name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the macos job's proof (the windows job runs 10-format alone)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format
      - name: Scratch rows run 1 of sqlcipher-2, 69 rows, each to its end by name
        if: always()
        shell: bash
        run: |
          start=$(date +%s); last=$start; seen=" "; n=0
          sh scripts/r1-gate/mutation-test.sh --only delete-all-destroys-nothing --only shredded-key-survives --only checkpoint-not-verified --only segment-roundtrip-broken --only temp-store-on-disk --only plaintext-written-to-stderr --only marker-written-into-the-store-directory --only key-row-deleted --only header-not-authenticated --only last-chunk-flag-dropped --only keys-not-wiped-on-drop --only raw-store-key-in-key-file --only checkpoint-after-removal --only formal-shred-never-committed --only formal-checkpoint-removed --only formal-checkpoint-not-verified --only formal-reader-keyed-with-zeros --only formal-busy-not-mapped-to-locked --only live-holder-busy-not-mapped-to-locked --only formal-delete-all-destroys-nothing --only formal-delete-all-returns-before-its-root-step --only formal-shredded-key-survives --only formal-single-writer --only directory-lock-never-refuses --only formal-directory-lock-never-taken --only formal-single-writer-both-locks --only directory-lock-refusal-taken-as-a-lock --only formal-wrapped-key-in-a-side-file --only formal-second-wrap-in-another-table --only formal-raw-store-key-in-key-file --only formal-failed-create-leaves-the-database --only formal-create-makes-its-root-first --only formal-create-takes-an-existing-root --only formal-refused-create-destroys-the-root --only formal-second-delete-all-finishes-nothing --only formal-second-delete-all-is-refused --only create-destroys-a-root-it-cannot-read --only create-destroys-a-root-file-it-cannot-read --only verify-store-scan-skipped --only verify-store-scan-skips-the-key-file --only deletion-check-unknown-reads-destroyed --only deletion-check-without-the-all-zero-probe --only root-state-corrupt-is-destroyed --only unreadable-key-file-is-sealed --only unreadable-segment-file-is-missing --only key-scan-hex-unpadded --only key-scan-base64-at-one-offset --only key-scan-without-decimal-lists --only raw-store-key-as-a-debug-print-beside-the-key-file --only raw-store-key-as-a-json-array-beside-the-key-file --only raw-store-key-in-a-longer-base64-text-beside-the-key-file --only raw-store-key-as-unpadded-hex-beside-the-key-file --only wrapped-key-of-any-length-accepted --only key-file-removed-without-its-zero-fill --only database-removal-leaves-the-log --only failed-key-commit-keeps-the-segment-file --only create-keeps-keyless-leftovers --only segment-key-wrap-without-its-label --only create-destroys-the-root-of-a-create-at-the-same-instant --only formal-create-spares-only-a-root-it-can-read --only journal-mode-not-wal --only partial-root-file-shared-by-two-writers --only unwrap-not-measured --only read-holds-the-whole-segment --only formal-held-store-asks-its-custody --only formal-store-files-take-the-umask --only formal-store-directories-take-the-umask --only formal-store-db-keeps-a-wider-mode --only formal-open-makes-a-missing-database 2>&1 | while IFS= read -r line; do
            printf '%s\n' "$line"
            case $line in
              "PASS mutation:"*|"FAIL mutation:"*)
                name=${line#* mutation:}; name=${name%% *}
                case "$seen" in
                  *" $name "*) ;;
                  *)
                    now=$(date +%s); n=$((n + 1))
                    echo "scratch-row-seconds $name $((now - last)) row=$n of 69 since_start=$((now - start))"
                    last=$now; seen="$seen$name "
                    ;;
                esac
                ;;
            esac
          done
      - name: Lockfile unchanged
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" macos
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" windows
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
