name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 60-r5-privacy
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 60-r5-privacy
      - name: U3.1 loop of the added tests
        shell: bash
        run: |
          set +e
          names="bin|privacy::tests::privacy_prints_the_six_lines_of_l11_4_with_learn_deleted_and_learn_outside_ok bin|privacy::tests::privacy_reads_ok_on_its_own_directories_with_the_store_s_cascade bin|privacy::tests::learn_deleted_misses_a_cascade_that_keeps_a_learn_row_of_the_first_workflow bin|privacy::tests::learn_deleted_misses_a_kept_row_of_the_first_workflow_that_cannot_be_read bin|privacy::tests::learn_deleted_misses_a_cascade_that_takes_a_row_of_the_second_workflow bin|privacy::tests::learn_deleted_misses_a_cascade_that_rewrites_a_row_of_the_second_workflow bin|privacy::tests::learn_deleted_misses_a_cascade_that_takes_nothing_answers_not_stored_or_takes_another_id bin|privacy::tests::learn_outside_misses_a_marker_in_a_file_or_a_name_under_the_data_directory bin|privacy::tests::learn_outside_misses_a_marker_that_the_command_writes_into_its_temporary_directory bin|privacy::tests::learn_outside_reads_ok_beside_files_without_a_marker_and_a_marked_entry_made_before_the_command bin|privacy::tests::learn_outside_misses_when_a_directory_cannot_be_read bin|privacy::tests::an_entry_that_is_gone_holds_no_marker_and_a_marked_name_holds_one bin|privacy::tests::the_report_is_ok_with_not_run_lines_and_not_ok_with_a_miss bin|privacy::tests::privacy_refuses_a_call_without_an_existing_data_directory_with_usage_and_writes_nothing bin|privacy::tests::learn_deleted_needs_rows_before_a_stored_answer_none_left_and_the_same_other_rows bin|privacy::tests::learn_outside_misses_when_the_seeded_rows_hold_no_marker bin|privacy::tests::privacy_usage_refusals_name_privacy_among_the_commands bin|privacy::tests::learn_outside_needs_each_marker_in_an_active_and_a_reverted_row_of_its_own_workflow bin|privacy::tests::learn_deleted_misses_a_kept_row_whose_json_writes_the_first_id_with_an_escape bin|privacy::tests::learn_deleted_misses_a_kept_edit_row_with_the_marker_whose_workflow_key_is_null_missing_or_no_id bin|privacy::tests::learn_deleted_misses_a_cascade_that_moves_a_row_of_the_second_workflow_to_another_kind bin|privacy::tests::learn_deleted_misses_a_cascade_that_adds_a_copy_of_a_row_of_the_second_workflow bin|privacy::tests::learn_outside_misses_a_marker_in_a_dot_entry_below_the_top_of_the_data_directory bin|privacy::tests::learn_outside_misses_a_marker_beyond_the_first_4096_bytes_of_a_file cli|learn_outside_misses_when_the_temporary_directory_of_the_process_does_not_exist"
          if [ "$RUNNER_OS" != Windows ]; then names="$names bin|privacy::tests::learn_outside_misses_a_link_whose_target_text_holds_a_marker bin|privacy::tests::learn_outside_misses_a_file_that_cannot_be_read_and_a_directory_that_cannot_be_listed bin|privacy::tests::learn_outside_reads_a_pipe_by_its_name_alone"; fi
          cargo test --locked -p halvo-learn-gate --bin learn-gate --no-run 2>"$RUNNER_TEMP/u31-build.txt"
          code=$?
          cargo test --locked -p halvo-learn-gate --test privacy_cli --no-run 2>"$RUNNER_TEMP/u31-build-cli.txt"
          code_cli=$?
          exe=$(sed -n 's/^ *Executable unittests src[\\/]main\.rs (\(.*\))$/\1/p' "$RUNNER_TEMP/u31-build.txt" | tail -n 1)
          exe=${exe//\\//}
          exe_cli=$(sed -n 's/^ *Executable tests[\\/]privacy_cli\.rs (\(.*\))$/\1/p' "$RUNNER_TEMP/u31-build-cli.txt" | tail -n 1)
          exe_cli=${exe_cli//\\//}
          if [ -n "$exe" ] && [ -n "$exe_cli" ]; then found=yes; else found=no; fi
          echo "loop build=$code build_cli=$code_cli binaries_found=$found"
          if [ "$code" -ne 0 ] || [ "$code_cli" -ne 0 ] || [ "$found" = no ]; then exit 1; fi
          export exe exe_cli
          one() {
            if [ "${1%%|*}" = cli ]; then run_exe=$exe_cli; else run_exe=$exe; fi
            name=${1#*|}
            ok=0
            for i in $(seq 1 200); do
              out=$("$run_exe" --exact "$name" 2>&1)
              case "$out" in
                *"test result: ok. 1 passed; 0 failed;"*) ok=$((ok + 1)) ;;
              esac
            done
            echo "loop test=${1%%|*}:$name passed=$ok of=200"
          }
          export -f one
          start=$(date +%s)
          printf '%s\n' $names | xargs -P 3 -I{} bash -c 'one "$1"' _ {} >"$RUNNER_TEMP/u31-loop.txt"
          cat "$RUNNER_TEMP/u31-loop.txt"
          expected=$(printf '%s\n' $names | grep -c .)
          count=$(grep -c '^loop test=' "$RUNNER_TEMP/u31-loop.txt")
          all=$(grep -c ' passed=200 of=200$' "$RUNNER_TEMP/u31-loop.txt")
          echo "loop tests=$count expected=$expected all_200=$all seconds=$(( $(date +%s) - start ))"
          if [ "$count" -ne "$expected" ] || [ "$all" -ne "$expected" ]; then exit 1; fi
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 60-r5-privacy
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 60-r5-privacy
      - name: U3.1 loop of the added tests
        shell: bash
        run: |
          set +e
          names="bin|privacy::tests::privacy_prints_the_six_lines_of_l11_4_with_learn_deleted_and_learn_outside_ok bin|privacy::tests::privacy_reads_ok_on_its_own_directories_with_the_store_s_cascade bin|privacy::tests::learn_deleted_misses_a_cascade_that_keeps_a_learn_row_of_the_first_workflow bin|privacy::tests::learn_deleted_misses_a_kept_row_of_the_first_workflow_that_cannot_be_read bin|privacy::tests::learn_deleted_misses_a_cascade_that_takes_a_row_of_the_second_workflow bin|privacy::tests::learn_deleted_misses_a_cascade_that_rewrites_a_row_of_the_second_workflow bin|privacy::tests::learn_deleted_misses_a_cascade_that_takes_nothing_answers_not_stored_or_takes_another_id bin|privacy::tests::learn_outside_misses_a_marker_in_a_file_or_a_name_under_the_data_directory bin|privacy::tests::learn_outside_misses_a_marker_that_the_command_writes_into_its_temporary_directory bin|privacy::tests::learn_outside_reads_ok_beside_files_without_a_marker_and_a_marked_entry_made_before_the_command bin|privacy::tests::learn_outside_misses_when_a_directory_cannot_be_read bin|privacy::tests::an_entry_that_is_gone_holds_no_marker_and_a_marked_name_holds_one bin|privacy::tests::the_report_is_ok_with_not_run_lines_and_not_ok_with_a_miss bin|privacy::tests::privacy_refuses_a_call_without_an_existing_data_directory_with_usage_and_writes_nothing bin|privacy::tests::learn_deleted_needs_rows_before_a_stored_answer_none_left_and_the_same_other_rows bin|privacy::tests::learn_outside_misses_when_the_seeded_rows_hold_no_marker bin|privacy::tests::privacy_usage_refusals_name_privacy_among_the_commands bin|privacy::tests::learn_outside_needs_each_marker_in_an_active_and_a_reverted_row_of_its_own_workflow bin|privacy::tests::learn_deleted_misses_a_kept_row_whose_json_writes_the_first_id_with_an_escape bin|privacy::tests::learn_deleted_misses_a_kept_edit_row_with_the_marker_whose_workflow_key_is_null_missing_or_no_id bin|privacy::tests::learn_deleted_misses_a_cascade_that_moves_a_row_of_the_second_workflow_to_another_kind bin|privacy::tests::learn_deleted_misses_a_cascade_that_adds_a_copy_of_a_row_of_the_second_workflow bin|privacy::tests::learn_outside_misses_a_marker_in_a_dot_entry_below_the_top_of_the_data_directory bin|privacy::tests::learn_outside_misses_a_marker_beyond_the_first_4096_bytes_of_a_file cli|learn_outside_misses_when_the_temporary_directory_of_the_process_does_not_exist"
          if [ "$RUNNER_OS" != Windows ]; then names="$names bin|privacy::tests::learn_outside_misses_a_link_whose_target_text_holds_a_marker bin|privacy::tests::learn_outside_misses_a_file_that_cannot_be_read_and_a_directory_that_cannot_be_listed bin|privacy::tests::learn_outside_reads_a_pipe_by_its_name_alone"; fi
          cargo test --locked -p halvo-learn-gate --bin learn-gate --no-run 2>"$RUNNER_TEMP/u31-build.txt"
          code=$?
          cargo test --locked -p halvo-learn-gate --test privacy_cli --no-run 2>"$RUNNER_TEMP/u31-build-cli.txt"
          code_cli=$?
          exe=$(sed -n 's/^ *Executable unittests src[\\/]main\.rs (\(.*\))$/\1/p' "$RUNNER_TEMP/u31-build.txt" | tail -n 1)
          exe=${exe//\\//}
          exe_cli=$(sed -n 's/^ *Executable tests[\\/]privacy_cli\.rs (\(.*\))$/\1/p' "$RUNNER_TEMP/u31-build-cli.txt" | tail -n 1)
          exe_cli=${exe_cli//\\//}
          if [ -n "$exe" ] && [ -n "$exe_cli" ]; then found=yes; else found=no; fi
          echo "loop build=$code build_cli=$code_cli binaries_found=$found"
          if [ "$code" -ne 0 ] || [ "$code_cli" -ne 0 ] || [ "$found" = no ]; then exit 1; fi
          export exe exe_cli
          one() {
            if [ "${1%%|*}" = cli ]; then run_exe=$exe_cli; else run_exe=$exe; fi
            name=${1#*|}
            ok=0
            for i in $(seq 1 200); do
              out=$("$run_exe" --exact "$name" 2>&1)
              case "$out" in
                *"test result: ok. 1 passed; 0 failed;"*) ok=$((ok + 1)) ;;
              esac
            done
            echo "loop test=${1%%|*}:$name passed=$ok of=200"
          }
          export -f one
          start=$(date +%s)
          printf '%s\n' $names | xargs -P 3 -I{} bash -c 'one "$1"' _ {} >"$RUNNER_TEMP/u31-loop.txt"
          cat "$RUNNER_TEMP/u31-loop.txt"
          expected=$(printf '%s\n' $names | grep -c .)
          count=$(grep -c '^loop test=' "$RUNNER_TEMP/u31-loop.txt")
          all=$(grep -c ' passed=200 of=200$' "$RUNNER_TEMP/u31-loop.txt")
          echo "loop tests=$count expected=$expected all_200=$all seconds=$(( $(date +%s) - start ))"
          if [ "$count" -ne "$expected" ] || [ "$all" -ne "$expected" ]; then exit 1; fi
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
