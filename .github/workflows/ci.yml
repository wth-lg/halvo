name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 46-r4-dialog-ran
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 46-r4-dialog-ran
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - name: U4.5 loop of the new tests and of the dialog targets, counted by the result lines
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          cargo test -p halvo-coord-app --locked --no-run --message-format=json > "$RUNNER_TEMP/u45-build.json" 2> "$RUNNER_TEMP/u45-build.err"
          echo "u45 loop build exit=$?"
          exe() { grep -o '"executable":"[^"]*"' "$RUNNER_TEMP/u45-build.json" | sed 's/"executable":"//; s/"$//; s/\\\\/\//g' | grep "/deps/$1-" | head -1; }
          loop() {
            label=$1; n=$2; how=$3; want=$4; shift 4
            pass=0; i=0; inconclusive=0; between=0
            if [ -z "$want" ]; then
              echo "u45 loop $label FAIL: no expected line"
              short="$short $label"
              return
            fi
            mkdir -p "$RUNNER_TEMP/u45-guard-runs"
            while [ "$i" -lt "$n" ]; do
              i=$((i + 1))
              "$@" > "$RUNNER_TEMP/u45-loop.out" 2>&1
              case $how in
                line) x=-xF ;;
                pattern) x=-xE ;;
                *) x=-F ;;
              esac
              if tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" | grep -q '^guard_hosted inconclusive: '; then
                inconclusive=$((inconclusive + 1))
                tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" | grep '^guard_hosted inconclusive: '
              fi
              nb=$(tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" | sed -n 's/^guard_hosted between cases: the app read not active \([0-9]*\) times.*/\1/p' | head -1)
              between=$((between + ${nb:-0}))
              if [ "$label" = guard-hosted ]; then
                tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" > "$RUNNER_TEMP/u45-guard-runs/run-$(printf %03d "$i").txt"
                tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" | grep -E '^guard_hosted (unreported|reading .*the show returned after|case .* SLIPPED|case .* schedule slipped in run)' | sed "s/^/u45 loop $label run $i: /"
              fi
              if tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" | grep -q "$x" -e "$want"; then
                pass=$((pass + 1)); missed=no
              else
                missed=yes
                echo "u45 loop $label run $i missed; its end and failure lines:"
                tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" | grep -E '_hosted (end|case .* FAIL)' | head -8
              fi
              if [ "$label" = guard-hosted ]; then
                tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" | grep -E '_hosted (notice|reading .*report made by|reading .*the show returned after|unreported|press|again)' > "$RUNNER_TEMP/u45-loop-lines.txt"
                if [ "$i" = 1 ] || [ "$missed" = yes ]; then
                  echo "u45 loop $label run $i lines of the pair:"
                  head -80 "$RUNNER_TEMP/u45-loop-lines.txt"
                fi
                echo "u45 loop $label run $i reports: $(grep -c 'report made by a press' "$RUNNER_TEMP/u45-loop-lines.txt") by a press, $(grep -c 'report made by a become notice' "$RUNNER_TEMP/u45-loop-lines.txt") by a notice, $(grep -c 'report made by the repeating reading' "$RUNNER_TEMP/u45-loop-lines.txt") by the repeating reading"
              fi
            done
            echo "u45 loop $label runs=$n matched=$pass by the line: $want (for guard-hosted the tally below counts kept, slipped and failed runs apart)"
            echo "u45 loop $label inconclusive=$inconclusive (not passed); reads of the app not active between cases=$between"
            [ "$pass" = "$n" ] || short="$short $label"
          }
          short=
          listed() { "$@" --list 2>/dev/null | tr -d '\r' | grep -c ': test$'; }
          lib=$(exe halvo_coord_app); sched=$(exe schedule); guard=$(exe guard_hosted); dlg=$(exe dialog_hosted)
          echo "u45 loop binaries: lib=${lib:+found} schedule=${sched:+found} guard=${guard:+found} dialog=${dlg:+found}"
          new="present::tests::guard:: present::tests::moment:: present::tests::serve::every_show_holds present::tests::serve::a_card_that_breaks present::tests::system::seams::alert_the_hold_starts present::tests::card::a_field_is_taken present::tests::card::each_mark present::tests::card::a_card_of_every_class present::tests::card::a_title_or_a_control present::tests::card::an_access_key present::tests::card::a_card_over_its_bound present::tests::system::the_task_dialog"
          if [ "$RUNNER_OS" = macOS ]; then dcases=4; gcases=7; gruns=60; else dcases=5; gcases=8; gruns=20; fi
          # shellcheck disable=SC2086
          plain=$(listed "$lib" $new); total=$(listed "$lib"); scount=$(listed "$sched")
          echo "u45 loop counts from --list of these binaries: new-lib-tests ${plain:-none} of ${total:-none} lib tests, schedule-tests ${scount:-none}"
          libline=; schedline=
          if [ "${plain:-0}" -gt 0 ] && [ "${total:-0}" -ge "${plain:-0}" ]; then libline="test result: ok. $plain passed; 0 failed; 0 ignored; 0 measured; $((total - plain)) filtered out;"; fi
          if [ "${scount:-0}" -gt 0 ]; then schedline="test result: ok. $scount passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;"; fi
          # shellcheck disable=SC2086
          loop new-lib-tests 200 start "$libline" "$lib" $new
          loop schedule-tests 200 start "$schedline" "$sched"
          loop dialog-hosted 20 line "dialog_hosted end: cases ran $dcases of $dcases, failed 0" "$dlg"
          loop guard-hosted "$gruns" pattern "guard_hosted end: cases ran $gcases of $gcases, failed 0, schedule slipped [01], helped 0, moments at a press 0, retries [0-9]+, reports before visible 0" env GUARD_HOSTED_SCHEDULE=loop "$guard"
          echo "u45 loop guard-hosted kept run files: $(ls "$RUNNER_TEMP/u45-guard-runs" | wc -l | tr -d ' ')"
          GUARD_HOSTED_TALLY="$RUNNER_TEMP/u45-guard-runs" "$guard" > "$RUNNER_TEMP/u45-tally.out" 2>&1
          texit=$?
          tr -d '\r' < "$RUNNER_TEMP/u45-tally.out"
          echo "u45 loop guard-hosted tally exit=$texit"
          if [ -n "$short" ]; then echo "u45 loop FAIL: loops that matched fewer runs than they made:$short"; fi
          [ -z "$short" ] && [ "$texit" = 0 ]
      - name: U4.5 changed copies of lines that only a shown dialog reaches
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          change() {
            file=crates/halvo-coord-app/src/present/$1; id=$2; shift 2
            while [ "$#" -ge 2 ]; do
              OLD=$1 NEW=$2 perl -0pi -e 's/\Q$ENV{OLD}\E/$ENV{NEW}/' "$file"
              shift 2
            done
            if git diff --quiet -- "$file"; then echo "u45 change $id applied=no"; return; fi
            cargo test -p halvo-coord-app --locked --no-fail-fast --test guard_hosted --test dialog_hosted > "$RUNNER_TEMP/u45-$id.txt" 2>&1
            target=$?
            failed=$(tr -d '\r' < "$RUNNER_TEMP/u45-$id.txt" | grep -o '[a-z_]*_hosted case [^:]* FAIL\|[a-z_]*_hosted watchdog FAIL\|error\[E[0-9]*\]' | tr '\n' ';')
            ends=$(tr -d '\r' < "$RUNNER_TEMP/u45-$id.txt" | grep '_hosted end: ' | tr '\n' ';')
            echo "u45 change $id applied=yes target_exit=$target failed: ${failed:-none} ends: ${ends:-none}"
            tr -d '\r' < "$RUNNER_TEMP/u45-$id.txt" | grep -E '_hosted (case .* FAIL|watchdog|end: |unreported|reading .*(no report|never reported|report made by nothing))' | head -30 | sed "s/^/u45 change $id line: /"
            git checkout -- "$file"
          }
          if [ "$RUNNER_OS" = macOS ]; then
            change moment.rs H1-guard-taken-out 'Event::Press { .. } if guard.press(now) => Decision::Answer,' 'Event::Press { .. } if guard.press(now) || true => Decision::Answer,'
            change system.rs H2-report-before-the-key-window 'let _ = hold.ivars().shown.send(Step::Shown);' 'let _ = &hold.ivars().shown;' 'let response = alert.runModal();' 'let _ = tx.send(Step::Shown); let response = alert.runModal();'
            change system.rs H3-buttons-keep-their-own-action 'button.setTarget(Some(target));' 'let _ = target;' 'button.setAction(Some(sel!(press:)));' 'let _ = sel!(press:);'
            change system.rs H4-no-reading-but-at-a-press '(sel!(becameKey:), NSWindowDidBecomeKeyNotification),' '(sel!(becameKey:), NSWindowDidResignKeyNotification),' '                        NSApplicationDidBecomeActiveNotification,' '                        NSApplicationDidResignActiveNotification,' '*hold.ivars().timer.borrow_mut() = Some(timer.clone());' 'timer.invalidate();'
            change system.rs H5-hold-from-before-the-report 'lock(&state).guard.reported(Instant::now())' 'lock(&state).guard.reported(Instant::now() - Duration::from_secs(5))'
          else
            change system.rs W1-guard-taken-out 'TDN_BUTTON_CLICKED if !show.click(wparam.0 == TASK_ALLOW as usize, Instant::now()) =>' 'TDN_BUTTON_CLICKED if !show.click(wparam.0 == TASK_ALLOW as usize, Instant::now()) && false =>'
            change system.rs W4-no-subclass 'unsafe { SetWindowSubclass(window, Some(subclass), SUBCLASS, data as usize) };' 'windows::core::BOOL(SUBCLASS as i32);'
            change system.rs W5-deactivation-as-activation 'as u32 != WA_INACTIVE =>' 'as u32 == WA_INACTIVE =>'
          fi
          libchange() {
            file=crates/halvo-coord-app/src/present/$1; id=$2
            OLD=$3 NEW=$4 perl -0pi -e 's/\Q$ENV{OLD}\E/$ENV{NEW}/' "$file"
            if git diff --quiet -- "$file"; then echo "u45 change $id applied=no"; return; fi
            cargo test -p halvo-coord-app --locked --no-fail-fast --lib > "$RUNNER_TEMP/u45-$id.txt" 2>&1
            target=$?
            failed=$(tr -d '\r' < "$RUNNER_TEMP/u45-$id.txt" | grep -o '^test [^ ]* \.\.\. FAILED' | tr '\n' ';')
            echo "u45 change $id applied=yes lib_exit=$target failed: ${failed:-none}"
            git checkout -- "$file"
          }
          if [ "$RUNNER_OS" != macOS ]; then
            libchange card.rs W6-no-access-key-marks 'const MARKS: &[char] = WINDOWS_MARKS;' 'const MARKS: &[char] = &[];'
            change system.rs W8-hidden-report-at-tdn-created 'show.active(unsafe { IsWindowVisible(window) }.as_bool(), &Instant::now);' 'show.active(true, &Instant::now);'
            change system.rs W9-no-report-at-the-show 'show.shown(unsafe { GetActiveWindow() } == window, &Instant::now)' 'let _ = &show;'
            rawchange() {
              file=crates/halvo-coord-app/src/present/$1; id=$2
              perl -0pi -e "$3" "$file"
              if git diff --quiet -- "$file"; then echo "u45 change $id applied=no"; return; fi
              cargo test -p halvo-coord-app --locked --no-fail-fast --test guard_hosted --test dialog_hosted > "$RUNNER_TEMP/u45-$id.txt" 2>&1
              target=$?
              failed=$(tr -d '\r' < "$RUNNER_TEMP/u45-$id.txt" | grep -o '[a-z_]*_hosted case [^:]* FAIL\|[a-z_]*_hosted watchdog FAIL\|error\[E[0-9]*\]' | tr '\n' ';')
              ends=$(tr -d '\r' < "$RUNNER_TEMP/u45-$id.txt" | grep '_hosted end: ' | tr '\n' ';')
              echo "u45 change $id applied=yes target_exit=$target failed: ${failed:-none} ends: ${ends:-none}"
              tr -d '\r' < "$RUNNER_TEMP/u45-$id.txt" | grep -E '_hosted (case .* FAIL|watchdog|end: |unreported|reading .*(no report|never reported|report made by nothing))' | head -30 | sed "s/^/u45 change $id line: /"
              git checkout -- "$file"
            }
            # shellcheck disable=SC2016
            rawchange system.rs W10-hidden-report-at-an-activation 's/(WA_INACTIVE => \{\s+\/\/ SAFETY: as at TDN_CREATED\.\s+show\.active\()unsafe \{ IsWindowVisible\(window\) \}\.as_bool\(\)/${1}true/'
          fi
          echo "u45 changes done; tree: $(git status --porcelain | wc -l | tr -d ' ') changed files"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 46-r4-dialog-ran
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 46-r4-dialog-ran
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - name: U4.5 loop of the new tests and of the dialog targets, counted by the result lines
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          cargo test -p halvo-coord-app --locked --no-run --message-format=json > "$RUNNER_TEMP/u45-build.json" 2> "$RUNNER_TEMP/u45-build.err"
          echo "u45 loop build exit=$?"
          exe() { grep -o '"executable":"[^"]*"' "$RUNNER_TEMP/u45-build.json" | sed 's/"executable":"//; s/"$//; s/\\\\/\//g' | grep "/deps/$1-" | head -1; }
          loop() {
            label=$1; n=$2; how=$3; want=$4; shift 4
            pass=0; i=0; inconclusive=0; between=0
            if [ -z "$want" ]; then
              echo "u45 loop $label FAIL: no expected line"
              short="$short $label"
              return
            fi
            mkdir -p "$RUNNER_TEMP/u45-guard-runs"
            while [ "$i" -lt "$n" ]; do
              i=$((i + 1))
              "$@" > "$RUNNER_TEMP/u45-loop.out" 2>&1
              case $how in
                line) x=-xF ;;
                pattern) x=-xE ;;
                *) x=-F ;;
              esac
              if tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" | grep -q '^guard_hosted inconclusive: '; then
                inconclusive=$((inconclusive + 1))
                tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" | grep '^guard_hosted inconclusive: '
              fi
              nb=$(tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" | sed -n 's/^guard_hosted between cases: the app read not active \([0-9]*\) times.*/\1/p' | head -1)
              between=$((between + ${nb:-0}))
              if [ "$label" = guard-hosted ]; then
                tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" > "$RUNNER_TEMP/u45-guard-runs/run-$(printf %03d "$i").txt"
                tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" | grep -E '^guard_hosted (unreported|reading .*the show returned after|case .* SLIPPED|case .* schedule slipped in run)' | sed "s/^/u45 loop $label run $i: /"
              fi
              if tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" | grep -q "$x" -e "$want"; then
                pass=$((pass + 1)); missed=no
              else
                missed=yes
                echo "u45 loop $label run $i missed; its end and failure lines:"
                tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" | grep -E '_hosted (end|case .* FAIL)' | head -8
              fi
              if [ "$label" = guard-hosted ]; then
                tr -d '\r' < "$RUNNER_TEMP/u45-loop.out" | grep -E '_hosted (notice|reading .*report made by|reading .*the show returned after|unreported|press|again)' > "$RUNNER_TEMP/u45-loop-lines.txt"
                if [ "$i" = 1 ] || [ "$missed" = yes ]; then
                  echo "u45 loop $label run $i lines of the pair:"
                  head -80 "$RUNNER_TEMP/u45-loop-lines.txt"
                fi
                echo "u45 loop $label run $i reports: $(grep -c 'report made by a press' "$RUNNER_TEMP/u45-loop-lines.txt") by a press, $(grep -c 'report made by a become notice' "$RUNNER_TEMP/u45-loop-lines.txt") by a notice, $(grep -c 'report made by the repeating reading' "$RUNNER_TEMP/u45-loop-lines.txt") by the repeating reading"
              fi
            done
            echo "u45 loop $label runs=$n matched=$pass by the line: $want (for guard-hosted the tally below counts kept, slipped and failed runs apart)"
            echo "u45 loop $label inconclusive=$inconclusive (not passed); reads of the app not active between cases=$between"
            [ "$pass" = "$n" ] || short="$short $label"
          }
          short=
          listed() { "$@" --list 2>/dev/null | tr -d '\r' | grep -c ': test$'; }
          lib=$(exe halvo_coord_app); sched=$(exe schedule); guard=$(exe guard_hosted); dlg=$(exe dialog_hosted)
          echo "u45 loop binaries: lib=${lib:+found} schedule=${sched:+found} guard=${guard:+found} dialog=${dlg:+found}"
          new="present::tests::guard:: present::tests::moment:: present::tests::serve::every_show_holds present::tests::serve::a_card_that_breaks present::tests::system::seams::alert_the_hold_starts present::tests::card::a_field_is_taken present::tests::card::each_mark present::tests::card::a_card_of_every_class present::tests::card::a_title_or_a_control present::tests::card::an_access_key present::tests::card::a_card_over_its_bound present::tests::system::the_task_dialog"
          if [ "$RUNNER_OS" = macOS ]; then dcases=4; gcases=7; gruns=60; else dcases=5; gcases=8; gruns=20; fi
          # shellcheck disable=SC2086
          plain=$(listed "$lib" $new); total=$(listed "$lib"); scount=$(listed "$sched")
          echo "u45 loop counts from --list of these binaries: new-lib-tests ${plain:-none} of ${total:-none} lib tests, schedule-tests ${scount:-none}"
          libline=; schedline=
          if [ "${plain:-0}" -gt 0 ] && [ "${total:-0}" -ge "${plain:-0}" ]; then libline="test result: ok. $plain passed; 0 failed; 0 ignored; 0 measured; $((total - plain)) filtered out;"; fi
          if [ "${scount:-0}" -gt 0 ]; then schedline="test result: ok. $scount passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;"; fi
          # shellcheck disable=SC2086
          loop new-lib-tests 200 start "$libline" "$lib" $new
          loop schedule-tests 200 start "$schedline" "$sched"
          loop dialog-hosted 20 line "dialog_hosted end: cases ran $dcases of $dcases, failed 0" "$dlg"
          loop guard-hosted "$gruns" pattern "guard_hosted end: cases ran $gcases of $gcases, failed 0, schedule slipped [01], helped 0, moments at a press 0, retries [0-9]+, reports before visible 0" env GUARD_HOSTED_SCHEDULE=loop "$guard"
          echo "u45 loop guard-hosted kept run files: $(ls "$RUNNER_TEMP/u45-guard-runs" | wc -l | tr -d ' ')"
          GUARD_HOSTED_TALLY="$RUNNER_TEMP/u45-guard-runs" "$guard" > "$RUNNER_TEMP/u45-tally.out" 2>&1
          texit=$?
          tr -d '\r' < "$RUNNER_TEMP/u45-tally.out"
          echo "u45 loop guard-hosted tally exit=$texit"
          if [ -n "$short" ]; then echo "u45 loop FAIL: loops that matched fewer runs than they made:$short"; fi
          [ -z "$short" ] && [ "$texit" = 0 ]
      - name: U4.5 changed copies of lines that only a shown dialog reaches
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          change() {
            file=crates/halvo-coord-app/src/present/$1; id=$2; shift 2
            while [ "$#" -ge 2 ]; do
              OLD=$1 NEW=$2 perl -0pi -e 's/\Q$ENV{OLD}\E/$ENV{NEW}/' "$file"
              shift 2
            done
            if git diff --quiet -- "$file"; then echo "u45 change $id applied=no"; return; fi
            cargo test -p halvo-coord-app --locked --no-fail-fast --test guard_hosted --test dialog_hosted > "$RUNNER_TEMP/u45-$id.txt" 2>&1
            target=$?
            failed=$(tr -d '\r' < "$RUNNER_TEMP/u45-$id.txt" | grep -o '[a-z_]*_hosted case [^:]* FAIL\|[a-z_]*_hosted watchdog FAIL\|error\[E[0-9]*\]' | tr '\n' ';')
            ends=$(tr -d '\r' < "$RUNNER_TEMP/u45-$id.txt" | grep '_hosted end: ' | tr '\n' ';')
            echo "u45 change $id applied=yes target_exit=$target failed: ${failed:-none} ends: ${ends:-none}"
            tr -d '\r' < "$RUNNER_TEMP/u45-$id.txt" | grep -E '_hosted (case .* FAIL|watchdog|end: |unreported|reading .*(no report|never reported|report made by nothing))' | head -30 | sed "s/^/u45 change $id line: /"
            git checkout -- "$file"
          }
          if [ "$RUNNER_OS" = macOS ]; then
            change moment.rs H1-guard-taken-out 'Event::Press { .. } if guard.press(now) => Decision::Answer,' 'Event::Press { .. } if guard.press(now) || true => Decision::Answer,'
            change system.rs H2-report-before-the-key-window 'let _ = hold.ivars().shown.send(Step::Shown);' 'let _ = &hold.ivars().shown;' 'let response = alert.runModal();' 'let _ = tx.send(Step::Shown); let response = alert.runModal();'
            change system.rs H3-buttons-keep-their-own-action 'button.setTarget(Some(target));' 'let _ = target;' 'button.setAction(Some(sel!(press:)));' 'let _ = sel!(press:);'
            change system.rs H4-no-reading-but-at-a-press '(sel!(becameKey:), NSWindowDidBecomeKeyNotification),' '(sel!(becameKey:), NSWindowDidResignKeyNotification),' '                        NSApplicationDidBecomeActiveNotification,' '                        NSApplicationDidResignActiveNotification,' '*hold.ivars().timer.borrow_mut() = Some(timer.clone());' 'timer.invalidate();'
            change system.rs H5-hold-from-before-the-report 'lock(&state).guard.reported(Instant::now())' 'lock(&state).guard.reported(Instant::now() - Duration::from_secs(5))'
          else
            change system.rs W1-guard-taken-out 'TDN_BUTTON_CLICKED if !show.click(wparam.0 == TASK_ALLOW as usize, Instant::now()) =>' 'TDN_BUTTON_CLICKED if !show.click(wparam.0 == TASK_ALLOW as usize, Instant::now()) && false =>'
            change system.rs W4-no-subclass 'unsafe { SetWindowSubclass(window, Some(subclass), SUBCLASS, data as usize) };' 'windows::core::BOOL(SUBCLASS as i32);'
            change system.rs W5-deactivation-as-activation 'as u32 != WA_INACTIVE =>' 'as u32 == WA_INACTIVE =>'
          fi
          libchange() {
            file=crates/halvo-coord-app/src/present/$1; id=$2
            OLD=$3 NEW=$4 perl -0pi -e 's/\Q$ENV{OLD}\E/$ENV{NEW}/' "$file"
            if git diff --quiet -- "$file"; then echo "u45 change $id applied=no"; return; fi
            cargo test -p halvo-coord-app --locked --no-fail-fast --lib > "$RUNNER_TEMP/u45-$id.txt" 2>&1
            target=$?
            failed=$(tr -d '\r' < "$RUNNER_TEMP/u45-$id.txt" | grep -o '^test [^ ]* \.\.\. FAILED' | tr '\n' ';')
            echo "u45 change $id applied=yes lib_exit=$target failed: ${failed:-none}"
            git checkout -- "$file"
          }
          if [ "$RUNNER_OS" != macOS ]; then
            libchange card.rs W6-no-access-key-marks 'const MARKS: &[char] = WINDOWS_MARKS;' 'const MARKS: &[char] = &[];'
            change system.rs W8-hidden-report-at-tdn-created 'show.active(unsafe { IsWindowVisible(window) }.as_bool(), &Instant::now);' 'show.active(true, &Instant::now);'
            change system.rs W9-no-report-at-the-show 'show.shown(unsafe { GetActiveWindow() } == window, &Instant::now)' 'let _ = &show;'
            rawchange() {
              file=crates/halvo-coord-app/src/present/$1; id=$2
              perl -0pi -e "$3" "$file"
              if git diff --quiet -- "$file"; then echo "u45 change $id applied=no"; return; fi
              cargo test -p halvo-coord-app --locked --no-fail-fast --test guard_hosted --test dialog_hosted > "$RUNNER_TEMP/u45-$id.txt" 2>&1
              target=$?
              failed=$(tr -d '\r' < "$RUNNER_TEMP/u45-$id.txt" | grep -o '[a-z_]*_hosted case [^:]* FAIL\|[a-z_]*_hosted watchdog FAIL\|error\[E[0-9]*\]' | tr '\n' ';')
              ends=$(tr -d '\r' < "$RUNNER_TEMP/u45-$id.txt" | grep '_hosted end: ' | tr '\n' ';')
              echo "u45 change $id applied=yes target_exit=$target failed: ${failed:-none} ends: ${ends:-none}"
              tr -d '\r' < "$RUNNER_TEMP/u45-$id.txt" | grep -E '_hosted (case .* FAIL|watchdog|end: |unreported|reading .*(no report|never reported|report made by nothing))' | head -30 | sed "s/^/u45 change $id line: /"
              git checkout -- "$file"
            }
            # shellcheck disable=SC2016
            rawchange system.rs W10-hidden-report-at-an-activation 's/(WA_INACTIVE => \{\s+\/\/ SAFETY: as at TDN_CREATED\.\s+show\.active\()unsafe \{ IsWindowVisible\(window\) \}\.as_bool\(\)/${1}true/'
          fi
          echo "u45 changes done; tree: $(git status --porcelain | wc -l | tr -d ' ') changed files"
