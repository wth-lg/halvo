name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the macos job's proof (the windows job runs 10-format alone)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - name: 'gate-stop-children: the hosted case alone at the head'
        if: always()
        shell: bash
        run: sh scripts/r1-gate/mutation-test.sh --self-test -v --case stop-children-ends-a-wrapper-s-child-by-the-real-pkill-on-the-hosted-job
      - name: 'gate-stop-children: loop of the hosted case alone (20 rounds)'
        if: always()
        shell: bash
        run: |
          set +e
          name=stop-children-ends-a-wrapper-s-child-by-the-real-pkill-on-the-hosted-job
          rounds=20
          pass=0
          n=0
          loop_start=$(date +%s)
          while [ "$n" -lt "$rounds" ]; do
            n=$((n + 1))
            sh scripts/r1-gate/mutation-test.sh --self-test -v --case "$name" > "$RUNNER_TEMP/loop-case-$n.out" 2>&1
            status=$?
            if [ "$status" -eq 0 ] && grep -Fqx "case mutation/$name want=PASS got=PASS" "$RUNNER_TEMP/loop-case-$n.out" && grep -Fqx 'PASS self-test:mutation (1 cases, 0 failing fixtures rejected)' "$RUNNER_TEMP/loop-case-$n.out"; then
              pass=$((pass + 1))
            else
              printf 'round %s (exit %s):\n' "$n" "$status"
              cat "$RUNNER_TEMP/loop-case-$n.out"
            fi
          done
          printf 'loop %s: passed %s of %s (counted by the result lines), %s s\n' "$name" "$pass" "$rounds" "$(($(date +%s) - loop_start))"
          [ "$pass" -eq "$rounds" ]
      - name: 'gate-stop-children: forced form on the base and the head, and one-rule changes'
        if: always()
        shell: bash
        run: |
          # shellcheck disable=SC2016
          set +e
          base=05e6c22e1683fad39f087ce42b5bed2c7a44d732
          mt=scripts/r1-gate/mutation-test.sh
          lib=scripts/r1-gate/lib.sh
          real_case=stop-children-ends-a-wrapper-s-child-by-the-real-pkill-on-the-hosted-job
          named_case=stop-children-ends-a-wrapper-s-children-by-pkill-when-no-child-id-is-known
          late_case=stop-children-reaches-pkill-after-the-wrapper-has-its-child-when-its-fork-comes-late
          stop_line='    if [ -n "$child_pid" ]; then kill -TERM "$child_pid" 2>/dev/null; else pkill -TERM -P "$child_wrapper" 2>/dev/null; fi'
          wrapper_line='    if [ -n "$child_pid" ]; then kill -TERM "$child_pid" 2>/dev/null; else kill -TERM "$child_wrapper" 2>/dev/null; fi'
          meet_line='  until fallback_child=$(pgrep -P "$fallback_wrapper"); do'
          count_line='  fallback_rest=$(ps -o pid= -p "$fallback_child" | wc -l | tr -d '"' '"')'
          bound_line='  [ "$((fallback_end - fallback_start))" -lt 30 ] && [ "$fallback_rest" -eq 0 ] && return 0'
          work=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/gate-stop-children.XXXXXX") || exit 2
          real_pgrep=$(command -v pgrep) || exit 2
          real_pkill=${GATE_STOP_CHILDREN_PKILL:-$(command -v pkill)} || exit 2
          wrong=0
          replace_line() {
            n=$(awk -v old="$2" '$0 == old { n++ } END { print n + 0 }' "$1")
            if [ "$n" != 1 ]; then printf 'change %s: the line to change stands %s times in %s, not once\n' "$4" "$n" "$1"; return 1; fi
            awk -v old="$2" -v new="$3" '$0 == old { print new; next } { print }' "$1" > "$work/replaced" && cat "$work/replaced" > "$1"
          }
          forced_bin() {
            mkdir -p "$1/bin" && mkfifo "$1/gate" || return 1
            printf '#!/bin/sh\ncase ${1:-}:${2:-} in\n  %s) read -r go < "%s/gate" ;;\nesac\nexec /bin/sh "$@"\n' "'-c:sleep '*' & wait'" "$1" > "$1/bin/sh"
            printf '#!/bin/sh\n"%s" "$@"\ns=$?\ncase $#:${1:-} in\n  2:-P) if mkdir "%s/released" 2> /dev/null; then printf "go\\n" > "%s/gate"; fi ;;\nesac\nexit "$s"\n' "$real_pgrep" "$1" "$1" > "$1/bin/pgrep"
            printf '#!/bin/sh\n"%s" "$@"\ns=$?\ncase $#:${1:-}:${2:-} in\n  3:-TERM:-P) if mkdir "%s/released" 2> /dev/null; then printf "go\\n" > "%s/gate"; fi ;;\nesac\nexit "$s"\n' "$real_pkill" "$1" "$1" > "$1/bin/pkill"
            chmod +x "$1/bin/sh" "$1/bin/pgrep" "$1/bin/pkill"
          }
          run_case() {
            label=$1; tree=$2; form=$3; changes=$4; name=$5; want=$6; words=$7
            dir=$work/$label
            mkdir -p "$dir" || return 1
            [ "$tree" = head ] || git show "$base:$mt" > "$mt"
            applied=yes
            for change in $changes; do
              case $change in
                c1) replace_line "$lib" "$stop_line" '    :' c1 || applied=no ;;
                c2) replace_line "$lib" "$stop_line" "$wrapper_line" c2 || applied=no ;;
                c3) replace_line "$mt" "$meet_line" "  until fallback_child=''; do" c3 || applied=no ;;
                c4) replace_line "$mt" "$count_line" '  fallback_rest=0' c4 || applied=no ;;
                c5) replace_line "$mt" "$bound_line" '  [ "$((fallback_end - fallback_start))" -ge 0 ] && [ "$fallback_rest" -eq 0 ] && return 0' c5 || applied=no ;;
                c6) replace_line "$mt" '  start_wrapper_with_its_child 60 || return 1' '  start_wrapper_with_its_child 1 || return 1' c6 || applied=no ;;
              esac
            done
            if [ "$applied" = yes ]; then
              if [ "$form" = forced ]; then
                forced_bin "$dir" && PATH=$dir/bin:$PATH sh "$mt" --self-test -v --case "$name" > "$dir/out" 2>&1
              else
                sh "$mt" --self-test -v --case "$name" > "$dir/out" 2>&1
              fi
              status=$?
              got=$(grep "^case mutation/$name " "$dir/out")
            else
              status=none
              got='the change did not apply'
            fi
            git checkout -q -- "$mt" "$lib"
            case $words in
              @60)
                took=$(printf '%s\n' "$got" | sed -n 's/^case mutation\/[^ ]* want=PASS got=FAIL: stop_children took \([0-9][0-9]*\) s and left 0 children of the wrapper;.*/\1/p')
                if [ -n "$took" ] && [ "$took" -ge 60 ]; then verdict=as-owed; else verdict=NOT-AS-OWED; wrong=$((wrong + 1)); fi ;;
              *)
                case $got in
                  "case mutation/$name want="*" got=$want"*"$words"*) verdict=as-owed ;;
                  *) verdict=NOT-AS-OWED; wrong=$((wrong + 1)) ;;
                esac ;;
            esac
            printf 'gate-stop-children %s: tree %s, form %s, changes %s, case %s: %s (exit %s) %s\n' "$label" "$tree" "$form" "${changes:-none}" "$name" "$verdict" "$status" "${got:-no case line}"
          }
          run_case base-forced base forced '' "$real_case" FAIL @60
          run_case head-forced head forced '' "$real_case" PASS ''
          run_case c1-line-136-out head plain c1 "$real_case" FAIL @60
          run_case c1-on-the-named-case head plain c1 "$named_case" FAIL 'pkill got: nothing'
          run_case c1-on-the-late-fork-case head plain c1 "$late_case" FAIL 'events: pgrep 0;'
          run_case c2-stop-ends-the-wrapper head plain c2 "$real_case" FAIL 'and left 1 children of the wrapper'
          run_case c2-on-the-base base plain c2 "$real_case" PASS ''
          if [ -z "${GATE_STOP_CHILDREN_PKILL:-}" ]; then
            run_case c2-on-the-named-case head plain c2 "$named_case" FAIL 'pkill got: nothing'
            run_case c2-on-the-late-fork-case head plain c2 "$late_case" FAIL 'events: pgrep 0;'
          else
            printf 'gate-stop-children: rehearsal: the two rows of c2 on the cases that run everywhere are left out; they end a wrapper by a real kill\n'
          fi
          run_case c3-meeting-out-forced head forced c3 "$real_case" FAIL @60
          run_case c3-on-the-late-fork-case head plain c3 "$late_case" FAIL 'events: pkill -TERM -P'
          run_case c4-count-0-under-c2 head plain 'c2 c4' "$real_case" PASS ''
          run_case c5-bound-any-under-c1 head plain 'c1 c5' "$real_case" PASS ''
          run_case c6-sleep-1-s-under-c1 head plain 'c1 c6' "$real_case" PASS ''
          git status --porcelain -- "$mt" "$lib"
          printf 'gate-stop-children: %s runs not as owed\n' "$wrong"
          [ "$wrong" -eq 0 ]
      - name: 'gate-stop-children: the mutation self-test whole'
        if: always()
        shell: bash
        run: |
          set +e
          name=stop-children-ends-a-wrapper-s-child-by-the-real-pkill-on-the-hosted-job
          whole_start=$(date +%s)
          sh scripts/r1-gate/mutation-test.sh --self-test -v > "$RUNNER_TEMP/mutation-whole.out" 2>&1
          status=$?
          cat "$RUNNER_TEMP/mutation-whole.out"
          printf 'gate-stop-children: the mutation self-test whole exited %s in %s s\n' "$status" "$(($(date +%s) - whole_start))"
          grep -F "case mutation/stop-children-" "$RUNNER_TEMP/mutation-whole.out"
          grep -F "case mutation/the-start-of-the-wrapper-" "$RUNNER_TEMP/mutation-whole.out"
          grep -E '^(PASS|FAIL) self-test:mutation ' "$RUNNER_TEMP/mutation-whole.out"
          [ "$status" -eq 0 ] && grep -Fqx "case mutation/$name want=PASS got=PASS" "$RUNNER_TEMP/mutation-whole.out"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 16-shell-lint
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 16-shell-lint
      - name: Lockfile unchanged
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" macos
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" windows
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
