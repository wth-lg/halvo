name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust
          save-if: false
      - name: Screen start probe
        shell: bash
        env:
          HALVO_SCREEN_START_PROBE: '1'
        run: |
          set +e
          cargo test --locked -p halvo-capture --lib -- --ignored --exact macos::screen::tests::the_hosted_probe_prints_whether_a_stream_starts --nocapture > "$RUNNER_TEMP/probe.log" 2>&1
          code=$?
          grep -o 'screen-start-probe started=[a-z]* code=[a-z0-9_-]* frames=[0-9]*' "$RUNNER_TEMP/probe.log"
          grep '^test result:' "$RUNNER_TEMP/probe.log"
          if [ "$code" -ne 0 ]; then grep -E '^error' "$RUNNER_TEMP/probe.log" | head -n 20; fi
          echo "probe exit $code"
          exit "$code"
