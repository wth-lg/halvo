name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 60-r6-egress 70-r6-memory 80-r6-absent 10-r6-layout 16-shell-lint
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 60-r6-egress 70-r6-memory 80-r6-absent 10-r6-layout 16-shell-lint
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - name: U4.2 loops of the new tests (scratch)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          set -u
          crate=crates/halvo-route-gate
          rel=$(cargo test --locked -p halvo-route-gate --lib --no-run 2>&1 | sed -n 's/.*Executable unittests src.lib.rs (\(.*\))/\1/p' | tail -1 | tr '\\' /)
          if [ -z "$rel" ]; then
            echo "the build gave no test binary"
            exit 1
          fi
          bin="$PWD/$rel"
          out="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/u42-loop-run.txt"
          bad=0
          loop() {
            name=$1
            runs=$2
            shift 2
            n=0
            ok=0
            while [ "$n" -lt "$runs" ]; do
              n=$((n + 1))
              (cd "$crate" && "$bin" "$@") >"$out" 2>&1
              if grep -q "^test result: ok\. 1 passed; 0 failed" "$out"; then
                ok=$((ok + 1))
              else
                grep -E "panicked at|left: |right: |^test .* FAILED|names |not covered" "$out" | head -n 12 | sed "s/^/$name run $n: /"
              fi
            done
            echo "loop $name runs=$n ok=$ok"
            [ "$ok" -eq "$n" ] || bad=1
          }
          for t in the_probe_names_no_process the_read_finds_a_process_start_in_a_new_file the_read_allows_the_exit_code_and_the_process_id the_read_leaves_out_test_code_and_comments_alone a_test_module_file_is_found_beside_its_parent a_file_that_the_read_cannot_place_is_not_covered a_rust_file_that_the_commit_does_not_hold_is_not_covered the_read_goes_on_after_an_item_that_a_bracket_or_a_parenthesis_ends the_crate_set_is_the_packages_with_a_path code_after_an_item_that_does_not_end_is_not_covered the_read_reads_rust_files_alone a_test_module_with_a_directory_leaves_out_every_file_below_it ${LOOP_EXTRA:-}; do
            loop "$t" "${LOOP_RUNS:-200}" --exact "probe::tests::$t" --test-threads 1
          done
          if [ "$bad" -ne 0 ]; then
            echo "a loop had a run without the result line of 1 passed test"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 60-r6-egress 70-r6-memory 80-r6-absent 10-r6-layout
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 60-r6-egress 70-r6-memory 80-r6-absent 10-r6-layout
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - name: U4.2 loops of the new tests (scratch)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          set -u
          crate=crates/halvo-route-gate
          rel=$(cargo test --locked -p halvo-route-gate --lib --no-run 2>&1 | sed -n 's/.*Executable unittests src.lib.rs (\(.*\))/\1/p' | tail -1 | tr '\\' /)
          if [ -z "$rel" ]; then
            echo "the build gave no test binary"
            exit 1
          fi
          bin="$PWD/$rel"
          out="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/u42-loop-run.txt"
          bad=0
          loop() {
            name=$1
            runs=$2
            shift 2
            n=0
            ok=0
            while [ "$n" -lt "$runs" ]; do
              n=$((n + 1))
              (cd "$crate" && "$bin" "$@") >"$out" 2>&1
              if grep -q "^test result: ok\. 1 passed; 0 failed" "$out"; then
                ok=$((ok + 1))
              else
                grep -E "panicked at|left: |right: |^test .* FAILED|names |not covered" "$out" | head -n 12 | sed "s/^/$name run $n: /"
              fi
            done
            echo "loop $name runs=$n ok=$ok"
            [ "$ok" -eq "$n" ] || bad=1
          }
          for t in the_probe_names_no_process the_read_finds_a_process_start_in_a_new_file the_read_allows_the_exit_code_and_the_process_id the_read_leaves_out_test_code_and_comments_alone a_test_module_file_is_found_beside_its_parent a_file_that_the_read_cannot_place_is_not_covered a_rust_file_that_the_commit_does_not_hold_is_not_covered the_read_goes_on_after_an_item_that_a_bracket_or_a_parenthesis_ends the_crate_set_is_the_packages_with_a_path code_after_an_item_that_does_not_end_is_not_covered the_read_reads_rust_files_alone a_test_module_with_a_directory_leaves_out_every_file_below_it ${LOOP_EXTRA:-}; do
            loop "$t" "${LOOP_RUNS:-200}" --exact "probe::tests::$t" --test-threads 1
          done
          if [ "$bad" -ne 0 ]; then
            echo "a loop had a run without the result line of 1 passed test"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
