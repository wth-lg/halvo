name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Egress trial
        shell: bash
        run: |
          cat >"$RUNNER_TEMP/trial.sh" <<'TRIAL'
          #!/bin/sh
          # The egress trial of a scratch branch: runs every cell of docs/r2/trials/egress.md for the job's platform.
          set -u
          job=$1
          cd "$GITHUB_WORKSPACE" || exit 2
          mkdir -p target/egress-trial
          step() {
            label=$1
            shift
            printf '::group::%s\n' "$label"
            "$@" >"target/egress-trial/$label.out" 2>"target/egress-trial/$label.err"
            code=$?
            cat "target/egress-trial/$label.out"
            tail -n 40 "target/egress-trial/$label.err"
            printf '::endgroup::\n'
            printf 'trial %s exit=%s\n' "$label" "$code"
          }
          case $job in
            macos) mode=sandbox; platform=macos-15; parts='probe lists sandbox' ;;
            windows) mode=wfp; platform=windows-2025; parts='probe lists wfp' ;;
          esac
          rustc --version
          step build sh scripts/egress/probe.sh none
          for part in $parts; do
            step "test-$part" sh scripts/egress/test.sh "$part"
          done
          step self-test sh scripts/egress/check.sh --mode "$mode" --self-test
          step control sh scripts/egress/check.sh --mode "$mode" --self-test --control-no-deny
          printf '[fixed]\n192.0.2.1:443\n[agent]\n' >target/egress-trial/routable.txt
          step entry sh scripts/egress/check.sh --mode "$mode" target/egress-trial/routable.txt -- sh scripts/egress/probe.sh none
          step driver-self-test sh scripts/ci/run-ci-d.sh "$job" --self-test 10-egress
          step driver sh scripts/ci/run-ci-d.sh "$job" 10-egress
          if [ "$job" = windows ]; then
            powershell.exe -NoProfile -Command "Get-NetFirewallProfile | ForEach-Object { 'profile ' + \$_.Name + ' enabled=' + \$_.Enabled + ' outbound=' + \$_.DefaultOutboundAction }"
          fi
          printf '::group::denial logs and counts\n'
          for d in target/egress/*/; do
            case $d in
              */bin/) continue ;;
            esac
            n=${d%/}
            n=${n##*/}
            lines=$(wc -l <"$d/denied.log" 2>/dev/null | tr -d ' ')
            counts=
            [ -f "$d/counts" ] && counts=$(cat "$d/counts")
            [ -f "$d/rules" ] && counts="rules=$(cat "$d/rules") $counts"
            [ -f "$d/firewall-enabled" ] && counts="firewall-enabled-by-check $counts"
            printf 'run %s platform=%s lines=%s %s\n' "$n" "$platform" "${lines:-none}" "$counts"
            [ -f "$d/denied.log" ] && sed 's/^/  /' "$d/denied.log"
          done
          printf '::endgroup::\n'
          TRIAL
          sh "$RUNNER_TEMP/trial.sh" macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: egress-trial-macos
          path: |
            target/egress-trial/
            target/egress/*/denied.log
            target/egress/*/counts
            target/egress/*/state
            target/egress/*/profile.sb

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Egress trial
        shell: bash
        run: |
          cat >"$RUNNER_TEMP/trial.sh" <<'TRIAL'
