name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      U26_ROWS: block_popup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust
          save-if: false
      - name: U2.6 rows of web-rows with real browsers
        if: always()
        shell: bash
        run: |
          python3 - macos "$RUNNER_TEMP/u26" <<'PYEOF'
          import os, subprocess, sys
          JOB, OUT = sys.argv[1], sys.argv[2]
          os.makedirs(OUT, exist_ok=True)
          EXE = ".exe" if JOB == "windows" else ""
          BROWSERS = {
              "macos": [("chrome", "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"),
                        ("edge", "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge")],
              "windows": [("chrome", "C:/Program Files/Google/Chrome/Application/chrome.exe"),
                          ("edge", "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe")],
          }[JOB]
          PORT, WS_PORT, HOP_PORT = "18090", "18095", "18096"
          failed = []


          def run(name, cmd, gate):
              r = subprocess.run(cmd, capture_output=True, text=True)
              for l in r.stdout.splitlines():
                  if l.startswith("row "):
                      print(f"{name} {l}", flush=True)
              print(f"{name} exit={r.returncode}", flush=True)
              open(os.path.join(OUT, name + ".txt"), "w").write(r.stdout)
              if gate and r.returncode != 0:
                  failed.append(name)
              return r.returncode


          def listen(cmd):
              p = subprocess.Popen(cmd, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              return p, p.stdout.readline().decode().startswith("listening ")


          subprocess.run(["cargo", "build", "-q", "--locked", "-p", "halvo-web", "--features", "test-fence", "--bins"], check=True)
          rows = os.path.join("target", "debug", "web-rows" + EXE)
          procs = []
          try:
              fixture, ok_f = listen(["node", "tools/fixture-server/variants/server.mjs", "--port", PORT])
              procs.append(fixture)
              hop, ok_h = listen(["node", "crates/halvo-web/rows/hop-listener.mjs", "--port", HOP_PORT])
              procs.append(hop)
              ws, ok_w = listen(["node", "crates/halvo-web/rows/ws-listener.mjs", "--port", WS_PORT])
              procs.append(ws)
              print(f"u26 listeners fixture={ok_f} hop={ok_h} ws={ok_w}", flush=True)
              if not (ok_f and ok_h and ok_w):
                  failed.append("listeners")
              only = os.environ.get("U26_ROWS", "block_popup,ws_allowed,crash_major").split(",")
              for kind, path in BROWSERS:
                  if not os.path.exists(path):
                      print(f"u26 browser={kind} absent", flush=True)
                      continue
                  if "block_popup" in only:
                      run(f"block_popup_{kind}", [rows, "block_popup", "--browser", path, "--kind", kind, "--hop-port", HOP_PORT], True)
                  if "ws_allowed" in only:
                      run(f"ws_allowed_{kind}", [rows, "ws_allowed", "--browser", path, "--kind", kind, "--ws-port", WS_PORT], True)
                  if "crash_major" in only and run(f"crash_major_{kind}", [rows, "crash_major", "--browser", path, "--kind", kind], False) != 0:
                      crash_dir = os.path.join(os.environ.get("RUNNER_TEMP", "."), "u26-crash-" + kind)
                      os.makedirs(crash_dir, exist_ok=True)
                      run(f"crash_{kind}", [rows, "crash", "--browser", path, "--kind", kind, "--port", PORT,
                                            "--scratch", crash_dir], False)
          finally:
              for p in procs:
                  try:
                      p.stdin.close()
                      p.wait(timeout=5)
                  except (OSError, subprocess.TimeoutExpired):
                      p.kill()
                      p.wait()
          print(f"u26 rows failed={','.join(failed) or '-'}", flush=True)
          sys.exit(1 if failed else 0)
          PYEOF
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      U26_ROWS: block_popup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
