name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test
      # scratch: the U0.6 round of CP-173 E9
      - name: r3 U0.6 drive crate tests
        if: always()
        shell: bash
        run: cd tools/r3-trials/drive && cargo test --locked --no-fail-fast
      - name: r3 U0.6 new tests 200 times
        if: always()
        shell: bash
        run: |
          cd tools/r3-trials/drive
          PY=$(command -v python3 || command -v python)
          cargo test --locked --no-run --message-format=json > "$RUNNER_TEMP/r3-drive-build.json"
          "$PY" -c 'import json, sys; [print(j["executable"]) for j in map(json.loads, open(sys.argv[1])) if j.get("reason") == "compiler-artifact" and j.get("profile", {}).get("test") and j.get("executable")]' "$RUNNER_TEMP/r3-drive-build.json" > "$RUNNER_TEMP/r3-drive-bins.txt"
          for t in body::tests::a_body_counts_when_it_holds_text_and_no_marker_or_address body::tests::a_body_names_no_host_ip_port_or_at_sign_in_any_form body::tests::a_marker_split_by_a_line_end_is_not_seen body::tests::the_words_of_a_body_are_trimmed_of_their_punctuation drive::tests::a_failed_request_of_a_confirmed_click_without_its_extracts_ends_the_compile drive::tests::a_fill_select_or_press_on_a_credential_line_is_refused drive::tests::a_refused_credential_action_and_an_allowed_effect_are_counted_once drive::tests::a_reply_given_again_on_the_same_page_is_repeated_and_the_cap_is_32 drive::tests::a_run_passes_on_its_steps_and_its_list_and_counts_the_effects_beyond_those_allowed drive::tests::a_target_among_lines_of_one_role_and_name_is_found_again_by_its_place drive::tests::the_rule_lets_a_request_leave_for_a_confirmed_click_or_press_with_its_extracts lines::tests::the_drive_line_takes_the_largest_of_the_five_runs_and_sums_the_counts tests::a_snapshot_line_gives_its_reference_role_and_name tests::the_repair_names_the_changed_control tests::the_repair_of_an_extract_names_the_line_under_the_step_name tests::the_right_walk_hands_back_extracts_selects_and_pays; do
            bin=
            while read -r b; do
              if "$b" --list --exact "$t" 2>/dev/null | grep -q ': test$'; then bin=$b; fi
            done < "$RUNNER_TEMP/r3-drive-bins.txt"
            pass=0
            i=0
            while [ "$i" -lt 200 ]; do
              i=$((i + 1))
              if [ -n "$bin" ] && "$bin" --exact "$t" -q 2>&1 | grep -q '1 passed'; then pass=$((pass + 1)); fi
            done
            echo "repeat test=$t runs=200 passed=$pass"
          done
          for s in verdict.py rebuild.py; do
            pass=0
            i=0
            while [ "$i" -lt 200 ]; do
              i=$((i + 1))
              if "$PY" -I "$s" --self-test > /dev/null 2>&1; then pass=$((pass + 1)); fi
            done
            echo "repeat test=$s runs=200 passed=$pass"
          done
      - name: r3 U0.6 control cells
        if: always()
        shell: bash
        run: |
          for cell in right:bill right:order effect_early:bill effect_early:order option_then_right:bill option_then_right:order sign_in_click:bill option_line:bill; do
            mode=${cell%%:*}
            task=${cell#*:}
            sh tools/r3-trials/drive/control.sh --mode "$mode" --task "$task" --browser "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --port 18190 || echo "control script mode=$mode task=$task exit=$?"
          done
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      # scratch: the U0.6 round of CP-173 E9
      - name: r3 U0.6 drive crate tests
        if: always()
        shell: bash
        run: cd tools/r3-trials/drive && cargo test --locked --no-fail-fast
      - name: r3 U0.6 new tests 200 times
        if: always()
        shell: bash
        run: |
          cd tools/r3-trials/drive
          PY=$(command -v python3 || command -v python)
          cargo test --locked --no-run --message-format=json > "$RUNNER_TEMP/r3-drive-build.json"
          "$PY" -c 'import json, sys; [print(j["executable"]) for j in map(json.loads, open(sys.argv[1])) if j.get("reason") == "compiler-artifact" and j.get("profile", {}).get("test") and j.get("executable")]' "$RUNNER_TEMP/r3-drive-build.json" > "$RUNNER_TEMP/r3-drive-bins.txt"
          for t in body::tests::a_body_counts_when_it_holds_text_and_no_marker_or_address body::tests::a_body_names_no_host_ip_port_or_at_sign_in_any_form body::tests::a_marker_split_by_a_line_end_is_not_seen body::tests::the_words_of_a_body_are_trimmed_of_their_punctuation drive::tests::a_failed_request_of_a_confirmed_click_without_its_extracts_ends_the_compile drive::tests::a_fill_select_or_press_on_a_credential_line_is_refused drive::tests::a_refused_credential_action_and_an_allowed_effect_are_counted_once drive::tests::a_reply_given_again_on_the_same_page_is_repeated_and_the_cap_is_32 drive::tests::a_run_passes_on_its_steps_and_its_list_and_counts_the_effects_beyond_those_allowed drive::tests::a_target_among_lines_of_one_role_and_name_is_found_again_by_its_place drive::tests::the_rule_lets_a_request_leave_for_a_confirmed_click_or_press_with_its_extracts lines::tests::the_drive_line_takes_the_largest_of_the_five_runs_and_sums_the_counts tests::a_snapshot_line_gives_its_reference_role_and_name tests::the_repair_names_the_changed_control tests::the_repair_of_an_extract_names_the_line_under_the_step_name tests::the_right_walk_hands_back_extracts_selects_and_pays; do
            bin=
            while read -r b; do
              if "$b" --list --exact "$t" 2>/dev/null | grep -q ': test$'; then bin=$b; fi
            done < "$RUNNER_TEMP/r3-drive-bins.txt"
            pass=0
            i=0
            while [ "$i" -lt 200 ]; do
              i=$((i + 1))
              if [ -n "$bin" ] && "$bin" --exact "$t" -q 2>&1 | grep -q '1 passed'; then pass=$((pass + 1)); fi
            done
            echo "repeat test=$t runs=200 passed=$pass"
          done
          for s in verdict.py rebuild.py; do
            pass=0
            i=0
            while [ "$i" -lt 200 ]; do
              i=$((i + 1))
              if "$PY" -I "$s" --self-test > /dev/null 2>&1; then pass=$((pass + 1)); fi
            done
            echo "repeat test=$s runs=200 passed=$pass"
          done
      - name: r3 U0.6 control cells
        if: always()
        shell: bash
        run: |
          for cell in right:bill right:order effect_early:bill effect_early:order option_then_right:bill option_then_right:order sign_in_click:bill option_line:bill; do
            mode=${cell%%:*}
            task=${cell#*:}
            sh tools/r3-trials/drive/control.sh --mode "$mode" --task "$task" --browser "C:/Program Files/Google/Chrome/Application/chrome.exe" --port 18190 || echo "control script mode=$mode task=$task exit=$?"
          done
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
