name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# scratch: trimmed to the mutant runner's self-test at the head and loops of its stop cases (mutants-3, ruling PL-20 E7); never merged
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Mutant runner self-test at the head (scratch, mutants-3)
        shell: bash
        run: |
          t0=$(date +%s)
          if sh scripts/r1-gate/mutation-test.sh --self-test -v > "$RUNNER_TEMP/selftest.out" 2>&1; then s=0; else s=$?; fi
          t1=$(date +%s)
          grep -v '^case .* want=PASS got=PASS$' "$RUNNER_TEMP/selftest.out" | grep -v '^case .* want=FAIL got=FAIL$' | tail -40
          echo "cases as wanted: $(grep -c -e 'want=PASS got=PASS$' -e 'want=FAIL got=FAIL$' "$RUNNER_TEMP/selftest.out")"
          echo "seconds runner-self-test-head $((t1 - t0)) exit $s"
          test "$s" -eq 0
      - name: Each new stop case and each that ran once, 20 times, counted by its PASS line (scratch, mutants-3)
        shell: bash
        run: |
          t0=$(date +%s)
          bad=0
          for c in \
            vf-stop-by-term-then-int-while-the-runner-waits-for-a-gate-check-changes-nothing \
            vf-stop-by-term-then-hup-while-the-runner-waits-for-a-gate-check-changes-nothing \
            vf-a-stop-note-of-the-caller-s-environment-is-not-printed \
            vf-the-bound-of-a-shielded-step-ends-at-its-second-on-a-made-up-clock \
            vf-the-bound-s-kill-leaves-no-process-that-forks-at-the-read-of-the-table \
            stop-past-the-bound-kills-check-deletion-and-names-it \
            stop-past-the-bound-kills-check-no-ll-hook-and-names-it \
            stop-by-int-as-the-helper-ends-a-run-lets-a-gate-check-end \
            stop-by-hup-as-the-helper-ends-a-run-lets-a-gate-check-end \
            stop-past-the-bound-kills-a-gate-check-and-names-it \
            stop-by-term-as-the-helper-ends-a-run-lets-an-unmutated-gate-check-end \
            a-shielded-step-starts-with-no-signal-and-not-after-one \
            stop-by-term-as-the-helper-ends-a-run-lets-the-unmutated-build-end \
            stop-by-term-again-while-the-runner-waits-for-a-gate-check-changes-nothing; do
            c0=$(date +%s)
            n=0; p=0
            while [ "$n" -lt 20 ]; do
              n=$((n + 1))
              sh scripts/r1-gate/mutation-test.sh --self-test -v --case "$c" > "$RUNNER_TEMP/one.out" 2>&1
              if grep -q -x -F "case mutation/$c want=PASS got=PASS" "$RUNNER_TEMP/one.out"; then p=$((p + 1)); else echo "run $n of $c:"; tail -3 "$RUNNER_TEMP/one.out"; fi
            done
            echo "loop $c: $p of $n passed by the PASS line, $(( $(date +%s) - c0 )) s"
            [ "$p" -eq "$n" ] || bad=$((bad + 1))
          done
          echo "seconds runner-stop-case-loops $(( $(date +%s) - t0 )); cases with a run that did not pass: $bad"
          test "$bad" -eq 0
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Mutant runner self-test at the head under Git Bash (scratch, mutants-3; records, never fails)
        shell: bash
        timeout-minutes: 30
        continue-on-error: true
        run: |
          t0=$(date +%s)
          if sh scripts/r1-gate/mutation-test.sh --self-test -v > "$RUNNER_TEMP/selftest.out" 2>&1; then s=0; else s=$?; fi
          t1=$(date +%s)
          echo "lines that are not as wanted:"
          grep -v -e 'want=PASS got=PASS$' -e 'want=FAIL got=FAIL$' "$RUNNER_TEMP/selftest.out" | head -30
          echo "cases as wanted: $(grep -c -e 'want=PASS got=PASS$' -e 'want=FAIL got=FAIL$' "$RUNNER_TEMP/selftest.out")"
          echo "seconds runner-self-test-windows $((t1 - t0)) exit $s"
          exit 0
