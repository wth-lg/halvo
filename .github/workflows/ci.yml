name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 31-store-full-volume
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 31-store-full-volume
      - name: Rows of store-3 step 7 to their end
        if: always()
        shell: bash
        run: |
          set +e
          started=$(date +%s)
          sh scripts/r1-gate/mutation-test.sh --only unknown-key-file-does-not-stop-the-cleanup --only mark-stays-owed-after-the-root --only associated-data-holds-the-path-of-the-executable --only create-clears-by-name --only create-keeps-keyless-leftovers --only database-removal-leaves-the-log --only deletion-check-without-the-all-zero-probe --only key-file-removed-without-its-zero-fill --only key-file-test-follows-a-link --only the-one-open-drops-no-follow --only segment-roundtrip-broken --only formal-busy-not-mapped-to-locked --only formal-checkpoint-not-verified --only formal-second-delete-all-finishes-nothing --only formal-second-delete-all-is-refused --only formal-secure-delete-off --only formal-single-writer --only formal-store-db-keeps-a-wider-mode --only formal-delete-all-returns-before-its-root-step --only formal-delete-walk-takes-a-link-for-a-directory --only formal-open-makes-a-missing-database
          echo "rows exit=$? seconds=$(($(date +%s) - started))"
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

