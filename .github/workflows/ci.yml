name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: own/01 asking loop, counted (scratch)
        shell: bash
        run: |
          set +e
          set -u
          export TMPDIR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/r6-trace"
          mkdir -p "$TMPDIR"
          sh scripts/ci/run-ci-d.sh macos 60-r6-egress >"$TMPDIR/first.txt" 2>&1
          grep -E '^egress (control|asking|forbid findings)|^FAIL|^PASS' "$TMPDIR/first.txt"
          work=$(find "$TMPDIR" -maxdepth 1 -name '60-r6-egress.*' | head -n 1)
          exe=$PWD/target/debug/route-gate
          if [ ! -f "$work/asker.sh" ] || [ ! -f "$exe" ]; then
            echo "the first run left no asker or no binary"
            exit 1
          fi
          printf 'probe\n' >"$TMPDIR/one.txt"
          loop() {
            kind=$1
            words=$2
            runs=$3
            i=0
            lost=0
            reported=0
            noconnect=0
            started=$(date +%s)
            while [ "$i" -lt "$runs" ]; do
              i=$((i + 1))
              run=$TMPDIR/$kind-$i
              mkdir -p "$run/answers"
              : >"$run/witness.txt"
              R6_TRACE_WITNESS=$run/witness.txt sh scripts/egress/check.sh scripts/r6/egress/gate.txt -- \
                sh "$work/asker.sh" "$exe" "$words" "$run/answers" 240 --r6-egress-no-such-argument \
                >"$run/out.txt" 2>"$run/err.txt" </dev/null
              last_line=$(tail -n 1 "$run/err.txt")
              denied=${last_line#* denied=}
              denied=${denied%% *}
              witness=$(awk 'END { print NR }' "$run/witness.txt")
              if [ "$witness" -eq 0 ]; then
                noconnect=$((noconnect + 1))
              elif [ "$denied" = 0 ]; then
                lost=$((lost + 1))
                echo "loop $kind run $i: witness=$witness, $last_line"
              else
                reported=$((reported + 1))
              fi
            done
            echo "loop $kind runs=$runs reported=$reported lost=$lost no-connect=$noconnect seconds=$(($(date +%s) - started))"
          }
          loop one "$TMPDIR/one.txt" "${LOOP_ONE:-50}"
          loop all "$work/candidates.txt" "${LOOP_ALL:-20}"
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

