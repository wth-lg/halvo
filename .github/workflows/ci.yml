          }
          lib=$(exe halvo_coord_app); hub=$(exe presenter_hub); gate=$(exe hosted_gate); dlg=$(exe dialog_hosted); cmd=$(exe commands)
          echo "u42 loop binaries: lib=${lib:+found} hub=${hub:+found} gate=${gate:+found} dialog=${dlg:+found}"
          new="present::tests::system::seams present::tests::serve::present_returns_at_once present::tests::serve::the_mark_on_screen present::tests::outcome::task_dialog_the_two_ids present::tests::card::a_value_cut present::tests::card::a_piece_keeps present::tests::card::each_field_is_one_line"
          if [ "$RUNNER_OS" = macOS ]; then cases=4; else cases=5; fi
          # shellcheck disable=SC2086
          loop new-lib-tests 200 'test result: ok. 14 passed; 0 failed' "$lib" $new
          loop presenter-hub 200 'test result: ok. 8 passed; 0 failed' "$hub"
          loop hosted-gate 200 'test result: ok. 4 passed; 0 failed' "$gate"
          loop dialog-hosted 20 "dialog_hosted end: cases ran $cases of $cases, failed 0" "$dlg"
          loop rd95-day 200 'test result: ok. 1 passed; 0 failed' "$cmd" the_day_of_an_instant_on_another_day_than_the_clocks_is_the_day_of_that_instant
