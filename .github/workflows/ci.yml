        shell: bash
        run: |
          set +e
          file=crates/halvo-coord-app/tests/hosted/gate.rs
          bad=0
          guard() {
            id=$1
            OLD=$2 NEW=$3 perl -pi -e 's/\Q$ENV{OLD}\E/$ENV{NEW}/ if !$done && /\Q$ENV{OLD}\E/ && ($done = 1)' "$file"
