          mkdir -p "$out"
          runs=20
          job_start=$(cat "$tmp/job-start")
          deadline=$((job_start + 4800))
          echo "planned runs: $runs; no run starts after $((deadline - $(date +%s))) s from now (4800 s after the job's start)"
