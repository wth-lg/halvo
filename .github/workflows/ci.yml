name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/r4-trials/app -> target
          save-if: false
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Trial app
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          app="$GITHUB_WORKSPACE/tools/r4-trials/app"
          T="$RUNNER_TEMP/r4"
          mkdir -p "$T"
          export CARGO_TARGET_DIR="$app/target"
          exe=
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          bin="$CARGO_TARGET_DIR/release/r4-trial-app$exe"
          cat >"$T/probe.mjs" <<'R4EOF'
          import { execFileSync, spawn } from 'node:child_process';
          import fs from 'node:fs';
          import net from 'node:net';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const [mode, appDir, bin, pages] = process.argv.slice(2);
          const { launch, Control, stop, SYSTEM } = await import(pathToFileURL(path.join(appDir, 'selfcheck.mjs')).href);
          const { readTree } = await import(pathToFileURL(path.join(appDir, 'system', 'system.mjs')).href);
          const HTTP_PS1 = `param([string]$Out, [int]$Seconds)
          $l = New-Object System.Net.HttpListener
          $l.Prefixes.Add('http://+:80/')
          try { $l.Start() } catch { 'start=fail error=' + $_.Exception.GetType().Name | Set-Content $Out; exit 0 }
          $requests = 0
          $bytes = 0
          $deadline = (Get-Date).AddSeconds($Seconds)
          $task = $null
          while ((Get-Date) -lt $deadline) {
            if ($task -eq $null) { $task = $l.GetContextAsync() }
            if ($task.Wait(250)) {
              $ctx = $task.Result
              $task = $null
              $req = $ctx.Request
              $requests++
              $head = $req.HttpMethod.Length + $req.RawUrl.Length + 11
              foreach ($k in $req.Headers.AllKeys) { $head += $k.Length + $req.Headers[$k].Length + 4 }
              $bytes += $head + [Math]::Max(0, $req.ContentLength64)
              $ctx.Response.StatusCode = 404
              $ctx.Response.Close()
            }
          }
          'start=ok requests=' + $requests + ' bytes=' + $bytes | Set-Content $Out
          $l.Stop()
          `;

          const CONNS_PS1 = `param([string]$Ids, [int]$Seconds, [string]$Out)
          $ids = @($Ids -split ',' | ForEach-Object { [int]$_ })
          $seen = @{}
          $deadline = (Get-Date).AddSeconds($Seconds)
          while ((Get-Date) -lt $deadline) {
            foreach ($c in @(Get-NetTCPConnection -RemotePort 80 -ErrorAction SilentlyContinue)) {
              if ($ids -contains [int]$c.OwningProcess) { $seen[[string]$c.LocalAddress + '|' + [string]$c.LocalPort] = [string]$c.RemoteAddress }
            }
            Start-Sleep -Milliseconds 500
          }
          $loop = @($seen.Values | Where-Object { $_ -eq '::1' -or $_ -like '127.*' }).Count
          'connections=' + $seen.Count + ' loopback=' + $loop | Set-Content $Out
          `;

          const HOLDER_PS1 = `$l = @(Get-NetTCPConnection -State Listen -LocalPort 80 -ErrorAction SilentlyContinue)
          $names = (@($l | ForEach-Object { (Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).ProcessName }) | Sort-Object -Unique) -join ','
          if (-not $names) { $names = '-' }
          $excluded = 'no'
          foreach ($line in @(netsh interface ipv4 show excludedportrange protocol=tcp)) {
            $p = @(($line -split '\\s+') | Where-Object { $_ -match '^\\d+$' })
            if ($p.Count -ge 2 -and [int]$p[0] -le 80 -and [int]$p[1] -ge 80) { $excluded = 'yes' }
          }
          'listeners=' + $l.Count + ' owners=' + $names + ' excluded=' + $excluded
          `;

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const loopback = (address) => /^(127\.|::1$|\[::1\]|localhost|0\.0\.0\.0$|::$|\*$)/.test(address);

          function sockets(pids) {
            let listening = 0;
            let remote = 0;
            let loop = 0;
            if (process.platform === 'darwin') {
              let out = '';
              try {
                out = execFileSync('lsof', ['-nP', '-a', '-p', pids.join(','), '-i'], { encoding: 'utf8', timeout: 60000 });
              } catch (error) {
                out = String(error.stdout ?? '');
              }
              for (const line of out.split('\n').slice(1)) {
                const name = line.trim().split(/\s+/).slice(8).join(' ');
                if (!name) continue;
                if (/\(LISTEN\)/.test(name)) listening += 1;
                const peer = /->(\S+)/.exec(name);
                if (peer) {
                  const host = peer[1].replace(/:\d+$/, '');
                  if (loopback(host)) loop += 1; else remote += 1;
                }
              }
            } else {
              const script = `$ids = @(${pids.join(',')}); `
                + "$t = @(Get-NetTCPConnection -ErrorAction SilentlyContinue | Where-Object { $ids -contains $_.OwningProcess }); "
                + "$u = @(Get-NetUDPEndpoint -ErrorAction SilentlyContinue | Where-Object { $ids -contains $_.OwningProcess }); "
                + "foreach ($c in $t) { 'tcp ' + $c.State + ' ' + $c.RemoteAddress }; foreach ($e in $u) { 'udp ' + $e.LocalAddress }";
              const out = execFileSync('powershell', ['-NoProfile', '-NonInteractive', '-Command', script], { encoding: 'utf8', timeout: 120000 });
              for (const line of out.split('\n').map((l) => l.replace(/\r$/, '')).filter(Boolean)) {
                const [kind, state, address] = line.split(' ');
                if (kind === 'tcp' && state === 'Listen') listening += 1;
                else if (kind === 'tcp' && address) {
                  if (loopback(address)) loop += 1; else remote += 1;
                }
              }
            }
            return { listening, remote, loop };
          }

          async function withApp(args, body) {
            const app = await launch(bin, args);
            const control = await Control.connect(app.port);
            try {
              return await body(app, control);
            } finally {
              await control.send('quit', 10000);
              await Promise.race([app.exited, sleep(10000)]);
              control.close();
              stop(app);
            }
          }

          if (mode === 'fetch') {
            await withApp(['--pages', pages], async (app, control) => {
              const shown = await control.send('show');
              const loaded = await control.send('load fetch.html');
              const deadline = Date.now() + 20000;
              while (Date.now() < deadline && !app.lines.some((l) => l.startsWith('page fetch nav_stayed='))) await sleep(200);
              const fetchLine = app.lines.find((l) => l.startsWith('page fetch reached=')) ?? '';
              const policy = app.lines.filter((l) => l.startsWith('page policy violated '));
              const stayed = app.lines.some((l) => l === 'page fetch nav_stayed=yes');
              const reached = /reached=(yes|no)/.exec(fetchLine)?.[1] ?? 'none';
              const error = /error=([A-Za-z]+)/.exec(fetchLine)?.[1] ?? '-';
              const first = /directive=(\S+) blocked=(\S+)/.exec(policy[0] ?? '');
              console.log(`probe fetch system=${SYSTEM} show=${(shown.answer ?? 'none').split(' ')[0]} load=${loaded.answer ?? 'none'} reached=${reached} error=${error} policy_lines=${policy.length} directive=${first?.[1] ?? '-'} blocked=${first?.[2] ?? '-'} nav_stayed=${stayed ? 'yes' : 'no'}`);
            });
          } else if (mode === 'net') {
            const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP ?? '.', 'r4-net-'));
            const powershell = (args, options = {}) => spawn('powershell', ['-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', ...args], options);
            const ended = (child, ms) => Promise.race([new Promise((resolve) => child.on('exit', resolve)), sleep(ms)]);
            let listener = null;
            const listenerOut = path.join(dir, 'http.txt');
            if (process.platform === 'win32') {
              fs.writeFileSync(path.join(dir, 'holder.ps1'), HOLDER_PS1);
              fs.writeFileSync(path.join(dir, 'http.ps1'), HTTP_PS1);
              fs.writeFileSync(path.join(dir, 'conns.ps1'), CONNS_PS1);
              const holder = execFileSync('powershell', ['-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', path.join(dir, 'holder.ps1')], { encoding: 'utf8', timeout: 120000 }).replace(/\r/g, '').trim();
              console.log(`probe port80_holder system=windows ${holder}`);
              listener = powershell(['-File', path.join(dir, 'http.ps1'), '-Out', listenerOut, '-Seconds', '45'], { stdio: 'ignore' });
              await sleep(5000);
            }
            let conns = null;
            const connsOut = path.join(dir, 'conns.txt');
            await withApp(['--sync', 'events', '--pages', pages], async (app, control) => {
              await control.send('show');
              const tree = readTree(app.pid);
              if (process.platform === 'win32') {
                conns = powershell(['-File', path.join(dir, 'conns.ps1'), '-Ids', tree.procs.map((p) => p.pid).join(','), '-Seconds', '10', '-Out', connsOut], { stdio: 'ignore' });
              }
              await sleep(2000);
              await control.send('send 100 100');
              await sleep(3000);
              const counted = sockets(readTree(app.pid).procs.map((p) => p.pid));
              console.log(`probe sockets system=${SYSTEM} listening=${counted.listening} remote=${counted.remote} loopback_peers=${counted.loop} tree=${tree.count}`);
              if (conns) await ended(conns, 30000);
            });
            if (listener) {
              await ended(listener, 60000);
              const heard = fs.existsSync(listenerOut) ? fs.readFileSync(listenerOut, 'utf8').trim() : 'start=none';
              const seen = fs.existsSync(connsOut) ? fs.readFileSync(connsOut, 'utf8').trim() : 'connections=none';
              const n = (text, key) => new RegExp(`${key}=(\\S+)`).exec(text)?.[1] ?? '-';
              console.log(`probe port80 system=windows connections=${n(seen, 'connections')} bytes=${n(heard, 'bytes')} requests=${n(heard, 'requests')} loopback_connections=${n(seen, 'loopback')} listener=${n(heard, 'start')}`);
            }
          }
          process.exit(0);
          R4EOF
          cat >"$T/mutate.mjs" <<'R4EOF'
          import fs from 'node:fs';
          import path from 'node:path';

          const [list, id, crate] = process.argv.slice(2);
          const copy = JSON.parse(fs.readFileSync(list, 'utf8')).find((c) => c.id === id);
          const file = path.join(crate, copy.file);
          const text = fs.readFileSync(file, 'utf8').replace(/\r\n/g, '\n');
          const found = text.split(copy.find).length - 1;
          if (found !== 1) {
            console.log(`copy=${id} apply=fail found=${found}`);
            process.exit(1);
          }
          fs.writeFileSync(file, text.replace(copy.find, copy.replace));
          console.log(`copy=${id} apply=ok arm=${copy.arm} key=${copy.key}`);
          R4EOF
          cat >"$T/copies.json" <<'R4EOF'
          [
           {
            "id": "M01",
            "arm": "main",
            "key": "show",
            "what": "show answers ok show_ms=1 and does nothing",
            "file": "src/app.rs",
            "find": "            Line::Show => self.show(),",
            "replace": "            Line::Show => Answer::Shown { show_ms: 1 },"
           },
           {
            "id": "M02",
            "arm": "main",
            "key": "hide",
            "what": "hide destroys the window",
            "file": "src/app.rs",
            "find": "        let _ = window.hide();\n        if waits::until(",
            "replace": "        let _ = window.destroy();\n        if waits::until("
           },
           {
            "id": "M06",
            "arm": "main",
            "key": "counts",
            "what": "sample returns constant counts",
            "file": "src/app.rs",
            "find": "            ticks: counts.map(|c| c.0),\n            frames: counts.map(|c| c.1),",
            "replace": "            ticks: Some(1).or(counts.map(|c| c.0)),\n            frames: Some(5).or(counts.map(|c| c.1)),"
           },
           {
            "id": "M07",
            "arm": "main",
            "key": "pid",
            "what": "sample gives a pid that is not the app's",
            "file": "src/app.rs",
            "find": "        let pid = std::process::id();",
            "replace": "        let pid = std::process::id() + 1;"
           },
           {
            "id": "M08",
            "arm": "b",
            "key": "destroy",
            "what": "destroy hides the window and keeps it",
            "file": "src/app.rs",
            "find": "        self.frames.cancel();\n        let _ = window.destroy();",
            "replace": "        self.frames.cancel();\n        let _ = window.hide();"
           },
           {
            "id": "M09",
            "arm": "b",
            "key": "-",
            "what": "a close request is prevented in every arm (arm b keeps its window on close)",
            "file": "src/app.rs",
            "find": "WindowEvent::CloseRequested { api, .. } if self.options.arm != Arm::B =>",
            "replace": "WindowEvent::CloseRequested { api, .. } if self.options.arm == self.options.arm =>"
           },
           {
            "id": "M10",
            "arm": "a2",
            "key": "sync_events",
            "what": "the way events never emits",
            "file": "src/app.rs",
            "find": "                let _ = self.app.emit(CHANGE_EVENT, change);",
            "replace": "                let _ = (CHANGE_EVENT, change, &self.app);"
           },
           {
            "id": "M11",
            "arm": "a2",
            "key": "sync_channel",
            "what": "the way channel never sends",
            "file": "src/app.rs",
            "find": "                    let _ = channel.send(change);",
            "replace": "                    let _ = (channel, change);"
           },
           {
            "id": "M13",
            "arm": "main",
            "key": "quit",
            "what": "quit answers ok and does not exit",
            "file": "src/app.rs",
            "find": "        self.app.exit(0);",
            "replace": "        let _ = &self.app;"
           },
           {
            "id": "M14",
            "arm": "b",
            "key": "destroy",
            "what": "run without prevent_exit, so arm b ends at its destroy",
            "file": "src/lib.rs",
            "find": "            api.prevent_exit();",
            "replace": "            let _ = api;"
           },
           {
            "id": "M15",
            "arm": "a2",
            "key": "-",
            "what": "a2 without backgroundThrottling(Suspend) on macOS",
            "file": "src/app.rs",
            "find": "            builder.background_throttling(tauri::utils::config::BackgroundThrottlingPolicy::Suspend)",
            "replace": "            builder"
           },
           {
            "id": "M16",
            "arm": "a",
            "key": "counts",
            "what": "arms a and a2 never tell the page of the hide",
            "file": "src/app.rs",
            "find": "            Self::eval(&window, \"window.__r4Window && window.__r4Window('hide')\");",
            "replace": "            let _ = &window;"
           },
           {
            "id": "M21",
            "arm": "a2",
            "key": "sync_get",
            "what": "hide does not close the way get",
            "file": "src/app.rs",
            "find": "        self.hub.hide();\n        self.hub.close();\n        if matches!",
            "replace": "        self.hub.hide();\n        if matches!",
            "repeat": 3
           },
           {
            "id": "M22",
            "arm": "main",
            "key": "show",
            "what": "show answers before the page's frame",
            "file": "src/app.rs",
            "find": "        let waited = self.frames.wait(token, SHOW_BOUND);",
            "replace": "        let waited = waits::Waited::Reported(());"
           }
          ]
          R4EOF
          P="$T/fetch-pages"
          mkdir -p "$P"
          cp "$app"/pages/* "$P/"
          cat >"$P/fetch.js" <<'R4EOF'
          (function () {
            'use strict';
            var app = window.r4app;
            fetch('https://example.com/', { mode: 'no-cors' }).then(function (response) {
              app.report('fetch reached=yes type=' + response.type);
            }, function (error) {
              app.report('fetch reached=no error=' + error.name);
            }).then(function () {
              setTimeout(function () {
                app.report('fetch nav_stayed=yes');
              }, 3000);
              location.href = 'https://example.com/';
            });
          })();
          R4EOF
          node -e 'const fs = require("fs"); const [from, to] = process.argv.slice(1); const tag = "<script src=\"page.js\"></script>"; fs.writeFileSync(to, fs.readFileSync(from, "utf8").replace(tag, tag + "\n<script src=\"fetch.js\"></script>"))' "$app/pages/index.html" "$P/fetch.html"
          echo "trial os=$RUNNER_OS fetch_page_scripts=$(grep -c '<script' "$P/fetch.html")"

          started=$(date +%s)
          cargo build --release --locked --manifest-path "$app/Cargo.toml"
          code=$?
          echo "trial build=$([ "$code" = 0 ] && echo ok || echo fail) exit=$code seconds=$(($(date +%s) - started))"
          if [ "$code" != 0 ]; then exit 1; fi
          echo "trial binary_bytes=$(wc -c <"$bin" | tr -d ' ')"

          started=$(date +%s)
          (cd "$app" && cargo test --locked --no-fail-fast) >"$T/cargo-test.out" 2>&1
          code=$?
          grep -E '^test result:|^test .* FAILED$' "$T/cargo-test.out" | tr -d '\r' | sed 's/^/trial cargo_test /'
          echo "trial cargo_test exit=$code seconds=$(($(date +%s) - started))"
          (cd "$app" && node --test tests/) >"$T/node-test.out" 2>&1
          code=$?
          tr -d '\r' <"$T/node-test.out" | grep -E '^. (tests|pass|fail) [0-9]+$|^not ok' | sed 's/^/trial node_test /'
          echo "trial node_test exit=$code"

          started=$(date +%s)
          node "$app/selfcheck.mjs" --trace
          code=$?
          echo "trial selfcheck exit=$code seconds=$(($(date +%s) - started))"

          node "$T/probe.mjs" fetch "$app" "$bin" "$P"
          echo "trial probe_fetch exit=$?"
          node "$T/probe.mjs" net "$app" "$bin" "$P"
          echo "trial probe_net exit=$?"

          for id in $(node -e 'for (const c of JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))) console.log(c.id)' "$T/copies.json"); do
            dir="$T/copy-$id"
            mkdir -p "$dir"
            udir=$dir
            if [ "$RUNNER_OS" = Windows ]; then udir=$(cygpath -u "$dir"); fi
            git -C "$GITHUB_WORKSPACE" archive HEAD tools/r4-trials/app src-tauri/icons | tar -x -C "$udir"
            crate="$dir/tools/r4-trials/app"
            applied=$(node "$T/mutate.mjs" "$T/copies.json" "$id" "$crate")
            echo "$applied"
            case "$applied" in *apply=ok*) ;; *) continue ;; esac
            arm=$(printf '%s\n' "$applied" | sed -n 's/.* arm=\([a-z0-9]*\) .*/\1/p')
            started=$(date +%s)
            cargo build --release --locked --manifest-path "$crate/Cargo.toml" >"$T/copy-$id-build.out" 2>&1
            code=$?
            echo "copy=$id build=$([ "$code" = 0 ] && echo ok || echo fail) seconds=$(($(date +%s) - started))"
            if [ "$code" != 0 ]; then tr -d '\r' <"$T/copy-$id-build.out" | grep -E '^error' | head -n 5 | cut -c1-160; continue; fi
            reps=$(node -e 'const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).find((c) => c.id === process.argv[2]); console.log(c.repeat || 1)' "$T/copies.json" "$id")
            for rep in $(seq 1 "$reps"); do
              node "$app/selfcheck.mjs" --bin "$bin" --arm "$arm" --trace >"$T/copy-$id-$rep.out" 2>&1
              code=$?
              sed "s/^/copy=$id rep=$rep /" "$T/copy-$id-$rep.out"
              line=$(grep '^selfcheck ' "$T/copy-$id-$rep.out")
              missed=$(printf '%s\n' "$line" | tr ' ' '\n' | sed -n 's/=miss$//p' | tr '\n' ',' | sed 's/,$//')
              echo "copy=$id rep=$rep selfcheck_exit=$code missed=${missed:--}"
            done
          done
          echo "trial end"

  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/r4-trials/app -> target
          save-if: false
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Trial app
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          app="$GITHUB_WORKSPACE/tools/r4-trials/app"
          T="$RUNNER_TEMP/r4"
          mkdir -p "$T"
          export CARGO_TARGET_DIR="$app/target"
          exe=
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          bin="$CARGO_TARGET_DIR/release/r4-trial-app$exe"
          cat >"$T/probe.mjs" <<'R4EOF'
          import { execFileSync, spawn } from 'node:child_process';
          import fs from 'node:fs';
          import net from 'node:net';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';

          const [mode, appDir, bin, pages] = process.argv.slice(2);
          const { launch, Control, stop, SYSTEM } = await import(pathToFileURL(path.join(appDir, 'selfcheck.mjs')).href);
          const { readTree } = await import(pathToFileURL(path.join(appDir, 'system', 'system.mjs')).href);
          const HTTP_PS1 = `param([string]$Out, [int]$Seconds)
          $l = New-Object System.Net.HttpListener
          $l.Prefixes.Add('http://+:80/')
          try { $l.Start() } catch { 'start=fail error=' + $_.Exception.GetType().Name | Set-Content $Out; exit 0 }
          $requests = 0
          $bytes = 0
          $deadline = (Get-Date).AddSeconds($Seconds)
          $task = $null
          while ((Get-Date) -lt $deadline) {
            if ($task -eq $null) { $task = $l.GetContextAsync() }
            if ($task.Wait(250)) {
              $ctx = $task.Result
              $task = $null
              $req = $ctx.Request
              $requests++
              $head = $req.HttpMethod.Length + $req.RawUrl.Length + 11
              foreach ($k in $req.Headers.AllKeys) { $head += $k.Length + $req.Headers[$k].Length + 4 }
              $bytes += $head + [Math]::Max(0, $req.ContentLength64)
              $ctx.Response.StatusCode = 404
              $ctx.Response.Close()
            }
          }
          'start=ok requests=' + $requests + ' bytes=' + $bytes | Set-Content $Out
          $l.Stop()
          `;

          const CONNS_PS1 = `param([string]$Ids, [int]$Seconds, [string]$Out)
          $ids = @($Ids -split ',' | ForEach-Object { [int]$_ })
          $seen = @{}
          $deadline = (Get-Date).AddSeconds($Seconds)
          while ((Get-Date) -lt $deadline) {
            foreach ($c in @(Get-NetTCPConnection -RemotePort 80 -ErrorAction SilentlyContinue)) {
              if ($ids -contains [int]$c.OwningProcess) { $seen[[string]$c.LocalAddress + '|' + [string]$c.LocalPort] = [string]$c.RemoteAddress }
            }
            Start-Sleep -Milliseconds 500
          }
          $loop = @($seen.Values | Where-Object { $_ -eq '::1' -or $_ -like '127.*' }).Count
          'connections=' + $seen.Count + ' loopback=' + $loop | Set-Content $Out
          `;

          const HOLDER_PS1 = `$l = @(Get-NetTCPConnection -State Listen -LocalPort 80 -ErrorAction SilentlyContinue)
          $names = (@($l | ForEach-Object { (Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).ProcessName }) | Sort-Object -Unique) -join ','
          if (-not $names) { $names = '-' }
          $excluded = 'no'
          foreach ($line in @(netsh interface ipv4 show excludedportrange protocol=tcp)) {
            $p = @(($line -split '\\s+') | Where-Object { $_ -match '^\\d+$' })
            if ($p.Count -ge 2 -and [int]$p[0] -le 80 -and [int]$p[1] -ge 80) { $excluded = 'yes' }
          }
          'listeners=' + $l.Count + ' owners=' + $names + ' excluded=' + $excluded
          `;

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const loopback = (address) => /^(127\.|::1$|\[::1\]|localhost|0\.0\.0\.0$|::$|\*$)/.test(address);

          function sockets(pids) {
            let listening = 0;
            let remote = 0;
            let loop = 0;
            if (process.platform === 'darwin') {
              let out = '';
              try {
                out = execFileSync('lsof', ['-nP', '-a', '-p', pids.join(','), '-i'], { encoding: 'utf8', timeout: 60000 });
              } catch (error) {
                out = String(error.stdout ?? '');
              }
              for (const line of out.split('\n').slice(1)) {
                const name = line.trim().split(/\s+/).slice(8).join(' ');
                if (!name) continue;
                if (/\(LISTEN\)/.test(name)) listening += 1;
                const peer = /->(\S+)/.exec(name);
                if (peer) {
                  const host = peer[1].replace(/:\d+$/, '');
                  if (loopback(host)) loop += 1; else remote += 1;
                }
              }
            } else {
              const script = `$ids = @(${pids.join(',')}); `
                + "$t = @(Get-NetTCPConnection -ErrorAction SilentlyContinue | Where-Object { $ids -contains $_.OwningProcess }); "
                + "$u = @(Get-NetUDPEndpoint -ErrorAction SilentlyContinue | Where-Object { $ids -contains $_.OwningProcess }); "
                + "foreach ($c in $t) { 'tcp ' + $c.State + ' ' + $c.RemoteAddress }; foreach ($e in $u) { 'udp ' + $e.LocalAddress }";
              const out = execFileSync('powershell', ['-NoProfile', '-NonInteractive', '-Command', script], { encoding: 'utf8', timeout: 120000 });
              for (const line of out.split('\n').map((l) => l.replace(/\r$/, '')).filter(Boolean)) {
                const [kind, state, address] = line.split(' ');
                if (kind === 'tcp' && state === 'Listen') listening += 1;
                else if (kind === 'tcp' && address) {
                  if (loopback(address)) loop += 1; else remote += 1;
                }
              }
            }
            return { listening, remote, loop };
          }

          async function withApp(args, body) {
            const app = await launch(bin, args);
            const control = await Control.connect(app.port);
            try {
              return await body(app, control);
            } finally {
              await control.send('quit', 10000);
              await Promise.race([app.exited, sleep(10000)]);
              control.close();
              stop(app);
            }
          }

          if (mode === 'fetch') {
            await withApp(['--pages', pages], async (app, control) => {
              const shown = await control.send('show');
              const loaded = await control.send('load fetch.html');
              const deadline = Date.now() + 20000;
              while (Date.now() < deadline && !app.lines.some((l) => l.startsWith('page fetch nav_stayed='))) await sleep(200);
              const fetchLine = app.lines.find((l) => l.startsWith('page fetch reached=')) ?? '';
              const policy = app.lines.filter((l) => l.startsWith('page policy violated '));
              const stayed = app.lines.some((l) => l === 'page fetch nav_stayed=yes');
              const reached = /reached=(yes|no)/.exec(fetchLine)?.[1] ?? 'none';
              const error = /error=([A-Za-z]+)/.exec(fetchLine)?.[1] ?? '-';
              const first = /directive=(\S+) blocked=(\S+)/.exec(policy[0] ?? '');
              console.log(`probe fetch system=${SYSTEM} show=${(shown.answer ?? 'none').split(' ')[0]} load=${loaded.answer ?? 'none'} reached=${reached} error=${error} policy_lines=${policy.length} directive=${first?.[1] ?? '-'} blocked=${first?.[2] ?? '-'} nav_stayed=${stayed ? 'yes' : 'no'}`);
            });
          } else if (mode === 'net') {
            const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP ?? '.', 'r4-net-'));
            const powershell = (args, options = {}) => spawn('powershell', ['-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', ...args], options);
            const ended = (child, ms) => Promise.race([new Promise((resolve) => child.on('exit', resolve)), sleep(ms)]);
            let listener = null;
            const listenerOut = path.join(dir, 'http.txt');
            if (process.platform === 'win32') {
              fs.writeFileSync(path.join(dir, 'holder.ps1'), HOLDER_PS1);
              fs.writeFileSync(path.join(dir, 'http.ps1'), HTTP_PS1);
              fs.writeFileSync(path.join(dir, 'conns.ps1'), CONNS_PS1);
              const holder = execFileSync('powershell', ['-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', path.join(dir, 'holder.ps1')], { encoding: 'utf8', timeout: 120000 }).replace(/\r/g, '').trim();
              console.log(`probe port80_holder system=windows ${holder}`);
              listener = powershell(['-File', path.join(dir, 'http.ps1'), '-Out', listenerOut, '-Seconds', '45'], { stdio: 'ignore' });
              await sleep(5000);
            }
            let conns = null;
            const connsOut = path.join(dir, 'conns.txt');
            await withApp(['--sync', 'events', '--pages', pages], async (app, control) => {
              await control.send('show');
              const tree = readTree(app.pid);
              if (process.platform === 'win32') {
                conns = powershell(['-File', path.join(dir, 'conns.ps1'), '-Ids', tree.procs.map((p) => p.pid).join(','), '-Seconds', '10', '-Out', connsOut], { stdio: 'ignore' });
              }
              await sleep(2000);
              await control.send('send 100 100');
              await sleep(3000);
              const counted = sockets(readTree(app.pid).procs.map((p) => p.pid));
              console.log(`probe sockets system=${SYSTEM} listening=${counted.listening} remote=${counted.remote} loopback_peers=${counted.loop} tree=${tree.count}`);
              if (conns) await ended(conns, 30000);
            });
            if (listener) {
              await ended(listener, 60000);
              const heard = fs.existsSync(listenerOut) ? fs.readFileSync(listenerOut, 'utf8').trim() : 'start=none';
              const seen = fs.existsSync(connsOut) ? fs.readFileSync(connsOut, 'utf8').trim() : 'connections=none';
              const n = (text, key) => new RegExp(`${key}=(\\S+)`).exec(text)?.[1] ?? '-';
              console.log(`probe port80 system=windows connections=${n(seen, 'connections')} bytes=${n(heard, 'bytes')} requests=${n(heard, 'requests')} loopback_connections=${n(seen, 'loopback')} listener=${n(heard, 'start')}`);
            }
          }
          process.exit(0);
          R4EOF
          cat >"$T/mutate.mjs" <<'R4EOF'
          import fs from 'node:fs';
          import path from 'node:path';

          const [list, id, crate] = process.argv.slice(2);
          const copy = JSON.parse(fs.readFileSync(list, 'utf8')).find((c) => c.id === id);
          const file = path.join(crate, copy.file);
          const text = fs.readFileSync(file, 'utf8').replace(/\r\n/g, '\n');
          const found = text.split(copy.find).length - 1;
          if (found !== 1) {
            console.log(`copy=${id} apply=fail found=${found}`);
            process.exit(1);
          }
          fs.writeFileSync(file, text.replace(copy.find, copy.replace));
          console.log(`copy=${id} apply=ok arm=${copy.arm} key=${copy.key}`);
          R4EOF
          cat >"$T/copies.json" <<'R4EOF'
          [
           {
            "id": "M01",
            "arm": "main",
            "key": "show",
            "what": "show answers ok show_ms=1 and does nothing",
            "file": "src/app.rs",
            "find": "            Line::Show => self.show(),",
            "replace": "            Line::Show => Answer::Shown { show_ms: 1 },"
           },
           {
            "id": "M02",
            "arm": "main",
            "key": "hide",
            "what": "hide destroys the window",
            "file": "src/app.rs",
            "find": "        let _ = window.hide();\n        if waits::until(",
            "replace": "        let _ = window.destroy();\n        if waits::until("
           },
           {
            "id": "M06",
            "arm": "main",
            "key": "counts",
            "what": "sample returns constant counts",
            "file": "src/app.rs",
            "find": "            ticks: counts.map(|c| c.0),\n            frames: counts.map(|c| c.1),",
            "replace": "            ticks: Some(1).or(counts.map(|c| c.0)),\n            frames: Some(5).or(counts.map(|c| c.1)),"
           },
           {
            "id": "M07",
            "arm": "main",
            "key": "pid",
            "what": "sample gives a pid that is not the app's",
            "file": "src/app.rs",
            "find": "        let pid = std::process::id();",
            "replace": "        let pid = std::process::id() + 1;"
           },
           {
            "id": "M08",
            "arm": "b",
            "key": "destroy",
            "what": "destroy hides the window and keeps it",
            "file": "src/app.rs",
            "find": "        self.frames.cancel();\n        let _ = window.destroy();",
            "replace": "        self.frames.cancel();\n        let _ = window.hide();"
           },
           {
            "id": "M09",
            "arm": "b",
            "key": "-",
            "what": "a close request is prevented in every arm (arm b keeps its window on close)",
            "file": "src/app.rs",
            "find": "WindowEvent::CloseRequested { api, .. } if self.options.arm != Arm::B =>",
            "replace": "WindowEvent::CloseRequested { api, .. } if self.options.arm == self.options.arm =>"
           },
           {
            "id": "M10",
            "arm": "a2",
            "key": "sync_events",
            "what": "the way events never emits",
            "file": "src/app.rs",
            "find": "                let _ = self.app.emit(CHANGE_EVENT, change);",
            "replace": "                let _ = (CHANGE_EVENT, change, &self.app);"
           },
           {
            "id": "M11",
            "arm": "a2",
            "key": "sync_channel",
            "what": "the way channel never sends",
            "file": "src/app.rs",
            "find": "                    let _ = channel.send(change);",
            "replace": "                    let _ = (channel, change);"
           },
           {
            "id": "M13",
            "arm": "main",
            "key": "quit",
            "what": "quit answers ok and does not exit",
            "file": "src/app.rs",
            "find": "        self.app.exit(0);",
            "replace": "        let _ = &self.app;"
           },
           {
            "id": "M14",
            "arm": "b",
            "key": "destroy",
            "what": "run without prevent_exit, so arm b ends at its destroy",
            "file": "src/lib.rs",
            "find": "            api.prevent_exit();",
            "replace": "            let _ = api;"
           },
           {
            "id": "M15",
            "arm": "a2",
            "key": "-",
            "what": "a2 without backgroundThrottling(Suspend) on macOS",
            "file": "src/app.rs",
            "find": "            builder.background_throttling(tauri::utils::config::BackgroundThrottlingPolicy::Suspend)",
            "replace": "            builder"
           },
           {
            "id": "M16",
            "arm": "a",
            "key": "counts",
            "what": "arms a and a2 never tell the page of the hide",
            "file": "src/app.rs",
            "find": "            Self::eval(&window, \"window.__r4Window && window.__r4Window('hide')\");",
            "replace": "            let _ = &window;"
           },
           {
            "id": "M21",
            "arm": "a2",
            "key": "sync_get",
            "what": "hide does not close the way get",
            "file": "src/app.rs",
            "find": "        self.hub.hide();\n        self.hub.close();\n        if matches!",
            "replace": "        self.hub.hide();\n        if matches!",
            "repeat": 3
           },
           {
            "id": "M22",
            "arm": "main",
            "key": "show",
            "what": "show answers before the page's frame",
            "file": "src/app.rs",
            "find": "        let waited = self.frames.wait(token, SHOW_BOUND);",
            "replace": "        let waited = waits::Waited::Reported(());"
           }
          ]
          R4EOF
          P="$T/fetch-pages"
          mkdir -p "$P"
          cp "$app"/pages/* "$P/"
          cat >"$P/fetch.js" <<'R4EOF'
          (function () {
            'use strict';
            var app = window.r4app;
            fetch('https://example.com/', { mode: 'no-cors' }).then(function (response) {
              app.report('fetch reached=yes type=' + response.type);
            }, function (error) {
              app.report('fetch reached=no error=' + error.name);
            }).then(function () {
              setTimeout(function () {
                app.report('fetch nav_stayed=yes');
              }, 3000);
              location.href = 'https://example.com/';
            });
          })();
          R4EOF
          node -e 'const fs = require("fs"); const [from, to] = process.argv.slice(1); const tag = "<script src=\"page.js\"></script>"; fs.writeFileSync(to, fs.readFileSync(from, "utf8").replace(tag, tag + "\n<script src=\"fetch.js\"></script>"))' "$app/pages/index.html" "$P/fetch.html"
          echo "trial os=$RUNNER_OS fetch_page_scripts=$(grep -c '<script' "$P/fetch.html")"

          started=$(date +%s)
          cargo build --release --locked --manifest-path "$app/Cargo.toml"
          code=$?
          echo "trial build=$([ "$code" = 0 ] && echo ok || echo fail) exit=$code seconds=$(($(date +%s) - started))"
          if [ "$code" != 0 ]; then exit 1; fi
          echo "trial binary_bytes=$(wc -c <"$bin" | tr -d ' ')"

          started=$(date +%s)
          (cd "$app" && cargo test --locked --no-fail-fast) >"$T/cargo-test.out" 2>&1
          code=$?
          grep -E '^test result:|^test .* FAILED$' "$T/cargo-test.out" | tr -d '\r' | sed 's/^/trial cargo_test /'
          echo "trial cargo_test exit=$code seconds=$(($(date +%s) - started))"
          (cd "$app" && node --test tests/) >"$T/node-test.out" 2>&1
          code=$?
          tr -d '\r' <"$T/node-test.out" | grep -E '^. (tests|pass|fail) [0-9]+$|^not ok' | sed 's/^/trial node_test /'
          echo "trial node_test exit=$code"

          started=$(date +%s)
          node "$app/selfcheck.mjs" --trace
          code=$?
          echo "trial selfcheck exit=$code seconds=$(($(date +%s) - started))"

          node "$T/probe.mjs" fetch "$app" "$bin" "$P"
          echo "trial probe_fetch exit=$?"
          node "$T/probe.mjs" net "$app" "$bin" "$P"
          echo "trial probe_net exit=$?"

          for id in $(node -e 'for (const c of JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))) console.log(c.id)' "$T/copies.json"); do
            dir="$T/copy-$id"
            mkdir -p "$dir"
            udir=$dir
            if [ "$RUNNER_OS" = Windows ]; then udir=$(cygpath -u "$dir"); fi
            git -C "$GITHUB_WORKSPACE" archive HEAD tools/r4-trials/app src-tauri/icons | tar -x -C "$udir"
            crate="$dir/tools/r4-trials/app"
            applied=$(node "$T/mutate.mjs" "$T/copies.json" "$id" "$crate")
            echo "$applied"
            case "$applied" in *apply=ok*) ;; *) continue ;; esac
            arm=$(printf '%s\n' "$applied" | sed -n 's/.* arm=\([a-z0-9]*\) .*/\1/p')
            started=$(date +%s)
            cargo build --release --locked --manifest-path "$crate/Cargo.toml" >"$T/copy-$id-build.out" 2>&1
            code=$?
            echo "copy=$id build=$([ "$code" = 0 ] && echo ok || echo fail) seconds=$(($(date +%s) - started))"
            if [ "$code" != 0 ]; then tr -d '\r' <"$T/copy-$id-build.out" | grep -E '^error' | head -n 5 | cut -c1-160; continue; fi
            reps=$(node -e 'const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).find((c) => c.id === process.argv[2]); console.log(c.repeat || 1)' "$T/copies.json" "$id")
            for rep in $(seq 1 "$reps"); do
              node "$app/selfcheck.mjs" --bin "$bin" --arm "$arm" --trace >"$T/copy-$id-$rep.out" 2>&1
              code=$?
              sed "s/^/copy=$id rep=$rep /" "$T/copy-$id-$rep.out"
              line=$(grep '^selfcheck ' "$T/copy-$id-$rep.out")
              missed=$(printf '%s\n' "$line" | tr ' ' '\n' | sed -n 's/=miss$//p' | tr '\n' ',' | sed 's/,$//')
              echo "copy=$id rep=$rep selfcheck_exit=$code missed=${missed:--}"
            done
          done
          echo "trial end"
