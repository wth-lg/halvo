name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 30-core-boundary-proofs 50-windows-functional
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 30-core-boundary-proofs 50-windows-functional
      - name: "Loop (win-detector-clock, the named test 200 times, the six other changed tests 20 times, by exact name)"
        if: ${{ !cancelled() }}
        shell: python
        env:
          WDC_PART: loop
        run: |
          """win-detector-clock (builder-134): the forced form, the changed copies and the loop of the detector's tests.

          On this Mac:  python3 -I wdc.py check <clone> <out dir> [id ...]
              applies each change (with its forced form where it runs under one) to the clone's file, type-checks the Windows
              target's lib with its tests (cargo check, the run's stub C compiler), writes <out dir>/<id>.log and one row of
              <out dir>/check.tsv, and restores the file with git checkout. No test runs here.
          On the hosted windows job: python wdc.py, with WDC_PART=loop, forced or changes in the environment, at the repo root.
              loop     the head's test binary: the named test 200 times, the six other changed tests 20 times each.
              forced   the base's file (fetched by its id) plain, then under the forced form, then the head's under the same form;
                       the seven tests by exact name in each; failing_first line 1 is the base red with the hosted line at the
                       named test and the head green.
              changes  every changed copy over the lines of this unit, built and run against the seven tests.
          Each part restores the file with git checkout and prints counts, verdicts and libtest's own lines only."""
          import json, os, re, subprocess, sys, time

          BASE = "ce6585fc35758cbf4d55194b99e20090449c0d00"
          PATH = "crates/halvo-capture/src/windows/secure_input.rs"
          MOD = "secure_input::windows::detector::tests::"
          TESTS = [
              ("T0", "a_desktop_hook_that_cannot_be_set_refuses_the_attach_and_removes_the_focus_handler"),
              ("T1", "after_attach_the_first_mark_is_the_start_and_attach_returns_after_the_detectors_own_read"),
              ("T2", "detach_ends_the_detectors_thread_and_a_new_attach_starts_one"),
              ("T3", "detach_answers_the_first_of_its_removal_calls_that_failed"),
              ("T4", "an_attach_after_a_timed_out_detach_is_refused_while_the_old_detector_runs"),
              ("T5", "detach_answers_timeout_when_the_detector_does_not_end_in_time"),
              ("T6", "an_attach_whose_first_read_does_not_answer_times_out_and_stops_that_detector"),
          ]
          HOSTED_WORDS = "left: Err(Timeout { stage: \"wait for the password detector's first read\", ms: 1000 })"
          HOSTED_PLACE = "secure_input.rs:2439:13"
          TEST_LIMIT_S = 90

          SLEEP = "std::thread::sleep(std::time::Duration::from_millis(1_500));"
          FORCED = [
              ("FS", "the detector's start is slow: 1,500 ms after its COM join, before UI Automation and the hook (run)",
               "        let _com = Com;\n        let (reader, handler) = match start(shared, wake) {",
               "        let _com = Com; " + SLEEP + "\n        let (reader, handler) = match start(shared, wake) {"),
              ("FE", "the detector's end is slow: 1,500 ms after its loop, before its removals (run)",
               "        DESKTOP_GATE.with(|cell| *cell.borrow_mut() = None);\n        let mut removed = Ok(());",
               "        " + SLEEP + " DESKTOP_GATE.with(|cell| *cell.borrow_mut() = None);\n        let mut removed = Ok(());"),
          ]

          DEFAULT_LINE = "                attach_deadline: None,\n"
          ATTACH_SEAM = "            let deadline = self.removals.attach_deadline.unwrap_or(deadline);\n            match started.recv_timeout(deadline) {"
          STALE_SEAM = "            let deadline = self.removals.attach_deadline.unwrap_or(deadline);\n            let began = std::time::Instant::now();"
          STOP = "crate::windows::INPUT_STOP_DEADLINE"

          # id, form (plain or forced), the rule, old text (exactly once in the head's file), new text, what I expect
          CHANGES = [
              ("m01", "forced", "attach takes the product's deadline, not the one handed in",
               ATTACH_SEAM, ATTACH_SEAM.replace("unwrap_or(deadline)", "map_or(deadline, |_| deadline)"), "red"),
              ("m02", "forced", "the wait for an earlier detector takes the product's deadline, not the one handed in",
               STALE_SEAM, STALE_SEAM.replace("unwrap_or(deadline)", "map_or(deadline, |_| deadline)"), "red"),
              ("m03", "plain", "the default hands attach an untimed wait",
               DEFAULT_LINE, "                attach_deadline: Some(std::time::Duration::MAX),\n", "hang"),
              ("m04", "plain", "the default hands attach a wait of 1 ms",
               DEFAULT_LINE, "                attach_deadline: Some(std::time::Duration::from_millis(1)),\n", "red"),
              ("m05", "forced", "attach's line of the seam is gone",
               "            #[cfg(test)]\n" + ATTACH_SEAM, "            match started.recv_timeout(deadline) {", "red"),
              ("m06", "forced", "the line of the seam in the wait for an earlier detector is gone",
               "            #[cfg(test)]\n" + STALE_SEAM, "            let began = std::time::Instant::now();", "red"),
              ("m07", "forced", "UNTIMED is the product's 1,000 ms",
               "        const UNTIMED: Duration = Duration::MAX;", "        const UNTIMED: Duration = Duration::from_millis(1_000);", "red"),
              ("m08", "forced", "untimed() hands attach no deadline",
               "                attach_deadline: Some(UNTIMED),\n                ..Removals::default()",
               "                attach_deadline: None,\n                ..Removals::default()", "red"),
              ("m09", "plain", "until waits while the fact holds, not until it holds",
               "            while !fact() {", "            while fact() {", "red"),
              ("m10", "plain", "until looks at the fact once and does not wait",
               "            while !fact() {", "            if !fact() {", "red"),
              ("m11", "forced", "T1 builds its gate with PasswordGate::new()",
               "own_read(\n        ) {\n            let _serial = crate::windows::tests::serial();\n            let gate = PasswordGate::with_removals(untimed());",
               "own_read(\n        ) {\n            let _serial = crate::windows::tests::serial();\n            let gate = PasswordGate::new();", "red"),
              ("m12", "forced", "T1 detaches with the 1,000 ms deadline",
               "            let detached = gate.detach(UNTIMED);\n            assert_eq!(first, Some(Mark::Started));",
               "            let detached = gate.detach(" + STOP + ");\n            assert_eq!(first, Some(Mark::Started));", "red"),
              ("m13", "forced", "T2 builds its gate with PasswordGate::new()",
               "starts_one() {\n            let _serial = crate::windows::tests::serial();\n            let gate = PasswordGate::with_removals(untimed());",
               "starts_one() {\n            let _serial = crate::windows::tests::serial();\n            let gate = PasswordGate::new();", "red"),
              ("m14", "forced", "T2's first detach has the 1,000 ms deadline",
               "            let first = gate.detach(UNTIMED);", "            let first = gate.detach(" + STOP + ");", "red"),
              ("m15", "forced", "T2's second detach has the 1,000 ms deadline",
               "            let second = gate.detach(UNTIMED);", "            let second = gate.detach(" + STOP + ");", "red"),
              ("m16", "forced", "T3's first gate takes the default deadline",
               "                desktop_hook: desktop_refused,\n                ..untimed()\n            });\n            both.attach()",
               "                desktop_hook: desktop_refused,\n                ..Removals::default()\n            });\n            both.attach()", "red"),
              ("m17", "forced", "T3's first detach has the 1,000 ms deadline",
               "            let both = both.detach(UNTIMED);", "            let both = both.detach(" + STOP + ");", "red"),
              ("m18", "forced", "T3's second gate takes the default deadline",
               "                desktop_hook: desktop_refused,\n                ..untimed()\n            });\n            hook.attach()",
               "                desktop_hook: desktop_refused,\n                ..Removals::default()\n            });\n            hook.attach()", "red"),
              ("m19", "forced", "T3's second detach has the 1,000 ms deadline",
               "            let hook = hook.detach(UNTIMED);", "            let hook = hook.detach(" + STOP + ");", "red"),
              ("m20", "plain", "the held read is not reported",
               "                READ_HELD.store(true, std::sync::atomic::Ordering::SeqCst);\n", "", "hang"),
              ("m21", "plain", "T4 does not wait for the held read",
               "            until(|| READ_HELD.load(Ordering::SeqCst));\n", "", "red"),
              ("m22", "plain", "T4's second attach keeps the untimed wait",
               "            gate.removals.attach_deadline = None;\n", "", "hang"),
              ("m23", "forced", "T4's third attach gets no untimed wait",
               "            gate.removals.attach_deadline = Some(UNTIMED);\n            HOLD_READS.store(false",
               "            HOLD_READS.store(false", "red"),
              ("m24", "forced", "T4's last detach has the 1,000 ms deadline",
               "            let detached = gate.detach(UNTIMED);\n            assert!(\n                matches!(stopped,",
               "            let detached = gate.detach(" + STOP + ");\n            assert!(\n                matches!(stopped,", "red"),
              ("m25", "forced", "T4's gate takes the default deadline",
               "                before_read: read_held,\n                ..untimed()", "                before_read: read_held,\n                ..Removals::default()", "red"),
              ("m26", "plain", "T4 starts with the held read already reported",
               "            READ_HELD.store(false, Ordering::SeqCst);", "            READ_HELD.store(true, Ordering::SeqCst);", "red"),
              ("m27", "plain", "the held removal holds for one turn only",
               "            while HOLD_REMOVAL.load(std::sync::atomic::Ordering::SeqCst) {",
               "            if HOLD_REMOVAL.load(std::sync::atomic::Ordering::SeqCst) {", "red"),
              ("m28", "plain", "T5 sets no hold on the removal",
               "            HOLD_REMOVAL.store(true, Ordering::SeqCst);\n", "", "red"),
              ("m29", "plain", "T5 never lets the removal go",
               "            HOLD_REMOVAL.store(false, Ordering::SeqCst);\n", "", "hang"),
              ("m30", "plain", "T5 does not wait for the old detector's end",
               "            if let Some(stale) = stale {\n                let _ = stale.join();\n            }", "            drop(stale);", "green"),
              ("m31", "forced", "T5's gate takes the default deadline",
               "                handler: handler_held,\n                ..untimed()", "                handler: handler_held,\n                ..Removals::default()", "red"),
              ("m32", "forced", "T0's control gate takes the default deadline",
               "                handler: handler_counted,\n                ..untimed()\n            });\n            let control_attached",
               "                handler: handler_counted,\n                ..Removals::default()\n            });\n            let control_attached", "red"),
              ("m33", "forced", "T0's control detaches with the 1,000 ms deadline",
               "            let control_detached = control.detach(UNTIMED);", "            let control_detached = control.detach(" + STOP + ");", "red"),
              ("m34", "forced", "T0's refused gate takes the default deadline",
               "                set_desktop_hook: no_desktop_hook,\n                ..untimed()",
               "                set_desktop_hook: no_desktop_hook,\n                ..Removals::default()", "red"),
              ("m35", "forced", "T6's third attach gets no untimed wait",
               "            gate.removals.attach_deadline = Some(UNTIMED);\n            HOLD_FIRST_READ.store(false",
               "            HOLD_FIRST_READ.store(false", "red"),
              ("m36", "forced", "T6's detach has the 1,000 ms deadline",
               "            let detached = gate.detach(UNTIMED);\n            assert_eq!(\n                first,",
               "            let detached = gate.detach(" + STOP + ");\n            assert_eq!(\n                first,", "red"),
          ]


          def out(line):
              sys.stdout.write(line + "\n")
              sys.stdout.flush()


          def apply(text, old, new, what):
              n = text.count(old)
              if n != 1:
                  raise SystemExit("WDC %s: its old text is found %d times, not once" % (what, n))
              return text.replace(old, new, 1)


          def read(path):
              with open(path, "rb") as f:
                  data = f.read()
              return data.decode("utf-8").replace("\r\n", "\n"), b"\r\n" in data


          def write(path, text, crlf):
              data = text.replace("\r\n", "\n")
              if crlf:
                  data = data.replace("\n", "\r\n")
              with open(path, "wb") as f:
                  f.write(data.encode("utf-8"))


          def forced(text):
              for fid, _, old, new in FORCED:
                  text = apply(text, old, new, fid)
              return text


          def changed(text, cid):
              for c in CHANGES:
                  if c[0] == cid:
                      if c[1] == "forced":
                          text = forced(text)
                      return apply(text, c[3], c[4], cid)
              raise SystemExit("WDC no change " + cid)


          def restore(root):
              subprocess.run(["git", "checkout", "--", PATH], cwd=root, check=True)


          def check(clone, outdir, ids):
              os.makedirs(outdir, exist_ok=True)
              env = dict(os.environ)
              env["PATH"] = os.path.expanduser("~/.cargo/bin") + os.pathsep + env.get("PATH", "")
              env["TMPDIR"] = "/private/tmp/r1-builder-134-scratch/tmp"
              env["CARGO_BUILD_JOBS"] = "4"
              env["CARGO_TARGET_DIR"] = "/private/tmp/r1-builder-134-scratch/target"
              stub = os.path.expanduser("~/.wstack/runs/20261108-halvo-r1-capture/bin/static-analyzer/stub-cc.sh")
              env["CC_x86_64_pc_windows_msvc"] = stub
              env["AR_x86_64_pc_windows_msvc"] = stub
              file = os.path.join(clone, PATH)
              head, crlf = read(file)
              base = subprocess.run(["git", "show", BASE + ":" + PATH], cwd=clone, capture_output=True, check=True).stdout.decode("utf-8")
              plan = [("head", head), ("head-forced", forced(head)), ("base-forced", forced(base))]
              plan += [(c[0], changed(head, c[0])) for c in CHANGES]
              if ids:
                  plan = [p for p in plan if p[0] in ids]
              rows = open(os.path.join(outdir, "check.tsv"), "a")
              try:
                  for pid, text in plan:
                      write(file, text, crlf)
                      start = time.time()
                      r = subprocess.run(["cargo", "check", "--locked", "--target", "x86_64-pc-windows-msvc", "-p", "halvo-capture",
                                          "--lib", "--tests"], cwd=clone, env=env, capture_output=True)
                      log = r.stdout.decode("utf-8", "replace") + r.stderr.decode("utf-8", "replace")
                      with open(os.path.join(outdir, pid + ".log"), "w") as f:
                          f.write(log + "\ncheck_exit=%d\n" % r.returncode)
                      errors = [l for l in log.splitlines() if l.startswith("error") or l.startswith("warning: unused")]
                      checked = "Checking halvo-capture" in log
                      row = "%s\t%d\t%s\t%d\t%s" % (pid, r.returncode, "checked" if checked else "NOT-REBUILT", round(time.time() - start),
                                                    errors[0][:160] if errors else "-")
                      rows.write(row + "\n")
                      rows.flush()
                      out(row)
                      restore(clone)
              finally:
                  restore(clone)
                  rows.close()


          def build(root):
              r = subprocess.run(["cargo", "test", "--locked", "-p", "halvo-capture", "--lib", "--no-run", "--message-format", "json"],
                                 cwd=root, capture_output=True)
              exe = None
              for line in r.stdout.decode("utf-8", "replace").splitlines():
                  if not line.startswith("{"):
                      continue
                  m = json.loads(line)
                  if m.get("reason") == "compiler-artifact" and m.get("target", {}).get("name") == "halvo_capture" \
                          and "lib" in m.get("target", {}).get("kind", []) and m.get("profile", {}).get("test") and m.get("executable"):
                      exe = m["executable"]
              err = r.stderr.decode("utf-8", "replace")
              first = [l for l in err.splitlines() if l.startswith("error")]
              return r.returncode, exe, first[:3], "Compiling halvo-capture" in err


          def run_test(exe, name):
              start = time.time()
              try:
                  r = subprocess.run([exe, "--exact", MOD + name, "--test-threads=1"], capture_output=True, timeout=TEST_LIMIT_S,
                                     stdin=subprocess.DEVNULL)
              except subprocess.TimeoutExpired:
                  return "HANG", ["killed after %d s" % TEST_LIMIT_S], time.time() - start
              text = (r.stdout + r.stderr).decode("utf-8", "replace").replace("\r\n", "\n")
              lines = text.split("\n")
              if "test result: ok. 1 passed; 0 failed" in text:
                  return "ok", [l for l in lines if l.startswith("test result:")], time.time() - start
              keep = [l for l in lines if "panicked at" in l or l.startswith("  left:") or l.startswith(" right:")
                      or l.startswith("assertion") or l.startswith("test result:") or "running 0 tests" in l]
              return "RED", keep[:8], time.time() - start


          def seven(exe, label):
              verdicts = {}
              for tid, name in TESTS:
                  v, keep, secs = run_test(exe, name)
                  verdicts[tid] = (v, keep)
                  out("WDC %s %s %s %s %.2f s" % (label, tid, name, v, secs))
                  for l in keep:
                      out("WDC   | " + l)
              return verdicts


          def hosted(part):
              root = os.getcwd()
              file = os.path.join(root, PATH)
              head, crlf = read(file)
              ok = True
              try:
                  if part == "loop":
                      code, exe, first, _ = build(root)
                      if code != 0 or not exe:
                          out("WDC loop: the head's test build failed: exit %d %s" % (code, first))
                          return 1
                      for tid, name in TESTS:
                          runs = 200 if tid == "T0" else 20
                          passed, start, secs = 0, time.time(), []
                          for i in range(runs):
                              v, keep, s = run_test(exe, name)
                              secs.append(s)
                              if v == "ok":
                                  passed += 1
                              else:
                                  out("WDC loop round %d of %s: %s" % (i + 1, name, v))
                                  for l in keep:
                                      out("WDC   | " + l)
                          secs.sort()
                          out("loop win-detector-clock: %s: passed %d of %d in %d s (median %.2f s, longest %.2f s a run)"
                              % (name, passed, runs, round(time.time() - start), secs[len(secs) // 2], secs[-1]))
                          ok = ok and passed == runs
                      return 0 if ok else 1
                  if part == "forced":
                      have = subprocess.run(["git", "cat-file", "-e", BASE + "^{commit}"], cwd=root, capture_output=True).returncode == 0
                      if have:
                          out("WDC the base commit is in the checkout; no fetch")
                      else:
                          f = subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", BASE], cwd=root, capture_output=True)
                          out("WDC fetch of the base exited %d" % f.returncode)
                      base = subprocess.run(["git", "show", BASE + ":" + PATH], cwd=root, capture_output=True, check=True).stdout.decode("utf-8")
                      results = {}
                      for label, text in [("base-plain", base), ("base-forced", forced(base)), ("head-forced", forced(head))]:
                          write(file, text, crlf)
                          code, exe, first, compiled = build(root)
                          out("WDC %s build exit %d compiled=%s" % (label, code, compiled))
                          if code != 0 or not exe:
                              out("WDC %s: build failed %s" % (label, first))
                              return 1
                          results[label] = seven(exe, label)
                      t0 = results["base-forced"]["T0"]
                      base_red = t0[0] == "RED" and any(HOSTED_WORDS in l for l in t0[1]) and any(HOSTED_PLACE in l for l in t0[1])
                      head_green = all(v[0] == "ok" for v in results["head-forced"].values())
                      base_plain = all(v[0] == "ok" for v in results["base-plain"].values())
                      base_all_red = all(v[0] != "ok" for v in results["base-forced"].values())
                      out("WDC base plain all seven ok: %s" % base_plain)
                      out("WDC base forced, the named test red with the hosted line at %s: %s" % (HOSTED_PLACE, base_red))
                      out("WDC base forced, every one of the seven not ok: %s" % base_all_red)
                      out("WDC head forced, all seven ok: %s" % head_green)
                      out("WDC failing_first line 1: %s" % ("PASS" if base_red and head_green else "FAIL"))
                      return 0 if base_red and head_green else 1
                  if part == "changes":
                      write(file, forced(head), crlf)
                      code, exe, first, compiled = build(root)
                      control = seven(exe, "control-head-forced") if code == 0 and exe else {}
                      if not control or not all(v[0] == "ok" for v in control.values()):
                          out("WDC the control (the head under the forced form) is not green; the changes are not judged")
                          return 1
                      counts = {"red": 0, "hang": 0, "does-not-compile": 0, "green": 0}
                      for c in CHANGES:
                          write(file, changed(head, c[0]), crlf)
                          code, exe, first, compiled = build(root)
                          if code != 0 or not exe:
                              out("WDC change %s form=%s expect=%s result=does-not-compile :: %s" % (c[0], c[1], c[5], c[2]))
                              for l in first:
                                  out("WDC   | " + l)
                              counts["does-not-compile"] += 1
                              continue
                          v = seven(exe, c[0])
                          hangs = [t for t in v if v[t][0] == "HANG"]
                          reds = [t for t in v if v[t][0] == "RED"]
                          result = "hang" if hangs and not reds else ("red" if reds else "green")
                          counts[result] += 1
                          out("WDC change %s form=%s expect=%s result=%s compiled=%s red=%s hang=%s :: %s" % (
                              c[0], c[1], c[5], result, compiled, ",".join(reds) or "-", ",".join(hangs) or "-", c[2]))
                      out("WDC changes: %d; red %d, hang %d, does-not-compile %d, green %d" % (
                          len(CHANGES), counts["red"], counts["hang"], counts["does-not-compile"], counts["green"]))
                      return 0
                  out("WDC unknown part " + part)
                  return 2
              finally:
                  restore(root)


          if __name__ == "__main__":
              try:
                  sys.stdout.reconfigure(errors="backslashreplace")
              except AttributeError:
                  pass
              if len(sys.argv) > 1 and sys.argv[1] == "check":
                  check(sys.argv[2], sys.argv[3], sys.argv[4:])
              else:
                  sys.exit(hosted(os.environ.get("WDC_PART", "")))
      - name: "win-detector-clock failing_first line 1 (the base plain, the base and the head under the forced form)"
        if: ${{ !cancelled() }}
        shell: python
        env:
