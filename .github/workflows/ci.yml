name: ci

on:
  push:
    branches-ignore: ['land-*', 'land-*/**']
    tags: ['**']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust-cold
          save-if: false
      - name: Long forms build
        shell: bash
        run: cargo test --locked -p halvo-capture --lib --test windows_functional --no-run
      - name: Reuse probe of check 50's two builds (scratch, never merged)
        shell: bash
        run: |
          set +e
          cargo test --locked -p halvo-capture --lib --no-run --message-format json >"$RUNNER_TEMP/probe-lib.json"
          lib=$?
          cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/probe-wf.json"
          wf=$?
          for f in lib wf; do
            fresh=$(grep -c '"reason":"compiler-artifact".*"fresh":true' "$RUNNER_TEMP/probe-$f.json")
            stale=$(grep -c '"reason":"compiler-artifact".*"fresh":false' "$RUNNER_TEMP/probe-$f.json")
            printf 'reuse probe %s: artifacts fresh=%s not_fresh=%s\n' "$f" "$fresh" "$stale"
          done
          printf 'reuse probe exits: lib=%s wf=%s\n' "$lib" "$wf"
          [ "$lib" -eq 0 ] && [ "$wf" -eq 0 ]
      - name: Long forms
        shell: bash
        env:
          HALVO_WF_FORM: long
          CI_D_SCRIPT_LIMIT_S: 3600
        run: sh scripts/ci/run-ci-d.sh windows 50-windows-functional
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
