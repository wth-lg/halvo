          # whole own_self_test, kept as own_self_test_whole. Nothing outside own_self_test changes. Prints what it kept.
          src, dst = sys.argv[1], sys.argv[2]
          wanted = sys.argv[3:]
          if not wanted:
              sys.exit('no case names')
