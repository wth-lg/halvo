name: ci
# scratch: both jobs whole with one loop step each; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - name: Self-tests that commit in throwaway repositories
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          sh scripts/check-commit-messages.sh --self-test-two-paths
          sh scripts/check-commit-messages.sh --self-test-pre-push
          sh scripts/ci-commit-messages.sh --self-test
          sh scripts/merge-pr.sh --self-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos
      - name: Loop of the new tests of halvo-sqlcipher (scratch)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          start=$(date +%s)
          out=$(cargo test --locked -p halvo-sqlcipher --lib --no-run 2>&1)
          bin=$(printf '%s\n' "$out" | tr -d '\r' | sed -n 's/.*Executable unittests src.lib\.rs (\(.*\))$/\1/p' | head -n 1 | tr '\134' '/')
          if [ -z "$bin" ]; then
            printf '%s\n' "$out"
            exit 1
          fi
          printf 'LOOP build of the test binary: seconds %s\n' "$(($(date +%s) - start))"
          status=0
          for spec in 'page_gap::a_removed_or_replaced_row_leaves_no_text_in_a_page_built_again_or_edited_in_place 20' 'page_gap::under_a_key_every_row_of_each_seed_reads_back_and_the_integrity_check_holds 20' 'page_gap::second_place::small_rows_deleted_one_at_a_time_leave_no_text_in_a_page_edited_in_place 20' 'page_gap::with_secure_delete_off_the_search_finds_a_removed_row_of_each_seed 20' 'page_gap::pins::a_new_database_of_this_build_reads_auto_vacuum_0_after_its_first_table 200' 'page_gap::rewrites::rows_copied_by_insert_select_leave_no_text_after_their_removal 200' 'page_gap::rewrites::rows_removed_before_a_vacuum_and_after_it_leave_no_text 200' 'page_gap::rewrites::zero_blobs_and_same_length_replacements_leave_no_text 200' 'page_gap::rewrites::with_secure_delete_off_the_search_finds_a_removed_copied_row 200' 'page_gap::rewrites::with_secure_delete_off_the_search_finds_a_row_removed_around_a_vacuum 200' 'page_gap::rewrites::with_secure_delete_off_the_search_finds_a_removed_row_beside_zero_blobs 200' 'page_gap::layout::a_record_at_the_largest_local_payload_and_one_byte_above_passes_the_check 200' 'page_gap::layout::cells_of_three_bytes_in_a_one_column_table_without_rowid_pass_the_check 200' 'page_gap::layout::the_structural_check_sees_a_byte_planted_in_each_place_that_it_reads 200' 'page_gap::layout::the_structural_check_sees_four_bytes_of_text_planted_in_a_gap 200' 'page_gap::layout::the_structural_check_sees_what_a_delete_leaves_with_secure_delete_off 200' 'page_gap::second_place::a_table_of_the_fts5_form_with_its_secure_delete_leaves_no_removed_token 200' 'page_gap::second_place::rows_that_analyze_or_optimize_read_leave_no_text_after_their_removal 200' 'page_gap::table::every_byte_write_of_the_page_code_has_a_row_in_the_table_of_adr_0013 200'; do
            name=${spec% *}
            runs=${spec##* }
            passes=0
            slowest=0
            i=0
            begun=$(date +%s)
            while [ "$i" -lt "$runs" ]; do
              i=$((i + 1))
              t0=$(date +%s)
              if "$bin" --exact "$name" 2>&1 | tr -d '\r' | grep -q '^test result: ok\. 1 passed; 0 failed'; then
                passes=$((passes + 1))
              fi
              t=$(($(date +%s) - t0))
              if [ "$t" -gt "$slowest" ]; then slowest=$t; fi
            done
            printf 'LOOP %s runs %s passes %s seconds %s slowest %s\n' "$name" "$runs" "$passes" "$(($(date +%s) - begun))" "$slowest"
            if [ "$passes" -ne "$runs" ]; then status=1; fi
          done
          left=$(find target/tmp -maxdepth 1 -name 'halvo-sqlcipher-page-gap-*' 2>/dev/null | wc -l | tr -d ' ')
          printf 'LOOP entries left under target/tmp named halvo-sqlcipher-page-gap-: %s\n' "$left"
          if [ "$left" -ne 0 ]; then status=1; fi
          exit "$status"
      - name: Build
        shell: bash
        run: npm run tauri build
      - name: Version
        shell: bash
        run: test "$(target/release/bundle/macos/Halvo.app/Contents/MacOS/halvo --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-macos
          path: target/release/bundle/macos/Halvo.app
          if-no-files-found: error
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows
      - name: Loop of the new tests of halvo-sqlcipher (scratch)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          start=$(date +%s)
          out=$(cargo test --locked -p halvo-sqlcipher --lib --no-run 2>&1)
          bin=$(printf '%s\n' "$out" | tr -d '\r' | sed -n 's/.*Executable unittests src.lib\.rs (\(.*\))$/\1/p' | head -n 1 | tr '\134' '/')
          if [ -z "$bin" ]; then
            printf '%s\n' "$out"
            exit 1
          fi
          printf 'LOOP build of the test binary: seconds %s\n' "$(($(date +%s) - start))"
          status=0
          for spec in 'page_gap::a_removed_or_replaced_row_leaves_no_text_in_a_page_built_again_or_edited_in_place 20' 'page_gap::under_a_key_every_row_of_each_seed_reads_back_and_the_integrity_check_holds 20' 'page_gap::second_place::small_rows_deleted_one_at_a_time_leave_no_text_in_a_page_edited_in_place 20' 'page_gap::with_secure_delete_off_the_search_finds_a_removed_row_of_each_seed 20' 'page_gap::pins::a_new_database_of_this_build_reads_auto_vacuum_0_after_its_first_table 200' 'page_gap::rewrites::rows_copied_by_insert_select_leave_no_text_after_their_removal 200' 'page_gap::rewrites::rows_removed_before_a_vacuum_and_after_it_leave_no_text 200' 'page_gap::rewrites::zero_blobs_and_same_length_replacements_leave_no_text 200' 'page_gap::rewrites::with_secure_delete_off_the_search_finds_a_removed_copied_row 200' 'page_gap::rewrites::with_secure_delete_off_the_search_finds_a_row_removed_around_a_vacuum 200' 'page_gap::rewrites::with_secure_delete_off_the_search_finds_a_removed_row_beside_zero_blobs 200' 'page_gap::layout::a_record_at_the_largest_local_payload_and_one_byte_above_passes_the_check 200' 'page_gap::layout::cells_of_three_bytes_in_a_one_column_table_without_rowid_pass_the_check 200' 'page_gap::layout::the_structural_check_sees_a_byte_planted_in_each_place_that_it_reads 200' 'page_gap::layout::the_structural_check_sees_four_bytes_of_text_planted_in_a_gap 200' 'page_gap::layout::the_structural_check_sees_what_a_delete_leaves_with_secure_delete_off 200' 'page_gap::second_place::a_table_of_the_fts5_form_with_its_secure_delete_leaves_no_removed_token 200' 'page_gap::second_place::rows_that_analyze_or_optimize_read_leave_no_text_after_their_removal 200' 'page_gap::table::every_byte_write_of_the_page_code_has_a_row_in_the_table_of_adr_0013 200'; do
            name=${spec% *}
            runs=${spec##* }
            passes=0
            slowest=0
            i=0
            begun=$(date +%s)
            while [ "$i" -lt "$runs" ]; do
              i=$((i + 1))
              t0=$(date +%s)
              if "$bin" --exact "$name" 2>&1 | tr -d '\r' | grep -q '^test result: ok\. 1 passed; 0 failed'; then
                passes=$((passes + 1))
              fi
              t=$(($(date +%s) - t0))
              if [ "$t" -gt "$slowest" ]; then slowest=$t; fi
            done
            printf 'LOOP %s runs %s passes %s seconds %s slowest %s\n' "$name" "$runs" "$passes" "$(($(date +%s) - begun))" "$slowest"
            if [ "$passes" -ne "$runs" ]; then status=1; fi
          done
          left=$(find target/tmp -maxdepth 1 -name 'halvo-sqlcipher-page-gap-*' 2>/dev/null | wc -l | tr -d ' ')
          printf 'LOOP entries left under target/tmp named halvo-sqlcipher-page-gap-: %s\n' "$left"
          if [ "$left" -ne 0 ]; then status=1; fi
          exit "$status"
      - name: Build
        shell: bash
        run: npm run tauri build -- --no-bundle
      - name: Version
        shell: bash
        run: test "$(target/release/halvo.exe --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-windows
          path: target/release/halvo.exe
          if-no-files-found: error
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
