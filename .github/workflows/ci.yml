name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 22-daemon-no-dead-allow 23-daemon-port-only 30-core-boundary-proofs 30-mutants 26-daemon-owner-growth
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 22-daemon-no-dead-allow 23-daemon-port-only 30-core-boundary-proofs 30-mutants 26-daemon-owner-growth
      - name: Loop of daemon-1c's tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          rounds=${LOOP_ROUNDS:-200}
          names="
          daemon::owner::tests::the_class_of_each_write_fault_counts_and_names_it
          daemon::owner::tests::three_due_tries_answered_1_set_the_batch_aside
          daemon::owner::tests::three_due_tries_answered_2_set_the_batch_aside
          daemon::owner::tests::three_due_tries_answered_12_set_the_batch_aside
          daemon::owner::tests::three_due_tries_answered_18_set_the_batch_aside
          daemon::owner::tests::three_due_tries_answered_19_set_the_batch_aside
          daemon::owner::tests::three_due_tries_answered_20_set_the_batch_aside
          daemon::owner::tests::three_due_tries_answered_21_set_the_batch_aside
          daemon::owner::tests::three_due_tries_answered_25_set_the_batch_aside
          daemon::owner::tests::three_due_tries_answered_19_20_and_19_set_the_batch_aside
          daemon::owner::tests::extended_codes_of_one_of_the_eight_are_read_as_that_code
          daemon::owner::tests::three_due_tries_answered_10_or_an_unknown_code_leave_the_batch_held
          daemon::owner::tests::early_tries_that_meet_one_of_the_eight_do_not_count
          daemon::owner::tests::an_early_try_outside_the_eight_ends_the_run_and_leaves_the_batch_held
          daemon::owner::tests::a_batch_that_the_second_try_stores_after_19_is_written_once
          daemon::owner::tests::a_batch_kept_and_answered_19_is_acknowledged_by_its_next_try
          daemon::owner::tests::a_batch_set_aside_leaves_nothing_of_it_in_the_store_or_in_memory
          daemon::owner::tests::three_set_asides_in_a_row_of_19_hold_the_next_batch_until_a_good_write
          daemon::owner::tests::three_set_asides_in_a_row_of_11_hold_the_next_batch_until_a_good_write
          daemon::owner::tests::a_good_write_between_set_asides_starts_the_count_again
          daemon::owner::tests::sealed_or_refused_batches_neither_count_toward_the_hold_nor_end_its_count
          daemon::owner::tests::a_new_owner_over_the_same_store_starts_the_count_of_set_asides_at_0
          daemon::owner::tests::a_batch_given_up_in_the_hold_ends_no_hold
          daemon::owner::tests::the_first_batch_that_the_store_takes_after_the_stop_ends_the_hold
          daemon::owner::tests::an_io_fault_in_the_hold_reports_io_since_the_stop
          daemon::owner::tests::the_drop_line_names_the_count_the_two_seconds_and_the_kind
          daemon::owner::tests::a_batch_set_aside_gives_its_drop_line
          daemon::stop_tests::a_refused_hold_with_a_failed_drain_gives_the_refusal_and_then_the_loss_line
          daemon::stop_tests::a_refused_hold_after_a_drop_that_a_good_write_followed_gives_the_loss_line
          daemon::stop_tests::a_timed_run_with_a_set_aside_batch_and_a_good_write_after_it_prints_the_loss_line_and_exits_0
          daemon::stop_tests::a_timed_run_that_ends_after_the_third_set_aside_names_db_in_its_loss_line
          daemon::stop_tests::a_timed_run_whose_final_flush_fails_with_19_names_db_in_its_loss_line
          daemon::tests::a_drop_with_no_write_since_gives_exit_1_and_one_that_a_good_write_followed_exit_0
          "
          want=$(printf '%s\n' $names | grep -c .)
          build=$(cargo test --locked -p halvo-capture --lib --no-run 2>&1)
          built=$?
          printf '%s\n' "$build" | tail -n 3
          bin=$(printf '%s\n' "$build" | sed -n 's/^ *Executable unittests src[\\/]lib\.rs (\(.*\))$/\1/p' | head -n 1 | tr '\\' '/')
          if [ "$built" -ne 0 ] || [ -z "$bin" ]; then
            echo "loop daemon-1c: the test binary of the lib was not built (cargo exit $built)"
            exit 1
          fi
          bin=$PWD/$bin
          cd crates/halvo-capture || exit 1
          passed=0
          started=$(date +%s)
          round=1
          while [ "$round" -le "$rounds" ]; do
            out=$("$bin" --exact $names 2>&1)
            if grep -q "^test result: ok\. $want passed; 0 failed; 0 ignored; 0 measured; [0-9][0-9]* filtered out" <<<"$out"; then
              passed=$((passed + 1))
            else
              printf 'round %s did not pass %s tests:\n' "$round" "$want"
              printf '%s\n' "$out" | grep -E '^(running |test .*FAILED|---- |thread |  left|  right|test result)' | head -n 40
            fi
            round=$((round + 1))
          done
          printf 'loop daemon-1c: passed %s of %s rounds of %s tests in %s s\n' "$passed" "$rounds" "$want" "$(( $(date +%s) - started ))"
          [ "$passed" -eq "$rounds" ]
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default -c core.fileMode=true "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
