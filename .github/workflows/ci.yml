name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional 53-windows-prints
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 50-windows-functional 53-windows-prints
      - name: win-4 part proofs and one-rule changes
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          W4_PARTS: ''
          W4_CHANGES: ''
        run: |
          set +e
          cat >"$RUNNER_TEMP/w4-proof.sh" <<'W4_EOF'
          #!/bin/bash
          # win-4's hosted proof step: each part's tests at its test-first commit and its fix commit, then the one-rule changes.
          # Reads two base64 lists from the environment: W4_PARTS (commit, part, kind, name) and W4_CHANGES (id, file, kind, name, statement).
          # Prints counts, exits and test names only. Never ends the job: every command's exit is read and printed.
          set +e
          cd "${GITHUB_WORKSPACE:-.}" || exit 0
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE:-$PWD}/target"
          export CARGO_BUILD_JOBS=4
          export RUST_TEST_THREADS=4
          cargo=${W4_CARGO:-cargo}
          head=$(git rev-parse HEAD~1)
          echo "w4 head=$head"
          if [ -z "${W4_DRY:-}" ]; then
            git fetch --quiet --deepen=80 origin "${GITHUB_REF:-HEAD}"
            echo "w4 deepen_exit=$?"
          fi
          proof="${RUNNER_TEMP:-/tmp}/w4-proof"
          git worktree add --quiet --detach "$proof" "$head"
          echo "w4 worktree_exit=$?"
          cd "$proof" || exit 0
          printf '%s' "$W4_PARTS" | base64 -d >"${RUNNER_TEMP:-/tmp}/w4-parts.tsv"
          printf '%s' "$W4_CHANGES" | base64 -d >"${RUNNER_TEMP:-/tmp}/w4-changes.tsv"

          run_lib() {
            out=$("$cargo" test --quiet -p halvo-capture --lib -- --exact "$1" 2>&1)
            e=$?
            printf '%s\n' "$out" | grep -E '^test |^test result|panicked at|KNOWN-DEFECT' | head -8
            return $e
          }

          run_tf() {
            out=$("$cargo" test --quiet -p halvo-capture --test windows_functional -- --exact "$1" --ignored --nocapture 2>&1)
            e=$?
            printf '%s\n' "$out" | grep -E '^test result|KNOWN-DEFECT|panicked at|^TF [a-z0-9-]+ (result|.*=)' | head -12
            return $e
          }

          while IFS="$(printf '\t')" read -r commit part kind name; do
            [ -n "$commit" ] || continue
            git checkout --quiet --detach "$commit"
            co=$?
            if [ "$kind" = lib ]; then
              run_lib "$name"
            else
              run_tf "$name"
            fi
            e=$?
            echo "w4 part=$part commit=$(printf '%.9s' "$commit") kind=$kind test=$name checkout_exit=$co test_exit=$e"
          done <"${RUNNER_TEMP:-/tmp}/w4-parts.tsv"

          git checkout --quiet --detach "$head"
          while IFS="$(printf '\t')" read -r id file kind name statement; do
            [ -n "$id" ] || continue
            perl -0777 -pi -e "$statement" "$file"
            if git diff --quiet -- "$file"; then
              echo "w4 change=$id apply_exit=1 build_exit=- test_exit=- reason_lines=0"
              continue
            fi
            if [ "$kind" = lib ]; then
              "$cargo" test --quiet -p halvo-capture --lib --no-run >/dev/null 2>&1
              b=$?
            else
              "$cargo" test --quiet -p halvo-capture --test windows_functional --no-run >/dev/null 2>&1
              b=$?
            fi
            t=-
            reasons=0
            if [ "$b" = 0 ]; then
              if [ "$kind" = lib ]; then
                lines=$(run_lib "$name")
              else
                lines=$(run_tf "$name")
              fi
              t=$?
              reasons=$(printf '%s\n' "$lines" | grep -c -E 'panicked at|KNOWN-DEFECT')
              printf '%s\n' "$lines" | grep -E '^test result|panicked at' | head -3 | sed "s/^/w4 change=$id /"
            fi
            echo "w4 change=$id apply_exit=0 build_exit=$b test_exit=$t reason_lines=$reasons"
            git checkout --quiet -- "$file"
          done <"${RUNNER_TEMP:-/tmp}/w4-changes.tsv"
          echo "w4 status_lines_after=$(git status --porcelain | wc -l | tr -d ' ')"
          exit 0
          W4_EOF
          bash "$RUNNER_TEMP/w4-proof.sh"
          exit 0
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" windows
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
