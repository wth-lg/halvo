name: ci
# scratch: land-43's rehearsal tree, the macos job alone, 60 minutes: 30-mutants, both rows by name, both rows apply-only; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: "30-mutants as the job runs it (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u
          cid=${HALVO_STEP_CID:-scripts/ci/run-ci-d.sh}
          out="${RUNNER_TEMP:-/tmp}/step1-30-mutants.out"
          t0=$(date +%s)
          GITHUB_EVENT_NAME=push GITHUB_REF=refs/heads/main sh "$cid" macos 30-mutants >"$out" 2>&1
          code=$?
          t1=$(date +%s)
          printf 'STEP1 run-ci-d.sh macos 30-mutants (GITHUB_REF=refs/heads/main for its budget phase) exit %s, step seconds %s\n' "$code" "$((t1 - t0))"
          grep -E '^(phase apply-only [0-9]+ s|phase budget [0-9]+ s|seconds 30-mutants [0-9]+)$' "$out" | sed 's/^/STEP1 /'
          grep -E 'mutation:(rebuilt-page-gap-not-zeroed|edited-page-gap-not-zeroed|os-entropy-hook-missing)|^row (rebuilt-page-gap-not-zeroed|edited-page-gap-not-zeroed|os-entropy-hook-missing) ' "$out" | cut -c1-300 | sed 's/^/STEP1 row: /'
          grep -E '^(PASS|FAIL) 30-mutants|^ci\.d macos:|^ran [0-9]+ of|^built [0-9]+ of' "$out" | cut -c1-300 | sed 's/^/STEP1 /'
          missing=0
          for want in '^phase apply-only [0-9]+ s$' '^phase budget [0-9]+ s$' '^seconds 30-mutants [0-9]+$'; do
            grep -qE "$want" "$out" || { printf 'STEP1 missing line: %s\n' "$want"; missing=1; }
          done
          exit "$missing"
      - name: "The row rebuilt-page-gap-not-zeroed by name (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u
          row=rebuilt-page-gap-not-zeroed
          runner=${HALVO_STEP_RUNNER:-scripts/r1-gate/mutation-test.sh}
          out="${RUNNER_TEMP:-/tmp}/step-row-$row.out"
          t0=$(date +%s)
          sh "$runner" --keep-scratch --only "$row" >"$out" 2>&1
          code=$?
          t1=$(date +%s)
          printf 'ROW %s runner exit %s, step seconds %s\n' "$row" "$code" "$((t1 - t0))"
          grep -E '^(PASS|FAIL|OPEN|NOT-RUN) |^mutation rows:|^scratch mutation: ' "$out" | cut -c1-300 | sed 's/^/ROW /'
          kept=$(sed -n 's/^scratch mutation: //p' "$out" | head -n 1)
          if [ -n "$kept" ] && [ -f "$kept/work/test.out" ]; then
            grep -E 'structural check|the removed|stands in|panicked' "$kept/work/test.out" | head -n 3 | cut -c1-300 | sed 's/^/ROW failure line: /'
          else
            printf 'ROW no test output kept (scratch %s)\n' "${kept:-not named}"
          fi
          missing=0
          grep -qE "^PASS mutation:$row \(test [^ ]+: the one test failed\)" "$out" || { printf 'ROW missing line: PASS mutation:%s (test ...: the one test failed)\n' "$row"; missing=1; }
          exit "$missing"
      - name: "The row edited-page-gap-not-zeroed by name (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u
          row=edited-page-gap-not-zeroed
          runner=${HALVO_STEP_RUNNER:-scripts/r1-gate/mutation-test.sh}
          out="${RUNNER_TEMP:-/tmp}/step-row-$row.out"
          t0=$(date +%s)
          sh "$runner" --keep-scratch --only "$row" >"$out" 2>&1
          code=$?
          t1=$(date +%s)
          printf 'ROW %s runner exit %s, step seconds %s\n' "$row" "$code" "$((t1 - t0))"
          grep -E '^(PASS|FAIL|OPEN|NOT-RUN) |^mutation rows:|^scratch mutation: ' "$out" | cut -c1-300 | sed 's/^/ROW /'
          kept=$(sed -n 's/^scratch mutation: //p' "$out" | head -n 1)
          if [ -n "$kept" ] && [ -f "$kept/work/test.out" ]; then
            grep -E 'structural check|the removed|stands in|panicked' "$kept/work/test.out" | head -n 3 | cut -c1-300 | sed 's/^/ROW failure line: /'
          else
            printf 'ROW no test output kept (scratch %s)\n' "${kept:-not named}"
          fi
          missing=0
          grep -qE "^PASS mutation:$row \(test [^ ]+: the one test failed\)" "$out" || { printf 'ROW missing line: PASS mutation:%s (test ...: the one test failed)\n' "$row"; missing=1; }
          exit "$missing"
      - name: "Both rows apply-only in one call (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e -u
          runner=${HALVO_STEP_RUNNER:-scripts/r1-gate/mutation-test.sh}
          out="${RUNNER_TEMP:-/tmp}/step4-apply-only.out"
          t0=$(date +%s)
          sh "$runner" --apply-only --budget 3000 --only rebuilt-page-gap-not-zeroed --only edited-page-gap-not-zeroed >"$out" 2>&1
          code=$?
          t1=$(date +%s)
          printf 'APPLY runner exit %s, step seconds %s\n' "$code" "$((t1 - t0))"
          grep -E '^(PASS|FAIL|NOT-RUN) |^seconds mutation:|^mutation rows:' "$out" | cut -c1-300 | sed 's/^/APPLY /'
          missing=0
          for row in rebuilt-page-gap-not-zeroed edited-page-gap-not-zeroed; do
            grep -qE "^PASS mutation:$row \(applies and builds\)" "$out" || { printf 'APPLY missing line: PASS mutation:%s (applies and builds)\n' "$row"; missing=1; }
            grep -qE "^seconds mutation:$row [0-9]+$" "$out" || { printf 'APPLY missing line: seconds mutation:%s\n' "$row"; missing=1; }
          done
          exit "$missing"
