          "adv policy keys of the engine: " + ((@('HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKCU:\SOFTWARE\Policies\Microsoft\Edge') | ForEach-Object { $_ + '=' + (Test-Path $_) }) -join '; ')
          PSEOF
          cat > "$RUNNER_TEMP/setup.ps1" <<'PSEOF'
          param([string]$handler, [string]$python)
          auditpol /set /subcategory:"{0CCE9226-69AE-11D9-BED3-505054503030}" /success:enable /failure:enable | Out-Null
          "adv audit policy: " + ((auditpol /get /subcategory:"{0CCE9226-69AE-11D9-BED3-505054503030}" | Select-Object -Last 2) -join ' ').Trim()
          New-NetFirewallRule -DisplayName halvoadv-in-udp -Direction Inbound -Action Allow -Protocol UDP -LocalPort 49300-49399 | Out-Null
          New-NetFirewallRule -DisplayName halvoadv-in-tcp -Direction Inbound -Action Allow -Protocol TCP -LocalPort 49300-49399 | Out-Null
          "adv inbound rules for the listeners: " + ((Get-NetFirewallRule -DisplayName 'halvoadv-in-*' | Measure-Object).Count)
          $base = 'HKCU:\Software\Classes\halvoadv'
