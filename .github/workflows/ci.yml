name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/r4-trials/app -> target
          save-if: false
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Verifier probes
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          app=tools/r4-trials/app
          started=$(date +%s)
          if ! cargo build --release --locked --manifest-path "$app/Cargo.toml"; then
            echo "probe build=fail"
            exit 1
          fi
          echo "probe build=ok seconds=$(( $(date +%s) - started ))"
          bin="$app/target/release/r4-trial-app"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          cat >"$RUNNER_TEMP/r4v-client.js" <<'EOF'
          const net = require("node:net");
          const [tag, port, limit, ...lines] = process.argv.slice(2);
          const socket = net.connect(Number(port), "127.0.0.1");
          let buffer = "";
          const answers = [];
          let waiter = null;
          socket.on("data", (chunk) => {
            buffer += chunk;
            let at;
            while ((at = buffer.indexOf("\n")) >= 0) {
              answers.push(buffer.slice(0, at).replace(/\r$/, ""));
              buffer = buffer.slice(at + 1);
              if (waiter) { const w = waiter; waiter = null; w(); }
            }
          });
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const answer = (ms) => new Promise((resolve) => {
            const t = setTimeout(() => { waiter = null; resolve("timeout"); }, ms);
            const take = () => { clearTimeout(t); resolve(answers.shift()); };
            if (answers.length) take(); else waiter = take;
          });
          socket.on("error", (e) => { console.log("probe client=" + tag + " socket_error=" + e.code); process.exit(1); });
          socket.on("connect", async () => {
            for (const item of lines) {
              if (item.startsWith("wait ")) { await sleep(Number(item.slice(5))); continue; }
              const t0 = Date.now();
              socket.write(item + "\n");
              const got = await answer(Number(limit));
              console.log("probe client=" + tag + " sent=" + item + " answer=" + got + " ms=" + (Date.now() - t0));
              if (got === "timeout") { socket.destroy(); process.exit(0); }
            }
            socket.end();
          });
          EOF
          helpers() {
            if [ "$RUNNER_OS" = Windows ]; then
              powershell -NoProfile -Command "@(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count" | tr -d '\r'
            else
              pgrep -f 'com.apple.WebKit' | wc -l | tr -d ' '
            fi
          }
          conns() {
            winpid=$1
            if [ "$RUNNER_OS" = Windows ]; then
              powershell -NoProfile -Command "
                function Kids(\$id) { Get-CimInstance Win32_Process -Filter \"ParentProcessId=\$id\" | ForEach-Object { \$_.ProcessId; Kids \$_.ProcessId } }
                \$all = @($winpid) + @(Kids $winpid)
                'probe tree_pids=' + \$all.Count
                \$tcp = @(Get-NetTCPConnection -ErrorAction SilentlyContinue | Where-Object { \$all -contains \$_.OwningProcess })
                foreach (\$c in \$tcp) { 'probe tcp pid=' + \$c.OwningProcess + ' local=' + \$c.LocalAddress + ':' + \$c.LocalPort + ' remote=' + \$c.RemoteAddress + ':' + \$c.RemotePort + ' state=' + \$c.State }
                \$udp = @(Get-NetUDPEndpoint -ErrorAction SilentlyContinue | Where-Object { \$all -contains \$_.OwningProcess })
                foreach (\$u in \$udp) { 'probe udp pid=' + \$u.OwningProcess + ' local=' + \$u.LocalAddress + ':' + \$u.LocalPort }
                'probe tcp_count=' + \$tcp.Count + ' udp_count=' + \$udp.Count
              " | tr -d '\r'
            else
              echo "probe lsof_app:"
              lsof -nP -a -p "$winpid" -i | sed 's/^/probe   /'
              wk=$(pgrep -f 'com.apple.WebKit' | tr '\n' ',' | sed 's/,$//')
              echo "probe webkit_pids=${wk:--}"
              if [ -n "$wk" ]; then
                echo "probe lsof_webkit:"
                lsof -nP -a -p "$wk" -i | sed 's/^/probe   /'
              fi
            fi
          }
          run_probe() {
            name=$1
            shift
            out="$RUNNER_TEMP/r4v-$name.out"
            echo "probe run=$name flags=$* helpers_before=$(helpers)"
            # shellcheck disable=SC2086
            "$bin" "$@" >"$out" 2>&1 &
            pid=$!
            port=
            i=0
            while [ "$i" -lt 600 ]; do
              port=$(tr -d '\r' <"$out" | sed -n 's/^control port=\([0-9][0-9]*\)$/\1/p' | head -n 1)
              if [ -n "$port" ] || ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 0.1
              i=$((i + 1))
            done
            if [ -z "$port" ]; then echo "probe run=$name control_port=none"; return; fi
            c="$RUNNER_TEMP/r4v-client.js"
            winpid=$(node "$c" s0 "$port" 20000 sample | sed -n 's/.* pid=\([0-9]*\) .*/\1/p')
            echo "probe run=$name app_pid=$winpid"
            if [ "$name" = main ]; then
              node "$c" c1 "$port" 60000 show 'wait 8000' sample
              conns "$winpid"
              node "$c" c2 "$port" 60000 'load missing.html' 'wait 3000' sample
              node "$c" c3 "$port" 15000 show &
              hung=$!
              sleep 2
              node "$c" c4 "$port" 15000 sample 'load index.html' 'wait 3000' sample
              wait "$hung"
              node "$c" c5 "$port" 15000 hide show sample
              conns "$winpid"
            else
              node "$c" c1 "$port" 60000 show destroy sample
            fi
            node "$c" cq "$port" 15000 quit
            i=0
            while kill -0 "$pid" 2>/dev/null && [ "$i" -lt 200 ]; do
              sleep 0.1
              i=$((i + 1))
            done
            if kill -0 "$pid" 2>/dev/null; then
              echo "probe run=$name app_running_after_quit=yes"
              kill "$pid"
            else
              wait "$pid"
              echo "probe run=$name app_exit=$? after_ds=$i"
            fi
            echo "probe run=$name helpers_at_exit=$(helpers)"
            sleep 10
            echo "probe run=$name helpers_10s_after_exit=$(helpers)"
            tr -d '\r' <"$out" | grep -E '^(control port=[0-9]+|page [a-z_ =0-9]+|core [a-z_ =0-9]+|r4-trial-app: .*|refused .*)$' | cut -c1-200 | sed 's/^/probe app /'
          }
          run_probe main
          run_probe b --arm b
          echo "probe done"
          exit 0

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
