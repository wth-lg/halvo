name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: r2 U8.5b, the three commands of its Done-when (a) and (b)

on:
  push:
    branches-ignore: ['land-*', 'land-*/**']
    tags: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Toolchain
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: cargo test -p halvo-control --features r2
        shell: bash
        run: cargo test -p halvo-control --features r2 --locked
      - name: cargo test -p halvo-control
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test -p halvo-control --locked
      - name: cargo test -p halvo-owner --test owner
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test -p halvo-owner --locked --test owner
