            tail -n 40 "target/egress-trial/$label.err"
            printf '::endgroup::\n'
            printf 'trial %s exit=%s\n' "$label" "$code"
          }
          case $job in
            macos) mode=sandbox; platform=macos-15; parts='probe lists sandbox' ;;
            windows) mode=wfp; platform=windows-2025; parts='probe lists wfp' ;;
          esac
          rustc --version
          step build sh scripts/egress/probe.sh none
          for part in $parts; do
            step "test-$part" sh scripts/egress/test.sh "$part"
          done
          step self-test sh scripts/egress/check.sh --mode "$mode" --self-test
          step control sh scripts/egress/check.sh --mode "$mode" --self-test --control-no-deny
          printf '[fixed]\n192.0.2.1:443\n[agent]\n' >target/egress-trial/routable.txt
          step entry sh scripts/egress/check.sh --mode "$mode" target/egress-trial/routable.txt -- sh scripts/egress/probe.sh none
          step driver-self-test sh scripts/ci/run-ci-d.sh "$job" --self-test 10-egress
          step driver sh scripts/ci/run-ci-d.sh "$job" 10-egress
          if [ "$job" = windows ]; then
            powershell.exe -NoProfile -Command "Get-NetFirewallProfile | ForEach-Object { 'profile ' + \$_.Name + ' enabled=' + \$_.Enabled + ' outbound=' + \$_.DefaultOutboundAction }"
          fi
          printf '::group::denial logs and counts\n'
          for d in target/egress/*/; do
