name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Not used by this scratch spike
        shell: bash
        run: echo "macos job cut to one step for scratch spike s5"

  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          workspaces: |
            . -> target
            spike/r1-win-b -> target
      - name: Build the probe
        shell: bash
        run: cargo build --release --locked --manifest-path spike/r1-win-b/Cargo.toml
      - name: S5 probe
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File spike\r1-win-b\ci\s5.ps1
