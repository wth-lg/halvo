          export HALVO_WF_FORM=short
          log="$RUNNER_TEMP/loop.log"
          cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/fun.json" 2>"$log"
          echo "LOOP build fun exit=$?"
          fun=$(tr -d '\r' <"$RUNNER_TEMP/fun.json" | sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          [ -n "$fun" ] || { echo "LOOP no executable"; exit 1; }
          failed_steps=0
          for t in browser::swap_phases_of_the_page_in_edge browser::swap_phases_of_the_page_in_chrome; do
            kept=0
            kept_passed=0
            passed=0
            met=0
            for run in $(seq 1 20); do
              timeout 600 "$fun" --ignored --exact --nocapture "$t" </dev/null >"$log" 2>&1
              code=$?
              ok=0
              if [ "$code" -eq 0 ] && tr -d '\r' <"$log" | grep -q '^test result: ok. 1 passed; 0 failed'; then
                ok=1
                passed=$((passed + 1))
              fi
              slipped=$(tr -d '\r' <"$log" | grep -c ' schedule_slipped ')
              met=$((met + $(tr -d '\r' <"$log" | grep -c ' after_start_state=met')))
              if [ "$slipped" -eq 0 ]; then
                kept=$((kept + 1))
                kept_passed=$((kept_passed + ok))
              fi
              echo "LOOP test=$t run=$run exit=$code passed=$ok slipped_controls=$slipped (every line of the run follows)"
              tr -d '\r' <"$log" | cut -c1-200000
              echo "LOOP test=$t run=$run end of the run's lines"
            done
            verdict=pass
            if [ "$kept" -lt 18 ]; then
              verdict="FAIL too few runs kept the schedule"
            elif [ "$kept_passed" -ne "$kept" ]; then
              verdict="FAIL a run that kept the schedule did not pass"
            fi
            [ "$verdict" = pass ] || failed_steps=$((failed_steps + 1))
            echo "LOOP test=$t runs=20 passed=$passed kept_the_schedule=$kept passed_of_those=$kept_passed after_start_state_met=$met verdict=$verdict"
          done
          exit "$failed_steps"

  undo:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: win-3 W3-17, the undo rows that only the runner shows (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1 HALVO_WF_FORM=short
          log="$RUNNER_TEMP/undo.log"
          lib() {
            for t in "$@"; do
              timeout 900 cargo test --locked -p halvo-capture --lib -- --exact "$t" --nocapture --test-threads=1 >"$log" 2>&1 </dev/null
              echo "UNDO $row kind=lib test=$t exit=$?"
              tr -d '\r' <"$log" | grep -E '^TF |panicked at|^test result|^error(\[|:)|^  left|^ right' | cut -c1-1500
            done
          }
          func() {
            for t in "$@"; do
              timeout 1500 cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact "$t" --nocapture --test-threads=1 >"$log" 2>&1 </dev/null
              echo "UNDO $row kind=functional test=$t exit=$?"
              tr -d '\r' <"$log" | grep -E 'KNOWN-DEFECT|panicked at|^test result|after_start_state=|reopened_page|reopened page|short first typing|keys_withheld did|^error(\[|:)' | cut -c1-1500 | tail -60
            done
          }
          for row in U-T6 U-HANDLER; do
            git checkout -- crates/halvo-capture/src
            python - "$row" <<'PY'
          import sys
          name = sys.argv[1]
          gate = "crates/halvo-capture/src/windows/secure_input.rs"
          source = "crates/halvo-capture/src/windows/input.rs"
          rows = {
            "U-HANDLER": [(gate, "        let moves = handler.shared.begin_event();", "        if !handler.reader.automation.as_raw().is_null() {\n            return S_OK;\n        }\n        let moves = handler.shared.begin_event();")],
            "U-LATE": [(gate, "        let began = tick();\n        #[cfg(feature = \"test-seam\")]\n        crate::windows::input::seam::own_read_began(began);", "        let began = tick();\n        std::thread::sleep(std::time::Duration::from_millis(300));\n        #[cfg(feature = \"test-seam\")]\n        crate::windows::input::seam::own_read_began(began);")],
            "U-G4": [(source, "                gate.pointer_takes_the_clicks(before);", "                let _ = before;\n                gate.pointer_takes_the_clicks(super::now_tick());")],
            "U-G2": [(source, "    KeyStep {\n        record: map_keystroke(state, key),\n        latch,\n    }", "    let record = map_keystroke(state, key);\n    KeyStep {\n        latch: latch && record.is_some(),\n        record,\n    }")],
            "U-R1": [(gate, ".state(element, super::ReadBy::Event, moves, false);", ".state(element, super::ReadBy::OwnRead, moves, false);")],
            "U-G8": [(gate, "    !events_in_flight && read_move > kept_move", "    read_move > kept_move")],
            "U-G5": [(gate, "                path.rsplit(['/', '\\\\']).next().map(str::to_string),", "                Some(\"app.exe\".to_string()),")],
            "U-G6": [(gate, "            let _ = (removals.handler)(&reader.automation, &handler);\n            let _ = ready.send(Err(os(", "            let _ = ready.send(Err(os(")],
            "U-G7": [(source, "    if route.keyboard_window != Some(window) || !own_gate {", "    if false && (route.keyboard_window != Some(window) || !own_gate) {")],
            "U-G10": [(gate, "                Err(std::sync::mpsc::RecvTimeoutError::Timeout) => {\n                    self.shared.lock().stopping = true;\n                    wake.set();", "                Err(std::sync::mpsc::RecvTimeoutError::Timeout) => {\n                    wake.set();")],
            "U-G3": [(source, "            pointer_forwarded(before.wrapping_sub(ms_of(crate::secure_input::windows::TICK_STEP)));", "            let _ = before;")],
            "U-T3": [(source, "        seam::note(stroke.vkey, &answer, key.tick(), now);", "        seam::note(stroke.vkey, &answer.as_ref().map(|(_, rule)| (Err::<KeystrokeClearance, _>(crate::secure_input::Withheld::Active), *rule)), key.tick(), now);")],
            "U-T6": [(source, "                producer.push(keystroke_packet(clearance, stroke, app, key.tick()));", "                let _ = (clearance, app);")],
            "V30": [(gate, ".filter(|entry| after_key(entry) && entry.seq <= upto)", ".filter(|entry| after_key(entry) && entry.seq < upto)")],
            "V52": [(gate, "        None => (read, Kept::Leave),", "        None => (FieldState::Clear, Kept::Leave),")],
          }
          for path, old, new in rows[name]:
              text = open(path, encoding="utf-8").read().replace("\r\n", "\n")
              print("UNDO", name, path, "matches", text.count(old))
              assert text.count(old) == 1
              open(path, "w", encoding="utf-8", newline="\n").write(text.replace(old, new))
          PY
            if [ "$?" -ne 0 ]; then
              echo "UNDO $row the change did not apply"
              continue
            fi
            case $row in
              U-G4) lib windows::input::tests::the_pointer_owns_the_clicks_from_a_tick_step_before_its_registration ;;
              U-G2) lib windows::input::tests::every_key_down_of_a_focus_key_latches_and_only_a_recorded_one_holds_first windows::input::tests::a_held_tab_sets_one_latch_for_each_key_down_at_the_source ;;
              U-R1) lib secure_input::windows::detector::tests::an_event_of_another_element_does_not_let_the_kept_password_element_go ;;
              U-G8) lib secure_input::windows::detector::tests::an_own_read_between_a_focus_events_start_and_its_mark_does_not_let_its_reading_go ;;
              U-G5) lib secure_input::windows::detector::tests::the_process_file_is_the_own_executables_name_and_nothing_for_an_ended_process ;;
              U-G6) lib secure_input::windows::detector::tests::a_desktop_hook_that_cannot_be_set_refuses_the_attach_and_removes_the_focus_handler ;;
              U-G7) lib windows::input::tests::a_keyboard_stop_lets_the_click_route_go_only_when_its_window_and_gate_are_its_own ;;
              U-G10) lib secure_input::windows::detector::tests::an_attach_whose_first_read_does_not_answer_times_out_and_stops_that_detector ;;
              U-G3) lib windows::input::tests::keys_wait_for_a_held_pointer_pump_and_an_idle_pointer_source_lets_them_through ;;
              U-T3) func browser::stall_phases_of_the_page_in_chrome browser::swap_phases_of_the_page_in_chrome browser::cold_and_warm_orders_in_chrome browser::a_burst_whose_first_letter_swaps_records_nothing_in_chrome browser::a_letter_and_a_tab_out_of_a_swapped_field_record_nothing_in_chrome known_defect::browser_swaps_on_a_held_main_thread_in_chrome known_defect::browser_self_move_after_a_held_main_thread_in_chrome ;;
              U-T6) func browser::after_a_start_behind_another_window_in_edge browser::after_a_start_behind_another_window_in_chrome ;;
              U-HANDLER) func browser::after_a_start_behind_another_window_in_edge browser::after_a_start_behind_another_window_in_chrome ;;
              V30) func known_defect::browser_swaps_on_a_held_main_thread_in_chrome browser::swap_phases_of_the_page_in_chrome ;;
              V52) func known_defect::stall_no_focus_key_and_the_program_moves_the_focus_itself browser::a_renamed_copy_of_firefox_reads_unknown_and_records_nothing ;;
            esac
          done
          git checkout -- crates/halvo-capture/src
          echo "UNDO end"
          exit 0
