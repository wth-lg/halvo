name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: daemon-1 loop of DM-16's tests
        shell: bash
        run: |
          set +e
          set -u
          step_start=$(date +%s)
          py=$(command -v python3 || command -v python); bin=$(cargo test --locked -q -p halvo-capture --lib --no-run --message-format json 2>/dev/null | "$py" -c "import json,sys; print([m['executable'] for m in map(json.loads, sys.stdin) if m.get('reason') == 'compiler-artifact' and m.get('executable') and m['target']['name'] == 'halvo_capture'][-1])" | tr -d '\r')
          echo "daemon-1 loop (macos): binary ${bin:-none} at $(( $(date +%s) - step_start )) s of the step"
          names='daemon::stop_tests::an_unanswered_stop_after_a_dropped_batch_counts_the_dropped_events daemon::owner::tests::three_due_tries_with_two_counted_codes_drop_no_batch daemon::tests::a_shutdown_answered_late_in_its_part_is_taken_and_stores_the_events daemon::tests::a_last_settle_with_no_answer_gives_exit_1'
          want=4
          out=$(mktemp)
          pass=0
          fail=0
          # shellcheck disable=SC2086
          for round in $(seq 200); do
            if [ -n "$bin" ] && "$bin" --exact $names --test-threads=4 >"$out" 2>&1 && tr -d '\r' <"$out" | grep -q "^test result: ok. $want passed"; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1))
              echo "daemon-1 loop (macos): round $round failed:"
              tail -n 30 "$out"
            fi
          done
          echo "daemon-1 loop (macos): tests $want, runs 200, passes $pass, failures $fail"
          echo "daemon-1 loop (macos): the step took $(( $(date +%s) - step_start )) s"
          [ "$pass" = 200 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-macos
          path: target/release/bundle/macos/Halvo.app
          if-no-files-found: error
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: windows not run in this scratch copy
        shell: bash
        run: echo 'the loop of DM-16 Addition 1 runs in the macos job alone'