name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional 52-windows-browser 53-windows-prints
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 50-windows-functional 52-windows-browser 53-windows-prints
      - name: win-3e loops of the added tests
        if: ${{ !cancelled() }}
        shell: bash
        env:
          HALVO_WF_FORM: short
        run: |
          set +e
          cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/w3e-build.json" 2>"$RUNNER_TEMP/w3e-build.err"
          printf 'w3e loops build_exit=%s\n' "$?"
          sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/w3e-build.json" >"$RUNNER_TEMP/w3e-exe"
          exe=$(sed 's/\\\\/\//g' "$RUNNER_TEMP/w3e-exe")
          if [ ! -f "$exe" ]; then
            printf 'w3e loops no_test_executable=1\n'
            exit 1
          fi
          cat >"$RUNNER_TEMP/w3e-loops.txt" <<'W3E_EOF'
          20 stall::tab_then_letters_while_the_program_sleeps_at_each_wait
          20 stall::tab_then_letters_while_the_program_serves_sent_messages_at_each_wait
          20 stall::click_then_letters_while_the_program_sleeps_at_each_wait
          20 stall::click_then_letters_while_the_program_serves_sent_messages_at_each_wait
          20 stall::a_second_field_and_a_window_of_another_thread_while_the_program_waits_300_ms
          20 stall::enter_a_tab_out_and_a_focus_move_in_two_steps_record_no_letter
          20 stall::a_masked_edit_and_a_focus_notice_that_the_system_does_not_deliver_record_no_letter
          200 stall::kinds::a_native_phase_fails_each_of_its_own_faults
          200 stall::kinds::a_phase_before_the_before_control_or_after_the_after_control_fails
          200 stall::kinds::a_phase_between_the_two_controls_of_its_own_session_passes
          200 stall::kinds::a_phase_that_the_controls_of_another_session_bracket_fails
          200 stall::kinds::a_phase_whose_control_recorded_fewer_than_five_letters_fails
          200 stall::kinds::a_phase_whose_two_controls_come_from_two_sessions_fails
          200 stall::kinds::each_check_of_a_phase_fails_its_own_fault_in_each_family
          200 stall::kinds::the_kinds_hold_one_phase_for_each_test_and_sub_case_that_they_replace
          200 browser::steps::a_page_that_names_no_step_does_not_count
          200 browser::steps::a_round_on_another_step_of_the_page_does_not_count
          200 browser::steps::a_round_on_its_own_step_of_the_page_counts
          200 browser::steps::a_round_on_the_page_in_another_phase_or_hold_at_its_step_does_not_count
          200 browser::steps::the_steps_of_a_page_go_into_its_address_in_order
          W3E_EOF
          failed=0
          while read -r runs test; do
            passes=0
            index=0
            began=$(date +%s)
            while [ "$index" -lt "$runs" ]; do
              index=$((index + 1))
              timeout 360 "$exe" --ignored --exact --nocapture "$test" </dev/null >"$RUNNER_TEMP/w3e-loop.raw" 2>&1
              code=$?
              tr -d '\r' <"$RUNNER_TEMP/w3e-loop.raw" >"$RUNNER_TEMP/w3e-loop.log"
              if [ "$code" -eq 0 ] && grep -q '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/w3e-loop.log"; then
                passes=$((passes + 1))
              else
                panics=$(grep -c ' panicked at ' "$RUNNER_TEMP/w3e-loop.log")
                printf 'w3e loop_run_failed test=%s run=%s exit=%s panics=%s\n' "$test" "$index" "$code" "$panics"
              fi
            done
            printf 'w3e loop %s runs=%s passed=%s seconds=%s\n' "$test" "$runs" "$passes" "$(($(date +%s) - began))"
            [ "$passes" -eq "$runs" ] || failed=$((failed + 1))
          done <"$RUNNER_TEMP/w3e-loops.txt"
          printf 'w3e loops tests_with_a_failed_run=%s\n' "$failed"
          [ "$failed" -eq 0 ]
      - name: win-3e live one-rule changes
        if: ${{ !cancelled() }}
        shell: bash
        env:
          HALVO_WF_FORM: short
        run: |
          set +e
          mutant() {
            name=$1
            file=$2
            test=$3
            reason=$4
            perl -0pi -e 'my $n = s/\Q$ENV{W3E_OLD}\E/$ENV{W3E_NEW}/g; exit($n == 1 ? 0 : 3)' "$file"
            applied=$?
            cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/w3e-m.json" 2>"$RUNNER_TEMP/w3e-m.err"
            built=$?
            sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/w3e-m.json" >"$RUNNER_TEMP/w3e-m-exe"
            exe=$(sed 's/\\\\/\//g' "$RUNNER_TEMP/w3e-m-exe")
            code=none
            seen=0
            if [ "$applied" -eq 0 ] && [ "$built" -eq 0 ] && [ -f "$exe" ]; then
              timeout 360 "$exe" --ignored --exact --nocapture "$test" </dev/null >"$RUNNER_TEMP/w3e-m.raw" 2>&1
              code=$?
              tr -d '\r' <"$RUNNER_TEMP/w3e-m.raw" >"$RUNNER_TEMP/w3e-m.log"
              seen=$(grep -c -F "$reason" "$RUNNER_TEMP/w3e-m.log")
            fi
            git checkout -- "$file"
            printf 'w3e mutant %s apply_exit=%s build_exit=%s test_exit=%s reason_lines=%s\n' "$name" "$applied" "$built" "$code" "$seen"
          }
          stall=crates/halvo-capture/tests/stall/mod.rs
          browser=crates/halvo-capture/tests/browser/mod.rs
          W3E_OLD='            after: ControlRead { step, recorded },' W3E_NEW='            after: ControlRead { step, recorded: 0 },' \
            mutant L1-the-after-control-reads-nothing "$stall" stall::tab_then_letters_while_the_program_sleeps_at_each_wait 'a control recorded fewer than 5 letters'
          W3E_OLD='            session: self.id,
                      at: self.at,' W3E_NEW='            session: self.id + 1,
                      at: self.at,' \
            mutant L2-a-phase-of-another-session "$stall" stall::tab_then_letters_while_the_program_sleeps_at_each_wait 'not its own session'
          W3E_OLD='            at: at + 1,' W3E_NEW='            at,' \
            mutant L3-the-after-control-at-the-last-phase-s-step "$stall" stall::enter_a_tab_out_and_a_focus_move_in_two_steps_record_no_letter 'the controls do not bracket it'
          W3E_OLD='    if want.step > 0 {' W3E_NEW='    if want.step > 9 {' \
            mutant L4-the-page-is-not-moved-on "$browser" browser::stall_phases_of_the_page_in_edge 'control_after=0'
          printf 'w3e mutants status_lines_after=%s\n' "$(git status --porcelain --untracked-files=no | grep -c '')"
          exit 0
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
