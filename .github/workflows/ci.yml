name: ci
# scratch: macos-2b's probe (MA-12 F4) and its failing-first stall phase at the base (F5); never merged

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Build the stall fixture and the hosted test
        shell: bash
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          sw_vers -productVersion
          clang -fobjc-arc -Wall -Wextra -Werror -O1 -framework AppKit -o "$RUNNER_TEMP/stall-fixture" crates/halvo-capture/tests/macos_stall_fixture/fixture.m
          cargo test --locked -p halvo-capture --test macos_stall_fixture --no-run
      - name: Probe (MA-12 F4)
        shell: bash
        timeout-minutes: 7
        run: |
          set +e
          started=$(date +%s)
          HALVO_STALL_FIXTURE="$RUNNER_TEMP/stall-fixture" cargo test --locked -p halvo-capture --test macos_stall_fixture -- --ignored --exact the_probe_reports_what_the_stall_phases_rest_on --nocapture --test-threads=1
          code=$?
          echo "probe step exit=$code seconds=$(( $(date +%s) - started ))"
          exit "$code"
      - name: Stall phase at the base (MA-12 F5)
        if: ${{ !cancelled() }}
        shell: bash
        timeout-minutes: 7
        run: |
          set +e
          started=$(date +%s)
          HALVO_STALL_FIXTURE="$RUNNER_TEMP/stall-fixture" cargo test --locked -p halvo-capture --test macos_stall_fixture -- --ignored --exact a_key_typed_ahead_into_a_secure_field_is_not_recorded --nocapture --test-threads=1
          code=$?
          echo "F5 step exit=$code seconds=$(( $(date +%s) - started ))"
          exit "$code"

  windows:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Not needed for the probe
        shell: bash
        run: echo "the probe of macos-2b runs in the macos job alone"
