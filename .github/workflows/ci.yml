          store::hardening_tests::the_live_holder_probe_and_the_held_look_answer_a_code_by_its_class_and_never_a_bare_code 200
          store::hardening_tests::the_size_of_a_store_counts_nothing_behind_a_link_to_a_large_file 200
          store::db::tests::the_code_table_reads_each_primary_code_and_no_code 200
          store::db::tests::the_text_of_a_database_error_holds_no_text_of_the_sqlite_message 200
          store::durable::tests::a_held_store_directory_cannot_be_renamed_and_stays_named 200
          store::durable::tests::remove_entry_refuses_a_directory_with_entries_and_unlinks_a_link_to_a_directory 200
          store::durable::tests::remove_tree_unlinks_a_link_inside_the_tree_and_keeps_its_target 200
          store::durable::tests::the_identity_of_an_entry_that_is_a_link_reads_link_and_names_the_link_itself 200
