name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GIT_AUTHOR_NAME: Halvo CI
      GIT_AUTHOR_EMAIL: ci@halvo.invalid
      GIT_COMMITTER_NAME: Halvo CI
      GIT_COMMITTER_EMAIL: ci@halvo.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Processors
        shell: bash
        run: |
          echo "getconf _NPROCESSORS_ONLN: $(getconf _NPROCESSORS_ONLN 2>&1)"
          echo "sysctl hw.ncpu: $(sysctl -n hw.ncpu 2>&1)"
          echo "memory bytes: $(sysctl -n hw.memsize 2>&1)"
      - name: ci.d self-test at the default
        continue-on-error: true
        shell: bash
        run: sh scripts/ci/measure-self-test.sh macos default
      - name: ci.d self-test 1 at a time
        continue-on-error: true
        shell: bash
        run: sh scripts/ci/measure-self-test.sh macos 1
      - name: ci.d self-test 2 at a time
        continue-on-error: true
        shell: bash
        run: sh scripts/ci/measure-self-test.sh macos 2
      - name: ci.d self-test 4 at a time
        continue-on-error: true
        shell: bash
        run: sh scripts/ci/measure-self-test.sh macos 4
      - name: ci.d self-test 6 at a time
        continue-on-error: true
        shell: bash
        run: sh scripts/ci/measure-self-test.sh macos 6
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      GIT_AUTHOR_NAME: Halvo CI
      GIT_AUTHOR_EMAIL: ci@halvo.invalid
      GIT_COMMITTER_NAME: Halvo CI
      GIT_COMMITTER_EMAIL: ci@halvo.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Processors
        shell: bash
        run: |
          echo "getconf _NPROCESSORS_ONLN: $(getconf _NPROCESSORS_ONLN 2>&1)"
          echo "nproc: $(nproc 2>&1)"
          echo "NUMBER_OF_PROCESSORS: ${NUMBER_OF_PROCESSORS:-unset}"
      - name: ci.d self-test at the default
        continue-on-error: true
        shell: bash
        run: sh scripts/ci/measure-self-test.sh windows default
      - name: ci.d self-test 1 at a time
        continue-on-error: true
        shell: bash
        run: sh scripts/ci/measure-self-test.sh windows 1
      - name: ci.d self-test 2 at a time
        continue-on-error: true
        shell: bash
        run: sh scripts/ci/measure-self-test.sh windows 2
      - name: ci.d self-test 3 at a time
        continue-on-error: true
        shell: bash
        run: sh scripts/ci/measure-self-test.sh windows 3
      - name: ci.d self-test 6 at a time
        continue-on-error: true
        shell: bash
        run: sh scripts/ci/measure-self-test.sh windows 6
      - name: ci.d self-test 8 at a time
        continue-on-error: true
        shell: bash
        run: sh scripts/ci/measure-self-test.sh windows 8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
