name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: U0.7c CP-145 rust components (scratch branch, never merged)
        shell: bash
        run: |
          set +e
          rustup component add clippy rustfmt
          echo "components exit=$?"
      - name: U0.7c CP-145 build of the web trial (scratch branch, never merged; counts only)
        shell: bash
        timeout-minutes: 14
        run: |
          set +e
          host=$(rustc -vV | sed -n 's/^host: //p')
          s0=$(date +%s)
          cargo build --release --locked --quiet --target "$host" --target-dir "$PWD/tools/r3-trials/web/target" \
            --manifest-path "$PWD/tools/r3-trials/web/Cargo.toml"
          b=$?
          echo "build exit=$b seconds=$(( $(date +%s) - s0 ))"
          exit $b
      - name: U0.7c CP-145 trial crate on hosted-mac (scratch branch, never merged; counts only)
        if: always()
        shell: bash
        timeout-minutes: 40
        run: |
          set +e
          cd tools/r3-trials/web
          log="$RUNNER_TEMP/r3-web-test.log"
          cargo test --locked --no-fail-fast >"$log" 2>&1
          t=$?
          grep -E "^test .* (FAILED|ignored)$|^test result" "$log"
          awk '/^---- .* stdout ----$/{p=1} /^failures:$/{p=0} p' "$log" | head -60
          s0=$(date +%s)
          cargo clippy --locked --all-targets -- -D warnings >"$log.3" 2>&1
          c=$?
          echo "clippy seconds=$(( $(date +%s) - s0 )) exit=$c after=the_test_build"
          cargo fmt --check >/dev/null 2>&1
          f=$?
          echo "trial crate=web test_exit=$t clippy_exit=$c fmt_exit=$f"
          [ "$t" -eq 0 ] && [ "$c" -eq 0 ] && [ "$f" -eq 0 ]
      - name: U0.7c CP-145 pipe-form cells and relay_port_free on hosted-mac (scratch branch, never merged; counts only)
        if: always()
        shell: bash
        timeout-minutes: 180
        run: |
          set +e
          code=0
          lim() { perl -e 'alarm shift @ARGV; exec @ARGV or exit 127' "$@"; }
          t() {
            s0=$(date +%s)
            lim 3600 sh tools/r3-trials/web/run.sh --candidate cdp --browser "$b" --port 18190 "$@"
            e=$?
            echo "call_end exit=$e seconds=$(( $(date +%s) - s0 )) args=$(echo "$*" | tr ' ' '_')"
            [ "$e" -eq 0 ] || code=1
          }
          for pair in "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome|chrome" "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge|edge"; do
            b=${pair%%|*}
            k=${pair##*|}
            [ -f "$b" ] || { echo "browser missing $k"; code=1; continue; }
            echo "browser $k"
            t --runs 10 --rows round3 --round 3 --relay
            t --runs 10 --round 3 --relay
            t --runs 10 --rows isolation --round 3 --relay
            for s in list_refuse list_hops list_close; do t --runs 10 --rows relay --round 3 --relay --step "$s"; done
            t --runs 10 --rows reach --round 3 --relay
            t --runs 10 --rows ways --round 3 --relay --step frame_doc
            t --runs 10 --rows driver --round 3 --step relay_port_free
          done
          exit $code
      - name: U0.7c CP-145 processes left at the job's end (scratch branch, never merged)
        if: always()
        shell: bash
        run: |
          set +e
          n=$(ps -axww -o command= | grep -E "/r3-web\.[A-Za-z0-9]+/" | grep -vc grep)
          echo "scan at=job_end processes_of_the_trial_runs_left=$n"
