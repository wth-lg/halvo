name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# scratch: trimmed to the mutant runner's self-test at the head and a loop of the new stop case (mutants-3); never merged
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Mutant runner self-test at the head (scratch, mutants-3)
        shell: bash
        run: |
          t0=$(date +%s)
          if sh scripts/r1-gate/mutation-test.sh --self-test -v > "$RUNNER_TEMP/selftest.out" 2>&1; then s=0; else s=$?; fi
          t1=$(date +%s)
          grep -v '^case .* want=PASS got=PASS$' "$RUNNER_TEMP/selftest.out" | grep -v '^case .* want=FAIL got=FAIL$' | tail -40
          echo "cases as wanted: $(grep -c -e 'want=PASS got=PASS$' -e 'want=FAIL got=FAIL$' "$RUNNER_TEMP/selftest.out")"
          echo "seconds runner-self-test-head $((t1 - t0)) exit $s"
          test "$s" -eq 0
      - name: The new stop case alone, 200 times (scratch, mutants-3)
        shell: bash
        run: |
          c=stop-by-term-as-the-helper-ends-a-run-lets-a-gate-check-end
          t0=$(date +%s)
          n=0; p=0
          while [ "$n" -lt 200 ]; do
            n=$((n + 1))
            if sh scripts/r1-gate/mutation-test.sh --self-test -v --case "$c" > "$RUNNER_TEMP/one.out" 2>&1; then p=$((p + 1)); else echo "run $n:"; tail -3 "$RUNNER_TEMP/one.out"; fi
          done
          t1=$(date +%s)
          echo "loop $c: $p of $n passed"
          echo "seconds runner-stop-case-loop $((t1 - t0))"
          test "$p" -eq "$n"
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Mutant runner self-test at the head under Git Bash (scratch, mutants-3; records, never fails)
        shell: bash
        timeout-minutes: 30
        continue-on-error: true
        run: |
          t0=$(date +%s)
          if sh scripts/r1-gate/mutation-test.sh --self-test -v > "$RUNNER_TEMP/selftest.out" 2>&1; then s=0; else s=$?; fi
          t1=$(date +%s)
          echo "first lines that are not as wanted:"
          grep -v -e 'want=PASS got=PASS$' -e 'want=FAIL got=FAIL$' "$RUNNER_TEMP/selftest.out" | head -20
          echo "last lines:"
          tail -20 "$RUNNER_TEMP/selftest.out"
          echo "cases as wanted: $(grep -c -e 'want=PASS got=PASS$' -e 'want=FAIL got=FAIL$' "$RUNNER_TEMP/selftest.out")"
          echo "seconds runner-self-test-windows $((t1 - t0)) exit $s"
          exit 0
      - name: The new stop case alone under Git Bash, 200 times if it passes once (scratch, mutants-3; records, never fails)
        shell: bash
        timeout-minutes: 80
        continue-on-error: true
        run: |
          c=stop-by-term-as-the-helper-ends-a-run-lets-a-gate-check-end
          if ! sh scripts/r1-gate/mutation-test.sh --self-test -v --case "$c" > "$RUNNER_TEMP/one.out" 2>&1; then
            echo "the case does not pass once under Git Bash; no loop:"
            tail -3 "$RUNNER_TEMP/one.out"
            exit 0
          fi
          t0=$(date +%s)
          n=0; p=0
          while [ "$n" -lt 200 ]; do
            n=$((n + 1))
            if sh scripts/r1-gate/mutation-test.sh --self-test -v --case "$c" > "$RUNNER_TEMP/one.out" 2>&1; then p=$((p + 1)); else echo "run $n:"; tail -3 "$RUNNER_TEMP/one.out"; fi
            [ $((n % 20)) -ne 0 ] || echo "so far: $p of $n passed, $(( $(date +%s) - t0 )) s"
          done
          t1=$(date +%s)
          echo "loop $c: $p of $n passed"
          echo "seconds runner-stop-case-loop-windows $((t1 - t0))"
          exit 0
