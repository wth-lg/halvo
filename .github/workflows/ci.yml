name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # scratch: step 0 of CP-177 (5) alone, at the harness of c882c15; never merged
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: r3 U0.6 step 0, granite_4_2_3b drive cells
        shell: bash
        run: |
          sh tools/r3-trials/model/fetch.sh granite_4_2_3b
          base="${TMPDIR:-/tmp}"
          for task in bill order; do
            for seed in 1 2 3; do
              sh tools/r3-trials/drive/run.sh --model granite_4_2_3b --task "$task" --seed "$seed" --browser "C:/Program Files/Google/Chrome/Application/chrome.exe" --port 18190 || echo "cell model=granite_4_2_3b task=$task seed=$seed exit=$?"
              dir=$(ls -td "$base"/r3-drive-cell.* | head -1)
              echo "trace model=granite_4_2_3b task=$task seed=$seed"
              awk '{ sub(/^[0-9.]+ /, "") }
              /^call=[0-9]+ reply=/ {
                n = $0; sub(/^call=/, "", n); sub(/ .*/, "", n)
                a = "-"; if (match($0, /"action":"[a-z]+"/)) { a = substr($0, RSTART + 10, RLENGTH - 11) }
                r = "null"; if (match($0, /"ref":"e[0-9]+"/)) { r = substr($0, RSTART + 7, RLENGTH - 8) }
                print "ask=" n " action=" a " ref=" r; next
              }
              /^effect allowed/ { print "effect allowed"; next }
              /^(handback|stuck|compile|run)/ { print }' "$dir/trace.txt"

            done
          done
