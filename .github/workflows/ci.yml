name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: control-2b tests 200 times
        shell: bash
        run: |
          found=0
          for bin in target/debug/deps/halvo_control-*; do
            case "$bin" in *.d|*.pdb|*.rlib|*.rmeta|*.lib|*.dll) continue ;; esac
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            found=$((found + 1))
            pass=0
            other=0
            i=0
            while [ "$i" -lt 200 ]; do
              code=0
              "$bin" --exact --test-threads 4 client::tests::a_broken_reply_stays_a_protocol_error_beside_the_two_typed_errors client::tests::a_delete_with_no_id_while_the_store_opens_with_no_id_answers_busy_and_deletes_nothing client::tests::a_reply_of_another_version_is_its_own_error_and_ctl_prints_the_line_that_it_printed_before client::tests::a_reply_with_a_value_that_v1_does_not_know_is_its_own_error_and_ctl_prints_the_line_that_it_printed_before proto::tests::a_text_outside_a_closed_list_of_v1_is_an_unknown_value_at_every_place_of_every_reply proto::tests::each_source_entry_carries_the_mark_unstopped_on_the_wire_and_an_entry_without_it_does_not_decode proto::tests::the_mark_unstopped_refuses_paused_no_indicator_and_awaiting_resume_beside_it_and_takes_the_other_five proto::tests::the_text_of_a_status_does_not_print_the_mark proto::tests::the_twins_at_version_2_of_the_frames_with_white_space_are_invalid_argument testing::tests::a_pause_keeps_the_person_s_stop_of_a_source_whatever_the_stop_answers_and_a_resume_ends_it texts::tests::ct9_a_source_with_no_line_is_never_read_as_off texts::tests::ct9_passwords_and_typed_ahead_for_each_platform_guard_and_value_of_the_typing_line_are_the_tables_of_the_rulings texts::tests::ct9_recorded_beside_each_value_of_the_keyboard_and_the_screen_line_is_the_table_of_the_ruling texts::tests::ct9_the_why_of_the_screen_row_says_not_recorded_only_where_recorded_says_it testing::tests::a_stop_answered_with_timeout_or_os_marks_the_source_and_a_later_ok_or_thread_ended_clears_the_mark testing::tests::every_status_that_the_scripted_daemon_builds_from_its_stop_answers_is_taken >"${RUNNER_TEMP:-/tmp}/control-2b-loop.txt" 2>&1 || code=$?
              ok=$(tr -d '\r' <"${RUNNER_TEMP:-/tmp}/control-2b-loop.txt" | grep -c '^test result: ok. 16 passed; 0 failed' || true)
              if [ "$code" = 0 ] && [ "$ok" = 1 ]; then
                pass=$((pass + 1))
              else
                other=$((other + 1))
                [ "$other" -gt 1 ] || tail -n 40 "${RUNNER_TEMP:-/tmp}/control-2b-loop.txt"
              fi
              i=$((i + 1))
            done
            echo "control-2b loop (windows): binary $(basename "$bin"): runs 200, passes $pass, other $other"
            [ "$other" = 0 ] || exit 1
          done
          echo "control-2b loop (windows): binaries run: $found"
          [ "$found" -gt 0 ]
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
