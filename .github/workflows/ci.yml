name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Self-tests that commit in throwaway repositories
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          sh scripts/check-commit-messages.sh --self-test-two-paths
          sh scripts/check-commit-messages.sh --self-test-pre-push
          sh scripts/ci-commit-messages.sh --self-test
          sh scripts/merge-pr.sh --self-test
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 19-home-paths 16-shell-lint
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 19-home-paths 16-shell-lint
      - name: Bounded loop of the cases of hook-2 (scratch only)
        if: always()
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          set +e
          failed=0
          utf8=$(locale -a 2>/dev/null | grep -m 1 -E '^(en_US|C)\.(UTF-8|utf8)$')
          echo "loop utf8-locale=${utf8:-none}"
          d=$(mktemp -d "$RUNNER_TEMP/loop.XXXXXX")
          git init -q "$d/r"
          git -C "$d/r" -c commit.gpgsign=false commit -q --allow-empty -m root
          root=$(git -C "$d/r" rev-parse HEAD)
          tree=$(git -C "$d/r" rev-parse 'HEAD^{tree}')
          mkdir "$d/s"
          sed "s/^NEWEST_EXEMPT_COMMIT=.*/NEWEST_EXEMPT_COMMIT=$root/" scripts/check-commit-messages.sh >"$d/s/check-commit-messages.sh"
          cp scripts/commit-range.sh "$d/s/commit-range.sh"
          start=$SECONDS; runs=0; p=0
          for i in $(seq 200); do
            c=$(git -C "$d/r" commit-tree "$tree" -p "$root" -m "round $i")
            for loc in C $utf8; do
              runs=$((runs + 1))
              out=$(cd "$d/r" && printf 'refs/heads/x %s refs/heads/x %s\n' "$c" "A${c#?}" | LC_ALL=$loc sh "$d/s/check-commit-messages.sh" --pre-push proof 2>&1)
              code=$?
              if [ $code = 2 ] && printf '%s' "$out" | grep -q 'cannot read this line'; then p=$((p + 1)); else echo "loop object-id round=$i locale=$loc exit=$code"; fi
            done
          done
          echo "loop object-id-lines job=macos rounds=200 runs=$runs passes=$p seconds=$((SECONDS - start))"
          [ $p = $runs ] || failed=1
          start=$SECONDS; n=0; p=0
          while [ $n -lt 8 ] || [ $((SECONDS - start)) -lt 1200 ]; do
            n=$((n + 1))
            out=$(sh scripts/ci/run-ci-d.sh macos --self-test 19-home-paths 2>&1)
            code=$?
            if [ $code = 0 ]; then p=$((p + 1)); else printf '%s\n' "$out" | grep -E 'wrong verdict|^FAIL' | head -5; fi
            echo "loop 19-home-paths round=$n exit=$code seconds=$((SECONDS - start))"
          done
          echo "loop 19-home-paths job=macos rounds=$n passes=$p seconds=$((SECONDS - start))"
          [ $p = $n ] || failed=1
          for name in pre-push ci-commit-messages; do
            start=$SECONDS; n=0; p=0
            while [ $n -lt 10 ]; do
              n=$((n + 1))
              if [ $name = pre-push ]; then out=$(sh scripts/check-commit-messages.sh --self-test-pre-push 2>&1); else out=$(sh scripts/ci-commit-messages.sh --self-test 2>&1); fi
              code=$?
              if [ $code = 0 ]; then p=$((p + 1)); else printf '%s\n' "$out" | grep -E '^FAIL' | head -5; fi
              echo "loop $name round=$n exit=$code seconds=$((SECONDS - start))"
            done
            echo "loop $name job=macos rounds=$n passes=$p seconds=$((SECONDS - start))"
            [ $p = $n ] || failed=1
          done
          echo "loop-failed=$failed"
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    if: false
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 19-home-paths
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 19-home-paths
      - name: Bounded loop of the cases of hook-2 (scratch only)
        if: always()
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          set +e
          failed=0
          utf8=$(locale -a 2>/dev/null | grep -m 1 -E '^(en_US|C)\.(UTF-8|utf8)$')
          echo "loop utf8-locale=${utf8:-none}"
          d=$(mktemp -d "$RUNNER_TEMP/loop.XXXXXX")
          git init -q "$d/r"
          git -C "$d/r" -c commit.gpgsign=false commit -q --allow-empty -m root
          root=$(git -C "$d/r" rev-parse HEAD)
          tree=$(git -C "$d/r" rev-parse 'HEAD^{tree}')
          mkdir "$d/s"
          sed "s/^NEWEST_EXEMPT_COMMIT=.*/NEWEST_EXEMPT_COMMIT=$root/" scripts/check-commit-messages.sh >"$d/s/check-commit-messages.sh"
          cp scripts/commit-range.sh "$d/s/commit-range.sh"
          start=$SECONDS; runs=0; p=0
          for i in $(seq 200); do
            c=$(git -C "$d/r" commit-tree "$tree" -p "$root" -m "round $i")
            for loc in C $utf8; do
              runs=$((runs + 1))
              out=$(cd "$d/r" && printf 'refs/heads/x %s refs/heads/x %s\n' "$c" "A${c#?}" | LC_ALL=$loc sh "$d/s/check-commit-messages.sh" --pre-push proof 2>&1)
              code=$?
              if [ $code = 2 ] && printf '%s' "$out" | grep -q 'cannot read this line'; then p=$((p + 1)); else echo "loop object-id round=$i locale=$loc exit=$code"; fi
            done
          done
          echo "loop object-id-lines job=windows rounds=200 runs=$runs passes=$p seconds=$((SECONDS - start))"
          [ $p = $runs ] || failed=1
          start=$SECONDS; n=0; p=0
          while [ $n -lt 8 ] || [ $((SECONDS - start)) -lt 1200 ]; do
            n=$((n + 1))
            out=$(sh scripts/ci/run-ci-d.sh windows --self-test 19-home-paths 2>&1)
            code=$?
            if [ $code = 0 ]; then p=$((p + 1)); else printf '%s\n' "$out" | grep -E 'wrong verdict|^FAIL' | head -5; fi
            echo "loop 19-home-paths round=$n exit=$code seconds=$((SECONDS - start))"
          done
          echo "loop 19-home-paths job=windows rounds=$n passes=$p seconds=$((SECONDS - start))"
          [ $p = $n ] || failed=1
          echo "loop-failed=$failed"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
