name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 50-windows-functional
      - name: adv1 win-3e live probes
        if: ${{ !cancelled() }}
        shell: bash
        env:
          HALVO_WF_FORM: short
        run: |
          set +e
          cat >"$RUNNER_TEMP/adv1-edit.pl" <<'ADV1_PL'
          use strict;
          use warnings;
          sub slurp {
            my ($p) = @_;
            open(my $fh, '<', $p) or exit 4;
            binmode $fh;
            local $/;
            my $s = <$fh>;
            close $fh;
            $s =~ s/\r\n/\n/g;
            return $s;
          }
          my ($mode, $file, $a, $b) = @ARGV;
          open(my $in, '<', $file) or exit 4;
          binmode $in;
          local $/;
          my $text = <$in>;
          close $in;
          my $crlf = ($text =~ /\r\n/) ? 1 : 0;
          $text =~ s/\r\n/\n/g;
          if ($mode eq 'append') {
            my $add = slurp($a);
            $text .= "\n" . $add;
          } elsif ($mode eq 'replace') {
            my $old = slurp($a);
            my $new = slurp($b);
            my $count = () = $text =~ /\Q$old\E/g;
            exit 3 if $count != 1;
            $text =~ s/\Q$old\E/$new/;
          } else {
            exit 2;
          }
          $text =~ s/\n/\r\n/g if $crlf;
          open(my $out, '>', $file) or exit 5;
          binmode $out;
          print $out $text;
          close $out;
          exit 0;
          ADV1_PL

          build_wf() {
            tag=$1
            cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/adv1-build.json" 2>"$RUNNER_TEMP/adv1-build.err"
            built=$?
            errs=$(grep -c '^error' "$RUNNER_TEMP/adv1-build.err")
            sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' "$RUNNER_TEMP/adv1-build.json" >"$RUNNER_TEMP/adv1-exe"
            exe=$(sed 's/\\\\/\//g' "$RUNNER_TEMP/adv1-exe")
            exe_ok=0
            if [ -n "$exe" ] && [ -f "$exe" ]; then
              exe_ok=1
            fi
            printf 'ADV1 BUILD tag=%s exit=%s errors=%s exe_ok=%s\n' "$tag" "$built" "$errs" "$exe_ok"
            [ "$built" -eq 0 ] && [ "$exe_ok" -eq 1 ]
          }

          run_exact() {
            tag=$1
            test_name=$2
            timeout 360 "$exe" --ignored --exact --nocapture "$test_name" </dev/null >"$RUNNER_TEMP/adv1-run.raw" 2>&1
            code=$?
            tr -d '\r' <"$RUNNER_TEMP/adv1-run.raw" >"$RUNNER_TEMP/adv1-run.log"
            ok_one=$(grep -c '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/adv1-run.log")
            panics=$(grep -c ' panicked at ' "$RUNNER_TEMP/adv1-run.log")
            printf 'ADV1 RUN tag=%s test=%s exit=%s passed_one=%s panics=%s\n' "$tag" "$test_name" "$code" "$ok_one" "$panics"
            grep -E '^(ADV1 |TF [^ ]+ (control=|session=|summary |phase=.*passed=|phase=.*round=0 ))' "$RUNNER_TEMP/adv1-run.log"
          }

          run_all_eight_kinds_cases() {
            tag=$1
            passed=0
            for tc in \
              stall::kinds::a_phase_between_the_two_controls_of_its_own_session_passes \
              stall::kinds::a_phase_that_the_controls_of_another_session_bracket_fails \
              stall::kinds::a_phase_whose_two_controls_come_from_two_sessions_fails \
              stall::kinds::a_phase_before_the_before_control_or_after_the_after_control_fails \
              stall::kinds::a_phase_whose_control_recorded_fewer_than_five_letters_fails \
              stall::kinds::each_check_of_a_phase_fails_its_own_fault_in_each_family \
              stall::kinds::a_native_phase_fails_each_of_its_own_faults \
              stall::kinds::the_kinds_hold_one_phase_for_each_test_and_sub_case_that_they_replace
            do
              timeout 360 "$exe" --ignored --exact --nocapture "$tc" </dev/null >"$RUNNER_TEMP/adv1-k.raw" 2>&1
              c=$?
              tr -d '\r' <"$RUNNER_TEMP/adv1-k.raw" >"$RUNNER_TEMP/adv1-k.log"
              if [ "$c" -eq 0 ] && grep -q '^test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/adv1-k.log"; then
                passed=$((passed + 1))
              else
                printf 'ADV1 KINDS_CASE_FAIL tag=%s test=%s exit=%s\n' "$tag" "$tc" "$c"
              fi
            done
            printf 'ADV1 KINDS_EIGHT tag=%s passed=%s of=8\n' "$tag" "$passed"
          }

          stall=crates/halvo-capture/tests/stall/mod.rs
          kinds=crates/halvo-capture/tests/stall/kinds.rs
          input_rs=crates/halvo-capture/src/windows/input.rs
          sec_rs=crates/halvo-capture/src/windows/secure_input.rs

          # --- P1: live open-latch audit across all 7 kinds ---
          cat >"$RUNNER_TEMP/old.txt" <<'ADV1_EOF'
                  let _ = seam::take();
                  let before = keyboard.health().counters;
          ADV1_EOF
          cat >"$RUNNER_TEMP/new.txt" <<'ADV1_EOF'
                  let _ = seam::take();
                  {
                      let latches_s = keyboard.open_latches().unwrap_or_default();
                      let open_n: usize = latches_s
                          .strip_prefix("count=")
                          .and_then(|rest| rest.split_whitespace().next())
                          .and_then(|n| n.parse().ok())
                          .unwrap_or(999);
                      let based_n = latches_s.matches("based=1").count();
                      println!(
                          "ADV1 P1_BEFORE_ROUND test={} phase={} round={} open_latches={} based={}",
                          test, phase.name, round, open_n, based_n
                      );
                  }
                  let before = keyboard.health().counters;
          ADV1_EOF
          perl "$RUNNER_TEMP/adv1-edit.pl" replace "$stall" "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/new.txt"
          a1=$?
          cat >"$RUNNER_TEMP/old.txt" <<'ADV1_EOF'
                  let recorded = control(test, "after", &mut fixture, &events);
          ADV1_EOF
          cat >"$RUNNER_TEMP/new.txt" <<'ADV1_EOF'
                  {
                      let latches_s = keyboard.open_latches().unwrap_or_default();
                      let open_n: usize = latches_s
                          .strip_prefix("count=")
                          .and_then(|rest| rest.split_whitespace().next())
                          .and_then(|n| n.parse().ok())
                          .unwrap_or(999);
                      let based_n = latches_s.matches("based=1").count();
                      println!(
                          "ADV1 P1_BEFORE_CONTROL_AFTER test={} open_latches={} based={}",
                          test, open_n, based_n
                      );
                  }
                  let recorded = control(test, "after", &mut fixture, &events);
                  {
                      let latches_s = keyboard.open_latches().unwrap_or_default();
                      let open_n: usize = latches_s
                          .strip_prefix("count=")
                          .and_then(|rest| rest.split_whitespace().next())
                          .and_then(|n| n.parse().ok())
                          .unwrap_or(999);
                      println!(
                          "ADV1 P1_AFTER_CONTROL_AFTER test={} open_latches={} control_after={}",
                          test, open_n, recorded
                      );
                  }
          ADV1_EOF
          perl "$RUNNER_TEMP/adv1-edit.pl" replace "$stall" "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/new.txt"
          a2=$?
          printf 'ADV1 APPLY tag=P1 a1=%s a2=%s\n' "$a1" "$a2"
          if [ "$a1" -eq 0 ] && [ "$a2" -eq 0 ] && build_wf P1; then
            for k in \
              stall::tab_then_letters_while_the_program_sleeps_at_each_wait \
              stall::tab_then_letters_while_the_program_serves_sent_messages_at_each_wait \
              stall::click_then_letters_while_the_program_sleeps_at_each_wait \
              stall::click_then_letters_while_the_program_serves_sent_messages_at_each_wait \
              stall::a_second_field_and_a_window_of_another_thread_while_the_program_waits_300_ms \
              stall::enter_a_tab_out_and_a_focus_move_in_two_steps_record_no_letter \
              stall::a_masked_edit_and_a_focus_notice_that_the_system_does_not_deliver_record_no_letter
            do
              run_exact P1 "$k"
            done
          fi
          git checkout -- "$stall"

          # --- P1b + P3 + P5: four probe tests appended to stall/mod.rs ---
          cat >"$RUNNER_TEMP/add.rs" <<'ADV1_PROBES_RS'
          fn adv1_parse_open_latches(raw: &str) -> (usize, usize) {
              let count = raw
                  .strip_prefix("count=")
                  .and_then(|rest| rest.split_whitespace().next())
                  .and_then(|n| n.parse().ok())
                  .unwrap_or(999);
              let based = raw.matches("based=1").count();
              (count, based)
          }

          #[test]
          #[ignore = "probe: adv1 P1b fresh session entering two-step"]
          fn adv1_probe_two_step_plain_letter_fresh_session() {
              let test = "adv1-p1b-fresh";
              let mut session = Session::open(test);
              let _ = session.fixture.ask(CMD_RESET, 0, "reset");
              let _ = session.events.drain_for(Duration::from_millis(400));
              let _ = seam::take();
              let (open_n, based_n) =
                  adv1_parse_open_latches(&session.keyboard.open_latches().unwrap_or_default());
              let _ = send(&key_pair(VK_A));
              let seen = session.events.drain_for(Duration::from_millis(900));
              let decided = Decisions::of(&seam::take());
              let state = session.fixture.ask(CMD_STATE, 0, "state");
              let ks = seen
                  .iter()
                  .filter(|e| e.modality == Modality::Keystroke)
                  .count();
              let controls = session.close();
              println!(
                  "ADV1 P1B_FRESH open_latches={} based={} letters_plain={} keystroke_events={} letters_recorded={} letters_withheld={} first_letter_rule={} control_before={} control_after={}",
                  open_n,
                  based_n,
                  get(&state, "letters_plain"),
                  ks,
                  decided.letters_recorded,
                  decided.letters_withheld,
                  rule_index(decided.first_letter_rule),
                  controls.before.recorded,
                  controls.after.recorded,
              );
          }

          #[test]
          #[ignore = "probe: adv1 P1b after stall-enter and stall-tab-out entering two-step"]
          fn adv1_probe_two_step_plain_letter_after_tab_out() {
              let test = "adv1-p1b-after-tab-out";
              let mut session = Session::open(test);
              let phases = Kind::EnterTabOutAndTwoStep.phases();
              let _ = session.rounds(phases[0]);
              let _ = session.rounds(phases[1]);
              let _ = session.fixture.ask(CMD_RESET, 0, "reset");
              let _ = session.events.drain_for(Duration::from_millis(400));
              let _ = seam::take();
              let (open_n, based_n) =
                  adv1_parse_open_latches(&session.keyboard.open_latches().unwrap_or_default());
              let _ = send(&key_pair(VK_A));
              let seen = session.events.drain_for(Duration::from_millis(900));
              let decided = Decisions::of(&seam::take());
              let state = session.fixture.ask(CMD_STATE, 0, "state");
              let ks = seen
                  .iter()
                  .filter(|e| e.modality == Modality::Keystroke)
                  .count();
              let (open_pre_close, based_pre_close) =
                  adv1_parse_open_latches(&session.keyboard.open_latches().unwrap_or_default());
              let controls = session.close();
              println!(
                  "ADV1 P1B_AFTER_TAB_OUT open_latches={} based={} letters_plain={} keystroke_events={} letters_recorded={} letters_withheld={} first_letter_rule={} open_before_close={} based_before_close={} control_before={} control_after={}",
                  open_n,
                  based_n,
                  get(&state, "letters_plain"),
                  ks,
                  decided.letters_recorded,
                  decided.letters_withheld,
                  rule_index(decided.first_letter_rule),
                  open_pre_close,
                  based_pre_close,
                  controls.before.recorded,
                  controls.after.recorded,
              );
          }

          #[test]
          #[ignore = "probe: adv1 P3 control letters from another window"]
          fn adv1_probe_control_letters_from_another_window() {
              let test = "adv1-p3-other-ctrl";
              let mut session = Session::open(test);
              let run = session.rounds(Kind::TabSleeps.phases()[0]);
              let other_thread = std::thread::spawn(|| {
                  std::thread::sleep(Duration::from_millis(1200));
                  let other = FixtureWindow::create_named(
                      "HalvoVerifyAdvOther",
                      "halvo-verify-adv-other",
                  );
                  let other_plain = other.edit(WS_TABSTOP, 10);
                  let front = other.activate();
                  let focused = focus_on(other_plain);
                  pump_thread(Duration::from_millis(2000));
                  let len = text_len(other_plain);
                  drop(other);
                  (front.is_some(), focused, len)
              });
              let controls = session.close();
              let (other_fg, other_focused, other_len) =
                  other_thread.join().unwrap_or((false, false, -1));
              let verdict_ok = kinds::verdict(&run, &controls).is_ok();
              println!(
                  "ADV1 P3_OTHER_WINDOW other_fg={} other_focused={} other_len={} control_before={} control_after={} verdict_ok={}",
                  u8::from(other_fg),
                  u8::from(other_focused),
                  other_len,
                  controls.before.recorded,
                  controls.after.recorded,
                  u8::from(verdict_ok),
              );
          }

          #[test]
          #[ignore = "probe: adv1 P5 verdict boundary and late_at_the_end gaps"]
          fn adv1_probe_verdict_gaps() {
              let controls_ok = Controls {
                  before: ControlRead {
                      step: Step { session: 1, at: 0 },
                      recorded: CONTROL_LETTERS,
                  },
                  after: ControlRead {
                      step: Step { session: 1, at: 2 },
                      recorded: CONTROL_LETTERS,
                  },
                  late_at_the_end: 0,
              };
              let controls_late = Controls {
                  late_at_the_end: 1,
                  ..controls_ok
              };
              let make_rounds = |totals: Totals, checks: kinds::Checks| PhaseRun {
                  test: "adv1-p5",
                  name: "p5",
                  wait: Wait::Sleeps,
                  step: Step { session: 1, at: 1 },
                  outcome: Outcome::Rounds { totals, checks },
              };
              let enter_zero =
                  kinds::verdict(&make_rounds(Totals::default(), kinds::Checks::Enter), &controls_ok)
                      .is_ok();
              let tab_out_zero =
                  kinds::verdict(&make_rounds(Totals::default(), kinds::Checks::TabOut), &controls_ok)
                      .is_ok();
              let ctrl_sink_zero_counted = kinds::verdict(
                  &make_rounds(
                      Totals {
                          rounds: 20,
                          counted: 0,
                          ..Totals::default()
                      },
                      kinds::Checks::ControlsAndSink,
                  ),
                  &controls_ok,
              )
              .is_ok();
              let stall_ok_totals = Totals {
                  rounds: 1,
                  counted: 1,
                  ..Totals::default()
              };
              let stall_ignores_late_end = kinds::verdict(
                  &make_rounds(stall_ok_totals, kinds::Checks::Stall),
                  &controls_late,
              )
              .is_ok();
              let native_late_run = PhaseRun {
                  test: "adv1-p5",
                  name: "p5-native",
                  wait: Wait::Sleeps,
                  step: Step { session: 1, at: 1 },
                  outcome: Outcome::Native {
                      rounds: 1,
                      counted: 1,
                      recorded: 0,
                  },
              };
              let native_rejects_late_end =
                  kinds::verdict(&native_late_run, &controls_late).is_err();
              println!(
                  "ADV1 P5_VERDICT_GAPS enter_zero_ok={} tab_out_zero_ok={} controls_sink_zero_counted_ok={} stall_ignores_late_end_ok={} native_rejects_late_end={}",
                  u8::from(enter_zero),
                  u8::from(tab_out_zero),
                  u8::from(ctrl_sink_zero_counted),
                  u8::from(stall_ignores_late_end),
                  u8::from(native_rejects_late_end),
              );
          }
          ADV1_PROBES_RS
          perl "$RUNNER_TEMP/adv1-edit.pl" append "$stall" "$RUNNER_TEMP/add.rs"
          ap=$?
          printf 'ADV1 APPLY tag=P1B_P3_P5 exit=%s\n' "$ap"
          if [ "$ap" -eq 0 ] && build_wf P1B_P3_P5; then
            run_exact P1B_FRESH stall::adv1_probe_two_step_plain_letter_fresh_session
            run_exact P1B_AFTER_TAB_OUT stall::adv1_probe_two_step_plain_letter_after_tab_out
            run_exact P3_OTHER_WINDOW stall::adv1_probe_control_letters_from_another_window
            run_exact P5_VERDICT_GAPS stall::adv1_probe_verdict_gaps
          fi
          git checkout -- "$stall"

          # --- P2: sticky late_events + verdict ignoring late_at_the_end for Outcome::Rounds ---
          cat >"$RUNNER_TEMP/old.txt" <<'ADV1_EOF'
                  if lag_ms > ms_of(crate::secure_input::LATE_KEY_MAX) {
          ADV1_EOF
          cat >"$RUNNER_TEMP/new.txt" <<'ADV1_EOF'
                  if true {
          ADV1_EOF
          perl "$RUNNER_TEMP/adv1-edit.pl" replace "$input_rs" "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/new.txt"
          ap=$?
          printf 'ADV1 APPLY tag=P2 exit=%s\n' "$ap"
          if [ "$ap" -eq 0 ] && build_wf P2; then
            run_exact P2_TAB_SLEEPS stall::tab_then_letters_while_the_program_sleeps_at_each_wait
            run_exact P2_MASK_STALE stall::a_masked_edit_and_a_focus_notice_that_the_system_does_not_deliver_record_no_letter
            printf 'ADV1 P2_MASK_LATE_REASON count=%s\n' "$(grep -c -F "the source's late value moved" "$RUNNER_TEMP/adv1-run.log")"
          fi
          git checkout -- "$input_rs"

          # --- P4a: M01 (Checks::Stall -> ControlsAndSink) + broken PasswordGate::decide ---
          cat >"$RUNNER_TEMP/old.txt" <<'ADV1_EOF'
                  let answer = match rule {
                      Rule::NotClearedInTime | Rule::ClicksNotForwarded => Err(Withheld::Unknown),
                      _ => check(&PasswordFieldProbe(reading), Some(age)),
                  };
          ADV1_EOF
          cat >"$RUNNER_TEMP/new.txt" <<'ADV1_EOF'
                  let _ = (rule, reading);
                  let answer = check(&PasswordFieldProbe(SecureInputReading::Inactive), Some(age));
          ADV1_EOF
          perl "$RUNNER_TEMP/adv1-edit.pl" replace "$sec_rs" "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/new.txt"
          a_sec=$?
          cat >"$RUNNER_TEMP/old.txt" <<'ADV1_EOF'
                  landing: Landing::Password,
                  checks: Checks::Stall,
          ADV1_EOF
          cat >"$RUNNER_TEMP/new.txt" <<'ADV1_EOF'
                  landing: Landing::Password,
                  checks: Checks::ControlsAndSink,
          ADV1_EOF
          perl "$RUNNER_TEMP/adv1-edit.pl" replace "$kinds" "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/new.txt"
          a_m01=$?
          printf 'ADV1 APPLY tag=P4A sec=%s m01=%s\n' "$a_sec" "$a_m01"
          if [ "$a_sec" -eq 0 ] && [ "$a_m01" -eq 0 ] && build_wf P4A; then
            run_all_eight_kinds_cases P4A
            run_exact P4A_TAB_SLEEPS stall::tab_then_letters_while_the_program_sleeps_at_each_wait
          fi
          git checkout -- "$kinds"

          # --- P4b: M04a (Totals::add drops letters_recorded) + same broken PasswordGate::decide ---
          cat >"$RUNNER_TEMP/old.txt" <<'ADV1_EOF'
                  self.letters_recorded += other.letters_recorded;
          ADV1_EOF
          cat >"$RUNNER_TEMP/new.txt" <<'ADV1_EOF'
                  // adv1 M04a: dropped self.letters_recorded += other.letters_recorded
          ADV1_EOF
          perl "$RUNNER_TEMP/adv1-edit.pl" replace "$kinds" "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/new.txt"
          a_m04a=$?
          printf 'ADV1 APPLY tag=P4B sec=%s m04a=%s\n' "$a_sec" "$a_m04a"
          if [ "$a_sec" -eq 0 ] && [ "$a_m04a" -eq 0 ] && build_wf P4B; then
            run_all_eight_kinds_cases P4B
            run_exact P4B_TAB_SLEEPS stall::tab_then_letters_while_the_program_sleeps_at_each_wait
          fi
          git checkout -- "$kinds" "$sec_rs"

          # --- P4c: M06 (empty Kind::ClickSleeps, phases moved into TabSleeps) ---
          cat >"$RUNNER_TEMP/old.txt" <<'ADV1_EOF'
                      Kind::TabSleeps => at_each_wait(Lead::Tab, Wait::Sleeps, TAB_SLEEPS),
                      Kind::TabServes => at_each_wait(Lead::Tab, Wait::ServesSent, TAB_SERVES),
                      Kind::ClickSleeps => at_each_wait(Lead::Click, Wait::Sleeps, CLICK_SLEEPS),
          ADV1_EOF
          cat >"$RUNNER_TEMP/new.txt" <<'ADV1_EOF'
                      Kind::TabSleeps => {
                          let mut v: Vec<Phase> = at_each_wait(Lead::Tab, Wait::Sleeps, TAB_SLEEPS);
                          v.extend(at_each_wait(Lead::Click, Wait::Sleeps, CLICK_SLEEPS));
                          v
                      }
                      Kind::TabServes => at_each_wait(Lead::Tab, Wait::ServesSent, TAB_SERVES),
                      Kind::ClickSleeps => Vec::new(),
          ADV1_EOF
          perl "$RUNNER_TEMP/adv1-edit.pl" replace "$kinds" "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/new.txt"
          a_m06=$?
          printf 'ADV1 APPLY tag=P4C m06=%s\n' "$a_m06"
          if [ "$a_m06" -eq 0 ] && build_wf P4C; then
            run_all_eight_kinds_cases P4C
            run_exact P4C_CLICK_SLEEPS stall::click_then_letters_while_the_program_sleeps_at_each_wait
          fi
          git checkout -- "$kinds"

          # --- P4d: M05 (swap stall-tab-out before stall-enter) ---
          cat >"$RUNNER_TEMP/old.txt" <<'ADV1_EOF'
                      Kind::EnterTabOutAndTwoStep => vec![
                          Phase {
                              letters_through_the_wait: false,
                              letters_after: 4,
                              landing: Landing::Plain,
                              checks: Checks::Enter,
                              ..phase(
                                  "stall-enter",
                                  "enter_then_five_letters",
                                  Lead::Enter,
                                  Wait::Sleeps,
                                  0,
                              )
                          },
                          Phase {
                              letters_through_the_wait: false,
                              start_in_password: true,
                              landing: Landing::Plain,
                              checks: Checks::TabOut,
                              ..phase(
                                  "stall-tab-out",
                                  "tab_out_then_a_letter",
                                  Lead::Tab,
                                  Wait::Sleeps,
                                  0,
                              )
                          },
          ADV1_EOF
          cat >"$RUNNER_TEMP/new.txt" <<'ADV1_EOF'
                      Kind::EnterTabOutAndTwoStep => vec![
                          Phase {
                              letters_through_the_wait: false,
                              start_in_password: true,
                              landing: Landing::Plain,
                              checks: Checks::TabOut,
                              ..phase(
                                  "stall-tab-out",
                                  "tab_out_then_a_letter",
                                  Lead::Tab,
                                  Wait::Sleeps,
                                  0,
                              )
                          },
                          Phase {
                              letters_through_the_wait: false,
                              letters_after: 4,
                              landing: Landing::Plain,
                              checks: Checks::Enter,
                              ..phase(
                                  "stall-enter",
                                  "enter_then_five_letters",
                                  Lead::Enter,
                                  Wait::Sleeps,
                                  0,
                              )
                          },
          ADV1_EOF
          perl "$RUNNER_TEMP/adv1-edit.pl" replace "$kinds" "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/new.txt"
          a_m05=$?
          printf 'ADV1 APPLY tag=P4D m05=%s\n' "$a_m05"
          if [ "$a_m05" -eq 0 ] && build_wf P4D; then
            run_all_eight_kinds_cases P4D
            run_exact P4D_ENTER_KIND stall::enter_a_tab_out_and_a_focus_move_in_two_steps_record_no_letter
            printf 'ADV1 P4D_WITHHELD_REASON count=%s\n' "$(grep -c -F "keys_withheld did not read yes" "$RUNNER_TEMP/adv1-run.log")"
          fi

          # --- P4e: M05 + M08 (counted > 0 -> counted > 1) ---
          cat >"$RUNNER_TEMP/old.txt" <<'ADV1_EOF'
                          totals.withheld_set == 0 && totals.counted > 0,
          ADV1_EOF
          cat >"$RUNNER_TEMP/new.txt" <<'ADV1_EOF'
                          totals.withheld_set == 0 && totals.counted > 1,
          ADV1_EOF
          perl "$RUNNER_TEMP/adv1-edit.pl" replace "$kinds" "$RUNNER_TEMP/old.txt" "$RUNNER_TEMP/new.txt"
          a_m08=$?
          printf 'ADV1 APPLY tag=P4E m05=%s m08=%s\n' "$a_m05" "$a_m08"
          if [ "$a_m05" -eq 0 ] && [ "$a_m08" -eq 0 ] && build_wf P4E; then
            run_all_eight_kinds_cases P4E
            run_exact P4E_ENTER_KIND stall::enter_a_tab_out_and_a_focus_move_in_two_steps_record_no_letter
          fi

          git checkout -- "$stall" "$kinds" "$input_rs" "$sec_rs"
          cargo test --locked -p halvo-capture --test windows_functional --no-run >"$RUNNER_TEMP/adv1-back.log" 2>&1
          printf 'ADV1 DONE rebuild_exit=%s status_lines=%s\n' "$?" "$(git status --porcelain --untracked-files=no | grep -c '')"
          exit 0
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
