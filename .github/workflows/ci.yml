          [ "$#" -eq "$runs" ] || bad=1
          for c in $OWN_ONLY; do
            total=$(cat "$out"/run-*.txt 2>/dev/null | grep -c "^case run-ci-d/$c want=")
            pass=$(cat "$out"/run-*.txt 2>/dev/null | grep -E "^case run-ci-d/$c want=" | awk '{ split($3, w, "="); split($4, g, "="); if (w[2] == g[2]) n++ } END { print n + 0 }')
            echo "case $c: $pass of $total as wanted"
            [ "$pass" -eq "$runs" ] && [ "$total" -eq "$runs" ] || bad=1
          done
          for f in "$out"/run-*.txt; do
            [ -e "$f" ] || continue
            grep -E "^case run-ci-d/.* want=" "$f" | awk '{ split($3, w, "="); split($4, g, "="); if (w[2] != g[2]) print }'
          done | sort | uniq -c
