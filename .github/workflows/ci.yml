name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - name: Self-tests that commit in throwaway repositories
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          sh scripts/check-commit-messages.sh --self-test-two-paths
          sh scripts/check-commit-messages.sh --self-test-pre-push
          sh scripts/ci-commit-messages.sh --self-test
          sh scripts/merge-pr.sh --self-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos
      - name: Loop of builder-49's new tests
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" - <<'LOOP_EOF'
          import json
          import os
          import re
          import subprocess
          import sys

          ROUNDS = int(os.environ.get("LOOP_ROUNDS", "200"))
          TARGETS = [
              ("halvo-agent-store", ["--test", "runner"], [
                  "a_log_line_is_held_to_the_day_of_its_at_and_to_the_clock_and_a_refused_body_stores_nothing",
                  "a_session_part_takes_the_local_day_of_the_request",
                  "a_log_and_a_propose_of_a_run_with_no_start_row_are_refused_with_binding_and_store_nothing",
                  "every_runner_body_of_a_run_with_no_start_row_of_its_agent_is_refused_with_binding",
                  "a_runner_body_after_the_bound_of_its_start_row_is_refused_with_binding",
                  "a_log_body_that_carries_the_start_row_s_event_or_count_is_refused_with_effect",
                  "newest_playbook_and_the_key_playbook_of_load_agree_over_drawn_rows",
                  "newest_playbook_of_an_agent_with_no_compile_number_is_none",
                  "a_log_line_of_the_run_that_is_no_start_row_starts_nothing",
                  "a_row_whose_at_is_negative_is_refused_with_day",
              ]),
              ("halvo-agent-store", ["--test", "effect"], [
                  "a_row_of_the_local_day_of_its_at_is_stored_and_the_utc_day_of_the_same_instant_is_refused",
                  "a_row_whose_day_is_a_day_off_the_day_of_its_at_is_refused",
                  "a_row_after_the_day_of_the_clock_or_outside_its_bound_is_refused",
                  "a_row_built_before_midnight_is_stored_and_repeated_just_after_it",
                  "a_repeat_of_the_last_row_is_answered_as_the_first_under_a_clock_that_would_refuse_it",
                  "a_releasing_or_committed_row_holds_the_approval_of_the_effect_s_last_approved_row",
                  "a_releasing_or_committed_row_after_cleared_holds_no_approval",
                  "a_row_that_differs_from_the_last_row_in_a_key_but_day_and_at_is_no_repeat",
                  "a_row_equal_to_the_last_row_but_for_day_and_at_is_a_repeat",
              ]),
              ("halvo-agent-store", ["--test", "end"], [
                  "end_run_of_a_run_with_no_start_row_stores_its_record_as_before",
                  "a_finish_dated_after_the_clock_or_outside_its_bound_is_refused_with_nothing_of_the_end_stored",
                  "end_run_and_the_moves_of_the_end_take_the_local_day_of_the_request",
                  "a_completed_finish_while_an_effect_of_the_run_is_open_is_refused_with_effect",
                  "a_completed_finish_after_every_effect_of_the_run_ended_is_stored",
                  "a_finish_whose_unknown_count_is_below_the_run_s_unknown_effects_after_the_moves_is_refused",
                  "finish_stores_each_key_of_the_run_s_list_as_given",
              ]),
              ("halvo-agent-store", ["--test", "coordinator"], [
                  "start_run_stores_one_start_row_from_the_request_s_clock",
                  "a_start_run_repeated_for_the_same_agent_and_workflow_is_answered_as_the_first_and_stores_nothing",
                  "a_start_run_of_a_run_that_another_agent_s_rows_name_is_refused_with_binding",
                  "a_start_run_after_the_run_s_end_is_refused_with_effect",
              ]),
              ("halvo-agent-store", ["--test", "memory"], [
                  "the_day_of_an_instant_is_the_day_of_the_store_s_calendar",
              ]),
              ("halvo-agent-store", ["--test", "checkpoint_bodies"], [
                  "checkpoint_stores_the_planned_row_and_then_the_made_row",
                  "checkpoint_refuses_a_row_that_does_not_follow_the_checkpoint_s_newest_row",
                  "checkpoint_is_held_to_the_rules_of_every_runner_body",
                  "list_checkpoints_reads_the_newest_planned_or_made_row_of_each_checkpoint_over_all_agents",
                  "list_checkpoints_says_whether_the_run_ended_and_the_state_of_its_edit_of_the_path",
                  "list_checkpoints_reads_the_cautious_state_when_two_edits_of_a_run_name_the_path",
                  "list_checkpoints_says_superseded_when_a_later_run_of_the_agent_committed_an_edit_of_the_path",
                  "list_checkpoints_pages_by_whole_runs_and_names_the_run_to_ask_after",
                  "mark_checkpoint_stores_the_next_row_of_a_planned_or_made_checkpoint_alone",
                  "mark_checkpoint_of_another_agent_s_checkpoint_or_workflow_is_refused",
                  "mark_checkpoint_of_an_agent_that_is_no_longer_the_workflow_s_marks_its_rows",
              ]),
              ("halvo-learn-store", ["--lib"], [
                  "tests::coordinator::list_refinements_stores_no_row_and_no_log_line_and_its_reply_holds_no_run_id",
              ]),
              ("halvo-learn-gate", ["--bin", "learn-gate"], [
                  "tests::host::the_gate_host_gives_the_agent_store_s_handler_the_clock_s_day_on_every_day_that_an_instant_can_hold",
                  "tests::host::after_the_last_day_of_an_instant_the_agent_store_s_day_stays_at_that_day",
              ]),
              ("halvo-schema", ["--test", "r3_frames"], [
                  "a_store_reply_takes_the_nine_error_names_and_the_seven_of_this_run",
              ]),
          ]

          RESULT = re.compile(r"^test result: ok\. (\d+) passed; 0 failed", re.M)
          failed = 0
          total = 0
          for package, target, names in TARGETS:
              build = subprocess.run(
                  ["cargo", "test", "--locked", "-p", package, *target, "--no-run", "--message-format=json"],
                  capture_output=True, text=True,
              )
              exes = []
              for line in build.stdout.splitlines():
                  try:
                      message = json.loads(line)
                  except ValueError:
                      continue
                  if message.get("reason") == "compiler-artifact" and message.get("executable") and message.get("profile", {}).get("test"):
                      if message["target"]["name"] in (target[-1], package.replace("-", "_")) or target[0] in ("--lib", "--bin"):
                          exes.append(message["executable"])
              exes = sorted(set(exes))
              if build.returncode != 0 or len(exes) != 1:
                  print(f"loop {package} {' '.join(target)}: build exit {build.returncode}, binaries {len(exes)}")
                  failed += 1
                  continue
              good = 0
              for _ in range(ROUNDS):
                  run = subprocess.run([exes[0], "--exact", "--test-threads", "4", *names], capture_output=True, text=True)
                  counts = [int(n) for n in RESULT.findall(run.stdout)]
                  if run.returncode == 0 and counts == [len(names)]:
                      good += 1
              total += good
              print(f"loop {package} {' '.join(target)}: tests {len(names)} rounds {ROUNDS} passed {good}")
              if good != ROUNDS:
                  failed += 1
          print(f"loop targets failed {failed} rounds passed {total}")
          sys.exit(1 if failed else 0)
          LOOP_EOF
      - name: Build
        shell: bash
        run: npm run tauri build
      - name: Version
        shell: bash
        run: test "$(target/release/bundle/macos/Halvo.app/Contents/MacOS/halvo --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-macos
          path: target/release/bundle/macos/Halvo.app
          if-no-files-found: error
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows
      - name: Loop of builder-49's new tests
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          "$PY" - <<'LOOP_EOF'
          import json
          import os
          import re
          import subprocess
          import sys

          ROUNDS = int(os.environ.get("LOOP_ROUNDS", "200"))
          TARGETS = [
              ("halvo-agent-store", ["--test", "runner"], [
                  "a_log_line_is_held_to_the_day_of_its_at_and_to_the_clock_and_a_refused_body_stores_nothing",
                  "a_session_part_takes_the_local_day_of_the_request",
                  "a_log_and_a_propose_of_a_run_with_no_start_row_are_refused_with_binding_and_store_nothing",
                  "every_runner_body_of_a_run_with_no_start_row_of_its_agent_is_refused_with_binding",
                  "a_runner_body_after_the_bound_of_its_start_row_is_refused_with_binding",
                  "a_log_body_that_carries_the_start_row_s_event_or_count_is_refused_with_effect",
                  "newest_playbook_and_the_key_playbook_of_load_agree_over_drawn_rows",
                  "newest_playbook_of_an_agent_with_no_compile_number_is_none",
                  "a_log_line_of_the_run_that_is_no_start_row_starts_nothing",
                  "a_row_whose_at_is_negative_is_refused_with_day",
              ]),
              ("halvo-agent-store", ["--test", "effect"], [
                  "a_row_of_the_local_day_of_its_at_is_stored_and_the_utc_day_of_the_same_instant_is_refused",
                  "a_row_whose_day_is_a_day_off_the_day_of_its_at_is_refused",
                  "a_row_after_the_day_of_the_clock_or_outside_its_bound_is_refused",
                  "a_row_built_before_midnight_is_stored_and_repeated_just_after_it",
                  "a_repeat_of_the_last_row_is_answered_as_the_first_under_a_clock_that_would_refuse_it",
                  "a_releasing_or_committed_row_holds_the_approval_of_the_effect_s_last_approved_row",
                  "a_releasing_or_committed_row_after_cleared_holds_no_approval",
                  "a_row_that_differs_from_the_last_row_in_a_key_but_day_and_at_is_no_repeat",
                  "a_row_equal_to_the_last_row_but_for_day_and_at_is_a_repeat",
              ]),
              ("halvo-agent-store", ["--test", "end"], [
                  "end_run_of_a_run_with_no_start_row_stores_its_record_as_before",
                  "a_finish_dated_after_the_clock_or_outside_its_bound_is_refused_with_nothing_of_the_end_stored",
                  "end_run_and_the_moves_of_the_end_take_the_local_day_of_the_request",
                  "a_completed_finish_while_an_effect_of_the_run_is_open_is_refused_with_effect",
                  "a_completed_finish_after_every_effect_of_the_run_ended_is_stored",
                  "a_finish_whose_unknown_count_is_below_the_run_s_unknown_effects_after_the_moves_is_refused",
                  "finish_stores_each_key_of_the_run_s_list_as_given",
              ]),
              ("halvo-agent-store", ["--test", "coordinator"], [
                  "start_run_stores_one_start_row_from_the_request_s_clock",
                  "a_start_run_repeated_for_the_same_agent_and_workflow_is_answered_as_the_first_and_stores_nothing",
                  "a_start_run_of_a_run_that_another_agent_s_rows_name_is_refused_with_binding",
                  "a_start_run_after_the_run_s_end_is_refused_with_effect",
              ]),
              ("halvo-agent-store", ["--test", "memory"], [
                  "the_day_of_an_instant_is_the_day_of_the_store_s_calendar",
              ]),
              ("halvo-agent-store", ["--test", "checkpoint_bodies"], [
                  "checkpoint_stores_the_planned_row_and_then_the_made_row",
                  "checkpoint_refuses_a_row_that_does_not_follow_the_checkpoint_s_newest_row",
                  "checkpoint_is_held_to_the_rules_of_every_runner_body",
                  "list_checkpoints_reads_the_newest_planned_or_made_row_of_each_checkpoint_over_all_agents",
                  "list_checkpoints_says_whether_the_run_ended_and_the_state_of_its_edit_of_the_path",
                  "list_checkpoints_reads_the_cautious_state_when_two_edits_of_a_run_name_the_path",
                  "list_checkpoints_says_superseded_when_a_later_run_of_the_agent_committed_an_edit_of_the_path",
                  "list_checkpoints_pages_by_whole_runs_and_names_the_run_to_ask_after",
                  "mark_checkpoint_stores_the_next_row_of_a_planned_or_made_checkpoint_alone",
                  "mark_checkpoint_of_another_agent_s_checkpoint_or_workflow_is_refused",
                  "mark_checkpoint_of_an_agent_that_is_no_longer_the_workflow_s_marks_its_rows",
              ]),
              ("halvo-learn-store", ["--lib"], [
                  "tests::coordinator::list_refinements_stores_no_row_and_no_log_line_and_its_reply_holds_no_run_id",
              ]),
              ("halvo-learn-gate", ["--bin", "learn-gate"], [
                  "tests::host::the_gate_host_gives_the_agent_store_s_handler_the_clock_s_day_on_every_day_that_an_instant_can_hold",
                  "tests::host::after_the_last_day_of_an_instant_the_agent_store_s_day_stays_at_that_day",
              ]),
              ("halvo-schema", ["--test", "r3_frames"], [
                  "a_store_reply_takes_the_nine_error_names_and_the_seven_of_this_run",
              ]),
          ]

          RESULT = re.compile(r"^test result: ok\. (\d+) passed; 0 failed", re.M)
          failed = 0
          total = 0
          for package, target, names in TARGETS:
              build = subprocess.run(
