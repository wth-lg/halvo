name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 20-schema
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 20-schema
      - name: Loop of the new tests of U1.1g (scratch)
        shell: bash
        run: |
          binary=$(cargo test --locked -p halvo-schema --test golden --no-run --message-format=json 2>/dev/null | sed -n 's/.*"executable":"\([^"]*golden[^"]*\)".*/\1/p' | tail -n 1 | sed 's#\\\\#/#g')
          test -x "$binary" || { echo "no test binary of tests/golden.rs"; exit 1; }
          status=0
          for test in names_with_writes_each_kind_and_family_name_that_it_is_handed_and_no_other every_kind_and_family_name_of_the_registry_is_a_line_of_the_names_file names_file_is_byte_for_byte_the_same_when_the_later_lists_leave_out_the_registry_names; do
            passed=0; failed=0; i=0
            while [ "$i" -lt 200 ]; do
              if "$binary" --exact "$test" --quiet >/dev/null 2>&1; then passed=$((passed + 1)); else failed=$((failed + 1)); fi
              i=$((i + 1))
            done
            echo "loop $test runs=200 passed=$passed failed=$failed"
            [ "$failed" -eq 0 ] || status=1
          done
          passed=0; failed=0; i=0
          while [ "$i" -lt 10 ]; do
            if sh scripts/r2/ci.d/20-schema.sh --self-test >"$RUNNER_TEMP/self-test-$i.txt" 2>&1; then passed=$((passed + 1)); else failed=$((failed + 1)); tail -n 3 "$RUNNER_TEMP/self-test-$i.txt"; fi
            i=$((i + 1))
          done
          echo "loop self-test:20-schema runs=10 passed=$passed failed=$failed; last: $(tail -n 1 "$RUNNER_TEMP/self-test-9.txt")"
          [ "$failed" -eq 0 ] || status=1
          exit "$status"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
