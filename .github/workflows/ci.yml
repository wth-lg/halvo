name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 19-control-links-no-store 21-tree-bans 19-home-paths
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 19-control-links-no-store 21-tree-bans 19-home-paths
      - name: control-2c tests 200 times
        shell: bash
        run: |
          set +e
          tmp="${RUNNER_TEMP:-/tmp}"
          found=0
          bad=0
          for bin in target/debug/deps/halvo_control-*; do
            case "$bin" in *.d|*.pdb|*.rlib|*.rmeta|*.lib|*.dll) continue ;; esac
            [ -f "$bin" ] && [ -x "$bin" ] || continue
            "$bin" --list >"$tmp/control-2c-list.txt" 2>&1
            tr -d '\r' <"$tmp/control-2c-list.txt" | sed -n 's/: test$//p' >"$tmp/control-2c-held.txt"
            want=""
            n=0
            for name in client::tests::e111_d_an_already_deleted_that_answers_no_request_is_its_own_error_with_the_id_and_not_a_kind_string client::tests::pl17_the_busy_of_a_life_that_is_ending_is_its_own_error_of_the_client client::tests::pl17_told_04_a_delete_while_capture_reads_pausing_answers_busy_and_deletes_nothing client::tests::with_every_source_off_a_claim_and_a_resume_read_faulted_no_source ctl_text::tests::ct12_a_deleted_reply_with_root_destroyed_unknown_prints_both_streams_of_c2_6_and_exits_0 ctl_text::tests::pl17_the_busy_of_a_life_that_is_ending_exits_75_with_a_line_that_names_what_did_not_happen instance_lock::tests::st36_a_link_whose_target_is_away_and_a_file_at_the_name_are_a_cause_of_their_own_from_the_read_and_the_take paths::tests::st36_a_file_at_the_data_directory_s_name_is_a_cause_of_its_own_and_never_a_first_run paths::tests::st36_a_link_whose_target_is_away_is_a_cause_of_its_own_and_a_link_to_a_directory_is_followed paths::tests::st36_check::a_chain_of_links_to_a_folder_is_followed_and_never_narrowed paths::tests::st36_check::a_data_directory_behind_a_parent_link_that_leads_nowhere_is_never_a_first_run paths::tests::st36_check::a_directory_never_reached_through_a_link_is_never_answered_as_linked_after_the_name_is_swapped paths::tests::st36_check::a_directory_of_another_owner_fails_through_the_seam_at_the_read_of_the_owner_and_is_not_narrowed paths::tests::st36_check::a_directory_reached_through_a_link_is_never_narrowed_even_after_the_name_is_swapped_after_the_take paths::tests::st36_check::a_link_loop_and_a_chain_of_links_that_ends_away_lead_nowhere paths::tests::st36_check::a_link_to_a_directory_of_mode_0700_passes_and_names_the_resolved_folder paths::tests::st36_check::a_link_to_a_directory_of_mode_0755_fails_the_check_and_nothing_is_narrowed paths::tests::st36_check::a_link_whose_target_is_away_and_a_file_at_the_name_give_their_cause_and_a_missing_directory_none paths::tests::st36_check::a_parent_that_is_a_link_is_no_fault paths::tests::st36_check::a_real_directory_of_mode_0755_is_tightened_to_0700_on_the_descriptor paths::tests::st36_check::the_resolved_folder_is_read_from_the_descriptor_and_not_from_a_link_pointed_elsewhere_after_the_take proto::tests::pl17_a_delete_answers_busy_while_capture_reads_pausing_and_the_typed_busy_in_a_life_that_is_ending_before_the_store_and_the_ids proto::tests::pl17_the_admission_of_each_request_by_form_mutation_in_flight_and_life proto::tests::pl17_the_busy_of_a_life_that_is_ending_carries_the_mark_ending_and_a_mark_beside_another_code_does_not_decode proto::tests::pl18_running_needs_a_required_source_and_an_empty_set_reads_faulted_no_source testing::tests::a_pause_asks_a_marked_line_that_reads_off_and_keeps_it_off_whatever_the_stop_answers testing::tests::pl17_a_claim_in_a_life_that_is_ending_is_served_and_starts_no_source testing::tests::pl17_a_pause_in_a_life_that_is_ending_persists_desired_paused_and_the_next_read_shows_it testing::tests::pl17_a_resume_in_a_life_that_is_ending_answers_the_status_as_it_stands_and_keeps_desired_and_the_hold testing::tests::pl17_in_a_life_that_is_ending_every_mutation_but_pause_and_resume_answers_the_typed_busy_and_writes_nothing testing::tests::pl17_in_a_stop_sequence_that_is_not_ending_a_pause_is_served_as_before_and_the_next_claim_starts_no_source testing::tests::pl17_mark_01_a_pause_in_a_life_that_is_ending_persists_desired_paused testing::tests::pl17_mark_02_a_resume_in_a_life_that_is_ending_beside_a_marked_source_starts_nothing testing::tests::pl17_the_flag_of_a_life_that_is_ending_makes_capture_read_pausing texts::tests::ct11_the_type_takes_the_three_kinds_of_status_the_client_offers_a_pause_and_a_delete_and_the_texts_promise_nothing; do
              if grep -qxF "$name" "$tmp/control-2c-held.txt"; then
                want="$want $name"
                n=$((n + 1))
              fi
            done
            [ "$n" -gt 0 ] || continue
            found=$((found + 1))
            pass=0
            other=0
            i=0
            while [ "$i" -lt 200 ]; do
              "$bin" --exact --test-threads 4 $want >"$tmp/control-2c-loop.txt" 2>&1
              code=$?
              ok=$(tr -d '\r' <"$tmp/control-2c-loop.txt" | grep -c "^test result: ok. $n passed; 0 failed")
              if [ "$code" = 0 ] && [ "$ok" = 1 ]; then
                pass=$((pass + 1))
              else
                other=$((other + 1))
                [ "$other" -gt 1 ] || tail -n 40 "$tmp/control-2c-loop.txt"
              fi
              i=$((i + 1))
            done
            echo "control-2c loop (macos): binary $(basename "$bin"): tests $n, runs 200, passes $pass, other $other"
            [ "$other" = 0 ] || bad=1
          done
          echo "control-2c loop (macos): binaries run: $found"
          [ "$found" -gt 0 ] && [ "$bad" = 0 ]
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
