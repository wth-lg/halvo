name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Crate tests
        shell: bash
        run: |
          cargo test -p halvo-coord --locked
          cargo test -p halvo-coord --locked -- --list > "$RUNNER_TEMP/test-list.txt" 2>/dev/null
          echo "test names $(grep -c ': test$' "$RUNNER_TEMP/test-list.txt")"
      - name: Words check
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 45-r4-words
      - name: Page harness fetch
        shell: bash
        run: sh tools/r4-page/fetch.sh "$RUNNER_TEMP/r4-page-browsers"
      - name: Agents view
        shell: bash
        run: |
          export R4_PAGE_BROWSERS="$RUNNER_TEMP/r4-page-browsers"
          start=$(date +%s)
          code=0
          node ui/tests/r4/agents/test.mjs || code=$?
          echo "seconds agents-view $(( $(date +%s) - start ))"
          exit $code
      - name: Tree unchanged
        shell: bash
        run: test -z "$(git status --porcelain)"

  windows:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Crate tests
        shell: bash
        run: |
          cargo test -p halvo-coord --locked
          cargo test -p halvo-coord --locked -- --list > "$RUNNER_TEMP/test-list.txt" 2>/dev/null
          echo "test names $(grep -c ': test$' "$RUNNER_TEMP/test-list.txt")"
      - name: Words check
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 45-r4-words
      - name: Page harness fetch
        shell: bash
        run: sh tools/r4-page/fetch.sh "$RUNNER_TEMP/r4-page-browsers"
      - name: Agents view
        shell: bash
        run: |
          export R4_PAGE_BROWSERS="$RUNNER_TEMP/r4-page-browsers"
          start=$(date +%s)
          code=0
          node ui/tests/r4/agents/test.mjs || code=$?
          echo "seconds agents-view $(( $(date +%s) - start ))"
          exit $code
      - name: Tree unchanged
        shell: bash
        run: test -z "$(git status --porcelain)"
