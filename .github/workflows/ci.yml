          step driver-self-test sh scripts/ci/run-ci-d.sh windows --self-test 10-egress || gate=1
          step driver sh scripts/ci/run-ci-d.sh windows 10-egress || gate=1
          mutant W2 'if ($Deny -eq 1) { $null = Add-Rules }' 'if ($false) { $null = Add-Rules }'
