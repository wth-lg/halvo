name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: the trial crate's build, its tests with the two browser tests, clippy and fmt; no row or cell (CP-161 P9)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: U0.7c CP-161 trial crate (scratch branch, never merged; counts only)
        if: always()
        timeout-minutes: 60
        shell: bash
        run: |
          set +e
          cd tools/r3-trials/web
          log="$RUNNER_TEMP/r3-web-test.log"
          cargo test --locked --no-fail-fast >"$log" 2>&1
          t=$?
          grep -E "^test .* (FAILED|ignored)$|^test result" "$log"
          grep -E "^test (relay|policy)::tests::(the_fence_passes|the_guard_on_a_built_table|a_grandchild_born|the_port_is_kept|a_process_that_took|a_table_unread_longer|a_broken_longer)" "$log"
          awk '/^---- .* stdout ----$/{p=1} /^failures:$/{p=0} p' "$log" | head -60
          R3_TEST_BROWSER="C:/Program Files/Google/Chrome/Application/chrome.exe" cargo test --locked -- --ignored >"$log.2" 2>&1
          ti=$?
          grep -E "^test |^test result|panicked|left:|right:" "$log.2" | head -30
          s0=$(date +%s)
          cargo clippy --locked --all-targets -- -D warnings >"$log.3" 2>&1
          c=$?
          echo "clippy seconds=$(( $(date +%s) - s0 )) exit=$c after=the_test_build"
          cargo fmt --check >/dev/null 2>&1
          f=$?
          echo "trial crate=web test_exit=$t ignored_exit=$ti clippy_exit=$c fmt_exit=$f clippy_error_lines=$(grep -c '^error' "$log.3")"
          [ "$t" -eq 0 ] && [ "$ti" -eq 0 ] && [ "$c" -eq 0 ] && [ "$f" -eq 0 ]
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
