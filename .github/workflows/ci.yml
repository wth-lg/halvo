name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 15-r3-test-dirs
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 15-r3-test-dirs
      - name: U2.6 round 2 shipped files read for the fence's marker, and the control
        if: always()
        shell: bash
        run: |
          set +e
          node crates/halvo-web/fence/shipped.mjs --self-test
          a=$?
          node crates/halvo-web/fence/shipped.mjs
          b=$?
          node crates/halvo-web/fence/shipped.mjs --control
          c=$?
          echo "shipped self_test=$a check=$b control=$c"
          [ "$a" -eq 0 ] && [ "$b" -eq 0 ] && [ "$c" -eq 0 ]
      - name: U2.6 round 2 loop of the round's tests
        if: always()
        shell: bash
        run: |
          python - windows <<'PYEOF'
          import json, os, subprocess, sys
          job = sys.argv[1]
          spec = """halvo_web guard::tests::rc_run_guard_opens_the_watch_of_its_executor_and_reads_its_end_from_it 200
          halvo_web procs::tests::e4_a_watch_of_an_executor_with_another_creation_time_reads_it_gone 200"""
          built = subprocess.run(["cargo", "test", "-p", "halvo-web", "--locked", "--no-run", "--message-format=json"],
                                 capture_output=True, text=True)
          if built.returncode != 0:
              print(f"loop build exit={built.returncode}")
              sys.exit(1)
          exes = {}
          for line in built.stdout.splitlines():
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if m.get("reason") != "compiler-artifact" or not m.get("executable"):
                  continue
              if not m.get("profile", {}).get("test"):
                  continue
              if not m.get("manifest_path", "").replace("\\", "/").endswith("crates/halvo-web/Cargo.toml"):
                  continue
              exes[m["target"]["name"]] = m["executable"]
          bad = 0
          rows = spec.strip().splitlines()
          for row in rows:
              target, name, runs = row.split()
              runs = int(runs)
              exe = exes.get(target)
              if exe is None:
                  print(f"loop target={target} name={name} runs=0 ok=0 expected=1 cause=no_target")
                  bad += 1
                  continue
              ok, shown = 0, False
              for i in range(runs):
                  try:
                      r = subprocess.run([exe, "--exact", name, "--test-threads=1"], capture_output=True, text=True,
                                         timeout=600)
                      out = r.stdout
                  except subprocess.TimeoutExpired:
                      out = ""
                  if "test result: ok. 1 passed;" in out:
                      ok += 1
                  elif not shown:
                      shown = True
                      print(f"loop target={target} name={name} first_miss_run={i + 1}")
                      print("\n".join(out.splitlines()[-30:]))
              print(f"loop target={target} name={name} runs={runs} ok={ok} expected=1", flush=True)
              bad += 0 if ok == runs else 1
          print(f"loop job={job} tests={len(rows)} bad={bad}")
          sys.exit(1 if bad else 0)
          PYEOF
      - name: U2.6 round 2 hosted copies, rows f (the fence off, each test target) and d
        if: always()
        shell: bash
        run: |
          python - crates/halvo-web <<'PYEOF'
          """hosted_copies.py: the copies of round 2 of U2.6 that run on a hosted runner alone (CP-220).

            python hosted_copies.py <crate dir>

          Rows f (the fence turned off, copy F1 of round 1: the dev-dependency without the feature, for each
          of the five test targets) and d (fence/shipped.mjs without the line that marks a program, its
          self-test alone). Each row applies one exact replacement, runs, prints what happened, and restores
          the crate with `git checkout`. A row of f is caught when its target's fence-state test failed or
          cargo refused to build the target, with cargo's own lines; it is a red of the unit when the target
          built and its fence-state test passed with the fence off. The row of d is caught when the self-test
          printed result=FAIL.
          """
          import os
          import subprocess
          import sys

          crate = sys.argv[1]
          F1_OLD = 'halvo-web = { path = ".", features = ["test-fence"] }\n'
          F1_NEW = 'halvo-web = { path = "." }\n'
          FENCE_TEST = "the_fence_is_on_in_this_test_target"
          TARGETS = [
              ("lib", ["--lib"], "tests::" + FENCE_TEST),
              ("web-probe", ["--bin", "web-probe"], "tests::" + FENCE_TEST),
              ("web-rows", ["--bin", "web-rows"], "tests::" + FENCE_TEST),
              ("web-standin", ["--bin", "web-standin"], "tests::" + FENCE_TEST),
              ("failed_start", ["--test", "failed_start"], FENCE_TEST),
          ]
          D1_OLD = "    if (m.executable) files.set(m.executable, true);\n"


          def restore():
              subprocess.run(["git", "checkout", "--", "."], cwd=crate, check=True)


          def replace(path, old, new):
              full = os.path.join(crate, path)
              text = open(full, encoding="utf-8").read()
              if text.count(old) != 1:
                  return f"text found {text.count(old)} times"
              open(full, "w", encoding="utf-8").write(text.replace(old, new))
              return None


          left = subprocess.run(["git", "status", "--porcelain", "--", "."], cwd=crate, capture_output=True, text=True).stdout
          if left.strip():
              print("copies the crate's files differ from HEAD; nothing was run")
              sys.exit(2)
          bad = 0
          red = 0
          for name, args, test in TARGETS:
              rid = f"F1-dev-dependency-without-the-feature target={name}"
              fault = replace("Cargo.toml", F1_OLD, F1_NEW)
              if fault:
                  print(f"row {rid} result=fault cause=apply ({fault})")
                  bad += 1
                  restore()
                  continue
              r = subprocess.run(["cargo", "test", "-p", "halvo-web", "--locked", *args, "--", "--exact", test],
                                 cwd=crate, capture_output=True, text=True)
              restore()
              out = r.stdout + "\n" + r.stderr
              lines = out.splitlines()
              passed = "test result: ok. 1 passed;" in out
              failed_test = any(l.startswith(f"test {test} ... FAILED") for l in lines)
              errors = [l for l in lines if l.startswith("error")]
              if passed:
                  word, cause = "RED_OF_THE_UNIT", "the fence-state test passed with the fence off"
                  red += 1
              elif failed_test:
                  word, cause = "caught", "test_failed"
              elif errors:
                  word, cause = "caught", "cargo_refused"
              else:
                  word, cause = "unclear", "no result line and no error line"
                  bad += 1
              print(f"row {rid} test={test} exit={r.returncode} result={word} cause={cause}")
              for l in [l for l in lines if l.startswith(f"test {test} ") or "panicked at" in l][:3]:
                  print(f"  {l}")
              for l in errors[:4]:
                  print(f"  cargo: {l}")
              for l in [l for l in lines if l.startswith("Consider enabling") or l.startswith("  -->")][:2]:
                  print(f"  cargo: {l}")

          rid = "D1-shipped-without-the-line-that-marks-a-program"
          fault = replace("fence/shipped.mjs", D1_OLD, "")
          if fault:
              print(f"row {rid} result=fault cause=apply ({fault})")
              bad += 1
              restore()
          else:
              r = subprocess.run(["node", "fence/shipped.mjs", "--self-test"], cwd=crate, capture_output=True, text=True)
              restore()
              for l in r.stdout.splitlines():
                  print(f"  {l}")
              caught = "result=FAIL" in r.stdout and r.returncode == 1
              print(f"row {rid} exit={r.returncode} result={'caught' if caught else 'survived'} want=result=FAIL")
              if not caught:
                  bad += 1
          left = subprocess.run(["git", "status", "--porcelain", "--", "."], cwd=crate, capture_output=True, text=True).stdout
          print(f"copies rows={len(TARGETS) + 1} not_caught={bad} red_of_the_unit={red} restored_changed_files={len(left.splitlines())}")
          sys.exit(1 if bad or red else 0)
          PYEOF
      - name: U2.6 round 2 rows step, killed_start alone with Chrome and Edge
        if: always()
        shell: bash
        run: |
          python - "$RUNNER_TEMP/u26" <<'PYEOF'
          """killed_rows.py: the rows step of round 2 of U2.6 (row g): the row killed_start of web-rows alone,
          with Chrome and Edge, on the hosted Windows runner.

            python killed_rows.py <out dir>

          Builds the fenced programs (`--features test-fence --bins`), runs
          `web-rows killed_start --browser <path> --runs 10 --seed 20261113 --scratch <dir>` for each browser
          that the runner has, prints every `row ` line as the program printed it, and exits 1 when a row's
          program exited other than 0 or a browser is absent.
          """
          import os
          import subprocess
          import sys

          OUT = sys.argv[1]
          os.makedirs(OUT, exist_ok=True)
          BROWSERS = [("chrome", "C:/Program Files/Google/Chrome/Application/chrome.exe"),
                      ("edge", "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe")]
          subprocess.run(["cargo", "build", "-q", "--locked", "-p", "halvo-web", "--features", "test-fence", "--bins"], check=True)
          rows = os.path.join("target", "debug", "web-rows.exe")
          failed = []
          for kind, path in BROWSERS:
              if not os.path.exists(path):
                  print(f"u26 browser={kind} absent", flush=True)
                  failed.append(f"absent_{kind}")
                  continue
              scratch = os.path.join(os.environ.get("RUNNER_TEMP", "."), "u26-killed-" + kind)
              os.makedirs(scratch, exist_ok=True)
              name = f"killed_start_{kind}"
              r = subprocess.run([rows, "killed_start", "--browser", path, "--runs", "10", "--seed", "20261113",
                                  "--scratch", scratch], capture_output=True, text=True)
              for line in r.stdout.splitlines():
                  if line.startswith("row "):
                      print(f"{name} {line}", flush=True)
              print(f"{name} exit={r.returncode}", flush=True)
              open(os.path.join(OUT, name + ".txt"), "w").write(r.stdout + "\n--- stderr\n" + r.stderr)
              if r.returncode != 0:
                  failed.append(name)
          print(f"u26 rows failed={','.join(failed) or '-'}", flush=True)
          sys.exit(1 if failed else 0)
          PYEOF
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
