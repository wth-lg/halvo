name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 50-windows-functional
      - name: "win-2 W2-2: proof files and a second checkout"
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        shell: bash
        run: |
          set +e
          set -u
          files="$RUNNER_TEMP/w2"
          mkdir -p "$files"
          cat >"$files/w2-proofs.sh" <<'W2_PROOFS_EOF'
          #!/bin/bash
          # The proofs of round W2-2: each new test at the commit before its fix and at
          # the fix, from a list (part, at, commit, kind, want, tests), in a second
          # checkout with the job's target directory. Exits 0 only when every run
          # answered as the list wants.
          set +e
          set -u
          w=$1
          files=$2
          list=$3
          head=$4
          cd "$w" || exit 2
          tab=$(printf '\t')
          runs=0
          wanted=0
          while IFS="$tab" read -r part at commit kind want tests; do
            [ -n "$part" ] || continue
            runs=$((runs + 1))
            if ! git checkout --quiet --force --detach "$commit"; then
              echo "W2 proof part=$part at=$at commit=$commit result=checkout-failed"
              continue
            fi
            log=$files/proof-$runs-$part-$at.log
            if [ "$kind" = tf ]; then
              timeout 900 cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact $tests --nocapture >"$log" 2>&1
            else
              timeout 900 cargo test --locked -p halvo-capture --lib -- --exact $tests >"$log" 2>&1
            fi
            code=$?
            ok=$(tr -d '\r' <"$log" | grep -a -c '^test .* \.\.\. ok$')
            failed=$(tr -d '\r' <"$log" | grep -a -c '^test .* \.\.\. FAILED$')
            n=$(printf '%s\n' $tests | grep -c .)
            result=NOT-as-wanted
            if [ "$want" = fail ] && [ "$code" -eq 101 ] && [ "$failed" -eq "$n" ] && [ "$ok" -eq 0 ]; then
              result=as-wanted
            elif [ "$want" = pass ] && [ "$code" -eq 0 ] && [ "$ok" -eq "$n" ] && [ "$failed" -eq 0 ]; then
              result=as-wanted
            fi
            [ "$result" = as-wanted ] && wanted=$((wanted + 1))
            echo "W2 proof part=$part at=$at commit=$commit kind=$kind want=$want exit=$code ok=$ok failed=$failed result=$result"
            tr -d '\r' <"$log" | grep -a -E -A3 '^test .* \.\.\. (FAILED|ok)$|^TF |panicked at' | grep -a -v -E '^--$|^note: |^stack backtrace' | head -24 | sed 's/^/W2   /'
          done <"$list"
          git checkout --quiet --force --detach "$head"
          echo "W2 proofs summary runs=$runs as_wanted=$wanted head=$(git rev-parse --short HEAD)"
          [ "$runs" -gt 0 ] && [ "$wanted" -eq "$runs" ]
          W2_PROOFS_EOF
          cat >"$files/w2-sift.sh" <<'W2_SIFT_EOF'
          #!/bin/bash
          # The verifier's probe sift_keys_at_a_stop_with_the_pump_not_held, scratch
          # only: copied into the second checkout at each named commit with its module
          # line, run in a process of its own, then moved out and the module line
          # restored. Exits 0 only when each run printed its four summary lines.
          set +e
          set -u
          w=$1
          files=$2
          probe=$3
          shift 3
          cd "$w" || exit 2
          dir=crates/halvo-capture/src/windows
          runs=0
          wanted=0
          for pair in "$@"; do
            at=${pair%%=*}
            commit=${pair#*=}
            runs=$((runs + 1))
            if ! git checkout --quiet --force --detach "$commit"; then
              echo "W2 sift at=$at commit=$commit result=checkout-failed"
              continue
            fi
            cp "$probe" "$dir/sift_probes.rs"
            printf '\n#[cfg(test)]\nmod sift_probes;\n' >>"$dir/mod.rs"
            log=$files/sift-$at.log
            HALVO_SIFT_PROBE=sift_keys_at_a_stop_with_the_pump_not_held timeout 600 cargo test --locked -p halvo-capture --lib -- --exact windows::sift_probes::sift_keys_at_a_stop_with_the_pump_not_held --nocapture --test-threads=1 >"$log" 2>&1
            code=$?
            summaries=$(tr -d '\r' <"$log" | grep -a -c '^VI7 keys summary ')
            ended=$(tr -d '\r' <"$log" | grep -a -c '^VI7 keys done=true')
            echo "W2 sift at=$at commit=$commit exit=$code summaries=$summaries done=$ended"
            tr -d '\r' <"$log" | grep -a -E '^VI7 |^test result|panicked at|^error' | head -60 | sed 's/^/W2   /'
            if [ "$code" -eq 0 ] && [ "$summaries" -eq 4 ] && [ "$ended" -eq 1 ]; then
              wanted=$((wanted + 1))
            fi
            mv "$dir/sift_probes.rs" "$files/sift_probes-$at.rs"
            git checkout --quiet -- "$dir/mod.rs"
            echo "W2 sift at=$at restored=$(git status --porcelain | wc -l | tr -d ' ')"
          done
          echo "W2 sift summary runs=$runs as_wanted=$wanted"
          [ "$runs" -eq "$#" ] && [ "$wanted" -eq "$runs" ]
          W2_SIFT_EOF
          cat >"$files/w2-mutants.sh" <<'W2_MUTANTS_EOF'
          #!/bin/bash
          # The one-rule changes of win-2, one after another in one checkout of the head
          # with one target directory: apply, build and run the named test, restore with
          # git checkout. A change is caught when its one test fails. Exits 0 only when
          # every change is caught that way.
          set +e
          set -u
          w=$1
          files=$2
          list=$3
          cd "$w" || exit 2
          head=$(git rev-parse HEAD)
          tab=$(printf '\t')
          caught=0
          timed=0
          survived=0
          nobuild=0
          unapplied=0
          n=0
          while IFS="$tab" read -r name file subst kind test; do
            [ -n "$name" ] || continue
            n=$((n + 1))
            git checkout --quiet -- "$file"
            if ! SUBST="$subst" perl -0777 -i -pe '$c = eval "\$_ =~ $ENV{SUBST}"; die "no match\n" unless $c;' "$file" 2>"$files/m-apply.err"; then
              unapplied=$((unapplied + 1))
              printf 'W2 mutant name=%s result=not-applied\n' "$name"
              git checkout --quiet -- "$file"
              continue
            fi
            log=$files/mutant-$n.log
            began=$(date +%s)
            if [ "$kind" = tf ]; then
              timeout 600 cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact "$test" --nocapture >"$log" 2>&1
            else
              timeout 600 cargo test --locked -p halvo-capture --lib -- --exact "$test" >"$log" 2>&1
            fi
            code=$?
            ended=$(date +%s)
            ran=$(tr -d '\r' <"$log" | grep -a -c '^test .* \.\.\. ')
            if grep -a -q 'could not compile\|^error\[E' "$log"; then
              result=no-build
              nobuild=$((nobuild + 1))
            elif [ "$code" -eq 124 ]; then
              result=caught-time-limit
              timed=$((timed + 1))
            elif [ "$ran" -ne 1 ]; then
              result=not-one-test-ran
              survived=$((survived + 1))
            elif [ "$code" -ne 0 ] && grep -a -q "^test .* \.\.\. FAILED" "$log"; then
              result=caught
              caught=$((caught + 1))
            else
              result=survived
              survived=$((survived + 1))
            fi
            printf 'W2 mutant name=%s kind=%s test=%s exit=%s tests_ran=%s result=%s seconds=%s\n' "$name" "$kind" "$test" "$code" "$ran" "$result" "$((ended - began))"
            tr -d '\r' <"$log" | grep -a -E '^test .* \.\.\. |panicked at|^error(\[|:)|^TF ' | head -6 | sed 's/^/W2   /'
            case $result in
              caught | caught-time-limit) ;;
              *) tr -d '\r' <"$log" | tail -n 15 | sed 's/^/W2   tail | /' ;;
            esac
            git checkout --quiet -- "$file"
          done <"$list"
          git diff --quiet "$head" || echo "W2 mutants the checkout differs from the head after the run"
          printf 'W2 mutants summary changes=%s caught=%s time_limit=%s no_build=%s survived=%s not_applied=%s\n' "$n" "$caught" "$timed" "$nobuild" "$survived" "$unapplied"
          [ "$n" -gt 0 ] && [ "$caught" -eq "$n" ] && [ "$timed" -eq 0 ]
          W2_MUTANTS_EOF
          cat >"$files/sift_probes.rs" <<'W2_PROBE_EOF'
          //! Probes of verifier-interrogate-7. Scratch only, never merged. Each test
          //! returns on its first line unless HALVO_SIFT_PROBE names it, so the job's
          //! own 12-test runs them as tests that do nothing. A named probe has a time
          //! limit of its own and prints `VI7` lines; it asserts nothing.
          
          use std::sync::mpsc::RecvTimeoutError;
          use std::sync::{Arc, Mutex};
          use std::time::{Duration, Instant};
          
          use windows::Win32::UI::Input::KeyboardAndMouse::{
              SendInput, INPUT, INPUT_0, INPUT_KEYBOARD, KEYBDINPUT, KEYBD_EVENT_FLAGS, KEYEVENTF_KEYUP,
              VK_F15,
          };
          
          use super::input::RawInputSource;
          use super::screen::ScreenSource;
          use crate::event::Modality;
          use crate::source::{CaptureSource, SourceContext, Started};
          
          fn enabled(name: &'static str, limit: Duration) -> bool {
              if std::env::var("HALVO_SIFT_PROBE").map_or(true, |named| named != name) {
                  return false;
              }
              std::thread::spawn(move || {
                  std::thread::sleep(limit);
                  println!("VI7 {name} time_limit_reached_s={}", limit.as_secs());
                  std::process::exit(3);
              });
              true
          }
          
          fn f15(released: bool) -> u32 {
              let input = INPUT {
                  r#type: INPUT_KEYBOARD,
                  Anonymous: INPUT_0 {
                      ki: KEYBDINPUT {
                          wVk: VK_F15,
                          wScan: 0,
                          dwFlags: if released {
                              KEYEVENTF_KEYUP
                          } else {
                              KEYBD_EVENT_FLAGS(0)
                          },
                          time: 0,
                          dwExtraInfo: 0,
                      },
                  },
              };
              // SAFETY: the slice holds one live INPUT and the size argument is the
              // size of one INPUT, as SendInput requires.
              unsafe { SendInput(&[input], core::mem::size_of::<INPUT>() as i32) }
          }
          
          struct Variant {
              name: &'static str,
              gap_ms: u64,
              settle_ms: u64,
              stop_before_the_last_release: bool,
          }
          
          /// Adversary 3's finding 1 without its hold: the same five F15 presses and
          /// the same `shutdown`, with the pump free to read its queue. Nothing holds
          /// the last-app cell. Each variant runs TRIALS times and prints its counts.
          #[test]
          fn sift_keys_at_a_stop_with_the_pump_not_held() {
              if !enabled(
                  "sift_keys_at_a_stop_with_the_pump_not_held",
                  Duration::from_secs(300),
              ) {
                  return;
              }
              const PRESSES: u64 = 5;
              const TRIALS: u32 = 20;
              let _serial = super::tests::serial();
              let variants = [
                  Variant {
                      name: "control_stop_300_ms_after_the_last_key",
                      gap_ms: 5,
                      settle_ms: 300,
                      stop_before_the_last_release: false,
                  },
                  Variant {
                      name: "keys_5_ms_apart_stop_right_after_the_last_release",
                      gap_ms: 5,
                      settle_ms: 0,
                      stop_before_the_last_release: false,
                  },
                  Variant {
                      name: "keys_5_ms_apart_stop_right_after_the_last_press",
                      gap_ms: 5,
                      settle_ms: 0,
                      stop_before_the_last_release: true,
                  },
                  Variant {
                      name: "keys_with_no_gap_stop_right_after_the_last_release",
                      gap_ms: 0,
                      settle_ms: 0,
                      stop_before_the_last_release: false,
                  },
              ];
              for variant in &variants {
                  let gap = Duration::from_millis(variant.gap_ms);
                  let (mut sent, mut delivered_all, mut lost_all) = (0u64, 0u64, 0u64);
                  let (mut trials_short, mut trials_odd, mut printed) = (0u32, 0u32, 0u32);
                  let mut worst_stop_ms = 0u128;
                  for trial in 0..TRIALS {
                      let (sink, writer) = crate::sink::channel(64);
                      let mut source = RawInputSource::keyboard(Arc::new(Mutex::new(None::<String>)));
                      let begun = source.begin(SourceContext::new(sink));
                      if !matches!(begun, Ok(Started::Running)) {
                          println!(
                              "VI7 keys variant={} trial={trial} begin={begun:?}",
                              variant.name
                          );
                          trials_odd += 1;
                          continue;
                      }
                      std::thread::sleep(Duration::from_millis(200));
                      let mut accepted = 0;
                      for press in 0..PRESSES {
                          accepted += f15(false);
                          let last = press + 1 == PRESSES;
                          if last && variant.stop_before_the_last_release {
                              break;
                          }
                          std::thread::sleep(gap);
                          accepted += f15(true);
                          if !last {
                              std::thread::sleep(gap);
                          }
                      }
                      std::thread::sleep(Duration::from_millis(variant.settle_ms));
                      let began = Instant::now();
                      let stop = source.shutdown();
                      let stop_ms = began.elapsed().as_millis();
                      if variant.stop_before_the_last_release {
                          accepted += f15(true);
                      }
                      let mut delivered = 0u64;
                      while let Ok(received) = writer.recv_timeout(Duration::from_millis(400)) {
                          if received.event().modality == Modality::Keystroke {
                              delivered += 1;
                          }
                      }
                      let lost = source.handoff_counts().lost;
                      let odd = accepted != (PRESSES * 2) as u32 || stop != Ok(());
                      if odd {
                          trials_odd += 1;
                      } else {
                          sent += PRESSES;
                          delivered_all += delivered;
                          lost_all += lost;
                          worst_stop_ms = worst_stop_ms.max(stop_ms);
                          if delivered + lost < PRESSES {
                              trials_short += 1;
                          }
                      }
                      if odd || ((trial < 2 || delivered + lost != PRESSES) && printed < 6) {
                          printed += 1;
                          println!(
                              "VI7 keys variant={} trial={trial} sendinput_events_accepted={accepted} stop={stop:?} stop_ms={stop_ms} presses={PRESSES} keystrokes_delivered={delivered} lost={lost}",
                              variant.name
                          );
                      }
                  }
                  println!(
                      "VI7 keys summary variant={} trials={TRIALS} odd_trials={trials_odd} presses_sent={sent} keystrokes_delivered={delivered_all} counted_lost={lost_all} neither_delivered_nor_counted={} trials_with_a_press_neither_delivered_nor_counted={trials_short} slowest_stop_ms={worst_stop_ms}",
                      variant.name,
                      sent as i64 - delivered_all as i64 - lost_all as i64
                  );
              }
              println!("VI7 keys done=true");
          }
          
          /// The screen stop whose stop thread cannot be spawned, on the product's own
          /// `ScreenSource`. At the head this is the control: the stop thread spawns.
          /// Under the temporary change of the second step, `Stopping::start` answers
          /// the spawn error and drops the session, as a failed `Builder::spawn` drops
          /// its closure, when HALVO_SIFT_FAIL_STOP_SPAWN is set.
          #[test]
          fn sift_a_screen_stop_whose_stop_thread_cannot_be_spawned() {
              if !enabled(
                  "sift_a_screen_stop_whose_stop_thread_cannot_be_spawned",
                  Duration::from_secs(120),
              ) {
                  return;
              }
              let _serial = super::tests::serial();
              let (sink, writer) = crate::sink::channel(256);
              let mut screen = ScreenSource::new(Arc::default());
              let begun = screen.begin(SourceContext::new(sink.clone()));
              std::thread::sleep(Duration::from_millis(700));
              let while_running = screen.health().state;
              let first_stop = screen.shutdown();
              let after_first_stop = screen.health().state;
              let second_stop = screen.shutdown();
              let second_begin = screen.begin(SourceContext::new(sink.clone()));
              let after_second_begin = screen.health().state;
              std::thread::sleep(Duration::from_millis(700));
              let third_stop = screen.shutdown();
              let lost = screen.handoff_counts().lost;
              drop(screen);
              drop(sink);
              let dropped = Instant::now();
              let mut frames = 0u32;
              let mut closed_ms = None;
              while dropped.elapsed() < Duration::from_secs(8) {
                  match writer.recv_timeout(Duration::from_millis(50)) {
                      Ok(_) => frames += 1,
                      Err(RecvTimeoutError::Disconnected) => {
                          closed_ms = Some(dropped.elapsed().as_millis());
                          break;
                      }
                      Err(RecvTimeoutError::Timeout) => {}
                  }
              }
              println!(
                  "VI7 spawnfail-real fail_env_set={} begin={begun:?} state_while_running={while_running:?} first_stop={first_stop:?} state_after_first_stop={after_first_stop:?} second_stop={second_stop:?} second_begin={second_begin:?} state_after_second_begin={after_second_begin:?} third_stop={third_stop:?} lost={lost} frames_received={frames} sink_closed_ms_after_the_source_and_the_handles_were_dropped={closed_ms:?}",
                  std::env::var_os("HALVO_SIFT_FAIL_STOP_SPAWN").is_some()
              );
          }
          W2_PROBE_EOF
          printf '%s' '' | base64 -d >"$files/mutants.tsv"
          printf '%s' '' | base64 -d >"$files/proofs.tsv"
          git fetch --quiet --deepen=60 origin "$GITHUB_REF"
          reach=0
          for c in $(cut -f3 "$files/proofs.tsv" | sort -u) 93de14e1701c4f30b98b334ced8357e9bf2f6c5b 8c9be401f7a35bb09c855046ce772753d11a3055; do
            git cat-file -e "$c^{commit}" || { echo "W2 files commit $c is not reachable"; reach=1; }
          done
          git worktree add --quiet --detach "$files/wt" "93de14e1701c4f30b98b334ced8357e9bf2f6c5b"
          echo "W2 files changes=$(grep -c . "$files/mutants.tsv") proof_runs=$(grep -c . "$files/proofs.tsv") probe_lines=$(grep -c '' "$files/sift_probes.rs") second_checkout=$(git -C "$files/wt" rev-parse --short HEAD) unreachable=$reach"
          [ "$reach" -eq 0 ] && [ -f "$files/wt/Cargo.toml" ]
      - name: "win-2 W2-2: each new test before and after its fix"
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          bash "$RUNNER_TEMP/w2/w2-proofs.sh" "$RUNNER_TEMP/w2/wt" "$RUNNER_TEMP/w2" "$RUNNER_TEMP/w2/proofs.tsv" 93de14e1701c4f30b98b334ced8357e9bf2f6c5b
      - name: "win-2 W2-2: the verifier's keys-at-a-stop probe before and after the read at the stop"
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          bash "$RUNNER_TEMP/w2/w2-sift.sh" "$RUNNER_TEMP/w2/wt" "$RUNNER_TEMP/w2" "$RUNNER_TEMP/w2/sift_probes.rs" before=8c9be401f7a35bb09c855046ce772753d11a3055 after=93de14e1701c4f30b98b334ced8357e9bf2f6c5b
      - name: "win-2 W2-2: one-rule changes"
        if: ${{ !cancelled() }}
        timeout-minutes: 45
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          bash "$RUNNER_TEMP/w2/w2-mutants.sh" "$RUNNER_TEMP/w2/wt" "$RUNNER_TEMP/w2" "$RUNNER_TEMP/w2/mutants.tsv"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
