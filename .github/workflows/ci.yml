name: ci
# scratch: verifier-130 of win-3 at db9c588a, the windows job alone; never merged
# The tree is the head db9c588a with this workflow and verifier-130/*.rs (changed copies of
# crates/halvo-capture/src/windows/secure_input.rs, each one rule of my own taken out).

on:
  push:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: ci.d at the head (12-test and 50-windows-functional, once)
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 12-test 50-windows-functional
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - name: verifier-130 undo rows, each a changed copy of the gate file and the test that must fail
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          src=crates/halvo-capture/src/windows/secure_input.rs
          log="$RUNNER_TEMP/undo.log"
          git status --short
          while read -r name kind test; do
            [ -n "$name" ] || continue
            cp "verifier-130/$name.rs" "$src"
            echo "UNDO row=$name test=$test changed_lines=$(git diff --numstat -- "$src" | cut -f1,2 | tr '\t' '+')"
            if [ "$kind" = lib ]; then
              cargo test --locked -p halvo-capture --lib --no-run --message-format json >"$RUNNER_TEMP/b.json" 2>"$log"
              b=$?
              exe=$(tr -d '\r' <"$RUNNER_TEMP/b.json" | grep '"kind":\["lib"\]' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
            else
              cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/b.json" 2>"$log"
              b=$?
              exe=$(tr -d '\r' <"$RUNNER_TEMP/b.json" | sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
            fi
            echo "UNDO row=$name build exit=$b exe=${exe:-none}"
            if [ "$b" -ne 0 ] || [ -z "$exe" ]; then
              tr -d '\r' <"$log" | tail -n 30
            else
              timeout 900 "$exe" --include-ignored --exact --nocapture "$test" </dev/null >"$log" 2>&1
              code=$?
              tr -d '\r' <"$log" | grep -E '^(test |TF |WF |KNOWN|thread |  left|  right|.*panicked|.*assert)' | cut -c1-600 | tail -n 60
              res=$(tr -d '\r' <"$log" | grep -E '^test result:' | tail -n 1)
              echo "UNDO row=$name test=$test exit=$code result: $res"
            fi
            git checkout -- "$src"
            echo "UNDO row=$name restored status=[$(git status --short -- crates | tr '\n' ' ')]"
          done <<'ROWS'
          V30 functional browser::swap_phases_of_the_page_in_chrome
          V52 functional password_field_fixture_firefox
          V52 functional browser::a_renamed_copy_of_chrome_reads_unknown_and_records_nothing
          G1 lib secure_input::windows::detector::tests::a_focus_events_clear_from_the_callback_clears_no_key
          R1 functional password_field_fixture_native
          R1 functional password_field_fixture_chrome
          ROWS
          exit 0
