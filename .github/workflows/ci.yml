name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 20-r4-core 30-r4-formal 15-r3-test-dirs 17-workflow-lint
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 20-r4-core 30-r4-formal 15-r3-test-dirs 17-workflow-lint
      - name: Loop (u24f-new-tests, 200 rounds)
        shell: bash
        run: |
          set +e
          pass=0; n=0
          while [ "$n" -lt 200 ]; do
            n=$((n + 1))
            if ( { cargo test -q --locked -p halvo-coord --lib --test coordinator_moves --test items_drive --test run_recover --test run_refusals --test schedule_drive -- --exact types::tests::the_products_body_bounds_equal_the_schemas types::tests::limits_refuse_body_bounds_above_the_schemas rd101_5b_an_answer_on_a_confirmation_whose_read_shows_a_stored_switch_off_stops_the_run_first rd101_5b_a_confirmation_whose_read_before_the_answer_fails_sends_nothing_and_the_read_back_stops_the_run_first rd101_5b_an_allow_on_a_confirmation_whose_waiting_raise_meets_a_stored_switch_off_stops_the_run_first_and_lapses_it_after_its_raise rd108_2_a_done_again_whose_read_before_its_kept_row_fails_answers_no_service_and_hands_nothing rd108_2_an_allow_again_whose_read_before_its_recorded_allow_fails_answers_no_service_and_sends_no_allow rd108_2_a_done_after_a_stored_decline_that_the_run_did_not_take_reads_first_and_hands_nothing_beside_a_stored_switch_off no_writer_stores_an_item_answered_of_a_setup_with_the_answer_none rd121_the_next_lifes_first_creation_move_raises_no_setup_for_an_agent_set_aside request_records_released_rows_of_a_confirmation_fit_one_body an_agent_whose_history_is_refused_is_set_aside_and_every_other_agent_recovers a_tick_starts_nothing_for_an_agent_set_aside_while_its_history_is_refused recovery_leaves_out_an_agent_whose_history_is_refused_with_no_workflow recovery_still_ends_with_no_board_when_the_owner_does_not_answer_a_history rd96_5c_an_owed_item_lapseds_read_after_seq_closes_the_lost_start_that_it_brings rd96_5c_an_owed_run_endeds_read_after_seq_closes_the_lost_start_that_it_brings rd86_a_run_that_recovery_ends_holds_null rd121_recovery_logs_no_check_for_an_agent_set_aside rd121_a_tick_logs_no_check_for_an_agent_set_aside rd121_an_agent_set_aside_with_no_event_at_the_owner_gets_no_item_stored rd121_recovery_logs_nothing_for_the_agent_of_a_dismissed_workflow_under_binding rd121_an_agent_whose_history_recovery_read_still_gets_its_check rd121_an_agent_set_aside_in_an_earlier_life_and_read_whole_in_this_one_gets_its_check a_start_refused_with_store_asks_for_no_further_defer_over_100_ticks the_start_after_an_acknowledged_store_asks_for_its_defer_after_its_run_started a_start_refused_with_seq_still_asks_for_its_defer_first class_b_a_body_refused_with_no_workflow_leaves_the_list_and_is_not_sent_again class_c_the_records_go_one_to_a_body_and_one_proven_by_the_next_is_taken_off class_c_an_early_record_keeps_its_place_and_nothing_behind_it_is_sent class_c_a_record_more_than_two_days_ahead_is_taken_off_and_counted class_c_a_record_outside_its_bound_is_taken_off_and_counted class_c_a_lone_record_waits_for_a_later_write_under_its_seq_and_nothing_where_that_fails class_d_the_body_stays_whole_and_first_and_goes_again class_c_a_debt_outside_its_bound_is_dropped_and_counted_and_one_inside_stays_owed class_d_a_debt_stays_owed_and_class_b_ends_it recoverys_body_is_cut_between_debts_by_records recoverys_body_is_cut_between_debts_by_bytes recoverys_body_refused_with_no_workflow_owes_nothing a_waiting_record_takes_the_day_of_its_instant_again_before_its_send an_owed_debt_takes_the_day_of_its_instant_again_before_its_send a_stored_row_is_the_senders_own_by_its_instant_and_event_whatever_its_day the_limits_hold_record_stuck_ticks_and_the_models_file_reads_it after_record_stuck_ticks_ticks_in_a_row_with_a_refusal_the_agent_shows_the_stuck_line an_acknowledged_store_ends_the_count an_agent_set_aside_shows_the_stuck_line_from_the_first_tick recoverys_body_under_the_products_limits_is_one_body an_aside_agent_is_given_no_seq_already_stored_and_no_run_by_any_move class_c_a_proof_spent_on_the_next_record_takes_no_later_record_off class_c_a_proof_write_whose_acknowledgement_was_lost_is_not_sent_under_that_seq_for_ever class_c_an_early_record_that_comes_due_and_waits_for_its_proof_holds_no_place class_c_a_record_kept_whole_under_class_d_then_waiting_for_its_proof_holds_no_place class_b_a_record_dropped_while_it_waits_for_its_proof_leaves_no_proof_behind an_end_run_debt_refused_with_class_d_at_every_tick_is_told an_end_run_debt_refused_with_class_c_is_not_owed_for_ever_untold a_tick_that_pays_a_refused_end_and_refuses_nothing_does_not_count_toward_stuck the_schedules_store_takes_the_replys_lower_last_and_stores_at_seq_1_after_one_read the_ledger_takes_the_replys_lower_last_and_stores_at_seq_1_after_one_read a_new_life_whose_owner_answers_store_to_both_bodies_stores_and_starts_nothing_and_reads_as_before_after class_c_a_record_exactly_two_days_ahead_keeps_its_place class_c_a_lone_record_past_its_bound_is_taken_off_at_once_and_one_at_its_bound_waits_for_its_proof class_b_a_proof_write_refused_with_no_workflow_leaves_the_list_and_is_not_sent_again no_writer_stores_a_run_ended_deleted_for_a_run_whose_workflow_is_listed_again_before_its_end rd86_every_defer_refused_for_a_run_of_n_ticks_gives_no_and_n rd86_the_launch_acknowledged_and_the_ticks_refused_gives_yes_and_n rd86_a_tick_whose_clock_or_day_fails_counts_for_the_run rd86_two_live_runs_each_get_the_ticks_failure rd86_a_start_that_failed_holds_null rd86_a_start_whose_defer_waited_for_its_run_started_takes_that_defers_answer rd86_an_end_owed_in_this_life_keeps_its_values_and_counts_no_tick_after_the_run_left_the_board; cargo test -q --locked -p halvo-coord-store --test coord_defers --test limits --test reader -- --exact a_run_ended_with_both_defer_values_in_halvo_coords_row_text_is_stored_as_written the_bounds_equal_the_product_limits_and_the_history_page a_run_ended_of_an_older_sender_and_one_with_both_defer_keys_null_are_stored_with_both_keys_null a_run_ended_with_defer_values_is_stored_once_the_kind_entry_lists_its_keys; cargo test -q --locked -p halvo-schema --test r4_record --test r4_rows -- --exact r4_record_run_ended_writes_its_defers_after_origin_and_both_null_where_they_are_not_known r4_rows_the_kind_entry_takes_the_defer_keys_that_the_writers_write_and_refuses_a_row_without_them; } > "$RUNNER_TEMP/u24f-loop.txt" 2>&1; awk '/^test result:/ {p+=$4; f+=$6} END {print "loop tests=" p " fail=" f; exit !(p==76 && f==0)}' "$RUNNER_TEMP/u24f-loop.txt" ) >"$RUNNER_TEMP/loop-$n.log" 2>&1; then pass=$((pass + 1)); else echo "round $n failed:"; tail -n 40 "$RUNNER_TEMP/loop-$n.log"; fi
          done
          echo "loop u24f-new-tests: passed $pass of 200"
          [ "$pass" -eq 200 ]
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default -c core.fileMode=true "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 20-r4-core 20-schema 30-r4-formal 15-r3-test-dirs
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 20-r4-core 20-schema 30-r4-formal 15-r3-test-dirs
      - name: Loop (u24f-new-tests, 200 rounds)
        shell: bash
        run: |
          set +e
          pass=0; n=0
          while [ "$n" -lt 200 ]; do
            n=$((n + 1))
            if ( { cargo test -q --locked -p halvo-coord --lib --test coordinator_moves --test items_drive --test run_recover --test run_refusals --test schedule_drive -- --exact types::tests::the_products_body_bounds_equal_the_schemas types::tests::limits_refuse_body_bounds_above_the_schemas rd101_5b_an_answer_on_a_confirmation_whose_read_shows_a_stored_switch_off_stops_the_run_first rd101_5b_a_confirmation_whose_read_before_the_answer_fails_sends_nothing_and_the_read_back_stops_the_run_first rd101_5b_an_allow_on_a_confirmation_whose_waiting_raise_meets_a_stored_switch_off_stops_the_run_first_and_lapses_it_after_its_raise rd108_2_a_done_again_whose_read_before_its_kept_row_fails_answers_no_service_and_hands_nothing rd108_2_an_allow_again_whose_read_before_its_recorded_allow_fails_answers_no_service_and_sends_no_allow rd108_2_a_done_after_a_stored_decline_that_the_run_did_not_take_reads_first_and_hands_nothing_beside_a_stored_switch_off no_writer_stores_an_item_answered_of_a_setup_with_the_answer_none rd121_the_next_lifes_first_creation_move_raises_no_setup_for_an_agent_set_aside request_records_released_rows_of_a_confirmation_fit_one_body an_agent_whose_history_is_refused_is_set_aside_and_every_other_agent_recovers a_tick_starts_nothing_for_an_agent_set_aside_while_its_history_is_refused recovery_leaves_out_an_agent_whose_history_is_refused_with_no_workflow recovery_still_ends_with_no_board_when_the_owner_does_not_answer_a_history rd96_5c_an_owed_item_lapseds_read_after_seq_closes_the_lost_start_that_it_brings rd96_5c_an_owed_run_endeds_read_after_seq_closes_the_lost_start_that_it_brings rd86_a_run_that_recovery_ends_holds_null rd121_recovery_logs_no_check_for_an_agent_set_aside rd121_a_tick_logs_no_check_for_an_agent_set_aside rd121_an_agent_set_aside_with_no_event_at_the_owner_gets_no_item_stored rd121_recovery_logs_nothing_for_the_agent_of_a_dismissed_workflow_under_binding rd121_an_agent_whose_history_recovery_read_still_gets_its_check rd121_an_agent_set_aside_