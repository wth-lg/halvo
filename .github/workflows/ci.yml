name: ci

on:
  push:
    branches-ignore: ['land-*', 'land-*/**']
    tags: ['**']
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
    - cron: '17 3 * * 2'
    - cron: '17 3 * * 3'
    - cron: '17 3 * * 4'
    - cron: '17 3 * * 5'
    - cron: '17 3 * * 6'
    - cron: '17 3 * * 0'
    - cron: '47 4 * * 3'
    - cron: '47 4 * * 2'
  workflow_dispatch:
    inputs:
      slice:
        description: The slice to run, as its weekly run does
        type: choice
        options: [mon, tue, tue2, wed, wed2, thu, fri, sat, sun]
        default: mon
      checks:
        description: In place of the slice, these checks alone, each with its self-test (names with blanks between them)
        type: string
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.event_name == 'workflow_dispatch' && github.run_id || github.event_name == 'schedule' && github.event.schedule || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: limited
  CARGO_PROFILE_TEST_DEBUG: limited

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Slice
        id: slice
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CRON: ${{ github.event.schedule }}
          SLICE: ${{ inputs.slice }}
          CHECKS: ${{ inputs.checks }}
        run: |
          case "$GITHUB_EVENT_NAME:$CRON" in
            'schedule:17 3 * * 1') slice=mon ;;
            'schedule:17 3 * * 2') slice=tue ;;
            'schedule:47 4 * * 2') slice=tue2 ;;
            'schedule:17 3 * * 3') slice=wed ;;
            'schedule:47 4 * * 3') slice=wed2 ;;
            'schedule:17 3 * * 4') slice=thu ;;
            'schedule:17 3 * * 5') slice=fri ;;
            'schedule:17 3 * * 6') slice=sat ;;
            'schedule:17 3 * * 0') slice=sun ;;
            workflow_dispatch:*) slice=$SLICE ;;
            *)
              echo "Slice: no slice belongs to the event $GITHUB_EVENT_NAME with the cron line '$CRON'. Fix: give each cron line of the schedule its slice in this step."
              exit 1
              ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$CHECKS" ]; then
            slice=
            echo "Slice: none; this run by hand runs the named checks alone: $CHECKS"
          else
            echo "Slice: $slice"
          fi
          echo "name=$slice" >>"$GITHUB_OUTPUT"
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - name: Self-tests that commit in throwaway repositories
        if: steps.slice.outputs.name == 'fri'
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          sh scripts/check-commit-messages.sh --self-test-two-paths
          sh scripts/check-commit-messages.sh --self-test-pre-push
          sh scripts/ci-commit-messages.sh --self-test
          sh scripts/merge-pr.sh --self-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
          sh scripts/ci/keep-one-rust-cache.sh --self-test
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        id: cache
      - name: Restore the release build of the slice sun for thu and sun
        if: steps.slice.outputs.name == 'sun' || steps.slice.outputs.name == 'thu'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/deps/*
            !target/release/deps/*halvo*
            target/release/build/*
            !target/release/build/*halvo*
            target/release/.fingerprint/*
            !target/release/.fingerprint/*halvo*
          key: v0-release-macos-${{ hashFiles('rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: v0-release-macos-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d merge gate
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos --merge-gate
      - name: ci.d slice
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SLICE: ${{ steps.slice.outputs.name }}
          CHECKS: ${{ inputs.checks }}
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
          HALVO_BROWSER: '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
        run: |
          if [ -n "$SLICE" ]; then
            sh scripts/ci/run-ci-d.sh macos --slice "$SLICE"
          else
            sh scripts/ci/run-ci-d.sh macos --checks "$CHECKS"
          fi
      - name: Save the release build of the slice sun
        if: steps.slice.outputs.name == 'sun' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/deps/*
            !target/release/deps/*halvo*
            target/release/build/*
            !target/release/build/*halvo*
            target/release/.fingerprint/*
            !target/release/.fingerprint/*halvo*
          key: v0-release-macos-${{ hashFiles('rust-toolchain.toml') }}-${{ github.run_id }}
      - name: Lockfile unchanged
        shell: bash
        env:
          SLICE: ${{ steps.slice.outputs.name }}
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" macos
          if [ "$SLICE" = fri ]; then
            sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/
          retention-days: 7
      - name: Keep one Rust cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh scripts/ci/keep-one-rust-cache.sh macos

  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Slice
        id: slice
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          CRON: ${{ github.event.schedule }}
          SLICE: ${{ inputs.slice }}
          CHECKS: ${{ inputs.checks }}
        run: |
          case "$GITHUB_EVENT_NAME:$CRON" in
            'schedule:17 3 * * 1') slice=mon ;;
            'schedule:17 3 * * 2') slice=tue ;;
            'schedule:47 4 * * 2') slice=tue2 ;;
            'schedule:17 3 * * 3') slice=wed ;;
            'schedule:47 4 * * 3') slice=wed2 ;;
            'schedule:17 3 * * 4') slice=thu ;;
            'schedule:17 3 * * 5') slice=fri ;;
            'schedule:17 3 * * 6') slice=sat ;;
            'schedule:17 3 * * 0') slice=sun ;;
            workflow_dispatch:*) slice=$SLICE ;;
            *)
              echo "Slice: no slice belongs to the event $GITHUB_EVENT_NAME with the cron line '$CRON'. Fix: give each cron line of the schedule its slice in this step."
              exit 1
              ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$CHECKS" ]; then
            slice=
            echo "Slice: none; this run by hand runs the named checks alone: $CHECKS"
          else
            echo "Slice: $slice"
          fi
          echo "name=$slice" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        id: cache
      - name: Restore the release build of the slice sun
        if: steps.slice.outputs.name == 'sun' || steps.slice.outputs.name == 'tue'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/deps
            target/release/build
            target/release/.fingerprint
          key: v0-release-windows-${{ hashFiles('rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: v0-release-windows-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d merge gate
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows --merge-gate
      - name: ci.d slice
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          SLICE: ${{ steps.slice.outputs.name }}
          CHECKS: ${{ inputs.checks }}
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
          HALVO_BROWSER: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
        run: |
          if [ -n "$SLICE" ]; then
            sh scripts/ci/run-ci-d.sh windows --slice "$SLICE"
          else
            sh scripts/ci/run-ci-d.sh windows --checks "$CHECKS"
          fi
      - name: Save the release build of the slice sun
        if: steps.slice.outputs.name == 'sun' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/release/deps
            target/release/build
            target/release/.fingerprint
          key: v0-release-windows-${{ hashFiles('rust-toolchain.toml') }}-${{ github.run_id }}
      - name: Scripts and hook in a core.autocrlf=true clone
        if: steps.slice.outputs.name == 'fri'
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        env:
          SLICE: ${{ steps.slice.outputs.name }}
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" windows
          if [ "$SLICE" = fri ]; then
            sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
          retention-days: 7
      - name: Keep one Rust cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh scripts/ci/keep-one-rust-cache.sh windows
