          mutant h14-hook-add-works keychain/failing.rs $k moves::a_failed_add_leaves_the_file_and_answers_locked 's/MoveFault::Add => Err\(WRITE_PERMISSION\),/MoveFault::Add => self.inner.add(service, account, bytes),/'
          mutant h15-hook-read-back-equal keychain/failing.rs $k moves::a_read_back_that_differs_leaves_the_file_and_answers_locked 's/\*last \^= 1;/let _ = last;/'
          mutant h16-read-back-length mac.rs $k moves::a_read_back_that_differs_leaves_the_file_and_answers_locked 's/Read::Found\(back\) if back\.expose\(\) == secret\.expose\(\)/Read::Found(back) if back.expose().len() == secret.expose().len()/'
          mutant h17-both-places-length mac.rs $k moves::with_both_places_full_the_read_answers_locked_never_not_stored 's/Looked::File\(Read::Found\(other\)\) if other\.expose\(\) == secret\.expose\(\)/Looked::File(Read::Found(other)) if other.expose().len() == secret.expose().len()/'
          mutant h18-store-write-to-keychain store.rs $u beside_the_keychain::the_store_of_a_build_without_the_keychain_is_the_file_store 's/Place::Mac\(mac\) => mac\.write\(secret\),/Place::Mac(mac) => mac.keychain.write(secret),/'
          mutant h19-boxed-delete-does-nothing keychain.rs $k the_store_of_this_build_stores_reads_and_deletes_one_item 's/\(\*\*self\)\.delete\(service, account\)/{ let _ = (service, account); Ok(()) }/'
          mutant h20-service-and-name-swapped store.rs $k moves::a_file_of_an_earlier_build_moves_once_into_the_keychain_and_reads_found_after 's/service,\n {12}account: name,/service: name,\n            account: service,/'
          mutant h21-boxed-add-swapped keychain.rs $k moves::a_file_of_an_earlier_build_moves_once_into_the_keychain_and_reads_found_after 's/\(\*\*self\)\.add\(service, account, bytes\)/(**self).add(account, service, bytes)/'
          mutant h22-delete-no-second-look mac.rs $k moves::a_delete_beside_a_file_that_cannot_be_read_answers_a_fault_and_keeps_the_file 's/Delete::Deleted => match self\.other_place\(\) \{/Delete::Deleted => match Other::Empty {/'
          mutant h23-write-without-read mac.rs $u beside_the_keychain::a_keychain_item_read_by_a_build_without_the_feature_answers_locked 's/match self\.read\(\) \{(?=\s*Read::NotStored => match self\.keeps \{)/match Read::NotStored {/'
          mutant h24-signed-store-delete-if-holds-by-name store.rs $k the_store_of_this_build_deletes_only_the_bytes_that_its_caller_read 's/Place::Mac\(mac\) => mac\.delete_if_holds\(held\),/Place::Mac(mac) => mac.delete().into(),/'
          mutant h25-unsigned-store-delete-if-holds-by-name store.rs $u the_store_of_this_build_deletes_only_the_bytes_that_its_caller_read 's/Place::Mac\(mac\) => mac\.delete_if_holds\(held\),/Place::Mac(mac) => mac.delete().into(),/'
          mutant h26-system-delete-item-does-nothing keychain/system.rs $k the_store_of_this_build_deletes_only_the_bytes_that_its_caller_read 's/item\.delete\(\);/let _ = item;/'
          mutant h27-system-find-swapped keychain/system.rs $k the_store_of_this_build_deletes_only_the_bytes_that_its_caller_read 's/find_generic_password\(None, service, account\)/find_generic_password(None, account, service)/'
          mutant h28-boxed-delete-item-dropped keychain.rs $k the_store_of_this_build_deletes_only_the_bytes_that_its_caller_read 's/\(\*\*self\)\.delete_item\(item\)/drop(item)/'
          mutant h29-boxed-find-swapped keychain.rs $k the_store_of_this_build_deletes_only_the_bytes_that_its_caller_read 's/\(\*\*self\)\.find\(service, account\)/(**self).find(account, service)/'
          mutant h30-signed-removal-always-keychain store.rs $k moves::a_signed_build_leaves_other_bytes_in_both_stores_at_the_person_s_word 's/Place::Mac\(mac\) => mac\.remove\(from\),/Place::Mac(mac) => mac.remove(StoreKind::Keychain),/'
          mutant h31-signed-removal-then-not-read store.rs $k moves::a_signed_build_leaves_other_bytes_in_both_stores_at_the_person_s_word 's/then: self\.read\(\),/then: Read::NotStored,/'
          mutant h32-unsigned-removal-then-not-read store.rs $u beside_the_keychain::an_unsigned_build_leaves_other_bytes_in_both_stores_at_the_person_s_word 's/then: self\.read\(\),/then: Read::NotStored,/'
          mutant h33-unsigned-removal-of-keychain-not-made mac.rs $u beside_the_keychain::an_unsigned_build_leaves_other_bytes_in_both_stores_at_the_person_s_word 's/Ok\(\(\)\) => self\.keychain\.delete\(\),/Ok(()) => Delete::Deleted,/'
          mutant h34-switch-left-off-unsigned keychain/system.rs $u by_reference::the_switch_that_keeps_a_read_from_asking_the_person_is_as_it_was_after_each_operation 's/let _quiet = SecKeychain::disable_user_interaction\(\)\.map_err\(\|error\| error\.code\(\)\)\?;/std::mem::forget(SecKeychain::disable_user_interaction().map_err(|error| error.code())?);/'
          mutant h35-switch-left-off-signed keychain/system.rs $k by_reference::the_switch_that_keeps_a_read_from_asking_the_person_is_as_it_was_after_each_operation 's/let _quiet = SecKeychain::disable_user_interaction\(\)\.map_err\(\|error\| error\.code\(\)\)\?;/std::mem::forget(SecKeychain::disable_user_interaction().map_err(|error| error.code())?);/'
          echo "hosted mutants caught=$caught of $total changed_files=$(git status --short | wc -l | tr -d ' ')"
          [ "$caught" -eq "$total" ]
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
