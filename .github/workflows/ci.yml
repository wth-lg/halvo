              ("halvo-schema", "r4_names"): [],
              ("halvo-schema", "r5_names"): [],
              ("halvo-schema", "r3_golden"): [],
              ("halvo-schema", "later_file_builds"): ["leaf_"],
              ("halvo-schema", "locked_files"): ["leaf_", "fixture_dir_two_calls"],
              ("halvo-cap", "halvo_cap"): ["fresh_dir_"],
              ("halvo-cap", "model_lock"): ["leaf_", "fresh_dir_"],
              ("halvo-cap", "measure_peak"): ["leaf_"],
