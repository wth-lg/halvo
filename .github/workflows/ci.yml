name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 50-windows-functional
      - name: interrogate win-3 adversary 3, probes of the fixture controls
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/adv3.log"
          probe() {
            label=$1; target=$2; name=$3; limit=$4
            timeout "$limit" cargo test --locked -p halvo-capture --test "$target" -- --ignored --exact "$name" --nocapture --test-threads=1 >"$log" 2>&1
            code=$?
            echo "ADV3 $label exit=$code"
            tr -d '\r' <"$log" | grep -E '^TF (adv3-|fixture-native phase|fixture-native keyboard_start|fixture-firefox |x1 )|^TF shutdown|panicked at|left:|right:|INCONCLUSIVE|^test .* \.\.\. |^test result|^error' | grep -v ' env ' | head -n 40
          }
          mutate() {
            file=$1
            ADV3_SUB=$2 perl -0777 -i -pe 'BEGIN { $s = $ENV{ADV3_SUB} } eval $s; die $@ if $@' "$file"
            echo "ADV3 mutant $3: $(git diff --numstat -- "$file")"
            git diff -- "$file" | grep -E '^[-+] ' | tr -d '\r'
          }
          cargo test --locked -p halvo-capture --test adv3_probes --test windows_functional --no-run >"$log" 2>&1
          echo "ADV3 build exit=$?"
          tr -d '\r' <"$log" | grep -E '^error|^warning: unused' | head -n 20
          for n in 1 2 3; do probe "head c-ground-truth run=$n" adv3_probes adv3::adv3_c_ground_truth 150; done
          probe "head e-ground-truth" adv3_probes adv3::adv3_e_ground_truth 200
          gate=crates/halvo-capture/src/windows/secure_input.rs
          input=crates/halvo-capture/src/windows/input.rs
          mutate "$gate" 's/Mark::Field\(later\) \| Mark::Read\(later\) => state = most_restrictive\(state, later\),/Mark::Field(_later) | Mark::Read(_later) => {}/' "M1 a mark after the key is not read"
          for n in 1 2; do probe "M1 fixture-native run=$n" windows_functional password_field_fixture_native_dialog_phases_a_to_f 400; done
          probe "M1 x1" windows_functional x1_keystrokes_typed_into_a_password_field 300
          for n in 1 2; do probe "M1 c-ground-truth run=$n" adv3_probes adv3::adv3_c_ground_truth 400; done
          git checkout --quiet -- "$gate"
          mutate "$gate" 's/    if still_the_last_password_element \{/    if false \&\& still_the_last_password_element {/' "M2 no sticky password element"
          probe "M2 fixture-native" windows_functional password_field_fixture_native_dialog_phases_a_to_f 400
          git checkout --quiet -- "$gate"
          mutate "$input" 's/producer\.push\(keystroke_packet\(clearance, stroke, app, key\.tick\(\)\)\);/let _ = keystroke_packet(clearance, stroke, app, key.tick());/' "M4 a cleared key is never pushed"
          probe "M4 fixture-firefox" windows_functional password_field_fixture_firefox 500
          probe "M4 fixture-native" windows_functional password_field_fixture_native_dialog_phases_a_to_f 400
          git checkout --quiet -- "$input"
          echo "ADV3 restored: $(git status --porcelain | wc -l) changed paths"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
