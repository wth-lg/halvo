name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: U0.3 round 4 item 3, clippy, tests, loops and self-tests (scratch branch, never merged)
        if: always()
        timeout-minutes: 40
        shell: bash
        run: |
          #!/bin/bash
          # The U0.3 round-4 step of the scratch workflow (never merged): item 3's calls with the denial log's
          # kinds and the kept standard error's sandbox line, both trials' clippy and whole tests once, every
          # new or changed test of the round 200 times by exact name, both self-tests, each part's seconds.
          set +e
          code=0
          case "$(uname -s)" in
            Darwin)
              machine=hosted-mac
              chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
              ;;
            *)
              machine=hosted-win
              chrome="C:/Program Files/Google/Chrome/Application/chrome.exe"
              ;;
          esac
          repo=$(pwd)
          part() {
            echo "u03r4_seconds machine=$machine part=$1 seconds=$(($(date +%s) - $2))"
          }
          echo "u03r4 machine=$machine at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          s0=$(date +%s)
          for call in first final control; do
            [ "$call" = control ] && [ "$machine" != hosted-mac ] && continue
            case $call in
              first) extra="--flags first" set=first ;;
              final) extra="" set=final ;;
              control) extra="--sandbox-off" set=final ;;
            esac
            scratch=$(mktemp -d "$RUNNER_TEMP/r4cell.XXXXXX")
            # shellcheck disable=SC2086
            sh tools/r3-trials/profile/run.sh --item 3 $extra --browser "$chrome" --port 18090 --scratch "$scratch"
            e=$?
            echo "u03r4_call machine=$machine call=$call exit=$e"
            sh .u03r4/item3-extra.sh "$scratch" "$repo" "$machine" "$set"
          done
          part item3 "$s0"

          for crate in web profile; do
            m=tools/r3-trials/$crate/Cargo.toml
            s0=$(date +%s)
            cargo clippy --locked --quiet --manifest-path "$m" --all-targets -- -D warnings
            e=$?
            echo "u03r4_clippy machine=$machine crate=$crate exit=$e"
            [ "$e" -eq 0 ] || code=1
            part "clippy_$crate" "$s0"
            s0=$(date +%s)
            cargo test --locked --manifest-path "$m" --no-fail-fast >"$RUNNER_TEMP/u03r4-test-$crate.log" 2>&1
            e=$?
            grep -E '^test result:' "$RUNNER_TEMP/u03r4-test-$crate.log" | awk -v c="$crate" '{ p += $4; f += $6 } END { print "u03r4_tests crate=" c " passed=" p " failed=" f }'
            grep -E '^test .* FAILED$' "$RUNNER_TEMP/u03r4-test-$crate.log"
            echo "u03r4_tests crate=$crate exit=$e"
            [ "$e" -eq 0 ] || code=1
            part "tests_$crate" "$s0"
          done

          bin_of() {
            cargo test --locked --manifest-path "tools/r3-trials/$1/Cargo.toml" "$2" --no-run --message-format=json 2>/dev/null |
              grep '"test":true' | grep "\"name\":\"$3\"" |
              sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | sed 's|\\\\|/|g' | head -1
          }

          loop() {
            bin=$1
            name=$2
            n=0
            ok=0
            zero=0
            while [ "$n" -lt 200 ]; do
              out=$("$bin" --exact "$name" --test-threads=1 2>&1)
              case "$out" in
                *"test result: ok. 1 passed; 0 failed;"*) ok=$((ok + 1)) ;;
                *"test result: ok. 0 passed;"*) zero=$((zero + 1)) ;;
              esac
              n=$((n + 1))
            done
            echo "u03r4_loop machine=$machine test=$name runs=$n passed=$ok ran_no_test=$zero"
            [ "$ok" -eq 200 ] || code=1
          }

          s0=$(date +%s)
          plib=$(bin_of profile --lib r3_profile)
          pbin=$(bin_of profile --bin=profile-trial profile-trial)
          pset=$(bin_of profile --test=print_set print_set)
          wbin=$(bin_of web --bin=web-trial web-trial)
          echo "u03r4_bins plib=$([ -x "$plib" ] && echo yes || echo no) pbin=$([ -x "$pbin" ] && echo yes || echo no) pset=$([ -x "$pset" ] && echo yes || echo no) wbin=$([ -x "$wbin" ] && echo yes || echo no)"
          for t in item_3_prints_browser_started_yes_only_for_a_start_that_returned_ok \
            the_outer_item_3_line_follows_the_inner_line_by_its_keys \
            the_flag_lines_are_the_flags_of_each_product_start_less_the_executors_own \
            the_refusal_causes_name_every_refused_line; do
            loop "$plib" "product::tests::$t"
          done
          loop "$pset" the_programs_print_set_is_the_last_blocks_flag_and_pref_lines
          loop "$wbin" driver::org_tests::the_kill_line_names_the_browser_of_its_context
          loop "$wbin" driver::org_tests::a_page_read_without_the_setting_counts_neither_as_the_effect_nor_as_a_miss
          if [ "$machine" = hosted-mac ]; then
            for t in a_fixture_that_cannot_be_reset_is_no_start_of_the_browser a_browser_that_ends_at_once_did_not_start \
              the_outer_item_3_reads_the_last_inner_line_of_the_programs_output; do
              loop "$pbin" "tests::$t"
            done
            loop "$wbin" driver::leftover_tests::of_the_run_counts_a_member_born_after_the_kill
            loop "$wbin" driver::leftover_tests::a_process_that_names_a_longer_profile_is_left_alone
          fi
          part loops "$s0"

          s0=$(date +%s)
          sh tools/r3-trials/web/hosted/harness.sh --self-test >"$RUNNER_TEMP/u03r4-harness.log" 2>&1
          e=$?
          echo "u03r4_harness_self_test exit=$e $(tail -1 "$RUNNER_TEMP/u03r4-harness.log")"
          [ "$e" -eq 0 ] || code=1
          py=python3
          command -v python3 >/dev/null 2>&1 || py=python
          "$py" -I tools/r3-trials/web/hosted/collect.py --self-test >"$RUNNER_TEMP/u03r4-collect.log" 2>&1
          e=$?
          grep ' ok=no' "$RUNNER_TEMP/u03r4-collect.log"
          echo "u03r4_collect_self_test exit=$e $(tail -1 "$RUNNER_TEMP/u03r4-collect.log")"
          [ "$e" -eq 0 ] || code=1
          part self_tests "$s0"
          exit "$code"
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 10-r3-layout 16-shell-lint 19-home-paths
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-r3-layout 16-shell-lint 19-home-paths
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: U0.3 round 4 item 3, clippy, tests, loops and self-tests (scratch branch, never merged)
        if: always()
        timeout-minutes: 80
        shell: bash
        run: |
          #!/bin/bash
          # The U0.3 round-4 step of the scratch workflow (never merged): item 3's calls with the denial log's
          # kinds and the kept standard error's sandbox line, both trials' clippy and whole tests once, every
          # new or changed test of the round 200 times by exact name, both self-tests, each part's seconds.
          set +e
          code=0
          case "$(uname -s)" in
            Darwin)
              machine=hosted-mac
              chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
              ;;
            *)
              machine=hosted-win
              chrome="C:/Program Files/Google/Chrome/Application/chrome.exe"
              ;;
          esac
          repo=$(pwd)
          part() {
            echo "u03r4_seconds machine=$machine part=$1 seconds=$(($(date +%s) - $2))"
          }
          echo "u03r4 machine=$machine at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          s0=$(date +%s)
          for call in first final control; do
            [ "$call" = control ] && [ "$machine" != hosted-mac ] && continue
            case $call in
              first) extra="--flags first" set=first ;;
              final) extra="" set=final ;;
              control) extra="--sandbox-off" set=final ;;
            esac
            scratch=$(mktemp -d "$RUNNER_TEMP/r4cell.XXXXXX")
            # shellcheck disable=SC2086
            sh tools/r3-trials/profile/run.sh --item 3 $extra --browser "$chrome" --port 18090 --scratch "$scratch"
            e=$?
            echo "u03r4_call machine=$machine call=$call exit=$e"
            sh .u03r4/item3-extra.sh "$scratch" "$repo" "$machine" "$set"
          done
          part item3 "$s0"

          for crate in web profile; do
            m=tools/r3-trials/$crate/Cargo.toml
            s0=$(date +%s)
            cargo clippy --locked --quiet --manifest-path "$m" --all-targets -- -D warnings
            e=$?
            echo "u03r4_clippy machine=$machine crate=$crate exit=$e"
            [ "$e" -eq 0 ] || code=1
            part "clippy_$crate" "$s0"
            s0=$(date +%s)
            cargo test --locked --manifest-path "$m" --no-fail-fast >"$RUNNER_TEMP/u03r4-test-$crate.log" 2>&1
            e=$?
            grep -E '^test result:' "$RUNNER_TEMP/u03r4-test-$crate.log" | awk -v c="$crate" '{ p += $4; f += $6 } END { print "u03r4_tests crate=" c " passed=" p " failed=" f }'
            grep -E '^test .* FAILED$' "$RUNNER_TEMP/u03r4-test-$crate.log"
            echo "u03r4_tests crate=$crate exit=$e"
            [ "$e" -eq 0 ] || code=1
            part "tests_$crate" "$s0"
          done

          bin_of() {
            cargo test --locked --manifest-path "tools/r3-trials/$1/Cargo.toml" "$2" --no-run --message-format=json 2>/dev/null |
              grep '"test":true' | grep "\"name\":\"$3\"" |
              sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | sed 's|\\\\|/|g' | head -1
          }

          loop() {
            bin=$1
            name=$2
            n=0
            ok=0
            zero=0
            while [ "$n" -lt 200 ]; do
