               ["--test", "start_windows"], T("a_start_closes_its_own_handle_of_the_child_s_error_file"), "caught"),
          ]


          def restore(path):
              subprocess.run(["git", "checkout", "--", path], cwd=CRATE, check=True)


          def apply(row):
              path = os.path.join(CRATE, row[3])
              text = open(path, encoding="utf-8").read()
              n = text.count(row[4])
              if n != 1:
                  return "text found %d times" % n
              open(path, "w", encoding="utf-8").write(text.replace(row[4], row[5]))
              return None


          def main():
              mode = sys.argv[1]
              only = set(sys.argv[2:])
              hosted = os.environ.get("GITHUB_ACTIONS") == "true"
              if mode in ("macos", "windows") and not hosted:
                  sys.exit("the hosted rows run on a hosted runner alone")
              if mode == "local" and hosted:
                  sys.exit("the local rows run on the development Mac")
              caught = survived = bad = 0
              for row in ROWS:
                  rid, cls, systems, f = row[0], row[1], row[2], row[3]
                  if only and rid not in only:
                      continue
                  if mode == "local" and cls != "local":
                      continue
                  if mode in ("macos", "windows") and (cls != "hosted" or systems not in (mode, "both")):
                      continue
                  fault = apply(row)
                  if fault:
                      restore(f)
                      print("row=%s result=bad cause=%s" % (rid, fault))
                      bad += 1
                      continue
                  if mode == "apply-only":
                      restore(f)
                      print("row=%s result=applied" % rid)
                      continue
                  cmd = ["cargo", "test", "--locked"] + row[6] + ["--"] + row[7]
                  exact = not (len(row[7]) == 1 and row[7][0].endswith("::tests"))
                  if exact:
                      cmd.append("--exact")
                  t0 = time.monotonic()
                  try:
                      out = subprocess.run(cmd, cwd=CRATE, capture_output=True, text=True, timeout=900)
                      code, text = out.returncode, out.stdout + out.stderr
                  except subprocess.TimeoutExpired as e:
                      code, text = 124, ""
                  finally:
                      restore(f)
                  secs = time.monotonic() - t0
                  failing = [l for l in text.splitlines() if l.startswith("test ") and l.endswith("FAILED")]
                  results = [l for l in text.splitlines() if l.startswith("test result:")]
                  compile_error = "error[E" in text or "could not compile" in text
                  word = "caught" if code != 0 else "survives"
                  expected = row[8]
                  ok = (word == "caught") == (expected == "caught")
                  if word == "caught":
                      caught += 1
                  else:
                      survived += 1
                  if not ok:
                      bad += 1
                  print("row=%s class=%s result=%s expected=%s exit=%d seconds=%.0f compile_error=%s failing=%s results=%s" % (
                      rid, cls, word, "caught" if expected == "caught" else "survives", code, secs,
                      "yes" if compile_error else "no",
                      ",".join(l[5:-8].strip() for l in failing) or "-",
                      " | ".join(results) or "-"))
              print("mutants mode=%s caught=%d survived=%d bad=%d" % (mode, caught, survived, bad))
              sys.exit(1 if bad else 0)


          main()
          PY
          code=$?
          echo "seconds step=web_widening_copies s=$(( $(date +%s) - t0 ))"
          git status --porcelain
          exit $code
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
