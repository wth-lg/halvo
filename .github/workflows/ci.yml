name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 45-r4-words
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 45-r4-words
      - name: Page harness fetch
        shell: bash
        run: sh tools/r4-page/fetch.sh "$RUNNER_TEMP/r4-page-browsers"
      - name: Agents view
        shell: bash
        run: |
          export R4_PAGE_BROWSERS="$RUNNER_TEMP/r4-page-browsers"
          start=$(date +%s)
          code=0
          node ui/tests/r4/agents/test.mjs || code=$?
          echo "seconds agents-view $(( $(date +%s) - start ))"
          exit $code
      - name: Needs view
        shell: bash
        run: |
          export R4_PAGE_BROWSERS="$RUNNER_TEMP/r4-page-browsers"
          start=$(date +%s)
          code=0
          node ui/tests/r4/needs/needs.test.mjs || code=$?
          echo "seconds needs-view $(( $(date +%s) - start ))"
          exit $code
      - name: Needs page check
        shell: bash
        run: |
          export R4_PAGE_BROWSERS="$RUNNER_TEMP/r4-page-browsers"
          start=$(date +%s)
          code=0
          node ui/tests/r4/needs/page.mjs || code=$?
          echo "seconds needs-page $(( $(date +%s) - start ))"
          exit $code
      - name: H14, 20 runs
        shell: bash
        run: |
          export R4_PAGE_BROWSERS="$RUNNER_TEMP/r4-page-browsers"
          start=$(date +%s)
          passed=0
          failed=0
          for i in $(seq 1 20); do
            code=0
            R4_CASES=h14 node ui/tests/r4/needs/needs.test.mjs --tests holds > "$RUNNER_TEMP/loop-$i.txt" 2>&1 || code=$?
            if [ "$code" -eq 0 ] && grep -q '^needs tests=1 passed=1 ' "$RUNNER_TEMP/loop-$i.txt" && grep -qx 'holds case ran h14_a_reply_that_drops_the_waiting_confirmation_before_the_first_close' "$RUNNER_TEMP/loop-$i.txt"; then
              passed=$((passed + 1))
            else
              failed=$((failed + 1))
              echo "loop run $i exit=$code result=$(grep -c '^needs tests=' "$RUNNER_TEMP/loop-$i.txt") ran=$(grep -c '^holds case ran ' "$RUNNER_TEMP/loop-$i.txt")"
              grep -E '^(ok|not ok|needs tests=|holds case ran )' "$RUNNER_TEMP/loop-$i.txt" | cut -c1-400
            fi
          done
          echo "loop h14 runs=20 passed=$passed failed=$failed"
          echo "seconds h14-loop $(( $(date +%s) - start ))"
          [ "$passed" -eq 20 ]
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
