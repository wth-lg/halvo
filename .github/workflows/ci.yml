name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  loop-2:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: win-3 W3-12, the cold and warm orders 60 times each and the spaced sequence's counts (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/loop.log"
          cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/fun.json" 2>"$log"
          echo "LOOP build fun exit=$?"
          cargo test --locked -p halvo-capture --lib --no-run --message-format json >"$RUNNER_TEMP/lib.json" 2>"$log"
          echo "LOOP build lib exit=$?"
          fun=$(tr -d '\r' <"$RUNNER_TEMP/fun.json" | sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          lib=$(tr -d '\r' <"$RUNNER_TEMP/lib.json" | grep '"kind":\["lib"\]' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          [ -n "$fun" ] && [ -n "$lib" ] || echo "LOOP no executable"
          for t in windows::input::tests::spaced_keys_cleared_among_other_marks_get_the_same_verdicts_with_and_without_the_seam; do
            timeout 600 "$lib" --exact "$t" --nocapture --test-threads=1 >"$log" 2>&1 </dev/null
            echo "LOOP test=$t run=1 exit=$?"
            tr -d '\r' <"$log" | grep -E 'TF spaced-sequence|^test result' | cut -c1-300
          done
          for t in browser::cold_and_warm_orders_in_chrome browser::cold_and_warm_orders_in_edge; do
            passed=0
            for run in $(seq 1 60); do
              timeout 600 "$fun" --ignored --exact --nocapture "$t" </dev/null >"$log" 2>&1
              code=$?
              if [ "$code" -eq 0 ] && tr -d '\r' <"$log" | grep -q '^test result: ok. 1 passed; 0 failed'; then
                passed=$((passed + 1))
                echo "LOOP test=$t run=$run exit=$code passed=1"
              else
                echo "LOOP test=$t run=$run exit=$code passed=0"
                tr -d '\r' <"$log" | grep -E '^TF |panicked at|^  left|^ right|INCONCLUSIVE|assertion|^test result|cold:|warm:' | cut -c1-900
              fi
            done
            echo "LOOP test=$t runs=60 passed=$passed"
          done
          echo "LOOP end"
          exit 0
