name: ci
# scratch: S-95 round A, the rows of the store and the custody with their first failing lines, and the test of the two creates on both systems; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: "S-95: the three tests unmutated, and the four rows each with the first failing line of its test (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PROOF_TESTS: store::hardening_tests::two_creates_at_one_instant_under_one_root_id_destroy_no_root_that_a_create_made store::durable::tests::a_durable_write_never_writes_through_an_existing_temporary_name custody::file_root::tests::a_root_write_leaves_alone_a_partial_root_file_that_another_writer_holds
          PROOF_ROWS: delete-all-destroys-nothing create-destroys-the-root-of-a-create-at-the-same-instant partial-root-file-shared-by-two-writers root-partial-name-shared-by-every-writer
        run: |
          set +e -u
          runner=${HALVO_STEP_RUNNER:-scripts/r1-gate/mutation-test.sh}
          cargo=${HALVO_STEP_CARGO:-cargo}
          tmp=${RUNNER_TEMP:-/tmp}
          status=0
          for test in $PROOF_TESTS; do
            out="$tmp/proof-unmutated-${test##*::}.out"
            "$cargo" test -q --locked -p halvo-capture --lib -- --exact "$test" >"$out" 2>&1
            code=$?
            result=$(grep -E '^test result:' "$out" | tail -n 1)
            printf 'PROOF unmutated %s: cargo exit %s; %s\n' "$test" "$code" "${result:-no result line}"
            grep -E '^running [0-9]+ tests?$' "$out" | tail -n 1 | sed 's/^/PROOF   /'
            [ -n "$result" ] || status=1
          done
          for row in $PROOF_ROWS; do
            out="$tmp/proof-row-$row.out"
            t0=$(date +%s)
            sh "$runner" --keep-scratch --only "$row" >"$out" 2>&1
            code=$?
            line=$(grep -E "^[A-Z-]+ mutation:$row \(" "$out" | tail -n 1)
            printf 'PROOF row %s: runner exit %s, seconds %s; %s\n' "$row" "$code" "$(($(date +%s) - t0))" "${line:-no line for the row}"
            grep -E '^(PASS|FAIL) unmutated|^mutation rows:' "$out" | sed 's/^/PROOF   /'
            [ -n "$line" ] || status=1
            scratch=$(sed -n 's/^scratch mutation: //p' "$out" | tail -n 1)
            case $line in
              *"gate said: "*) printf 'PROOF   %s: a gate verdict; the gate line stands in the result line above\n' "$row"; continue ;;
            esac
            if [ -n "$scratch" ] && [ -f "$scratch/work/test.out" ]; then
              awk '/panicked at/ { p = 1 } p && n < 5 { print; n++; next } /^test result:/ { print }' "$scratch/work/test.out" | cut -c1-700 | sed "s/^/PROOF   $row test.out: /"
            else
              printf 'PROOF   %s: no kept test output (scratch %s)\n' "$row" "${scratch:-not printed}"
              status=1
            fi
          done
          exit "$status"
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: "S-95: the test of the two creates unmutated on Windows (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        env:
          PROOF_TESTS: store::hardening_tests::two_creates_at_one_instant_under_one_root_id_destroy_no_root_that_a_create_made
        run: |
          set +e -u
          cargo=${HALVO_STEP_CARGO:-cargo}
          tmp=${RUNNER_TEMP:-/tmp}
          status=0
          for test in $PROOF_TESTS; do
            out="$tmp/proof-unmutated-${test##*::}.out"
            "$cargo" test -q --locked -p halvo-capture --lib -- --exact "$test" >"$out" 2>&1
            code=$?
            result=$(grep -E '^test result:' "$out" | tail -n 1)
            printf 'PROOF windows unmutated %s: cargo exit %s; %s\n' "$test" "$code" "${result:-no result line}"
            grep -E '^running [0-9]+ tests?$|panicked at' "$out" | head -n 3 | sed 's/^/PROOF   /'
            [ -n "$result" ] || status=1
          done
          exit "$status"
