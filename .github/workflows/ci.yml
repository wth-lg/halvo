name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 30-core-boundary-proofs 30-formal-covered 30-store-ignore-reason 31-store-full-volume 25-store-peak-rss
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 30-core-boundary-proofs 30-formal-covered 30-store-ignore-reason 31-store-full-volume 25-store-peak-rss
      - name: store-3b loop (macos)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          tmp=${RUNNER_TEMP:-$TMPDIR}
          cargo test --locked -p halvo-capture --lib --no-run --message-format=json >"$tmp/store-3b-build.json" 2>"$tmp/store-3b-build.err"
          bin=$(python3 -c 'import json,sys
          for line in open(sys.argv[1]):
              try: m = json.loads(line)
              except ValueError: continue
              if m.get("reason") == "compiler-artifact" and m.get("profile", {}).get("test") and m.get("target", {}).get("name") == "halvo_capture" and m.get("executable"): print(m["executable"])' "$tmp/store-3b-build.json" | tail -n 1)
          echo "test binary found: $([ -n "$bin" ] && echo yes || echo no)"
          H=store::hardening_tests::held_roots
          P=store::hardening_tests::pass_two
          names="$H::st46_k6_the_handles_delete_destroys_its_root_in_the_moved_roots_directory_and_leaves_the_directory_at_the_old_name $H::a_roots_directory_moved_while_a_store_holds_it_loses_the_root_where_it_lies_and_the_delete_says_so $H::a_root_file_renamed_inside_the_held_roots_directory_is_destroyed_where_it_lies $H::an_opens_cleanup_leaves_the_root_that_store_key_names_under_the_name_of_the_marks_root $H::a_made_mark_records_the_identity_of_the_root_file_that_the_create_made $H::a_tail_without_the_lock_leaves_a_file_of_another_identity_at_the_marks_root_name_and_names_it $H::a_tail_reads_the_marks_root_left_when_only_a_file_of_another_identity_stands_at_its_name $H::a_creates_cleanup_by_a_made_mark_leaves_a_file_of_another_identity_at_the_marks_root_name $H::a_link_put_at_the_store_name_after_the_tails_look_leads_its_sweep_nowhere_else $H::an_abandoned_create_whose_root_cannot_be_destroyed_keeps_its_made_mark $H::a_create_refused_at_a_root_that_leaves_before_its_answer_publishes_no_root $H::a_data_directory_that_is_a_link_is_not_followed $H::delete_all_removes_a_short_file_at_the_roots_name_unwritten $H::the_tail_removes_a_short_file_at_the_marks_root_name_unwritten $H::an_abandoned_create_beside_unlistable_roots_keeps_what_names_its_root $H::no_mode_change_on_a_file_of_another_identity $H::an_opens_cleanup_beside_an_unlistable_held_directory_keeps_its_mark $H::an_abandoned_create_with_an_unlistable_held_directory_keeps_its_mark $P::a_root_file_renamed_aside_after_the_listing_is_destroyed_where_it_lies_and_no_copy_opens $P::a_root_file_renamed_aside_after_the_listing_with_a_link_at_its_name_is_destroyed_where_it_lies $P::a_root_file_renamed_aside_after_the_listing_with_an_empty_file_at_its_name_is_destroyed_where_it_lies $P::the_tail_follows_no_link_at_the_roots_name_of_its_data_directory custody::file_root::tests::a_cleanup_whose_partial_root_file_cannot_be_destroyed_answers_an_error custody::file_root::tests::a_root_write_whose_partial_name_another_writer_holds_leaves_that_file_and_makes_no_root"
          count=$(printf '%s\n' $names | grep -c .)
          passed=0
          shown=
          round=0
          while [ "$round" -lt 200 ]; do
            round=$((round + 1))
            (cd crates/halvo-capture && "$bin" --exact $names) >"$tmp/store-3b-round.txt" 2>&1
            if grep -q "^test result: ok\. $count passed; 0 failed" "$tmp/store-3b-round.txt"; then
              passed=$((passed + 1))
            elif [ -z "$shown" ]; then
              shown=yes
              echo "round $round failed:"
              tail -n 20 "$tmp/store-3b-round.txt"
            fi
          done
          printf 'loop store-3b-macos: passed %s of 200 rounds of %s tests\n' "$passed" "$count"
          [ "$passed" = 200 ]
      - name: store-3b rows to their end
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          set --
          for row in $(cut -f1 crates/halvo-capture/src/store/mutants.rows crates/halvo-capture/src/custody/mutants.rows crates/halvo-sqlcipher/mutants.rows); do
            set -- "$@" --only "$row"
          done
          echo "rows named: $(($# / 2))"
          sh scripts/r1-gate/mutation-test.sh "$@" 2>&1 | tee "${RUNNER_TEMP:-$TMPDIR}/store-3b-rows.txt" | grep --line-buffered -E '^(PASS|FAIL|OPEN|NOT-RUN|STOPPED|mutation rows|seconds mutation)'
          echo "runner_exit=${PIPESTATUS[0]}"
          true
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default -c core.fileMode=true "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 30-core-boundary-proofs 30-formal-covered 30-store-ignore-reason
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 30-core-boundary-proofs 30-formal-covered 30-store-ignore-reason
      - name: store-3b windows lines
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          cargo test --locked -p halvo-capture --lib -- --exact --nocapture --test-threads=1 store::hardening_tests::closed_list_windows::a_roots_directory_that_a_store_holds_cannot_be_renamed_until_the_store_is_dropped store::hardening_tests::closed_list_windows::a_store_below_a_real_directory_whose_name_ends_in_a_space_is_refused_and_nothing_under_it_changes store::hardening_tests::closed_list_windows::the_tail_follows_no_directory_link_at_the_roots_name_of_its_data_directory store::hardening_tests::closed_list_windows::a_create_in_a_directory_whose_name_is_not_unicode_leaves_only_the_lock_file_and_makes_no_root >"${RUNNER_TEMP:-$TMPDIR}/store-3b-lines.txt" 2>&1
          echo "cargo_exit=$?"
          grep -E '^(WIN-|test |test result)' "${RUNNER_TEMP:-$TMPDIR}/store-3b-lines.txt"
          true
      - name: store-3b loop (windows)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          names="store::hardening_tests::closed_list_windows::a_roots_directory_that_a_store_holds_cannot_be_renamed_until_the_store_is_dropped store::hardening_tests::closed_list_windows::a_store_below_a_real_directory_whose_name_ends_in_a_space_is_refused_and_nothing_under_it_changes store::hardening_tests::closed_list_windows::the_tail_follows_no_directory_link_at_the_roots_name_of_its_data_directory store::hardening_tests::closed_list_windows::a_root_file_moved_inside_the_held_roots_directory_is_destroyed_where_it_lies store::hardening_tests::closed_list_windows::a_read_only_root_file_moved_inside_the_held_roots_directory_is_destroyed_where_it_lies"
          count=$(printf '%s\n' $names | grep -c .)
          passed=0
          shown=
          round=0
          while [ "$round" -lt 200 ]; do
            round=$((round + 1))
            cargo test --locked -p halvo-capture --lib -- --exact $names >"${RUNNER_TEMP:-$TMPDIR}/store-3b-round.txt" 2>&1
            if grep -q "^test result: ok\. $count passed; 0 failed" "${RUNNER_TEMP:-$TMPDIR}/store-3b-round.txt"; then
              passed=$((passed + 1))
            elif [ -z "$shown" ]; then
              shown=yes
              echo "round $round failed:"
              tail -n 20 "${RUNNER_TEMP:-$TMPDIR}/store-3b-round.txt"
            fi
          done
          printf 'loop store-3b-windows: passed %s of 200 rounds of %s tests\n' "$passed" "$count"
          [ "$passed" = 200 ]
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
