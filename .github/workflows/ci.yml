name: ci

on:
  push:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Page harness fetch and self-test
        shell: bash
        run: |
          export R4_PAGE_BROWSERS="$RUNNER_TEMP/r4-page-browsers"
          sh tools/r4-page/fetch.sh "$R4_PAGE_BROWSERS"
          sh tools/r4-page/fetch.sh "$R4_PAGE_BROWSERS"
          node tools/r4-page/selftest.mjs
          git status --porcelain
          test -z "$(git status --porcelain)"

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Page harness fetch and self-test
        shell: bash
        run: |
          export R4_PAGE_BROWSERS="$RUNNER_TEMP/r4-page-browsers"
          sh tools/r4-page/fetch.sh "$R4_PAGE_BROWSERS"
          sh tools/r4-page/fetch.sh "$R4_PAGE_BROWSERS"
          node tools/r4-page/selftest.mjs
          git status --porcelain
          test -z "$(git status --porcelain)"
