name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 20-r3-policy 15-r3-test-dirs 10-r3-layout
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 20-r3-policy 15-r3-test-dirs 10-r3-layout
      - name: Fixture self-test (scratch, U2.2b)
        if: always()
        shell: bash
        run: node tools/fixture-server/variants/selftest.mjs
      - name: Hard-kill test with the pipe on the null device (scratch control, expected to fail)
        if: always()
        shell: bash
        run: |
          set +e
          f=crates/halvo-connect/tests/common/fixture.rs
          perl -0pi -e 's/\.stdin\(Stdio::piped\(\)\)(\r?\n)(\s*)\.stdout\(Stdio::piped\(\)\)/.stdin(Stdio::null())$1$2.stdout(Stdio::piped())/' "$f"
          changed=$(git diff --numstat -- "$f")
          out=$(cargo test -p halvo-connect --locked --test fixture a_hard_kill_of_the_test_process_ends_its_fixture_server -- --exact 2>&1)
          code=$?
          git checkout -- "$f"
          grep -E "^test a_hard_kill|^test result|ended within" <<< "$out"
          echo "control: changed=[$changed] exit=$code clean=[$(git status --porcelain | wc -l | tr -d ' ')]"
          if [ "$changed" = "1	1	$f" ] && [ "$code" != 0 ] && grep -q "test a_hard_kill_of_the_test_process_ends_its_fixture_server ... FAILED" <<< "$out"; then
            echo "control: the hard-kill test fails with the pipe on the null device"
            exit 0
          fi
          echo "control: the hard-kill test did not fail as it must"
          exit 1
      - name: Loop of the unit's new tests, 200 rounds (scratch, U2.2b)
        if: always()
        shell: bash
        run: |
          set +e
          rounds=200
          dir="$RUNNER_TEMP/u22b-loop"
          mkdir -p "$dir"
          exe() {
            cargo test --locked "$@" --no-run 2>&1 | sed -n 's/.*Executable .*(\(.*\))$/\1/p' | tr '\\' '/' | tail -n 1
          }
          lib=$(exe -p halvo-connect --lib)
          pages=$(exe -p halvo-connect --test pages)
          drafts=$(exe -p halvo-connect --test drafts)
          frame=$(exe -p halvo-connect --test frame)
          fixture=$(exe -p halvo-connect --test fixture)
          bind=$(exe -p halvo-agent-gate --test bind)
          schema=$(exe -p halvo-schema --lib)
          echo "binaries: lib=[$lib] pages=[$pages] drafts=[$drafts] frame=[$frame] fixture=[$fixture] bind=[$bind] schema=[$schema]"
          L="calendar::tests::an_instant_is_written_to_its_whole_second_in_utc calendar::tests::the_rule_keeps_cancelled_or_declined_events_that_start_in_the_window_and_that_another_person_organized calendar::tests::an_event_that_the_person_organized_is_left_out_and_counted_only_where_the_rule_would_select_it calendar::tests::an_item_without_an_id_or_a_key_that_the_rule_reads_counts_in_no_key calendar::tests::a_subject_that_is_null_or_missing_reads_as_empty_and_another_one_is_incomplete error::tests::a_request_that_did_not_leave_is_not_made_as_not_sent error::tests::an_answer_401_is_not_made_as_unauthorized error::tests::an_answer_429_is_not_made_as_throttled error::tests::every_other_answered_status_stays_unknown graph::tests::the_loopback_route_stands_under_the_feature_that_the_tests_name_with_its_marker graph::tests::an_answer_429_or_5xx_carries_the_seconds_of_retry_after_and_no_other_does graph::tests::a_send_answered_429_is_throttled_with_its_seconds_and_unknown_after_a_5xx graph::tests::an_answer_with_two_retry_after_lines_carries_no_seconds mail::tests::the_filter_names_the_sender_quoted_and_the_start_cut_to_its_whole_second mail::tests::every_byte_that_the_rule_for_a_sender_takes_is_quoted_and_encoded mail::tests::the_rule_selects_from_the_start_second_on_and_counts_an_earlier_or_unreadable_time mail::tests::a_message_stands_in_the_first_count_that_fits mail::tests::an_item_without_an_id_or_a_key_that_the_rule_reads_counts_in_no_key mail::tests::a_subject_that_is_null_or_missing_reads_as_empty mail::tests::a_reply_to_is_held_against_the_sender_byte_for_byte mail::tests::a_kept_message_holds_what_the_provider_gave"
          P="each_list_request_names_its_filter_page_size_and_fields_and_carries_the_prefer_header a_chain_follows_its_links_in_either_spelling_and_counts_an_id_that_an_earlier_page_gave an_id_that_an_earlier_chain_gave_is_counted_in_earlier_page a_calendar_id_that_an_earlier_page_gave_is_counted_in_earlier_page a_link_of_another_place_fails_the_call_and_no_request_is_sent_to_it a_page_with_more_items_than_asked_for_fails_the_call one_id_twice_on_one_page_or_an_id_that_a_path_would_lose_fails_the_call a_calendar_chain_of_ten_pages_with_a_link_to_an_eleventh_gives_more_pages_and_no_cut a_mail_chain_of_ten_pages_with_a_link_gives_more_pages_and_no_cut a_chain_of_nine_pages_whose_last_has_no_link_gives_neither_fact twenty_selected_events_before_the_end_of_the_tenth_page_give_the_cut_and_no_more_pages the_bound_met_at_the_last_item_of_the_tenth_page_with_a_link_left_gives_the_cut_and_no_more_pages eleven_selected_messages_give_ten_and_the_cut_and_ten_give_no_cut one_message_of_each_kind_left_out_gives_1_for_its_kind_and_0_for_the_others one_event_of_each_kind_left_out_gives_1_for_its_kind_and_0_for_the_others the_same_events_are_selected_in_either_order_of_the_view_below_the_bound"
          D="a_create_reply_answer_that_is_no_draft_fails_the_call_before_its_patch each_check_after_the_patch_holds_the_draft_back_with_its_message_and_its_reason a_cause_of_the_call_or_not_a_draft_wins_over_a_reason_of_the_closed_list a_draft_with_one_recipient_that_is_the_sender_and_no_conversation_key_gets_a_handle an_error_after_the_patch_fails_the_call_and_returns_what_the_call_made a_failed_create_reply_leaves_its_message_unreached after_a_send_one_patch_of_is_read_marks_its_message_and_none_for_a_read_receipt a_mark_whose_answer_names_another_message_or_no_read_flag_fails"
          F="ten_replies_with_every_field_at_its_bound_fit_one_confirmation_frame"
          X="the_message_from_before_the_start_is_left_out_by_the_filter_and_the_rule a_busy_service_answers_429_with_its_seconds_and_a_throttled_delete_is_not_made each_draft_that_a_variant_of_the_fixture_makes_is_held_back_or_fails_the_call under_no_reply_the_send_is_held_recorded_and_unknown"
          B="join_senders_names_the_entry_that_holds_a_comma join_senders_refuses_a_list_that_no_frame_can_carry_with_a_cause_of_its_own"
          S="executable::senders::tests::the_debug_form_names_the_fault_and_no_number_of_a_piece"
          run_set() {
            name=$1; bin=$2; names=$3
            want=$(wc -w <<< "$names" | tr -d ' ')
            passed=0
            for round in $(seq 1 $rounds); do
              out=$("$bin" --exact $names --test-threads 4 2>&1)
              if [[ "$out" == *"test result: ok. $want passed; 0 failed;"* ]]; then
                passed=$((passed + 1))
              else
                printf '%s\n' "$out" > "$dir/$name-$round.txt"
              fi
            done
            echo "loop $name: tests=$want passed $passed of $rounds" > "$dir/$name.result"
          }
          ( run_set pages "$pages" "$P"; run_set lib "$lib" "$L"; run_set frame "$frame" "$F"; run_set bind "$bind" "$B"; run_set schema "$schema" "$S" ) &
          ( run_set fixture "$fixture" "$X"; run_set drafts "$drafts" "$D" ) &
          wait
          fail=0
          for name in lib pages drafts frame fixture bind schema; do
            line=$(cat "$dir/$name.result" 2>/dev/null)
            echo "${line:-loop $name: no result}"
            [[ "$line" == *"passed $rounds of $rounds" ]] || fail=1
          done
          for f in "$dir"/*.txt; do [ -e "$f" ] && { echo "== $f"; grep -E "^test .*FAILED|panicked|test result" "$f" | head -n 8; }; done
          echo "loop: 53 new tests, $rounds rounds each, fail=$fail"
          exit $fail
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
