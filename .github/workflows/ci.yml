name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - name: Self-tests that commit in throwaway repositories
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          sh scripts/check-commit-messages.sh --self-test-two-paths
          sh scripts/check-commit-messages.sh --self-test-pre-push
          sh scripts/ci-commit-messages.sh --self-test
          sh scripts/merge-pr.sh --self-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos
      - name: Loop of the new tests of U4.10 (200 runs each)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          fail=0
          total=0
          loop() {
            pkg=$1; dir=$2; sel=$3; n=$4; shift 4
            total=$((total + n))
            read -r -a selw <<< "$sel"
            exe=$(cargo test --locked --no-run --message-format=json -p "$pkg" "${selw[@]}" 2>/dev/null | grep '"executable":"' | grep -E '"profile":\{[^}]*"test":true' | sed 's/.*"executable":"\([^"]*\)".*/\1/' | tail -n 1)
            exe=$(printf '%s' "$exe" | sed 's/\\\\/\\/g')
            if command -v cygpath >/dev/null 2>&1 && [ -n "$exe" ]; then exe=$(cygpath -u "$exe"); fi
            if [ -z "$exe" ] || [ ! -f "$exe" ]; then
              echo "loop $pkg $sel: no test binary"
              fail=1
              return
            fi
            start=$(date +%s)
            ok=0
            i=0
            while [ "$i" -lt 200 ]; do
              i=$((i + 1))
              res=$(cd "$dir" && "$exe" --exact "$@" 2>&1)
              if printf '%s\n' "$res" | grep -Eq "^test result: ok\. $n passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out"; then
                ok=$((ok + 1))
              else
                echo "loop $pkg $sel: run $i failed"
                printf '%s\n' "$res" | tail -n 40
              fi
            done
            echo "loop $pkg $sel tests=$n runs=200 passed=$ok seconds=$(( $(date +%s) - start ))"
            [ "$ok" -eq 200 ] || fail=1
          }
          loop halvo-schema crates/halvo-schema '--lib' 5 \
            executable::day::tests::the_day_moves_with_the_offset_at_the_edges_of_its_range \
            executable::day::tests::a_day_runs_from_its_first_nanosecond_to_its_last_on_the_offset_clock \
            executable::day::tests::an_instant_before_the_epoch_of_its_clock_is_day_0 \
            executable::day::tests::the_largest_instant_has_a_day_without_overflow \
            executable::day::tests::at_offset_0_the_day_is_the_utc_day_of_the_instant
          loop halvo-runner crates/halvo-runner '--lib' 3 \
            args::tests::an_offset_in_its_range_is_kept \
            args::tests::an_offset_out_of_range_or_of_another_form_is_refused \
            release::fake::every_row_takes_the_day_of_its_instant_at_the_runs_offset_either_way
          loop halvo-runner crates/halvo-runner '--test frames' 2 \
            a_start_without_a_utc_offset_or_with_one_out_of_range_is_refused_before_any_frame \
            a_utc_offset_from_minus_50400_to_50400_is_taken
          loop halvo-runner crates/halvo-runner '--test fill' 1 \
            every_row_of_a_run_takes_the_day_of_its_instant_at_the_runs_offset
          loop halvo-runner crates/halvo-runner '--test checkpoint' 1 \
            a_fill_run_sends_the_planned_row_before_prepare_and_the_made_row_before_the_propose
          loop halvo-agent-client crates/halvo-agent-client '--test start' 2 \
            a_start_gives_the_runner_the_callers_offset_as_utc_offset \
            a_start_whose_offset_the_runner_refuses_answers_not_started_with_the_runners_exit
          echo "loop tests=$total fail=$fail"
          exit "$fail"
      - name: Build
        shell: bash
        run: npm run tauri build
      - name: Version
        shell: bash
        run: test "$(target/release/bundle/macos/Halvo.app/Contents/MacOS/halvo --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-macos
          path: target/release/bundle/macos/Halvo.app
          if-no-files-found: error
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows
      - name: Loop of the new tests of U4.10 (200 runs each)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          fail=0
          total=0
          loop() {
            pkg=$1; dir=$2; sel=$3; n=$4; shift 4
            total=$((total + n))
            read -r -a selw <<< "$sel"
            exe=$(cargo test --locked --no-run --message-format=json -p "$pkg" "${selw[@]}" 2>/dev/null | grep '"executable":"' | grep -E '"profile":\{[^}]*"test":true' | sed 's/.*"executable":"\([^"]*\)".*/\1/' | tail -n 1)
            exe=$(printf '%s' "$exe" | sed 's/\\\\/\\/g')
            if command -v cygpath >/dev/null 2>&1 && [ -n "$exe" ]; then exe=$(cygpath -u "$exe"); fi
            if [ -z "$exe" ] || [ ! -f "$exe" ]; then
              echo "loop $pkg $sel: no test binary"
              fail=1
              return
            fi
            start=$(date +%s)
            ok=0
            i=0
            while [ "$i" -lt 200 ]; do
              i=$((i + 1))
              res=$(cd "$dir" && "$exe" --exact "$@" 2>&1)
              if printf '%s\n' "$res" | grep -Eq "^test result: ok\. $n passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out"; then
                ok=$((ok + 1))
              else
                echo "loop $pkg $sel: run $i failed"
                printf '%s\n' "$res" | tail -n 40
              fi
            done
            echo "loop $pkg $sel tests=$n runs=200 passed=$ok seconds=$(( $(date +%s) - start ))"
            [ "$ok" -eq 200 ] || fail=1
          }
          loop halvo-schema crates/halvo-schema '--lib' 5 \
            executable::day::tests::the_day_moves_with_the_offset_at_the_edges_of_its_range \
            executable::day::tests::a_day_runs_from_its_first_nanosecond_to_its_last_on_the_offset_clock \
            executable::day::tests::an_instant_before_the_epoch_of_its_clock_is_day_0 \
            executable::day::tests::the_largest_instant_has_a_day_without_overflow \
            executable::day::tests::at_offset_0_the_day_is_the_utc_day_of_the_instant
          loop halvo-runner crates/halvo-runner '--lib' 3 \
            args::tests::an_offset_in_its_range_is_kept \
            args::tests::an_offset_out_of_range_or_of_another_form_is_refused \
            release::fake::every_row_takes_the_day_of_its_instant_at_the_runs_offset_either_way
          loop halvo-runner crates/halvo-runner '--test frames' 2 \
            a_start_without_a_utc_offset_or_with_one_out_of_range_is_refused_before_any_frame \
            a_utc_offset_from_minus_50400_to_50400_is_taken
          loop halvo-runner crates/halvo-runner '--test fill' 1 \
            every_row_of_a_run_takes_the_day_of_its_instant_at_the_runs_offset
          loop halvo-runner crates/halvo-runner '--test checkpoint' 1 \
            a_fill_run_sends_the_planned_row_before_prepare_and_the_made_row_before_the_propose
          loop halvo-agent-client crates/halvo-agent-client '--test start' 2 \
            a_start_gives_the_runner_the_callers_offset_as_utc_offset \
            a_start_whose_offset_the_runner_refuses_answers_not_started_with_the_runners_exit
          echo "loop tests=$total fail=$fail"
          exit "$fail"
      - name: Build
        shell: bash
        run: npm run tauri build -- --no-bundle
      - name: Version
        shell: bash
        run: test "$(target/release/halvo.exe --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-windows
          path: target/release/halvo.exe
          if-no-files-found: error
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
