            "$out/lab.exe" "$v" -- powershell.exe -NoProfile -NonInteractive -Command "\$admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); \$w = 'yes'; try { [IO.File]::WriteAllText(\$env:B9_PROT + '\x.txt', 'x') } catch { \$w = 'refused' }; \$a = 'yes'; & auditpol.exe /set '/subcategory:{0CCE9226-69AE-11D9-BED3-505054503030}' /success:enable *> \$null; if (\$LASTEXITCODE -ne 0) { \$a = 'refused' }; \"lab-tree admin=\$admin write-admin-only-dir=\$w auditpol-set=\$a\"; \$me = Get-CimInstance Win32_Process -Filter \"ProcessId=\$PID\"; \$k = 'yes'; try { Stop-Process -Id \$me.ParentProcessId -Force -ErrorAction Stop } catch { \$k = 'refused' }; \"lab-tree kill-parent=\$k\"; exit 0" 2>&1 | tr -d '\r' | grep -E '^(lab|lab-tree) '
          done
          state before-any-run
          printf '== head %s\n' "$(git rev-parse HEAD)"
          state before-the-term-case
          sh scripts/egress/check.sh scripts/egress/lists/empty.txt -- powershell.exe -NoProfile -Command "Start-Sleep -Seconds 15" >"$out/term.out" 2>"$out/term.err" &
          term=$!
          sleep 12
          state during-a-run
          kill -TERM "$term"
          wait "$term"
          printf 'term case check exit=%s\n' "$?"
          state after-the-signal
          sleep 5
          sh scripts/egress/check.sh scripts/egress/lists/empty.txt -- sh scripts/egress/probe.sh none 2>"$out/next.err" >/dev/null
          printf 'next run exit=%s | %s\n' "$?" "$(tail -n 1 "$out/next.err" | tr -d '\r')"
          state after-the-next-run
          case_run h-icmp . C:/Windows/System32/PING.EXE -n 2 -w 1000 192.0.2.1
