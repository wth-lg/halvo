name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 30-r4-formal 45-r4-words 10-r4-layout
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 30-r4-formal 45-r4-words 10-r4-layout
      - name: U2.4b loop of its added and turned tests, rounds 2 and 3
        shell: bash
        run: |
          set -u
          out=$(cargo test -p halvo-coord --locked --no-run 2>&1) || { printf '%s\n' "$out" | tail -20; exit 1; }
          fail=0
          total=0
          while read -r target name; do
            b=$(printf '%s\n' "$out" | sed -n "s/.*Executable tests[/\\\\]$target\.rs (\(.*\))$/\1/p" | head -1)
            b=${b//\\//}
            if [ -z "$b" ]; then echo "loop $target $name binary=none"; fail=1; continue; fi
            ok=0
            for i in $(seq 1 200); do
              if "$b" --exact "$name" --test-threads 1 2>&1 | grep -q '^test result: ok. 1 passed; 0 failed'; then ok=$((ok+1)); fi
            done
            total=$((total+1))
            echo "loop $target $name passed=$ok of 200"
            [ "$ok" -eq 200 ] || fail=1
          done <<'EOF'
            schedule_meet meet_a_a_switch_off_refused_busy_whose_read_shows_the_check_body_takes_up_that_check
            schedule_meet meet_c_the_answer_to_the_check_of_a_switched_off_agent_ends_the_check_alone
            items_lapse rd83_a_stopping_lapse_cancels_then_decides_then_sends_its_row
            items_lapse rd83_the_guard_at_the_lapses_decision_refuses_the_records_of_an_earlier_allow
            items_lapse rd83_a_cancel_that_panics_leaves_the_stop_the_lapse_and_the_row_owed
            items_lapse rd83_a_decision_that_panics_after_the_cancel_leaves_the_same
            items_lapse rd83_a_row_store_that_panics_leaves_the_cancel_sent
            items_lapse rd83_a_cancel_that_fails_sends_no_decision_and_one_that_answers_ended_does
            items_lapse rd83_time_out_holds_the_stop_before_its_result_and_keeps_its_order
            items_lapse rd83_lapse_bind_holds_the_stop_before_its_decline_and_keeps_its_order
            items_lapse rd83_a_lapse_that_stops_no_run_sends_no_cancel
            items_drive a_lapse_with_wait_limit_stops_the_run_then_answers_reject_then_stores_the_lapse
            items_drive a_lapse_with_cancelled_stops_the_run_then_answers_reject_then_stores_the_lapse
            coordinator_moves rd83_a_cancel_or_a_decision_that_panics_at_a_confirmations_stop_leaves_its_row_owed
            coordinator_moves rd52b_a_switch_off_whose_hold_the_read_shows_stops_and_pauses_in_the_order_of_each_lapse
            coordinator_moves rd52d_a_switch_off_drops_a_queued_start_and_a_switch_on_brings_none_back
            coordinator_seq a_queued_agent_whose_start_reads_a_hold_and_a_revealed_ready_item_keeps_that_item
            schedule_drive a_hold_stored_between_the_queue_and_the_start_drops_the_start
            schedule_drive a_tick_sends_active_before_the_start_that_it_serves_from_the_queue
            schedule_drive a_tick_whose_kill_ended_a_run_serves_no_second_start_after_a_drop
            schedule_drive a_tick_whose_read_of_the_agents_fails_takes_no_start_from_the_queue
            schedule_drive a_tick_with_no_live_run_takes_one_start_from_the_queue_before_the_agents
            schedule_drive tick_step_raises_ready_for_a_first_run_and_an_open_slot_of_the_person_and_starts_a_due_slot
            schedule_drive rd67_the_slot_of_a_skip_and_of_a_persons_start_read_the_clean_run
            schedule_drive skip_of_a_first_run_stores_a_null_slot_and_waits_for_the_next_day
            schedule_drawn drawn_sequences_keep_the_schedule_properties_with_the_limits_of_the_models
            schedule_drawn drawn_sequences_keep_the_schedule_properties_with_the_products_limits
            formal_traces formal_traces
            coordinator_moves rd52d_after_the_drop_and_a_switch_on_the_persons_start_is_taken_again
            coordinator_moves rd52d_a_read_that_first_shows_the_hold_of_a_queued_agent_drops_its_start
          EOF
          echo "loop tests=$total of 30 fail=$fail"
          [ "$total" -eq 30 ] || fail=1
          exit $fail
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 30-r4-formal 45-r4-words 10-r4-layout 20-r4-core
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 30-r4-formal 45-r4-words 10-r4-layout 20-r4-core
      - name: U2.4b loop of its added and turned tests, rounds 2 and 3
        shell: bash
        run: |
          set -u
          out=$(cargo test -p halvo-coord --locked --no-run 2>&1) || { printf '%s\n' "$out" | tail -20; exit 1; }
          fail=0
          total=0
          while read -r target name; do
            b=$(printf '%s\n' "$out" | sed -n "s/.*Executable tests[/\\\\]$target\.rs (\(.*\))$/\1/p" | head -1)
            b=${b//\\//}
            if [ -z "$b" ]; then echo "loop $target $name binary=none"; fail=1; continue; fi
            ok=0
            for i in $(seq 1 200); do
              if "$b" --exact "$name" --test-threads 1 2>&1 | grep -q '^test result: ok. 1 passed; 0 failed'; then ok=$((ok+1)); fi
            done
            total=$((total+1))
            echo "loop $target $name passed=$ok of 200"
            [ "$ok" -eq 200 ] || fail=1
          done <<'EOF'
            schedule_meet meet_a_a_switch_off_refused_busy_whose_read_shows_the_check_body_takes_up_that_check
            schedule_meet meet_c_the_answer_to_the_check_of_a_switched_off_agent_ends_the_check_alone
            items_lapse rd83_a_stopping_lapse_cancels_then_decides_then_sends_its_row
            items_lapse rd83_the_guard_at_the_lapses_decision_refuses_the_records_of_an_earlier_allow
            items_lapse rd83_a_cancel_that_panics_leaves_the_stop_the_lapse_and_the_row_owed
            items_lapse rd83_a_decision_that_panics_after_the_cancel_leaves_the_same
            items_lapse rd83_a_row_store_that_panics_leaves_the_cancel_sent
            items_lapse rd83_a_cancel_that_fails_sends_no_decision_and_one_that_answers_ended_does
            items_lapse rd83_time_out_holds_the_stop_before_its_result_and_keeps_its_order
            items_lapse rd83_lapse_bind_holds_the_stop_before_its_decline_and_keeps_its_order
            items_lapse rd83_a_lapse_that_stops_no_run_sends_no_cancel
            items_drive a_lapse_with_wait_limit_stops_the_run_then_answers_reject_then_stores_the_lapse
            items_drive a_lapse_with_cancelled_stops_the_run_then_answers_reject_then_stores_the_lapse
            coordinator_moves rd83_a_cancel_or_a_decision_that_panics_at_a_confirmations_stop_leaves_its_row_owed
            coordinator_moves rd52b_a_switch_off_whose_hold_the_read_shows_stops_and_pauses_in_the_order_of_each_lapse
            coordinator_moves rd52d_a_switch_off_drops_a_queued_start_and_a_switch_on_brings_none_back
            coordinator_seq a_queued_agent_whose_start_reads_a_hold_and_a_revealed_ready_item_keeps_that_item
            schedule_drive a_hold_stored_between_the_queue_and_the_start_drops_the_start
            schedule_drive a_tick_sends_active_before_the_start_that_it_serves_from_the_queue
            schedule_drive a_tick_whose_kill_ended_a_run_serves_no_second_start_after_a_drop
            schedule_drive a_tick_whose_read_of_the_agents_fails_takes_no_start_from_the_queue
            schedule_drive a_tick_with_no_live_run_takes_one_start_from_the_queue_before_the_agents
            schedule_drive tick_step_raises_ready_for_a_first_run_and_an_open_slot_of_the_person_and_starts_a_due_slot
            schedule_drive rd67_the_slot_of_a_skip_and_of_a_persons_start_read_the_clean_run
            schedule_drive skip_of_a_first_run_stores_a_null_slot_and_waits_for_the_next_day
            schedule_drawn drawn_sequences_keep_the_schedule_properties_with_the_limits_of_the_models
            schedule_drawn drawn_sequences_keep_the_schedule_properties_with_the_products_limits
            formal_traces formal_traces
            coordinator_moves rd52d_after_the_drop_and_a_switch_on_the_persons_start_is_taken_again
            coordinator_moves rd52d_a_read_that_first_shows_the_hold_of_a_queued_agent_drops_its_start
          EOF
          echo "loop tests=$total of 30 fail=$fail"
          [ "$total" -eq 30 ] || fail=1
          exit $fail
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
  lossy-loop-macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: U2.4b loop of the lossy runs at their full seeds
        shell: bash
        run: |
          set -u
          out=$(cargo test -p halvo-coord --locked --test coordinator_moves --no-run 2>&1) || { printf '%s\n' "$out" | tail -20; exit 1; }
          b=$(printf '%s\n' "$out" | sed -n "s/.*Executable tests[/\\\\]coordinator_moves\.rs (\(.*\))$/\1/p" | head -1)
          b=${b//\\//}
          if [ -z "$b" ]; then echo "loop coordinator_moves binary=none"; exit 1; fi
          ok=0
          start=$SECONDS
          for i in $(seq 1 200); do
            if "$b" --exact lossy_sequences_leave_no_item_with_two_closing_rows_and_send_allow_only_by_the_newest_row_in_both_forms --test-threads 1 2>&1 | grep -q '^test result: ok. 1 passed; 0 failed'; then ok=$((ok+1)); fi
          done
          echo "loop coordinator_moves lossy_sequences_leave_no_item_with_two_closing_rows_and_send_allow_only_by_the_newest_row_in_both_forms passed=$ok of 200 seconds=$((SECONDS-start))"
          [ "$ok" -eq 200 ]
  lossy-loop-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: U2.4b loop of the lossy runs at their full seeds
        shell: bash
        run: |
          set -u
          out=$(cargo test -p halvo-coord --locked --test coordinator_moves --no-run 2>&1) || { printf '%s\n' "$out" | tail -20; exit 1; }
          b=$(printf '%s\n' "$out" | sed -n "s/.*Executable tests[/\\\\]coordinator_moves\.rs (\(.*\))$/\1/p" | head -1)
          b=${b//\\//}
          if [ -z "$b" ]; then echo "loop coordinator_moves binary=none"; exit 1; fi
          ok=0
          start=$SECONDS
          for i in $(seq 1 200); do
            if "$b" --exact lossy_sequences_leave_no_item_with_two_closing_rows_and_send_allow_only_by_the_newest_row_in_both_forms --test-threads 1 2>&1 | grep -q '^test result: ok. 1 passed; 0 failed'; then ok=$((ok+1)); fi
          done
          echo "loop coordinator_moves lossy_sequences_leave_no_item_with_two_closing_rows_and_send_allow_only_by_the_newest_row_in_both_forms passed=$ok of 200 seconds=$((SECONDS-start))"
          [ "$ok" -eq 200 ]
