name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - name: Self-tests that commit in throwaway repositories
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          sh scripts/check-commit-messages.sh --self-test-two-paths
          sh scripts/check-commit-messages.sh --self-test-pre-push
          sh scripts/ci-commit-messages.sh --self-test
          sh scripts/merge-pr.sh --self-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos
      - name: daemon-1 loop of the round's cheap tests and the three changed copies
        if: always()
        shell: bash
        run: |
          set -u
          step_start=$(date +%s)
          py=$(command -v python3 || command -v python); bin=$(cargo test --locked -q -p halvo-capture --lib --no-run --message-format json 2>/dev/null | "$py" -c "import json,sys; print([m['executable'] for m in map(json.loads, sys.stdin) if m.get('reason') == 'compiler-artifact' and m.get('executable') and m['target']['name'] == 'halvo_capture'][-1])" | tr -d '\r')
          names='daemon::signal::tests::the_heap_and_footprint_readings_answer_with_a_size daemon::tests::two_switch_flags_parse_to_their_values_with_both_names_set daemon::tests::the_verify_modes_take_their_flags_and_nothing_else daemon::tests::the_hold_needs_two_seconds_and_is_a_flag_of_macos'
          want=4
          out=$(mktemp)
          pass=0
          # shellcheck disable=SC2086
          for _ in $(seq 200); do
            if "$bin" --exact $names --test-threads=4 >"$out" 2>&1 && tr -d '\r' <"$out" | grep -q "^test result: ok. $want passed"; then pass=$((pass + 1)); else tail -n 30 "$out"; fi
          done
          echo "daemon-1 loop (macos): binary $(basename "$bin"): tests $want, runs 200, passes $pass"
          art=target/ci-artifacts/26-daemon-owner-growth/test.txt
          echo "daemon-1 copies: head (check 26): $(grep -m 1 -o 'owner_heap_bytes .*' "$art")"
          echo "daemon-1 copies: head (check 26): $(grep -m 1 -o 'owner_growth_bytes=[0-9]* records=[0-9]* elapsed_ms=[0-9]*' "$art")"
          d=crates/halvo-capture/src/daemon
          perl -0pi -e 's/(pub struct DiscardPort \{\n    dir: PathBuf,\n    next: u64,\n)/$1    kept: Vec<Vec<u8>>,\n/; s/DiscardPort \{ dir, next: 1 \}/DiscardPort { dir, next: 1, kept: Vec::new() }/; s/(        self\.next \+= 1;\n)/$1        if std::env::var("DM10_COPY").as_deref() == Ok("keep300") && self.next % 300 == 0 {\n            self.kept.push(write.payload().to_vec());\n        }\n/' "$d/discard_port.rs"
          perl -0pi -e 's/(    fn acknowledged\(&mut self, disk_bytes: u64, now: Instants\) \{\n)/$1        if std::env::var("DM10_COPY").as_deref() == Ok("report") {\n            self.report(Report::DrainHealthy);\n        }\n/; s/(            let settled_heap = crate::daemon::signal::heap_bytes_in_use\(\)\.unwrap\(\);\n)/            let held: Vec<u8> = if std::env::var("DM10_COPY").as_deref() == Ok("hold") { vec![1u8; 1 << 20] } else { Vec::new() };\n$1/; s/(            println!\(\n                "owner_growth_bytes=)/            std::hint::black_box(&held);\n$1/' "$d/owner.rs"
          echo "daemon-1 copies: patch lines: keep300 $(grep -c 'DM10_COPY").as_deref() == Ok("keep300")' "$d/discard_port.rs"), report $(grep -c 'Ok("report")' "$d/owner.rs"), hold $(grep -c 'Ok("hold")' "$d/owner.rs"), held kept $(grep -c 'black_box(&held)' "$d/owner.rs")"
          b0=$(date +%s)
          cargo test --release --locked -q -p halvo-capture --lib --no-run 2>&1 | grep -E '^error' | head -5
          echo "daemon-1 copies: release build of the copy: $(( $(date +%s) - b0 )) s"
          for copy in keep300 report hold; do
            DM10_COPY=$copy cargo test --release --locked -p halvo-capture --lib -- --ignored --exact daemon::owner::tests::two_million_floor_records_grow_the_owner_by_at_most_the_bound --nocapture >"$out" 2>&1
            code=$?
            echo "daemon-1 copies: $copy: exit=$code"
            echo "daemon-1 copies: $copy: $(grep -m 1 -o 'owner_heap_bytes .*' "$out")"
            echo "daemon-1 copies: $copy: $(grep -m 1 -o 'owner_growth_bytes=[0-9]* records=[0-9]* elapsed_ms=[0-9]*' "$out")"
            echo "daemon-1 copies: $copy: $(grep -m 1 -o -E 'the owner grew by [0-9]+ bytes, above [0-9]+|the child failed' "$out")"
            echo "daemon-1 copies: $copy: $(grep -m 1 '^test result' "$out")"
          done
          git checkout -- "$d/discard_port.rs" "$d/owner.rs"
          echo "daemon-1 copies: restored, status lines $(git status --porcelain | grep -c '')"
          echo "daemon-1 loop (macos): the step took $(( $(date +%s) - step_start )) s"
      - name: Build
        shell: bash
        run: npm run tauri build
      - name: Version
        shell: bash
        run: test "$(target/release/bundle/macos/Halvo.app/Contents/MacOS/halvo --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-macos
          path: target/release/bundle/macos/Halvo.app
          if-no-files-found: error
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows
      - name: daemon-1 loop of the round's cheap tests
        if: always()
        shell: bash
        run: |
          set -u
          step_start=$(date +%s)
          py=$(command -v python3 || command -v python); bin=$(cargo test --locked -q -p halvo-capture --lib --no-run --message-format json 2>/dev/null | "$py" -c "import json,sys; print([m['executable'] for m in map(json.loads, sys.stdin) if m.get('reason') == 'compiler-artifact' and m.get('executable') and m['target']['name'] == 'halvo_capture'][-1])" | tr -d '\r')
          names='daemon::tests::two_switch_flags_parse_to_their_values_with_both_names_set daemon::tests::the_verify_modes_take_their_flags_and_nothing_else daemon::tests::the_hold_needs_two_seconds_and_is_a_flag_of_macos'
          want=3
          out=$(mktemp)
          pass=0
          # shellcheck disable=SC2086
          for _ in $(seq 200); do
            if "$bin" --exact $names --test-threads=4 >"$out" 2>&1 && tr -d '\r' <"$out" | grep -q "^test result: ok. $want passed"; then pass=$((pass + 1)); else tail -n 30 "$out"; fi
          done
          echo "daemon-1 loop (windows): binary $(basename "$bin"): tests $want, runs 200, passes $pass"
          echo "daemon-1 loop (windows): the step took $(( $(date +%s) - step_start )) s"
      - name: Build
        shell: bash
        run: npm run tauri build -- --no-bundle
      - name: Version
        shell: bash
        run: test "$(target/release/halvo.exe --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-windows
          path: target/release/halvo.exe
          if-no-files-found: error
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
