name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: steps added by scratch-ci.py

on:
  push:
    branches-ignore: ['land-*', 'land-*/**']
    tags: ['**']
  pull_request:
  schedule:
    - cron: '17 3 * * 0'
    - cron: '17 3 * * 3'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 15-gate-self-test 16-shell-lint 24-r7-wall
      - name: Processor
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 15-gate-self-test 16-shell-lint 24-r7-wall
      - name: Loop (names-1-check-15, 20 rounds)
        if: always()
        shell: bash
        run: |
          set +e
          pass=0; n=0
          while [ "$n" -lt 20 ]; do
            n=$((n + 1))
            if ( out=$(CI_D_REPO=$PWD sh scripts/r1/ci.d/15-gate-self-test.sh --self-test 2>&1); printf "%s\n" "$out"; grep -q -x "PASS self-test:15-gate-self-test (85 failing fixtures rejected)" <<<"$out" ) >"$RUNNER_TEMP/loop-$n.log" 2>&1; then pass=$((pass + 1)); else echo "round $n failed:"; tail -n 40 "$RUNNER_TEMP/loop-$n.log"; fi
          done
          echo "loop names-1-check-15: passed $pass of 20"
          [ "$pass" -eq 20 ]
      - name: Gate self-tests, both passes (names-1)
        if: always()
        shell: bash
        run: |
          set +e
          sh scripts/r1-gate/run.sh --self-test >"$RUNNER_TEMP/names-gate-first.log" 2>&1
          first=$?
          grep -E '^(PASS|FAIL) self-test:' "$RUNNER_TEMP/names-gate-first.log"
          echo "names-1 gate first pass: exit $first"
          dash_failed=0
          for script in scripts/r1-gate/check-*.sh; do
            dash "$script" --self-test >"$RUNNER_TEMP/names-gate-dash.log" 2>&1
            code=$?
            grep -E '^(PASS|FAIL) self-test:' "$RUNNER_TEMP/names-gate-dash.log"
            echo "names-1 gate dash pass: ${script##*/} exit $code"
            [ "$code" -eq 0 ] || dash_failed=$((dash_failed + 1))
          done
          echo "names-1 gate dash pass: $dash_failed scripts exited other than 0"
          exit 0
      - name: Runner name rules (names-1)
        if: always()
        shell: bash
        run: |
          set +e
          sh scripts/r1-gate/mutation-test.sh --apply-only --strict --only required-kinds-weakened >"$RUNNER_TEMP/names-rules.log" 2>&1
          code=$?
          grep -E '^(PASS|FAIL|OPEN|NOT-RUN) |^mutation rows:' "$RUNNER_TEMP/names-rules.log"
          echo "names-1 runner name rules: exit $code"
          exit 0
      - name: Rows on lib.sh to their end (names-1)
        if: always()
        shell: bash
        run: |
          set +e
          start=$(date +%s)
          sh scripts/r1-gate/mutation-test.sh --only required-kinds-weakened --only missing-line-accepted --only cost-sampler-constant --only memory-sampler-constant --only bound-reader-constant --only lease-control-skipped --only foreground-count-weakened --only marker-scan-skips-a-missing-capture 2>&1 | {
            mark=$start
            while IFS= read -r line; do
              printf '%s\n' "$line"
              case $line in
                "PASS mutation:"* | "FAIL mutation:"* | "OPEN mutation:"* | "NOT-RUN mutation:"*)
                  now=$(date +%s)
                  row=${line#* mutation:}
                  echo "names-1 row seconds: ${row%% *} $((now - mark)) (since the runner's start or the verdict line before)"
                  mark=$now ;;
              esac
            done
          }
          code=${PIPESTATUS[0]}
          echo "names-1 rows on lib.sh: runner exit $code, $(($(date +%s) - start)) s in all"
          exit "$code"
      - name: Long forms build
        if: github.event.schedule == '17 3 * * 3'
        shell: bash
        run: cargo test --locked -p halvo-capture --lib --test macos_stall_fixture --no-run
      - name: Long forms
        if: github.event.schedule == '17 3 * * 3'
        shell: bash
        env:
          HALVO_STALL_FORM: long
          CI_D_SCRIPT_LIMIT_S: 3600
        run: sh scripts/ci/run-ci-d.sh macos 51-macos-stall
      - name: Lockfile unchanged
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" macos
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 24-r7-wall
      - name: Processor
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 24-r7-wall
      - name: Long forms build
        if: github.event.schedule == '17 3 * * 3'
        shell: bash
        run: cargo test --locked -p halvo-capture --lib --test windows_functional --no-run
      - name: Long forms
        if: github.event.schedule == '17 3 * * 3'
        shell: bash
        env:
          HALVO_WF_FORM: long
          CI_D_SCRIPT_LIMIT_S: 3600
        run: sh scripts/ci/run-ci-d.sh windows 50-windows-functional 52-windows-browser
      - name: Scripts and hook in a core.autocrlf=true clone
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" windows
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
