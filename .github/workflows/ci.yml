name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/r4-trials/app -> target
          save-if: false
      - name: Trial app build, tests and self-check
        timeout-minutes: 40
        shell: bash
        run: |
          set +e +o pipefail
          app=tools/r4-trials/app
          started=$(date +%s)
          cargo build --release --locked --manifest-path "$app/Cargo.toml"
          echo "trial build exit=$? seconds=$(($(date +%s) - started))"
          started=$(date +%s)
          (cd "$app" && cargo test --locked --no-fail-fast) >"$RUNNER_TEMP/cargo-test.out" 2>&1
          code=$?
          tr -d '\r' <"$RUNNER_TEMP/cargo-test.out" | grep -E '^test result:|^test .* FAILED$|^test .* \.\.\. FAILED$' | sed 's/^/trial cargo_test /'
          echo "trial cargo_test exit=$code seconds=$(($(date +%s) - started))"
          started=$(date +%s)
          node --test 'tools/r4-trials/app/tests/*.test.mjs' 'tools/r4-trials/window/tests/*.test.mjs' >"$RUNNER_TEMP/node-test.out" 2>&1
          code=$?
          tr -d '\r' <"$RUNNER_TEMP/node-test.out" | grep -E '^[^ ]+ (tests|pass|fail|skipped) [0-9]+$|^[^ ]+ .*\([0-9.]+ms\)( # SKIP.*)?$' | sed 's/^/trial node_test /'
          echo "trial node_test exit=$code seconds=$(($(date +%s) - started))"
          started=$(date +%s)
          node "$app/selfcheck.mjs"
          echo "trial selfcheck exit=$? seconds=$(($(date +%s) - started))"
          exit 0
      - name: Sync cells
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        shell: bash
        run: |
          set +e +o pipefail
          for way in get channel events; do
            for arm in a2 b; do
              started=$(date +%s)
              sh tools/r4-trials/window/run.sh --sync "$way" --arm "$arm"
              echo "trial sync way=$way arm=$arm exit=$? seconds=$(($(date +%s) - started))"
            done
          done
          exit 0
      - name: Window arms
        if: ${{ !cancelled() }}
        timeout-minutes: 300
        shell: bash
        run: |
          set +e +o pipefail
          for arm in main a a2 b; do
            started=$(date +%s)
            sh tools/r4-trials/window/run.sh --arm "$arm" --runs 10
            echo "trial window arm=$arm exit=$? seconds=$(($(date +%s) - started))"
          done
          exit 0

  windows:
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/r4-trials/app -> target
          save-if: false
      - name: Trial app build, tests and self-check
        timeout-minutes: 40
        shell: bash
        run: |
          set +e +o pipefail
          app=tools/r4-trials/app
          started=$(date +%s)
          cargo build --release --locked --manifest-path "$app/Cargo.toml"
          echo "trial build exit=$? seconds=$(($(date +%s) - started))"
          started=$(date +%s)
          (cd "$app" && cargo test --locked --no-fail-fast) >"$RUNNER_TEMP/cargo-test.out" 2>&1
          code=$?
          tr -d '\r' <"$RUNNER_TEMP/cargo-test.out" | grep -E '^test result:|^test .* FAILED$|^test .* \.\.\. FAILED$' | sed 's/^/trial cargo_test /'
          echo "trial cargo_test exit=$code seconds=$(($(date +%s) - started))"
          started=$(date +%s)
          node --test 'tools/r4-trials/app/tests/*.test.mjs' 'tools/r4-trials/window/tests/*.test.mjs' >"$RUNNER_TEMP/node-test.out" 2>&1
          code=$?
          tr -d '\r' <"$RUNNER_TEMP/node-test.out" | grep -E '^[^ ]+ (tests|pass|fail|skipped) [0-9]+$|^[^ ]+ .*\([0-9.]+ms\)( # SKIP.*)?$' | sed 's/^/trial node_test /'
          echo "trial node_test exit=$code seconds=$(($(date +%s) - started))"
          started=$(date +%s)
          node "$app/selfcheck.mjs"
          echo "trial selfcheck exit=$? seconds=$(($(date +%s) - started))"
          exit 0
      - name: Sync cells
        if: ${{ !cancelled() }}
        timeout-minutes: 60
        shell: bash
        run: |
          set +e +o pipefail
          for way in get channel events; do
            for arm in a2 b; do
              started=$(date +%s)
              sh tools/r4-trials/window/run.sh --sync "$way" --arm "$arm"
              echo "trial sync way=$way arm=$arm exit=$? seconds=$(($(date +%s) - started))"
            done
          done
          exit 0
      - name: Window arms
        if: ${{ !cancelled() }}
        timeout-minutes: 300
        shell: bash
        run: |
          set +e +o pipefail
          for arm in main a a2 b; do
            started=$(date +%s)
            sh tools/r4-trials/window/run.sh --arm "$arm" --runs 10
            echo "trial window arm=$arm exit=$? seconds=$(($(date +%s) - started))"
          done
          exit 0
