name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 10-egress
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 10-egress
      - name: U0.1b 10-egress at the unit head with its long cases
        if: always()
        shell: bash
        run: |
          set +e
          job=macos
          part=sandbox
          unit="$RUNNER_TEMP/u01b-unit"
          git worktree add --detach "$unit" HEAD^1
          cd "$unit" || exit 1
          git log -1 --format='unit head %H %s'
          sh scripts/ci/run-ci-d.sh "$job" 10-egress >"$RUNNER_TEMP/u01b-unit.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/u01b-unit.txt"
          echo "search lines of the long cases:"
          grep -E '^(ok|not ok) search/|^part |^tests passed=' "target/ci-artifacts/10-egress/tests-$part.out"
          echo "U0.1b unit-head 10-egress job=$job exit=$code"
          grep -q '^long cases run' "$RUNNER_TEMP/u01b-unit.txt" && grep -qx 'PASS 10-egress' "$RUNNER_TEMP/u01b-unit.txt" && [ "$code" -eq 0 ]
      - name: U0.1b new search cases 200 times
        if: always()
        shell: bash
        run: |
          set +e
          want=10
          job=macos
          dir="$RUNNER_TEMP/u01b-loop-new"
          mkdir -p "$dir"
          new='search/a-name-of-18-digits-is-a-number search/a-name-of-19-digits-from-1-is-a-number search/a-letter-inside-a-name-is-no-number search/a-file-below-the-highest-is-passed-over search/names-that-are-no-number-passed-over'
          awk -v keep="$new" 'BEGIN { n = split(keep, k, " "); for (i = 1; i <= n; i++) want[k[i]] = 1 }
            /^  search_case search\// { if (!($2 in want)) next; kept++ }
            { print }
            END { print "# kept " kept > "/dev/stderr" }' scripts/egress/test.sh >"$dir/test-new.sh" 2>"$dir/kept.txt"
          echo "U0.1b loop copy: $(cat "$dir/kept.txt") of the search cases, the new ones"
          started=$(date +%s)
          per=${U01B_PER_WORKER:-50}
          worker() {
            i=0
            while [ "$i" -lt "$per" ]; do
              i=$((i + 1))
              sh "$dir/test-new.sh" search >"$dir/w$1-r$i.txt" 2>&1
              echo "exit=$?" >>"$dir/w$1-r$i.txt"
            done
          }
          workers=${U01B_WORKERS:-4}
          w=0
          while [ "$w" -lt "$workers" ]; do
            w=$((w + 1))
            worker "$w" &
          done
          wait
          total=0
          passed=0
          for f in "$dir"/w*-r*.txt; do
            total=$((total + 1))
            if grep -qx "part search ran=$want" "$f" && grep -qx "tests passed=$want failed=0" "$f" && grep -qx 'exit=0' "$f"; then
              passed=$((passed + 1))
            else
              echo "a run that missed: ${f##*/}"
              cat "$f"
            fi
          done
          echo "first run:"
          cat "$dir/w1-r1.txt"
          echo "U0.1b loop of the new cases job=$job runs=$total passed=$passed tests_per_run=$want seconds=$(($(date +%s) - started))"
          grep -qx '# kept 5' "$dir/kept.txt" && [ "$total" -eq $((workers * per)) ] && [ "$passed" -eq "$total" ]
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 10-egress
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 10-egress
      - name: U0.1b 10-egress at the unit head with its long cases
        if: always()
        shell: bash
        run: |
          set +e
          job=windows
          part=wfp
          unit="$RUNNER_TEMP/u01b-unit"
          git worktree add --detach "$unit" HEAD^1
          cd "$unit" || exit 1
          git log -1 --format='unit head %H %s'
          sh scripts/ci/run-ci-d.sh "$job" 10-egress >"$RUNNER_TEMP/u01b-unit.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/u01b-unit.txt"
          echo "search lines of the long cases:"
          grep -E '^(ok|not ok) search/|^part |^tests passed=' "target/ci-artifacts/10-egress/tests-$part.out"
          echo "U0.1b unit-head 10-egress job=$job exit=$code"
          grep -q '^long cases run' "$RUNNER_TEMP/u01b-unit.txt" && grep -qx 'PASS 10-egress' "$RUNNER_TEMP/u01b-unit.txt" && [ "$code" -eq 0 ]
      - name: U0.1b new search cases 200 times
        if: always()
        shell: bash
        run: |
          set +e
          want=10
          job=windows
          dir="$RUNNER_TEMP/u01b-loop-new"
          mkdir -p "$dir"
          new='search/a-name-of-18-digits-is-a-number search/a-name-of-19-digits-from-1-is-a-number search/a-letter-inside-a-name-is-no-number search/a-file-below-the-highest-is-passed-over search/names-that-are-no-number-passed-over'
          awk -v keep="$new" 'BEGIN { n = split(keep, k, " "); for (i = 1; i <= n; i++) want[k[i]] = 1 }
            /^  search_case search\// { if (!($2 in want)) next; kept++ }
            { print }
            END { print "# kept " kept > "/dev/stderr" }' scripts/egress/test.sh >"$dir/test-new.sh" 2>"$dir/kept.txt"
          echo "U0.1b loop copy: $(cat "$dir/kept.txt") of the search cases, the new ones"
          started=$(date +%s)
          per=${U01B_PER_WORKER:-50}
          worker() {
            i=0
            while [ "$i" -lt "$per" ]; do
              i=$((i + 1))
              sh "$dir/test-new.sh" search >"$dir/w$1-r$i.txt" 2>&1
              echo "exit=$?" >>"$dir/w$1-r$i.txt"
            done
          }
          workers=${U01B_WORKERS:-4}
          w=0
          while [ "$w" -lt "$workers" ]; do
            w=$((w + 1))
            worker "$w" &
          done
          wait
          total=0
          passed=0
          for f in "$dir"/w*-r*.txt; do
            total=$((total + 1))
            if grep -qx "part search ran=$want" "$f" && grep -qx "tests passed=$want failed=0" "$f" && grep -qx 'exit=0' "$f"; then
              passed=$((passed + 1))
            else
              echo "a run that missed: ${f##*/}"
              cat "$f"
            fi
          done
          echo "first run:"
          cat "$dir/w1-r1.txt"
          echo "U0.1b loop of the new cases job=$job runs=$total passed=$passed tests_per_run=$want seconds=$(($(date +%s) - started))"
          grep -qx '# kept 5' "$dir/kept.txt" && [ "$total" -eq $((workers * per)) ] && [ "$passed" -eq "$total" ]
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
