name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 50-windows-functional
      - name: win-3 round 3, doc tests, the break proof and the one-rule changes
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          git checkout --quiet --detach "$GITHUB_SHA"
          log="$RUNNER_TEMP/w3-r3.log"
          RUSTC_BOOTSTRAP=1 cargo test --locked -p halvo-capture --doc >"$log" 2>&1
          code=$?
          echo "ROUND3 doc tests with error codes exit=$code"
          tr -d '\r' <"$log" | grep -E 'PasswordFieldProbe|Packet|expected error codes|^test result'
          file=crates/halvo-capture/src/windows/secure_input.rs
          W3_SUB='s/Some\(check\(&PasswordFieldProbe\(reading\), Some\(age\)\)\)/Some(check(\&PasswordFieldProbe(SecureInputReading::Inactive), Some(age)))/' perl -0777 -i -pe 'BEGIN { $s = $ENV{W3_SUB} } eval $s; die $@ if $@' "$file"
          echo "ROUND3 break-proof change: $(git diff --numstat -- "$file")"
          git diff -- "$file" | grep -E '^[-+] ' | tr -d '\r'
          cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact x1_keystrokes_typed_into_a_password_field --nocapture >"$log" 2>&1
          echo "ROUND3 break-proof x1 exit=$?"
          tr -d '\r' <"$log" | grep -E 'TF x1 |panicked|^test .* \.\.\. |^test result'
          git checkout --quiet -- "$file"
          rows="$RUNNER_TEMP/w3-mutants.tsv"
          echo "" | base64 -d >"$rows"
          total=0
          while IFS="$(printf '\t')" read -r name file sub kind test; do
            [ -n "$name" ] || continue
            total=$((total + 1))
            W3_SUB=$sub perl -0777 -i -pe 'BEGIN { $s = $ENV{W3_SUB} } eval $s; die $@ if $@' "$file"
            if git diff --quiet -- "$file"; then
              echo "MUTANT $name verdict=not-applied"
              continue
            fi
            if [ "$kind" = lib ]; then
              timeout 600 cargo test --locked -p halvo-capture --lib -- --exact "$test" >"$log" 2>&1
            else
              timeout 600 cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact "$test" --nocapture >"$log" 2>&1
            fi
            code=$?
            short=${test##*::}
            body=$(tr -d '\r' <"$log")
            if printf '%s\n' "$body" | grep -q -e '^error\[E' -e '^error: could not compile'; then
              verdict=no-build
            elif printf '%s\n' "$body" | grep -q "^test .*$short \.\.\. FAILED"; then
              verdict=caught
            elif printf '%s\n' "$body" | grep -q 'test result: ok. 1 passed'; then
              verdict=survived
            else
              verdict=other-exit-$code
            fi
            echo "MUTANT $name test=$short verdict=$verdict"
            git checkout --quiet -- "$file"
          done <"$rows"
          echo "MUTANTS total=$total"
          git status --porcelain
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
