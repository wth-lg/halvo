name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 30-formal-covered
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 30-formal-covered
      - name: ST-47 loops of the new tests (macos)
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          tmp=${RUNNER_TEMP:-$TMPDIR}
          cargo test --locked -p halvo-capture --lib --no-run --message-format=json >"$tmp/st47-build.json" 2>"$tmp/st47-build.err"
          bin=$(python3 -c 'import json,sys
          for line in open(sys.argv[1]):
              try: m = json.loads(line)
              except ValueError: continue
              if m.get("reason") == "compiler-artifact" and m.get("profile", {}).get("test") and m.get("target", {}).get("name") == "halvo_capture" and m.get("executable"): print(m["executable"])' "$tmp/st47-build.json" | tail -n 1)
          echo "test binary found: $([ -n "$bin" ] && echo yes || echo no)"
          H=store::hardening_tests::held_roots
          bad=0
          loop() {
            label=$1
            shift
            count=$#
            (cd crates/halvo-capture && "$bin" --exact "$@") >"$tmp/st47-first.txt" 2>&1
            secs=$(sed -n 's/^test result: .* finished in \([0-9.]*\)s$/\1/p' "$tmp/st47-first.txt" | tail -n 1)
            rounds=200
            if [ "$count" = 1 ] && awk -v s="${secs:-0}" 'BEGIN { exit !(s > 2) }'; then rounds=20; fi
            passed=0
            shown=
            round=0
            while [ "$round" -lt "$rounds" ]; do
              round=$((round + 1))
              (cd crates/halvo-capture && "$bin" --exact "$@") >"$tmp/st47-round.txt" 2>&1
              if grep -q "^test result: ok\. $count passed; 0 failed" "$tmp/st47-round.txt"; then
                passed=$((passed + 1))
              elif [ -z "$shown" ]; then
                shown=yes
                echo "round $round of $label failed:"
                tail -n 20 "$tmp/st47-round.txt"
              fi
            done
            printf 'loop %s: passed %s of %s rounds of %s tests (first round %ss)\n' "$label" "$passed" "$rounds" "$count" "${secs:-?}"
            [ "$passed" = "$rounds" ] || bad=$((bad + 1))
          }
          started=$(date +%s)
          loop st47-v21 "$H::st47_t1_no_delete_answers_ok_while_a_root_renamed_inside_the_roots_folder_unwraps"
          loop st47-short \
            "$H::st47_t1_the_sweep_removes_a_hard_link_of_an_outside_file_at_a_plain_name_without_writing_through_it" \
            "$H::st47_t1_a_root_moved_into_a_directory_of_the_roots_folder_keeps_every_delete_incomplete" \
            "custody::file_root::tests::a_zero_fill_writes_in_blocks_of_a_fixed_size_and_never_the_whole_length_at_once" \
            "$H::st47_t2_a_store_path_that_is_a_link_is_refused_in_both_layouts" \
            "$H::st47_t2_a_scratch_store_path_that_is_a_link_removes_nothing_and_answers_no_ok" \
            "$H::st47_t2_control_a_link_at_the_store_name_of_a_data_directory_is_removed_and_the_roots_swept" \
            "$H::st47_t3_the_tail_refuses_a_link_spelled_with_a_trailing_separator_in_both_layouts" \
            "$H::st47_t3_the_roots_handles_open_refuses_a_link_spelled_with_a_trailing_separator" \
            "$H::st47_t3_the_stores_create_and_open_refuse_a_link_spelled_with_a_trailing_separator" \
            "$H::st47_t3_control_a_real_folder_spelled_with_a_trailing_separator_answers_as_the_folder" \
            "$H::st47_t4_a_create_over_a_live_store_answers_already_exists_before_any_cleanup"
          echo "seconds st47 loops: $(( $(date +%s) - started ))"
          [ "$bad" = 0 ]
      - name: ST-47 rows to their end (the 6 new and the 2 moved)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        shell: bash
        run: |
          set +e
          set --
          for row in sweep-at-other-names-taken-out second-name-at-another-name-written-through directory-in-the-roots-folder-not-counted callers-path-opened-whole scratch-refusal-removes-the-link create-cleans-up-before-it-refuses-a-present-key-file any-entry-at-the-root-name-reads-as-the-root-file tail-leaves-a-link-at-the-store-name; do
            set -- "$@" --only "$row"
          done
          echo "rows named: $(($# / 2))"
          started=$(date +%s)
          sh scripts/r1-gate/mutation-test.sh --budget 2100 "$@" 2>&1 | tee "${RUNNER_TEMP:-$TMPDIR}/st47-rows.txt" | grep --line-buffered -E '^(PASS|FAIL|OPEN|NOT-RUN|STOPPED|mutation rows|seconds mutation)'
          echo "runner_exit=${PIPESTATUS[0]}"
          echo "seconds st47 rows: $(( $(date +%s) - started ))"
          true
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default -c core.fileMode=true "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 30-formal-covered
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 30-formal-covered
      - name: ST-47 windows lines
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          cargo test --locked -p halvo-capture --lib -- --exact --nocapture --test-threads=1 store::hardening_tests::closed_list_windows::st47_t1_a_root_renamed_to_a_name_that_ends_in_a_dot_is_seen_by_the_delete store::hardening_tests::closed_list_windows::st47_t3_a_directory_link_spelled_with_a_trailing_separator_is_refused >"${RUNNER_TEMP:-$TMPDIR}/st47-lines.txt" 2>&1
          echo "cargo_exit=$?"
          grep -E '^(WIN-ST47|test |test result)' "${RUNNER_TEMP:-$TMPDIR}/st47-lines.txt"
          true
      - name: ST-47 loops of the new tests (windows)
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        shell: bash
        run: |
          set +e
          tmp=${RUNNER_TEMP:-$TMPDIR}
          cargo test --locked -p halvo-capture --lib --no-run >"$tmp/st47-build.out" 2>"$tmp/st47-build.err"
          bin=$(sed -n 's/^ *Executable unittests src[\\/]lib\.rs (\(.*\))$/\1/p' "$tmp/st47-build.err" | tail -n 1 | tr '\\' '/')
          [ -n "$bin" ] && bin="$PWD/$bin"
          echo "test binary found: $([ -n "$bin" ] && [ -f "$bin" ] && echo yes || echo no)"
          one() {
            if [ -n "$bin" ] && [ -f "$bin" ]; then
              (cd crates/halvo-capture && "$bin" --exact "$1")
            else
              cargo test --locked -p halvo-capture --lib -- --exact "$1"
            fi
          }
          bad=0
          loop() {
            name=$1
            one "$name" >"$tmp/st47-first.txt" 2>&1
            secs=$(sed -n 's/^test result: .* finished in \([0-9.]*\)s$/\1/p' "$tmp/st47-first.txt" | tail -n 1)
            rounds=200
            if awk -v s="${secs:-0}" 'BEGIN { exit !(s > 2) }'; then rounds=20; fi
            passed=0
            shown=
            round=0
            while [ "$round" -lt "$rounds" ]; do
              round=$((round + 1))
              one "$name" >"$tmp/st47-round.txt" 2>&1
              if grep -q '^test result: ok\. 1 passed; 0 failed' "$tmp/st47-round.txt"; then
                passed=$((passed + 1))
              elif [ -z "$shown" ]; then
                shown=yes
                echo "round $round of ${name##*::} failed:"
                tail -n 20 "$tmp/st47-round.txt"
              fi
            done
            printf 'loop %s: passed %s of %s rounds (first round %ss)\n' "${name##*::}" "$passed" "$rounds" "${secs:-?}"
            [ "$passed" = "$rounds" ] || bad=$((bad + 1))
          }
          started=$(date +%s)
          loop store::hardening_tests::closed_list_windows::st47_t1_a_root_renamed_to_a_name_that_ends_in_a_dot_is_seen_by_the_delete
          loop store::hardening_tests::closed_list_windows::st47_t3_a_directory_link_spelled_with_a_trailing_separator_is_refused
          loop custody::file_root::tests::a_zero_fill_writes_in_blocks_of_a_fixed_size_and_never_the_whole_length_at_once
          echo "seconds st47 loops: $(( $(date +%s) - started ))"
          [ "$bad" = 0 ]
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
