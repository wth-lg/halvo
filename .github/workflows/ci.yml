          printf 'rows: %s caught, %s not caught, %s other\n' "$caught" "$uncaught" "$other"
          printf 'not caught:%s\n' "$(awk '{printf " %s", $1}' "${RUNNER_TEMP:-/tmp}/not-caught-$ROWS_JOB.txt")"
          [ "$missing" -eq 0 ] && grep -q '^mutation rows:' "$out"
      - name: "The named test of each row not caught, on the unmutated tree (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        env:
