name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: daemon-1 DM-9 job start
        shell: bash
        run: date +%s | tee "$RUNNER_TEMP/dm9-job-start"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: daemon-1 DM-9 measure, three readings at 1024 and three at 768, then repeats while time allows
        shell: bash
        run: |
          set -u
          start=$(cat "$RUNNER_TEMP/dm9-job-start")
          grep -n 'pub const QUEUE_SLOTS\|DM9_QUEUE_SLOTS' crates/halvo-capture/src/daemon/owner.rs
          bin=$(cargo test --locked -q -p halvo-capture --lib --no-run --message-format json 2>/dev/null | python3 -c "import json,sys; print([m['executable'] for m in map(json.loads, sys.stdin) if m.get('reason') == 'compiler-artifact' and m.get('executable') and m['target']['name'] == 'halvo_capture'][-1])")
          echo "daemon-1 dm9 binary: $(basename "$bin") at $(( $(date +%s) - start )) s of the job"
          out=$(mktemp)
          notes=$(mktemp)
          reading() {
            depth=$1
            label=$2
            DM9_QUEUE_SLOTS=$depth "$bin" --exact daemon::owner::tests::two_million_floor_records_grow_the_owner_by_at_most_the_bound --nocapture --test-threads=1 >"$out" 2>&1 || true
            line=$(grep -o 'owner_growth_bytes=[0-9]* records=[0-9]* elapsed_ms=[0-9]*' "$out" | head -n 1)
            detail=$(grep -o 'owner_growth_detail .*' "$out" | head -n 1)
            echo "daemon-1 dm9 depth $depth $label: $line"
            echo "daemon-1 dm9 depth $depth $label: $detail"
            growth=$(printf '%s\n' "$line" | sed -n 's/.*owner_growth_bytes=\([0-9]*\).*/\1/p')
            before=$(printf '%s\n' "$detail" | sed -n 's/.*peak_before_first_record=\([0-9]*\).*/\1/p')
            high=$(printf '%s\n' "$detail" | sed -n 's/.*queued_high_water=\([0-9]*\).*/\1/p')
            slots=$(printf '%s\n' "$detail" | sed -n 's/.*queue_slots=\([0-9]*\).*/\1/p')
            if [ -z "$growth" ] || [ -z "$before" ] || [ -z "$high" ]; then
              verdict="does not count: no line"
              tail -n 30 "$out"
            elif [ "$slots" != "$depth" ]; then
              verdict="does not count: the child's depth is $slots"
            elif [ "$high" -ne $((depth + 1)) ]; then
              verdict="does not count: high water $high is not $((depth + 1))"
            elif [ "$before" -gt 8400000 ]; then
              verdict="does not count: peak before $before is above 8400000"
            else
              verdict="counts"
            fi
            echo "daemon-1 dm9 depth $depth $label: verdict $verdict; growth ${growth:-none} against 8388608; at $(( $(date +%s) - start )) s of the job"
            case $verdict in counts) ;; *) printf '%s %s\n' "$depth" "$label" >>"$notes" ;; esac
          }
          for round in 1 2 3; do reading 1024 "round $round"; done
          for round in 1 2 3; do reading 768 "round $round"; done
          while read -r depth label; do
            used=$(( $(date +%s) - start ))
            if [ $((used + 660)) -le 5160 ]; then
              reading "$depth" "repeat of $label"
            else
              echo "daemon-1 dm9 depth $depth: no repeat of $label, the job has run $used s and a reading takes up to 660 s of the 5160 s it may use"
            fi
          done <"$notes"
          echo "daemon-1 dm9 measure done at $(( $(date +%s) - start )) s of the job"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-macos
          path: target/release/bundle/macos/Halvo.app
          if-no-files-found: error
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: windows not run in this scratch copy
        shell: bash
        run: echo 'the measure of DM-9 (4) runs in the macos job alone'