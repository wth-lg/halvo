          web_guard=$(bin_of web --test=fixture_guard fixture_guard)
          profile_lib=$(bin_of profile --lib r3_profile)
          echo "u03_bins web_lib=$([ -x "$web_lib" ] && echo yes || echo no) web_guard=$([ -x "$web_guard" ] && echo yes || echo no) profile_lib=$([ -x "$profile_lib" ] && echo yes || echo no)"
          loop "$web_lib" tests::a_kill_line_names_its_browser
          for t in a_trial_process_that_holds_a_server \
            the_server_is_gone_within_its_bound_when_its_trial_process_is_killed \
            a_server_that_its_trial_drops_without_a_stop_is_gone_when_the_drop_returns \
            a_server_of_a_trial_that_panics_is_gone_when_the_panic_has_unwound \
            a_server_that_ignores_its_input_is_gone_when_the_drop_returns; do
            loop "$web_guard" "$t"
          done
          for t in the_product_start_is_on_the_pipe_with_the_relay_and_every_flag_of_the_set \
            the_direct_start_of_item_3_carries_the_set_and_no_route \
            the_first_start_is_the_first_set_with_the_resolver_rule_alone \
            the_flag_lines_hold_the_sets_and_none_that_the_executor_sets \
            the_pref_lines_name_each_setting_of_the_start \
            the_egress_line_comes_from_the_checks_last_line \
            the_egress_port_is_the_agent_entry_of_the_list \
            the_list_is_checked_out_with_lf_line_ends \
            the_refusal_cause_is_read_without_its_detail \
            the_result_files_last_block_holds_the_set_as_the_program_prints_it; do
            loop "$profile_lib" "product::tests::$t"
          done

          sh tools/r3-trials/web/hosted/harness.sh --self-test
          e=$?
          echo "u03_harness_self_test exit=$e"
