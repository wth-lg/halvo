name: ci
# scratch: trimmed to one unit's checks
# scratch: the macos job alone (the windows job stands with if: false); never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test
      - name: U4.9 scratch only, the round's new tests again
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo test -p halvo-agent-client --locked --no-run > ../u49-build.txt 2>&1; echo "u49: build exited $?"
          bin() { grep -E "Executable $1" ../u49-build.txt | sed -E 's/.*\((.*)\).*/\1/' | tr '\\' '/' | head -n 1; }
          lib=$(bin 'unittests src.lib.rs'); handles=$(bin 'tests.handles.rs'); environment=$(bin 'tests.environment.rs')
          again() {
            "$1" --list > ../u49-list.txt 2>/dev/null
            if ! grep -q -F "$2: test" ../u49-list.txt; then echo "u49-repeat: $2: not in this build"; return; fi
            pass=0
            i=0
            while [ "$i" -lt "$3" ]; do
              if "$1" --exact "$2" -q > /dev/null 2>&1; then pass=$((pass + 1)); fi
              i=$((i + 1))
            done
            echo "u49-repeat: $2: $pass of $3 passed"
          }
          again "$lib" api::tests::of_the_ends_of_a_runner_the_status_2_alone_is_a_refusal 200
          again "$lib" proc::environment_block_tests::an_empty_name_a_name_with_an_equals_sign_or_a_nul_gives_no_block 200
          again "$lib" sys::macos::tests::a_list_answer_of_0_or_less_or_one_that_fills_its_room_refuses_and_one_entry_less_passes 200
          again "$lib" sys::macos::tests::a_number_that_cannot_be_marked_gives_its_error 200
          again "$handles" a_runner_holds_its_three_descriptors_and_no_other_while_the_library_holds_descriptors_of_each_kind_at_low_and_high_numbers 50
          again "$handles" a_library_that_holds_150_more_descriptors_still_starts_its_runner_which_holds_its_three 50
          again "$handles" a_holder_that_the_test_starts_with_a_bound_of_one_second_exits_by_itself_with_the_status_0 50
          again "$handles" a_windows_runner_has_a_console_of_its_own_that_the_library_is_not_attached_to_and_that_shows_no_window 50
          again "$handles" a_windows_runner_of_a_library_with_no_console_has_a_console_with_no_window_that_its_child_shares 50
          exit 0
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    if: false
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: U4.9 scratch only, the console and holder tests at earlier heads, and the relative write
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git fetch --no-tags --depth=1 origin 99e572d55a678bf2031461d7b762b2cd979ff03b 3c56894032c28f580d16c38b6cbc3257079abd71; echo "u49: fetch exited $?"
          git worktree add --detach ../u49-old HEAD; echo "u49: work tree exited $?"
          (cd ../u49-old && git checkout 99e572d55a678bf2031461d7b762b2cd979ff03b -- crates/halvo-agent-client/src/proc.rs crates/halvo-agent-client/src/api.rs crates/halvo-agent-client/src/sys/macos.rs crates/halvo-agent-client/src/sys/windows.rs); echo "u49: library of 99e572d5 checked out, exit $?"
          (cd ../u49-old && CARGO_TARGET_DIR=../u49-target-old cargo test -p halvo-agent-client --locked --no-fail-fast --test handles a_windows_runner_ -- --nocapture > ../u49-old-console.txt 2>&1; echo "u49: console tests with the library of 99e572d5 exited $?")
          grep -E '^test |^test result|panicked at|could not compile|u49-' ../u49-old-console.txt
          git worktree add --detach ../u49-prev HEAD; echo "u49: work tree exited $?"
          (cd ../u49-prev && git checkout 3c56894032c28f580d16c38b6cbc3257079abd71 -- crates/halvo-agent-client/src/bin/agent-client-peer.rs crates/halvo-agent-client/src/bin/agent-client-peer/host.rs); echo "u49: stand-in of 3c568940 checked out, exit $?"
          (cd ../u49-prev && CARGO_TARGET_DIR=../u49-target-prev cargo test -p halvo-agent-client --locked --no-fail-fast --test handles a_holder_that_the_test_starts_with_a_bound_of_one_second_exits_by_itself_with_the_status_0 -- --exact > ../u49-prev-bound.txt 2>&1; echo "u49: the holder's bound test with the stand-in of 3c568940 exited $?")
          grep -E '^test |^test result|panicked at|could not compile|u49-' ../u49-prev-bound.txt
          cargo test -p halvo-agent-client --locked --no-fail-fast --test environment a_write_of_the_runner_by_a_relative_name_makes_no_file_and_leaves_nothing_under_the_data_directory -- --exact --nocapture > ../u49-relative.txt 2>&1; echo "u49: the relative write at the head exited $?"
          grep -E '^test |^test result|panicked at|could not compile|u49-' ../u49-relative.txt
          exit 0
      - name: U4.9 scratch only, the round's new tests again
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo test -p halvo-agent-client --locked --no-run > ../u49-build.txt 2>&1; echo "u49: build exited $?"
          bin() { grep -E "Executable $1" ../u49-build.txt | sed -E 's/.*\((.*)\).*/\1/' | tr '\\' '/' | head -n 1; }
          lib=$(bin 'unittests src.lib.rs'); handles=$(bin 'tests.handles.rs'); environment=$(bin 'tests.environment.rs')
          again() {
            "$1" --list > ../u49-list.txt 2>/dev/null
            if ! grep -q -F "$2: test" ../u49-list.txt; then echo "u49-repeat: $2: not in this build"; return; fi
            pass=0
            i=0
            while [ "$i" -lt "$3" ]; do
              if "$1" --exact "$2" -q > /dev/null 2>&1; then pass=$((pass + 1)); fi
              i=$((i + 1))
            done
            echo "u49-repeat: $2: $pass of $3 passed"
          }
          again "$lib" api::tests::of_the_ends_of_a_runner_the_status_2_alone_is_a_refusal 200
          again "$lib" proc::environment_block_tests::an_empty_name_a_name_with_an_equals_sign_or_a_nul_gives_no_block 200
          again "$lib" sys::macos::tests::a_list_answer_of_0_or_less_or_one_that_fills_its_room_refuses_and_one_entry_less_passes 200
          again "$lib" sys::macos::tests::a_number_that_cannot_be_marked_gives_its_error 200
          again "$handles" a_runner_holds_its_three_descriptors_and_no_other_while_the_library_holds_descriptors_of_each_kind_at_low_and_high_numbers 50
          again "$handles" a_library_that_holds_150_more_descriptors_still_starts_its_runner_which_holds_its_three 50
          again "$handles" a_holder_that_the_test_starts_with_a_bound_of_one_second_exits_by_itself_with_the_status_0 50
          again "$handles" a_windows_runner_has_a_console_of_its_own_that_the_library_is_not_attached_to_and_that_shows_no_window 50
          again "$handles" a_windows_runner_of_a_library_with_no_console_has_a_console_with_no_window_that_its_child_shares 50
          exit 0
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
