            launch "$copy-own" "$m/own.tsv"
            git checkout -- src-tauri
          done
          echo "adv tree clean after the copies: $([ -z "$(git status --porcelain)" ] && echo true || echo false)"
          "$py" "$RUNNER_TEMP/adv.py" table "$m"
          for where in "$LOCALAPPDATA/com.halvo.desktop" "$APPDATA/com.halvo.desktop" "$LOCALAPPDATA/halvo" "$APPDATA/halvo"; do
            echo "adv disk account: $(printf '%s' "$where" | sed 's|.*AppData|AppData|') exists=$([ -e "$where" ] && echo yes || echo no) files=$(find "$where" -type f 2>/dev/null | wc -l)"
          done
