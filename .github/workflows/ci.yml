name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/r4-trials/app -> target
          save-if: false
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Trial app
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          app=tools/r4-trials/app
          started=$(date +%s)
          if ! cargo build --release --locked --manifest-path "$app/Cargo.toml"; then
            echo "trial build=fail"
            exit 1
          fi
          echo "trial build=ok seconds=$(( $(date +%s) - started ))"
          bin="$app/target/release/r4-trial-app"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          echo "trial binary_bytes=$(wc -c <"$bin" | tr -d ' ')"
          if [ "$RUNNER_OS" = Windows ]; then
            key='SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            if MSYS_NO_PATHCONV=1 reg query "HKLM\\$key" /v pv >/dev/null 2>&1; then
              echo "trial webview2_runtime=yes"
            else
              echo "trial webview2_runtime=no"
            fi
          fi
          node --test "$app/tests/page.test.mjs" >"$RUNNER_TEMP/r4-page-test.out" 2>&1
          echo "trial page_test_exit=$? $(grep -E '(pass|fail) [0-9]+$' "$RUNNER_TEMP/r4-page-test.out" | tr '\n' ' ')"
          cat >"$RUNNER_TEMP/r4-client.js" <<'EOF'
          const net = require("node:net");
          const [port, ...lines] = process.argv.slice(2);
          const socket = net.connect(Number(port), "127.0.0.1");
          let buffer = "";
          let failed = false;
          const answers = [];
          let waiter = null;
          socket.on("data", (chunk) => {
            buffer += chunk;
            let at;
            while ((at = buffer.indexOf("\n")) >= 0) {
              answers.push(buffer.slice(0, at).replace(/\r$/, ""));
              buffer = buffer.slice(at + 1);
              if (waiter) { const w = waiter; waiter = null; w(); }
            }
          });
          const answer = () => new Promise((resolve) => {
            const take = () => resolve(answers.shift());
            if (answers.length) take(); else waiter = take;
          });
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          socket.on("error", (e) => { console.log("trial socket_error=" + e.code); process.exit(1); });
          socket.on("connect", async () => {
            for (const item of lines) {
              if (item.startsWith("wait ")) { await sleep(Number(item.slice(5))); continue; }
              const expectErr = item.startsWith("!");
              const line = expectErr ? item.slice(1) : item;
              const timer = setTimeout(() => { console.log("trial sent=" + line + " answer=timeout"); process.exit(1); }, 60000);
              socket.write(line + "\n");
              const got = await answer();
              clearTimeout(timer);
              const ok = expectErr ? got.startsWith("err ") : got.startsWith("ok");
              if (!ok) failed = true;
              console.log("trial sent=" + line + " answer=" + got + (ok ? "" : " unexpected=yes"));
            }
            socket.end();
            process.exitCode = failed ? 1 : 0;
          });
          EOF
          overall=0
          trial_run() {
            name=$1
            shift
            flags=
            while [ "$1" != -- ]; do
              flags="$flags $1"
              shift
            done
            shift
            out="$RUNNER_TEMP/r4-trial-app-$name.out"
            echo "trial run=$name flags=${flags# }"
            # shellcheck disable=SC2086
            "$bin" $flags >"$out" 2>&1 &
            pid=$!
            port=
            i=0
            while [ "$i" -lt 600 ]; do
              port=$(tr -d '\r' <"$out" | sed -n 's/^control port=\([0-9][0-9]*\)$/\1/p' | head -n 1)
              if [ -n "$port" ] || ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 0.1
              i=$((i + 1))
            done
            status=0
            if [ -z "$port" ]; then
              echo "trial run=$name control_port=none waited_ds=$i"
              status=1
            else
              echo "trial run=$name control_port=found waited_ds=$i"
              node "$RUNNER_TEMP/r4-client.js" "$port" "$@" || status=1
            fi
            i=0
            while kill -0 "$pid" 2>/dev/null && [ "$i" -lt 100 ]; do
              sleep 0.1
              i=$((i + 1))
            done
            if kill -0 "$pid" 2>/dev/null; then
              echo "trial run=$name app_running_after_quit=yes"
              kill "$pid"
              status=1
            else
              wait "$pid"
              echo "trial run=$name app_exit=$? after_ds=$i"
            fi
            echo "trial run=$name app_output_lines=$(wc -l <"$out" | tr -d ' ')"
            tr -d '\r' <"$out" | grep -E '^(control port=[0-9]+|page [a-z_ =0-9]+|core [a-z_ =0-9]+)$' | sed 's/^/app /'
            tr -d '\r' <"$out" | grep -E "^(r4-trial-app: |thread '|refused cause=)" | cut -c1-300 | sed 's/^/app error: /'
            echo "trial run=$name status=$status"
            if [ "$status" -ne 0 ]; then overall=1; fi
          }
          trial_run main -- show hide sample show sample quit
          trial_run a2-get --arm a2 --sync get -- show '!bogus' 'send 20000 1000' '!send 1 1' 'wait 12000' hide sample 'wait 3000' sample show 'wait 10000' sample quit
          trial_run b-channel --arm b --sync channel -- show 'send 6000 1000' 'wait 2000' destroy sample '!hide' '!destroy' '!load index.html' show 'wait 6000' sample 'load index.html' 'wait 2000' sample quit
          trial_run a-events --arm a --sync events -- show 'send 3000 1000' 'wait 5000' hide sample show sample quit
          echo "trial status=$overall"
          exit "$overall"

