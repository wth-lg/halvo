name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - name: Self-tests that commit in throwaway repositories
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          sh scripts/check-commit-messages.sh --self-test-two-paths
          sh scripts/check-commit-messages.sh --self-test-pre-push
          sh scripts/ci-commit-messages.sh --self-test
          sh scripts/merge-pr.sh --self-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos
      - name: Build
        shell: bash
        run: npm run tauri build
      - name: Version
        shell: bash
        run: test "$(target/release/bundle/macos/Halvo.app/Contents/MacOS/halvo --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-macos
          path: target/release/bundle/macos/Halvo.app
          if-no-files-found: error
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - name: Hosted rules of unit 7.7 taken out (scratch only)
        if: always()
        shell: bash
        run: |
          set +e
          s=account/crates/halvo-secrets/src
          caught=0
          total=0
          mutant() {
            id=$1
            f=$s/$2
            features=$3
            expect=$4
            total=$((total + 1))
            perl -0pi -e "$5" "$f"
            if git diff --quiet -- "$f"; then
              echo "mutant $id applied=no"
              return
            fi
            log=$RUNNER_TEMP/mutant-$id.log
            start=$(date +%s)
            CARGO_TARGET_DIR=$RUNNER_TEMP/mutants cargo test --manifest-path account/Cargo.toml --locked --offline -p halvo-secrets --features "$features" --test hosted -- --test-threads=1 >"$log" 2>&1
            code=$?
            git checkout -- "$f"
            if grep -q "^test $expect \.\.\. FAILED" "$log"; then hit=yes; caught=$((caught + 1)); else hit=no; fi
            echo "mutant $id exit=$code expected_failed=$hit failed_tests=$(grep -c '\.\.\. FAILED$' "$log") seconds=$(( $(date +%s) - start ))"
            grep -E '^test .* \.\.\. FAILED$' "$log"
          }
          k=hosted-store-tests,keychain
          u=hosted-store-tests
          mutant h01-no-move mac.rs $k moves::a_file_of_an_earlier_build_moves_once_into_the_keychain_and_reads_found_after 's/Read::Found\(secret\) => self\.move_in\(secret, again\),/Read::Found(_) => Read::NotStored,/'
          mutant h02-no-read-back-compare mac.rs $k moves::a_read_back_that_differs_leaves_the_file_and_answers_locked 's/Read::Found\(back\) if back\.expose\(\) == secret\.expose\(\) => \{\}/Read::Found(_) => {}/'
          mutant h03-file-removed-before-read-back mac.rs $k moves::a_read_back_that_differs_leaves_the_file_and_answers_locked 's/Write::Stored => \{\}/Write::Stored => { let _ = self.file.delete(); }/'
          mutant h04-failed-add-drops-file mac.rs $k moves::a_failed_add_leaves_the_file_and_answers_locked 's/Write::Fault\(fault\) => return not_moved\(Some\(Ok\(fault\)\)\),/Write::Fault(_) => { let _ = self.file.delete(); return Read::NotStored; }/'
          mutant h05-both-full-found mac.rs $k moves::with_both_places_full_the_read_answers_locked_never_not_stored 's/Read::Found\(_\) => Read::Locked\(Locked::OtherStore\),\s*_ => Read::Found\(secret\),/_ => Read::Found(secret),/'
          mutant h06-unsigned-ignores-item mac.rs $u beside_the_keychain::a_keychain_item_read_by_a_build_without_the_feature_answers_locked 's/Ok\(_\) => Read::Locked\(Locked::OtherStore\),/Ok(_) => self.file.read(),/'
          mutant h07-equal-bytes-not-finished mac.rs $k moves::a_read_back_that_differs_leaves_the_file_and_answers_locked 's/Read::Found\(other\) if other\.expose\(\) == secret\.expose\(\) => \{\s*self\.remove_the_file\(secret\)\s*\}\s*//'
          mutant h08-delete-without-read mac.rs $k moves::with_both_places_full_the_read_answers_locked_never_not_stored 's/let own = match self\.read\(\) \{/let own = match Read::Found(Secret::new(vec![1]).expect("a secret")) {/'
          mutant h09-feature-picks-file store.rs $k the_store_of_this_build_stores_reads_and_deletes_one_item 's/let keeps = if cfg!\(feature = "keychain"\) \{/let keeps = if !cfg!(feature = "keychain") {/'
          mutant h10-kind-of-keychain-is-file store.rs $k the_store_of_this_build_stores_reads_and_deletes_one_item 's/Keeps::Keychain => StoreKind::Keychain,/Keeps::Keychain => StoreKind::File,/'
          mutant h11-store-reads-file-alone store.rs $u beside_the_keychain::a_keychain_item_read_by_a_build_without_the_feature_answers_locked 's/Place::Mac\(mac\) => mac\.read\(\),/Place::Mac(mac) => mac.file.read(),/'
          mutant h12-unsigned-delete-removes-item store.rs $u beside_the_keychain::a_keychain_item_read_by_a_build_without_the_feature_answers_locked 's/Place::Mac\(mac\) => mac\.delete\(\),/Place::Mac(mac) => mac.keychain.delete(),/'
          mutant h13-boxed-count-zero keychain.rs $k moves::a_file_of_an_earlier_build_moves_once_into_the_keychain_and_reads_found_after 's/\(\*\*self\)\.count\(service, account\)/(**self).count(service, account).map(|_| 0)/'
          mutant h14-hook-add-works keychain/failing.rs $k moves::a_failed_add_leaves_the_file_and_answers_locked 's/MoveFault::Add => Err\(WRITE_PERMISSION\),/MoveFault::Add => self.inner.add(service, account, bytes),/'
          mutant h15-hook-read-back-equal keychain/failing.rs $k moves::a_read_back_that_differs_leaves_the_file_and_answers_locked 's/\*last \^= 1;/let _ = last;/'
          mutant h16-read-back-length mac.rs $k moves::a_read_back_that_differs_leaves_the_file_and_answers_locked 's/Read::Found\(back\) if back\.expose\(\) == secret\.expose\(\)/Read::Found(back) if back.expose().len() == secret.expose().len()/'
          mutant h17-both-places-length mac.rs $k moves::with_both_places_full_the_read_answers_locked_never_not_stored 's/Read::Found\(other\) if other\.expose\(\) == secret\.expose\(\)/Read::Found(other) if other.expose().len() == secret.expose().len()/'
          mutant h18-store-write-to-keychain store.rs $u beside_the_keychain::the_store_of_a_build_without_the_keychain_is_the_file_store 's/Place::Mac\(mac\) => mac\.write\(secret\),/Place::Mac(mac) => mac.keychain.write(secret),/'
          mutant h19-boxed-delete-does-nothing keychain.rs $k the_store_of_this_build_stores_reads_and_deletes_one_item 's/\(\*\*self\)\.delete\(service, account\)/{ let _ = (service, account); Ok(()) }/'
          mutant h20-service-and-name-swapped store.rs $k moves::a_file_of_an_earlier_build_moves_once_into_the_keychain_and_reads_found_after 's/service,\n {12}account: name,/service: name,\n            account: service,/'
          mutant h21-boxed-add-swapped keychain.rs $k moves::a_file_of_an_earlier_build_moves_once_into_the_keychain_and_reads_found_after 's/\(\*\*self\)\.add\(service, account, bytes\)/(**self).add(account, service, bytes)/'
          mutant h22-delete-no-second-look mac.rs $k moves::a_delete_beside_a_file_that_cannot_be_read_answers_a_fault_and_keeps_the_file 's/Delete::Deleted => match self\.other_place\(\) \{/Delete::Deleted => match Other::Empty {/'
          mutant h23-write-without-read mac.rs $u beside_the_keychain::a_keychain_item_read_by_a_build_without_the_feature_answers_locked 's/match self\.read\(\) \{(?=\s*Read::NotStored => match self\.keeps \{)/match Read::NotStored {/'
          echo "hosted mutants caught=$caught of $total changed_files=$(git status --short | wc -l | tr -d ' ')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows
      - name: Build
        shell: bash
        run: npm run tauri build -- --no-bundle
      - name: Version
        shell: bash
        run: test "$(target/release/halvo.exe --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-windows
          path: target/release/halvo.exe
          if-no-files-found: error
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
