name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: steps added by scratch-ci.py

on:
  push:
    branches-ignore: ['land-*', 'land-*/**']
    tags: ['**']
  pull_request:
  schedule:
    - cron: '17 3 * * 0'
    - cron: '17 3 * * 3'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 60-r6-egress
      - name: Processor
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 60-r6-egress
      - name: Loop (egress-warm, 2 rounds)
        shell: bash
        run: |
          set +e
          pass=0; n=0
          while [ "$n" -lt 2 ]; do
            n=$((n + 1))
            if ( sh scripts/ci/run-ci-d.sh windows 60-r6-egress ) >"$RUNNER_TEMP/loop-$n.log" 2>&1; then pass=$((pass + 1)); else echo "round $n failed:"; tail -n 40 "$RUNNER_TEMP/loop-$n.log"; fi
          done
          echo "loop egress-warm: passed $pass of 2"
          [ "$pass" -eq 2 ]
      - name: Long forms build
        if: github.event.schedule == '17 3 * * 3'
        shell: bash
        run: cargo test --locked -p halvo-capture --lib --test windows_functional --no-run
      - name: Long forms
        if: github.event.schedule == '17 3 * * 3'
        shell: bash
        env:
          HALVO_WF_FORM: long
          CI_D_SCRIPT_LIMIT_S: 3600
        run: sh scripts/ci/run-ci-d.sh windows 50-windows-functional 52-windows-browser
      - name: Scripts and hook in a core.autocrlf=true clone
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        if: github.event.schedule != '17 3 * * 3'
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" windows
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
      - name: K1 probe on Windows (the printing rewrites the wrapper and puts it back in its own call)
        if: always()
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          set +e
          k1="$RUNNER_TEMP/k1-clone"
          git clone -q "$GITHUB_WORKSPACE" "$k1"
          cat >"$RUNNER_TEMP/k1-fn.rs" <<'RUST'
          fn commands_command(args: &[String]) -> Result<Done, Refusal> {
              options(args, &[])?;
              k1_probe();
              Ok(Done::Pass(
                  COMMANDS
                      .iter()
                      .map(|command| command.name.to_owned())
                      .collect(),
              ))
          }

          fn k1_probe() {
              let record = std::path::Path::new("target/k1-probe.txt");
              if record.exists() {
                  return;
              }
              let mut lines = String::new();
              for file in ["scripts/egress/check.sh", "scripts/egress/wfp.ps1"] {
                  match std::fs::read(file) {
                      Err(error) => lines.push_str(&format!("read {file} refused {:?}\n", error.kind())),
                      Ok(kept) => {
                          let appended = std::fs::OpenOptions::new()
                              .append(true)
                              .open(file)
                              .and_then(|mut handle| std::io::Write::write_all(&mut handle, b"# planted by the printing\n"));
                          match appended {
                              Ok(()) => lines.push_str(&format!("append {file} taken\n")),
                              Err(error) => lines.push_str(&format!("append {file} refused {:?}\n", error.kind())),
                          }
                          match std::fs::write(file, &kept) {
                              Ok(()) => lines.push_str(&format!("restore {file} taken\n")),
                              Err(error) => lines.push_str(&format!("restore {file} refused {:?}\n", error.kind())),
                          }
                      }
                  }
              }
              let _ = std::fs::write(record, lines);
          }
          RUST
          main_rs="$k1/crates/halvo-route-gate/src/main.rs"
          K1_FN="$RUNNER_TEMP/k1-fn.rs" awk '
            { line = $0; sub(/\r$/, "", line) }
            line == "fn commands_command(args: &[String]) -> Result<Done, Refusal> {" {
              while ((getline add < ENVIRON["K1_FN"]) > 0) print add
              skip = 1
              found++
              next
            }
            skip && line == "}" { skip = 0; next }
            skip { next }
            { print }
            END { if (found != 1) exit 3 }
          ' "$main_rs" >"$main_rs.new" && mv "$main_rs.new" "$main_rs"
          echo "k1 edit exit=$? (0: commands_command replaced once); lines naming k1_probe: $(grep -c k1_probe "$main_rs")"
          git -C "$k1" commit -q -am "K1 probe: the printing rewrites the wrapper and puts it back in its own call (never leaves this runner)"
          echo "k1 commit exit=$?"
          k1_started=$(date +%s)
          ( cd "$k1" && CARGO_TARGET_DIR="$RUNNER_TEMP/k1-target" sh scripts/ci/run-ci-d.sh windows 60-r6-egress ) >"$RUNNER_TEMP/k1-check.txt" 2>&1
          echo "k1 check exit=$? seconds=$(( $(date +%s) - k1_started ))"
          echo "--- the check, from egress control to its last line:"
          awk '/^egress control/ { on = 1 } on { print } on && /^(PASS|FAIL) 60-r6-egress/ { on = 0 }' "$RUNNER_TEMP/k1-check.txt"
          echo "--- lines that begin tree changed=:"
          grep '^tree changed=' "$RUNNER_TEMP/k1-check.txt"
          echo "--- target/k1-probe.txt:"
          cat "$k1/target/k1-probe.txt"
          echo "--- the wrapper files after the check (git status of the second clone):"
          git -C "$k1" status --porcelain -- scripts/egress
          exit 0
