            change W5 - 'if msg == TDN_CREATED {' 'if msg != TDN_CREATED {'
            change W1 lib 'nDefaultButton: TASK_REJECT,' 'nDefaultButton: TASK_ALLOW,'
            change W2 lib 'dwFlags: FLAGS,' 'dwFlags: TASKDIALOG_FLAGS(TDF_SIZE_TO_CONTENT.0),'
          fi
