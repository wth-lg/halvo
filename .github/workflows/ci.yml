name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: steps added by scratch-ci.py

on:
  push:
    branches-ignore: ['land-*', 'land-*/**']
    tags: ['**']
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 30-mutants 30-core-boundary-proofs 22-daemon-no-dead-allow 23-daemon-port-only 26-daemon-owner-growth
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 30-mutants 30-core-boundary-proofs 22-daemon-no-dead-allow 23-daemon-port-only 26-daemon-owner-growth
      - name: Rows of daemon-3a by name
        if: always()
        shell: bash
        run: sh scripts/r1-gate/mutation-test.sh --budget 36000 --only state-save-without-temp-and-rename --only state-version-default-zero --only entry-arm-kept-after-every-stop --only partial-root-file-shared-by-two-writers --only formal-store-files-take-the-umask --only formal-store-directories-take-the-umask --only handle-dir-open-follows-a-link --only handle-file-open-follows-a-link --only handle-file-open-blocks-on-a-fifo --only unnamed-root-prints-yes --only moved-roots-directory-answers-ok --only callers-path-opened-whole --only durable-file-flush-taken-out --only durable-flush-without-the-full-flag --only durable-failed-full-flush-answers-ok --only durable-directory-flush-taken-out --only durable-interrupted-flush-answers-ok --only durable-interrupted-flush-not-made-again
      - name: Loop (daemon-3a tests, 200 rounds)
        if: always()
        shell: bash
        run: |
          set +e
          rounds=${LOOP_ROUNDS:-200}
          logs=${RUNNER_TEMP:-$TMPDIR}/daemon-3a-loop
          mkdir -p "$logs"
          lib_filters="daemon::state:: daemon::instance:: daemon::process_tests:: store::state_file:: daemon::main_loop::tests::a_disarm_that_meets_the_ending_call_returns_after_it daemon::supervisor::tests::a_permission_granted_at_the_first_answer_is_written_once_in_the_state_file daemon::supervisor::tests::a_grant_that_restarts_the_run_leaves_the_state_file_as_it_is daemon::supervisor::tests::an_entry_with_no_owner_asks_no_settle_and_answers_its_own_status daemon::supervisor::tests::stress_cases::the_owner_gone_pass_runs_its_stops_armed_with_5_and_takes_its_arm_back daemon::supervisor::tests::stress_cases::the_drain_stop_pass_runs_its_stops_armed_with_5_and_takes_its_arm_back daemon::supervisor::tests::stress_cases::an_entry_whose_stops_answer_puts_back_the_arm_that_it_found daemon::supervisor::tests::stress_cases::a_stop_for_capture_off_whose_sources_stop_puts_back_the_arm_that_it_found daemon::supervisor::tests::stress_cases::a_stop_after_the_entry_leaves_the_arm_of_another_site_as_it_stands daemon::tests::the_service_run_takes_an_absolute_data_dir_or_the_accounts_own daemon::tests::the_service_form_of_the_self_check_takes_its_data_dir_alone daemon::supervisor::tests::a_grant_whose_record_holds_in_the_file_but_whose_folder_flush_failed_is_named_by_a_line_with_its_kind daemon::supervisor::tests::a_grant_whose_record_cannot_be_read_again_after_its_write_failed_is_named_by_a_line_with_its_kind"
          cargo test -p halvo-capture --lib --locked --no-run >"$logs/build-lib.txt" 2>&1
          lib=$(sed -n 's/.*Executable unittests src.lib.rs (\(.*\))$/\1/p' "$logs/build-lib.txt" | tr '\134' '/')
          if [ -z "$lib" ]; then echo "loop daemon-3a: no lib test executable"; tail -n 20 "$logs/build-lib.txt"; exit 1; fi
          # shellcheck disable=SC2086
          "$lib" --list $lib_filters >"$logs/list-lib.txt" 2>&1
          lib_count=$(grep -c ': test$' "$logs/list-lib.txt")
          echo "loop daemon-3a lib: $lib_count tests a round"
          lib_pass=0
          for n in $(seq 1 "$rounds"); do
            # shellcheck disable=SC2086
            "$lib" --test-threads=4 $lib_filters >"$logs/lib-$n.txt" 2>&1
            if grep -q "^test result: ok. $lib_count passed" "$logs/lib-$n.txt"; then lib_pass=$((lib_pass + 1)); else echo "round $n failed:"; tail -n 40 "$logs/lib-$n.txt"; fi
          done
          echo "loop daemon-3a lib: passed $lib_pass of $rounds with $lib_count tests a round"
          run_pass=$rounds
          run_count=0
          if [ "$(uname -s)" = Darwin ]; then
            cargo test -p halvo-capture --locked --test main_run_loop --no-run >"$logs/build-run-loop.txt" 2>&1
            run_loop=$(sed -n 's/.*Executable tests.main_run_loop.rs (\(.*\))$/\1/p' "$logs/build-run-loop.txt")
            if [ -z "$run_loop" ]; then echo "loop daemon-3a: no main_run_loop executable"; tail -n 20 "$logs/build-run-loop.txt"; exit 1; fi
            "$run_loop" --list the_service_run_waits_on_the_main_run_loop >"$logs/list-run-loop.txt" 2>&1
            run_count=$(grep -c ': test$' "$logs/list-run-loop.txt")
            run_pass=0
            for n in $(seq 1 "$rounds"); do
              "$run_loop" the_service_run_waits_on_the_main_run_loop >"$logs/run-loop-$n.txt" 2>&1
              if grep -q "^test result: ok. $run_count passed" "$logs/run-loop-$n.txt"; then run_pass=$((run_pass + 1)); else echo "round $n failed:"; tail -n 40 "$logs/run-loop-$n.txt"; fi
            done
            echo "loop daemon-3a main_run_loop: passed $run_pass of $rounds with $run_count tests a round"
          fi
          [ "$lib_count" -gt 0 ] && [ "$lib_pass" -eq "$rounds" ] && [ "$run_pass" -eq "$rounds" ]
      - name: Lockfile unchanged
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" macos
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 30-core-boundary-proofs 22-daemon-no-dead-allow 23-daemon-port-only
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 30-core-boundary-proofs 22-daemon-no-dead-allow 23-daemon-port-only
      - name: Loop (daemon-3a tests, 200 rounds)
        if: always()
        shell: bash
        run: |
          set +e
          rounds=${LOOP_ROUNDS:-200}
          logs=${RUNNER_TEMP:-$TMPDIR}/daemon-3a-loop
          mkdir -p "$logs"
          lib_filters="daemon::state:: daemon::instance:: daemon::process_tests:: store::state_file:: daemon::main_loop::tests::a_disarm_that_meets_the_ending_call_returns_after_it daemon::supervisor::tests::a_permission_granted_at_the_first_answer_is_written_once_in_the_state_file daemon::supervisor::tests::a_grant_that_restarts_the_run_leaves_the_state_file_as_it_is daemon::supervisor::tests::an_entry_with_no_owner_asks_no_settle_and_answers_its_own_status daemon::supervisor::tests::stress_cases::the_owner_gone_pass_runs_its_stops_armed_with_5_and_takes_its_arm_back daemon::supervisor::tests::stress_cases::the_drain_stop_pass_runs_its_stops_armed_with_5_and_takes_its_arm_back daemon::supervisor::tests::stress_cases::an_entry_whose_stops_answer_puts_back_the_arm_that_it_found daemon::supervisor::tests::stress_cases::a_stop_for_capture_off_whose_sources_stop_puts_back_the_arm_that_it_found daemon::supervisor::tests::stress_cases::a_stop_after_the_entry_leaves_the_arm_of_another_site_as_it_stands daemon::tests::the_service_run_takes_an_absolute_data_dir_or_the_accounts_own daemon::tests::the_service_form_of_the_self_check_takes_its_data_dir_alone daemon::supervisor::tests::a_grant_whose_record_holds_in_the_file_but_whose_folder_flush_failed_is_named_by_a_line_with_its_kind daemon::supervisor::tests::a_grant_whose_record_cannot_be_read_again_after_its_write_failed_is_named_by_a_line_with_its_kind"
          cargo test -p halvo-capture --lib --locked --no-run >"$logs/build-lib.txt" 2>&1
          lib=$(sed -n 's/.*Executable unittests src.lib.rs (\(.*\))$/\1/p' "$logs/build-lib.txt" | tr '\134' '/')
          if [ -z "$lib" ]; then echo "loop daemon-3a: no lib test executable"; tail -n 20 "$logs/build-lib.txt"; exit 1; fi
          # shellcheck disable=SC2086
          "$lib" --list $lib_filters >"$logs/list-lib.txt" 2>&1
          lib_count=$(grep -c ': test$' "$logs/list-lib.txt")
          echo "loop daemon-3a lib: $lib_count tests a round"
          lib_pass=0
          for n in $(seq 1 "$rounds"); do
            # shellcheck disable=SC2086
            "$lib" --test-threads=4 $lib_filters >"$logs/lib-$n.txt" 2>&1
            if grep -q "^test result: ok. $lib_count passed" "$logs/lib-$n.txt"; then lib_pass=$((lib_pass + 1)); else echo "round $n failed:"; tail -n 40 "$logs/lib-$n.txt"; fi
          done
          echo "loop daemon-3a lib: passed $lib_pass of $rounds with $lib_count tests a round"
          run_pass=$rounds
          run_count=0
          if [ "$(uname -s)" = Darwin ]; then
            cargo test -p halvo-capture --locked --test main_run_loop --no-run >"$logs/build-run-loop.txt" 2>&1
            run_loop=$(sed -n 's/.*Executable tests.main_run_loop.rs (\(.*\))$/\1/p' "$logs/build-run-loop.txt")
            if [ -z "$run_loop" ]; then echo "loop daemon-3a: no main_run_loop executable"; tail -n 20 "$logs/build-run-loop.txt"; exit 1; fi
            "$run_loop" --list the_service_run_waits_on_the_main_run_loop >"$logs/list-run-loop.txt" 2>&1
            run_count=$(grep -c ': test$' "$logs/list-run-loop.txt")
            run_pass=0
            for n in $(seq 1 "$rounds"); do
              "$run_loop" the_service_run_waits_on_the_main_run_loop >"$logs/run-loop-$n.txt" 2>&1
              if grep -q "^test result: ok. $run_count passed" "$logs/run-loop-$n.txt"; then run_pass=$((run_pass + 1)); else echo "round $n failed:"; tail -n 40 "$logs/run-loop-$n.txt"; fi
            done
            echo "loop daemon-3a main_run_loop: passed $run_pass of $rounds with $run_count tests a round"
          fi
          [ "$lib_count" -gt 0 ] && [ "$lib_pass" -eq "$rounds" ] && [ "$run_pass" -eq "$rounds" ]
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" windows
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
