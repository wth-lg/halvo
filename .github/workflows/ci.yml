name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos --self-test 11-cap
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 11-cap
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: K-11 cells under a reduced token and a standard user (scratch branch only)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo build --locked --release -p halvo-cap --example hold --bin measure-peak
          "build exit=$LASTEXITCODE"
          $dir = Join-Path $env:RUNNER_TEMP ('k11-' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          New-Item -ItemType Directory -Path $dir | Out-Null
          & icacls $dir /grant '*S-1-5-32-545:(OI)(CI)M' *> $null
          "cells icacls-exit=$LASTEXITCODE"
          $exe = Join-Path $dir 'measure-peak.exe'
          $hold = Join-Path $dir 'hold.exe'
          Copy-Item (Resolve-Path 'target/release/measure-peak.exe').Path $exe
          Copy-Item (Resolve-Path 'target/release/examples/hold.exe').Path $hold
          function Text($files) { $t = ''; foreach ($f in $files) { if (Test-Path $f) { $t += (Get-Content $f -Raw) + "`n" } }; return $t }
          function HeaderMode($text) { if ($text -match '(?m)^measure-peak platform=windows mode=(\S+) ') { return $Matches[1] }; return '-' }
          function Cell($label, $text, $started) {
            $mode = HeaderMode $text
            if (-not $started -or $text.Trim() -eq '') { return "cell $label runs=1 result=not-run error=- mode=-" }
            if ($text -match 'REFUSED cap-unsupported: .*\(os error (\d+)\)') { return "cell $label runs=1 result=cap-unsupported error=$($Matches[1]) mode=$mode" }
            if ($text -match '(?m)^checks control=ok') { return "cell $label runs=1 result=ok error=- mode=$mode" }
            if ($text -match '(?m)^checks control=miss') { return "cell $label runs=1 result=miss error=- mode=$mode" }
            return "cell $label runs=1 result=unknown error=- mode=$mode"
          }
          function Reduced($label, $command) {
            $out = Join-Path $dir "$label.txt"
            $batch = Join-Path $dir "$label.cmd"
            Set-Content -Path $batch -Encoding ascii -Value @('@echo off', "$command > $out 2>&1", "echo exit=%errorlevel%>> $out")
            & runas /trustlevel:0x20000 "cmd /c $batch" *> $null
            Write-Host "$label runas-exit=$LASTEXITCODE"
            $deadline = (Get-Date).AddSeconds(120)
            while ((Get-Date) -lt $deadline -and -not ((Test-Path $out) -and (Select-String -Path $out -Pattern '^exit=' -Quiet))) { Start-Sleep -Milliseconds 500 }
            if (Test-Path $out) { Get-Content $out | ForEach-Object { Write-Host "$label $_" } } else { Write-Host "$label no-output" }
            return $out
          }
          & $exe --limit 268435456 --control 2>&1 | ForEach-Object { "runner-token $_" }
          "runner-token exit=$LASTEXITCODE"
          $reduced = Reduced 'reduced-token' "$exe --limit 268435456 --control"
          Cell 'control-reduced-token.windows-2025' (Text @($reduced)) $true
          $section = Reduced 'reduced-section' "$exe --limit 67108864 --runs 1 -- $hold section"
          $st = Text @($section)
          $mode = HeaderMode $st
          $peak = '0'; $capped = 'no'; $held = '0'
          if ($st -match '(?m)^run n=1 .*peak_bytes=(\d+) capped=(yes|no)') { $peak = $Matches[1]; $capped = $Matches[2] }
          if ($st -match 'hold way=section held_bytes=(\d+)') { $held = $Matches[1] }
          "limit section.windows-2025 runs=1 held_bytes=$held limit_bytes=67108864 peak_bytes=$peak capped=$capped mode=$mode"
          $name = 'hc' + (Get-Random -Minimum 1000000 -Maximum 9999999)
          $set = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'
          $password = 'Aa7!' + (-join (1..9 | ForEach-Object { $set[(Get-Random -Maximum $set.Length)] }))
          & net user $name $password /add *> $null
          $added = ($LASTEXITCODE -eq 0)
          "standard-user added=$added"
          $admin = [bool]((& net localgroup Administrators 2>$null) -contains $name)
          "standard-user in-administrators=$admin"
          $started = $false
          $out = Join-Path $dir 'standard.txt'
          $err = Join-Path $dir 'standard-err.txt'
          if ($added) {
            $cred = New-Object System.Management.Automation.PSCredential ($name, (ConvertTo-SecureString $password -AsPlainText -Force))
            try {
              $p = Start-Process -FilePath $exe -ArgumentList '--limit', '268435456', '--control' -Credential $cred -WorkingDirectory $dir -RedirectStandardOutput $out -RedirectStandardError $err -Wait -PassThru -ErrorAction Stop
              $started = $true
              "standard-user started=True exit=$($p.ExitCode)"
            } catch {
              "standard-user started=False hresult=$($_.Exception.HResult) native=$($_.Exception.InnerException.NativeErrorCode)"
            }
            foreach ($f in @($out, $err)) { if (Test-Path $f) { Get-Content $f | ForEach-Object { "standard-user $_" } } }
            & net user $name /delete *> $null
            "standard-user removed=$($LASTEXITCODE -eq 0)"
          }
          Cell 'control-standard-user.windows-2025' (Text @($out, $err)) $started
          exit 0
      - name: ci.d self-test
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows --self-test 11-cap
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 11-cap
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
