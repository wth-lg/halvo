name: ci
# scratch of verifier-128 for store-3 at 51f7acf9: one row and the changed copies that the verifier's
# Mac may not run, and one probe on Windows; never merged

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Start time and the commit
        shell: bash
        run: |
          date +%s > "$RUNNER_TEMP/v128-start"
          echo "checked out: $(git rev-parse HEAD)"
          echo "its parent: $(git rev-parse HEAD^)"
          git diff --stat HEAD^ HEAD
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Row handle-dir-open-follows-a-link through the runner
        if: always()
        shell: bash
        run: |
          set +e
          sh scripts/r1-gate/mutation-test.sh --only handle-dir-open-follows-a-link
          echo "row exit=$?"
      - name: Changed copies of verifier-128
        if: always()
        shell: bash
        run: |
          set +e
          python3 scripts/v128/hosted_copies.py . "$RUNNER_TEMP/v128-start"
          echo "copies exit=$?"

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Probe of verifier-128, a create in a directory whose name is not Unicode
        if: always()
        shell: bash
        run: |
          set +e
          echo "checked out: $(git rev-parse HEAD)"
          cargo test --locked -p halvo-capture --lib -- store::hardening_tests::v128_windows:: --nocapture --test-threads=1
          echo "probe exit=$?"
