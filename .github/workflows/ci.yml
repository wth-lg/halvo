name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 20-app-links-no-store 22-daemon-no-dead-allow 23-daemon-port-only 30-core-boundary-proofs 30-mutants 51-macos-stall 62-build
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 20-app-links-no-store 22-daemon-no-dead-allow 23-daemon-port-only 30-core-boundary-proofs 30-mutants 51-macos-stall 62-build
      - name: Loop (macos-4, 200 rounds)
        if: always()
        shell: bash
        run: |
          set +e
          pass=0; n=0
          while [ "$n" -lt 200 ]; do
            n=$((n + 1))
            if ( out=$(cargo test -p halvo-capture --lib --locked -- --exact macos::foreground::tests::a_failed_title_read_is_counted_and_asked_again_on_the_next_tick macos::foreground::tests::a_listed_app_or_a_process_under_the_root_gives_no_event_and_no_title_read macos::foreground::tests::a_private_window_of_its_browser_makes_no_title_and_counts_the_drop macos::foreground::tests::a_title_event_holds_its_text_its_cut_and_why_it_was_made macos::foreground::tests::a_title_of_the_poller_passes_the_owners_flush_as_its_text_its_cut_and_why macos::foreground::tests::a_title_read_under_an_active_probe_is_not_emitted macos::foreground::tests::a_title_record_holds_its_text_its_cut_and_why_and_no_length macos::foreground::tests::readings_a_a_b_of_one_app_give_two_title_events_with_a_and_b macos::foreground::tests::with_an_active_probe_no_title_is_asked_and_b_comes_on_the_first_tick_after macos::foreground::tests::with_title_text_off_no_title_is_ever_asked macos::input::tests::a_click_carries_the_time_of_its_os_event macos::input::tests::a_fold_handed_back_adds_its_count_to_the_next_interval macos::input::tests::a_fold_that_a_full_queue_hands_back_is_counted_and_goes_into_the_next_interval macos::input::tests::a_granted_mask_without_the_key_types_fails_and_any_other_passes macos::input::tests::a_held_key_holds_its_class_and_app_alone macos::input::tests::a_hundred_moves_fold_into_one_record_with_count_100 macos::input::tests::a_key_a_click_and_a_fold_of_the_tap_pass_the_owners_flush_as_a_class_a_button_and_a_count macos::input::tests::a_key_counts_in_the_phase_of_its_arrival macos::input::tests::a_key_late_for_the_hold_but_not_for_the_check_is_withheld_and_not_counted_late macos::input::tests::a_key_older_than_the_late_bound_raises_late_events_only_and_leaves_no_record macos::input::tests::a_key_recorded_in_the_released_phase_raises_the_released_count_alone macos::input::tests::a_pointer_action_in_the_held_phase_raises_the_pointer_counter_and_no_suppression macos::input::tests::a_press_fifty_drags_and_a_release_give_one_click_and_one_drag_record_of_50 macos::input::tests::a_reading_of_unknown_withholds_the_key_and_records_nothing macos::input::tests::a_released_key_is_one_keystroke_record_that_holds_its_class_and_nothing_else macos::input::tests::a_released_key_is_stamped_with_its_age_at_the_arrival_and_the_hold macos::input::tests::a_start_without_the_grant_for_key_events_fails_with_the_permission_error_and_makes_no_tap macos::input::tests::a_taken_hold_begins_the_held_phase_and_its_give_back_ends_it macos::input::tests::a_tap_granted_without_the_key_types_fails_its_start_and_reads_no_key_events macos::input::tests::after_a_flood_of_drags_and_scrolls_a_key_is_queued_at_once macos::input::tests::an_autorepeat_a_key_up_and_a_released_modifier_are_readings_alone macos::input::tests::button_presses_are_clicks_moves_drags_and_scrolls_fold_and_the_notices_are_no_event macos::input::tests::caps_lock_is_a_press_each_time_that_it_toggles macos::input::tests::each_tap_disabled_notice_raises_its_own_counter macos::input::tests::eight_samples_under_a_held_reading_give_8_of_8_and_under_off_0_of_8 macos::input::tests::hid_counts_of_10_then_12_read_keys_typed_and_10_then_10_read_none macos::input::tests::max_lag_ms_is_the_largest_lag_of_a_key_at_its_arrival macos::input::tests::no_key_or_pointer_record_leaves_for_a_process_under_the_exclusion_root macos::input::tests::no_key_record_leaves_for_a_listed_app_in_front_at_the_arrival_or_during_the_hold macos::input::tests::no_pointer_record_leaves_for_a_listed_app_in_front_or_with_nothing_in_front macos::input::tests::the_held_phase_samples_every_250_ms macos::input::tests::the_key_events_suppressed_in_the_held_phase_are_counted_by_type macos::input::tests::the_key_table_maps_a_fixed_list_of_codes_and_flags_to_their_class macos::input::tests::the_mask_holds_the_key_types_only_with_key_class_on_and_the_mouse_types_only_with_pointer_class_on macos::input::tests::the_records_of_a_key_a_click_and_a_fold_hold_a_class_a_button_and_a_count_and_nothing_else macos::input::tests::the_shared_list_of_inputs_gives_its_events_through_the_macos_mapper macos::input::tests::the_tap_is_requested_listen_only_at_the_session_location macos::input::tests::the_tap_sits_at_the_session_level macos::input::tests::thirty_scrolls_give_one_scroll_record_of_30_and_each_button_its_click macos::input::tests::with_both_switches_off_the_source_answers_off_and_makes_no_tap macos::input::tests::with_the_key_switch_off_a_key_down_holds_nothing_and_gives_no_record macos::input::tests::with_the_pointer_switch_off_no_pointer_record_leaves macos::window_title::tests::a_title_over_the_cap_reads_one_unit_past_the_cap_from_its_start_and_its_ending_from_its_end macos::window_title::tests::a_title_with_an_unpaired_surrogate_reads_it_as_the_replacement_character macos::window_title::tests::each_private_ending_drops_the_title_only_for_its_own_browser macos::window_title::tests::ten_title_reads_through_an_element_of_this_process_ask_only_for_the_focused_window_and_its_title macos::window_title::tests::the_deadline_is_one_poll_interval_and_the_caps_1024_and_64_units macos::window_title::tests::the_site_reader_point_gives_no_site_without_the_feature secure_input::macos::key_queue_tests::a_key_read_on_or_unknown_gets_no_clearance_and_is_not_late secure_input::macos::key_queue_tests::a_key_that_the_check_found_late_is_counted_late_and_never_released secure_input::macos::key_queue_tests::a_released_key_carries_the_clearance_of_its_arrival_with_the_hold_added_to_its_age macos::foreground::tests::a_private_window_whose_title_is_longer_than_the_cap_makes_no_title macos::input::tests::moves_in_a_listed_app_then_a_kept_app_at_the_interval_end_give_no_record macos::input::tests::no_key_record_leaves_when_a_process_under_the_root_comes_in_front_during_the_hold macos::input::tests::a_start_with_key_class_off_goes_on_to_the_maker_while_the_grant_for_key_events_is_refused macos::input::tests::a_refused_start_after_a_keyless_refusal_reads_the_reason_permission macos::input::tests::the_callback_arms_the_fold_timer_at_the_floor_interval_and_its_fire_gives_the_records macos::input::tests::the_held_phase_arms_its_sampler_at_250_ms_and_a_fire_takes_one_sample macos::input::tests::no_fold_record_leaves_after_a_stop_is_asked macos::foreground::tests::a_title_asked_before_an_active_reading_and_answered_after_it_is_not_emitted macos::foreground::tests::a_title_read_inside_an_active_reading_between_two_ticks_is_not_emitted macos::foreground::tests::the_title_thread_calls_no_reader_when_the_reading_is_active_before_its_read macos::foreground::tests::an_ascii_title_longer_than_the_unit_cap_is_stored_with_cut_true macos::window_title::tests::a_title_of_2000_ascii_units_from_the_bounded_read_enters_the_floor_as_cut macos::input::tests::the_folds_of_the_interval_open_at_a_stop_leave_a_record_or_a_count macos::input::tests::a_click_gives_no_record_when_the_front_read_at_the_click_is_listed_or_under_the_root 2>&1); case "$out" in *"test result: ok. 76 passed; 0 failed"*) true ;; *) printf "%s\n" "$out"; false ;; esac ) >"$RUNNER_TEMP/loop-$n.log" 2>&1; then pass=$((pass + 1)); else echo "round $n failed:"; tail -n 40 "$RUNNER_TEMP/loop-$n.log"; fi
          done
          echo "loop macos-4: passed $pass of 200"
          slow=0; m=0
          while [ "$m" -lt 20 ]; do
            m=$((m + 1))
            if ( out=$(cargo test -p halvo-capture --lib --locked -- --exact macos::input::tests::a_started_source_sends_the_moves_of_one_interval_as_one_record_from_its_own_timer 2>&1); case "$out" in *"test result: ok. 1 passed; 0 failed"*) true ;; *) printf "%s\n" "$out"; false ;; esac ) >"$RUNNER_TEMP/loop-clock-$m.log" 2>&1; then slow=$((slow + 1)); else echo "real-clock round $m failed:"; tail -n 40 "$RUNNER_TEMP/loop-clock-$m.log"; fi
          done
          echo "loop macos-4, real clock: passed $slow of 20"
          [ "$pass" -eq 200 ] && [ "$slow" -eq 20 ]
      - name: macos-4 rows to their end
        if: always()
        shell: bash
        run: |
          set +e
          sh scripts/r1-gate/mutation-test.sh --only keydown-not-in-mask --only audio-source-emits --only microphone-source-emits --only camera-event-per-frame --only call-site-tap-options --only call-site-mask --only camera-event-in-the-stream-output-method --only start-reader-inactive --only title-read-to-string --only title-answer-of-an-earlier-app-kept --only foreground-drop-does-not-stop --only input-drop-does-not-join --only hold-kept-after-a-failed-install --only key-up-served-from-the-last-key-down --only empty-title-read-as-a-title --only key-served-from-the-last-pointer-reading --only stop-read-once-for-a-release --only number-taken-at-arrival --only lag-kept-in-the-instant --only key-up-released --only key-code-kept-in-the-held-value --only refused-emit-keeps-the-queue --only late-key-not-counted --only late-key-up-drops-nothing --only l5-refused-emit-enters-no-drop --only l5-refused-emit-misses-the-popped-key --only l4-untimed-key-up-drops-nothing --only l4-key-up-with-a-new-modifier-bit-is-a-press --only ma24-stop-not-read-after-the-own-reading --only stop-lag-judged-by-the-gap-bound --only key-classes-swapped --only key-up-recorded --only cleared-modifier-recorded --only moves-not-folded --only exclusion-decision-ignored --only key-mask-always-granted --only late-rule-off --only title-read-under-secure-input --only age-not-passed --only private-ending-read-from-the-head --only fold-arrival-front-not-read --only root-not-read-during-the-hold --only fold-timer-not-armed --only fold-record-after-a-stop --only title-answer-across-an-active-reading > "$RUNNER_TEMP/macos-4-rows.log" 2>&1
          status=$?
          grep -E "^(PASS|FAIL|NOT-RUN|STOPPED|built|not-compiled|seconds) mutation:" "$RUNNER_TEMP/macos-4-rows.log"
          tail -n 3 "$RUNNER_TEMP/macos-4-rows.log"
          echo "macos-4 rows: exit $status"
          exit "$status"
      - name: Lockfile unchanged
        if: always()
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" macos
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/
      - name: K7 hosted title test (macos-4)
        if: always()
        shell: bash
        env:
          HALVO_HOSTED_TITLE_HOLD: "1"
          HALVO_SECURE_INPUT_HOLD_REQUIRED: "1"
        run: |
          set +e
          out=$(cargo test -p halvo-capture --lib --locked -- --ignored --exact macos::foreground::tests::a_title_read_while_the_system_hold_is_taken_between_two_poller_steps_is_not_stored --nocapture 2>&1)
          status=$?
          printf '%s\n' "$out" | tail -n 40
          case "$out" in *"test result: ok. 1 passed; 0 failed"*) ;; *) echo "K7 hosted test: no ok line of one test"; status=1 ;; esac
          echo "K7 hosted test: exit $status"
          exit "$status"

  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 20-app-links-no-store 22-daemon-no-dead-allow 23-daemon-port-only 30-core-boundary-proofs 62-build
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 20-app-links-no-store 22-daemon-no-dead-allow 23-daemon-port-only 30-core-boundary-proofs 62-build
      - name: Scripts and hook in a core.autocrlf=true clone
        if: always()
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        if: always()
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" windows
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
