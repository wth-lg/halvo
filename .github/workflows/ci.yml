    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: Loop step of store-3
        if: always()
        shell: bash
        run: |
          export RUST_TEST_THREADS=1
          exe=$(cargo test --locked -p halvo-capture --lib --no-run --message-format=json 2>/dev/null | python3 -c "import json,sys; print([j['executable'] for j in map(json.loads, sys.stdin) if j.get('reason')=='compiler-artifact' and j.get('executable') and j['target']['kind']==['lib']][-1])")
          echo "loop executable: $exe"
          cat > "$RUNNER_TEMP/names.txt" <<'NAMES'
          store::hardening_tests::a_create_whose_database_is_cut_to_nothing_before_the_page_look_answers_obstructed 200
          store::hardening_tests::a_custody_made_before_its_root_guard_shares_the_guards_roots_directory 200
          store::hardening_tests::a_delete_report_and_its_roots_left_print_each_root_id_in_its_one_text_form 200
          store::hardening_tests::a_key_file_place_refuses_a_link_at_its_parents_name_and_reads_nothing_behind_it 200
          store::hardening_tests::a_refused_open_at_the_custody_keeps_the_pending_root_and_create_pending 20
          store::hardening_tests::a_refused_open_in_the_database_keeps_the_pending_root_and_create_pending 20
          store::hardening_tests::a_refused_open_of_a_key_file_of_another_label_keeps_the_pending_root_and_create_pending 20
          store::hardening_tests::a_refused_open_of_a_key_file_of_version_1_keeps_the_pending_root_and_create_pending 20
          store::hardening_tests::a_refused_open_of_a_key_file_of_version_3_keeps_the_pending_root_and_create_pending 20
          store::hardening_tests::a_refused_open_of_a_key_file_that_does_not_parse_keeps_the_pending_root_and_create_pending 20
          store::hardening_tests::a_refused_open_of_a_stopped_create_answers_sealed_and_the_next_create_clears_it 20
          store::hardening_tests::a_refused_open_of_version_3_beside_a_create_pending_of_its_own_root_keeps_both 20
          store::hardening_tests::a_refused_open_with_no_store_db_keeps_the_pending_root_and_create_pending 20
          store::hardening_tests::a_root_step_whose_custody_destroy_fails_still_destroys_every_root_file_under_its_roots 200
          store::hardening_tests::a_sweep_whose_first_removal_fails_still_removes_the_other_keyless_file 200
          store::hardening_tests::an_open_answers_a_fifo_or_a_link_at_create_pending_and_a_fifo_at_its_root_within_a_bound 20
          store::hardening_tests::an_open_beside_a_create_pending_of_another_root_destroys_that_root_and_keeps_its_own 20
          store::hardening_tests::an_open_beside_a_create_pending_of_its_own_root_keeps_the_root_and_removes_create_pending 20
          store::hardening_tests::an_open_whose_cleanup_of_a_stopped_create_fails_answers_ok_and_delete_all_clears_it 20
