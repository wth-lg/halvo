name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - name: Self-tests that commit in throwaway repositories
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          sh scripts/check-commit-messages.sh --self-test-two-paths
          sh scripts/check-commit-messages.sh --self-test-pre-push
          sh scripts/ci-commit-messages.sh --self-test
          sh scripts/merge-pr.sh --self-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 15-r3-test-dirs 20-r5-rule 50-r5-drift 55-r5-routine 60-r5-privacy
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 15-r3-test-dirs 20-r5-rule 50-r5-drift 55-r5-routine 60-r5-privacy
      - name: U2.6 loop of the added tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          rounds=${LOOP_ROUNDS:-200}
          store_tests='tests::keyed::a_refused_learn_edit_row_under_the_key_of_b_whose_text_names_a_stops_the_edits_of_b_and_nothing_of_a
          tests::keyed::a_refused_learn_run_row_under_the_key_of_b_whose_text_names_a_stops_the_runs_of_b_and_nothing_of_a
          tests::keyed::a_refused_learn_routine_row_under_the_key_of_b_whose_text_names_a_stops_the_routine_of_b_and_nothing_of_a
          tests::keyed::a_refused_row_under_the_key_of_a_whose_text_names_b_stops_a_and_nothing_of_b
          tests::keyed::a_refused_row_held_under_no_key_is_read_by_no_workflow_and_stops_nothing
          tests::keyed::a_refused_learn_run_row_under_the_key_of_a_run_that_was_served_answers_its_replay_put_with_the_count_0
          tests::keyed::the_keyed_read_hands_out_the_rows_committed_under_the_key_in_byte_order_and_no_row_under_another_key_or_none
          tests::keyed::while_a_run_of_a_is_held_a_refused_learn_edit_row_under_the_key_of_a_stops_nothing_of_a_run_of_b
          tests::keyed::a_replay_put_playbook_of_a_run_whose_start_is_held_reads_no_row_of_another_workflow
          tests::keyed::a_learn_run_row_of_no_json_under_the_key_of_a_answers_the_replay_put_of_a_with_the_count_0
          tests::kinds::a_refused_row_whose_text_names_no_workflow_stops_only_the_workflow_under_whose_key_it_stands
          routine::tests::fixtures::newest_of_two_rows_of_one_rev_is_the_row_of_the_later_day_in_either_order'
          gate_tests='tests::store::the_keyed_read_hands_out_the_rows_committed_under_the_key_in_byte_order_and_no_row_under_another_key_or_none
          tests::store::delete_workflow_takes_the_rows_kept_under_its_key_whatever_their_text_names'
          binary() {
            cargo test --locked -p "$1" "$2" --no-run --message-format=json 2>/dev/null >"$RUNNER_TEMP/u26-build.json"
            node -e '
              const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n");
              let found = "";
              for (const line of lines) {
                if (!line.startsWith("{")) continue;
                const m = JSON.parse(line);
                if (m.reason === "compiler-artifact" && m.profile && m.profile.test && m.executable) found = m.executable;
              }
              process.stdout.write(found.split(String.fromCharCode(92)).join("/"));
            ' "$RUNNER_TEMP/u26-build.json"
          }
          fail=0
          loop() {
            bin=$1
            shift
            if [ -z "$bin" ]; then
              echo "loop: no test binary was found"
              fail=1
              return
            fi
            for name in "$@"; do
              ok=0
              other=0
              i=0
              while [ "$i" -lt "$rounds" ]; do
                i=$((i + 1))
                out=$("$bin" --exact "$name" --test-threads=1 2>&1)
                case "$out" in
                *"test result: ok. 1 passed; 0 failed;"*) ok=$((ok + 1)) ;;
                *) other=$((other + 1)) ;;
                esac
              done
              echo "loop test=$name passed=$ok other=$other rounds=$rounds"
              if [ "$ok" -ne "$rounds" ]; then
                fail=1
              fi
            done
          }
          store_bin=$(binary halvo-learn-store --lib)
          gate_bin=$(binary halvo-learn-gate --bin=learn-gate)
          # shellcheck disable=SC2086
          loop "$store_bin" $(printf '%s\n' "$store_tests")
          # shellcheck disable=SC2086
          loop "$gate_bin" $(printf '%s\n' "$gate_tests")
          echo "loop result fail=$fail"
          exit "$fail"
      - name: U2.6 tests of the two learning crates
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --locked -p halvo-learn-store -p halvo-learn-gate --no-fail-fast
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default -c core.fileMode=true "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 15-r3-test-dirs 20-r5-rule 50-r5-drift 55-r5-routine 60-r5-privacy
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 15-r3-test-dirs 20-r5-rule 50-r5-drift 55-r5-routine 60-r5-privacy
      - name: U2.6 loop of the added tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          rounds=${LOOP_ROUNDS:-200}
          store_tests='tests::keyed::a_refused_learn_edit_row_under_the_key_of_b_whose_text_names_a_stops_the_edits_of_b_and_nothing_of_a
          tests::keyed::a_refused_learn_run_row_under_the_key_of_b_whose_text_names_a_stops_the_runs_of_b_and_nothing_of_a
          tests::keyed::a_refused_learn_routine_row_under_the_key_of_b_whose_text_names_a_stops_the_routine_of_b_and_nothing_of_a
          tests::keyed::a_refused_row_under_the_key_of_a_whose_text_names_b_stops_a_and_nothing_of_b
          tests::keyed::a_refused_row_held_under_no_key_is_read_by_no_workflow_and_stops_nothing
          tests::keyed::a_refused_learn_run_row_under_the_key_of_a_run_that_was_served_answers_its_replay_put_with_the_count_0
          tests::keyed::the_keyed_read_hands_out_the_rows_committed_under_the_key_in_byte_order_and_no_row_under_another_key_or_none
          tests::keyed::while_a_run_of_a_is_held_a_refused_learn_edit_row_under_the_key_of_a_stops_nothing_of_a_run_of_b
          tests::keyed::a_replay_put_playbook_of_a_run_whose_start_is_held_reads_no_row_of_another_workflow
          tests::keyed::a_learn_run_row_of_no_json_under_the_key_of_a_answers_the_replay_put_of_a_with_the_count_0
          tests::kinds::a_refused_row_whose_text_names_no_workflow_stops_only_the_workflow_under_whose_key_it_stands
          routine::tests::fixtures::newest_of_two_rows_of_one_rev_is_the_row_of_the_later_day_in_either_order'
          gate_tests='tests::store::the_keyed_read_hands_out_the_rows_committed_under_the_key_in_byte_order_and_no_row_under_another_key_or_none
          tests::store::delete_workflow_takes_the_rows_kept_under_its_key_whatever_their_text_names'
          binary() {
            cargo test --locked -p "$1" "$2" --no-run --message-format=json 2>/dev/null >"$RUNNER_TEMP/u26-build.json"
            node -e '
              const lines = require("fs").readFileSync(process.argv[1], "utf8").split("\n");
              let found = "";
              for (const line of lines) {
                if (!line.startsWith("{")) continue;
                const m = JSON.parse(line);
                if (m.reason === "compiler-artifact" && m.profile && m.profile.test && m.executable) found = m.executable;
              }
              process.stdout.write(found.split(String.fromCharCode(92)).join("/"));
            ' "$RUNNER_TEMP/u26-build.json"
          }
          fail=0
          loop() {
            bin=$1
            shift
            if [ -z "$bin" ]; then
              echo "loop: no test binary was found"
              fail=1
              return
            fi
            for name in "$@"; do
              ok=0
              other=0
              i=0
              while [ "$i" -lt "$rounds" ]; do
                i=$((i + 1))
                out=$("$bin" --exact "$name" --test-threads=1 2>&1)
                case "$out" in
                *"test result: ok. 1 passed; 0 failed;"*) ok=$((ok + 1)) ;;
                *) other=$((other + 1)) ;;
                esac
              done
              echo "loop test=$name passed=$ok other=$other rounds=$rounds"
              if [ "$ok" -ne "$rounds" ]; then
                fail=1
              fi
            done
          }
          store_bin=$(binary halvo-learn-store --lib)
          gate_bin=$(binary halvo-learn-gate --bin=learn-gate)
          # shellcheck disable=SC2086
          loop "$store_bin" $(printf '%s\n' "$store_tests")
          # shellcheck disable=SC2086
          loop "$gate_bin" $(printf '%s\n' "$gate_tests")
          echo "loop result fail=$fail"
          exit "$fail"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
