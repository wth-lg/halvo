name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the tests of halvo-derived
        shell: bash
        run: cargo test --locked -p halvo-derived --no-run --message-format=json > "$RUNNER_TEMP/messages.json"
      - name: The page-gap test fails with a count above 0 for each of the six removals
        shell: bash
        run: |
          set +e
          exe=$(grep '"reason":"compiler-artifact"' "$RUNNER_TEMP/messages.json" | grep 'crates/halvo-derived#' | grep '"name":"privacy"' | sed 's/.*"executable":"\([^"]*\)".*/\1/' | sed 's/\\\\/\\/g' | head -n 1)
          echo "binary: [$(basename "$exe")]"
          test -n "$exe" || { echo "PAGE-GAP STEP: no binary of tests/privacy.rs"; exit 1; }
          cd crates/halvo-derived
          "$exe" removed_rows_leave_no_text_in_the_gap_of_a_page_built_again --exact --nocapture --test-threads=1 > "$RUNNER_TEMP/page-gap.txt" 2>&1
          code=$?
          grep "^PAGE-GAP [a-z-]*:\|left after its removal\|^test \|^test result" "$RUNNER_TEMP/page-gap.txt"
          echo "exit $code"
          grep -q "^test result: FAILED. 0 passed; 1 failed;" "$RUNNER_TEMP/page-gap.txt" || { echo "PAGE-GAP STEP: the result line does not show 1 failed"; exit 1; }
          for removal in delete-of-a-workflow dismissal expiry-of-an-open expiry-call purge purge-below; do
            line=$(grep "^PAGE-GAP $removal:" "$RUNNER_TEMP/page-gap.txt" | head -n 1)
            n=$(printf '%s\n' "$line" | sed -n 's/.*markers-left \([0-9]*\),.*/\1/p')
            if [ -z "$n" ] || [ "$n" -eq 0 ]; then
              echo "PAGE-GAP STEP: no count above 0 for $removal"
              exit 1
            fi
          done
          echo "PAGE-GAP STEP: the test fails with a count above 0 for each of the six removals"
