name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
      - name: Loop of the tests that the join changed or added (U4.1, the join with U2.4c)
        timeout-minutes: 45
        shell: bash
        run: |
          set +e
          start=$(date +%s)
          bad=0
          for pair in \
            commands:the_day_is_the_day_of_one_read_of_now_and_follows_the_memory_clock \
            present:agents_answer_with_allow_for_a_native_item_answers_presenter_also_while_its_dialog_is_open \
            present:the_dialogs_allow_reaches_the_run_as_allow_once \
            present:an_item_whose_dialog_never_reports_on_screen_never_arms \
            quit:for_a_run_stopped_before_the_quit_the_grace_counts_from_its_stop \
            quit:a_clock_that_fails_after_the_first_step_leaves_the_whole_grace \
            tray:the_count_of_agents_under_needs_you_reaches_the_trays_sink_at_each_change; do
            name=${pair%%:*}
            test=${pair#*:}
            exe=$(ls -t target/debug/deps/"$name"-*.exe 2>/dev/null | head -n 1)
            if [ -z "$exe" ]; then
              echo "loop $test: no executable $name"
              bad=1
              continue
            fi
            rounds=0
            passes=0
            failures=0
            while [ "$rounds" -lt 200 ]; do
              rounds=$((rounds + 1))
              "$exe" --exact "$test" > "$RUNNER_TEMP/loop-round.txt" 2>&1
              code=$?
              if [ "$code" -eq 0 ] && grep -q '^test result: ok\. 1 passed; 0 failed' "$RUNNER_TEMP/loop-round.txt"; then
                passes=$((passes + 1))
              else
                failures=$((failures + 1))
                echo "loop $test round $rounds failed (exit $code); its output:"
                cat "$RUNNER_TEMP/loop-round.txt"
              fi
            done
            echo "loop $name $test rounds=$rounds passes=$passes failures=$failures seconds=$(( $(date +%s) - start ))"
            if [ "$failures" -ne 0 ]; then
              bad=1
            fi
          done
          exit "$bad"
