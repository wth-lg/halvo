          done
          echo "loop store4-fast-macos: passed $pass of 200"
          [ "$pass" -eq 200 ]
      - name: Loop (store4-slow, 20 rounds)
        shell: bash
        run: |
          set +e
          pass=0; n=0
          while [ "$n" -lt 20 ]; do
            n=$((n + 1))
            if ( cargo test -p halvo-capture --lib --locked -- --exact store::hardening_tests::batch_write::an_event_at_16_30_on_a_clock_8_hours_behind_utc_lands_on_the_next_utc_day store::hardening_tests::batch_write::new_segment_names_carry_no_time_spread_over_shards_and_their_header_holds_no_ordinal store::hardening_tests::batch_write::the_rollup_equals_the_totals_of_live_segments store::hardening_tests::page_gap_probe::single_shreds_of_keys_with_writes_between_leave_no_line_of_the_structural_check store::hardening_tests::page_gap_probe::with_secure_delete_off_the_draw_of_the_store_gives_lines >"$RUNNER_TEMP/s4-sl-halvo-capture.txt" 2>&1; grep -q 'test result: ok. 5 passed; 0 failed' "$RUNNER_TEMP/s4-sl-halvo-capture.txt" || { tail -n 30 "$RUNNER_TEMP/s4-sl-halvo-capture.txt"; false; } && { cargo test -p halvo-sqlcipher --lib --locked -- --exact page_gap::unmended::the_drawn_workloads_print_their_rows_their_integrity_and_the_lines_of_the_search >"$RUNNER_TEMP/s4-sl-halvo-sqlcipher.txt" 2>&1; grep -q 'test result: ok. 1 passed; 0 failed' "$RUNNER_TEMP/s4-sl-halvo-sqlcipher.txt" || { tail -n 30 "$RUNNER_TEMP/s4-sl-halvo-sqlcipher.txt"; false; }; } ) >"$RUNNER_TEMP/loop-store4-slow-$n.log" 2>&1; then pass=$((pass + 1)); else echo "round $n failed:"; tail -n 40 "$RUNNER_TEMP/loop-store4-slow-$n.log"; fi
