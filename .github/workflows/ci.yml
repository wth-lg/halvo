# scratch: builder-48 Addition 1, the windows job alone, trimmed to 10-format 11-clippy 12-test 45-r4-words
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 45-r4-words
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 45-r4-words
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Loop the tests of U2.4d (scratch)
        shell: bash
        run: |
          set +e
          d=$(mktemp -d)
          cat > "$d/loop-names.txt" <<'NAMES'
          roster_card the_card_of_the_fixture_is_its_lines_and_the_runs_that_agent_history_gives
          roster_card the_memory_owner_gives_the_newest_runs_first_and_at_most_the_count_asked
          roster_card rd48h_a_card_holds_the_entries_of_two_classes_in_the_order_of_the_reply
          roster_card a_card_run_shows_its_committed_effects_alone_in_the_order_of_the_reply
          roster_card rd52f_each_cause_of_a_refused_committed_effect_gives_its_unshown_entry_and_no_kept_byte
          roster_card rd52f_each_class_with_an_effect_row_has_its_unshown_entry_and_the_plain_one_the_rest
          roster_card rd85_a_no_recorded_for_the_effect_and_its_digest_in_an_item_of_this_run_is_a_refusal
          roster_card rd85_with_no_row_of_a_no_the_entry_says_only_that_it_was_not_done
          roster_card rd85_two_cards_in_one_run_a_no_on_the_first_and_a_lapse_of_the_second
          roster_card rd85_a_rebind_with_an_allow_at_the_first_digest_and_a_no_at_the_second
          roster_card rd85_a_no_at_another_digest_is_no_witness
          roster_card rd85_an_allow_is_no_witness_and_a_no_of_another_run_is_none
          roster_card rd85_a_ledger_whose_item_raised_row_is_gone_gives_no_refusal_and_the_card_stands
          roster_card rd85_a_no_recorded_and_never_released_is_a_refusal
          roster_card rd85_entries_stand_for_a_null_cause_alone_whatever_the_runs_end
          roster_card rd85_each_class_has_its_not_done_and_refused_entry_with_its_first_kept_field_or_none
          roster_card rd48c_the_coordinators_own_row_decides_the_line_only_for_an_end_that_the_coordinator_gives
          roster_card i34_a_committed_kept_piece_over_1024_bytes_gives_the_unshown_entry
          roster_card i34_a_local_edit_file_name_longer_than_1024_bytes_gives_the_unshown_entry
          roster_card i34_a_not_done_entry_shows_no_first_field_over_1024_bytes
          roster_card rd101i_a_lapse_after_a_switch_off_that_still_stands_has_the_line_of_a_stopped_run
          roster_card rd116_r4_every_cause_that_only_the_coordinator_gives_decides_the_line
          roster_card rd116_r4_the_switch_off_rule_reads_the_newest_person_hold_rows_before_the_runs_end
          roster_card rd116_r4_the_newest_own_row_of_this_run_decides_and_another_runs_row_does_not
          roster_card rd116_r4_a_declined_run_with_one_refusal_beside_a_not_done_effect_says_you_said_no
          roster_card rd116_r4_only_rejected_and_committed_effects_give_entries
          roster_card rd116_r4_a_not_done_entry_shows_the_first_field_of_its_class_by_name
          roster_card rd116_r4_the_piece_bound_is_per_piece_and_takes_1024_bytes
          roster_moves a_second_step_for_an_http_site_outside_127_is_declined_and_raises_no_item
          roster_moves a_second_step_for_127_0_0_1_or_an_https_site_raises_its_item
          roster_moves an_account_link_handback_for_an_http_site_outside_127_is_declined_and_raises_no_item
          roster_moves rd85_a_no_on_the_card_shows_the_refused_entry_and_the_line_that_you_said_no
          roster_moves rd85_two_cards_a_no_on_the_first_and_a_lapse_of_the_second_at_the_coordinator
          roster_moves rd85_a_stop_on_an_open_card_is_no_refusal_and_the_line_says_that_you_stopped_it
          roster_moves rd85_a_stop_after_an_allow_is_no_refusal
          roster_moves rd48c_a_run_that_lapsed_at_wait_limit_shows_the_lapsed_line_whatever_the_store_says
          roster_moves rd85_a_run_that_failed_after_a_no_keeps_its_refused_entry_and_its_failed_line
          roster_moves rd85_a_no_whose_release_never_came_is_a_refusal
          roster_moves an_account_link_handback_for_127_0_0_1_or_an_https_site_raises_its_item
          roster_moves i34_one_confirmation_names_the_agent_that_asks
          roster_moves i34_two_page_confirmations_name_their_agent_and_their_place_in_the_replys_order
          roster_moves rd54g_a_gone_workflows_live_run_keeps_its_row_stopping_with_no_control_until_it_ends
          roster_moves rd54g_a_gone_workflows_run_whose_kill_does_not_end_it_shows_kill_stuck
          roster_moves rd54g_a_gone_workflows_row_names_no_next_day
          roster_moves i14_an_insecure_second_step_is_declined_also_after_the_runs_items_were_spent
          roster_moves i14_an_insecure_account_link_is_declined_also_after_the_runs_items_were_spent
          roster_moves rd116_a_second_request_while_a_card_is_open_ends_the_run_with_kind_for_every_origin
          roster_moves rd116_a_second_request_of_a_stopping_run_is_refused_with_state_for_every_origin
          roster_moves rd116_no_kill_stuck_line_before_any_kill_even_at_the_due_instant
          roster_moves rd116_kill_stuck_after_a_refused_kill_when_the_clock_stepped_back
          roster_moves rd116_r4_a_sign_in_handback_for_an_http_site_raises_its_item
          roster_moves rd116_r4_a_native_confirmation_takes_no_place_among_page_confirmations
          roster_moves rd116_r4_another_item_before_two_page_confirmations_takes_no_place
          roster_moves rd116_r4_a_gone_workflows_live_run_has_one_row
          roster_moves rd116_r4_a_refused_kill_of_one_gone_agent_shows_kill_stuck_on_its_row_alone
          roster_moves rd116_r4_a_kill_refused_at_the_quit_shows_kill_stuck_on_the_gone_row
          items_compose i34_a_confirmation_said_by_its_agent_names_the_agent_that_asks_in_its_text
          items_compose rd116_r4_placed_gives_a_place_to_a_page_confirmation_alone
          words_same the_table_holds_every_key_of_the_families_of_i1_1_once_and_no_other
          words_same placeholders_are_the_ones_that_the_contract_names
          words_same rd116_w1_the_three_texts_stand_word_for_word
          words_same rd81_the_line_of_the_hold_failures_names_its_way_out
          words_same rd24b_the_second_steps_two_choices_say_what_follows_each
          words_same every_status_line_has_its_key_and_its_status
          lib types::tests::origin_parse_answers_every_input_as_web_origin_parse_of_the_agent_setup_run
          lib types::fixtures::tests::the_newer_run_of_the_card_holds_one_committed_payment_with_its_four_kept_fields
          NAMES
          cat > "$d/loop.py" <<'LOOP'
          import json, subprocess, sys, time
          names = [l.split(" ", 1) for l in open(sys.argv[2]).read().splitlines() if l.strip()]
          rounds = int(sys.argv[1])
          p = subprocess.run(["cargo", "test", "-p", "halvo-coord", "--locked", "--no-run", "--message-format=json"],
                             stdout=subprocess.PIPE, text=True)
          exes = {}
          for line in p.stdout.splitlines():
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if m.get("reason") == "compiler-artifact" and m.get("executable") and m["profile"]["test"]:
                  kind = m["target"]["kind"]
                  exes["lib" if kind == ["lib"] else m["target"]["name"]] = m["executable"]
          short = 0
          start = time.time()
          for target, name in names:
              exe = exes.get(target)
              ok = 0
              for _ in range(rounds if exe else 0):
                  r = subprocess.run([exe, "--exact", name, "--test-threads=1"], stdout=subprocess.PIPE,
                                     stderr=subprocess.STDOUT, text=True)
                  if "test result: ok. 1 passed" in r.stdout:
                      ok += 1
              if ok != rounds:
                  short += 1
              print(f"loop {target} {name} runs={rounds} passed={ok}", flush=True)
          print(f"loop total tests={len(names)} short={short} seconds={int(time.time() - start)}")
          sys.exit(1 if short else 0)
          LOOP
          py=$(command -v python3 || command -v python)
          "$py" "$d/loop.py" 200 "$d/loop-names.txt"
          code=$?
          echo "loop exit $code"
          exit $code
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
