name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # scratch: the U0.6 control alone (CP-173 E1 (h)); never merged
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Build the drive crate
        shell: bash
        run: cd tools/r3-trials/drive && cargo build --release --locked
      - name: r3 U0.6 control cells
        shell: bash
        run: |
          for cell in right:bill right:order effect_early:bill effect_early:order option_then_right:bill option_then_right:order sign_in_click:bill option_line:bill; do
            mode=${cell%%:*}
            task=${cell#*:}
            sh tools/r3-trials/drive/control.sh --mode "$mode" --task "$task" --browser "C:/Program Files/Google/Chrome/Application/chrome.exe" --port 18190 || echo "control script mode=$mode task=$task exit=$?"
          done
