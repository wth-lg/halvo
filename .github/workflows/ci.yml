        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: win-3 W3-11, the C5 rows with the rule's check taken out (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/undo.log"
          python - <<'PY'
          g = "crates/halvo-capture/src/windows/secure_input.rs"
          old = "&& matches!(entry.mark, Mark::Read { moved, .. } if moved != Moved::Same)"
          text = open(g, encoding="utf-8").read().replace("\r\n", "\n")
          print("MUTANT w311-fold-out matches", text.count(old))
          assert text.count(old) == 1
          open(g, "w", encoding="utf-8", newline="\n").write(text.replace(old, "&& false"))
