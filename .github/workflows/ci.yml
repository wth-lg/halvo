name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Not used by this scratch spike
        shell: bash
        run: echo "macos job cut to one step for scratch spike s9"

  windows:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: npm ci
        shell: bash
        run: npm ci
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
          workspaces: |
            . -> target
            spike/r1-win-b -> target
      - name: Build the probe
        shell: bash
        run: cargo build --release --locked --manifest-path spike/r1-win-b/Cargo.toml
      - name: Build the app with its window created hidden
        shell: bash
        run: sh spike/r1-win-b/ci/build-hidden-app.sh
      - name: S9 probe, runner account
        shell: bash
        run: spike/r1-win-b/target/release/r1probe.exe app-run --exe "$(cygpath -w target/release/halvo.exe)" --runs 3 --idle-secs 15 --walk --label runner
      - name: S9 probe, standard account
        if: ${{ !cancelled() }}
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File spike\r1-win-b\ci\s9.ps1
