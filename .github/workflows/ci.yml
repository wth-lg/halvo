name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 11-cap
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 11-cap
      - name: U0.2b repeated rounds
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          set +e
          out=$(cargo test --locked -p halvo-cap --no-run 2>&1)
          lib=$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src[\\/]lib.rs (\(.*\))$/\1/p' | tr '\\' '/')
          it=$(printf '%s\n' "$out" | sed -n 's/.*Executable tests[\\/]model_lock.rs (\(.*\))$/\1/p' | tr '\\' '/')
          echo "u02b-rounds binaries found: lib=$([ -n "$lib" ] && echo yes || echo no) model_lock=$([ -n "$it" ] && echo yes || echo no)"
          [ -n "$lib" ] && [ -n "$it" ] || exit 1
          log="$RUNNER_TEMP/u02b-round.txt"
          "$lib" lock::tests:: >"$log" 2>&1
          echo "u02b-head lib lock tests exit=$?"
          grep -E '^test |^test result|model-lock' "$log"
          "$it" >"$log" 2>&1
          echo "u02b-head model_lock tests exit=$?"
          grep -E '^test |^test result|model-lock' "$log"
          passed=0
          start=$(date +%s)
          while [ "$passed" -lt 200 ]; do
            "$lib" lock::tests:: >"$log" 2>&1 && "$it" >>"$log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "u02b-rounds round $((passed + 1)) failed with exit $code; the test lines of that round:"
              grep -E '^test |^test result|^failures' "$log"
              break
            fi
            passed=$((passed + 1))
          done
          echo "u02b-rounds passed=$passed of 200 seconds=$(($(date +%s) - start))"
          [ "$passed" -eq 200 ]
      - name: U0.2b E3 (iii) the end-to-end test over the child without its gate
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          it=crates/halvo-cap/tests/model_lock.rs
          py=$(command -v python3 || command -v python)
          "$py" - "$it" <<'PY'
          import sys
          p = sys.argv[1]
          lines = open(p, encoding="utf-8").read().split("\n")
          start = [i for i, l in enumerate(lines) if l.rstrip("\r") == '        "hold-account" | "try-account" if !on_a_hosted_runner() => {']
          assert len(start) == 1, start
          end = start[0] + [l.rstrip("\r") for l in lines[start[0]:]].index("        }")
          del lines[start[0] : end + 1]
          open(p, "w", encoding="utf-8").write("\n".join(lines))
          print("u02b-e3iii gate lines taken out:", end + 1 - start[0])
          PY
          cargo test --locked -p halvo-cap --test model_lock -- two_loaders_with_other_account_variables_meet_at_the_accounts_lock 2>&1 | grep -E '^test |model-lock end-to-end|^test result|refused'
          git checkout -- "$it"
          echo "u02b-e3iii after: tracked files that differ from HEAD: $(git status --porcelain --untracked-files=no | grep -c .)"
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 11-cap
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 11-cap
      - name: U0.2b repeated rounds
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          set +e
          out=$(cargo test --locked -p halvo-cap --no-run 2>&1)
          lib=$(printf '%s\n' "$out" | sed -n 's/.*Executable unittests src[\\/]lib.rs (\(.*\))$/\1/p' | tr '\\' '/')
          it=$(printf '%s\n' "$out" | sed -n 's/.*Executable tests[\\/]model_lock.rs (\(.*\))$/\1/p' | tr '\\' '/')
          echo "u02b-rounds binaries found: lib=$([ -n "$lib" ] && echo yes || echo no) model_lock=$([ -n "$it" ] && echo yes || echo no)"
          [ -n "$lib" ] && [ -n "$it" ] || exit 1
          log="$RUNNER_TEMP/u02b-round.txt"
          "$lib" lock::tests:: >"$log" 2>&1
          echo "u02b-head lib lock tests exit=$?"
          grep -E '^test |^test result|model-lock' "$log"
          "$it" >"$log" 2>&1
          echo "u02b-head model_lock tests exit=$?"
          grep -E '^test |^test result|model-lock' "$log"
          passed=0
          start=$(date +%s)
          while [ "$passed" -lt 200 ]; do
            "$lib" lock::tests:: >"$log" 2>&1 && "$it" >>"$log" 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "u02b-rounds round $((passed + 1)) failed with exit $code; the test lines of that round:"
              grep -E '^test |^test result|^failures' "$log"
              break
            fi
            passed=$((passed + 1))
          done
          echo "u02b-rounds passed=$passed of 200 seconds=$(($(date +%s) - start))"
          [ "$passed" -eq 200 ]
      - name: U0.2b E3 (iii) the end-to-end test over the child without its gate
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          it=crates/halvo-cap/tests/model_lock.rs
          py=$(command -v python3 || command -v python)
          "$py" - "$it" <<'PY'
          import sys
          p = sys.argv[1]
          lines = open(p, encoding="utf-8").read().split("\n")
          start = [i for i, l in enumerate(lines) if l.rstrip("\r") == '        "hold-account" | "try-account" if !on_a_hosted_runner() => {']
          assert len(start) == 1, start
          end = start[0] + [l.rstrip("\r") for l in lines[start[0]:]].index("        }")
          del lines[start[0] : end + 1]
          open(p, "w", encoding="utf-8").write("\n".join(lines))
          print("u02b-e3iii gate lines taken out:", end + 1 - start[0])
          PY
          cargo test --locked -p halvo-cap --test model_lock -- two_loaders_with_other_account_variables_meet_at_the_accounts_lock 2>&1 | grep -E '^test |model-lock end-to-end|^test result|refused'
          git checkout -- "$it"
          echo "u02b-e3iii after: tracked files that differ from HEAD: $(git status --porcelain --untracked-files=no | grep -c .)"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
      - name: U0.2b E7 changed copies of the Windows half
        if: ${{ !cancelled() }}
        timeout-minutes: 40
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          cat >"$RUNNER_TEMP/u02b-e7.py" <<'PY'
          import re, subprocess, sys
          F = "crates/halvo-cap/src/lock.rs"
          C = [
              ("W01", "the null token", "            token.0,\n            &mut path.0,", "            std::ptr::null_mut(),\n            &mut path.0,"),
              ("W02", "the access of the token's open", "            TOKEN_QUERY | TOKEN_IMPERSONATE,", "            TOKEN_QUERY,"),
              ("W03", "the failure branch of OpenProcessToken", "    } == 0\n    {", "    } != 0\n    {"),
              ("W04", "the flag of the known-folder call", "            KF_FLAG_DEFAULT as u32,", "            0x8000u32,"),
              ("W05", "the folder id", "            &FOLDERID_LocalAppData,", "            &windows_sys::Win32::UI::Shell::FOLDERID_RoamingAppData,"),
              ("W06", "the branch for a negative result", "    if hr < 0 {", "    if hr > 0 {"),
              ("W07", "the null-path branch", "    if path.0.is_null() {", "    if !path.0.is_null() {"),
              ("W08", "the length loop", "        .take_while(|&i| unsafe { *path.0.add(i) } != 0)\n        .count();", "        .take_while(|&i| unsafe { *path.0.add(i) } != 0)\n        .count()\n        .saturating_sub(1);"),
              ("W09", "the share mode", "    options.share_mode(FILE_SHARE_READ | FILE_SHARE_WRITE);", "    options.share_mode(FILE_SHARE_READ | FILE_SHARE_WRITE | windows_sys::Win32::Storage::FileSystem::FILE_SHARE_DELETE);"),
              ("W10", "the path below the base", '    base.join("halvo").join("model.lock")', '    base.join("halvo").join("model.lck")'),
          ]
          bad = 0
          for cid, what, old, new in C:
              text = open(F, encoding="utf-8").read()
              text = text.replace("\r\n", "\n")
              if text.count(old) != 1:
                  print(f"u02b-e7 {cid} ({what}): not applied, {text.count(old)} matches", flush=True)
                  bad += 1
                  continue
              open(F, "w", encoding="utf-8").write(text.replace(old, new))
              p = subprocess.run(["cargo", "test", "--locked", "-p", "halvo-cap", "--no-fail-fast", "--lib", "--test", "model_lock"], capture_output=True, text=True)
              subprocess.run(["git", "checkout", "--", F], check=True)
              log = p.stdout + p.stderr
              failed = re.findall(r"^test (\S+) \.\.\. FAILED", log, re.M)
              if failed:
                  print(f"u02b-e7 {cid} ({what}): fails {failed[0]} and {len(failed) - 1} more", flush=True)
              elif "could not compile" in log:
                  print(f"u02b-e7 {cid} ({what}): does not build", flush=True)
              elif p.returncode == 0:
                  print(f"u02b-e7 {cid} ({what}): survives", flush=True)
              else:
                  print(f"u02b-e7 {cid} ({what}): exit {p.returncode} with no failed test", flush=True)
          left = subprocess.run(["git", "status", "--porcelain", "--untracked-files=no"], capture_output=True, text=True).stdout
          print(f"u02b-e7 copies not applied: {bad}; tracked files that differ from HEAD: {len(left.splitlines())}")
          sys.exit(1 if bad else 0)
          PY
          "$py" "$RUNNER_TEMP/u02b-e7.py"
