              return c["mine"]


          def artifacts(command, cwd):
              out = subprocess.run(command, cwd=cwd, capture_output=True, text=True)
              if out.returncode != 0:
                  print("build exit=%d" % out.returncode)
                  print(out.stderr[-3000:])
                  sys.exit(1)
