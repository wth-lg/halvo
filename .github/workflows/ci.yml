name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 50-windows-functional
      - name: "win-2: proof files and a second checkout"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          files="$RUNNER_TEMP/w2"
          mkdir -p "$files"
          cat >"$files/w2_clearing.rs" <<'W2_PROBE_EOF'
          //! The clearing rule of RR-windows-04 (capture run, win-2): c8b of spike S4 in
          //! two sets. `control` is the c8b baseline of S4: a pixel-reading capture of
          //! its own, no MTA reference. `repaired` is the same sequence with the
          //! product's ScreenSource at this head, which takes the process-lifetime MTA
          //! reference before its first session. Written by the scratch run only.
          #![cfg(target_os = "windows")]

          use std::ffi::c_void;
          use std::sync::atomic::{AtomicU32, Ordering};
          use std::sync::mpsc;
          use std::sync::{Arc, Mutex};
          use std::time::{Duration, Instant};

          use halvo_capture::event::Modality;
          use halvo_capture::sink::{channel, SinkWriter};
          use halvo_capture::source::{CaptureSource, SourceContext};
          use halvo_capture::windows::screen::ScreenSource;

          use windows::core::{HSTRING, PCWSTR};
          use windows::Win32::Foundation::{COLORREF, HINSTANCE, HWND, LPARAM, LRESULT, WPARAM};
          use windows::Win32::Graphics::Gdi::CreateSolidBrush;
          use windows::Win32::System::LibraryLoader::GetModuleHandleW;
          use windows::Win32::UI::WindowsAndMessaging::{
              CreateWindowExW, DefWindowProcW, DestroyWindow, DispatchMessageW, PeekMessageW,
              RegisterClassW, SetWindowDisplayAffinity, TranslateMessage, UnregisterClassW, MSG, PM_REMOVE,
              WDA_EXCLUDEFROMCAPTURE, WNDCLASSW, WS_EX_TOPMOST, WS_POPUP, WS_VISIBLE,
          };
          use windows_capture::capture::{Context, GraphicsCaptureApiHandler};
          use windows_capture::frame::Frame;
          use windows_capture::graphics_capture_api::InternalCaptureControl;
          use windows_capture::monitor::Monitor;
          use windows_capture::settings::{
              ColorFormat, CursorCaptureSettings, DirtyRegionSettings, DrawBorderSettings,
              MinimumUpdateIntervalSettings, SecondaryWindowSettings, Settings,
          };

          #[repr(C)]
          struct ExceptionRecord {
              code: u32,
              flags: u32,
              record: *mut ExceptionRecord,
              address: *mut c_void,
              params: u32,
              info: [usize; 15],
          }

          #[repr(C)]
          struct ExceptionPointers {
              record: *mut ExceptionRecord,
              context: *mut c_void,
          }

          type VectoredHandler = unsafe extern "system" fn(*mut ExceptionPointers) -> i32;

          #[link(name = "kernel32")]
          extern "system" {
              fn AddVectoredExceptionHandler(first: u32, handler: VectoredHandler) -> *mut c_void;
              fn GetModuleHandleExW(flags: u32, address: *const u16, module: *mut *mut c_void) -> i32;
              fn GetModuleFileNameW(module: *mut c_void, name: *mut u16, size: u32) -> u32;
              fn GetStdHandle(which: u32) -> *mut c_void;
              fn WriteFile(
                  file: *mut c_void,
                  buffer: *const u8,
                  len: u32,
                  written: *mut u32,
                  overlapped: *mut c_void,
              ) -> i32;
          }

          const STD_OUTPUT_HANDLE: u32 = (-11i32) as u32;
          const FROM_ADDRESS: u32 = 0x4;
          const UNCHANGED_REFCOUNT: u32 = 0x2;
          const MAGENTA: u32 = 0x00FF_00FF;

          static PRINTED: AtomicU32 = AtomicU32::new(0);

          struct Line {
              buf: [u8; 320],
              len: usize,
          }

          impl Line {
              fn text(&mut self, s: &[u8]) {
                  for &b in s {
                      if self.len < self.buf.len() - 1 {
                          self.buf[self.len] = b;
                          self.len += 1;
                      }
                  }
              }
              fn hex(&mut self, mut v: usize) {
                  let mut digits = [0u8; 16];
                  let mut n = 0;
                  loop {
                      let d = (v & 0xF) as u8;
                      digits[n] = if d < 10 { b'0' + d } else { b'a' + d - 10 };
                      n += 1;
                      v >>= 4;
                      if v == 0 {
                          break;
                      }
                  }
                  self.text(b"0x");
                  while n > 0 {
                      n -= 1;
                      self.text(&digits[n..n + 1]);
                  }
              }
          }

          unsafe extern "system" fn on_exception(pointers: *mut ExceptionPointers) -> i32 {
              let record = unsafe { &*(*pointers).record };
              let watched = matches!(record.code, 0xC000_0005 | 0xC000_0374 | 0xC000_0409);
              if !watched || PRINTED.fetch_add(1, Ordering::SeqCst) >= 3 {
                  return 0;
              }
              let mut line = Line {
                  buf: [0; 320],
                  len: 0,
              };
              line.text(b"W2 fault code=");
              line.hex(record.code as usize);
              let mut module: *mut c_void = core::ptr::null_mut();
              let found = unsafe {
                  GetModuleHandleExW(
                      FROM_ADDRESS | UNCHANGED_REFCOUNT,
                      record.address as *const u16,
                      &mut module,
                  )
              } != 0;
              if found {
                  let mut name = [0u16; 260];
                  let n = unsafe { GetModuleFileNameW(module, name.as_mut_ptr(), 260) } as usize;
                  let start = name[..n]
                      .iter()
                      .rposition(|&c| c == b'\\' as u16)
                      .map_or(0, |i| i + 1);
                  line.text(b" module=");
                  for &c in &name[start..n] {
                      line.text(&[if c < 128 { c as u8 } else { b'?' }]);
                  }
                  line.text(b" offset=");
                  line.hex(record.address as usize - module as usize);
              } else {
                  line.text(b" module=<none> offset=");
                  line.hex(record.address as usize & 0xFFFF);
              }
              line.text(b"\n");
              let mut written = 0u32;
              unsafe {
                  WriteFile(
                      GetStdHandle(STD_OUTPUT_HANDLE),
                      line.buf.as_ptr(),
                      line.len as u32,
                      &mut written,
                      core::ptr::null_mut(),
                  );
              }
              0
          }

          fn say(message: impl AsRef<str>) {
              println!("W2 c8b {}", message.as_ref());
          }

          fn pump_thread(window: Duration) {
              let deadline = Instant::now() + window;
              let mut msg = MSG::default();
              loop {
                  unsafe {
                      while PeekMessageW(&mut msg, None, 0, 0, PM_REMOVE).as_bool() {
                          let _ = TranslateMessage(&msg);
                          DispatchMessageW(&msg);
                      }
                  }
                  if Instant::now() >= deadline {
                      break;
                  }
                  std::thread::sleep(Duration::from_millis(10));
              }
          }

          unsafe extern "system" fn test_wnd_proc(
              hwnd: HWND,
              msg: u32,
              wparam: WPARAM,
              lparam: LPARAM,
          ) -> LRESULT {
              unsafe { DefWindowProcW(hwnd, msg, wparam, lparam) }
          }

          struct Popup {
              hwnd: HWND,
              class_name: HSTRING,
              hinstance: HINSTANCE,
              destroyed: bool,
          }

          impl Popup {
              fn magenta() -> Self {
                  let class_name = HSTRING::from("W2ClearingPopup");
                  let hinstance: HINSTANCE = unsafe { GetModuleHandleW(None) }.expect("module").into();
                  let wc = WNDCLASSW {
                      lpfnWndProc: Some(test_wnd_proc),
                      hInstance: hinstance,
                      lpszClassName: PCWSTR(class_name.as_ptr()),
                      hbrBackground: unsafe { CreateSolidBrush(COLORREF(MAGENTA)) },
                      ..Default::default()
                  };
                  assert_ne!(unsafe { RegisterClassW(&wc) }, 0, "RegisterClassW");
                  let hwnd = unsafe {
                      CreateWindowExW(
                          WS_EX_TOPMOST,
                          PCWSTR(class_name.as_ptr()),
                          PCWSTR(class_name.as_ptr()),
                          WS_POPUP | WS_VISIBLE,
                          100,
                          100,
                          360,
                          240,
                          None,
                          None,
                          Some(hinstance),
                          None,
                      )
                  }
                  .expect("window");
                  Self {
                      hwnd,
                      class_name,
                      hinstance,
                      destroyed: false,
                  }
              }

              fn exclude(&self) -> bool {
                  unsafe { SetWindowDisplayAffinity(self.hwnd, WDA_EXCLUDEFROMCAPTURE) }.is_ok()
              }

              fn destroy(&mut self) {
                  if self.destroyed {
                      return;
                  }
                  self.destroyed = true;
                  unsafe {
                      let _ = DestroyWindow(self.hwnd);
                      let _ = UnregisterClassW(PCWSTR(self.class_name.as_ptr()), Some(self.hinstance));
                  }
                  pump_thread(Duration::from_millis(50));
              }
          }

          struct ProbeFlags {
              samples: mpsc::Sender<bool>,
          }

          struct PixelProbe {
              flags: ProbeFlags,
          }

          impl GraphicsCaptureApiHandler for PixelProbe {
              type Flags = ProbeFlags;
              type Error = String;

              fn new(ctx: Context<Self::Flags>) -> Result<Self, Self::Error> {
                  Ok(Self { flags: ctx.flags })
              }

              fn on_frame_arrived(
                  &mut self,
                  frame: &mut Frame,
                  _control: InternalCaptureControl,
              ) -> Result<(), Self::Error> {
                  let read = frame
                      .buffer()
                      .map(|mut buffer| {
                          let pitch = buffer.row_pitch() as usize;
                          let offset = 220 * pitch + 280 * 4;
                          buffer.as_raw_buffer().get(offset..offset + 4).is_some()
                      })
                      .unwrap_or(false);
                  let _ = self.flags.samples.send(read);
                  Ok(())
              }
          }

          fn baseline_capture(label: &str) {
              let (samples, received) = mpsc::channel();
              let monitor = Monitor::primary().expect("primary monitor");
              let settings = Settings::new(
                  monitor,
                  CursorCaptureSettings::WithoutCursor,
                  DrawBorderSettings::Default,
                  SecondaryWindowSettings::Default,
                  MinimumUpdateIntervalSettings::Default,
                  DirtyRegionSettings::Default,
                  ColorFormat::Bgra8,
                  ProbeFlags { samples },
              );
              let control = PixelProbe::start_free_threaded(settings).expect("capture start");
              let mut frames = 0u32;
              let mut deadline = Instant::now() + Duration::from_secs(10);
              while Instant::now() < deadline {
                  if received.try_recv().is_ok() {
                      if frames == 0 {
                          deadline = Instant::now() + Duration::from_secs(3);
                      }
                      frames += 1;
                  }
                  pump_thread(Duration::from_millis(20));
              }
              let stopped = control.stop().is_ok();
              say(format!("capture={label} baseline frames={frames} stopped={stopped}"));
          }

          fn frames_of(writer: &SinkWriter, window: Duration) -> usize {
              let deadline = Instant::now() + window;
              let mut frames = 0;
              while let Some(left) = deadline.checked_duration_since(Instant::now()) {
                  match writer.recv_timeout(left) {
                      Ok(received) if received.event().modality == Modality::ScreenFrame => frames += 1,
                      Ok(_) => {}
                      Err(_) => break,
                  }
              }
              frames
          }

          fn product_capture(label: &str) {
              let (sink, writer) = channel(256);
              let mut screen = ScreenSource::new(Arc::new(Mutex::new(None)));
              let start = screen.begin(SourceContext::new(sink.clone()));
              let mut frames = 0;
              let began = Instant::now();
              while began.elapsed() < Duration::from_secs(3) {
                  pump_thread(Duration::from_millis(50));
                  frames += frames_of(&writer, Duration::from_millis(50));
              }
              let stop = screen.shutdown();
              say(format!(
                  "capture={label} product_source start_ok={} frames={frames} stop_ok={}",
                  start.is_ok(),
                  stop.is_ok()
              ));
          }

          #[test]
          #[ignore = "clearing rule of RR-windows-04: run by name in its own process"]
          fn w2_c8b() {
              unsafe {
                  AddVectoredExceptionHandler(1, on_exception);
              }
              let set = std::env::var("W2_SET").unwrap_or_else(|_| "control".to_string());
              say(format!("begin set={set}"));
              let product = set == "repaired";
              let worker = std::thread::spawn(move || {
                  let mut popup = Popup::magenta();
                  pump_thread(Duration::from_millis(500));
                  if product {
                      product_capture("first");
                  } else {
                      baseline_capture("first");
                  }
                  say(format!("affinity_set={}", popup.exclude()));
                  pump_thread(Duration::from_millis(500));
                  if product {
                      product_capture("second");
                  } else {
                      baseline_capture("second");
                  }
                  popup.destroy();
                  say("teardown window_destroyed=true");
                  std::thread::sleep(Duration::from_secs(2));
                  say("teardown idle_2s_after=true");
              });
              worker.join().expect("the c8b body");
              say(format!("end set={set}"));
          }
          W2_PROBE_EOF
          cat >"$files/w2-clearing.sh" <<'W2_CLEARING_EOF'
          #!/bin/bash
          # The clearing rule of RR-windows-04 in one job: 30 launches of c8b with the
          # repair and 30 of the unrepaired control, interleaved one for one. Prints
          # counts, exit codes and the probe's W2 lines only.
          set -u
          w=$1
          files=$2
          cd "$w" || exit 2
          cp "$files/w2_clearing.rs" crates/halvo-capture/tests/w2_clearing.rs || exit 2
          if ! cargo test --locked -p halvo-capture --test w2_clearing --no-run --message-format json >"$files/clearing-build.json" 2>"$files/clearing-build.err"; then
            echo "W2 clearing result=build-failed"
            tail -n 30 "$files/clearing-build.err"
            exit 1
          fi
          exe=$(sed -n 's/.*"name":"w2_clearing".*"executable":"\([^"]*\)".*/\1/p' "$files/clearing-build.json" | sed 's/\\\\/\//g')
          [ -f "$exe" ] || { echo "W2 clearing result=no-executable"; exit 1; }
          powershell -NoProfile -Command '"W2 clearing env os_version=" + [Environment]::OSVersion.Version.ToString()'
          powershell -NoProfile -Command '$p = Get-CimInstance Win32_Processor | Select-Object -First 1; "W2 clearing env cpu=" + ($p.Name -replace " ", "_") + " logical=" + $p.NumberOfLogicalProcessors'
          launches=${W2_LAUNCHES:-30}
          tally=$files/clearing-tally.txt
          : >"$tally"
          round=0
          while [ "$round" -lt "$launches" ]; do
            round=$((round + 1))
            for set in control repaired; do
              out=$(W2_SET=$set timeout 120 "$exe" --ignored --exact w2_c8b --nocapture 2>&1)
              rc=$?
              case $rc in
                0) kind=pass ;;
                139 | 3221225477 | -1073741819) kind=fault ;;
                124) kind=timeout ;;
                *) kind=other ;;
              esac
              printf 'W2 clearing launch set=%s round=%s exit=%s kind=%s\n' "$set" "$round" "$rc" "$kind"
              printf '%s\n' "$out" | tr -d '\r' | grep -a '^W2 ' | sed 's/^/  /'
              printf '%s %s\n' "$set" "$kind" >>"$tally"
            done
            if [ "$round" -eq 1 ] && ! grep -q ' pass$\| fault$' "$tally"; then
              echo "W2 clearing result=probe-broken (round 1 had no pass and no fault)"
              exit 1
            fi
          done
          for set in control repaired; do
            n_pass=$(grep -c "^$set pass$" "$tally")
            n_fault=$(grep -c "^$set fault$" "$tally")
            n_timeout=$(grep -c "^$set timeout$" "$tally")
            n_other=$(grep -c "^$set other$" "$tally")
            printf 'W2 clearing summary set=%s launches=%s pass=%s faults=%s timeouts=%s other=%s\n' "$set" "$launches" "$n_pass" "$n_fault" "$n_timeout" "$n_other"
          done
          W2_CLEARING_EOF
          cat >"$files/w2-mutants.sh" <<'W2_MUTANTS_EOF'
          #!/bin/bash
          # The one-rule changes of win-2, one after another in one checkout of the head
          # with one target directory: apply, build and run the named test, restore with
          # git checkout. A change is caught when its test fails or it does not build.
          set -u
          w=$1
          files=$2
          list=$3
          cd "$w" || exit 2
          head=$(git rev-parse HEAD)
          tab=$(printf '\t')
          caught=0
          survived=0
          nobuild=0
          unapplied=0
          n=0
          while IFS="$tab" read -r name file subst kind test; do
            [ -n "$name" ] || continue
            n=$((n + 1))
            git checkout --quiet -- "$file"
            if ! SUBST="$subst" perl -0777 -i -pe '$c = eval "\$_ =~ $ENV{SUBST}"; die "no match\n" unless $c;' "$file" 2>"$files/m-apply.err"; then
              unapplied=$((unapplied + 1))
              printf 'W2 mutant name=%s result=not-applied\n' "$name"
              git checkout --quiet -- "$file"
              continue
            fi
            log=$files/mutant-$n.log
            began=$(date +%s)
            if [ "$kind" = tf ]; then
              timeout 900 cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact "$test" --nocapture >"$log" 2>&1
            else
              timeout 900 cargo test --locked -p halvo-capture --lib -- --exact "$test" >"$log" 2>&1
            fi
            code=$?
            ended=$(date +%s)
            ran=$(tr -d '\r' <"$log" | grep -a -c '^test .* \.\.\. ')
            if grep -a -q 'could not compile\|^error\[E' "$log"; then
              result=no-build
              nobuild=$((nobuild + 1))
            elif [ "$code" -eq 124 ]; then
              result=caught-time-limit
              caught=$((caught + 1))
            elif [ "$ran" -ne 1 ]; then
              result=not-one-test-ran
              survived=$((survived + 1))
            elif [ "$code" -ne 0 ] && grep -a -q "^test .* \.\.\. FAILED" "$log"; then
              result=caught
              caught=$((caught + 1))
            else
              result=survived
              survived=$((survived + 1))
            fi
            printf 'W2 mutant name=%s kind=%s test=%s exit=%s tests_ran=%s result=%s seconds=%s\n' "$name" "$kind" "$test" "$code" "$ran" "$result" "$((ended - began))"
            tr -d '\r' <"$log" | grep -a -E '^test .* \.\.\. |panicked at|^error(\[|:)|^TF ' | head -6 | sed 's/^/W2   /'
            git checkout --quiet -- "$file"
          done <"$list"
          git diff --quiet "$head" || echo "W2 mutants the checkout differs from the head after the run"
          printf 'W2 mutants summary changes=%s caught=%s no_build=%s survived=%s not_applied=%s\n' "$n" "$caught" "$nobuild" "$survived" "$unapplied"
          W2_MUTANTS_EOF
          cat >"$files/w2-proofs.sh" <<'W2_PROOFS_EOF'
          #!/bin/bash
          # The proof of each part of win-2: its tests at the commit that adds them
          # (before the fix) and at the commit of the fix, in one checkout with one
          # target directory. Prints exit codes and the test result lines only.
          set -u
          w=$1
          files=$2
          cd "$w" || exit 2
          run() {
            part=$1 at=$2 commit=$3 kind=$4
            shift 4
            git checkout --quiet --force --detach "$commit" || { echo "W2 proof part=$part at=$at commit=$commit result=checkout-failed"; return; }
            log=$files/proof-$part-$at-$kind.log
            if [ "$kind" = tf ]; then
              timeout 900 cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact "$@" --nocapture >"$log" 2>&1
            else
              timeout 900 cargo test --locked -p halvo-capture --lib -- --exact "$@" >"$log" 2>&1
            fi
            code=$?
            ok=$(tr -d '\r' <"$log" | grep -a -c '^test .* \.\.\. ok$')
            failed=$(tr -d '\r' <"$log" | grep -a -c '^test .* \.\.\. FAILED$')
            echo "W2 proof part=$part at=$at commit=$commit kind=$kind exit=$code ok=$ok failed=$failed"
            tr -d '\r' <"$log" | grep -a -E '^test .* \.\.\. |^test result:|panicked at|^KNOWN-DEFECT|^TF |^error(\[|:)' | head -40 | sed 's/^/W2   /'
          }
          run RR-windows-21 before db2177bc359cfa212d954034b9d6879fc88e1d9c lib windows::foreground::tests::a_foreground_hook_that_does_not_install_fails_the_start_with_its_step windows::window_title::tests::a_title_hook_that_does_not_install_fails_the_start_with_its_step windows::input::tests::a_second_keyboard_source_names_the_step_that_failed
          run RR-windows-21 after 5a64eaa7233f68198c32ec75be3ed208ee00b073 lib windows::foreground::tests::a_foreground_hook_that_does_not_install_fails_the_start_with_its_step windows::window_title::tests::a_title_hook_that_does_not_install_fails_the_start_with_its_step windows::input::tests::a_second_keyboard_source_names_the_step_that_failed
          run RR-windows-09 before b08e217e4e5b941c3efe17bf474e60001383aa09 lib windows::tests::with_the_sink_full_one_motion_sample_is_pending_and_no_button_packet_is_lost
