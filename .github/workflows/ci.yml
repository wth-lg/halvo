name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 63-prerequisites 64-readme 26-r7-pnpm-step 60-release-dry-run
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 63-prerequisites 64-readme 26-r7-pnpm-step 60-release-dry-run
      - name: Loop release-2 cases
        if: always()
        shell: bash
        run: |
          set +e
          cat >"$RUNNER_TEMP/loop-round.sh" <<'ROUND'
          #!/bin/sh
          # usage: sh loop-round.sh <job> <round dir>
          # One round of the loop step, run from the root of a checkout. It writes a copy
          # of scripts/prerequisites.sh whose self-test keeps the cases from the first
          # cargo-release case up to the cargo-deny cases (the cases that release-2 adds
          # or changes, with the unchanged download and platform cases beside them),
          # runs that self-test, and runs the self-tests of 63-prerequisites and, in the
          # macos job, 64-readme through the driver. A round passes only when every
          # result line shows the expected count: <cases> PASS lines and no FAIL line in
          # the copy's self-test with its PASS line last, and one PASS line of each
          # self-test with at least 1 failing fixture rejected.
          set -u
          job=$1
          dir=$2
          mkdir -p "$dir/copy/scripts"
          awk '
            /^  deny_target=\$\(prebuilt_target\) \|\| \{$/ { skip = 1 }
            /^  if \[ "\$failures" -gt 0 \]; then$/ { skip = 0 }
            !skip
          ' scripts/prerequisites.sh >"$dir/copy/scripts/prerequisites.sh"
          case "$job" in
            macos) want_cases=15; names='63-prerequisites 64-readme' ;;
            *) want_cases=14; names=63-prerequisites ;;
          esac
          status=0
          (cd "$dir/copy" && sh scripts/prerequisites.sh --self-test) >"$dir/copy.out" 2>&1 || status=$?
          passes=$(grep -c '^PASS ' "$dir/copy.out") || passes=0
          fails=$(grep -c '^FAIL ' "$dir/copy.out") || fails=0
          last=$(tail -n 1 "$dir/copy.out")
          ok=yes
          [ "$status" = 0 ] && [ "$passes" = "$want_cases" ] && [ "$fails" = 0 ] && [ "$last" = 'prerequisites: self-test PASS' ] || ok=no
          # shellcheck disable=SC2086
          sh scripts/ci/run-ci-d.sh "$job" --self-test $names >"$dir/driver.out" 2>&1 || ok=no
          for name in $names; do
            grep -q -E "^PASS self-test:$name \([1-9][0-9]* failing fixtures rejected\)$" "$dir/driver.out" || ok=no
          done
          printf 'round: copy cases passed %s of %s, failed %s, exit %s; self-tests %s; ok=%s\n' "$passes" "$want_cases" "$fails" "$status" "$names" "$ok"
          [ "$ok" = yes ]
          ROUND
          mkdir -p "$RUNNER_TEMP/loop"
          start=$(date +%s)
          seq 1 200 | xargs -P 4 -I{} sh "$RUNNER_TEMP/loop-round.sh" macos "$RUNNER_TEMP/loop/{}" >"$RUNNER_TEMP/loop.out" 2>&1
          end=$(date +%s)
          ok=$(grep -c 'ok=yes$' "$RUNNER_TEMP/loop.out")
          full=$(grep -c '^round: copy cases passed 15 of 15, failed 0, exit 0; ' "$RUNNER_TEMP/loop.out")
          echo "loop release-2 macos: rounds 200, rounds ok $ok, rounds with all copy cases $full, seconds $((end - start))"
          grep -v 'ok=yes$' "$RUNNER_TEMP/loop.out" | grep '^round:' | sort | uniq -c | head -n 5
          test "$ok" = 200 && test "$full" = 200
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default -c core.fileMode=true "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Digests of the three prebuilt cargo-release archives
        if: always()
        shell: bash
        run: |
          set +e
          fails=0
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            case $target in *-windows-*) ext=zip ;; *) ext=tar.gz ;; esac
            asset=cargo-release-v1.1.7-$target.$ext
            pin=$(sed -n "s/^cargo_release_sha256_$(echo $target | tr - _)=\(.*\)$/\1/p" scripts/prerequisites.sh)
            curl --proto '=https' --tlsv1.2 -sSfL --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/$asset" "https://github.com/crate-ci/cargo-release/releases/download/v1.1.7/$asset"
            got=$(sha256sum <"$RUNNER_TEMP/$asset" | cut -d ' ' -f 1)
            if [ -n "$pin" ] && [ "$got" = "$pin" ]; then match=true; else match=false; fails=$((fails + 1)); fi
            echo "digest $target: pinned $([ -n "$pin" ] && echo true || echo false), downloaded archive matches the pin: $match"
          done
          test "$fails" = 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 63-prerequisites 26-r7-pnpm-step
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 63-prerequisites 26-r7-pnpm-step
      - name: Loop release-2 cases
        if: always()
        shell: bash
        run: |
          set +e
          cat >"$RUNNER_TEMP/loop-round.sh" <<'ROUND'
          #!/bin/sh
          # usage: sh loop-round.sh <job> <round dir>
          # One round of the loop step, run from the root of a checkout. It writes a copy
          # of scripts/prerequisites.sh whose self-test keeps the cases from the first
          # cargo-release case up to the cargo-deny cases (the cases that release-2 adds
          # or changes, with the unchanged download and platform cases beside them),
          # runs that self-test, and runs the self-tests of 63-prerequisites and, in the
          # macos job, 64-readme through the driver. A round passes only when every
          # result line shows the expected count: <cases> PASS lines and no FAIL line in
          # the copy's self-test with its PASS line last, and one PASS line of each
          # self-test with at least 1 failing fixture rejected.
          set -u
          job=$1
          dir=$2
          mkdir -p "$dir/copy/scripts"
          awk '
            /^  deny_target=\$\(prebuilt_target\) \|\| \{$/ { skip = 1 }
            /^  if \[ "\$failures" -gt 0 \]; then$/ { skip = 0 }
            !skip
          ' scripts/prerequisites.sh >"$dir/copy/scripts/prerequisites.sh"
          case "$job" in
            macos) want_cases=15; names='63-prerequisites 64-readme' ;;
            *) want_cases=14; names=63-prerequisites ;;
          esac
          status=0
          (cd "$dir/copy" && sh scripts/prerequisites.sh --self-test) >"$dir/copy.out" 2>&1 || status=$?
          passes=$(grep -c '^PASS ' "$dir/copy.out") || passes=0
          fails=$(grep -c '^FAIL ' "$dir/copy.out") || fails=0
          last=$(tail -n 1 "$dir/copy.out")
          ok=yes
          [ "$status" = 0 ] && [ "$passes" = "$want_cases" ] && [ "$fails" = 0 ] && [ "$last" = 'prerequisites: self-test PASS' ] || ok=no
          # shellcheck disable=SC2086
          sh scripts/ci/run-ci-d.sh "$job" --self-test $names >"$dir/driver.out" 2>&1 || ok=no
          for name in $names; do
            grep -q -E "^PASS self-test:$name \([1-9][0-9]* failing fixtures rejected\)$" "$dir/driver.out" || ok=no
          done
          printf 'round: copy cases passed %s of %s, failed %s, exit %s; self-tests %s; ok=%s\n' "$passes" "$want_cases" "$fails" "$status" "$names" "$ok"
          [ "$ok" = yes ]
          ROUND
          mkdir -p "$RUNNER_TEMP/loop"
          start=$(date +%s)
          seq 1 200 | xargs -P 4 -I{} sh "$RUNNER_TEMP/loop-round.sh" windows "$RUNNER_TEMP/loop/{}" >"$RUNNER_TEMP/loop.out" 2>&1
          end=$(date +%s)
          ok=$(grep -c 'ok=yes$' "$RUNNER_TEMP/loop.out")
          full=$(grep -c '^round: copy cases passed 14 of 14, failed 0, exit 0; ' "$RUNNER_TEMP/loop.out")
          echo "loop release-2 windows: rounds 200, rounds ok $ok, rounds with all copy cases $full, seconds $((end - start))"
          grep -v 'ok=yes$' "$RUNNER_TEMP/loop.out" | grep '^round:' | sort | uniq -c | head -n 5
          test "$ok" = 200 && test "$full" = 200
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
