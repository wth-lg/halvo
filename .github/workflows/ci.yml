          ps_case h-w1-undo . "$ps1/undo.ps1"
          ps_case h-w7-kill-runner . "$ps1/kill-runner.ps1" -Out "$winout\\h-w7.txt"
          sleep 10
          printf 'h-w7 the surviving tree wrote: %s\n' "$(tr -d '\r' <"$out/h-w7.txt" 2>/dev/null || printf none)"
          case_run h-unnamed-binary . sh -c 'C:/Windows/System32/curl.exe -s -m 5 -o /dev/null http://192.0.2.1:443/; printf "curl exit=%s\n" "$?"'
          ps_case h-wmi . "$ps1/handoff.ps1" -Kind wmi -Url http://127.0.0.1:47203/b9-wmi
          received b9-wmi
          ps_case h-bits . "$ps1/handoff.ps1" -Kind bits -Url http://127.0.0.1:47203/b9-bits
          received b9-bits
          ps_case h-task . "$ps1/handoff.ps1" -Kind task -Url http://127.0.0.1:47203/b9-task
          sleep 5
