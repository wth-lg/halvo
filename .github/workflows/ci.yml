name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: Loop step of the formal step of store-3
        if: always()
        shell: bash
        run: |
          export RUST_TEST_THREADS=1
          exe=$(cargo test --locked -p halvo-capture --lib --no-run --message-format=json 2>/dev/null | python3 -c "import json,sys; print([j['executable'] for j in map(json.loads, sys.stdin) if j.get('reason')=='compiler-artifact' and j.get('executable') and j['target']['kind']==['lib']][-1])")
          echo "loop executable: $exe"
          cat > "$RUNNER_TEMP/names.txt" <<'NAMES'
          store::formal_tests::a_shredded_segment_is_unrecoverable_with_every_remaining_key
          store::formal_tests::no_failed_or_refused_move_leaves_a_half_store
          store::formal_tests::no_failed_or_refused_move_leaves_a_half_store_in_a_fixed_order
          store::formal_tests::at_most_one_creator_gets_an_empty_store_directory
          store::formal_tests::a_process_that_goes_around_the_directory_lock_is_refused_at_the_database
          store::formal_tests::the_look_for_open_files_without_a_name_sees_a_removed_file unix-alone
          store::formal_tests::create_a_store_for_parent
          store::formal_tests::go_around_the_directory_lock_for_parent
          store::formal_tests::at_most_one_process_holds_the_store_at_a_time
          store::formal_tests::contend_for_store_for_parent
          NAMES
          cat > "$RUNNER_TEMP/loop_step.py" <<'LOOP'
          """Runs each named test of the built test executable 200 times, or 20 times when one run takes more than 2 s. A run
          counts as a pass only when its own result line shows one passed test and its exit code is 0; a name that runs no
          test fails the step, unless its line says that it exists on unix alone and this system is Windows.
          usage: python3 loop_step.py <test executable> <names file>"""
          import collections
          import subprocess
          import sys
          import time

          exe, names = sys.argv[1], sys.argv[2]
          bad = 0
          for line in [l.split() for l in open(names) if l.strip()]:
              name, unix_alone = line[0], line[1:] == ["unix-alone"]

              def once():
                  started = time.monotonic()
                  done = subprocess.run([exe, "--exact", name, "--test-threads=1"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  out = done.stdout.decode("utf-8", "replace")
                  passed = done.returncode == 0 and "test result: ok. 1 passed; 0 failed" in out
                  return passed, "running 0 tests" in out, time.monotonic() - started, out

              passed, none, first, out = once()
              if none:
                  if unix_alone and sys.platform == "win32":
                      print(f"LOOP {name} not-compiled-here", flush=True)
                  else:
                      bad += 1
                      print(f"LOOP {name} FAILED: the name runs no test", flush=True)
                  continue
              runs = 20 if first > 2.0 else 200
              passes = 0
              said = collections.Counter()
              kept = ""
              for i in range(runs):
                  if i:
                      passed, _, _, out = once()
                  passes += 1 if passed else 0
                  said.update(l[l.index("check 2 "):] for l in out.splitlines() if "check 2 " in l)
                  if not passed and not kept:
                      kept = out
              print(f"LOOP {name} runs={runs} one_passed_by_its_result_line={passes} first_run_s={first:.2f}", flush=True)
              for text, count in sorted(said.items()):
                  print(f"  x{count} {text}", flush=True)
              if passes != runs:
                  bad += 1
                  print("  first failing run:\n" + kept[-4000:], flush=True)
          print(f"LOOP names that failed: {bad}", flush=True)
          sys.exit(1 if bad else 0)
          LOOP
          python3 "$RUNNER_TEMP/loop_step.py" "$exe" "$RUNNER_TEMP/names.txt"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
