name: ci

on:
  push:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: tools/r4-trials/app -> target
          save-if: false
      - name: Trial app build and node tests
        timeout-minutes: 30
        shell: bash
        run: |
          set +e +o pipefail
          app=tools/r4-trials/app
          started=$(date +%s)
          cargo build --release --locked --manifest-path "$app/Cargo.toml"
          echo "trial build exit=$? seconds=$(($(date +%s) - started))"
          started=$(date +%s)
          node --test 'tools/r4-trials/app/tests/*.test.mjs' 'tools/r4-trials/window/tests/*.test.mjs' >"$RUNNER_TEMP/node-test.out" 2>&1
          code=$?
          tr -d '\r' <"$RUNNER_TEMP/node-test.out" | grep -E '^[^ ]+ (tests|pass|fail|skipped) [0-9]+$|^[^ ]+ .*\([0-9.]+ms\)( # SKIP.*)?$' | sed 's/^/trial node_test /'
          echo "trial node_test exit=$code seconds=$(($(date +%s) - started))"
          tr -d '\r' <"$RUNNER_TEMP/node-test.out" | sed -n '/failing tests:/,$p' | head -n 80 | sed 's/^/trial node_fail /'
          exit 0
      - name: Cells
        if: ${{ !cancelled() }}
        timeout-minutes: 25
        shell: bash
        run: |
          set +e +o pipefail
          started=$(date +%s)
          sh tools/r4-trials/window/run.sh --arm b --runs 1
          echo "trial window arm=b exit=$? seconds=$(($(date +%s) - started))"
          for arm in a2 b; do
            started=$(date +%s)
            sh tools/r4-trials/window/run.sh --sync get --arm "$arm"
            echo "trial sync way=get arm=$arm exit=$? seconds=$(($(date +%s) - started))"
          done
          exit 0
