name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: U0.3 profile trial cells, tests and loops (scratch branch, never merged)
        if: always()
        timeout-minutes: 40
        shell: bash
        run: |
          #!/bin/bash
          # The U0.3 step of the scratch workflow (never merged): the unit's cells, its tests once, each added
          # test 200 times by exact name, and the hosted harness's self-test. Prints counts and closed words.
          set +e
          code=0
          case "$(uname -s)" in
            Darwin)
              machine=hosted-mac
              browsers="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome|chrome
          /Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge|edge"
              exe=
              ;;
            *)
              machine=hosted-win
              browsers="C:/Program Files/Google/Chrome/Application/chrome.exe|chrome
          C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe|edge"
              exe=.exe
              ;;
          esac
          echo "u03 machine=$machine image=${ImageOS:-} image_version=${ImageVersion:-} at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          chrome=
          while IFS='|' read -r b k; do
            [ -f "$b" ] || {
              echo "browser missing $k"
              code=1
              continue
            }
            [ "$k" = chrome ] && chrome=$b
            if [ "$machine" = hosted-mac ]; then
              echo "browser $k version=$("$b" --version | tr ' ' '_')"
            else
              echo "browser $k version=$(powershell -NoProfile -Command "(Get-Item '$b').VersionInfo.ProductVersion" | tr -d '\r')"
            fi
          done <<EOF
          $browsers
          EOF

          cell() {
            s0=$(date +%s)
            sh tools/r3-trials/profile/run.sh "$@"
            e=$?
            echo "u03_call exit=$e seconds=$(($(date +%s) - s0)) args=$(printf '%s' "$*" | tr ' ' '_' | sed 's/--browser_[^-]*//')"
            [ "$e" -eq 0 ] || code=1
          }

          while IFS='|' read -r b k; do
            [ -f "$b" ] || continue
            cell --item 2 --browser "$b" --port 18590
          done <<EOF
          $browsers
          EOF
          if [ -n "$chrome" ]; then
            cell --item 3 --flags first --browser "$chrome" --port 18090
            cell --item 3 --browser "$chrome" --port 18090
            [ "$machine" = hosted-mac ] && cell --item 3 --sandbox-off --browser "$chrome" --port 18090
          fi
          if [ "$machine" = hosted-win ]; then
            while IFS='|' read -r b k; do
              [ -f "$b" ] || continue
              cell --item 4 --browser "$b" --port 18591
            done <<EOF
          $browsers
          EOF
          fi

          for crate in web profile; do
            m=tools/r3-trials/$crate/Cargo.toml
            cargo clippy --locked --quiet --manifest-path "$m" --all-targets -- -D warnings
            e=$?
            echo "u03_clippy crate=$crate exit=$e"
            [ "$e" -eq 0 ] || code=1
            cargo test --locked --manifest-path "$m" --no-fail-fast >"$RUNNER_TEMP/u03-test-$crate.log" 2>&1
            e=$?
            grep -E '^test result:|^     Running ' "$RUNNER_TEMP/u03-test-$crate.log"
            grep -E '^test .* FAILED$' "$RUNNER_TEMP/u03-test-$crate.log"
            echo "u03_tests crate=$crate exit=$e"
            [ "$e" -eq 0 ] || code=1
          done

          bin_of() {
            cargo test --locked --manifest-path "tools/r3-trials/$1/Cargo.toml" "$2" --no-run --message-format=json 2>/dev/null |
              grep '"test":true' | grep "\"name\":\"$3\"" |
              sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | sed 's|\\\\|/|g' | head -1
          }

          loop() {
            bin=$1
            name=$2
            n=0
            ok=0
            zero=0
            while [ "$n" -lt 200 ]; do
              out=$("$bin" --exact "$name" --test-threads=1 2>&1)
              case "$out" in
                *"test result: ok. 1 passed; 0 failed;"*) ok=$((ok + 1)) ;;
                *"test result: ok. 0 passed;"*) zero=$((zero + 1)) ;;
              esac
              n=$((n + 1))
            done
            echo "u03_loop machine=$machine test=$name runs=$n passed=$ok ran_no_test=$zero"
            [ "$ok" -eq 200 ] || code=1
          }

          web_lib=$(bin_of web --lib r3_web)
          web_guard=$(bin_of web --test=fixture_guard fixture_guard)
          profile_lib=$(bin_of profile --lib r3_profile)
          echo "u03_bins web_lib=$([ -x "$web_lib" ] && echo yes || echo no) web_guard=$([ -x "$web_guard" ] && echo yes || echo no) profile_lib=$([ -x "$profile_lib" ] && echo yes || echo no)"
          loop "$web_lib" tests::a_kill_line_names_its_browser
          for t in a_trial_process_that_holds_a_server \
            the_server_is_gone_within_its_bound_when_its_trial_process_is_killed \
            a_server_that_its_trial_drops_without_a_stop_is_gone_when_the_drop_returns \
            a_server_of_a_trial_that_panics_is_gone_when_the_panic_has_unwound \
            a_server_that_ignores_its_input_is_gone_when_the_drop_returns; do
            loop "$web_guard" "$t"
          done
          for t in the_product_start_is_on_the_pipe_with_the_relay_and_every_flag_of_the_set \
            the_direct_start_of_item_3_carries_the_set_and_no_route \
            the_first_start_is_the_first_set_with_the_resolver_rule_alone \
            the_flag_lines_hold_the_sets_and_none_that_the_executor_sets \
            the_pref_lines_name_each_setting_of_the_start \
            the_egress_line_comes_from_the_checks_last_line \
            the_egress_port_is_the_agent_entry_of_the_list \
            the_list_is_checked_out_with_lf_line_ends \
            the_refusal_cause_is_read_without_its_detail \
            the_result_files_last_block_holds_the_set_as_the_program_prints_it; do
            loop "$profile_lib" "product::tests::$t"
          done

          sh tools/r3-trials/web/hosted/harness.sh --self-test
          e=$?
          echo "u03_harness_self_test exit=$e"
          [ "$e" -eq 0 ] || code=1

          if [ "$machine" = hosted-mac ]; then
            left=$(pgrep -f -- 'r3-profile\.|/r3-web\.|variants/server\.mjs' | wc -l | tr -d ' ')
          else
            left=$(powershell -NoProfile -Command "@(Get-CimInstance Win32_Process | Where-Object { \$_.ProcessId -ne \$PID -and (\$_.CommandLine -like '*r3-profile.*' -or \$_.CommandLine -like '*variants*server.mjs*') }).Count" | tr -d '\r')
          fi
          echo "u03_scan machine=$machine processes_naming_a_trial_scratch_or_fixture=$left exe=$exe"
          exit "$code"
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 10-r3-layout 16-shell-lint 19-home-paths
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-r3-layout 16-shell-lint 19-home-paths
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: U0.3 profile trial cells, tests and loops (scratch branch, never merged)
        if: always()
        timeout-minutes: 80
        shell: bash
        run: |
          #!/bin/bash
          # The U0.3 step of the scratch workflow (never merged): the unit's cells, its tests once, each added
          # test 200 times by exact name, and the hosted harness's self-test. Prints counts and closed words.
          set +e
          code=0
          case "$(uname -s)" in
            Darwin)
              machine=hosted-mac
              browsers="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome|chrome
          /Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge|edge"
              exe=
              ;;
            *)
              machine=hosted-win
              browsers="C:/Program Files/Google/Chrome/Application/chrome.exe|chrome
          C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe|edge"
              exe=.exe
              ;;
          esac
          echo "u03 machine=$machine image=${ImageOS:-} image_version=${ImageVersion:-} at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          chrome=
          while IFS='|' read -r b k; do
            [ -f "$b" ] || {
              echo "browser missing $k"
              code=1
              continue
            }
            [ "$k" = chrome ] && chrome=$b
            if [ "$machine" = hosted-mac ]; then
              echo "browser $k version=$("$b" --version | tr ' ' '_')"
            else
              echo "browser $k version=$(powershell -NoProfile -Command "(Get-Item '$b').VersionInfo.ProductVersion" | tr -d '\r')"
            fi
          done <<EOF
          $browsers
          EOF

          cell() {
            s0=$(date +%s)
            sh tools/r3-trials/profile/run.sh "$@"
            e=$?
            echo "u03_call exit=$e seconds=$(($(date +%s) - s0)) args=$(printf '%s' "$*" | tr ' ' '_' | sed 's/--browser_[^-]*//')"
            [ "$e" -eq 0 ] || code=1
          }

          while IFS='|' read -r b k; do
            [ -f "$b" ] || continue
            cell --item 2 --browser "$b" --port 18590
          done <<EOF
          $browsers
          EOF
          if [ -n "$chrome" ]; then
            cell --item 3 --flags first --browser "$chrome" --port 18090
            cell --item 3 --browser "$chrome" --port 18090
            [ "$machine" = hosted-mac ] && cell --item 3 --sandbox-off --browser "$chrome" --port 18090
          fi
          if [ "$machine" = hosted-win ]; then
            while IFS='|' read -r b k; do
              [ -f "$b" ] || continue
              cell --item 4 --browser "$b" --port 18591
            done <<EOF
          $browsers
          EOF
          fi

          for crate in web profile; do
            m=tools/r3-trials/$crate/Cargo.toml
            cargo clippy --locked --quiet --manifest-path "$m" --all-targets -- -D warnings
            e=$?
            echo "u03_clippy crate=$crate exit=$e"
            [ "$e" -eq 0 ] || code=1
            cargo test --locked --manifest-path "$m" --no-fail-fast >"$RUNNER_TEMP/u03-test-$crate.log" 2>&1
            e=$?
            grep -E '^test result:|^     Running ' "$RUNNER_TEMP/u03-test-$crate.log"
            grep -E '^test .* FAILED$' "$RUNNER_TEMP/u03-test-$crate.log"
            echo "u03_tests crate=$crate exit=$e"
            [ "$e" -eq 0 ] || code=1
          done

