name: ci
# scratch: land-43's rehearsal tree, two macos jobs, each runs every row of one rows file to its end by name; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: "Every row of crates/halvo-capture/src/store/mutants.rows to its end by name (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ROWS_FILE: crates/halvo-capture/src/store/mutants.rows
          ROWS_JOB: store
          ROWS_PACKAGE: halvo-capture
        run: |
          set +e -u
          runner=${HALVO_STEP_RUNNER:-scripts/r1-gate/mutation-test.sh}
          file=$ROWS_FILE
          out="${RUNNER_TEMP:-/tmp}/rows-$ROWS_JOB.out"
          names=$(awk -F '\t' 'NF >= 5 && $1 !~ /^#/ && $1 != "" {print $1}' "$file")
          count=$(printf '%s\n' "$names" | grep -c .)
          printf 'ROWS file %s: %s names\n' "$file" "$count"
          printf '%s\n' "$names" | sed 's/^/ROWS name /'
          set --
          for n in $names; do set -- "$@" --only "$n"; done
          t0=$(date +%s)
          sh "$runner" "$@" >"$out" 2>&1
          code=$?
          printf 'ROWS runner exit %s, seconds %s\n' "$code" "$(($(date +%s) - t0))"
          grep -E '^(PASS|FAIL|OPEN|NOT-RUN|RETIRED|PENDING|STOPPED|TRANSITIONAL) (unmutated|mutation)' "$out" | cut -c1-400 | sed 's/^/ROWS /'
          grep -E '^seconds mutation:|^mutation rows:' "$out" | sed 's/^/ROWS /'
          caught=0; uncaught=0; other=0; missing=0; : >"${RUNNER_TEMP:-/tmp}/not-caught-$ROWS_JOB.txt"
          for n in $names; do
            line=$(grep -E "^[A-Z-]+ mutation:$n \(" "$out" | tail -n 1)
            case $line in
              "PASS mutation:$n "*) caught=$((caught + 1)) ;;
              "FAIL mutation:$n (test "*": passed)")
                uncaught=$((uncaught + 1))
                t=$(printf '%s\n' "$line" | sed -n 's/^FAIL mutation:[^ ]* (test \(.*\): passed)$/\1/p')
                printf '%s %s\n' "$n" "$t" >>"${RUNNER_TEMP:-/tmp}/not-caught-$ROWS_JOB.txt" ;;
              '') other=$((other + 1)); missing=$((missing + 1)); printf 'ROWS no line for %s\n' "$n" ;;
              *) other=$((other + 1)) ;;
            esac
          done
          printf 'rows: %s caught, %s not caught, %s other\n' "$caught" "$uncaught" "$other"
          printf 'not caught:%s\n' "$(awk '{printf " %s", $1}' "${RUNNER_TEMP:-/tmp}/not-caught-$ROWS_JOB.txt")"
          [ "$missing" -eq 0 ] && grep -q '^mutation rows:' "$out"
      - name: "The named test of each row not caught, on the unmutated tree (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ROWS_FILE: crates/halvo-capture/src/store/mutants.rows
          ROWS_JOB: store
          ROWS_PACKAGE: halvo-capture
        run: |
          set +e -u
          list="${RUNNER_TEMP:-/tmp}/not-caught-$ROWS_JOB.txt"
          [ -s "$list" ] || { printf 'UNMUTATED no row of %s is not caught\n' "$ROWS_FILE"; exit 0; }
          cargo=${HALVO_STEP_CARGO:-cargo}
          status=0
          while read -r row test; do
            out="${RUNNER_TEMP:-/tmp}/unmutated-$row.out"
            "$cargo" test -q --locked -p "$ROWS_PACKAGE" --lib -- --exact "$test" >"$out" 2>&1
            code=$?
            result=$(grep -E '^test result:' "$out" | tail -n 1)
            printf 'UNMUTATED %s: test %s on the unmutated tree, cargo exit %s; %s\n' "$row" "$test" "$code" "${result:-no result line}"
            grep -E '^running [0-9]+ tests?$' "$out" | tail -n 1 | sed 's/^/UNMUTATED   /'
            [ -n "$result" ] || status=1
          done <"$list"
          exit "$status"
