name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 12-test 50-windows-functional
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
  loop-chrome:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: win-3 W3-13, browser::cold_and_warm_orders_in_chrome 200 times, each run a process of its own as the check runs it (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/loop.log"
          cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/fun.json" 2>"$log"
          echo "LOOP build fun exit=$?"
          cargo test --locked -p halvo-capture --lib --no-run --message-format json >"$RUNNER_TEMP/lib.json" 2>"$log"
          echo "LOOP build lib exit=$?"
          fun=$(tr -d '\r' <"$RUNNER_TEMP/fun.json" | sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          lib=$(tr -d '\r' <"$RUNNER_TEMP/lib.json" | grep '"kind":\["lib"\]' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          [ -n "$fun" ] && [ -n "$lib" ] || echo "LOOP no executable"
          t=browser::cold_and_warm_orders_in_chrome
          pick='^TF browser-cold-[a-z]+ browser=[a-z]+ order=(cold|warm-control|warm) '
          passed=0
          for run in $(seq 1 200); do
            timeout 600 "$fun" --ignored --exact --nocapture "$t" </dev/null >"$log" 2>&1
            code=$?
            if [ "$code" -eq 0 ] && tr -d '\r' <"$log" | grep -q '^test result: ok. 1 passed; 0 failed'; then
              passed=$((passed + 1))
              echo "LOOP test=$t run=$run exit=$code passed=1"
              tr -d '\r' <"$log" | grep -E "$pick" | cut -c1-1600
            else
              echo "LOOP test=$t run=$run exit=$code passed=0 (every line of the run follows)"
              tr -d '\r' <"$log" | cut -c1-1600
              echo "LOOP test=$t run=$run end of the run's lines"
            fi
          done
          echo "LOOP test=$t runs=200 passed=$passed"
          exit 0
  loop-edge:
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: win-3 W3-13, browser::cold_and_warm_orders_in_edge 200 times, each run a process of its own as the check runs it (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/loop.log"
          cargo test --locked -p halvo-capture --test windows_functional --no-run --message-format json >"$RUNNER_TEMP/fun.json" 2>"$log"
          echo "LOOP build fun exit=$?"
          cargo test --locked -p halvo-capture --lib --no-run --message-format json >"$RUNNER_TEMP/lib.json" 2>"$log"
          echo "LOOP build lib exit=$?"
          fun=$(tr -d '\r' <"$RUNNER_TEMP/fun.json" | sed -n 's/.*"name":"windows_functional".*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          lib=$(tr -d '\r' <"$RUNNER_TEMP/lib.json" | grep '"kind":\["lib"\]' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          [ -n "$fun" ] && [ -n "$lib" ] || echo "LOOP no executable"
          t=browser::cold_and_warm_orders_in_edge
          pick='^TF browser-cold-[a-z]+ browser=[a-z]+ order=(cold|warm-control|warm) '
          passed=0
          for run in $(seq 1 200); do
            timeout 600 "$fun" --ignored --exact --nocapture "$t" </dev/null >"$log" 2>&1
            code=$?
            if [ "$code" -eq 0 ] && tr -d '\r' <"$log" | grep -q '^test result: ok. 1 passed; 0 failed'; then
              passed=$((passed + 1))
              echo "LOOP test=$t run=$run exit=$code passed=1"
              tr -d '\r' <"$log" | grep -E "$pick" | cut -c1-1600
            else
              echo "LOOP test=$t run=$run exit=$code passed=0 (every line of the run follows)"
              tr -d '\r' <"$log" | cut -c1-1600
              echo "LOOP test=$t run=$run end of the run's lines"
            fi
          done
          echo "LOOP test=$t runs=200 passed=$passed"
          exit 0
  undo:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: win-3 W3-13, the cold and warm orders under V-NOPW and under the dropped kept reading (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          export CARGO_INCREMENTAL=1
          log="$RUNNER_TEMP/undo.log"
          for change in V-NOPW DROP-KEPT; do
            git checkout -- crates/halvo-capture/src/windows/secure_input.rs
            python - "$change" <<'PY'
          import sys
          name = sys.argv[1]
          g = "crates/halvo-capture/src/windows/secure_input.rs"
          rows = {
            "V-NOPW": [
              ("        | FocusRead::NoAnswer { protected: true } => FieldState::Password,", "        | FocusRead::NoAnswer { protected: true } => FieldState::Clear,"),
              ("        if focus.0.is_null() {\n            return false;\n        }\n        let mut class = [0u16; 16];", "        if true || focus.0.is_null() {\n            return false;\n        }\n        let mut class = [0u16; 16];"),
            ],
            "DROP-KEPT": [
              ("        Some(_) => (FieldState::Password, Kept::Leave),", "        Some(_) => (read, Kept::Leave),"),
            ],
          }
          text = open(g, encoding="utf-8").read().replace("\r\n", "\n")
          for old, new in rows[name]:
              print("MUTANT", name, "matches", text.count(old))
              assert text.count(old) == 1
              text = text.replace(old, new)
          open(g, "w", encoding="utf-8", newline="\n").write(text)
          PY
            for t in browser::cold_and_warm_orders_in_chrome browser::cold_and_warm_orders_in_edge; do
              for run in 1 2; do
                timeout 900 cargo test --locked -p halvo-capture --test windows_functional -- --ignored --exact "$t" --nocapture --test-threads=1 >"$log" 2>&1 </dev/null
                echo "UNDO $change test=$t run=$run exit=$?"
                tr -d '\r' <"$log" | grep -E 'order=(cold|warm-control|warm) |panicked at|^cold|^warm|^  left|^ right|^test result' | cut -c1-1600
              done
            done
          done
          echo "UNDO end"
          exit 0
  plain:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: win-3 W3-13 and W3-14, the new plain tests 200 times each by their exact names (scratch, never merged)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail
          set -u
          log="$RUNNER_TEMP/plain.log"
          cargo test --locked -p halvo-capture --lib --no-run --message-format json >"$RUNNER_TEMP/lib.json" 2>"$log"
          echo "PLAIN build lib exit=$?"
          cargo test --locked -p halvo-capture --test cold_evidence --no-run --message-format json >"$RUNNER_TEMP/ev.json" 2>"$log"
          echo "PLAIN build cold_evidence exit=$?"
          lib=$(tr -d '\r' <"$RUNNER_TEMP/lib.json" | grep '"kind":\["lib"\]' | sed -n 's/.*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          ev=$(tr -d '\r' <"$RUNNER_TEMP/ev.json" | sed -n 's/.*"name":"cold_evidence".*"executable":"\([^"]*\)".*/\1/p' | head -n 1)
          "$ev" --list 2>/dev/null | tr -d '\r' | sed -n 's/: test$//p' >"$RUNNER_TEMP/ev-names"
          echo "PLAIN cold_evidence tests=$(grep -c '' "$RUNNER_TEMP/ev-names")"
          {
            echo "lib secure_input::windows::tests::a_read_that_shows_a_move_after_the_keys_time_and_before_the_pump_took_it_withholds_the_key"
            echo "lib secure_input::windows::tests::a_key_at_a_gate_that_reads_unknown_is_withheld_at_once_and_asks_for_no_read"
            sed 's/^/ev /' "$RUNNER_TEMP/ev-names"
          } >"$RUNNER_TEMP/rows"
          while read -r kind t; do
            [ -n "$kind" ] || continue
            exe=$lib
            [ "$kind" = ev ] && exe=$ev
            passed=0
            for run in $(seq 1 200); do
              "$exe" --exact "$t" --test-threads=1 >"$log" 2>&1 </dev/null
              if [ "$?" -eq 0 ] && tr -d '\r' <"$log" | grep -q '^test result: ok. 1 passed; 0 failed'; then
                passed=$((passed + 1))
              else
                echo "PLAIN test=$t run=$run failed"
                tr -d '\r' <"$log" | tail -n 20
              fi
            done
            echo "PLAIN test=$t runs=200 passed=$passed"
          done <"$RUNNER_TEMP/rows"
          echo "PLAIN end"
          exit 0
