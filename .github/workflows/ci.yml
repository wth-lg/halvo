name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: "Loop (win-detector-clock round 3, T6, T0 and the three cases 200 times, T1 to T5 20 times, by exact name)"
        if: ${{ !cancelled() }}
        shell: python
        env:
          WDC_PART: loop
        run: |
          """win-detector-clock, round 3 (builder-134, Addition 2): D5, the made-up case of receive_met.

          On this Mac:
              python3 -I wdc3.py check <clone> <out dir>     type-checks each copy of this round for the Windows target and restores
                                                             the file with git checkout (no test runs here)
              python3 -I wdc3.py rehearse <job log>          judges the WDC lines of a saved job log of round 2 with this round's
                                                             verdict, which reads the lines that the step printed: the test's
                                                             result line and the place of its panic
          On the hosted windows job: python wdc3.py, with WDC_PART=loop, failfirst or changes, at the repo root.
          Each part prints, for each outcome, the test's result line and the place of its panic with the line after it, judges
          by the lines that it printed itself, prints one line `WDC FAIL <what>` for each outcome that it does not expect, and
          ends with `WDC verdict: lines that begin with WDC FAIL: <n>; allowed: none; step PASS|FAIL`."""
          import json, os, re, subprocess, sys, time

          PATH = "crates/halvo-capture/src/windows/secure_input.rs"
          MOD = "secure_input::windows::detector::tests::"
          TESTS = [
              ("T0", "a_desktop_hook_that_cannot_be_set_refuses_the_attach_and_removes_the_focus_handler"),
              ("T1", "after_attach_the_first_mark_is_the_start_and_attach_returns_after_the_detectors_own_read"),
              ("T2", "detach_ends_the_detectors_thread_and_a_new_attach_starts_one"),
              ("T3", "detach_answers_the_first_of_its_removal_calls_that_failed"),
              ("T4", "an_attach_after_a_timed_out_detach_is_refused_while_the_old_detector_runs"),
              ("T5", "detach_answers_timeout_when_the_detector_does_not_end_in_time"),
              ("T6", "an_attach_whose_first_read_does_not_answer_times_out_and_stops_that_detector"),
              ("C2", "until_asks_its_fact_again_until_it_holds_and_then_no_more"),
              ("C4", "a_hold_is_let_go_when_its_test_unwinds"),
              ("C5", "receive_met_keeps_its_caller_while_the_receive_is_held"),
          ]
          NAMES = dict(TESTS)
          LOOP = {"T0": 200, "T1": 20, "T2": 20, "T3": 20, "T4": 20, "T5": 20, "T6": 200, "C2": 200, "C4": 200, "C5": 200}
          TEST_LIMIT_S = 60

          R04 = ("            while HOLD_RECEIVE.load(std::sync::atomic::Ordering::SeqCst) {",
                 "            if HOLD_RECEIVE.load(std::sync::atomic::Ordering::SeqCst) {")
          S02 = ("            until(|| RECEIVE_TURNS.load(Ordering::SeqCst) >= 2);",
                 "            until(|| RECEIVE_TURNS.load(Ordering::SeqCst) >= 1);")
          # id, the rule(s), [(old, new), ...] each exactly once in the head's file, the outcomes that this round expects
          CHANGES = [
              ("r04", "receive_met holds its caller for one turn only (round 2's r04)", [R04], {"C5": ("HANG", "RED")}),
              ("s01", "receive_met does not count the turns of its hold",
               [("                RECEIVE_TURNS.fetch_add(1, std::sync::atomic::Ordering::SeqCst);\n", "")], {"C5": ("HANG", "RED")}),
              ("s02", "the case waits for one turn, not two", [S02], {}),
              ("s02+r04", "the case waits for one turn, and receive_met holds for one turn only (two rules)", [S02, R04], {}),
              ("s03", "the case reads its caller as ended under the hold",
               [("                !ended_under_the_hold,\n", "                ended_under_the_hold,\n")], {"C5": ("RED",)}),
              ("s04", "the case expects two arrivals",
               [("            caller.join().expect(\"the caller of receive_met ends\");\n            assert_eq!(RECEIVES_MET.load(Ordering::SeqCst), 1);",
                 "            caller.join().expect(\"the caller of receive_met ends\");\n            assert_eq!(RECEIVES_MET.load(Ordering::SeqCst), 2);")], {"C5": ("RED",)}),
              ("s05", "the case never lets the hold go",
               [("            drop(receive);\n            caller.join()", "            caller.join()")], {"C5": ("HANG", "RED")}),
              ("s06", "the case does not reset the count of turns",
               [("            RECEIVE_TURNS.store(0, Ordering::SeqCst);\n            let receive = Hold::on(&HOLD_RECEIVE);\n            let caller",
                 "            let receive = Hold::on(&HOLD_RECEIVE);\n            let caller")], {}),
          ]
          PRINTED = []


          def out(line):
              PRINTED.append(line)
              sys.stdout.write(line + "\n")
              sys.stdout.flush()


          def apply(text, old, new, what):
              n = text.count(old)
              if n != 1:
                  raise SystemExit("WDC %s: its old text is found %d times, not once" % (what, n))
              return text.replace(old, new, 1)


          def read(path):
              with open(path, "rb") as f:
                  data = f.read()
              return data.decode("utf-8").replace("\r\n", "\n"), b"\r\n" in data


          def write(path, text, crlf):
              data = text.replace("\r\n", "\n")
              if crlf:
                  data = data.replace("\n", "\r\n")
              with open(path, "wb") as f:
                  f.write(data.encode("utf-8"))


          def changed(text, cid):
              for c in CHANGES:
                  if c[0] == cid:
                      for i, (old, new) in enumerate(c[2]):
                          text = apply(text, old, new, "%s.%d" % (cid, i))
                      return text
              raise SystemExit("WDC no change " + cid)


          def restore(root):
              subprocess.run(["git", "checkout", "--", PATH], cwd=root, check=True)


          def build(root):
              r = subprocess.run(["cargo", "test", "--locked", "-p", "halvo-capture", "--lib", "--no-run", "--message-format", "json"],
                                 cwd=root, capture_output=True)
              exe = None
              for line in r.stdout.decode("utf-8", "replace").splitlines():
                  if not line.startswith("{"):
                      continue
                  m = json.loads(line)
                  if m.get("reason") == "compiler-artifact" and m.get("target", {}).get("name") == "halvo_capture" \
                          and "lib" in m.get("target", {}).get("kind", []) and m.get("profile", {}).get("test") and m.get("executable"):
                      exe = m["executable"]
              err = r.stderr.decode("utf-8", "replace")
              first = [l for l in err.splitlines() if l.startswith("error")]
              return r.returncode, exe, first[:3], "Compiling halvo-capture" in err


          def run_test(exe, name):
              """The verdict word and the lines to print: the result line, each panic's place with the line after it."""
              start = time.time()
              try:
                  r = subprocess.run([exe, "--exact", MOD + name, "--test-threads=1"], capture_output=True, timeout=TEST_LIMIT_S,
                                     stdin=subprocess.DEVNULL)
              except subprocess.TimeoutExpired:
                  return "HANG", ["result: none, killed after %d s" % TEST_LIMIT_S], time.time() - start
              lines = (r.stdout + r.stderr).decode("utf-8", "replace").replace("\r\n", "\n").split("\n")
              keep = []
              for i, l in enumerate(lines):
                  if "panicked at" in l:
                      keep.append("place: " + l)
                      if i + 1 < len(lines):
                          keep.append("after: " + lines[i + 1])
                  elif l.startswith("  left:") or l.startswith(" right:"):
                      keep.append("value: " + l)
              results = [l for l in lines if l.startswith("test result:")]
              keep.append("result: " + (results[-1] if results else "none"))
              verdict = "ok" if results and results[-1].startswith("test result: ok. 1 passed; 0 failed") else "RED"
              return verdict, keep[:10], time.time() - start


          def some(exe, label, ids):
              for tid in ids:
                  v, keep, secs = run_test(exe, NAMES[tid])
                  out("WDC %s %s %s %s %.2f s" % (label, tid, NAMES[tid], v, secs))
                  for l in keep:
                      out("WDC   | " + l)


          def outcome(lines, label, tid):
              """Read back, from printed lines alone, the verdict word of one outcome and the lines printed under it."""
              head = re.compile(r"^WDC %s %s \S+ (ok|RED|HANG) " % (re.escape(label), re.escape(tid)))
              for i, l in enumerate(lines):
                  m = head.match(l)
                  if m:
                      under = []
                      for k in lines[i + 1:]:
                          if not k.startswith("WDC   | "):
                              break
                          under.append(k[len("WDC   | "):])
                      return m.group(1), under
              return None, []


          def place(under):
              """The place of the last panic printed under an outcome: the one that ended the test."""
              last = None
              for l in under:
                  m = re.search(r"panicked at \S*secure_input\.rs:(\d+):(\d+)", l)
                  if m:
                      last = "%s:%s" % (m.group(1), m.group(2))
              return last


          def verdict_line():
              fails = [l for l in PRINTED if l.startswith("WDC FAIL ")]
              out("WDC verdict: lines that begin with WDC FAIL: %d; allowed: none; step %s" % (len(fails), "PASS" if not fails else "FAIL"))
              return 0 if not fails else 1


          def hosted(part):
              root = os.getcwd()
              file = os.path.join(root, PATH)
              head, crlf = read(file)
              try:
                  if part == "loop":
                      code, exe, first, _ = build(root)
                      if code != 0 or not exe:
                          out("WDC FAIL the head's test build: exit %d %s" % (code, first))
                          return verdict_line()
                      for tid, name in TESTS:
                          runs = LOOP[tid]
                          passed, start, secs = 0, time.time(), []
                          for i in range(runs):
                              v, keep, s = run_test(exe, name)
                              secs.append(s)
                              if v == "ok":
                                  passed += 1
                              else:
                                  out("WDC loop round %d of %s: %s" % (i + 1, name, v))
                                  for l in keep:
                                      out("WDC   | " + l)
                          secs.sort()
                          out("loop win-detector-clock: %s: passed %d of %d in %d s (median %.2f s, longest %.2f s a run)"
                              % (name, passed, runs, round(time.time() - start), secs[len(secs) // 2], secs[-1]))
                      for tid, name in TESTS:
                          read_back = [l for l in PRINTED if l.startswith("loop win-detector-clock: %s: " % name)]
                          want = "passed %d of %d " % (LOOP[tid], LOOP[tid])
                          if len(read_back) != 1 or want not in read_back[0]:
                              out("WDC FAIL loop %s: %s" % (tid, read_back[0] if read_back else "no line"))
                      return verdict_line()
                  if part == "failfirst":
                      for label, text in [("head", head), ("r04", changed(head, "r04"))]:
                          write(file, text, crlf)
                          code, exe, first, compiled = build(root)
                          out("WDC %s build exit %d compiled=%s" % (label, code, compiled))
                          if code != 0 or not exe:
                              out("WDC FAIL %s build: %s" % (label, first))
                              return verdict_line()
                          some(exe, label, ["C5", "T6"])
                      v_head, u_head = outcome(PRINTED, "head", "C5")
                      v_r04, u_r04 = outcome(PRINTED, "r04", "C5")
                      out("WDC read back: head C5 %s (%s); r04 C5 %s (%s)" % (
                          v_head, "; ".join(u_head), v_r04, place(u_r04) or "; ".join(u_r04)))
                      if v_head != "ok":
                          out("WDC FAIL failing_first D5: the case is not ok at the head")
                      if v_r04 not in ("HANG", "RED"):
                          out("WDC FAIL failing_first D5: the case is neither red nor hung under r04")
                      out("WDC failing_first D5 (the case ok at the head, red or hung under r04): %s" % (
                          "PASS" if v_head == "ok" and v_r04 in ("HANG", "RED") else "FAIL"))
                      return verdict_line()
                  if part == "changes":
                      code, exe, first, compiled = build(root)
                      if code != 0 or not exe:
                          out("WDC FAIL the head's test build: exit %d %s" % (code, first))
                          return verdict_line()
                      some(exe, "control", [t for t, _ in TESTS])
                      for tid, _ in TESTS:
                          v, under = outcome(PRINTED, "control", tid)
                          if v != "ok":
                              out("WDC FAIL control %s %s" % (tid, v))
                      for cid, rule, _, expect in CHANGES:
                          write(file, changed(head, cid), crlf)
                          code, exe, first, compiled = build(root)
                          if code != 0 or not exe:
                              out("WDC change %s does-not-compile :: %s" % (cid, rule))
                              continue
                          some(exe, cid, [t for t, _ in TESTS])
                          seen = {tid: outcome(PRINTED, cid, tid)[0] for tid, _ in TESTS}
                          caught = [t for t in seen if seen[t] in ("RED", "HANG")]
                          out("WDC change %s compiled=%s caught by %s :: %s" % (cid, compiled, ",".join(
                              "%s=%s" % (t, seen[t]) for t in caught) or "nothing", rule))
                          for tid, wants in expect.items():
                              if seen[tid] not in wants:
                                  out("WDC FAIL change %s: %s read %s, expected %s" % (cid, tid, seen[tid], " or ".join(wants)))
                          if not expect and caught:
                              out("WDC change %s is caught although this round names it a limit: %s" % (cid, ",".join(caught)))
                      return verdict_line()
                  out("WDC FAIL unknown part " + part)
                  return verdict_line()
              finally:
                  restore(root)


          def rehearse(log):
              """Round 2's failing-first lines judged by this round's verdict: by the printed verdict word and panic place."""
              lines = []
              for raw in open(log, encoding="utf-8", errors="replace"):
                  if "\x1b[36;1m" in raw or "^[[36;1m" in raw:
                      continue
                  m = re.search(r"\d{4}-\d\d-\d\dT[\d:.]+Z (WDC .*)$", raw.rstrip("\n"))
                  if m:
                      lines.append(m.group(1))
              cases = [
                  ("head-plain", "T6", "ok", None),
                  ("head-control", "T6", "RED", "2615:13"),
                  ("base-slowslot", "T6", "RED", "2505:13"),
                  ("head-slowslot", "T6", "ok", None),
                  ("base-late-control", "T6", "ok", None),
                  ("head-late", "T6", "ok", None),
                  ("head-late-control", "T6", "RED", "2615:13"),
                  ("head-plain", "C2", "ok", None),
                  ("head-m10", "C2", "RED", "1979:13"),
                  ("head-plain", "C4", "ok", None),
                  ("head-nodrop", "C4", "RED", "2005:13"),
              ]
              bad = 0
              for label, tid, want, want_place in cases:
                  v, under = outcome(lines, label, tid)
                  p = place(under)
                  good = v == want and (want_place is None or p == want_place)
                  bad += 0 if good else 1
                  out("REHEARSE %s %s: read %s at %s; expected %s%s: %s" % (
                      label, tid, v, p or "-", want, (" at " + want_place) if want_place else "", "PASS" if good else "FAIL"))
              old = [l for l in lines if l.startswith("WDC failing_first D1") or l.startswith("WDC D1 schedules")]
              for l in old:
                  out("REHEARSE the old judge printed: " + l[:120])
              out("REHEARSE verdict by printed lines: %d of %d cases as expected; D1 %s" % (
                  len(cases) - bad, len(cases), "PASS" if bad == 0 else "FAIL"))
              return 0 if bad == 0 else 1


          def check(clone, outdir):
              os.makedirs(outdir, exist_ok=True)
              env = dict(os.environ)
              env["PATH"] = os.path.expanduser("~/.cargo/bin") + os.pathsep + env.get("PATH", "")
              env["TMPDIR"] = "/private/tmp/r1-builder-134-scratch/tmp"
              env["CARGO_BUILD_JOBS"] = "4"
              env["CARGO_TARGET_DIR"] = "/private/tmp/r1-builder-134-scratch/target"
              stub = os.path.expanduser("~/.wstack/runs/20261108-halvo-r1-capture/bin/static-analyzer/stub-cc.sh")
              env["CC_x86_64_pc_windows_msvc"] = stub
              env["AR_x86_64_pc_windows_msvc"] = stub
              file = os.path.join(clone, PATH)
              head, crlf = read(file)
              rows = open(os.path.join(outdir, "check.tsv"), "a")
              try:
                  for pid, text in [("head", head)] + [(c[0], changed(head, c[0])) for c in CHANGES]:
                      write(file, text, crlf)
                      r = subprocess.run(["cargo", "check", "--locked", "--target", "x86_64-pc-windows-msvc", "-p", "halvo-capture",
                                          "--lib", "--tests"], cwd=clone, env=env, capture_output=True)
                      log = r.stdout.decode("utf-8", "replace") + r.stderr.decode("utf-8", "replace")
                      with open(os.path.join(outdir, pid + ".log"), "w") as f:
                          f.write(log + "\ncheck_exit=%d\n" % r.returncode)
                      errors = [l for l in log.splitlines() if l.startswith("error") or l.startswith("warning: unused")]
                      row = "%s\t%d\t%s\t%s" % (pid, r.returncode, "checked" if "Checking halvo-capture" in log else "NOT-REBUILT",
                                                errors[0][:160] if errors else "-")
                      rows.write(row + "\n")
                      rows.flush()
                      out(row)
                      restore(clone)
              finally:
                  restore(clone)
                  rows.close()


          if __name__ == "__main__":
              try:
                  sys.stdout.reconfigure(errors="backslashreplace")
              except AttributeError:
                  pass
              if len(sys.argv) > 1 and sys.argv[1] == "check":
                  check(sys.argv[2], sys.argv[3])
              elif len(sys.argv) > 1 and sys.argv[1] == "rehearse":
                  sys.exit(rehearse(sys.argv[2]))
              else:
                  sys.exit(hosted(os.environ.get("WDC_PART", "")))
      - name: "win-detector-clock round 3 failing first (D5, the case of receive_met at the head and under r04)"
        if: ${{ !cancelled() }}
        shell: python
        env:
          WDC_PART: failfirst
        run: |
          """win-detector-clock, round 3 (builder-134, Addition 2): D5, the made-up case of receive_met.

          On this Mac:
              python3 -I wdc3.py check <clone> <out dir>     type-checks each copy of this round for the Windows target and restores
                                                             the file with git checkout (no test runs here)
              python3 -I wdc3.py rehearse <job log>          judges the WDC lines of a saved job log of round 2 with this round's
                                                             verdict, which reads the lines that the step printed: the test's
                                                             result line and the place of its panic
          On the hosted windows job: python wdc3.py, with WDC_PART=loop, failfirst or changes, at the repo root.
          Each part prints, for each outcome, the test's result line and the place of its panic with the line after it, judges
          by the lines that it printed itself, prints one line `WDC FAIL <what>` for each outcome that it does not expect, and
          ends with `WDC verdict: lines that begin with WDC FAIL: <n>; allowed: none; step PASS|FAIL`."""
          import json, os, re, subprocess, sys, time

          PATH = "crates/halvo-capture/src/windows/secure_input.rs"
          MOD = "secure_input::windows::detector::tests::"
          TESTS = [
              ("T0", "a_desktop_hook_that_cannot_be_set_refuses_the_attach_and_removes_the_focus_handler"),
              ("T1", "after_attach_the_first_mark_is_the_start_and_attach_returns_after_the_detectors_own_read"),
              ("T2", "detach_ends_the_detectors_thread_and_a_new_attach_starts_one"),
              ("T3", "detach_answers_the_first_of_its_removal_calls_that_failed"),
              ("T4", "an_attach_after_a_timed_out_detach_is_refused_while_the_old_detector_runs"),
              ("T5", "detach_answers_timeout_when_the_detector_does_not_end_in_time"),
              ("T6", "an_attach_whose_first_read_does_not_answer_times_out_and_stops_that_detector"),
              ("C2", "until_asks_its_fact_again_until_it_holds_and_then_no_more"),
              ("C4", "a_hold_is_let_go_when_its_test_unwinds"),
              ("C5", "receive_met_keeps_its_caller_while_the_receive_is_held"),
          ]
          NAMES = dict(TESTS)
          LOOP = {"T0": 200, "T1": 20, "T2": 20, "T3": 20, "T4": 20, "T5": 20, "T6": 200, "C2": 200, "C4": 200, "C5": 200}
          TEST_LIMIT_S = 60

          R04 = ("            while HOLD_RECEIVE.load(std::sync::atomic::Ordering::SeqCst) {",
                 "            if HOLD_RECEIVE.load(std::sync::atomic::Ordering::SeqCst) {")
          S02 = ("            until(|| RECEIVE_TURNS.load(Ordering::SeqCst) >= 2);",
                 "            until(|| RECEIVE_TURNS.load(Ordering::SeqCst) >= 1);")
          # id, the rule(s), [(old, new), ...] each exactly once in the head's file, the outcomes that this round expects
          CHANGES = [
              ("r04", "receive_met holds its caller for one turn only (round 2's r04)", [R04], {"C5": ("HANG", "RED")}),
              ("s01", "receive_met does not count the turns of its hold",
               [("                RECEIVE_TURNS.fetch_add(1, std::sync::atomic::Ordering::SeqCst);\n", "")], {"C5": ("HANG", "RED")}),
              ("s02", "the case waits for one turn, not two", [S02], {}),
              ("s02+r04", "the case waits for one turn, and receive_met holds for one turn only (two rules)", [S02, R04], {}),
              ("s03", "the case reads its caller as ended under the hold",
               [("                !ended_under_the_hold,\n", "                ended_under_the_hold,\n")], {"C5": ("RED",)}),
              ("s04", "the case expects two arrivals",
               [("            caller.join().expect(\"the caller of receive_met ends\");\n            assert_eq!(RECEIVES_MET.load(Ordering::SeqCst), 1);",
                 "            caller.join().expect(\"the caller of receive_met ends\");\n            assert_eq!(RECEIVES_MET.load(Ordering::SeqCst), 2);")], {"C5": ("RED",)}),
              ("s05", "the case never lets the hold go",
               [("            drop(receive);\n            caller.join()", "            caller.join()")], {"C5": ("HANG", "RED")}),
              ("s06", "the case does not reset the count of turns",
               [("            RECEIVE_TURNS.store(0, Ordering::SeqCst);\n            let receive = Hold::on(&HOLD_RECEIVE);\n            let caller",
                 "            let receive = Hold::on(&HOLD_RECEIVE);\n            let caller")], {}),
