name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: U0.7c CP-126 web trial round 3 Edge org_ cells alone on hosted-win, CP-145 (6) (scratch branch, never merged; counts only)
        if: always()
        timeout-minutes: 40
        shell: bash
        run: |
          set +e
          code=0
          export KEEP_PAGES=1
          host=$(rustc -vV | sed -n 's/^host: //p')
          bin="$PWD/tools/r3-trials/web/target/$host/release/web-trial.exe"
          # the binary before any call of it: the control and the page read run before the first row
          # in org_page mode (run 43381911741 read Chrome's page with no binary)
          cargo build --release --locked --quiet --target "$host" --target-dir "$PWD/tools/r3-trials/web/target" --manifest-path "$PWD/tools/r3-trials/web/Cargo.toml" || code=1
          [ -x "$bin" ] && echo "bin built=yes" || echo "bin built=no"
          lim() { timeout "$@"; }
          t() {
            s0=$(date +%s)
            lim 1500 sh tools/r3-trials/web/run.sh --candidate cdp --browser "$b" --port 18190 "$@"
            e=$?
            echo "call_end exit=$e seconds=$(( $(date +%s) - s0 )) args=$(echo "$*" | tr ' ' '_')"
            [ "$e" -eq 0 ] || code=1
          }
          page() {
            # the browser's policy page, printed headless with no debugging channel, as text
            p="$1"
            pn=unread
            pc=no_pdf
            # each browser's own scheme: Edge given chrome://policy/ printed its new-tab page
            # (runs 43368925419 and 43381911741)
            if [ "$k" = edge ]; then url=edge://policy/; else url=chrome://policy/; fi
            mkdir -p "$p/prof"
            lim 60 "$b" --headless=new --user-data-dir="$p/prof" --allow-chrome-scheme-url --no-pdf-header-footer --timeout=4000 --print-to-pdf="$p/page.pdf" "$url" >/dev/null 2>&1
            if [ -s "$p/page.pdf" ]; then
              pc=no_pdf_reader
              if python -c "import pypdf" 2>/dev/null || python -m pip install --quiet pypdf==4.3.1 >/dev/null 2>&1; then
                python -c 'import sys, pypdf; r = pypdf.PdfReader(sys.argv[1]); open(sys.argv[2], "w", encoding="utf-8").write("\n".join((x.extract_text() or "") for x in r.pages))' "$p/page.pdf" "$p/page.txt" && pc=-
                [ "$pc" = - ] && ! grep -q '[^[:space:]]' "$p/page.txt" && pc=empty_text
                [ -s "$p/page.txt" ] && [ "$pc" = - ] && pn=$("$bin" --policy-named "$2" "$p/page.txt" "$3" | sed -n 's/.*named=\([a-z]*\).*/\1/p')
              fi
            fi
            if [ -n "${KEEP_PAGES:-}" ]; then
              mkdir -p "$PWD/target/ci-artifacts/pages"
              [ -f "$p/page.pdf" ] && cp "$p/page.pdf" "$PWD/target/ci-artifacts/pages/$k-$2.pdf"
              [ -f "$p/page.txt" ] && cp "$p/page.txt" "$PWD/target/ci-artifacts/pages/$k-$2.txt"
              part=$(printf '%s' "$2" | cut -c1-6)
              [ -f "$p/page.txt" ] && grep -n -i -E "$part|policy name" "$p/page.txt" | head -40 | sed "s/^/page_text browser=$k name=$2 line=/"
              echo "page_text browser=$k name=$2 lines=$( [ -f "$p/page.txt" ] && wc -l <"$p/page.txt" | tr -d ' ' || echo 0) bytes=$( [ -f "$p/page.txt" ] && wc -c <"$p/page.txt" | tr -d ' ' || echo 0)"
            fi
            # the page's own processes: the browser's program, the page's own profile
            left=$(powershell -NoProfile -Command "\$n = 0; Get-CimInstance Win32_Process | Where-Object { \$_.CommandLine -like '*$(cygpath -w "$p/prof" | sed 's/\\/\\\\/g')*' } | ForEach-Object { Stop-Process -Id \$_.ProcessId -Force -ErrorAction SilentlyContinue; \$n++ }; \$n" 2>/dev/null | tr -d '\r')
            echo "policy page browser=$k name=$2 page_named=${pn:-no} cause=$pc page_processes_ended=${left:-0}"
          }
          ctl() {
            c=$(lim 300 "$bin" --org-control "$b" "$(cygpath -w "$1")" 2>/dev/null | tr -d '\r' | tail -1)
            echo "org_control at=$2 browser=$k step=$3 ${c:-reply=no cause=none}"
          }
          o() {
            key=$1; step=$2; name=$3; type=$4; data=$5; want=$6
            w=$(mktemp -d "$RUNNER_TEMP/org.XXXXXX")
            before=$(ctl "$w" before "$step")
            echo "$before"
            case "$before" in *" reply=yes"*) cb=reply ;; *) cb=none ;; esac
            had=no
            MSYS_NO_PATHCONV=1 reg query "HKLM\SOFTWARE\Policies\\$key" >/dev/null 2>&1 && had=yes
            MSYS_NO_PATHCONV=1 reg add "HKLM\SOFTWARE\Policies\\$key" /v "$name" /t "$type" /d "$data" /f >/dev/null
            echo "policy set browser=$k name=$name key_existed=$had"
            powershell -NoProfile -Command "(Get-Acl 'HKLM:\SOFTWARE\Policies\\$key').Access | ForEach-Object { 'policy_acl ' + \$_.IdentityReference.Value.Replace(' ','_') + ' ' + (\$_.RegistryRights.ToString().Replace(' ','')) }"
            raw=$(MSYS_NO_PATHCONV=1 reg query "HKLM\SOFTWARE\Policies\\$key" /v "$name" 2>/dev/null | tr -d '\r' | awk -v n="$name" '$1 == n {print $NF}')
            case "$raw" in 0x*) vr=$((raw)) ;; *) vr=$raw ;; esac
            echo "policy value browser=$k name=$name value_read=${vr:--} value_want=$want"
            pl=$(page "$w" "$name" "$vr")
            echo "$pl"
            pn=$(printf '%s\n' "$pl" | sed -n 's/.* page_named=\([a-z]*\).*/\1/p')
            pcause=$(printf '%s\n' "$pl" | sed -n 's/^policy page .* cause=\([a-z_-]*\) .*/\1/p')
            R3_ORG_CONTROL_BEFORE=$cb R3_ORG_VALUE_READ=$vr R3_ORG_VALUE_WANT=$want R3_ORG_PAGE_NAMED=$pn R3_ORG_PAGE_CAUSE=$pcause t --runs 10 --rows org --round 3 --relay --step "$step"
            MSYS_NO_PATHCONV=1 reg delete "HKLM\SOFTWARE\Policies\\$key" /v "$name" /f >/dev/null
            [ "$had" = no ] && MSYS_NO_PATHCONV=1 reg delete "HKLM\SOFTWARE\Policies\\$key" /f >/dev/null
            MSYS_NO_PATHCONV=1 reg query "HKLM\SOFTWARE\Policies\\$key" /v "$name" >/dev/null 2>&1 && echo "policy removed=no name=$name" || echo "policy removed=yes name=$name"
            ctl "$w" after "$step"
          }
          for pair in "C:/Program Files/Google/Chrome/Application/chrome.exe|chrome" "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe|edge"; do
            b=${pair%%|*}
            k=${pair##*|}
            [ -f "$b" ] || { echo "browser missing $k"; code=1; continue; }
            echo "browser $k"
            if [ "$k" = chrome ]; then
              :
            else
              o 'Microsoft\Edge' org_debugging RemoteDebuggingAllowed REG_DWORD 0 0
              o 'Microsoft\Edge' org_proxy ProxyMode REG_SZ direct direct
            fi
          done
          exit $code
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
