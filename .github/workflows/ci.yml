name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: U1.1k entries at the start
        shell: bash
        run: |
          set +e
          if [ "$RUNNER_OS" = Windows ]; then python_bin=python; else python_bin=python3; fi
          "$python_bin" - start "$RUNNER_TEMP" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import threading
          import time

          ROOTS = ["target/tmp", "target/r2-probes/tmp", "target/halvo-schema"]
          WORDS = [
              "export-names", "golden", "r4-golden", "r4-export-names", "r4-names", "r5-export-names", "r5-names",
              "later-file-builds", "core-file-builds", "crate-files", "walk-outside-lib", "declared-names",
              "halvo-schema-golden-r3", "locked-files", "r3-golden", "r2-probes", "halvo-cap-lock", "model-lock",
              "measure-peak",
          ]
          OLD = {"later-file-builds", "core-file-builds", "crate-files", "walk-outside-lib", "declared-names",
                 "halvo-schema-golden-r3", "lines", "browser-version", "halvo-cap-lock", "model-lock-accounts", "golden"}
          SLOW_SECONDS = 2.0
          BINARIES = {
              ("halvo-schema", "export_names"): [],
              ("halvo-schema", "golden"): [],
              ("halvo-schema", "r4_golden"): [],
              ("halvo-schema", "r4_names"): [],
              ("halvo-schema", "r5_names"): [],
              ("halvo-schema", "r3_golden"): [],
              ("halvo-schema", "later_file_builds"): ["leaf_"],
              ("halvo-schema", "locked_files"): ["leaf_", "fixture_dir_two_calls"],
              ("halvo-cap", "halvo_cap"): ["fresh_dir_"],
              ("halvo-cap", "model_lock"): ["leaf_", "fresh_dir_"],
              ("halvo-cap", "measure_peak"): ["leaf_"],
              ("r2-probes", "text"): [],
              ("r2-probes", "lines"): [],
              ("r2-probes", "browser_version"): [],
          }


          def entries():
              found = []
              for root in ROOTS:
                  if os.path.isdir(root):
                      for name in os.listdir(root):
                          found.append((root, name))
              return found


          def kind(root, name):
              if root == "target/halvo-schema":
                  return "mine"
              if name in OLD or any(name == word or name.startswith(word + "-") for word in WORDS):
                  return "mine"
              if name.startswith("halvo-seam-"):
                  return "seam"
              return "other"


          def counts(found):
              out = {"mine": 0, "seam": 0, "other": 0}
              for root, name in found:
                  out[kind(root, name)] += 1
              return out


          def save(path):
              found = entries()
              with open(path, "w", encoding="utf-8") as f:
                  for root, name in found:
                      f.write(root + "\t" + name + "\n")
              c = counts(found)
              print("entries total=%d mine=%d halvo-seam=%d other=%d" % (len(found), c["mine"], c["seam"], c["other"]))


          def load(path):
              with open(path, encoding="utf-8") as f:
                  return {tuple(line.rstrip("\n").split("\t")) for line in f if line.strip()}


          def compare(path, label):
              before = load(path)
              now = set(entries())
              new = sorted(now - before)
              gone = before - now
              c = counts(new)
              print("%s: entries new=%d (mine=%d halvo-seam=%d other=%d) gone=%d now=%d" % (
                  label, len(new), c["mine"], c["seam"], c["other"], len(gone), len(now)))
              mine = [name for root, name in new if kind(root, name) == "mine"]
              for name in mine[:20]:
                  print("%s: new entry of the changed tests: %s" % (label, name))
              end = counts(list(now))
              print("%s: entries at this point mine=%d halvo-seam=%d" % (label, end["mine"], end["seam"]))
              return c["mine"]


          def artifacts(command, cwd):
              out = subprocess.run(command, cwd=cwd, capture_output=True, text=True)
              if out.returncode != 0:
                  print("build exit=%d" % out.returncode)
                  print(out.stderr[-3000:])
                  sys.exit(1)
              found = {}
              for line in out.stdout.splitlines():
                  try:
                      m = json.loads(line)
                  except ValueError:
                      continue
                  if m.get("reason") != "compiler-artifact" or not m.get("profile", {}).get("test") or not m.get("executable"):
                      continue
                  package = m["package_id"]
                  name = m["target"]["name"]
                  manifest = os.path.dirname(m["manifest_path"])
                  for (pkg, target) in BINARIES:
                      if target == name and ("/" + pkg + "#") in package.replace("\\", "/") or (target == name and package.startswith(pkg + " ")):
                          found[(pkg, target)] = (m["executable"], manifest)
              return found


          RESULT = re.compile(r"^test result: ok\. ([0-9]+) passed; 0 failed;", re.M)


          def one_round(exe, cwd, filters):
              out = subprocess.run([exe] + filters, cwd=cwd, capture_output=True, text=True, errors="replace")
              lines = RESULT.findall(out.stdout)
              if out.returncode != 0 or not lines:
                  return None, out
              return int(lines[-1]), out


          def loop(key, exe, cwd, fast, slow, lines, lock):
              filters = BINARIES[key]
              start = time.monotonic()
              first, out = one_round(exe, cwd, [])
              took = time.monotonic() - start
              plan = [([], fast)] if took <= SLOW_SECONDS or not filters else [([], slow), (filters, fast)]
              report = []
              ok = True
              for args, rounds in plan:
                  want = None
                  passed = 0
                  for i in range(rounds):
                      got, out = (first, out) if (i == 0 and not args) else one_round(exe, cwd, args)
                      if want is None:
                          want = got
                      if got is not None and got > 0 and got == want:
                          passed += 1
                      elif len(report) < 3:
                          keep = [line[:300] for line in (out.stdout + "\n" + out.stderr).splitlines()
                                  if line.startswith(("error", "test ", "thread ", "  left", " right", "Caused")) and not line.endswith(" ok")]
                          tail = "\n".join(keep[:12])
                          report.append("round %d failed (tests %s, want %s, exit %s):\n%s" % (i + 1, got, want, out.returncode, tail))
                  name = "%s/%s%s" % (key[0], key[1], (" " + " ".join(args)) if args else "")
                  line = "loop %s: tests per round %s, passed %d of %d" % (name, want, passed, rounds)
                  ok = ok and passed == rounds and bool(want)
                  with lock:
                      lines.append(line)
                      print(line, flush=True)
                      for r in report:
                          print(r, flush=True)
                  report = []
              with lock:
                  print("loop %s/%s: first round %.1f s, all rounds %.0f s" % (key[0], key[1], took, time.monotonic() - start), flush=True)
              return ok


          def run(state_dir):
              fast = int(os.environ.get("U11K_FAST", "200"))
              slow = int(os.environ.get("U11K_SLOW", "20"))
              skip_account = os.environ.get("U11K_SKIP_ACCOUNT") == "1"
              probes_target = os.path.join(os.getcwd(), "target", "r2-probes")
              found = artifacts(["cargo", "test", "--locked", "-p", "halvo-schema", "-p", "halvo-cap", "--no-run", "--message-format=json"], ".")
              found.update(artifacts(["cargo", "test", "--locked", "--no-run", "--message-format=json", "--target-dir", probes_target], "tools/r2-probes"))
              keys = [k for k in BINARIES if k in found]
              if sys.platform != "darwin":
                  keys = [k for k in keys if k != ("r2-probes", "browser_version")]
              missing = [k for k in BINARIES if k not in found]
              print("binaries found=%d looped=%d missing=%s" % (len(found), len(keys), ",".join("/".join(k) for k in missing) or "none"))
              save(os.path.join(state_dir, "u11k-before-loop.txt"))
              lines = []
              lock = threading.Lock()
              results = {}
              order = sorted(keys, key=lambda k: 0 if k[1] in ("later_file_builds", "locked_files", "measure_peak", "model_lock") else 1)

              def worker(queue):
                  while True:
                      with lock:
                          if not queue:
                              return
                          key = queue.pop(0)
                      exe, cwd = found[key]
                      if skip_account and key == ("halvo-cap", "model_lock"):
                          saved = dict(BINARIES)
                          BINARIES[key] = ["leaf_", "fresh_dir_"]
                          results[key] = loop_filtered(key, exe, cwd, fast, lines, lock)
                          BINARIES.update(saved)
                          continue
                      results[key] = loop(key, exe, cwd, fast, slow, lines, lock)

              queue = list(order)
              threads = [threading.Thread(target=worker, args=(queue,)) for _ in range(int(os.environ.get("U11K_JOBS", "3")))]
              for t in threads:
                  t.start()
              for t in threads:
                  t.join()
              left = compare(os.path.join(state_dir, "u11k-before-loop.txt"), "after the loop")
              compare(os.path.join(state_dir, "u11k-start.txt"), "since the start of the job")
              bad = [k for k, v in results.items() if not v]
              print("loop binaries=%d red=%d new entries of the changed tests=%d" % (len(results), len(bad), left))
              return 0 if not bad and left == 0 and not missing else 1


          def loop_filtered(key, exe, cwd, fast, lines, lock):
              args = BINARIES[key]
              want = None
              passed = 0
              for _ in range(fast):
                  got, _out = one_round(exe, cwd, args)
                  want = got if want is None else want
                  if got is not None and got > 0 and got == want:
                      passed += 1
              line = "loop %s/%s %s: tests per round %s, passed %d of %d (the account lock's tests left out on this machine)" % (
                  key[0], key[1], " ".join(args), want, passed, fast)
              with lock:
                  lines.append(line)
                  print(line, flush=True)
              return passed == fast and bool(want)


          def main():
              mode = sys.argv[1]
              state = sys.argv[2]
              if mode == "start":
                  save(os.path.join(state, "u11k-start.txt"))
                  return 0
              if mode == "loop":
                  return run(state)
              print("mode is start or loop")
              return 2


          sys.exit(main())
          PY
          code=$?
          echo "u11k start exit=$code"
          exit $code
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 20-schema 15-r3-test-dirs
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 20-schema 15-r3-test-dirs
      - name: U1.1k tests of tools/r2-probes in its own workspace
        if: always()
        shell: bash
        run: |
          set +e
          started=$(date +%s)
          cd tools/r2-probes || exit 1
          cargo test --locked --target-dir "$GITHUB_WORKSPACE/target/r2-probes" >"$RUNNER_TEMP/u11k-probes.txt" 2>&1
          code=$?
          grep -E '^test result:|^     Running' "$RUNNER_TEMP/u11k-probes.txt"
          echo "u11k probes cargo test exit=$code seconds=$(( $(date +%s) - started ))"
          exit $code
      - name: U1.1k loop of the changed test binaries
        if: always()
        shell: bash
        run: |
          set +e
          if [ "$RUNNER_OS" = Windows ]; then python_bin=python; else python_bin=python3; fi
          started=$(date +%s)
          "$python_bin" - loop "$RUNNER_TEMP" <<'PY'
