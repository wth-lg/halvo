               "    !a.is_empty() && !b.is_empty() && parts(a) == parts(b)\n",
               "    !a.is_empty() && !b.is_empty() && parts(a) == parts(b) && a.is_empty()\n",
               LIB, T("checks::tests::a_profile_is_borne_by_the_two_exact_forms_alone", "checks::tests::g1_the_run_s_own_forms_bear_the_mark_and_another_profile_does_not"), "caught"),
              ("L2-no-database-form", "local", "both", "src/checks.rs",
               "            same_path_on(v, &crashpad, windows)\n",
               "            same_path_on(v, &crashpad, windows) && v.is_empty()\n",
               LIB, T("checks::tests::g1_the_run_s_own_forms_bear_the_mark_and_another_profile_does_not"), "caught"),
              ("L3-no-profile-form", "local", "both", "src/checks.rs",
               "            same_path_on(v, profile, windows)\n        } else if",
               "            same_path_on(v, profile, windows) && v.is_empty()\n        } else if",
               LIB, T("checks::tests::g1_the_run_s_own_forms_bear_the_mark_and_another_profile_does_not", "checks::tests::a_profile_is_borne_by_the_two_exact_forms_alone"), "caught"),
              ("L4-windows-case-kept", "local", "both", "src/checks.rs",
               "            p.replace('\\\\', \"/\").to_ascii_lowercase()\n",
               "            p.replace('\\\\', \"/\")\n",
               LIB, T("checks::tests::a_profile_is_borne_by_the_two_exact_forms_alone"), "caught"),
              ("L5-windows-backslash-kept", "local", "both", "src/checks.rs",
               "            p.replace('\\\\', \"/\").to_ascii_lowercase()\n",
               "            p.to_ascii_lowercase()\n",
               LIB, T("checks::tests::a_profile_is_borne_by_the_two_exact_forms_alone"), "caught"),
              ("L6-empty-components-kept", "local", "both", "src/checks.rs",
               "            .filter(|c| !c.is_empty())\n            .map(str::to_string)\n",
               "            .map(str::to_string)\n",
               LIB, T("checks::tests::a_profile_is_borne_by_the_two_exact_forms_alone"), "caught"),
              ("L7-windows-line-not-split", "local", "both", "src/checks.rs",
               "    let split: Vec<String> = if windows {\n",
               "    let split: Vec<String> = if windows && profile.is_empty() {\n",
               LIB, T("checks::tests::a_profile_is_borne_by_the_two_exact_forms_alone"), "caught"),
              ("L8-crashpad-lower-case", "local", "both", "src/checks.rs",
               "    let crashpad = format!(\"{profile}/Crashpad\");\n",
               "    let crashpad = format!(\"{profile}/crashpad\");\n",
               LIB, T("checks::tests::g1_the_run_s_own_forms_bear_the_mark_and_another_profile_does_not"), "caught"),
              ("L9-tree-takes-no-adopted", "local", "both", "src/checks.rs",
               "        let ours = command_args(a.pid).is_some_and(|args| bears_profile(&args, &profile));\n",
