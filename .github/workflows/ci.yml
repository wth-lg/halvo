          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 22-daemon-no-dead-allow 23-daemon-port-only 30-core-boundary-proofs
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 22-daemon-no-dead-allow 23-daemon-port-only 30-core-boundary-proofs
      - name: Loop of daemon-1c's tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          rounds=${LOOP_ROUNDS:-200}
          names="
          daemon::owner::tests::the_class_of_each_write_fault_counts_and_names_it
          daemon::owner::tests::three_due_tries_answered_1_set_the_batch_aside
