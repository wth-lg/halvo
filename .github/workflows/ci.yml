name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Gate self-test under sh
        shell: bash
        run: |
          start=$(date +%s)
          sh scripts/r1-gate/run.sh --self-test -v > self-test.txt 2> self-test.err
          code=$?
          echo "exit=$code seconds=$(( $(date +%s) - start ))"
          grep -c '^case ' self-test.txt
          grep -E '^PASS self-test|^FAIL|want=PASS got=FAIL|want=FAIL got=PASS|want=NO-INPUT got=[PF]' self-test.txt
          grep -v '^scratch ' self-test.err | head -20
          exit "$code"
      - name: Gate self-test under dash
        if: always()
        shell: bash
        run: |
          rc=0
          for f in scripts/r1-gate/run.sh scripts/r1-gate/check-*.sh; do
            dash "$f" --self-test -v > dash.txt 2> dash.err || rc=1
            grep -E '^PASS self-test|^FAIL|want=PASS got=FAIL|want=FAIL got=PASS|want=NO-INPUT got=[PF]' dash.txt
          done
          exit "$rc"
      - name: Locale and tools
        if: always()
        shell: bash
        run: |
          locale -a | grep -c 'de_DE.UTF-8'
          sysctl -n hw.ncpu
          command -v dash cc perl swiftc shellcheck actionlint | wc -l
