          store::hardening_tests::a_store_db_that_becomes_a_fifo_before_the_mode_step_answers_obstructed_within_a_bound
          store::hardening_tests::a_store_directory_at_0500_fails_the_first_call_and_the_retry_on_the_handle_finishes
          store::hardening_tests::a_store_directory_made_by_the_tests_holds_no_writer_lock
          store::hardening_tests::a_store_directory_removed_while_open_answers_obstructed_at_the_next_read_and_makes_nothing
          store::hardening_tests::a_store_made_by_one_build_opens_from_a_copy_of_the_binary_at_a_second_path
          store::hardening_tests::a_store_on_a_full_volume_ends_delete_all_with_no_root_and_no_key_file
          store::hardening_tests::a_volume_name_that_leads_to_another_directory_is_refused_and_a_create_leaves_nothing
          store::hardening_tests::after_a_move_once_open_a_write_a_checkpoint_and_the_close_act_in_the_moved_directory
          store::hardening_tests::an_empty_database_at_the_name_of_a_moved_directory_answers_obstructed_and_not_older_store
