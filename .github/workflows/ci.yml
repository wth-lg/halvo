name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 10-r7-account 20-r7-stub 24-r7-wall
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 10-r7-account 20-r7-stub 24-r7-wall
      - name: Unit 7.8 new tests 200 times each (scratch only)
        if: always()
        shell: bash
        run: |
          set +e
          export CARGO_TARGET_DIR="$RUNNER_TEMP/loop-78"
          runs=${LOOP_RUNS:-200}
          bad=0
          total=0
          job=macos
          exe_list() {
            if [ -n "$2" ]; then
              cargo test --manifest-path account/Cargo.toml --locked --offline -p "$1" --features "$2" --no-run 2>&1
            else
              cargo test --manifest-path account/Cargo.toml --locked --offline -p "$1" --no-run 2>&1
            fi | sed -n 's/^ *Executable .*(\(.*\))$/\1/p'
          }
          loop() {
            package=$1
            features=$2
            shift 2
            exes=$(exe_list "$package" "$features")
            echo "loop $package [$features] executables=$(echo "$exes" | grep -c .)"
            for name in "$@"; do
              total=$((total + 1))
              exe=""
              for e in $exes; do
                if command -v cygpath >/dev/null 2>&1; then e=$(cygpath -u "$e"); fi
                if "$e" --list --exact "$name" 2>/dev/null | grep -x "$name: test" >/dev/null; then
                  exe=$e
                  break
                fi
              done
              if [ -z "$exe" ]; then
                echo "loop $package [$features] $name found=no"
                bad=$((bad + 1))
                continue
              fi
              passed=0
              start=$(date +%s)
              i=0
              shown_fail=no
              while [ "$i" -lt "$runs" ]; do
                out=$("$exe" --exact "$name" --test-threads=1 --nocapture 2>&1)
                if [ "$i" -eq 0 ]; then
                  printf '%s\n' "$out" | grep -E '(race |pair |stale-reference|two-binaries|delete-if-holds store=|removal store=)' | sed 's/^/  first run: /'
                fi
                printf '%s\n' "$out" | grep -E 'stale-reference (rounds=|control)' | sed "s/^/  run $i: /"
                if printf '%s\n' "$out" | grep '^test result: ok\. 1 passed' >/dev/null; then
                  passed=$((passed + 1))
                elif [ "$shown_fail" = no ]; then
                  shown_fail=yes
                  printf '%s\n' "$out" | tail -n 15 | sed 's/^/  first failure: /'
                fi
                i=$((i + 1))
              done
              echo "loop $package [$features] $name passed=$passed of $runs seconds=$(( $(date +%s) - start ))"
              [ "$passed" -eq "$runs" ] || bad=$((bad + 1))
            done
          }
          pair() {
            total=$((total + 2))
            k_name=by_reference::two_binaries_the_keychain_build_adds_the_item_and_leaves_a_move_s_claim
            f_name=by_reference::two_binaries_the_file_build_removes_the_keychain_item_beside_the_claim
            k_exe=""
            f_exe=""
            for e in $(exe_list halvo-secrets hosted-store-tests,keychain); do
              if "$e" --list --exact "$k_name" 2>/dev/null | grep -x "$k_name: test" >/dev/null; then k_exe=$e; fi
            done
            for e in $(exe_list halvo-secrets hosted-store-tests); do
              if "$e" --list --exact "$f_name" 2>/dev/null | grep -x "$f_name: test" >/dev/null; then f_exe=$e; fi
            done
            if [ -z "$k_exe" ] || [ -z "$f_exe" ]; then
              echo "loop pair found=no"
              bad=$((bad + 2))
              return
            fi
            k_passed=0
            f_passed=0
            start=$(date +%s)
            i=0
            while [ "$i" -lt "$runs" ]; do
              k_out=$("$k_exe" --exact "$k_name" --test-threads=1 --nocapture 2>&1)
              if printf '%s\n' "$k_out" | grep '^test result: ok\. 1 passed' >/dev/null; then
                k_passed=$((k_passed + 1))
              elif [ "$k_passed" -eq "$i" ]; then
                printf '%s\n' "$k_out" | tail -n 15 | sed 's/^/  first failure (keychain build): /'
              fi
              f_out=$("$f_exe" --exact "$f_name" --test-threads=1 --nocapture 2>&1)
              if [ "$i" -eq 0 ]; then
                printf '%s\n' "$f_out" | grep 'two-binaries' | sed 's/^/  first run: /'
              fi
              if printf '%s\n' "$f_out" | grep '^test result: ok\. 1 passed' >/dev/null; then
                f_passed=$((f_passed + 1))
              elif [ "$f_passed" -eq "$i" ]; then
                printf '%s\n' "$f_out" | tail -n 15 | sed 's/^/  first failure (file build): /'
              fi
              i=$((i + 1))
            done
            echo "loop pair $k_name passed=$k_passed of $runs; $f_name passed=$f_passed of $runs seconds=$(( $(date +%s) - start ))"
            [ "$k_passed" -eq "$runs" ] || bad=$((bad + 1))
            [ "$f_passed" -eq "$runs" ] || bad=$((bad + 1))
          }
          both_lib="keychain::tests::a_delete_if_holds_answers_the_class_of_a_failed_count_or_find_and_removes_nothing
          keychain::tests::a_delete_if_holds_removes_by_its_reference_and_never_an_item_put_in_place_after_its_read
          keychain::tests::a_delete_if_holds_removes_the_item_only_while_it_holds_the_bytes_read
          keychain::tests::a_delete_if_holds_whose_removal_did_not_take_answers_a_fault_and_keeps_the_item
          keychain::tests::a_delete_if_holds_whose_second_look_fails_answers_a_fault
          mac::tests::a_delete_if_holds_answers_from_both_places
          mac::tests::a_delete_if_holds_keeps_other_bytes_of_the_same_length_and_gives_them
          mac::tests::a_delete_if_holds_never_removes_what_another_process_put_in_place_after_its_read
          mac::tests::a_delete_if_holds_passes_on_the_answer_of_its_read_and_of_its_own_step
          mac::tests::a_delete_if_holds_removes_the_bytes_read_from_the_store_that_the_build_keeps
          mac::tests::a_removal_answers_the_failure_of_the_named_store_and_keeps_its_item
          mac::tests::a_removal_at_the_person_s_word_leaves_the_state_of_other_bytes_in_both_stores
          mac::tests::a_removal_touches_the_named_store_alone
          place::tests::a_claimed_file_that_another_operation_put_back_is_claimed_again_once
          place::tests::a_claimed_file_that_cannot_be_named_back_stays_under_its_private_name_and_answers_a_fault
          place::tests::a_delete_if_holds_claims_the_file_compares_it_and_only_then_removes_it
          place::tests::a_delete_if_holds_names_a_file_of_other_bytes_of_the_same_length_back_and_gives_them
          place::tests::a_failed_step_of_a_delete_if_holds_answers_its_class_and_keeps_the_file
          place::tests::a_file_that_another_process_puts_under_the_name_after_the_claim_stays
          place::tests::a_file_that_breaks_a_rule_is_not_claimed_by_a_delete_if_holds
          place::tests::a_store_that_keeps_its_file_alone_puts_a_left_claim_back_before_each_operation
          place::tests::a_claim_that_finds_the_file_under_another_process_claim_never_answers_not_stored
          place::tests::an_open_that_finds_the_file_under_another_process_claim_never_answers_not_stored
          place::tests::a_read_or_a_delete_while_another_process_holds_a_live_claim_never_answers_not_stored
          place::tests::a_claim_whose_rename_finds_nothing_while_the_name_stands_is_made_again_once
          keychain::tests::a_delete_if_holds_whose_second_look_finds_an_item_it_does_not_give_answers_a_fault
          place::tests::a_settle_beside_another_process_s_claim_that_goes_answers_no_hard_link_and_no_enoent
          place::tests::a_file_unlinked_between_open_and_fstat_is_not_a_hard_link
          place::tests::an_item_whose_link_count_reads_0_is_no_file_and_the_listing_answers_for_it
          place::tests::a_removal_at_the_person_s_word_ends_a_claim_that_cannot_be_named_back_and_a_temporary_file
          place::tests::a_live_write_beside_a_removal_at_the_person_s_word_answers_the_fault_of_its_rename
          place::tests::a_delete_if_holds_whose_claim_is_put_back_before_its_unlink_looks_once_more
          a_removal_at_the_person_s_word_ends_a_claim_that_cannot_be_named_back
          a_removal_at_the_person_s_word_leaves_no_temporary_file_of_a_killed_write
          child_of_the_two_process_races
          two_processes_on_one_store_answer_what_stands_or_a_fault_of_contention
          a_claim_that_a_stopped_delete_left_is_put_back_by_the_next_operation
          a_delete_if_holds_removes_only_the_bytes_that_its_caller_read
          a_removal_names_the_store_of_this_place_alone_and_then_reads
          place::tests::a_write_makes_the_bytes_durable_before_it_publishes_the_name_and_syncs_the_name_after
          a_removal_at_the_person_s_word_removes_only_temporary_files_of_the_exact_form
          a_write_beside_a_delete_if_holds_of_other_bytes_stores_nothing_and_leaves_no_claim
          place::tests::a_delete_if_holds_whose_read_finds_the_file_in_another_process_s_claim_lists_and_looks_again
          place::tests::a_file_replaced_between_the_read_and_the_claim_is_named_back_and_given
          place::tests::a_write_whose_listing_after_the_publish_fails_answers_its_class_and_keeps_the_file"
          mac_lib="mac::tests::real_files::a_delete_if_holds_ends_a_claim_that_a_killed_move_left
          mac::tests::real_files::a_file_that_another_process_replaces_with_bytes_of_the_same_length_during_the_move_is_kept
          mac::tests::real_files::a_removal_of_the_file_ends_a_claim_that_a_killed_move_left_first
          mac::tests::real_files::an_unsigned_delete_if_holds_keeps_a_file_that_another_process_wrote_after_its_read
          mac::tests::real_files::a_removal_of_the_keychain_item_ends_the_claim_of_a_killed_move_of_the_same_bytes
          mac::tests::real_files::a_delete_if_holds_during_another_process_claim_never_answers_not_stored
          mac::tests::real_files::a_read_or_a_delete_during_another_process_claim_never_answers_not_stored
          mac::tests::real_files::an_unsigned_delete_whose_file_is_claimed_after_its_read_answers_a_fault
          mac::tests::real_files::a_read_that_finds_the_file_claimed_twice_by_another_process_answers_a_fault
          mac::tests::real_files::a_write_whose_move_claim_another_process_puts_back_stores_no_second_credential
          mac::tests::real_files::a_move_whose_claim_another_process_puts_back_never_reads_not_stored_while_the_file_stands
          mac::tests::real_files::a_removal_of_the_file_during_another_process_claim_never_answers_not_stored
          mac::tests::real_files::a_read_beside_another_process_s_claim_that_goes_answers_no_hard_link_and_no_enoent
          mac::tests::real_files::a_move_whose_claim_another_process_removes_after_its_open_reads_found
          mac::tests::real_files::a_write_that_looks_while_another_process_claims_the_file_never_answers_stored
          mac::tests::real_files::a_file_replaced_between_the_read_and_the_claim_of_a_delete_if_holds_answers_by_the_limit
          mac::tests::real_files::a_claim_that_cannot_be_settled_beside_a_keychain_item_is_the_answer_and_nothing_changes
          mac::tests::real_files::a_temporary_file_that_goes_during_a_removal_at_the_person_s_word_is_passed_over
          mac::tests::real_files::a_move_whose_claim_is_named_back_before_its_unlink_looks_once_more
          mac::tests::real_files::no_operation_but_the_removal_at_the_person_s_word_removes_a_temporary_file
          mac::tests::real_files::a_removal_at_the_person_s_word_that_removed_a_credential_never_answers_not_stored
          mac::tests::real_files::two_claimed_files_are_settled_one_by_one_and_other_names_stay
          mac::tests::real_files::a_signed_delete_beside_a_claim_that_cannot_be_read_never_answers_deleted
          store::tests::a_removal_gives_what_then_stands_beside_the_item_of_the_other_store
          mac::tests::real_files::a_failure_of_a_claim_is_the_answer_and_a_failure_of_the_place_gives_the_item"
          hosted_all="a_removal_by_the_name_of_this_build_s_store_removes_its_item_and_then_reads
          the_store_of_this_build_deletes_only_the_bytes_that_its_caller_read"
          hosted_mac="by_reference::a_keychain_item_removed_by_its_reference_after_it_was_replaced_keeps_the_new_item
          by_reference::the_switch_that_keeps_a_read_from_asking_the_person_is_as_it_was_after_each_operation"
          helper="after_the_answer_the_store_is_called_once_and_a_sign_in_stored_after_that_call_stays
          against_the_store::after_deleted_or_no_such_account_the_store_on_files_removes_only_the_sign_in_that_was_sent"
          if [ "$job" = macos ]; then
            # shellcheck disable=SC2086
            loop halvo-secrets "" $both_lib $mac_lib
            # shellcheck disable=SC2086
            loop halvo-account "" $helper
            if [ -z "${LOOP_PLAIN_ONLY:-}" ]; then
              # shellcheck disable=SC2086
              HALVO_SECRETS_STALE_REFERENCE_ROUNDS=1 loop halvo-secrets hosted-store-tests,keychain $hosted_all $hosted_mac moves::a_signed_build_leaves_other_bytes_in_both_stores_at_the_person_s_word by_reference::a_stale_reference_between_two_processes_keeps_the_later_item
              # shellcheck disable=SC2086
              loop halvo-secrets hosted-store-tests $hosted_all $hosted_mac beside_the_keychain::an_unsigned_build_leaves_other_bytes_in_both_stores_at_the_person_s_word
              pair
            fi
          else
            # shellcheck disable=SC2086
            loop halvo-secrets "" $both_lib
            # shellcheck disable=SC2086
            loop halvo-account "" $helper
            if [ -z "${LOOP_PLAIN_ONLY:-}" ]; then
              # shellcheck disable=SC2086
              loop halvo-secrets hosted-store-tests $hosted_all
            fi
          fi
          echo "loop tests=$total runs_each=$runs not_all_passed=$bad"
          [ "$bad" -eq 0 ]
      - name: Unit 7.8 S6 lines (scratch only)
        if: always()
        shell: bash
        run: |
          set +e
          export CARGO_TARGET_DIR="$RUNNER_TEMP/loop-78"
          out="$RUNNER_TEMP/s6-lines.txt"
          summary="$RUNNER_TEMP/s6-summary.txt"
          : >"$out"
          echo "# keychain build: the stale reference (200 rounds) and the first half of the two binaries" >>"$out"
          cargo test --manifest-path account/Cargo.toml --locked --offline -p halvo-secrets --features hosted-store-tests,keychain --test hosted -- --exact by_reference::a_stale_reference_between_two_processes_keeps_the_later_item by_reference::two_binaries_the_keychain_build_adds_the_item_and_leaves_a_move_s_claim --test-threads=1 --nocapture >>"$out" 2>&1
          k=$?
          echo "exit keychain build=$k" >>"$out"
          echo "# file build: the second half of the two binaries" >>"$out"
          cargo test --manifest-path account/Cargo.toml --locked --offline -p halvo-secrets --features hosted-store-tests --test hosted -- --exact by_reference::two_binaries_the_file_build_removes_the_keychain_item_beside_the_claim --test-threads=1 --nocapture >>"$out" 2>&1
          f=$?
          echo "exit file build=$f" >>"$out"
          grep -E '^#|two-binaries|stale-reference|test result|panicked|^exit ' "$out" >"$summary"
          cat "$summary"
          {
            echo '### Unit 7.8 S6 lines (scratch only)'
            echo '```'
            cat "$summary"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "s6 lines saved: $(wc -l <"$out" | tr -d ' ') lines, summary $(wc -l <"$summary" | tr -d ' ') lines"
          [ "$k" -eq 0 ] && [ "$f" -eq 0 ]
      - name: Unit 7.8 S6 lines as an artifact (scratch only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-7-8-s6-lines-macos
          path: ${{ runner.temp }}/s6-*.txt
      - name: Hosted rules of units 7.7 and 7.8 taken out (scratch only)
        if: always()
        shell: bash
        run: |
          set +e
          export HALVO_SECRETS_STALE_REFERENCE_ROUNDS=1
          s=account/crates/halvo-secrets/src
          caught=0
          total=0
          mutant() {
            id=$1
            f=$s/$2
            features=$3
            expect=$4
            total=$((total + 1))
            perl -0pi -e "$5" "$f"
            if git diff --quiet -- "$f"; then
              echo "mutant $id applied=no"
              return
            fi
            log=$RUNNER_TEMP/mutant-$id.log
            start=$(date +%s)
            CARGO_TARGET_DIR=$RUNNER_TEMP/mutants cargo test --manifest-path account/Cargo.toml --locked --offline -p halvo-secrets --features "$features" --test hosted -- --test-threads=1 >"$log" 2>&1
            code=$?
            git checkout -- "$f"
            if grep -q "^test $expect \.\.\. FAILED" "$log"; then hit=yes; caught=$((caught + 1)); else hit=no; fi
            echo "mutant $id exit=$code expected_failed=$hit failed_tests=$(grep -c '\.\.\. FAILED$' "$log") seconds=$(( $(date +%s) - start ))"
            grep -E '^test .* \.\.\. FAILED$' "$log"
          }
          k=hosted-store-tests,keychain
          u=hosted-store-tests
          mutant h01-no-move mac.rs $k moves::a_file_of_an_earlier_build_moves_once_into_the_keychain_and_reads_found_after 's/Read::Found\(secret\) => self\.move_in\(secret, again\),/Read::Found(_) => Read::NotStored,/'
          mutant h02-no-read-back-compare mac.rs $k moves::a_read_back_that_differs_leaves_the_file_and_answers_locked 's/Read::Found\(back\) if back\.expose\(\) == secret\.expose\(\) => \{\}/Read::Found(_) => {}/'
          mutant h03-file-removed-before-read-back mac.rs $k moves::a_read_back_that_differs_leaves_the_file_and_answers_locked 's/Write::Stored => \{\}/Write::Stored => { let _ = self.file.delete(); }/'
          mutant h04-failed-add-drops-file mac.rs $k moves::a_failed_add_leaves_the_file_and_answers_locked 's/Write::Fault\(fault\) => return not_moved\(Some\(Ok\(fault\)\)\),/Write::Fault(_) => { let _ = self.file.delete(); return Read::NotStored; }/'
          mutant h05-both-full-found mac.rs $k moves::with_both_places_full_the_read_answers_locked_never_not_stored 's/Looked::File\(Read::Found\(_\)\) => Read::Locked\(Locked::OtherStore\),\s*//'
          mutant h06-unsigned-ignores-item mac.rs $u beside_the_keychain::a_keychain_item_read_by_a_build_without_the_feature_answers_locked 's/Ok\(_\) => Read::Locked\(Locked::OtherStore\),/Ok(_) => self.file.read(),/'
          mutant h07-equal-bytes-not-finished mac.rs $k moves::a_read_back_that_differs_leaves_the_file_and_answers_locked 's/Looked::File\(Read::Found\(other\)\) if other\.expose\(\) == secret\.expose\(\) => \{\s*self\.remove_the_file\(secret, again\)\s*\}\s*//'
          mutant h08-delete-without-read mac.rs $k moves::with_both_places_full_the_read_answers_locked_never_not_stored 's/let own = match self\.read\(\) \{/let own = match Read::Found(Secret::new(vec![1]).expect("a secret")) {/'
          mutant h09-feature-picks-file store.rs $k the_store_of_this_build_stores_reads_and_deletes_one_item 's/let keeps = if cfg!\(feature = "keychain"\) \{/let keeps = if !cfg!(feature = "keychain") {/'
          mutant h10-kind-of-keychain-is-file store.rs $k the_store_of_this_build_stores_reads_and_deletes_one_item 's/Keeps::Keychain => StoreKind::Keychain,/Keeps::Keychain => StoreKind::File,/'
          mutant h11-store-reads-file-alone store.rs $u beside_the_keychain::a_keychain_item_read_by_a_build_without_the_feature_answers_locked 's/Place::Mac\(mac\) => mac\.read\(\),/Place::Mac(mac) => mac.file.read(),/'
          mutant h12-unsigned-delete-removes-item store.rs $u beside_the_keychain::a_keychain_item_read_by_a_build_without_the_feature_answers_locked 's/Place::Mac\(mac\) => mac\.delete\(\),/Place::Mac(mac) => mac.keychain.delete(),/'
