name: ci

on:
  push:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: U0.7c build of the web trial (scratch branch, never merged; counts only)
        shell: bash
        timeout-minutes: 14
        run: |
          set +e
          host=$(rustc -vV | sed -n 's/^host: //p')
          s0=$(date +%s)
          cargo build --release --locked --quiet --target "$host" --target-dir "$PWD/tools/r3-trials/web/target" \
            --manifest-path "$PWD/tools/r3-trials/web/Cargo.toml"
          b=$?
          echo "build exit=$b seconds=$(( $(date +%s) - s0 ))"
          exit $b
      - name: U0.7c Edge start_probe on hosted-mac, the one open cell (scratch branch, never merged; counts only)
        if: always()
        shell: bash
        timeout-minutes: 30
        run: |
          set +e
          b="/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge"
          [ -f "$b" ] || { echo "browser missing edge"; exit 1; }
          "$b" --version 2>/dev/null | sed 's/^/edge_version /'
          s0=$(date +%s)
          perl -e 'alarm shift @ARGV; exec @ARGV or exit 127' 1500 sh tools/r3-trials/web/run.sh --candidate cdp --browser "$b" --port 18190 --runs 10 --rows round3 --round 3 --relay --step start_probe
          e=$?
          echo "call_end exit=$e seconds=$(( $(date +%s) - s0 )) args=--runs_10_--rows_round3_--round_3_--relay_--step_start_probe"
          exit $e
      - name: U0.7c processes left at the job's end (scratch branch, never merged)
        if: always()
        shell: bash
        run: |
          set +e
          n=$(ps -axww -o command= | grep -E "/r3-web\.[A-Za-z0-9]+/" | grep -vc grep)
          echo "scan at=job_end processes_of_the_trial_runs_left=$n"
