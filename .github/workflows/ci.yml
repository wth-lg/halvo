name: ci

# Scratch branch scratch/r7-s5-<k>, never merged: the two jobs build and run the R7 spikes
# S5 and S6 from scratch/r7-s5 and print one rule line per leg. They print synthetic values only.
on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain and runner facts
        shell: bash
        run: bash scratch/r7-s5/ci.sh facts macos-15
      - name: "S5: build 1 stores an item, rebuilt build 2 reads it"
        shell: bash
        timeout-minutes: 15
        run: bash scratch/r7-s5/ci.sh s5 macos-15
      - name: "S6: build the helper, the stub and the driver"
        id: s6build
        if: ${{ !cancelled() }}
        shell: bash
        timeout-minutes: 25
        run: bash scratch/r7-s5/ci.sh s6-build macos-15
      - name: "S6: control run, trust the test CA, 30 timed helper runs"
        if: ${{ !cancelled() && steps.s6build.outcome == 'success' }}
        shell: bash
        timeout-minutes: 10
        run: bash scratch/r7-s5/ci.sh s6 macos-15
      - name: Self-test of the harness (no key store, no trust store)
        if: ${{ !cancelled() && steps.s6build.outcome == 'success' }}
        shell: bash
        timeout-minutes: 15
        run: bash scratch/r7-s5/ci.sh selftest macos-15

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain and runner facts
        shell: bash
        run: bash scratch/r7-s5/ci.sh facts windows-2025
      - name: "S5: build 1 stores an item, rebuilt build 2 reads it"
        shell: bash
        timeout-minutes: 15
        run: bash scratch/r7-s5/ci.sh s5 windows-2025
      - name: "S6: build the helper, the stub and the driver"
        id: s6build
        if: ${{ !cancelled() }}
        shell: bash
        timeout-minutes: 25
        run: bash scratch/r7-s5/ci.sh s6-build windows-2025
      - name: "S6: control run, trust the test CA, 30 timed helper runs"
        if: ${{ !cancelled() && steps.s6build.outcome == 'success' }}
        shell: bash
        timeout-minutes: 10
        run: bash scratch/r7-s5/ci.sh s6 windows-2025
      - name: Self-test of the harness (no key store, no trust store)
        if: ${{ !cancelled() && steps.s6build.outcome == 'success' }}
        shell: bash
        timeout-minutes: 15
        run: bash scratch/r7-s5/ci.sh selftest windows-2025
