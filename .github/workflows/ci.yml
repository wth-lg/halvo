name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 50-windows-functional
      - name: "sift: probes of verifier-interrogate-7, one process each"
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 14
        shell: bash
        run: |
          set +e
          set -u
          tmp="$RUNNER_TEMP/sift"
          mkdir -p "$tmp"
          cargo test --locked -p halvo-capture --lib --no-run 2>&1 | tail -n 3
          run_probe() { # run_probe <tag> <variable> <module::test> <seconds>
            echo "VI7 step probe=$1 begins"
            env "$2=${3##*::}" timeout "$4" cargo test --locked -p halvo-capture --lib -- --exact "windows::$3" --nocapture --test-threads=1 >"$tmp/$1.log" 2>&1
            code=$?
            tr -d '\r' <"$tmp/$1.log" | grep -a -E 'VI7 |ADV2 |^test result:|panicked at|^error(\[|:)|exit code' | head -n 60
            echo "VI7 step probe=$1 exit=$code"
            if [ "$code" -ne 0 ]; then
              tr -d '\r' <"$tmp/$1.log" | tail -n 15 | sed 's/^/VI7   tail | /'
            fi
          }
          run_probe keys HALVO_SIFT_PROBE sift_probes::sift_keys_at_a_stop_with_the_pump_not_held 330
          run_probe spawnfail-real-control HALVO_SIFT_PROBE sift_probes::sift_a_screen_stop_whose_stop_thread_cannot_be_spawned 150
          n=1
          while [ "$n" -le 6 ]; do
            run_probe "sta-repaired-$n" HALVO_ADV2_PROBE adv2_probe::screen_sessions_begun_on_sta_threads 120
            n=$((n + 1))
          done
          echo "VI7 step one done"
          exit 0
      - name: "sift: changed copies of verifier-interrogate-7"
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 26
        shell: bash
        run: |
          set +e
          set -u
          tmp="$RUNNER_TEMP/sift"
          mkdir -p "$tmp"
          dir=crates/halvo-capture/src/windows
          restore() {
            git checkout --quiet -- "$dir"
            if git diff --quiet HEAD -- "$dir"; then echo "VI7 changed-copy restored=true after=$1"; else echo "VI7 changed-copy restored=false after=$1"; fi
          }
          apply() { # apply <name> <file> <perl substitution>
            if SUBST="$3" perl -0777 -i -pe '$c = eval "\$_ =~ $ENV{SUBST}"; die "no match\n" unless $c;' "$dir/$2" 2>"$tmp/apply-$1.err"; then
              echo "VI7 changed-copy name=$1 file=$2 applied=true added/removed=$(git diff --numstat -- "$dir/$2" | cut -f1,2 | tr '\t' '/')"
              return 0
            fi
            echo "VI7 changed-copy name=$1 file=$2 applied=false"
            restore "$1"
            return 1
          }
          tests_run() { # tests_run <name> <seconds> <arguments of cargo test -p halvo-capture>
            name=$1
            secs=$2
            shift 2
            timeout "$secs" cargo test --locked -p halvo-capture "$@" >"$tmp/$name.log" 2>&1
            code=$?
            ok=$(tr -d '\r' <"$tmp/$name.log" | grep -a -c '^test .* \.\.\. ok$')
            failed=$(tr -d '\r' <"$tmp/$name.log" | grep -a -c '^test .* \.\.\. FAILED$')
            if grep -a -q 'could not compile' "$tmp/$name.log"; then result=no-build
            elif [ "$code" -eq 124 ]; then result=time-limit
            elif [ "$code" -eq 0 ] && [ "$failed" -eq 0 ] && [ "$ok" -gt 0 ]; then result=all-pass
            elif [ "$failed" -gt 0 ]; then result=caught
            else result=unknown
            fi
            echo "VI7 tests name=$name exit=$code ok=$ok failed=$failed result=$result"
            tr -d '\r' <"$tmp/$name.log" | grep -a -E 'VI7 |ADV2 |^test .* \.\.\. FAILED$|^test result|^error(\[|:)|panicked at' | head -n 30 | sed 's/^/VI7   | /'
          }

          tests_run base 600 --lib -- windows::

          if apply os-code-fixed-zero mod.rs 's/code: i64::from\(error\.code\(\)\.0\),/code: i64::from(error.code().0).wrapping_mul(0),/'; then
            tests_run os-code-fixed-zero 600 --lib -- windows::
            timeout 1100 sh scripts/ci/run-ci-d.sh windows 50-windows-functional >"$tmp/functional-os-code-fixed-zero.log" 2>&1
            echo "VI7 functional name=os-code-fixed-zero exit=$? wf_pass=$(tr -d '\r' <"$tmp/functional-os-code-fixed-zero.log" | grep -a -c '^WF .* result=pass') wf_known_defect=$(tr -d '\r' <"$tmp/functional-os-code-fixed-zero.log" | grep -a -c '^WF .* result=known_defect') wf_fail=$(tr -d '\r' <"$tmp/functional-os-code-fixed-zero.log" | grep -a -c '^WF .* result=fail')"
            tr -d '\r' <"$tmp/functional-os-code-fixed-zero.log" | grep -a -E '^WF total=|^WF .* result=fail|^PASS |^FAIL ' | head -n 12 | sed 's/^/VI7   | /'
            restore os-code-fixed-zero
          fi

          if apply last-error-not-read mod.rs 's/os_error\(stage, &windows::core::Error::from_thread\(\)\)/os_error(stage, &windows::core::Error::empty())/'; then
            tests_run last-error-not-read 600 --lib -- windows::
            restore last-error-not-read
          fi

          if apply control-hook-step-renamed foreground.rs 's/super::last_os_error\("SetWinEventHook"\)/super::last_os_error("SetWinEventHookX")/'; then
            tests_run control-hook-step-renamed 600 --lib -- windows::
            restore control-hook-step-renamed
          fi

          if apply stop-thread-spawn-fails screen.rs 's/(let ended_before = session\.finished\(\);)/$1\n        if std::env::var_os("HALVO_SIFT_FAIL_STOP_SPAWN").is_some() {\n            drop(session);\n            return Err(CaptureError::Os {\n                stage: "spawn the screen stop thread",\n                domain: "io",\n                code: 11,\n            });\n        }/'; then
            cat "$dir/sift_fake_test.txt" >>"$dir/screen.rs"
            fake=windows::screen::sift_fake::sift_fake_session_when_the_stop_thread_cannot_be_spawned
            real=windows::sift_probes::sift_a_screen_stop_whose_stop_thread_cannot_be_spawned
            tests_run spawnfail-fake-control 600 --lib -- --exact "$fake" --nocapture --test-threads=1
            export HALVO_SIFT_FAIL_STOP_SPAWN=1
            tests_run spawnfail-fake 300 --lib -- --exact "$fake" --nocapture --test-threads=1
            export HALVO_SIFT_PROBE=sift_a_screen_stop_whose_stop_thread_cannot_be_spawned
            tests_run spawnfail-real 300 --lib -- --exact "$real" --nocapture --test-threads=1
            unset HALVO_SIFT_FAIL_STOP_SPAWN HALVO_SIFT_PROBE
            restore stop-thread-spawn-fails
          fi

          if apply control-mta-reference-skipped screen.rs 's/ *unsafe \{ windows::Win32::System::Com::CoIncrementMTAUsage\(\) \}\r?\n *\.map_err\([^;]*;\r?\n//'; then
            export HALVO_ADV2_PROBE=screen_sessions_begun_on_sta_threads
            n=1
            while [ "$n" -le 6 ]; do
              tests_run "sta-unrepaired-$n" 180 --lib -- --exact windows::adv2_probe::screen_sessions_begun_on_sta_threads --nocapture --test-threads=1
              n=$((n + 1))
            done
            unset HALVO_ADV2_PROBE
            restore control-mta-reference-skipped
          fi
          echo "VI7 step two done"
          exit 0
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
