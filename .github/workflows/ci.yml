name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 16-shell-lint 21-tree-bans 22-daemon-no-dead-allow 23-daemon-port-only 30-core-boundary-proofs 30-mutants
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 16-shell-lint 21-tree-bans 22-daemon-no-dead-allow 23-daemon-port-only 30-core-boundary-proofs 30-mutants
      - name: Lockfile unchanged
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" macos
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional 52-windows-browser 53-windows-prints 21-tree-bans 22-daemon-no-dead-allow 23-daemon-port-only 30-core-boundary-proofs
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 50-windows-functional 52-windows-browser 53-windows-prints 21-tree-bans 22-daemon-no-dead-allow 23-daemon-port-only 30-core-boundary-proofs
      - name: win-4 loops of the unit's tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          cat >"$RUNNER_TEMP/w4-loops.sh" <<'W4_EOF'
          #!/bin/bash
          # win-4's loop step: the unit's in-crate tests 200 rounds in one cargo call a round; its functional tests that open no window
          # 200 rounds, the others 20 rounds, each test in its own process. A round passes when its result lines read every test passed. Prints counts alone.
          set +e
          cd "${GITHUB_WORKSPACE:-.}" || exit 0
          cargo=${W4_CARGO:-cargo}
          export RUST_TEST_THREADS=4
          lib="windows::apps::tests::an_entry_that_names_a_parent_is_dropped
          windows::apps::tests::the_scan_and_the_watch_read_one_list_with_no_per_user_mirror
          windows::apps::tests::a_scan_with_no_key_that_opens_fails
          windows::apps::tests::a_watch_armed_before_the_key_exists_wakes_when_it_is_made
          windows::apps::tests::a_change_made_between_two_waits_wakes_the_second
          windows::apps::tests::the_stop_event_ends_a_wait_and_nothing_to_watch_has_its_own_outcome
          windows::apps::tests::the_keys_are_closed_when_the_scan_and_the_watch_end
          windows::exclusion::tests::the_lineage_over_a_process_table_places_each_process_in_or_out_of_the_tree
          windows::exclusion::tests::the_lineage_keeps_a_parent_while_the_process_keeps_its_creation_time
          windows::exclusion::tests::the_system_lineage_reads_this_process_under_its_parent
          windows::exclusion::tests::a_title_of_a_private_window_is_told_by_its_ending_alone
          windows::exclusion::tests::a_chrome_window_is_kept_only_when_the_query_tells_it_as_not_private
          windows::input::tests::one_raw_sample_with_movement_a_button_and_a_wheel_turn_gives_all_three
          windows::input::tests::movement_while_a_button_is_held_is_a_drag_until_the_button_goes_up
          windows::input::tests::one_key_of_each_class_maps_to_each_class_once
          windows::input::tests::the_folds_close_an_interval_after_1000_ms_and_take_a_handed_back_count
          windows::input::tests::a_raw_input_source_whose_switch_is_off_answers_off_and_installs_nothing
          windows::screen::tests::a_frame_with_no_changed_region_is_idle_where_the_system_reports_regions
          windows::screen::tests::the_screen_source_with_the_default_switches_answers_off_and_delivers_no_frame
          windows::tests::the_content_probe_of_a_gate_reads_its_field_state
          windows::tests::one_event_of_each_kind_reaches_the_model_store_in_the_shape_of_c13
          windows::tests::a_gone_writer_counts_the_queued_events
          windows::tests::a_listed_app_in_front_drops_every_kind_and_counts_each_drop
          windows::tests::a_push_does_not_wait_for_a_full_sink
          windows::tests::the_age_of_an_event_is_read_across_the_wrap_of_the_tick_count
          windows::window_title::tests::the_site_reader_point_gives_no_site_in_r1
          windows::window_title::tests::a_title_leaves_no_event_while_the_gate_reads_password_and_one_while_it_reads_unknown
          windows::window_title::tests::a_title_source_whose_switch_is_off_answers_off"
          fast="c5_three_probe_entries_against_what_windows_lists
          c5_watch_armed_while_the_per_user_key_is_absent
          x16_packaged_apps_and_the_inventory"
          tf="x13_frames_on_a_static_screen
          one_key_of_each_class_gives_one_keystroke_record_of_each_class
          pointer_events_fold_into_one_record_for_each_class_and_interval
          a_window_under_the_exclusion_root_gives_no_event_and_another_window_does
          a_title_change_while_a_password_edit_has_the_focus_gives_no_title_event
          capture_times_follow_the_input_order"
          lib_count=$(printf '%s\n' "$lib" | grep -c .)
          want="test result: ok. $lib_count passed"
          # shellcheck disable=SC2086
          "$cargo" test -p halvo-capture --lib --no-run >/dev/null 2>&1
          "$cargo" test -p halvo-capture --test windows_functional --no-run >/dev/null 2>&1
          pass=0
          for round in $(seq 1 200); do
            # shellcheck disable=SC2046
            out=$("$cargo" test -p halvo-capture --lib -- --exact $(printf '%s ' $lib) 2>&1)
            if printf '%s\n' "$out" | grep -q "^$want;"; then
              pass=$((pass + 1))
            else
              echo "loop win4-lib round=$round failed:"
              printf '%s\n' "$out" | grep -E '^test .*FAILED|^test result|panicked at' | head -6
            fi
          done
          echo "loop win4-lib: passed $pass of 200 (tests_a_round=$lib_count)"
          pass=0
          for round in $(seq 1 200); do
            ok=1
            for name in $fast; do
              out=$("$cargo" test -p halvo-capture --test windows_functional -- --exact "$name" --ignored 2>&1)
              if ! printf '%s\n' "$out" | grep -q '^test result: ok. 1 passed;'; then
                ok=0
                echo "loop win4-functional-fast round=$round test=$name failed"
                printf '%s\n' "$out" | grep -E '^test result|panicked at' | head -3
              fi
            done
            [ "$ok" = 1 ] && pass=$((pass + 1))
          done
          echo "loop win4-functional-fast: passed $pass of 200 (tests_a_round=$(printf '%s\n' "$fast" | grep -c .))"
          pass=0
          for round in $(seq 1 20); do
            ok=1
            for name in $tf; do
              out=$("$cargo" test -p halvo-capture --test windows_functional -- --exact "$name" --ignored 2>&1)
              if ! printf '%s\n' "$out" | grep -q '^test result: ok. 1 passed;'; then
                ok=0
                echo "loop win4-functional round=$round test=$name failed"
                printf '%s\n' "$out" | grep -E '^test result|panicked at' | head -3
              fi
            done
            [ "$ok" = 1 ] && pass=$((pass + 1))
          done
          echo "loop win4-functional: passed $pass of 20 (tests_a_round=$(printf '%s\n' "$tf" | grep -c .))"
          exit 0
          W4_EOF
          bash "$RUNNER_TEMP/w4-loops.sh" | tee "$RUNNER_TEMP/w4-loops.log"
          grep -q '^loop win4-lib: passed 200 of 200 ' "$RUNNER_TEMP/w4-loops.log" && grep -q '^loop win4-functional-fast: passed 200 of 200 ' "$RUNNER_TEMP/w4-loops.log" && grep -q '^loop win4-functional: passed 20 of 20 ' "$RUNNER_TEMP/w4-loops.log"
      - name: win-4 one-rule changes at the head
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          W4_PARTS: ''
          W4_CHANGES: ''
        run: |
          set +e
          cat >"$RUNNER_TEMP/w4-proof.sh" <<'W4_EOF'
          #!/bin/bash
          # win-4's hosted proof step: each part's tests at its test-first commit and its fix commit, then the one-rule changes.
          # Reads two base64 lists from the environment: W4_PARTS (commit, part, kind, name) and W4_CHANGES (id, file, kind, name, statement).
          # Prints counts, exits and test names only. Never ends the job: every command's exit is read and printed.
          set +e
          cd "${GITHUB_WORKSPACE:-.}" || exit 0
          export CARGO_TARGET_DIR="${GITHUB_WORKSPACE:-$PWD}/target"
          export CARGO_BUILD_JOBS=4
          export RUST_TEST_THREADS=4
          cargo=${W4_CARGO:-cargo}
          head=$(git rev-parse HEAD~1)
          echo "w4 head=$head"
          if [ -z "${W4_DRY:-}" ]; then
            git fetch --quiet --deepen=80 origin "${GITHUB_REF:-HEAD}"
            echo "w4 deepen_exit=$?"
          fi
          proof="${RUNNER_TEMP:-/tmp}/w4-proof"
          git worktree add --quiet --detach "$proof" "$head"
          echo "w4 worktree_exit=$?"
          cd "$proof" || exit 0
          printf '%s' "$W4_PARTS" | base64 -d >"${RUNNER_TEMP:-/tmp}/w4-parts.tsv"
          printf '%s' "$W4_CHANGES" | base64 -d >"${RUNNER_TEMP:-/tmp}/w4-changes.tsv"

          run_lib() {
            out=$("$cargo" test --quiet -p halvo-capture --lib -- --exact "$1" 2>&1)
            e=$?
            printf '%s\n' "$out" | grep -E '^test |^test result|panicked at|KNOWN-DEFECT' | head -8
            return $e
          }

          run_tf() {
            out=$("$cargo" test --quiet -p halvo-capture --test windows_functional -- --exact "$1" --ignored --nocapture 2>&1)
            e=$?
            printf '%s\n' "$out" | grep -E '^test result|KNOWN-DEFECT|panicked at|^TF [a-z0-9-]+ (result|.*=)' | head -12
            return $e
          }

          while IFS="$(printf '\t')" read -r commit part kind name; do
            [ -n "$commit" ] || continue
            git checkout --quiet --detach "$commit"
            co=$?
            if [ "$kind" = lib ]; then
              run_lib "$name"
            else
              run_tf "$name"
            fi
            e=$?
            echo "w4 part=$part commit=$(printf '%.9s' "$commit") kind=$kind test=$name checkout_exit=$co test_exit=$e"
          done <"${RUNNER_TEMP:-/tmp}/w4-parts.tsv"

          git checkout --quiet --detach "$head"
          while IFS="$(printf '\t')" read -r id file kind name statement; do
            [ -n "$id" ] || continue
            perl -0777 -pi -e "$statement" "$file"
            if git diff --quiet -- "$file"; then
              echo "w4 change=$id apply_exit=1 build_exit=- test_exit=- reason_lines=0"
              continue
            fi
            if [ "$kind" = lib ]; then
              "$cargo" test --quiet -p halvo-capture --lib --no-run >/dev/null 2>&1
              b=$?
            else
              "$cargo" test --quiet -p halvo-capture --test windows_functional --no-run >/dev/null 2>&1
              b=$?
            fi
            t=-
            reasons=0
            if [ "$b" = 0 ]; then
              if [ "$kind" = lib ]; then
                lines=$(run_lib "$name")
              else
                lines=$(run_tf "$name")
              fi
              t=$?
              reasons=$(printf '%s\n' "$lines" | grep -c -E 'panicked at|KNOWN-DEFECT')
              printf '%s\n' "$lines" | grep -E '^test result|panicked at' | head -3 | sed "s/^/w4 change=$id /"
            fi
            echo "w4 change=$id apply_exit=0 build_exit=$b test_exit=$t reason_lines=$reasons"
            git checkout --quiet -- "$file"
          done <"${RUNNER_TEMP:-/tmp}/w4-changes.tsv"
          echo "w4 status_lines_after=$(git status --porcelain | wc -l | tr -d ' ')"
          exit 0
          W4_EOF
          bash "$RUNNER_TEMP/w4-proof.sh"
          exit 0
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" cat-file blob "$GITHUB_SHA:scripts/lockfile-unchanged.sh" >"$RUNNER_TEMP/lockfile-unchanged.sh"
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" windows
          sh "$RUNNER_TEMP/lockfile-unchanged.sh" --self-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
