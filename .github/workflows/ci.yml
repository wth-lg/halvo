name: ci
# scratch: the join of sqlcipher-1 with main 2535f66a, the ordinary jobs with ci.d whole and a third job that runs every row of three rows files to its end by name; never merged

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - name: Self-tests that commit in throwaway repositories
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: |
          sh scripts/check-commit-messages.sh --self-test-two-paths
          sh scripts/check-commit-messages.sh --self-test-pre-push
          sh scripts/ci-commit-messages.sh --self-test
          sh scripts/merge-pr.sh --self-test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos
      - name: Build
        shell: bash
        run: npm run tauri build
      - name: Version
        shell: bash
        run: test "$(target/release/bundle/macos/Halvo.app/Contents/MacOS/halvo --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-macos
          path: target/release/bundle/macos/Halvo.app
          if-no-files-found: error
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows
      - name: Build
        shell: bash
        run: npm run tauri build -- --no-bundle
      - name: Version
        shell: bash
        run: test "$(target/release/halvo.exe --version)" = 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: halvo-windows
          path: target/release/halvo.exe
          if-no-files-found: error
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
  macos-rows:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: "Every row of the store's, custody's and halvo-sqlcipher's rows files to its end by name, with the first failing line of each (scratch)"
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ROWS_FILES: crates/halvo-capture/src/store/mutants.rows crates/halvo-capture/src/custody/mutants.rows crates/halvo-sqlcipher/mutants.rows
        run: |
          set +e -u
          runner=${HALVO_STEP_RUNNER:-scripts/r1-gate/mutation-test.sh}
          tmp=${RUNNER_TEMP:-/tmp}
          out="$tmp/gate-rows.out"
          log="$tmp/gate-cargo-runs.log"
          home="$tmp/gate-cargo-home"
          : >"$log"
          GATE_REAL_CARGO=$(command -v "${HALVO_STEP_CARGO:-cargo}")
          [ -n "$GATE_REAL_CARGO" ] || { printf 'ROWS no cargo on PATH\n'; exit 1; }
          GATE_CARGO_HOME_WAS=${CARGO_HOME-unset}
          GATE_CARGO_LOG=$log
          export GATE_REAL_CARGO GATE_CARGO_HOME_WAS GATE_CARGO_LOG
          PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
          printf 'ROWS real cargo %s; CARGO_HOME before the step: %s\n' "$GATE_REAL_CARGO" "$GATE_CARGO_HOME_WAS"
          mkdir -p "$home/bin"
          cat >"$home/bin/cargo" <<'WRAP'
          #!/bin/sh
          # logs each cargo test run with its start and end time and its output; every other cargo command passes through
          if [ "$GATE_CARGO_HOME_WAS" = unset ]; then unset CARGO_HOME; else CARGO_HOME=$GATE_CARGO_HOME_WAS; export CARGO_HOME; fi
          case "${1:-}" in test) ;; *) exec "$GATE_REAL_CARGO" "$@" ;; esac
          f=$(mktemp "${TMPDIR:-/tmp}/gate-cargo-run.XXXXXX")
          start=$(perl -MTime::HiRes=time -e 'printf "%.3f", time')
          "$GATE_REAL_CARGO" "$@" >"$f" 2>&1
          code=$?
          end=$(perl -MTime::HiRes=time -e 'printf "%.3f", time')
          { printf '=== START %s %s\n' "$start" "$*"; cat "$f"; printf '=== END %s exit %s\n' "$end" "$code"; } >>"$GATE_CARGO_LOG"
          cat "$f"
          exit "$code"
          WRAP
          chmod +x "$home/bin/cargo"
          names=''
          # shellcheck disable=SC2086 # the list of rows files is split on purpose
          for f in $ROWS_FILES; do
            n=$(awk -F '\t' 'NF == 6 { print $1 }' "$f")
            printf 'ROWS file %s: %s names\n' "$f" "$(printf '%s\n' "$n" | grep -c .)"
            names="$names $n"
          done
          # shellcheck disable=SC2086 # the names are split on purpose
          total=$(printf '%s\n' $names | grep -c .)
          printf 'ROWS names given: %s\n' "$total"
          set --
          for n in $names; do set -- "$@" --only "$n"; done
          t0=$(date +%s)
          CARGO_HOME="$home" sh "$runner" "$@" 2>&1 | perl -MTime::HiRes=time -ne '$| = 1; printf "%.3f %s", time, $_' >"$out"
          code=${PIPESTATUS[0]}
          printf 'ROWS runner exit %s, seconds %s\n' "$code" "$(($(date +%s) - t0))"
          cut -d ' ' -f 2- "$out" | grep -E '^(PASS|FAIL|OPEN|NOT-RUN|RETIRED|STOPPED|MOVED) (unmutated|mutation)|^seconds mutation:|^mutation rows:' | cut -c1-500 | sed 's/^/ROWS /'
          # shellcheck disable=SC2086 # the list of rows files is split on purpose
          python3 - "$out" "$log" "$total" $ROWS_FILES <<'PY'
          import re, sys
          out, log, total, files = sys.argv[1], sys.argv[2], int(sys.argv[3]), sys.argv[4:]
          verdict = {}
          for f in files:
              for line in open(f, encoding="utf-8"):
                  part = line.rstrip("\r\n").split("\t")
                  if len(part) == 6:
                      verdict[part[0]] = part[3]
          runs, cur = [], None
          for line in open(log, encoding="utf-8", errors="replace"):
              if line.startswith("=== START "):
                  _, _, start, args = line.rstrip("\n").split(" ", 3)
                  cur = {"start": float(start), "args": args, "lines": []}
              elif line.startswith("=== END ") and cur is not None:
                  part = line.split()
                  cur["end"], cur["exit"] = float(part[2]), part[4]
                  runs.append(cur)
                  cur = None
              elif cur is not None:
                  cur["lines"].append(line.rstrip("\n"))
          def first_failing_line(lines):
              for i, line in enumerate(lines):
                  if "panicked at" in line:
                      where = line.split("panicked at", 1)[1].strip().rstrip(":")
                      message = next((l.strip() for l in lines[i + 1:] if l.strip()), "")
                      return f"{message} (at {where})"
              result = [l for l in lines if l.startswith("test result:")]
              return "no panic line; " + (result[-1] if result else "no result line")
          seen, caught, problems = set(), 0, []
          for raw in open(out, encoding="utf-8", errors="replace"):
              stamp, _, line = raw.rstrip("\n").partition(" ")
              m = re.match(r"^(PASS|FAIL|OPEN|NOT-RUN|RETIRED|STOPPED|MOVED) mutation:(\S+) \((.*)\)$", line)
              if not m or m.group(2) not in verdict:
                  continue
              state, name, says = m.groups()
              seen.add(name)
              v = verdict[name]
              if state == "PASS":
                  caught += 1
              else:
                  problems.append(f"{name}: {line}")
              if v.startswith("test "):
                  test = v[5:]
                  before = [r for r in runs if r["end"] <= float(stamp)]
                  run = before[-1] if before else None
                  if run is None:
                      first = "no cargo test run before the result line"
                  elif not run["args"].endswith("--exact " + test):
                      first = f"the last cargo test run before the result line ran {run['args']!r}"
                  else:
                      first = first_failing_line(run["lines"])
              else:
                  first = says.split("gate said: ", 1)[1] if "gate said: " in says else says
              print("TABLE\t" + "\t".join([name, v, state, first.replace("\t", " ")[:600]]))
          missing = sorted(set(verdict) - seen)
          for name in missing:
              problems.append(f"{name}: no result line")
          count = [l.split(" ", 1)[1].rstrip("\n") for l in open(out, encoding="utf-8", errors="replace") if l.split(" ", 1)[-1].startswith("mutation rows: ")]
          print("COUNT " + (count[-1] if count else "no count line"))
          m = re.match(r"mutation rows: (\d+) caught, (\d+) failed, (\d+) open, (\d+) transitional, (\d+) for the measuring Mac not run", count[-1]) if count else None
          ok = bool(m) and int(m.group(1)) == total and m.group(2) == m.group(3) == m.group(5) == "0" and caught == total and not problems and len(verdict) == total
          print(f"COUNT names given {total}, rows read {len(verdict)}, PASS lines {caught}, other lines or none {len(problems)}: {'every row caught' if ok else 'NOT every row caught'}")
          for p in problems:
              print("PROBLEM " + p[:600])
          sys.exit(0 if ok else 1)
          PY
