name: ci

on:
  push:

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Probe a core.autocrlf=true clone before and after the eol attribute
        shell: bash
        run: |
          set +e
          echo "core.autocrlf of the runner: $(git config --show-origin --get-all core.autocrlf)"
          git --version
          sh --version | head -1
          echo "line endings of the checkout of the runner:"
          git ls-files --eol -- '*.sh' '.githooks/*' CHANGELOG.md
          probe() {
            label=$1 commit=$2
            clone="$RUNNER_TEMP/probe-$label"
            git clone --quiet --no-checkout -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
            cd "$clone" || return
            git checkout --quiet --detach "$commit"
            echo "=== $label: $(git rev-parse HEAD)"
            git ls-files --eol -- '*.sh' '.githooks/*' CHANGELOG.md
            for script in check-commit-messages check-changelog check-line-endings; do
              sh "scripts/$script.sh" --self-test
              echo "--- $label: sh scripts/$script.sh --self-test exit=$?"
            done
            sh scripts/check-line-endings.sh
            echo "--- $label: sh scripts/check-line-endings.sh exit=$?"
            sh scripts/check-changelog.sh 2>&1 | tail -3
            echo "--- $label: sh scripts/check-changelog.sh exit=${PIPESTATUS[0]}"
            git config core.hooksPath .githooks
            git config user.name "Halvo CI"
            git config user.email "ci@halvo.invalid"
            git commit --allow-empty -m "Probe the commit-msg hook with a clean message"
            echo "--- $label: clean commit exit=$?"
            git commit --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>"
            echo "--- $label: trailer commit exit=$?"
            git log --oneline -3
            cd "$GITHUB_WORKSPACE" || return
          }
          probe before HEAD~1
          probe after HEAD
          exit 0
