name: ci
# scratch: trimmed to one unit's checks; never merged

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: daemon-1 growth at 2048 slots, twice (HEAD^)
        shell: bash
        run: |
          set -u
          git checkout HEAD^ -- crates/halvo-capture/src/daemon/owner.rs
          grep -n 'pub const QUEUE_SLOTS' crates/halvo-capture/src/daemon/owner.rs
          bin=$(cargo test --locked -q -p halvo-capture --lib --no-run --message-format json 2>/dev/null | python3 -c "import json,sys; print([m['executable'] for m in map(json.loads, sys.stdin) if m.get('reason') == 'compiler-artifact' and m.get('executable') and m['target']['name'] == 'halvo_capture'][-1])")
          out=$(mktemp)
          for round in 1 2; do
            "$bin" --exact daemon::owner::tests::two_million_floor_records_grow_the_owner_by_at_most_the_bound --nocapture --test-threads=1 >"$out" 2>&1 || true
            line=$(grep -o 'owner_growth_bytes=[0-9]* records=[0-9]* elapsed_ms=[0-9]*' "$out" | head -n 1)
            detail=$(grep -o 'owner_growth_detail .*' "$out" | head -n 1)
            n=${line#owner_growth_bytes=}
            n=${n%% *}
            if [ -n "$line" ] && [ "$n" -le 8388608 ]; then verdict="at or under 8388608"; elif [ -n "$line" ]; then verdict="above 8388608"; else verdict="no line"; tail -n 30 "$out"; fi
            echo "daemon-1 growth depth 2048 round $round: $line"
            echo "daemon-1 growth depth 2048 round $round: $detail"
            echo "daemon-1 growth depth 2048 round $round: verdict $verdict"
          done
      - name: daemon-1 loop (the unit's new tests but the growth test, 200 runs each)
        shell: bash
        run: |
          set -u
          bin=$(cargo test --locked -q -p halvo-capture --lib --no-run --message-format json 2>/dev/null | python3 -c "import json,sys; print([m['executable'] for m in map(json.loads, sys.stdin) if m.get('reason') == 'compiler-artifact' and m.get('executable') and m['target']['name'] == 'halvo_capture'][-1])")
          names='daemon::tests::seconds_outside_1_to_604800_give_usage daemon::tests::a_bad_switch_flag_and_a_switch_beside_another_mode_give_usage daemon::tests::two_switch_flags_parse_to_their_values_with_both_names_set daemon::tests::a_store_dir_is_required_absolute_existing_and_clear_of_the_data_directory daemon::tests::the_verify_modes_take_their_flags_and_nothing_else daemon::tests::the_hold_needs_two_seconds_and_is_a_flag_of_macos daemon::tests::an_argument_that_is_not_utf8_gives_usage daemon::tests::a_default_timed_run_starts_no_screen_source_and_the_switch_flag_starts_it daemon::tests::a_source_that_fails_to_start_leaves_a_full_length_run_that_exits_3 daemon::tests::a_signalled_timed_run_prints_its_report daemon::tests::the_hold_is_taken_after_the_released_phase_ends daemon::tests::a_tap_that_delivers_no_key_fails_the_control daemon::tests::a_refused_hold_ends_the_run_with_no_report daemon::tests::a_batch_refused_at_the_final_settle_gives_exit_1_and_a_loss_line daemon::tests::a_drain_that_still_fails_at_the_deadline_gives_exit_1_with_the_held_events daemon::tests::a_drop_with_no_write_since_gives_exit_1_and_one_that_a_good_write_followed_exit_0 daemon::tests::a_last_settle_with_no_answer_gives_exit_1 daemon::tests::nine_events_of_the_kinds_with_no_source_give_three_lines_with_count_3 daemon::tests::the_sources_of_a_run_leave_out_what_the_switches_turn_off daemon::tests::a_source_that_does_not_stop_adds_its_line_and_exits_3 daemon::tests::a_drop_at_the_last_settle_that_a_good_write_follows_gives_exit_1 daemon::tests::a_store_write_that_parks_the_owner_in_the_window_ends_the_run_inside_its_bounds daemon::owner::tests::one_fault_and_two_settles_with_the_clock_still_drop_nothing daemon::owner::tests::a_fault_that_does_not_end_drops_the_batch_at_its_third_due_try daemon::owner::tests::another_fault_at_an_early_try_ends_the_run_of_identical_failures daemon::owner::tests::settles_during_an_io_fault_leave_the_next_due_try_where_it_was daemon::owner::tests::a_sealed_batch_is_given_up_at_its_first_answer daemon::owner::tests::a_drop_then_a_good_write_clears_the_count_since_the_last_acknowledged_write daemon::owner::tests::a_store_that_takes_nothing_keeps_the_count_between_two_drops daemon::owner::tests::a_dropped_batch_reports_its_instants_and_fault_and_the_snapshot_keeps_them daemon::owner::tests::an_event_in_the_hands_of_a_pass_at_open_pause_is_not_stored_and_is_discarded_by_the_barrier daemon::owner::tests::a_pass_answers_the_waiting_commands_before_it_waits_for_an_event daemon::report::tests::the_passing_fixture_renders_from_typed_values daemon::report::tests::the_failing_input_fixture_renders_from_an_error_the_code_raises daemon::report::tests::the_hold_fixture_renders_its_six_lines_from_typed_values daemon::report::tests::the_peak_line_is_a_positive_byte_count'
          want=36
          out=$(mktemp)
          pass=0
          # shellcheck disable=SC2086
          for _ in $(seq 200); do
            if "$bin" --exact $names --test-threads=4 >"$out" 2>&1 && grep -q "^test result: ok. $want passed" "$out"; then pass=$((pass + 1)); else tail -n 30 "$out"; fi
          done
          echo "daemon-1 loop (macos): binary $(basename "$bin"): tests $want, runs 200, passes $pass"
          if [ "$pass" = 200 ]; then echo "daemon-1 loop verdict: all passed"; else echo "daemon-1 loop verdict: $((200 - pass)) runs failed"; fi
      - name: daemon-1 growth at 1024 slots, twice (HEAD)
        shell: bash
        run: |
          set -u
          git checkout HEAD -- crates/halvo-capture/src/daemon/owner.rs
          grep -n 'pub const QUEUE_SLOTS' crates/halvo-capture/src/daemon/owner.rs
          bin=$(cargo test --locked -q -p halvo-capture --lib --no-run --message-format json 2>/dev/null | python3 -c "import json,sys; print([m['executable'] for m in map(json.loads, sys.stdin) if m.get('reason') == 'compiler-artifact' and m.get('executable') and m['target']['name'] == 'halvo_capture'][-1])")
          out=$(mktemp)
          for round in 1 2; do
            "$bin" --exact daemon::owner::tests::two_million_floor_records_grow_the_owner_by_at_most_the_bound --nocapture --test-threads=1 >"$out" 2>&1 || true
            line=$(grep -o 'owner_growth_bytes=[0-9]* records=[0-9]* elapsed_ms=[0-9]*' "$out" | head -n 1)
            detail=$(grep -o 'owner_growth_detail .*' "$out" | head -n 1)
            n=${line#owner_growth_bytes=}
            n=${n%% *}
            if [ -n "$line" ] && [ "$n" -le 8388608 ]; then verdict="at or under 8388608"; elif [ -n "$line" ]; then verdict="above 8388608"; else verdict="no line"; tail -n 30 "$out"; fi
            echo "daemon-1 growth depth 1024 round $round: $line"
            echo "daemon-1 growth depth 1024 round $round: $detail"
            echo "daemon-1 growth depth 1024 round $round: verdict $verdict"
          done
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: windows not run in this scratch copy
        shell: bash
        run: echo 'the measure of DM-8 (4) runs in the macos job alone'