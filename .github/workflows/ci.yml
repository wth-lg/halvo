name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: the windows job alone (no macos job in this copy)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rust components
        shell: bash
        run: rustup component add clippy rustfmt
      - name: "adv3: probes of interrogate-win2-adversary-3"
        shell: bash
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set +e -u
          mkdir -p "$RUNNER_TEMP/adv3"
          log="$RUNNER_TEMP/adv3/probes.log"
          timeout 1200 cargo test --locked -p halvo-capture --lib -- --ignored adv3_ --nocapture --test-threads=1 >"$log" 2>&1
          code=$?
          echo "ADV3 probes exit=$code"
          tr -d '\r' <"$log" | grep -a -E '^ADV3|^test .* \.\.\. |panicked at|^test result|^error(\[|:)|INCONCLUSIVE|neither delivered|lost counts|arrive after|motion sample took' | sed 's/^/ADV3 | /'
      - name: "adv3: one-rule changes of interrogate-win2-adversary-3"
        shell: bash
        continue-on-error: true
        timeout-minutes: 28
        run: |
          set +e -u
          mkdir -p "$RUNNER_TEMP/adv3"
          file=crates/halvo-capture/src/windows/mod.rs
          list="$RUNNER_TEMP/adv3/rows.tsv"
          printf '%s\t%s\n' \
            'base' '' \
            'close-does-not-refuse' 's/self\.shared\.lock\(\)\.closed = true;/drop(self.shared.lock());/' \
            'motion-not-counted-when-writer-gone' 's/let left = queue\.packets\.len\(\) \+ usize::from\(queue\.motion\.is_some\(\)\);/let left = queue.packets.len();/' \
            'closed-push-also-queues' 's/(if queue\.closed \{\r?\n\s+self\.shared\.counts\.lose\(1\);\r?\n)\s+return;\r?\n(\s+\}\r?\n\s+if queue\.packets\.len\(\) < HANDOFF_CAPACITY)/$1$2/' \
            'control-writer-gone-not-closed' 's/queue\.closed = true;\r?\n(\s+)queue\.writer_gone = true;/queue.writer_gone = true;/' \
            >"$list"
          tab=$(printf '\t')
          n=0
          while IFS="$tab" read -r name subst; do
            [ -n "$name" ] || continue
            n=$((n + 1))
            git checkout --quiet -- "$file"
            if [ -n "$subst" ]; then
              if ! SUBST="$subst" perl -0777 -i -pe '$c = eval "\$_ =~ $ENV{SUBST}"; die "no match\n" unless $c;' "$file" 2>"$RUNNER_TEMP/adv3/apply-$n.err"; then
                echo "ADV3 mutant name=$name result=not-applied"
                git checkout --quiet -- "$file"
                continue
              fi
            fi
            log="$RUNNER_TEMP/adv3/mutant-$n.log"
            began=$(date +%s)
            timeout 600 cargo test --locked -p halvo-capture --lib -- windows:: >"$log" 2>&1
            code=$?
            ended=$(date +%s)
            ok=$(tr -d '\r' <"$log" | grep -a -c '^test .* \.\.\. ok$')
            failed=$(tr -d '\r' <"$log" | grep -a -c '^test .* \.\.\. FAILED$')
            ignored=$(tr -d '\r' <"$log" | grep -a -c '^test .* \.\.\. ignored')
            if grep -a -q 'could not compile' "$log"; then result=no-build
            elif [ "$code" -eq 124 ]; then result=time-limit
            elif [ "$code" -eq 0 ] && [ "$failed" -eq 0 ] && [ "$ok" -gt 0 ]; then result=all-pass
            elif [ "$failed" -gt 0 ]; then result=caught
            else result=unknown
            fi
            echo "ADV3 mutant name=$name exit=$code ok=$ok failed=$failed ignored=$ignored result=$result seconds=$((ended - began))"
            tr -d '\r' <"$log" | grep -a -E '^test .* \.\.\. FAILED$|^test result|^error(\[|:)' | head -8 | sed 's/^/ADV3   /'
            git checkout --quiet -- "$file"
          done <"$list"
          git diff --quiet HEAD -- "$file" || echo "ADV3 mutants: the checkout differs from the head after the run"
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 50-windows-functional
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 50-windows-functional
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
