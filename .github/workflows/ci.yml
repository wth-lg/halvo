name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: halvo-coord tests
        shell: bash
        run: |
          start=$(date +%s)
          cargo test -p halvo-coord
          echo "seconds halvo-coord-tests $(( $(date +%s) - start ))"
      - name: Words and layout
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-r4-layout 45-r4-words
      - name: Page harness fetch
        shell: bash
        run: |
          start=$(date +%s)
          sh tools/r4-page/fetch.sh "$RUNNER_TEMP/r4-page-browsers"
          echo "seconds fetch $(( $(date +%s) - start ))"
      - name: Needs view tests
        shell: bash
        env:
          R4_PAGE_BROWSERS: ${{ runner.temp }}/r4-page-browsers
        run: |
          start=$(date +%s)
          node ui/tests/r4/needs/needs.test.mjs
          echo "seconds needs-tests $(( $(date +%s) - start ))"
      - name: Harness self-test
        shell: bash
        env:
          R4_PAGE_BROWSERS: ${{ runner.temp }}/r4-page-browsers
        run: |
          start=$(date +%s)
          node tools/r4-page/selftest.mjs
          echo "seconds harness-selftest $(( $(date +%s) - start ))"
      - name: Needs page checks
        shell: bash
        env:
          R4_PAGE_BROWSERS: ${{ runner.temp }}/r4-page-browsers
        run: |
          start=$(date +%s)
          node ui/tests/r4/needs/page.mjs
          echo "seconds needs-page $(( $(date +%s) - start ))"
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: halvo-coord tests
        shell: bash
        run: |
          start=$(date +%s)
          cargo test -p halvo-coord
          echo "seconds halvo-coord-tests $(( $(date +%s) - start ))"
      - name: Words and layout
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-r4-layout 45-r4-words
      - name: Page harness fetch
        shell: bash
        run: |
          start=$(date +%s)
          sh tools/r4-page/fetch.sh "$RUNNER_TEMP/r4-page-browsers"
          echo "seconds fetch $(( $(date +%s) - start ))"
      - name: Needs view tests
        shell: bash
        env:
          R4_PAGE_BROWSERS: ${{ runner.temp }}/r4-page-browsers
        run: |
          start=$(date +%s)
          node ui/tests/r4/needs/needs.test.mjs
          echo "seconds needs-tests $(( $(date +%s) - start ))"
      - name: Harness self-test
        shell: bash
        env:
          R4_PAGE_BROWSERS: ${{ runner.temp }}/r4-page-browsers
        run: |
          start=$(date +%s)
          node tools/r4-page/selftest.mjs
          echo "seconds harness-selftest $(( $(date +%s) - start ))"
      - name: Needs page checks
        shell: bash
        env:
          R4_PAGE_BROWSERS: ${{ runner.temp }}/r4-page-browsers
        run: |
          start=$(date +%s)
          node ui/tests/r4/needs/page.mjs
          echo "seconds needs-page $(( $(date +%s) - start ))"
