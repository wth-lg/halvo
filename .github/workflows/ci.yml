name: ci
# scratch: trimmed to one unit's checks; never merged
# scratch: steps added by scratch-ci.py

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Commit messages
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: sh scripts/ci-commit-messages.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - name: Changelog
        shell: bash
        run: |
          sh scripts/check-changelog.sh --self-test
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git rev-parse --quiet --verify 'HEAD^2^{commit}' >/dev/null; then
              base=$(git rev-parse 'HEAD^1')
              echo "Changelog: the base of the entry check is $base, the first parent of the merge commit that actions/checkout made."
            else
              base=$(git merge-base HEAD "refs/remotes/origin/$GITHUB_BASE_REF") || {
                echo "Changelog: HEAD has one parent and no merge base with refs/remotes/origin/$GITHUB_BASE_REF in this checkout. Fix: fetch the base branch with its history (fetch-depth: 0 on actions/checkout)."
                exit 2
              }
              echo "Changelog: HEAD has one parent, so the base of the entry check is $base, its merge base with origin/$GITHUB_BASE_REF."
            fi
            sh scripts/check-changelog.sh --base "$base"
          else
            sh scripts/check-changelog.sh
          fi
      - name: Line endings
        shell: bash
        run: |
          sh scripts/check-line-endings.sh --self-test
          sh scripts/check-line-endings.sh
      - name: Own-source reads
        shell: bash
        run: |
          sh scripts/check-own-source-reads.sh --self-test
          sh scripts/check-own-source-reads.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh macos --self-test 46-r4-dialog-ran
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; processors: %s\n' "$(sysctl -n machdep.cpu.brand_string)" "$(sysctl -n hw.ncpu)"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh macos 10-format 11-clippy 12-test 46-r4-dialog-ran
      - name: r4-55 forced form at the base and at the head
        if: always()
        timeout-minutes: 40
        shell: bash
        run: |
          set +e
          build() {
            cargo test -p halvo-coord-app --locked --no-run --message-format=json --test guard_hosted --test dialog_hosted > "$RUNNER_TEMP/r455-build-$1.json" 2> "$RUNNER_TEMP/r455-build-$1.err"
            echo "r455 build $1 exit=$?; tracked files changed $(git status --porcelain --untracked-files=no | wc -l | tr -d ' ')"
          }
          exe() { grep -o '"executable":"[^"]*"' "$RUNNER_TEMP/r455-build-$1.json" | sed 's/"executable":"//; s/"$//' | grep "/deps/$2-" | head -1; }
          one() {
            label=$1; shift
            start=$(date +%s)
            "$@" > "$RUNNER_TEMP/r455-$label.raw" 2>&1
            code=$?
            took=$(( $(date +%s) - start ))
            tr -d '\r' < "$RUNNER_TEMP/r455-$label.raw" > "$RUNNER_TEMP/r455-$label.txt"
            hit=$(grep -c '^guard_hosted reading macos reject_action_at_100ms: the show returned after [0-9]* ms with no report and answered reject$' "$RUNNER_TEMP/r455-$label.txt")
            none=$(grep -c '^[a-z_]*_hosted .*the show returned after [0-9]* ms with no report\|never read' "$RUNNER_TEMP/r455-$label.txt")
            ends=$(grep '^[a-z_]*_hosted end: ' "$RUNNER_TEMP/r455-$label.txt" | tr '\n' ';')
            echo "r455 run $label exit=$code seconds=$took; first-case hit $hit; lines of a show with no report or never read $none; end: ${ends:-none}"
            sed "s/^/r455 $label: /" "$RUNNER_TEMP/r455-$label.txt"
          }
          base=4bb7719b093a5faf40fbe3cda35cda831f63a831
          for f in tests/guard_hosted.rs tests/dialog_hosted.rs tests/hosted/activation.rs; do
            git show "$base:crates/halvo-coord-app/$f" > "crates/halvo-coord-app/$f"
          done
          build pristine-base
          one pristine-base-guard-plain "$(exe pristine-base guard_hosted)"
          git checkout -- crates/halvo-coord-app
          cp scratch-r455/system.rs crates/halvo-coord-app/src/present/system.rs
          cp scratch-r455/guard_hosted.rs crates/halvo-coord-app/tests/guard_hosted.rs
          cp scratch-r455/dialog_hosted.rs crates/halvo-coord-app/tests/dialog_hosted.rs
          git show "$base:crates/halvo-coord-app/tests/hosted/activation.rs" > crates/halvo-coord-app/tests/hosted/activation.rs
          build base
          one base-guard-forced env HALVO_HOSTED_LATE_RUN_MS=2000 "$(exe base guard_hosted)"
          one base-dialog-forced env HALVO_HOSTED_LATE_RUN_MS=2000 "$(exe base dialog_hosted)"
          git checkout -- crates/halvo-coord-app
          build head
          g=$(exe head guard_hosted); d=$(exe head dialog_hosted)
          one head-guard-forced env HALVO_HOSTED_LATE_RUN_MS=2000 "$g"
          one head-dialog-forced env HALVO_HOSTED_LATE_RUN_MS=2000 "$d"
          one head-guard-plain "$g"
          one head-guard-past-the-bound env HALVO_HOSTED_LATE_RUN_MS=12000 "$g"
          one head-dialog-past-the-bound env HALVO_HOSTED_LATE_RUN_MS=12000 "$d"
          one head-guard-bad-setting env HALVO_HOSTED_LATE_RUN_MS=abc "$g"
          one head-dialog-bad-setting env HALVO_HOSTED_LATE_RUN_MS=abc "$d"
          echo "r455 forced step done; tracked files changed $(git status --porcelain --untracked-files=no | wc -l | tr -d ' ')"
      - name: r4-55 the head's loop of guard_hosted
        if: always()
        timeout-minutes: 75
        shell: bash
        run: |
          set +e
          cargo test -p halvo-coord-app --locked --no-run --message-format=json --test guard_hosted > "$RUNNER_TEMP/r455-loop-build.json" 2> "$RUNNER_TEMP/r455-loop-build.err"
          echo "r455 loop build exit=$?; tracked files changed $(git status --porcelain --untracked-files=no | wc -l | tr -d ' ')"
          g=$(grep -o '"executable":"[^"]*"' "$RUNNER_TEMP/r455-loop-build.json" | sed 's/"executable":"//; s/"$//' | grep '/deps/guard_hosted-' | head -1)
          n=120; i=0; hits=0; noreport=0; passed=0
          mkdir -p "$RUNNER_TEMP/r455-loop-a" "$RUNNER_TEMP/r455-loop-b" "$RUNNER_TEMP/r455-loop-raw"
          while [ "$i" -lt "$n" ]; do
            i=$((i + 1))
            half=a; [ "$i" -gt 60 ] && half=b
            name=run-$(printf %03d "$i").txt
            start=$(date +%s)
            env -u HALVO_HOSTED_LATE_RUN_MS GUARD_HOSTED_SCHEDULE=loop "$g" > "$RUNNER_TEMP/r455-loop-raw/$name" 2>&1
            code=$?
            took=$(( $(date +%s) - start ))
            f="$RUNNER_TEMP/r455-loop-$half/$name"
            tr -d '\r' < "$RUNNER_TEMP/r455-loop-raw/$name" > "$f"
            if grep -q '^guard_hosted reading macos reject_action_at_100ms: the show returned after [0-9]* ms with no report and answered reject$' "$f"; then
              hits=$((hits + 1))
              echo "r455 loop run $i HIT; its lines:"
              sed "s/^/r455 loop run $i: /" "$f"
            elif grep -q 'the show returned after [0-9]* ms with no report' "$f"; then
              noreport=$((noreport + 1))
              echo "r455 loop run $i: a later case's show returned with no report; its lines:"
              sed "s/^/r455 loop run $i: /" "$f"
            fi
            grep -q '^guard_hosted end: cases ran 7 of 7, failed 0, schedule slipped 0, helped 0, moments at a press 0, retries [0-9]*, reports before visible 0$' "$f" && passed=$((passed + 1))
            echo "r455 loop run $i exit=$code seconds=$took | $(grep '^guard_hosted start: ' "$f" | head -1) | $(grep '^guard_hosted end: ' "$f")"
          done
          echo "hits $hits of $n"
          echo "r455 loop: runs $n; first-case hits $hits; runs with a later show that returned with no report $noreport; runs whose end line reads 7 of 7, failed 0, schedule slipped 0 $passed"
          for half in a b; do
            GUARD_HOSTED_TALLY="$RUNNER_TEMP/r455-loop-$half" "$g" > "$RUNNER_TEMP/r455-tally-$half.txt" 2>&1
            echo "r455 tally of runs $half (60 runs) exit=$?"
            tr -d '\r' < "$RUNNER_TEMP/r455-tally-$half.txt" | grep -v '^guard_hosted loop run [0-9]*: ' | sed "s/^/r455 tally $half: /"
          done
          [ "$hits" = 0 ]
      - name: r4-55 changed copies of lines that only a hosted run reaches
        if: always()
        timeout-minutes: 60
        shell: bash
        run: |
          set +e
          verdict() {
            target=$1; want=$2; code=$3; f=$4
            count=7; [ "$target" = dialog_hosted ] && count=4
            cases=$(grep -c "^$target case " "$f")
            ends=$(grep -c "^$target end: " "$f")
            case $want in
              pass) grep -q "^$target end: cases ran $count of $count, failed 0" "$f" && [ "$code" = 0 ] ;;
              bound) grep -q "^$target start FAIL: the test runtime's run loop gave no sign that it runs within 10 s" "$f" && [ "$code" = 1 ] && [ "$cases" = 0 ] && [ "$ends" = 0 ] ;;
              refusal) grep -q "^$target start FAIL: HALVO_HOSTED_LATE_RUN_MS is set and is not" "$f" && [ "$code" = 1 ] && [ "$cases" = 0 ] && [ "$ends" = 0 ] ;;
              *) return 2 ;;
            esac
          }
          row() {
            id=$1; file=$2; target=$3; setting=$4; want=$5; change=$6
            path=crates/halvo-coord-app/tests/$file
            perl -0pi -e "$change" "$path"
            if git diff --quiet -- "$path"; then echo "r455 row $id applied=no"; return; fi
            echo "r455 row $id changed lines: $(git diff --numstat -- "$path" | cut -f1,2 | tr '\t' ' ')"
            cargo test -p halvo-coord-app --locked --no-run --message-format=json --test "$target" > "$RUNNER_TEMP/r455-row.json" 2> "$RUNNER_TEMP/r455-row.err"
            built=$?
            exe=$(grep -o '"executable":"[^"]*"' "$RUNNER_TEMP/r455-row.json" | sed 's/"executable":"//; s/"$//' | grep "/deps/$target-" | head -1)
            if [ "$built" != 0 ] || [ -z "$exe" ]; then
              echo "r455 row $id applied=yes built=no: RED (does not compile)"
              grep -m 3 '^error' "$RUNNER_TEMP/r455-row.err" | sed "s/^/r455 row $id: /"
              git checkout -- "$path"
              return
            fi
            if [ "$setting" = none ]; then
              env -u HALVO_HOSTED_LATE_RUN_MS "$exe" > "$RUNNER_TEMP/r455-row.raw" 2>&1
            else
              env HALVO_HOSTED_LATE_RUN_MS="$setting" "$exe" > "$RUNNER_TEMP/r455-row.raw" 2>&1
            fi
            code=$?
            tr -d '\r' < "$RUNNER_TEMP/r455-row.raw" > "$RUNNER_TEMP/r455-row.txt"
            if verdict "$target" "$want" "$code" "$RUNNER_TEMP/r455-row.txt"; then word="GREEN (the change survived)"; else word="RED (the change is caught)"; fi
            echo "r455 row $id applied=yes setting=$setting the head gives=$want exit=$code: $word"
            grep -E "^$target (start|forced|end:|case .* FAIL|watchdog|reading .*no report)" "$RUNNER_TEMP/r455-row.txt" | head -12 | sed "s/^/r455 row $id: /"
            git checkout -- "$path"
          }
          for t in guard dialog; do
            f=${t}_hosted.rs; target=${t}_hosted; p=$(printf %s "$t" | cut -c1 | tr gd GD)
            row "$p"1-no-wait "$f" "$target" 2000 pass 's/\|bound\| runs\.recv_timeout\(bound\)\.is_ok\(\),/|bound| { let _ = (&runs, bound); true },/'
            row "$p"2-no-sign "$f" "$target" none pass 's/let _ = ready\.send\(\(\)\);/let _ = &ready;/'
            row "$p"3-ready-read-as-exit "$f" "$target" none pass 's/if let tauri::RunEvent::Ready = event \{/if let tauri::RunEvent::Exit = event {/'
            row "$p"4-no-bound "$f" "$target" 2000 pass 's/(\|\| start\.elapsed\(\),\s+)super::activation::RUN_LOOP_BOUND,/${1}std::time::Duration::ZERO,/'
            row "$p"5-cases-at-the-bound "$f" "$target" 12000 bound 's/(if !go \{\s+)std::process::exit\(1\);/${1}let _ = 1;/'
            row "$p"6-no-case-after-the-sign "$f" "$target" none pass 's/if !go \{/if go {/'
            row "$p"7-setting-not-read "$f" "$target" 12000 bound 's/late\(std::env::var_os\(super::activation::LATE\)\.as_deref\(\)\)/late(None)/'
            row "$p"8-no-hold "$f" "$target" 12000 bound 's/std::thread::sleep\(late\);/let _ = late;/'
            row "$p"9-refusal-goes-on "$f" "$target" abc refusal 's/(Err\(line\) => \{\s+println!\("[a-z_]+ \{line\}"\);\s+)std::process::exit\(1\);/${1}None/'
          done
          echo "r455 rows done; tracked files changed $(git status --porcelain --untracked-files=no | wc -l | tr -d ' ')"
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default -c core.fileMode=true "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-macos
          path: target/ci-artifacts/

  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Prerequisites
        shell: bash
        run: sh scripts/prerequisites.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: ${{ github.event_name == 'schedule' && 'v0-rust-cold' || 'v0-rust' }}
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' }}
      - name: ci.d self-test
        shell: bash
        env:
          GIT_AUTHOR_NAME: Halvo CI
          GIT_AUTHOR_EMAIL: ci@halvo.invalid
          GIT_COMMITTER_NAME: Halvo CI
          GIT_COMMITTER_EMAIL: ci@halvo.invalid
        run: sh scripts/ci/run-ci-d.sh windows --self-test 46-r4-dialog-ran
      - name: Processor
        shell: bash
        run: |
          printf 'processor: %s; identifier: %s; processors: %s\n' "$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor | Select-Object -First 1).Name' 2>/dev/null | tr -d '\r' || printf unknown)" "${PROCESSOR_IDENTIFIER:-unknown}" "${NUMBER_OF_PROCESSORS:-unknown}"
      - name: ci.d
        shell: bash
        run: sh scripts/ci/run-ci-d.sh windows 10-format 11-clippy 12-test 46-r4-dialog-ran
      - name: r4-55 seconds of one run of guard_hosted at the head and at the base
        if: always()
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          build() {
            cargo test -p halvo-coord-app --locked --no-run --message-format=json --test guard_hosted > "$RUNNER_TEMP/r455-build-$1.json" 2> "$RUNNER_TEMP/r455-build-$1.err"
            echo "r455 build $1 exit=$?; tracked files changed $(git status --porcelain --untracked-files=no | wc -l | tr -d ' ')"
          }
          exe() { grep -o '"executable":"[^"]*"' "$RUNNER_TEMP/r455-build-$1.json" | sed 's/"executable":"//; s/"$//; s/\\\\/\//g' | grep '/deps/guard_hosted-' | head -1; }
          one() {
            label=$1; shift
            start=$(date +%s)
            "$@" > "$RUNNER_TEMP/r455-$label.raw" 2>&1
            code=$?
            took=$(( $(date +%s) - start ))
            tr -d '\r' < "$RUNNER_TEMP/r455-$label.raw" > "$RUNNER_TEMP/r455-$label.txt"
            echo "r455 run $label exit=$code seconds=$took; end: $(grep '^guard_hosted end: ' "$RUNNER_TEMP/r455-$label.txt")"
            grep -E '^guard_hosted (case|end|start)' "$RUNNER_TEMP/r455-$label.txt" | sed "s/^/r455 $label: /"
          }
          build head
          one head-guard-plain "$(exe head)"
          cp scratch-r455/pristine-guard_hosted.rs crates/halvo-coord-app/tests/guard_hosted.rs
          cp scratch-r455/pristine-activation.rs crates/halvo-coord-app/tests/hosted/activation.rs
          build base
          one base-guard-plain "$(exe base)"
          git checkout -- crates/halvo-coord-app
          echo "r455 windows step done; tracked files changed $(git status --porcelain --untracked-files=no | wc -l | tr -d ' ')"
      - name: Scripts and hook in a core.autocrlf=true clone
        shell: bash
        run: |
          clone="$RUNNER_TEMP/halvo-autocrlf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone --quiet -c core.autocrlf=true "$GITHUB_WORKSPACE" "$clone"
          cd "$clone"
          line_endings=$(git ls-files --eol | awk -F '\t' '$1 ~ /eol=lf/ || $2 ~ /\.sh$/ || index($2, ".githooks/") == 1 || $2 == "docs/baseline/r1-gate-bounds.txt" || $2 ~ /(^|\/)mutants\.(rows|expected)$/')
          echo "$line_endings"
          test -n "$line_endings"
          crlf_files=$(echo "$line_endings" | awk '$2 == "w/crlf" || $2 == "w/mixed"')
          if [ -n "$crlf_files" ]; then
            echo "git checked out these files with CRLF:"
            echo "$crlf_files"
            echo "Fix: .gitattributes has to hold the lines '*.sh text eol=lf' and '.githooks/** text eol=lf' and 'docs/baseline/r1-gate-bounds.txt text eol=lf' and 'mutants.rows text eol=lf' and 'mutants.expected text eol=lf' and '/scripts/r3/egress/fixtures.txt text eol=lf' and 'src-tauri/windows-tests.manifest text eol=lf', and no later line may take eol=lf from these files."
            exit 1
          fi
          sh scripts/check-commit-messages.sh --self-test
          sh scripts/check-changelog.sh --self-test
          sh scripts/check-line-endings.sh --self-test
          git config core.hooksPath .githooks
          git config user.name "Halvo CI"
          git config user.email "ci@halvo.invalid"
          git commit --quiet --allow-empty -m "Probe the commit-msg hook with a clean message"
          if refusal=$(git commit --quiet --allow-empty -m "Probe the commit-msg hook with a trailer" -m "Co-Authored-By: Probe <probe@halvo.invalid>" 2>&1); then
            echo "The commit-msg hook accepted a message with an attribution trailer."
            exit 1
          fi
          echo "$refusal"
          case "$refusal" in
            *"Co-Authored-By: Probe"*) ;;
            *) echo "git refused the commit, but the hook did not report the trailer."; exit 1 ;;
          esac
      - name: Lockfile unchanged
        shell: bash
        run: |
          for name in $(env | sed -n 's/^\(GIT_[A-Za-z0-9_]*\)=.*/\1/p'); do
            unset "$name"
          done
          in_checkout() {
            git --no-replace-objects --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE" -c core.fsmonitor=false -c core.trustctime=true -c core.checkStat=default "$@"
          }
          head=$(in_checkout rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD is not the commit of this run: a step or a check moved HEAD of the checkout."
            exit 1
          fi
          changed=$(in_checkout status --porcelain --untracked-files=no --ignore-submodules=none)
          untracked=$(in_checkout ls-files --others --exclude-per-directory=.gitignore)
          flagged=$(in_checkout ls-files -v | awk '!/^H /')
          hidden=$(in_checkout status --porcelain --ignored --untracked-files=normal | sed -n 's/^!! //p' | while IFS= read -r entry; do
            source=$(in_checkout check-ignore -v --no-index -- "$entry") || { echo "$entry"; continue; }
            in_checkout ls-files --error-unmatch -- "${source%%:*}" >/dev/null 2>&1 || echo "$entry"
          done)
          if [ -n "$changed$untracked$flagged$hidden" ]; then
            printf '%s\n' "$changed" "$untracked" "$flagged" "$hidden" | sed '/^$/d'
            echo "A step or a check changed these files of the checkout, left them untracked and not ignored by a tracked .gitignore, or hid them by an index flag. A check builds with --locked and writes only under target/ and its temporary directory. On the windows job a file that differs by its line endings alone needs an eol attribute in .gitattributes."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-artifacts-windows
          path: target/ci-artifacts/
