# cargo-release settings. Reference:
# https://github.com/crate-ci/cargo-release/blob/v1.1.7/docs/reference.md
# cargo-release is a dry run by default; `--execute` performs the release.
publish = false
push = false
tag-name = "v{{version}}"
pre-release-commit-message = "Release {{version}}"
tag-message = "Release {{version}}"
pre-release-replacements = [
  { file = "../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
