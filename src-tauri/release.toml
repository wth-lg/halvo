tag = true
pre-release-replacements = [
  { file = "../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  { file = "../README.md", search = "which is `[0-9]+\\.[0-9]+\\.[0-9]+` now", replace = "which is `{{version}}` now", exactly = 1 },
]
pre-release-hook = ["sh", "-c", "exec sh \"$WORKSPACE_ROOT/scripts/release.sh\" --group-changelog"]
