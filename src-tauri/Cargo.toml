[package]
name = "halvo"
version.workspace = true
description = "Halvo desktop app"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
halvo-control = { path = "../crates/halvo-control" }

[dev-dependencies]
tauri = { version = "2", features = ["test", "unstable"] }
serde_json = "1"
halvo-control = { path = "../crates/halvo-control", features = ["test-support"] }
