[package]
name = "halvo"
version.workspace = true
description = "Halvo desktop app"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
halvo-control = { path = "../crates/halvo-control", features = ["r2"] }
halvo-coord = { path = "../crates/halvo-coord" }
halvo-coord-app = { path = "../crates/halvo-coord-app" }
halvo-schema-core = { path = "../crates/halvo-schema-core" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSString", "NSURL", "NSURLRequest"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKContentRuleList", "WKContentRuleListStore", "WKContentWorld", "WKFrameInfo", "WKNavigationAction", "WKNavigationDelegate", "WKPreferences", "WKUserContentController", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }
block2 = "0.6.2"

[dev-dependencies]
tauri = { version = "2", features = ["test", "unstable"] }
halvo-control = { path = "../crates/halvo-control", features = ["test-support"] }
halvo-test-dir = { path = "../crates/halvo-test-dir" }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
