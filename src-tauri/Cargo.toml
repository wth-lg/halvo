[package]
name = "halvo"
version.workspace = true
description = "Halvo desktop app"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
halvo-capture = { path = "../crates/halvo-capture" }

[dev-dependencies]
tauri = { version = "2", features = ["test", "unstable"] }
serde_json = "1"
