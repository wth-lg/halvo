[package]
name = "halvo"
version = "0.0.0"
description = "Halvo desktop app"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
halvo-capture = { path = "../crates/halvo-capture" }
