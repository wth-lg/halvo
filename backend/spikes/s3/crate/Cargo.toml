[package]
name = "s3-typify-scratch"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
jsonschema = { version = "=0.61.0", default-features = false }
regress = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }

[build-dependencies]
prettyplease = "0.2"
schemars = "0.8"
serde_json = "1"
syn = { version = "2", features = ["full"] }
typify = "=0.8.0"
