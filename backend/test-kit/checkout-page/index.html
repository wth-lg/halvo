<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout (local stand-in)</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 26rem; padding: 0 1rem; }
      label { display: block; }
      input:not([type="checkbox"]), select { display: block; font: inherit; padding: 0.4rem; width: 100%; box-sizing: border-box; }
      button { font: inherit; padding: 0.5rem 1rem; }
      .note { color: #555; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Subscribe to Halvo</h1>
      <p class="note">A local stand-in for the provider's hosted checkout page. Nothing typed here leaves this machine.</p>
      <form id="checkout" novalidate></form>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="/page.js"></script>
  </body>
</html>
