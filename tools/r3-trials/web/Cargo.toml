[package]
name = "r3-web"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "r3_web"
path = "src/lib.rs"

[[bin]]
name = "web-trial"
path = "src/bin/web-trial.rs"

[features]
default = ["driver", "port-control"]
driver = ["dep:base64", "dep:chromiumoxide", "dep:futures", "dep:tokio"]
port-control = ["driver"]

[dependencies]
base64 = { version = "=0.22.1", optional = true }
chromiumoxide = { version = "=0.9.1", default-features = false, optional = true }
futures = { version = "0.3", optional = true }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "signal", "net", "io-util"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_System_SystemInformation", "Wdk_System_Threading", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Pipes", "Win32_System_Threading"] }

[profile.release]
strip = true
