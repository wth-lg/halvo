[package]
name = "r3-web"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "r3_web"
path = "src/lib.rs"

[[bin]]
name = "web-trial"
path = "src/bin/web-trial.rs"

[features]
default = ["driver"]
driver = ["dep:base64", "dep:chromiumoxide", "dep:futures", "dep:tokio"]

[dependencies]
base64 = { version = "=0.22.1", optional = true }
chromiumoxide = { version = "=0.9.1", default-features = false, optional = true }
futures = { version = "0.3", optional = true }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"], optional = true }

[profile.release]
strip = true
