[package]
name = "r3-model"
version = "0.0.0"
description = "Halvo R3 trial U0.5: the first form of the model child, one 4-bit GGUF model on llama.cpp on the CPU"
edition = "2021"
publish = false

[workspace]

[dependencies]
halvo-cap = { path = "../../../crates/halvo-cap" }
llama-cpp-2 = { version = "=0.1.161", default-features = false }
llama-cpp-sys-2 = { version = "=0.1.161", default-features = false }
toml = { version = "=1.2.1", default-features = false, features = ["std", "parse", "serde"] }
