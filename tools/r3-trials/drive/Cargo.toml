[package]
name = "r3-drive"
version = "0.0.0"
description = "Halvo R3 trial U0.6: a small model drives the fixture's bill and order pages and writes reply bodies"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "r3-drive"
path = "src/main.rs"

[dependencies]
chromiumoxide = { version = "=0.9.1", default-features = false }
halvo-cap = { path = "../../../crates/halvo-cap" }
halvo-route = { path = "../../../crates/halvo-route" }
halvo-route-wire = { path = "../../../crates/halvo-route-wire" }
halvo-schema = { path = "../../../crates/halvo-schema" }
icu_properties = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
r3-web = { path = "../web" }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt", "macros", "time", "sync", "signal"] }

[dev-dependencies]
r3-web = { path = "../web", default-features = false, features = ["test-fence"] }

[profile.release]
strip = true
