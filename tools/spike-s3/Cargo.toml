[package]
name = "spike-s3"
version = "0.0.0"
description = "Spike S3 of run 20261108-halvo-r1-capture: password-field detection on the hosted Windows runner. Never merged."
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "spike-s3"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
