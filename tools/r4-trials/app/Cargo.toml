[package]
name = "r4-trial-app"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "r4_trial_app"
path = "src/lib.rs"

[[bin]]
name = "r4-trial-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = "=0.62.2"
