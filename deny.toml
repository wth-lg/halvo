[graph]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2026-0502", reason = "2026-11-12: sqlcipher-src 419.0.6 bundles SQLite 3.53.4; the fix is sqlcipher-src 420.0.0, which needs a libsqlite3-sys release that the store stream adopts; the store opens only files in a 0700 directory of its own user. Remove this entry with that upgrade." },
]

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.8
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
  { crate = "sqlcipher-src", allow = ["blessing", "WTFPL"] },
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
