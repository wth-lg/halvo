[graph]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "0BSD", "Unlicense", "CC0-1.0", "BSL-1.0", "Unicode-3.0", "Unicode-DFS-2016", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
  # reason: MPL-2.0 is file-level copyleft, and Halvo ships these crates unmodified with their notices; the owner confirms the entry (units/gate-2.md, owner ask)
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
  # reason: blessing is the public-domain dedication of SQLite and WTFPL covers one bundled file; neither asks anything of a binary that ships them
  { crate = "sqlcipher-src", allow = ["blessing", "WTFPL"] },
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
