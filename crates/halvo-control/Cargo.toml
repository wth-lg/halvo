[package]
name = "halvo-control"
version = "0.0.0"
description = "Halvo control types shared by the app and the capture daemon: the stored model, onboarding, the data directory and the start registrations"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
