[package]
name = "halvo-sheet"
version = "0.0.0"
description = "The sheet executor: reads cells and a source file, prepares a changed copy of a workbook beside it with a checkpoint, replaces the workbook in one rename, and refuses a workbook that it cannot carry"
edition = "2021"
publish = false

[dependencies]
calamine = "=0.38.0"
codepage = "=0.1.3"
encoding_rs = "=0.8.44"
halvo-checkpoint = { path = "../halvo-checkpoint" }
quick-xml = { version = "=0.42.0", default-features = false }
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Globalization"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "=0.8.7"

[dev-dependencies]
halvo-test-dir = { path = "../halvo-test-dir" }
