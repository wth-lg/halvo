[package]
name = "halvo-coord-app"
version = "0.0.0"
description = "Halvo coordinator in the app: the page's commands, the waiting call, the tray count and the hooks of the app's start, hide and quit, generic over the Tauri runtime"
edition = "2021"
publish = false

[dependencies]
halvo-coord = { path = "../halvo-coord" }
serde = "1.0.229"
serde_json = "1.0.154"
tauri = { version = "=2.12.5", default-features = false }

[dev-dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["test"] }

[features]
scripted = []

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", features = ["NSString"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSAlert", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow", "NSApplication", "NSRunningApplication"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[[test]]
name = "dialog_hosted"
path = "tests/dialog_hosted.rs"
harness = false
