[package]
name = "halvo-learn-gate"
version = "0.0.0"
description = "Halvo learning: the gate host learn-gate, which plays scripted cases through the learning handlers on a store in memory or on the encrypted derived store"
edition = "2021"
publish = false

[[bin]]
name = "learn-gate"
path = "src/main.rs"

[dependencies]
halvo-agent-store = { path = "../halvo-agent-store" }
halvo-derived = { path = "../halvo-derived" }
halvo-learn = { path = "../halvo-learn" }
halvo-learn-store = { path = "../halvo-learn-store" }
halvo-policy = { path = "../halvo-policy" }
halvo-schema = { path = "../halvo-schema" }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
halvo-test-dir = { path = "../halvo-test-dir" }
