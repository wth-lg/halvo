[package]
name = "halvo-learn-gate"
version = "0.0.0"
description = "Halvo learning: the gate host learn-gate, which plays scripted cases through the learning handlers on a store in memory"
edition = "2021"
publish = false

[[bin]]
name = "learn-gate"
path = "src/main.rs"

[dependencies]
halvo-agent-store = { path = "../halvo-agent-store" }
halvo-learn = { path = "../halvo-learn" }
halvo-learn-store = { path = "../halvo-learn-store" }
halvo-policy = { path = "../halvo-policy" }
halvo-schema = { path = "../halvo-schema" }
serde_json = "1"
