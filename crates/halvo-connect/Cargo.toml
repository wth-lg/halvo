[package]
name = "halvo-connect"
version = "0.0.0"
edition = "2021"
publish = false

[features]
loopback = []

[dependencies]
halvo-schema = { path = "../halvo-schema" }
halvo-route = { path = "../halvo-route" }
halvo-route-wire = { path = "../halvo-route-wire" }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
serde_json = "1"

[dev-dependencies]
halvo-connect = { path = ".", features = ["loopback"] }
