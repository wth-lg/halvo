[package]
name = "halvo-capture"
version = "0.0.0"
description = "Halvo always-on capture pipeline: shared types, traits and the daemon skeleton"
edition = "2021"
publish = false

[dependencies]
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
