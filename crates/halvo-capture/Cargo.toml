[package]
name = "halvo-capture"
version = "0.0.0"
description = "Halvo always-on capture pipeline: shared types, traits and the daemon skeleton"
edition = "2021"
publish = false

[features]
# The release macOS custody (Secure Enclave) needs a Developer ID signed bundle to
# persist its key (researcher-2, OSStatus -34018). It is compiled behind this
# feature, off by default, and its tests are gated off; R1 builds and tests the
# dev-fallback custody only.
secure-enclave = []

[dependencies]
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled-sqlcipher-vendored-openssl"] }
chacha20poly1305 = "0.11"
aead = { version = "0.6", features = ["alloc"] }
aead-stream = { version = "0.6", features = ["alloc"] }
getrandom = "0.2"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
# OSX_10_15 exposes Location::DataProtectionKeychain, which the Secure Enclave
# release custody needs (researcher-2 learning); the dev fallback uses only the
# passwords module and is unaffected.
security-framework = { version = "3", features = ["OSX_10_15"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile = "3"
