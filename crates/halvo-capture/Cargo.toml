[package]
name = "halvo-capture"
version.workspace = true
description = "Halvo always-on capture pipeline: shared types, traits and the daemon skeleton"
edition = "2021"
publish = false

[features]
secure-enclave = []
r2 = []

[dependencies]
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
halvo-sqlcipher = { path = "../halvo-sqlcipher" }
halvo-control = { path = "../halvo-control" }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
aead = { version = "0.6", features = ["alloc"] }
aead-stream = { version = "0.6", features = ["alloc"] }
getrandom = "0.2"
base64 = "0.22"
psl = "=2.1.246"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSArray",
    "NSError",
    "NSEnumerator",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSRunningApplication",
] }
objc2-screen-capture-kit = { version = "0.3", features = [
    "SCStream",
    "SCShareableContent",
    "block2",
    "dispatch2",
    "std",
    "alloc",
] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer"] }
core-graphics = "0.25"
core-foundation = "0.10"
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Foundation",
] }
windows-capture = "2"
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[dev-dependencies]
proc-macro2 = { version = "1.0.107", default-features = false }
proptest = "1"
tempfile = "3"
