[package]
name = "halvo-account"
version = "0.0.0"
description = "The account helper: the app's one path to the backend and the one reader and writer of the account's credential"
edition = "2021"
publish = false

[features]
keychain = ["halvo-secrets/keychain"]

[dependencies]
getrandom = "=0.2.17"
halvo-secrets = { path = "../halvo-secrets" }
halvo-wire = { path = "../halvo-wire" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "blocking"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
