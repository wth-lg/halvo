[package]
name = "halvo-secrets"
version = "0.0.0"
description = "Where the account helper keeps its one secret: the Keychain or a file of mode 0600 on macOS, DPAPI in user scope on Windows"
edition = "2021"
publish = false

[features]
keychain = ["dep:security-framework"]

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false, optional = true }
