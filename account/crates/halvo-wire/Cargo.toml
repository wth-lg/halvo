[package]
name = "halvo-wire"
version = "0.0.0"
description = "The wire contract of the account helper: the types generated from the vendored schema, the bounds that the schema states and the request builder"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
prettyplease = "0.2"
schemars = "0.8"
syn = { version = "2", features = ["full"] }
typify = { version = "=0.8.0", default-features = false }
